<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m8-f14",CARTOES=[{"t":"ler","titulo":"A história de uma tigela","rot":"Abre","html":"<figure class=\"fig documento\"><a href=\"../../img/fontes/licoes-20261101/amaral.jpg\" aria-label=\"Abrir a imagem inteira\"><img src=\"../../img/fontes/licoes-20261101/amaral.jpg\" alt=\"Ana Luísa Amaral fotografada na Feira do Livro de Gotemburgo, com um lenço coral.\"><\/a><details class=\"info-i info-i--linha\" name=\"info-i\"><summary aria-label=\"Créditos da imagem\"><span aria-hidden=\"true\">i<\/span><\/summary><div class=\"info-i-texto\"><p>CC BY-SA 3.0; <a href=\"https://commons.wikimedia.org/wiki/File:Ana_Lu%C3%ADsa_Amaral_at_G%C3%B6teborg_Book_Fair_2013_01.JPG\">Fonte ↗<\/a><\/p><table><caption>Identificação do documento visual<\/caption><tr><th scope=\"row\">Autor<\/th><td>Mattias Blomgren<\/td><\/tr><tr><th scope=\"row\">Obra<\/th><td>Ana Luísa Amaral na Feira do Livro de Gotemburgo<\/td><\/tr><tr><th scope=\"row\">Data<\/th><td>27 de setembro de 2013<\/td><\/tr><tr><th scope=\"row\">Instituição ou acervo<\/th><td>Wikimedia Commons, publicação do fotógrafo.<\/td><\/tr><tr><th scope=\"row\">Licença<\/th><td><a rel=\"license\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0<\/a><\/td><\/tr><\/table><p><a href=\"https://commons.wikimedia.org/wiki/File:Ana_Lu%C3%ADsa_Amaral_at_G%C3%B6teborg_Book_Fair_2013_01.JPG\">Consultar a fonte e os direitos ↗<\/a>. Reprodução redimensionada, sem recorte.<\/p><\/div><\/details><figcaption><p>Ana Luísa Amaral na Feira do Livro de Gotemburgo, em 2013.<\/p><\/figcaption><\/figure><p class=\"abre\"><strong>Quem decide o que merece entrar na história?<\/strong><\/p><p class=\"abre\">Uma tigela partida pode parecer um acontecimento pequeno. O que acontece quando o poema lhe dá a atenção reservada às grandes descobertas?<\/p><p>Já leste a abertura. Agora vais seguir a mudança de escala e distinguir um objeto, uma memória e o valor que lhes atribuímos.<\/p>"},{"t":"vf","p":"Antes de reler. Na F05, a referência à filha situava o acontecimento do poema na biografia da autora?","v":false,"f":"Confundir uma cena enunciada com um facto biográfico apaga a construção poética. Relê, na F05, a atribuição da voz e a abertura do poema: a relação familiar está no texto, mas a comprovação pede outra fonte.","g":"m8-f14-1","fe":"Tomas a relação familiar enunciada no poema por um dado da vida da autora. Regressa à F05, à leitura de «A verdade histórica»: localiza um indício «sem o tomares como episódio biográfico»."},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>Ana Luísa Amaral faz da vida quotidiana matéria de reflexão em «A verdade histórica». A voz que escreve também vive as exigências do espaço doméstico. Esse cruzamento não autoriza tratar cada acontecimento do poema como prova biográfica.<\/p><p>A <strong>ironia<\/strong> põe em tensão o que parece importante e aquilo que normalmente passa despercebido. A mudança de escala entre uma casa e a história pode tornar visíveis critérios de valor.<\/p>"},{"t":"ler","titulo":"Uma ocorrência doméstica","rot":"Lê de perto","html":"<blockquote>«A minha filha partiu uma tigela<br>na cozinha.<br>E eu que me apetecia escrever<br>sobre o evento,»<\/blockquote><p>Ana Luísa Amaral, «A verdade histórica», em <i>PÁ: Poesia &amp; Outras Artes<\/i>, n.º 0, Casa Comum/U.Porto Press, setembro de 2023, pp. 14–15. Publicação com autorização da Assírio &amp; Alvim, identificada nos créditos.<\/p><p><a href=\"https://www.up.pt/casacomum/wp-content/uploads/sites/520/2023/11/pa_versao_final-1.pdf#page=14\" target=\"_blank\" rel=\"noopener\">Lê o poema completo na publicação da U.Porto<\/a>. Segue a passagem do incidente doméstico à imaginação de um futuro distante.<\/p>"},{"t":"escolha","p":"Que contraste se abre nos quatro versos citados?","o":["O incidente doméstico torna-se matéria de escrita.","O incidente doméstico impede a vontade de escrever.","O incidente doméstico confirma uma memória pública."],"c":0,"f":"O desejo de escrever nasce do incidente. O poema dá atenção a um acontecimento que poderia ser descartado como insignificante.","g":"m8-f14-4","fe":["O desejo de escrever nasce do incidente. O poema dá atenção a um acontecimento que poderia ser descartado como insignificante.","Opões o incidente ao impulso de escrever, quando é ele que o desperta. Relê o que a voz tem vontade de fazer depois de a filha partir a tigela.","Transformas uma experiência doméstica em memória pública já confirmada. Relê a passagem da tigela para a escrita: o valor está a ser interrogado."]},{"t":"vf","p":"A referência à filha situa uma relação dentro do poema; confirmar o episódio na vida da autora exige outra fonte.","v":true,"f":"A relação familiar faz parte da cena enunciada. Para a transformar em informação biográfica é necessária uma fonte diferente do próprio poema.","g":"m8-f14-5","fe":"Recusas a distinção entre a cena do poema e a vida da autora. Relê, em «O essencial», que esse cruzamento «não autoriza tratar cada acontecimento do poema como prova biográfica»."},{"t":"emparelhar","p":"Liga cada plano à pergunta que o torna relevante.","pares":[["A tigela partida","Que acontecimento desencadeia a reflexão?"],["A vontade de escrever","Que experiência se transforma em linguagem?"],["A imaginação de um futuro distante","Que valor poderá ser atribuído ao objeto?"]],"f":"Os planos articulam acontecimento, criação e valor. Não são três assuntos independentes: cada um muda a leitura do anterior.","g":"m8-f14-6","fe":"Separas os três planos da passagem que os encadeia no poema. Relê «Uma ocorrência doméstica»: os versos vão da tigela partida à vontade de escrever, e a indicação de leitura leva até à imaginação de um futuro distante."},{"t":"ler","titulo":"Do fragmento ao valor","rot":"Para entender","html":"<p>No poema completo, a imaginação aproxima a tigela quotidiana de objetos a que o tempo e a história dão prestígio. A origem concreta e o uso banal impedem que essa aproximação se torne uma celebração solene.<\/p><p>Modelo: identificar uma mudança de escala, explicar o contraste e perguntar quem atribui valor. Não basta concluir que o poema trata de loiça.<\/p><p><strong>Modelo completo.<\/strong> O objeto parte-se na cozinha e desencadeia a vontade de escrever. O contraste faz do incidente matéria poética. A dimensão doméstica não o torna automaticamente um acontecimento público.<\/p>"},{"t":"completar","p":"Completa a interpretação da mudança de escala.","frase":"A passagem do doméstico ao histórico altera o [1] atribuído ao objeto, sem transformar a imaginação numa [2] arqueológica.","lacunas":[{"o":["valor","custo","ritmo"],"c":0},{"o":["prova","rasto","ruína"],"c":0}],"f":"A imaginação testa critérios de valor. Não documenta uma descoberta real nem muda fisicamente a tigela.","g":"m8-f14-8","fe":"Confundes o valor imaginado com uma mudança material ou com uma descoberta real. Relê, em «Do fragmento ao valor», a aproximação da tigela a objetos «a que o tempo e a história dão prestígio»."},{"t":"sublinhar","p":"Na frase criada, que palavra distingue uma hipótese sobre o futuro de uma descoberta já comprovada?","frase":"Talvez guardassem aquele fragmento.","certas":[0],"f":"«Talvez» marca uma hipótese. O exemplo é criado para treinar a diferença entre imaginar um destino e afirmar um facto.","g":"m8-f14-10","fe":"Escolhes a ação imaginada em vez da palavra que a apresenta como possibilidade. Relê a frase criada e procura o que impede de a ler como um facto comprovado."},{"t":"ordenar","p":"Ordena um percurso de interpretação, do acontecimento à pergunta crítica.","passos":["Localizar o incidente doméstico","Observar a mudança para um futuro imaginado","Comparar os valores atribuídos ao mesmo objeto","Questionar o que costuma merecer memória"],"f":"A pergunta crítica nasce do contraste construído no poema. Sem esse percurso, seria apenas uma opinião sobre a importância da história.","g":"m8-f14-9","fe":"Começas pela pergunta crítica sem o contraste que a faz nascer. Relê o modelo de «Do fragmento ao valor»: identificar uma mudança de escala, explicar o contraste e perguntar quem atribui valor."},{"t":"escolha","p":"Que leitura preserva a força crítica da mudança de escala?","o":["Interrogar o prestígio dado aos vestígios.","Transferir para a tigela o prestígio antigo.","Confirmar o prestígio pela idade do objeto."],"c":0,"f":"A comparação interroga critérios de prestígio. Não obriga a desprezar museus nem a atribuir o mesmo valor a todos os objetos.","g":"m8-f14-11","fe":["A comparação interroga critérios de prestígio. Não obriga a desprezar museus nem a atribuir o mesmo valor a todos os objetos.","Transferes um prestígio pronto em vez de examinar o critério. Confronta a tigela com os vestígios a que se atribui importância.","Confundes antiguidade com justificação de valor. Relê a diferença entre a resistência do material e a memória humana."]},{"t":"ler","titulo":"O que resiste?","rot":"Compara","html":"<p>O desfecho associa a resistência de um material banal ao destino dos fragmentos. Essa inversão permite perguntar se durar muito e merecer memória são a mesma coisa.<\/p><p>Não substituas esta pergunta por uma conclusão pronta. Regressa ao fim do poema e confronta o valor material, o valor afetivo e o valor histórico.<\/p><p>Contraexemplo a uma celebração solene do objeto: a sua origem e o seu uso quotidiano persistem no poema. Critério: a leitura da grandeza tem de explicar os sinais que a fazem descer de escala.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Distingue a mudança de valor imaginada de uma mudança material do objeto. A projeção no futuro é uma descoberta comprovada?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Distingue três critérios, sem os confundir.","pares":[["Resistir fisicamente durante muito tempo","Durabilidade material"],["Recordar uma relação ou um momento vivido","Valor afetivo"],["Ajudar a compreender uma sociedade","Valor histórico"]],"f":"Um objeto pode reunir vários valores, mas nenhum deles prova automaticamente os outros. A duração física não mede, por si só, importância humana.","g":"m8-f14-14","fe":"Fazes de um critério a medida dos outros dois. Relê, em «O que resiste?», a pergunta sobre se durar muito e merecer memória são a mesma coisa."},{"t":"vf","p":"Reconhecer a ironia exige explicar a aproximação entre o episódio doméstico e o prestígio dos vestígios.","v":true,"f":"A etiqueta «ironia» não demonstra a leitura. É preciso mostrar que expectativas de grandeza são aproximadas do episódio quotidiano e como essa aproximação as altera.","g":"m8-f14-12","fe":"Tratas o nome «ironia» como se bastasse para demonstrar a leitura. Relê, em «O essencial», a definição: a ironia põe em tensão o que parece importante e aquilo que normalmente passa despercebido."},{"t":"escolha","p":"Que proposta de exposição transfere melhor a pergunta do poema?","o":["Comparar objetos e explicar o efeito das suas legendas.","Comparar objetos e fazer do preço a medida das legendas.","Comparar objetos e deduzir da raridade o valor das legendas."],"c":0,"f":"A comparação obriga a explicitar critérios. A atividade não decide antecipadamente que um objeto merece mais atenção apenas pelo preço ou pela raridade.","g":"m8-f14-15","fe":["A comparação obriga a explicitar critérios. A atividade não decide antecipadamente que um objeto merece mais atenção apenas pelo preço ou pela raridade.","Confundes preço com o valor que a legenda deve justificar. Relê a distinção entre valor material, afetivo e histórico.","Confundes raridade com uma prova de importância humana. Relê os três critérios e procura a relação concreta que sustenta a legenda."]},{"t":"completar","p":"Completa uma conclusão que distingue duas formas de duração.","frase":"Um material pode durar sem conservar uma [1]; uma experiência breve pode tornar-se [2].","lacunas":[{"o":["memória","textura","grandeza"],"c":0},{"o":["memorável","duradoura","previsível"],"c":0}],"f":"A oposição separa persistência física e significado humano. É uma hipótese de leitura, não uma regra que classifica todos os objetos.","g":"m8-f14-16","fe":"Confundes persistência física com significado humano. Relê, em «O que resiste?», a associação entre a resistência de um material banal e o destino dos fragmentos."},{"t":"escolha","p":"Que comparação com outro poema evita uma conclusão apenas temática?","o":["Explicar como cada voz transforma um objeto em pergunta.","Explicar como o tema comum torna equivalentes as duas vozes.","Explicar como o mesmo objeto recebe um sentido já definido."],"c":0,"f":"Comparar a transformação de um objeto em pergunta relaciona forma e sentido. Um tema muito amplo não explica a singularidade de cada poema.","g":"m8-f14-18","fe":["Comparar a transformação de um objeto em pergunta relaciona forma e sentido. Um tema muito amplo não explica a singularidade de cada poema.","Confundes tema comum com equivalência das vozes. Regressa ao modo como cada voz transforma o objeto em pergunta.","Pressupões um sentido fixo antes de comparar os textos. Regressa às relações que cada poema constrói em torno do objeto."]},{"t":"ordenar","p":"Ordena a transformação do incidente numa reflexão sobre valor e história.","passos":["Um incidente doméstico chama a atenção da voz","O desejo de escrever transforma-o em matéria poética","O futuro imaginado altera a escala do valor","O uso quotidiano impede uma grandeza sem contraste"],"f":"A tigela passa do incidente à escrita e à pergunta sobre a memória. A duração do material não decide o valor humano que a legenda precisa de justificar.","g":"m8-f14-17","fe":"Trocas a ordem entre o incidente, a escrita e a mudança de escala. Relê o modelo completo de «Do fragmento ao valor»: o objeto parte-se na cozinha e desencadeia a vontade de escrever."},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Quem decide o que merece entrar na história?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
