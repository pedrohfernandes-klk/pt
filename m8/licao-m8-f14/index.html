window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m8-f14",CARTOES=[{"t":"ler","titulo":"A história de uma tigela","rot":"Abre","html":"<p class=\"abre\">Uma tigela partida pode parecer um acontecimento pequeno. O que acontece quando o poema lhe dá a atenção reservada às grandes descobertas?<\/p><p>Já leste a abertura. Agora vais seguir a mudança de escala e distinguir um objeto, uma memória e o valor que lhes atribuímos.<\/p>"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>Ana Luísa Amaral faz da vida quotidiana matéria de reflexão em «A verdade histórica». A voz que escreve também vive as exigências do espaço doméstico. Esse cruzamento não autoriza tratar cada acontecimento do poema como prova biográfica.<\/p><p>A <strong>ironia<\/strong> põe em tensão o que parece importante e aquilo que normalmente passa despercebido. A mudança de escala entre uma casa e a história pode tornar visíveis critérios de valor.<\/p>"},{"t":"ler","titulo":"Uma ocorrência doméstica","rot":"Lê e confronta","html":"<blockquote>«A minha filha partiu uma tigela<br>na cozinha.<br>E eu que me apetecia escrever<br>sobre o evento,»<\/blockquote><p>Ana Luísa Amaral, «A verdade histórica», em <i>PÁ: Poesia &amp; Outras Artes<\/i>, n.º 0, Casa Comum/U.Porto Press, setembro de 2023, pp. 14–15. Publicação com autorização da Assírio &amp; Alvim, identificada nos créditos.<\/p><p><a href=\"https://www.up.pt/casacomum/wp-content/uploads/sites/520/2023/11/pa_versao_final-1.pdf#page=14\" target=\"_blank\" rel=\"noopener\">Lê o poema completo na publicação da U.Porto<\/a>. Segue a passagem do incidente doméstico à imaginação de um futuro distante.<\/p>"},{"t":"escolha","p":"Que contraste se abre nos quatro versos citados?","o":["O incidente doméstico torna-se matéria de escrita.","Uma descoberta histórica dispensa a vida doméstica.","Uma notícia pública interrompe uma pesquisa antiga."],"c":0,"f":"O desejo de escrever nasce do incidente. O poema dá atenção a um acontecimento que poderia ser descartado como insignificante.","g":"m8-f14-3"},{"t":"vf","p":"A presença de uma filha no poema permite identificar o episódio como um acontecimento comprovado da vida da autora.","v":false,"f":"A relação familiar faz parte da cena enunciada. Para a transformar em informação biográfica é necessária uma fonte diferente do próprio poema.","g":"m8-f14-4"},{"t":"emparelhar","p":"Liga cada plano à pergunta que o torna relevante.","pares":[["A tigela partida","Que acontecimento desencadeia a reflexão?"],["A vontade de escrever","Que experiência se transforma em linguagem?"],["A imaginação de um futuro distante","Que valor poderá ser atribuído ao objeto?"]],"f":"Os planos articulam acontecimento, criação e valor. Não são três assuntos independentes: cada um muda a leitura do anterior.","g":"m8-f14-5"},{"t":"ler","titulo":"Do fragmento ao valor","rot":"Lê e confronta","html":"<p>No poema completo, a imaginação aproxima a tigela quotidiana de objetos a que o tempo e a história dão prestígio. A origem concreta e o uso banal impedem que essa aproximação se torne uma celebração solene.<\/p><p>Modelo: identificar uma mudança de escala, explicar o contraste e perguntar quem atribui valor. Não basta concluir que o poema trata de loiça.<\/p>"},{"t":"completar","p":"Completa a interpretação da mudança de escala.","frase":"A passagem do doméstico ao histórico altera o [1] atribuído ao objeto, sem transformar a imaginação numa [2] arqueológica.","lacunas":[{"o":["valor","custo","ritmo"],"c":0},{"o":["prova","rasto","ruína"],"c":0}],"f":"A imaginação testa critérios de valor. Não documenta uma descoberta real nem muda fisicamente a tigela.","g":"m8-f14-7"},{"t":"ordenar","p":"Ordena um percurso de interpretação, do acontecimento à pergunta crítica.","passos":["Localizar o incidente doméstico","Observar a mudança para um futuro imaginado","Comparar os valores atribuídos ao mesmo objeto","Questionar o que costuma merecer memória"],"f":"A pergunta crítica nasce do contraste construído no poema. Sem esse percurso, seria apenas uma opinião sobre a importância da história.","g":"m8-f14-8"},{"t":"sublinhar","p":"No exemplo didático criado, seleciona a palavra que apresenta uma possibilidade, não uma certeza.","frase":"Talvez guardassem aquele fragmento.","certas":[0],"f":"Talvez marca uma hipótese. O exemplo é criado para treinar a diferença entre imaginar um destino e afirmar um facto.","g":"m8-f14-9"},{"t":"escolha","p":"Que leitura preserva a força crítica da mudança de escala?","o":["Interrogar o prestígio dado aos vestígios.","Declarar sem valor qualquer objeto de museu.","Provar que toda a loiça se torna património."],"c":0,"f":"A comparação interroga critérios de prestígio. Não obriga a desprezar museus nem a atribuir o mesmo valor a todos os objetos.","g":"m8-f14-10"},{"t":"vf","p":"Reconhecer ironia dispensa explicar a relação entre os dois planos contrastados.","v":false,"f":"A etiqueta ironia não demonstra a leitura. É preciso mostrar que expectativas de grandeza são aproximadas do episódio quotidiano e como essa aproximação as altera.","g":"m8-f14-11"},{"t":"ler","titulo":"O que resiste?","rot":"Lê e confronta","html":"<p>O desfecho associa a resistência de um material banal ao destino dos fragmentos. Essa inversão permite perguntar se durar muito e merecer memória são a mesma coisa.<\/p><p>Não substituas esta pergunta por uma conclusão pronta. Regressa ao fim do poema e confronta o valor material, o valor afetivo e o valor histórico.<\/p>"},{"t":"emparelhar","p":"Distingue três critérios, sem os confundir.","pares":[["Resistir fisicamente durante muito tempo","Durabilidade material"],["Recordar uma relação ou um momento vivido","Valor afetivo"],["Ajudar a compreender uma sociedade","Valor histórico"]],"f":"Um objeto pode reunir vários valores, mas nenhum deles prova automaticamente os outros. A duração física não mede, por si só, importância humana.","g":"m8-f14-13"},{"t":"escolha","p":"Que proposta de exposição transfere melhor a pergunta do poema?","o":["Comparar um objeto banal e um prestigiado, explicando as legendas.","Ordenar objetos pelo seu preço, tomando o custo como valor absoluto.","Eliminar objetos correntes, reservando a memória aos mais raros."],"c":0,"f":"A comparação obriga a explicitar critérios. A atividade não decide antecipadamente que um objeto merece mais atenção apenas pelo preço ou pela raridade.","g":"m8-f14-14"},{"t":"completar","p":"Completa uma conclusão que distingue duas formas de duração.","frase":"Um material pode durar sem conservar uma [1]; uma experiência breve pode tornar-se [2].","lacunas":[{"o":["memória","textura","grandeza"],"c":0},{"o":["memorável","duradoura","previsível"],"c":0}],"f":"A oposição separa persistência física e significado humano. É uma hipótese de leitura, não uma regra que classifica todos os objetos.","g":"m8-f14-15"},{"t":"ordenar","p":"Organiza a preparação de uma legenda crítica para um objeto teu.","passos":["Descrever o objeto sem lhe atribuir prestígio","Identificar um uso ou uma relação concreta","Explicar por que merece atenção nesse contexto","Distinguir o que sabes do que imaginas"],"f":"A legenda parte do observável e torna explícita a atribuição de valor. A imaginação pode entrar, desde que não se apresente como informação comprovada.","g":"m8-f14-16"},{"t":"escolha","p":"Que comparação com outro poema evita uma conclusão apenas temática?","o":["Explicar como cada voz transforma um objeto em pergunta.","Enumerar os objetos, sem interpretar a presença de cada um.","Dizer que ambos falam da vida, sem indicar qualquer contraste."],"c":0,"f":"Comparar a transformação de um objeto em pergunta relaciona forma e sentido. Um tema muito amplo não explica a singularidade de cada poema.","g":"m8-f14-17"},{"t":"vf","p":"Uma legenda que atribui valor afetivo a um objeto deve explicar a relação que sustenta esse valor.","v":true,"f":"A ligação a uma experiência torna compreensível o valor afetivo. Sem a explicitar, a legenda apenas declara importância e não permite perceber o seu critério.","g":"m8-f14-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Durar, valer e merecer memória não são a mesma coisa.<\/p><p>Escolhe um objeto comum e propõe oralmente duas legendas: uma sobre o uso, outra sobre a memória. Explica o que mudaste e distingue informação de imaginação.<\/p>"}];
