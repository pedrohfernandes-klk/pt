<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m8-f15",CARTOES=[{"t":"ler","titulo":"A autora não é o poema","rot":"Abre","html":"<p class=\"abre\"><strong>Como usar uma reportagem sobre uma autora sem reduzir o poema à sua vida?<\/strong><\/p><p class=\"abre\">Saber mais sobre quem escreve pode abrir uma leitura. Também pode fechá-la cedo demais. Que informação ajuda e que conclusão vai além da prova?<\/p><p>Vais cruzar uma reportagem da RTP Ensina com as distinções que já usaste ao ler Ana Luísa Amaral.<\/p>"},{"t":"vf","p":"Antes de reler. Na F05, «Ana Luísa Amaral: reescrever a tradição», distinguir autora e voz poética permitia usar informação biográfica sem a tomar como prova do poema?","v":true,"f":"Confundir testemunho público e voz poética troca a natureza da fonte. Regressa a «Ana Luísa Amaral: reescrever a tradição»: a voz do poema é construída; uma declaração pública deve ser atribuída à pessoa e à ocasião em que foi feita.","g":"m8-f15-1","fe":"Lês a distinção entre autora e voz como uma proibição de usar a biografia. Regressa a «O essencial», na F05: a autora ensinou nas Letras do Porto, mas quem fala na prece é quem atravessa o mar."},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p><strong>Autora:<\/strong> pessoa real que escreve. <strong>Voz poética:<\/strong> instância construída no poema. <strong>Reportagem:<\/strong> seleção jornalística de informações, declarações e imagens.<\/p><p>Uma reportagem pode documentar uma declaração da autora. Não prova automaticamente que todas as vozes dos seus poemas dizem o que ela pensa em cada momento.<\/p>"},{"t":"ler","titulo":"Uma fonte, um âmbito","rot":"Lê de perto","html":"<p>A RTP Ensina apresenta Ana Luísa Amaral em «Ana Luísa Amaral, poesia atenta ao mundo». A página associa a sua escrita à atenção ao quotidiano e às desigualdades e apresenta o livro <i>Mundo<\/i>. O recurso audiovisual tem origem em <i>Nada Será Como Dante<\/i>, produção Até ao Fim do Mundo, 2021.<\/p><p><a href=\"https://ensina.rtp.pt/artigo/ana-luisa-amaral-poesia-atenta-ao-mundo/\" target=\"_blank\" rel=\"noopener\">Lê a página da RTP Ensina<\/a>. Procura uma informação sobre o trabalho de escrita e outra sobre o âmbito da reportagem. O texto da página basta para as atividades desta lição.<\/p><p>Não é uma reportagem sobre a origem de «A verdade histórica». Evita atribuir-lhe essa função.<\/p>"},{"t":"vf","p":"A primeira pessoa de um poema identifica a pessoa real que assina o livro.","v":false,"f":"Autoria e enunciação são planos diferentes. Uma pessoa real pode criar várias vozes, posições e situações que não coincidem com a sua experiência pessoal.","g":"m8-f15-5","fe":"Fazes coincidir quem assina o livro com quem fala no poema. Relê, em «O essencial», as definições de autora e de voz poética: pessoa real que escreve e instância construída no poema."},{"t":"escolha","p":"Que afirmação respeita o âmbito da fonte apresentada?","o":["A reportagem situa a atenção da autora ao mundo.","A reportagem identifica a autora com a voz de um poema.","A reportagem explica a origem doméstica de cada poema."],"c":0,"f":"A fonte oferece contexto sobre a autora e apresenta uma obra. A ligação a um poema específico exige observar esse poema e não presumir a sua origem.","g":"m8-f15-4","fe":["A fonte oferece contexto sobre a autora e apresenta uma obra. A ligação a um poema específico exige observar esse poema e não presumir a sua origem.","Confundes informação sobre a autora com identificação da voz poética. Relê a distinção entre autoria e enunciação em «O essencial».","Alargas a reportagem à origem de poemas que ela não documenta. Relê a apresentação de _Mundo_ e o âmbito indicado para a fonte."]},{"t":"emparelhar","p":"Associa cada pergunta ao plano de análise adequado.","pares":[["Quem assina o livro?","Autoria"],["Quem fala dentro do poema?","Enunciação poética"],["Que informações escolhe a página destacar?","Construção jornalística"]],"f":"As perguntas não se substituem. Saber quem assina não resolve quem fala nem explica as escolhas da reportagem.","g":"m8-f15-6","fe":"Trocas os planos da autoria, da enunciação e da construção jornalística. Relê, em «O essencial», as três definições: autora, voz poética e reportagem."},{"t":"ler","titulo":"Um modelo de confronto","rot":"Para entender","html":"<p>Exemplo de raciocínio: a reportagem destaca uma atenção à vida quotidiana. Num poema, encontras um objeto doméstico a desencadear uma reflexão. Podes investigar uma aproximação entre essas duas observações.<\/p><p>Não podes concluir, apenas por isso, que o incidente aconteceu exatamente como é narrado. A aproximação orienta uma pergunta; não fornece uma certidão do acontecimento.<\/p><p><strong>Modelo completo.<\/strong> A reportagem apresenta uma autora e uma obra em contexto público. Essa informação pode orientar uma pergunta ao poema. Só a leitura do poema permite demonstrar o funcionamento de uma imagem.<\/p>"},{"t":"escolha","p":"Que pergunta abre uma investigação, em vez de impor uma resposta?","o":["Como se constrói a atenção ao quotidiano neste poema?","Como reconta este poema o episódio vivido pela autora?","Como reproduz a voz do poema a declaração da autora?"],"c":0,"f":"Perguntar como se constrói a atenção ao quotidiano procura procedimentos do texto. Perguntar pela confirmação do episódio ou pela reprodução da declaração já impõe como verdade aquilo que seria necessário demonstrar.","g":"m8-f15-11","fe":["Perguntar como se constrói a atenção ao quotidiano procura procedimentos do texto. Perguntar pela confirmação do episódio ou pela reprodução da declaração já impõe como verdade aquilo que seria necessário demonstrar.","Pressupões um episódio biográfico em vez de o demonstrar. Relê o modelo: a aproximação não fornece uma certidão do acontecimento.","Pressupões que a voz reproduz uma declaração da autora. Relê a distinção entre a declaração documentada e o indício no poema."]},{"t":"completar","p":"Completa a relação entre contexto e interpretação.","frase":"A reportagem oferece [1]; o poema fornece os indícios para a [2] do texto.","lacunas":[{"o":["contexto","confissão","garantias"],"c":0},{"o":["leitura","autoria","revisão"],"c":0}],"f":"O contexto pode tornar visíveis perguntas relevantes. A interpretação mantém a responsabilidade de demonstrar o que afirma no texto.","g":"m8-f15-8","fe":"Atribuis à reportagem a função de prova ou de confissão. Relê o modelo completo de «Um modelo de confronto»: «Essa informação pode orientar uma pergunta ao poema»."},{"t":"sublinhar","p":"Que palavra distingue uma orientação possível de uma prova que decidiria a leitura?","frase":"Esta informação pode orientar uma leitura.","certas":[2],"f":"«Pode» apresenta uma possibilidade, não uma relação obrigatória. A hipótese continua a precisar de confirmação textual.","g":"m8-f15-10","fe":"Escolhes o que a informação faz em vez da palavra que limita esse alcance. Relê a frase criada e procura o que a apresenta como possibilidade, não como obrigação."},{"t":"ordenar","p":"Ordena uma utilização rigorosa de informação biográfica.","passos":["Identificar a fonte e o que ela efetivamente afirma","Localizar um indício pertinente no poema","Formular uma aproximação entre os dois","Indicar o limite dessa aproximação"],"f":"A fonte é lida antes de ser usada. O confronto com o poema e a indicação do limite evitam substituir análise por biografia.","g":"m8-f15-9","fe":"Usas a fonte antes de saber o que ela afirma, ou esqueces o limite final. Relê «Um modelo de confronto»: a aproximação orienta uma pergunta e não fornece uma certidão do acontecimento."},{"t":"ler","titulo":"Reconhecer uma atribuição","rot":"Compara","html":"<p>Formulações criadas para esta lição. A: A página apresenta o livro como atento a desigualdades. B: A autora afirmou esta frase. C: A voz deste poema é necessariamente a autora.<\/p><p>A exige conferir a apresentação. B exige localizar a declaração exata. C não decorre nem de A nem de B. Não ponhas entre aspas uma paráfrase tua.<\/p><p>Contraexemplo à equivalência entre reportagem e poema: um texto jornalístico pode informar sobre uma publicação sem conter a voz que fala no poema. Critério: cada afirmação precisa de uma fonte que possa sustentá-la.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Pergunta se a afirmação diz respeito à pessoa, à publicação ou à construção de uma voz. Procura a fonte adequada a esse plano.<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Liga a formulação ao cuidado necessário.","pares":[["A página destaca um tema.","Conferir a apresentação da fonte"],["A autora disse estas palavras.","Localizar a declaração exata"],["O poema permite esta hipótese.","Apresentar indícios textuais"]],"f":"A atribuição deve acompanhar a natureza da prova. Uma paráfrase de reportagem não se transforma em declaração literal da autora.","g":"m8-f15-14","fe":"Atribuis a cada formulação um cuidado que não corresponde à sua natureza. Relê, em «Reconhecer uma atribuição», o que exigem as formulações A e B: conferir a apresentação e localizar a declaração exata."},{"t":"escolha","p":"Que legenda identifica corretamente uma paráfrase tua?","o":["Síntese da apresentação publicada pela RTP Ensina.","Declaração da autora transcrita na apresentação da RTP.","Comentário do sujeito poético à apresentação da RTP."],"c":0,"f":"Síntese explicita a transformação realizada. As outras legendas mudam a origem e o estatuto do texto e podem criar uma falsa citação.","g":"m8-f15-15","fe":["Síntese explicita a transformação realizada. As outras legendas mudam a origem e o estatuto do texto e podem criar uma falsa citação.","Confundes paráfrase com transcrição literal. Volta às palavras que efetivamente consultaste na apresentação da RTP.","Atribuis à voz poética uma síntese da reportagem. Confere a origem da formulação antes de escolher quem a enuncia."]},{"t":"vf","p":"Sem uma declaração da autora sobre o poema, a leitura deve pôr de parte o contexto biográfico.","v":false,"f":"A distinção permite usar melhor a informação. O contexto continua relevante quando não é confundido com prova automática de cada acontecimento ou voz.","g":"m8-f15-12","fe":"Tomas a falta de uma declaração como razão para afastar todo o contexto. Relê «Um modelo de confronto»: a atenção à vida quotidiana destacada pela reportagem permite investigar uma aproximação ao poema."},{"t":"completar","p":"Completa uma regra de atribuição.","frase":"As aspas assinalam uma [1] literal; a paráfrase conserva a indicação de [2].","lacunas":[{"o":["citação","hipótese","opinião"],"c":0},{"o":["origem","métrica","género"],"c":0}],"f":"Uma paráfrase também precisa de atribuição. As aspas não servem para dar autoridade a palavras que a fonte não contém.","g":"m8-f15-16","fe":"Confundes citação e paráfrase, ou esqueces que a paráfrase também tem origem. Relê, em «Reconhecer uma atribuição», o aviso: «Não ponhas entre aspas uma paráfrase tua»."},{"t":"ordenar","p":"Ordena a relação entre informação jornalística e interpretação, sem substituir uma pela outra.","passos":["A reportagem fornece um contexto público","Esse contexto permite formular uma pergunta","O poema oferece a prova da leitura literária","A atribuição distingue os dois planos"],"f":"O dado biográfico abre uma pergunta, mas é o indício no poema que sustenta a resposta. Explicitar o limite impede transformar aproximação em acontecimento documentado.","g":"m8-f15-17","fe":"Pões a prova do poema antes da pergunta que o contexto permite formular. Relê o modelo completo de «Um modelo de confronto»: contexto público, pergunta ao poema e só depois a demonstração pela leitura."},{"t":"escolha","p":"Que proposta criativa testa melhor a distinção estudada?","o":["Criar duas vozes distintas para observar o mesmo objeto.","Criar duas vozes equivalentes, trocando o nome do objeto.","Criar duas vozes biográficas a partir do nome da autora."],"c":0,"f":"Duas vozes para o mesmo objeto permitem experimentar que quem escreve e quem fala não são necessariamente a mesma instância. As frases criadas devem ser identificadas como tal.","g":"m8-f15-18","fe":["Duas vozes para o mesmo objeto permitem experimentar que quem escreve e quem fala não são necessariamente a mesma instância. As frases criadas devem ser identificadas como tal.","Trocar o nome do objeto não torna distintas as posições das vozes. Relê a diferença entre quem escreve e quem fala.","Deduzes duas vozes da biografia sem prova textual. Regressa ao modelo de confronto entre contexto e indício no poema."]},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Como usar uma reportagem sobre uma autora sem reduzir o poema à sua vida?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];

if(!/[?&]projetar=1(&|$)/.test(location.search))save("epi-ultima",{id:"m8-f15",m:"M8",t:Date.now()});
