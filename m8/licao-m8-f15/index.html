<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m8-f15",CARTOES=[{"t":"ler","titulo":"A autora não é o poema","rot":"Abre","html":"<p class=\"abre\">Como usar uma reportagem sobre uma autora sem reduzir o poema à sua vida?<\/p><p class=\"abre\">Saber mais sobre quem escreve pode abrir uma leitura. Também pode fechá-la cedo demais. Que informação ajuda e que conclusão vai além da prova?<\/p><p>Vais cruzar uma reportagem da RTP Ensina com as distinções que já usaste ao ler Ana Luísa Amaral.<\/p><figure class=\"fig documento\"><a href=\"../../img/fontes/licoes-20261101/amaral.jpg\" aria-label=\"Abrir a imagem inteira\"><img src=\"../../img/fontes/licoes-20261101/amaral.jpg\" alt=\"Ana Luísa Amaral fotografada na Feira do Livro de Gotemburgo, com um lenço coral.\"><\/a><figcaption><p>Ana Luísa Amaral na Feira do Livro de Gotemburgo, em 2013. A fotografia documenta esta presença pública.<\/p><details><summary>Créditos e fonte da imagem<\/summary><table><caption>Identificação do documento visual<\/caption><tr><th scope=\"row\">Autor<\/th><td>Mattias Blomgren<\/td><\/tr><tr><th scope=\"row\">Obra<\/th><td>Ana Luísa Amaral na Feira do Livro de Gotemburgo<\/td><\/tr><tr><th scope=\"row\">Data<\/th><td>27/09/2013<\/td><\/tr><tr><th scope=\"row\">Instituição ou acervo<\/th><td>Wikimedia Commons, publicação do fotógrafo.<\/td><\/tr><tr><th scope=\"row\">Licença<\/th><td><a href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0<\/a><\/td><\/tr><\/table><p><a href=\"https://commons.wikimedia.org/wiki/File:Ana_Lu%C3%ADsa_Amaral_at_G%C3%B6teborg_Book_Fair_2013_01.JPG\">Consultar a fonte e os direitos<\/a>. Reprodução redimensionada, sem recorte.<\/p><\/details><\/figcaption><\/figure>"},{"t":"vf","p":"Antes de reler. Recupera a distinção das leituras anteriores: uma declaração da autora e uma fala do sujeito poético pertencem ao mesmo plano de prova?","v":false,"f":"Confundir testemunho público e voz poética troca a natureza da fonte. Regressa à F05: a voz do poema é construída; uma declaração pública deve ser atribuída à pessoa e à ocasião em que foi feita. Relê essa distinção na lição anterior depois de tentares responder.","g":"m8-f15-1"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p><strong>Autora:<\/strong> pessoa real que escreve. <strong>Voz poética:<\/strong> instância construída no poema. <strong>Reportagem:<\/strong> seleção jornalística de informações, declarações e imagens.<\/p><p>Uma reportagem pode documentar uma declaração da autora. Não prova automaticamente que todas as vozes dos seus poemas dizem o que ela pensa em cada momento.<\/p>"},{"t":"ler","titulo":"Uma fonte, um âmbito","rot":"Lê e confronta","html":"<p>A RTP Ensina apresenta Ana Luísa Amaral em «Ana Luísa Amaral, poesia atenta ao mundo». A página associa a sua escrita à atenção ao quotidiano e às desigualdades e apresenta o livro <i>Mundo<\/i>. O recurso audiovisual tem origem em <i>Nada Será Como Dante<\/i>, produção Até ao Fim do Mundo, 2021.<\/p><p><a href=\"https://ensina.rtp.pt/artigo/ana-luisa-amaral-poesia-atenta-ao-mundo/\" target=\"_blank\" rel=\"noopener\">Lê a apresentação na RTP Ensina<\/a>. Procura uma informação sobre o trabalho de escrita e outra sobre o âmbito da reportagem. O texto de apresentação basta para as atividades desta lição.<\/p><p>Não é uma reportagem sobre a origem de «A verdade histórica». Evita atribuir-lhe essa função.<\/p>"},{"t":"escolha","p":"Que afirmação respeita o âmbito da fonte apresentada?","o":["A reportagem situa a atenção da autora ao mundo.","A reportagem identifica a autora com a voz de um poema.","A reportagem explica a origem doméstica de cada poema."],"c":0,"f":"A fonte oferece contexto sobre a autora e apresenta uma obra. A ligação a um poema específico exige observar esse poema e não presumir a sua origem. Relê o cartão «Uma fonte, um âmbito» e confronta a pista com a tua resposta.","g":"m8-f15-4"},{"t":"vf","p":"Uma frase na primeira pessoa, num poema, deve ser atribuída automaticamente à pessoa que o assina.","v":false,"f":"Autoria e enunciação são planos diferentes. Uma pessoa real pode criar várias vozes, posições e situações que não coincidem com a sua experiência pessoal. Relê o cartão «Uma fonte, um âmbito» e confronta a pista com a tua resposta.","g":"m8-f15-5"},{"t":"emparelhar","p":"Associa cada pergunta ao plano de análise adequado.","pares":[["Quem assina o livro?","Autoria"],["Quem fala dentro do poema?","Enunciação poética"],["Que informações a página escolhe destacar?","Construção jornalística"]],"f":"As perguntas não se substituem. Saber quem assina não resolve quem fala nem explica as escolhas da reportagem. Relê o cartão «Uma fonte, um âmbito» e confronta a pista com a tua resposta.","g":"m8-f15-6"},{"t":"ler","titulo":"Um modelo de confronto","rot":"Lê e confronta","html":"<p>Exemplo de raciocínio: a reportagem destaca uma atenção à vida quotidiana. Num poema, encontras um objeto doméstico a desencadear uma reflexão. Podes investigar uma aproximação entre essas duas observações.<\/p><p>Não podes concluir, apenas por isso, que o incidente aconteceu exatamente como é narrado. A aproximação orienta uma pergunta; não fornece uma certidão do acontecimento.<\/p><p><strong>Modelo completo.<\/strong> A reportagem apresenta uma autora e uma obra em contexto público. Essa informação pode orientar uma pergunta ao poema. Só a leitura do poema permite demonstrar o funcionamento de uma imagem.<\/p>"},{"t":"completar","p":"Completa a relação entre contexto e interpretação.","frase":"A reportagem oferece [1]; o poema fornece os indícios para a [2] do texto.","lacunas":[{"o":["contexto","confissão","garantias"],"c":0},{"o":["leitura","autoria","revisão"],"c":0}],"f":"O contexto pode tornar visíveis perguntas relevantes. A interpretação mantém a responsabilidade de demonstrar o que afirma no texto. Relê o cartão «Um modelo de confronto» e confronta a pista com a tua resposta.","g":"m8-f15-8"},{"t":"ordenar","p":"Ordena uma utilização rigorosa de informação biográfica.","passos":["Identificar a fonte e o que ela efetivamente afirma","Localizar um indício pertinente no poema","Formular uma aproximação entre os dois","Indicar o limite dessa aproximação"],"f":"A fonte é lida antes de ser usada. O confronto com o poema e a indicação do limite evitam substituir análise por biografia. Relê o cartão «Um modelo de confronto» e confronta a pista com a tua resposta.","g":"m8-f15-9"},{"t":"sublinhar","p":"Que palavra distingue uma orientação possível de uma prova que decidiria a leitura?","frase":"Esta informação pode orientar uma leitura.","certas":[2],"f":"Pode apresenta uma possibilidade, não uma relação obrigatória. A hipótese continua a precisar de confirmação textual. Relê o cartão «Um modelo de confronto» e confronta a pista com a tua resposta.","g":"m8-f15-10"},{"t":"escolha","p":"Que pergunta abre uma investigação, em vez de impor uma resposta?","o":["Como se constrói a atenção ao quotidiano neste poema?","Como confirma este poema o episódio vivido pela autora?","Como reproduz a voz do poema a declaração da autora?"],"c":0,"f":"A primeira pergunta procura procedimentos do texto. As outras já impõem como verdade aquilo que seria necessário demonstrar. Relê o cartão «Um modelo de confronto» e confronta a pista com a tua resposta.","g":"m8-f15-11"},{"t":"vf","p":"Distinguir autora e voz poética obriga a ignorar toda a informação sobre a autora.","v":false,"f":"A distinção permite usar melhor a informação. O contexto continua relevante quando não é confundido com prova automática de cada acontecimento ou voz. Relê o cartão «Um modelo de confronto» e confronta a pista com a tua resposta.","g":"m8-f15-12"},{"t":"ler","titulo":"Reconhecer uma atribuição","rot":"Lê e confronta","html":"<p>Formulações didáticas criadas: A: «A página apresenta o livro como atento a desigualdades.» B: «A autora afirmou esta frase.» C: «A voz deste poema é necessariamente a autora.»<\/p><p>A exige conferir a apresentação. B exige localizar a declaração exata. C não decorre nem de A nem de B. Não ponhas entre aspas uma paráfrase tua.<\/p><p>Contraexemplo à equivalência entre reportagem e poema: um texto jornalístico pode informar sobre uma publicação sem conter a voz que fala no poema. Critério: cada afirmação precisa de uma fonte que possa sustentá-la.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Pergunta se a afirmação diz respeito à pessoa, à publicação ou à construção de uma voz. Procura a fonte adequada a esse plano.<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Liga a formulação ao cuidado necessário.","pares":[["A página destaca um tema.","Conferir a apresentação da fonte"],["A autora disse estas palavras.","Localizar a declaração exata"],["O poema permite esta hipótese.","Apresentar indícios textuais"]],"f":"A atribuição deve acompanhar a natureza da prova. Uma paráfrase de reportagem não se transforma em declaração literal da autora. Relê o cartão «Reconhecer uma atribuição» e confronta a pista com a tua resposta.","g":"m8-f15-14"},{"t":"escolha","p":"Que legenda identifica corretamente uma paráfrase tua?","o":["Síntese da apresentação publicada pela RTP Ensina.","Declaração da autora transcrita na apresentação RTP.","Comentário do sujeito poético à apresentação da RTP."],"c":0,"f":"Síntese explicita a transformação realizada. As outras legendas mudam a origem e o estatuto do texto e podem criar uma falsa citação. Relê o cartão «Reconhecer uma atribuição» e confronta a pista com a tua resposta.","g":"m8-f15-15"},{"t":"completar","p":"Completa uma regra de atribuição.","frase":"As aspas assinalam uma [1] literal; a paráfrase conserva a indicação de [2].","lacunas":[{"o":["citação","hipótese","opinião"],"c":0},{"o":["origem","métrica","género"],"c":0}],"f":"Uma paráfrase também precisa de atribuição. As aspas não servem para dar autoridade a palavras que a fonte não contém. Relê o cartão «Reconhecer uma atribuição» e confronta a pista com a tua resposta.","g":"m8-f15-16"},{"t":"ordenar","p":"Ordena a relação entre informação jornalística e interpretação, sem substituir uma pela outra.","passos":["A reportagem fornece um contexto público","Esse contexto permite formular uma pergunta","O poema oferece a prova da leitura literária","A atribuição distingue os dois planos"],"f":"A sequência liga os pormenores à interpretação e conserva o seu limite. Relê o modelo e o contraexemplo: Pergunta se a afirmação diz respeito à pessoa, à publicação ou à construção de uma voz. Procura a fonte adequada a esse plano. Relê o cartão «Reconhecer uma atribuição» e confronta a pista com a tua resposta.","g":"m8-f15-17"},{"t":"escolha","p":"Que proposta criativa testa melhor a distinção estudada?","o":["Criar duas vozes distintas para observar o mesmo objeto.","Criar duas vozes equivalentes, trocando o nome do objeto.","Criar duas vozes biográficas a partir do nome da autora."],"c":0,"f":"Duas vozes para o mesmo objeto permitem experimentar que quem escreve e quem fala não são necessariamente a mesma instância. As frases criadas devem ser identificadas como tal. Relê o cartão «Reconhecer uma atribuição» e confronta a pista com a tua resposta.","g":"m8-f15-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Como usar uma reportagem sobre uma autora sem reduzir o poema à sua vida?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
