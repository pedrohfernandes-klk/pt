<div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 8<br>Unidade 1</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação da lição"><a href="../#m8-f13">Esta lição no percurso</a><a href="../licao-m8-f04/">Lição anterior</a><a href="../licao-m8-f05/">Continuar o percurso</a></nav><p class="c-menu-extra">As citações têm crédito junto ao texto. Os exemplos criados estão identificados. O progresso fica neste aparelho.</p></div></div>

<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m8-f13",CARTOES=[{"t":"ler","titulo":"Quando as palavras se gastam","rot":"Abre","html":"<p class=\"abre\">Como pode um poema mostrar que as palavras deixaram de chegar?<\/p><p class=\"abre\">Uma frase pode continuar correta e já não conseguir aproximar duas pessoas. Que mudou: as palavras ou a relação?<\/p><p>Na leitura anterior conheceste a abertura de «Adeus». Agora vais testar o contraste entre o passado e o presente e os limites de uma interpretação.<\/p><figure class=\"fig documento\"><a href=\"../../img/fontes/licoes-20261101/eugenio.jpg\" aria-label=\"Abrir a imagem inteira\"><img src=\"../../img/fontes/licoes-20261101/eugenio.jpg\" alt=\"Retrato pintado de Eugénio de Andrade, com pinceladas claras e escuras sobre o rosto.\"><\/a><figcaption><p>O retrato identifica o autor. A voz da despedida terá de ser interpretada no poema; a imagem não comprova um episódio da sua vida.<\/p><details><summary>Créditos e fonte da imagem<\/summary><table><caption>Identificação do documento visual<\/caption><tr><th scope=\"row\">Autor<\/th><td>Bottelho (Carlos Botelho)<\/td><\/tr><tr><th scope=\"row\">Obra<\/th><td>Eugénio de Andrade<\/td><\/tr><tr><th scope=\"row\">Data<\/th><td>2010<\/td><\/tr><tr><th scope=\"row\">Instituição ou acervo<\/th><td>Publicação do autor no Flickr; reprodução no Wikimedia Commons. Coleção não indicada.<\/td><\/tr><tr><th scope=\"row\">Licença<\/th><td><a href=\"https://creativecommons.org/licenses/by-sa/2.0/\">CC BY-SA 2.0<\/a><\/td><\/tr><\/table><p><a href=\"https://commons.wikimedia.org/wiki/File:Eug%C3%A9nio_de_Andrade.jpg\">Consultar a fonte e os direitos<\/a>. Reprodução redimensionada, sem recorte.<\/p><\/details><\/figcaption><\/figure>"},{"t":"vf","p":"Antes de reler. Recupera a distinção da leitura anterior: uma voz em primeira pessoa identifica necessariamente o autor real?","v":false,"f":"Confundir pessoa gramatical e identidade biográfica transforma um poema em documento sem prova. Na lição anterior, regressa à distinção entre a voz do poema e Eugénio de Andrade. Relê essa distinção na lição anterior depois de tentares responder.","g":"m8-f13-1"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>Eugénio de Andrade constrói em «Adeus» uma despedida através de imagens concretas. O poema pertence a <i>Os Amantes sem Dinheiro<\/i> (1950). O sujeito poético é a voz construída pelo poema: não é uma declaração biográfica automática do autor.<\/p><p>Uma <strong>metáfora<\/strong> aproxima realidades diferentes. Uma <strong>repetição<\/strong> pode mostrar insistência ou desgaste. Para interpretar, observa a imagem, compara os momentos e limita a conclusão ao que o texto sustenta.<\/p>"},{"t":"ler","titulo":"O recorte e a leitura","rot":"Lê e confronta","html":"<blockquote>«Já gastámos as palavras pela rua, meu amor,<br>e o que nos ficou não chega»<\/blockquote><p>Eugénio de Andrade, «Adeus», <i>Os Amantes sem Dinheiro<\/i>, 1950. Citação de dois versos, conforme a RTP Ensina; a página da edição não é indicada.<\/p><p><a href=\"https://ensina.rtp.pt/artigo/adeus-de-eugenio-de-andrade/\" target=\"_blank\" rel=\"noopener\">Lê o poema completo na RTP Ensina<\/a>. Observa como o passado de abundância contrasta com o presente da despedida. Podes voltar ao texto em qualquer momento.<\/p>"},{"t":"escolha","p":"Na abertura, que leitura explica melhor o desgaste das palavras?","o":["Perderam força dentro desta relação.","Ficaram repetidas sem alterar o vínculo.","Passaram a designar objetos diferentes."],"c":0,"f":"O desgaste é uma imagem da perda de eficácia afetiva. A frase continua compreensível; o que deixou de bastar é a linguagem partilhada nesta relação. Relê o cartão «O recorte e a leitura» e confronta a pista com a tua resposta.","g":"m8-f13-4"},{"t":"vf","p":"O uso de uma forma verbal na primeira pessoa do plural prova que o poema relata a vida do autor.","v":false,"f":"A primeira pessoa constrói uma voz. Para afirmar um facto biográfico seria necessária uma fonte independente; a pessoa gramatical não basta. Relê o cartão «O recorte e a leitura» e confronta a pista com a tua resposta.","g":"m8-f13-5"},{"t":"emparelhar","p":"Liga a observação ao efeito que permite investigar.","pares":[["Palavras tratadas como algo que se gasta","Metáfora de desgaste"],["Regresso de uma formulação","Insistência pela repetição"],["Passado confrontado com o presente","Contraste temporal"]],"f":"Cada recurso organiza uma relação: material e afetiva, repetida e insistente, passada e presente. Dar o nome ao recurso é o início, não a interpretação completa. Relê o cartão «O recorte e a leitura» e confronta a pista com a tua resposta.","g":"m8-f13-6"},{"t":"ler","titulo":"Um modelo de interpretação","rot":"Lê e confronta","html":"<p><strong>Observação:<\/strong> a abertura aproxima palavras e desgaste. <strong>Relação:<\/strong> o que era partilhado já não chega para sustentar o vínculo. <strong>Limite:<\/strong> isso não demonstra que a linguagem seja inútil em todas as relações.<\/p><p>No poema completo, o silêncio recebe um tratamento diferente e a recordação de uma antiga abundância torna mais forte a perda atual. São contrastes que impedem uma leitura uniforme de tudo como fracasso.<\/p><p><strong>Modelo completo.<\/strong> A imagem inicial apresenta palavras como matéria que se gasta. A insuficiência atual relaciona essa imagem com o vínculo. A conclusão aplica-se a esta relação, não a toda a comunicação.<\/p>"},{"t":"completar","p":"Completa a passagem da identificação para a interpretação.","frase":"A metáfora não descreve uma perda [1] de palavras: sugere uma perda de [2] na relação.","lacunas":[{"o":["material","temporal","corporal"],"c":0},{"o":["eficácia","correção","pronúncia"],"c":0}],"f":"O poema usa uma imagem material para pensar uma mudança afetiva. O efeito está na passagem entre esses dois planos. Relê o cartão «Um modelo de interpretação» e confronta a pista com a tua resposta.","g":"m8-f13-8"},{"t":"ordenar","p":"Ordena os passos de uma interpretação sustentada.","passos":["Localizar a imagem na abertura","Explicar a relação entre desgaste e vínculo","Confrontar essa leitura com os contrastes do poema","Indicar o que não é possível concluir sobre o autor"],"f":"A prova antecede a conclusão. O confronto com o conjunto pode afinar a leitura e impede transformar o poema numa biografia. Relê o cartão «Um modelo de interpretação» e confronta a pista com a tua resposta.","g":"m8-f13-9"},{"t":"sublinhar","p":"Que duas palavras distinguem uma mudança na relação de uma impossibilidade sem história?","frase":"Antes aproximava; agora afasta.","certas":[0,2],"f":"Antes e agora organizam o contraste. A frase é um exemplo criado para observar a estrutura, não um verso de Eugénio de Andrade. Relê o cartão «Um modelo de interpretação» e confronta a pista com a tua resposta.","g":"m8-f13-10"},{"t":"escolha","p":"Que efeito tem recordar a antiga abundância no meio de uma despedida?","o":["Realça a perda sentida no presente.","Sugere que o vínculo está a recuperar.","Desloca a despedida para o passado."],"c":0,"f":"O contraste dá espessura à perda: percebe-se o que existiu e deixou de existir. A recordação não garante um reencontro. Relê o cartão «Um modelo de interpretação» e confronta a pista com a tua resposta.","g":"m8-f13-11"},{"t":"vf","p":"Se o silêncio recebe um tratamento diferente das palavras gastas, a leitura deve reconhecer essa diferença.","v":true,"f":"Uma interpretação rigorosa não força todos os elementos a dizer o mesmo. A diferença do silêncio obriga a qualificar a ideia de desgaste. Relê o cartão «Um modelo de interpretação» e confronta a pista com a tua resposta.","g":"m8-f13-12"},{"t":"ler","titulo":"Muda uma decisão","rot":"Lê e confronta","html":"<p>Exemplos criados para esta lição: A: «Nada do que digo te alcança.» B: «Nunca ninguém consegue dizer nada a ninguém.»<\/p><p>A primeira formulação situa um limite numa relação. A segunda transforma esse limite numa regra universal. Ao escrever uma apreciação, confirma que não fizeste esta mudança sem prova.<\/p><p>Contraexemplo à ideia de que tudo no poema perdeu valor: o silêncio recebe um tratamento diferente. Critério: uma conclusão sobre todos os elementos só resiste se explicar também esse contraste.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Compara o alcance da primeira formulação criada com o da segunda: a relação concreta passou a regra universal?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Classifica as duas formulações criadas e uma decisão de leitura.","pares":[["Nada do que digo te alcança.","Limite situado numa relação"],["Nunca ninguém consegue dizer nada a ninguém.","Generalização sem limite"],["Procuro um contraste antes de concluir.","Procedimento de confirmação"]],"f":"O alcance de uma afirmação importa tanto como o tema. A leitura de um caso não autoriza automaticamente uma regra sobre toda a humanidade. Relê o cartão «Muda uma decisão» e confronta a pista com a tua resposta.","g":"m8-f13-14"},{"t":"escolha","p":"Que proposta criativa preserva a tensão estudada sem copiar o poema?","o":["Um encontro em que a saudação muda de efeito.","Um encontro em que muda apenas o lugar da saudação.","Um encontro em que muda só a pessoa que saúda."],"c":0,"f":"Repetir uma saudação em momentos distintos permite experimentar uma mudança de efeito. A criação transfere o contraste, sem imitar versos. Relê o cartão «Muda uma decisão» e confronta a pista com a tua resposta.","g":"m8-f13-15"},{"t":"completar","p":"Completa uma conclusão prudente.","frase":"Neste poema, a linguagem revela uma [1] do vínculo; não estabelece uma lei sobre [2].","lacunas":[{"o":["mudança","garantia","correção"],"c":0},{"o":["todas as relações","esta relação a dois","duas relações aqui"],"c":0}],"f":"A expressão neste poema delimita o objeto. A interpretação deve explicar este vínculo e não prometer uma teoria universal do amor. Relê o cartão «Muda uma decisão» e confronta a pista com a tua resposta.","g":"m8-f13-16"},{"t":"ordenar","p":"Ordena esta reconstrução da leitura, da imagem inicial ao limite da conclusão.","passos":["As palavras surgem como matéria que se gasta","A insuficiência atual afeta o vínculo","A abundância passada torna a perda mais intensa","O tratamento do silêncio limita a generalização"],"f":"A sequência liga os pormenores à interpretação e conserva o seu limite. Relê o modelo e o contraexemplo: Compara o alcance da primeira formulação criada com o da segunda: a relação concreta passou a regra universal? Relê o cartão «Muda uma decisão» e confronta a pista com a tua resposta.","g":"m8-f13-17"},{"t":"escolha","p":"Que comentário merece revisão por confundir texto e vida?","o":["O autor viveu exatamente esta despedida.","A voz dá à despedida uma dimensão afetiva.","A imagem liga a linguagem à perda do vínculo."],"c":0,"f":"A primeira frase afirma uma biografia sem prova. As outras descrevem relações observáveis na construção do poema. Relê o cartão «Muda uma decisão» e confronta a pista com a tua resposta.","g":"m8-f13-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Como pode um poema mostrar que as palavras deixaram de chegar?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
