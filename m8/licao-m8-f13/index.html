<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m8-f13",CARTOES=[{"t":"ler","titulo":"Quando as palavras se gastam","rot":"Abre","html":"<figure class=\"fig documento\"><a href=\"../../img/fontes/licoes-20261101/eugenio.jpg\" aria-label=\"Abrir a imagem inteira\"><img src=\"../../img/fontes/licoes-20261101/eugenio.jpg\" alt=\"Retrato pintado de Eugénio de Andrade, com pinceladas claras e escuras sobre o rosto.\"><\/a><details class=\"info-i info-i--linha\" name=\"info-i\"><summary aria-label=\"Créditos da imagem\"><span aria-hidden=\"true\">i<\/span><\/summary><div class=\"info-i-texto\"><p>CC BY-SA 2.0; <a href=\"https://commons.wikimedia.org/wiki/File:Eug%C3%A9nio_de_Andrade.jpg\">Fonte ↗<\/a><\/p><table><caption>Identificação do documento visual<\/caption><tr><th scope=\"row\">Autor<\/th><td>Bottelho<\/td><\/tr><tr><th scope=\"row\">Obra<\/th><td>Eugénio de Andrade<\/td><\/tr><tr><th scope=\"row\">Data<\/th><td>2010<\/td><\/tr><tr><th scope=\"row\">Instituição ou acervo<\/th><td>Publicação do autor no Flickr; reprodução no Wikimedia Commons. Coleção não indicada.<\/td><\/tr><tr><th scope=\"row\">Licença<\/th><td><a rel=\"license\" href=\"https://creativecommons.org/licenses/by-sa/2.0/\">CC BY-SA 2.0<\/a><\/td><\/tr><\/table><p><a href=\"https://commons.wikimedia.org/wiki/File:Eug%C3%A9nio_de_Andrade.jpg\">Consultar a fonte e os direitos ↗<\/a>. Reprodução redimensionada, sem recorte.<\/p><\/div><\/details><figcaption><p>Eugénio de Andrade, num retrato de Bottelho (2010).<\/p><\/figcaption><\/figure><p class=\"abre\"><strong>Como pode um poema mostrar que as palavras deixaram de chegar?<\/strong><\/p><p class=\"abre\">Uma frase pode continuar correta e já não conseguir aproximar duas pessoas. Que mudou: as palavras ou a relação?<\/p><p>Na leitura anterior conheceste a abertura de «Adeus». Agora vais testar o contraste entre o passado e o presente e os limites de uma interpretação.<\/p>"},{"t":"vf","p":"Antes de reler. Na lição sobre Jorge de Sena, distinguir a testemunha do poema da presença biográfica do autor impedia ler a primeira pessoa como relato vivido?","v":true,"f":"Confundir pessoa gramatical e identidade biográfica transforma um poema em documento sem prova. Regressa a «Jorge de Sena, poeta testemunha»: a testemunha do poema não se confunde com uma presença biográfica no acontecimento.","g":"m8-f13-1","fe":"Deixas de separar a testemunha do poema da vida do autor. Relê a linha de vida de «Jorge de Sena, poeta testemunha»: os fuzilamentos são de 1808 e Sena nasce em 1919."},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>Eugénio de Andrade constrói em «Adeus» uma despedida através de imagens concretas. O poema pertence a <i>Os Amantes sem Dinheiro<\/i> (1950). O sujeito poético é a voz construída pelo poema: não é uma declaração biográfica automática do autor.<\/p><p>Uma <strong>metáfora<\/strong> aproxima realidades diferentes. Uma <strong>repetição<\/strong> pode mostrar insistência ou desgaste. Para interpretar, observa a imagem, compara os momentos e limita a conclusão ao que o texto sustenta.<\/p>"},{"t":"ler","titulo":"O recorte e a leitura","rot":"Lê de perto","html":"<blockquote>«Já gastámos as palavras pela rua, meu amor,<br>e o que nos ficou não chega»<\/blockquote><p>Eugénio de Andrade, «Adeus», <i>Os Amantes sem Dinheiro<\/i>, 1950. Citação de dois versos, conforme a RTP Ensina; a página da edição não é indicada.<\/p><p><a href=\"https://ensina.rtp.pt/artigo/adeus-de-eugenio-de-andrade/\" target=\"_blank\" rel=\"noopener\">Lê o poema completo na RTP Ensina<\/a>. Observa como o passado de abundância contrasta com o presente da despedida. Podes voltar ao texto em qualquer momento.<\/p>"},{"t":"escolha","p":"Na abertura, que leitura explica melhor o desgaste das palavras?","o":["Perderam força dentro desta relação.","Ficaram repetidas sem alterar o vínculo.","Passaram a designar objetos diferentes."],"c":0,"f":"O desgaste é uma imagem da perda de eficácia afetiva. A frase continua compreensível; o que deixou de bastar é a linguagem partilhada nesta relação.","g":"m8-f13-4","fe":["O desgaste é uma imagem da perda de eficácia afetiva. A frase continua compreensível; o que deixou de bastar é a linguagem partilhada nesta relação.","Confundes repetição com ausência de mudança na relação. Relê a ligação entre «gastámos» e «não chega».","Confundes desgaste figurado com mudança de referente. Relê o que falta às palavras na relação entre as duas pessoas."]},{"t":"emparelhar","p":"Liga a observação ao efeito que permite investigar.","pares":[["Palavras tratadas como algo que se gasta","Metáfora de desgaste"],["Regresso de uma formulação","Insistência pela repetição"],["Passado confrontado com o presente","Contraste temporal"]],"f":"Cada recurso organiza uma relação: material e afetiva, repetida e insistente, passada e presente. Dar o nome ao recurso é o início, não a interpretação completa.","g":"m8-f13-6","fe":"Trocas o nome de cada recurso pela observação de outro. Relê, em «O essencial», as definições de metáfora e de repetição e confronta-as com os dois versos citados."},{"t":"vf","p":"O plural da abertura indica uma despedida vivida pelo autor e por outra pessoa real.","v":false,"f":"A primeira pessoa constrói uma voz. Para afirmar um facto biográfico seria necessária uma fonte independente; a pessoa gramatical não basta.","g":"m8-f13-5","fe":"Tomas a pessoa gramatical por prova biográfica. Relê «gastámos» e pergunta que fonte, fora do poema, diria quem viveu a despedida."},{"t":"ler","titulo":"Um modelo de interpretação","rot":"Para entender","html":"<p><strong>Observação:<\/strong> a abertura aproxima palavras e desgaste. <strong>Relação:<\/strong> o que era partilhado já não chega para sustentar o vínculo. <strong>Limite:<\/strong> isso não demonstra que a linguagem seja inútil em todas as relações.<\/p><p>No poema completo, o silêncio recebe um tratamento diferente e a recordação de uma antiga abundância torna mais forte a perda atual. São contrastes que impedem uma leitura uniforme de tudo como fracasso.<\/p><p><strong>Modelo completo.<\/strong> A imagem inicial apresenta palavras como matéria que se gasta. A insuficiência atual relaciona essa imagem com o vínculo. A conclusão aplica-se a esta relação, não a toda a comunicação.<\/p>"},{"t":"sublinhar","p":"Na frase criada, que duas palavras distinguem uma mudança na relação de uma impossibilidade sem história?","frase":"Antes aproximava; agora afasta.","certas":[0,2],"f":"«Antes» e «agora» organizam o contraste. A frase é um exemplo criado para observar a estrutura, não um verso de Eugénio de Andrade.","g":"m8-f13-10","fe":"Escolhes os verbos em vez das palavras que os situam no tempo. Relê a frase criada e procura o que coloca cada verbo num momento diferente da relação."},{"t":"completar","p":"Completa a passagem da identificação para a interpretação.","frase":"A metáfora não descreve uma perda [1] de palavras: sugere uma perda de [2] na relação.","lacunas":[{"o":["material","temporal","corporal"],"c":0},{"o":["eficácia","correção","pronúncia"],"c":0}],"f":"O poema usa uma imagem material para pensar uma mudança afetiva. O efeito está na passagem entre esses dois planos.","g":"m8-f13-8","fe":"Confundes o plano material da imagem com o plano afetivo da relação. Relê a relação descrita em «Um modelo de interpretação»: «o que era partilhado já não chega para sustentar o vínculo»."},{"t":"escolha","p":"Que efeito tem recordar a antiga abundância no meio de uma despedida?","o":["Realça a perda sentida no presente.","Sugere que o vínculo está a recuperar.","Desloca a despedida para o passado."],"c":0,"f":"O contraste dá espessura à perda: percebe-se o que existiu e deixou de existir. A recordação não garante um reencontro.","g":"m8-f13-11","fe":["O contraste dá espessura à perda: percebe-se o que existiu e deixou de existir. A recordação não garante um reencontro.","Confundes a recordação de abundância com recuperação presente. Confronta as marcas de passado com o que resta agora.","Transferes para o passado a despedida que a voz vive agora. Relê o contraste entre a recordação e a insuficiência presente."]},{"t":"ordenar","p":"Ordena os passos de uma interpretação sustentada.","passos":["Localizar a imagem na abertura","Explicar a relação entre desgaste e vínculo","Confrontar essa leitura com os contrastes do poema","Indicar o que não é possível concluir sobre o autor"],"f":"A prova antecede a conclusão. O confronto com o conjunto pode afinar a leitura e impede transformar o poema numa biografia.","g":"m8-f13-9","fe":"Pões a conclusão antes da prova que a sustenta. Relê a sequência de «Um modelo de interpretação»: observação, relação e limite, por esta ordem."},{"t":"ler","titulo":"Muda uma decisão","rot":"Compara","html":"<p>Exemplos criados para esta lição. A: Nada do que digo te alcança. B: Nunca ninguém consegue dizer nada a ninguém.<\/p><p>A primeira formulação situa um limite numa relação. A segunda transforma esse limite numa regra universal. Ao escrever uma apreciação, confirma que não fizeste esta mudança sem prova.<\/p><p>Contraexemplo à ideia de que tudo no poema perdeu valor: o silêncio recebe um tratamento diferente. Critério: uma conclusão sobre todos os elementos só resiste se explicar também esse contraste.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Compara o alcance da primeira formulação criada com o da segunda: a relação concreta passou a regra universal?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"vf","p":"No poema completo, o silêncio recebe um tratamento diferente das palavras gastas.","v":true,"f":"Uma interpretação rigorosa não força todos os elementos a dizer o mesmo. A diferença do silêncio obriga a qualificar a ideia de desgaste.","g":"m8-f13-12","fe":"Estendes o desgaste das palavras a tudo o que o poema apresenta. Relê o contraexemplo de «Muda uma decisão»: «o silêncio recebe um tratamento diferente»."},{"t":"emparelhar","p":"Classifica as duas formulações criadas e uma decisão de leitura.","pares":[["Nada do que digo te alcança.","Limite situado numa relação"],["Nunca ninguém consegue dizer nada a ninguém.","Generalização sem limite"],["Procuro um contraste antes de concluir.","Procedimento de confirmação"]],"f":"O alcance de uma afirmação importa tanto como o tema. A leitura de um caso não autoriza automaticamente uma regra sobre toda a humanidade.","g":"m8-f13-14","fe":"Confundes o alcance de cada formulação com o tema que partilham. Relê, em «Muda uma decisão», o que separa um limite situado numa relação de uma regra universal."},{"t":"completar","p":"Completa uma conclusão prudente.","frase":"Neste poema, a linguagem revela uma [1] do vínculo; não estabelece uma lei sobre [2].","lacunas":[{"o":["mudança","garantia","correção"],"c":0},{"o":["todas as relações","esta relação a dois","duas relações aqui"],"c":0}],"f":"A expressão «neste poema» delimita o objeto. A interpretação deve explicar este vínculo e não prometer uma teoria universal do amor.","g":"m8-f13-16","fe":"Confundes a mudança de um vínculo com uma lei sobre o amor. Relê o limite de «Um modelo de interpretação»: «isso não demonstra que a linguagem seja inútil em todas as relações»."},{"t":"escolha","p":"Que proposta criativa preserva a tensão estudada sem copiar o poema?","o":["Um encontro em que a saudação muda de efeito.","Um encontro em que muda apenas o lugar da saudação.","Um encontro em que muda só a pessoa que saúda."],"c":0,"f":"Repetir uma saudação em momentos distintos permite experimentar uma mudança de efeito. A criação transfere o contraste, sem imitar versos.","g":"m8-f13-15","fe":["Repetir uma saudação em momentos distintos permite experimentar uma mudança de efeito. A criação transfere o contraste, sem imitar versos.","Mudar o lugar não demonstra uma mudança do vínculo. Retoma a diferença entre conservar as palavras e perder a sua força na relação.","Mudar a pessoa não mostra como a mesma saudação perde força. Retoma a relação entre repetição verbal e transformação afetiva."]},{"t":"ordenar","p":"Ordena esta reconstrução da leitura, da imagem inicial ao limite da conclusão.","passos":["As palavras surgem como matéria que se gasta","A insuficiência atual afeta o vínculo","A abundância passada torna a perda mais intensa","O tratamento do silêncio limita a generalização"],"f":"A recordação dá medida à perda presente. A leitura conserva a diferença entre palavras gastas e silêncio, sem transformar a despedida numa incapacidade universal de comunicar.","g":"m8-f13-17","fe":"Antecipas o limite antes da imagem e do contraste que ele qualifica. Relê o modelo completo de «Um modelo de interpretação»: imagem, insuficiência atual e, só depois, o alcance da conclusão."},{"t":"escolha","p":"Que comentário merece revisão por confundir texto e vida?","o":["O autor viveu exatamente esta despedida.","A voz dá à despedida uma dimensão afetiva.","A imagem liga a linguagem à perda do vínculo."],"c":0,"f":"Afirmar que o autor viveu esta despedida é biografia sem prova. A voz e a imagem descrevem relações observáveis na construção do poema.","g":"m8-f13-18","fe":["Afirmar que o autor viveu esta despedida é biografia sem prova. A voz e a imagem descrevem relações observáveis na construção do poema.","Confundes uma leitura da voz com uma afirmação biográfica. Relê «a voz»: a expressão atribui a dimensão afetiva ao poema.","Confundes interpretar uma imagem com identificar a vida do autor. Relê «a imagem»: a expressão mantém a análise dentro do texto."]},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Como pode um poema mostrar que as palavras deixaram de chegar?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
