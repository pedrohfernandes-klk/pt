<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m8-f13",CARTOES=[{"t":"ler","titulo":"Quando as palavras se gastam","rot":"Abre","html":"<p class=\"abre\">Uma frase pode continuar correta e já não conseguir aproximar duas pessoas. Que mudou: as palavras ou a relação?<\/p><p>Na leitura anterior conheceste a abertura de «Adeus». Agora vais testar o contraste entre o passado e o presente e os limites de uma interpretação.<\/p>"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>Eugénio de Andrade constrói em «Adeus» uma despedida através de imagens concretas. O poema pertence a <i>Os Amantes sem Dinheiro<\/i> (1950). O sujeito poético é a voz construída pelo poema: não é uma declaração biográfica automática do autor.<\/p><p>Uma <strong>metáfora<\/strong> aproxima realidades diferentes. Uma <strong>repetição<\/strong> pode mostrar insistência ou desgaste. Para interpretar, observa a imagem, compara os momentos e limita a conclusão ao que o texto sustenta.<\/p>"},{"t":"ler","titulo":"O recorte e a leitura","rot":"Lê e confronta","html":"<blockquote>«Já gastámos as palavras pela rua, meu amor,<br>e o que nos ficou não chega»<\/blockquote><p>Eugénio de Andrade, «Adeus», <i>Os Amantes sem Dinheiro<\/i>, 1950. Citação de dois versos, conforme a RTP Ensina; a página da edição não é indicada.<\/p><p><a href=\"https://ensina.rtp.pt/artigo/adeus-de-eugenio-de-andrade/\" target=\"_blank\" rel=\"noopener\">Lê o poema completo na RTP Ensina<\/a>. Observa como o passado de abundância contrasta com o presente da despedida. Podes voltar ao texto em qualquer momento.<\/p>"},{"t":"escolha","p":"Na abertura, que leitura explica melhor o desgaste das palavras?","o":["Perderam força dentro desta relação.","Desapareceram do vocabulário da língua.","Ficaram incorretas segundo a gramática."],"c":0,"f":"O desgaste é uma imagem da perda de eficácia afetiva. A frase continua compreensível; o que deixou de bastar é a linguagem partilhada nesta relação.","g":"m8-f13-3"},{"t":"vf","p":"O uso de uma forma verbal na primeira pessoa do plural prova que o poema relata a vida do autor.","v":false,"f":"A primeira pessoa constrói uma voz. Para afirmar um facto biográfico seria necessária uma fonte independente; a pessoa gramatical não basta.","g":"m8-f13-4"},{"t":"emparelhar","p":"Liga a observação ao efeito que permite investigar.","pares":[["Palavras tratadas como algo que se gasta","Metáfora de desgaste"],["Regresso de uma formulação","Insistência pela repetição"],["Passado confrontado com o presente","Contraste temporal"]],"f":"Cada recurso organiza uma relação: material e afetiva, repetida e insistente, passada e presente. Dar o nome ao recurso é o início, não a interpretação completa.","g":"m8-f13-5"},{"t":"ler","titulo":"Um modelo de interpretação","rot":"Lê e confronta","html":"<p><strong>Observação:<\/strong> a abertura aproxima palavras e desgaste. <strong>Relação:<\/strong> o que era partilhado já não chega para sustentar o vínculo. <strong>Limite:<\/strong> isso não demonstra que a linguagem seja inútil em todas as relações.<\/p><p>No poema completo, o silêncio recebe um tratamento diferente e a recordação de uma antiga abundância torna mais forte a perda atual. São contrastes que impedem uma leitura uniforme de tudo como fracasso.<\/p>"},{"t":"completar","p":"Completa a passagem da identificação para a interpretação.","frase":"A metáfora não descreve uma perda [1] de palavras: sugere uma perda de [2] na relação.","lacunas":[{"o":["material","temporal","corporal"],"c":0},{"o":["eficácia","correção","pronúncia"],"c":0}],"f":"O poema usa uma imagem material para pensar uma mudança afetiva. O efeito está na passagem entre esses dois planos.","g":"m8-f13-7"},{"t":"ordenar","p":"Ordena os passos de uma interpretação sustentada.","passos":["Localizar a imagem na abertura","Explicar a relação entre desgaste e vínculo","Confrontar essa leitura com os contrastes do poema","Indicar o que não é possível concluir sobre o autor"],"f":"A prova antecede a conclusão. O confronto com o conjunto pode afinar a leitura e impede transformar o poema numa biografia.","g":"m8-f13-8"},{"t":"sublinhar","p":"Neste exemplo didático criado, seleciona as duas palavras que fazem o contraste temporal.","frase":"Antes aproximava; agora afasta.","certas":[0,2],"f":"Antes e agora organizam o contraste. A frase é um exemplo criado para observar a estrutura, não um verso de Eugénio de Andrade.","g":"m8-f13-9"},{"t":"escolha","p":"Que efeito tem recordar a antiga abundância no meio de uma despedida?","o":["Realça a perda sentida no presente.","Anula a rutura anunciada pela voz.","Prova a felicidade futura do casal."],"c":0,"f":"O contraste dá espessura à perda: percebe-se o que existiu e deixou de existir. A recordação não garante um reencontro.","g":"m8-f13-10"},{"t":"vf","p":"Se o silêncio recebe um tratamento diferente das palavras gastas, a leitura deve reconhecer essa diferença.","v":true,"f":"Uma interpretação rigorosa não força todos os elementos a dizer o mesmo. A diferença do silêncio obriga a qualificar a ideia de desgaste.","g":"m8-f13-11"},{"t":"ler","titulo":"Muda uma decisão","rot":"Lê e confronta","html":"<p>Exemplos criados para esta lição: A: «Nada do que digo te alcança.» B: «Nunca ninguém consegue dizer nada a ninguém.»<\/p><p>A primeira formulação situa um limite numa relação. A segunda transforma esse limite numa regra universal. Ao escrever uma apreciação, confirma que não fizeste esta mudança sem prova.<\/p>"},{"t":"emparelhar","p":"Classifica as duas formulações criadas e uma decisão de leitura.","pares":[["Nada do que digo te alcança.","Limite situado numa relação"],["Nunca ninguém consegue dizer nada a ninguém.","Generalização sem limite"],["Procuro um contraste antes de concluir.","Procedimento de confirmação"]],"f":"O alcance de uma afirmação importa tanto como o tema. A leitura de um caso não autoriza automaticamente uma regra sobre toda a humanidade.","g":"m8-f13-13"},{"t":"escolha","p":"Que proposta criativa preserva a tensão estudada sem copiar o poema?","o":["Um encontro em que a saudação muda de efeito.","Uma lista de erros que impede qualquer comunicação.","Uma explicação que elimina de vez as ambiguidades."],"c":0,"f":"Repetir uma saudação em momentos distintos permite experimentar uma mudança de efeito. A criação transfere o contraste, sem imitar versos.","g":"m8-f13-14"},{"t":"completar","p":"Completa uma conclusão prudente.","frase":"Neste poema, a linguagem revela uma [1] do vínculo; não estabelece uma lei sobre [2].","lacunas":[{"o":["mudança","garantia","correção"],"c":0},{"o":["todas as relações","esta relação a dois","duas relações aqui"],"c":0}],"f":"A expressão neste poema delimita o objeto. A interpretação deve explicar este vínculo e não prometer uma teoria universal do amor.","g":"m8-f13-15"},{"t":"ordenar","p":"Organiza um pequeno plano de comparação com outro poema já lido.","passos":["Escolher uma imagem de cada poema","Explicar o efeito de cada imagem no seu contexto","Identificar uma semelhança e uma diferença","Redigir uma conclusão que mantenha essa diferença"],"f":"Comparar não é encontrar apenas um tema igual. Uma diferença bem sustentada pode ser a descoberta principal.","g":"m8-f13-16"},{"t":"escolha","p":"Que comentário merece revisão por confundir texto e vida?","o":["O autor viveu exatamente esta despedida.","A voz apresenta uma relação em desgaste.","O passado intensifica a perda no presente."],"c":0,"f":"A primeira frase afirma uma biografia sem prova. As outras descrevem relações observáveis na construção do poema.","g":"m8-f13-17"},{"t":"vf","p":"Se retirássemos a recordação da abundância passada, a perda presente manteria exatamente o mesmo efeito.","v":false,"f":"A recordação fornece um termo de comparação. Retirá-la reduziria a possibilidade de perceber a transformação do vínculo, mesmo que a despedida continuasse explícita.","g":"m8-f13-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Uma palavra pode manter o significado e perder a força numa relação.<\/p><p>Explica oralmente uma imagem, o contraste que a modifica e uma conclusão que o poema não autoriza. Na tarefa da unidade, compara os textos sem transformar o autor na voz de todos os versos.<\/p>"}];
