/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}

.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)}
/* 16/10/2026: um traço curto desenha-se debaixo do título de cada cartão de leitura (nada com «reduzir movimento») */
.jogo .ler .tit{padding-bottom:5px;background:linear-gradient(currentColor,currentColor) no-repeat 0 100%/0 2px;animation:titTraco .8s cubic-bezier(.2,.7,.2,1) .3s forwards}@keyframes titTraco{to{background-size:2.6em 2px}}@media (prefers-reduced-motion:reduce){.jogo .ler .tit{animation:none;background-size:2.6em 2px}} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

var PROJ=/[?&]projetar=1/.test(location.search);if(PROJ)document.body.classList.add("projetar");
var CASCA=EPICasca.pagina();

var K="epi-pt-longos";EPIJogo.montar({casca:CASCA,el:document.getElementById("baralho"),marca:"Caso",titulo:"O que a notícia não diz",itens:[{"t":"ler","rot":"Abre","titulo":"O que a notícia não diz","html":"<p class=\"etq-m\">Módulo 8 · Pensar devagar · cerca de 25 min</p><figure class=\"fig-rev \"><span class=\"fr-moldura\"><img src=\"https://pedrohfernandes-klk.github.io/pt/img/fontes/goya-tres-de-maio-1814.jpg\" alt=\"O quadro de que parte a carta de Jorge de Sena aos filhos.\" loading=\"lazy\" decoding=\"async\" style=\"object-position:45% 45%\"></span><figcaption><span class=\"fr-leg\">Goya, 3 de maio de 1808: a pintura que testemunha o que a notícia não diz.</span> <span class=\"fr-cred\">Domínio público. <a href=\"https://commons.wikimedia.org/wiki/File:El_tres_de_mayo_de_1808_en_Madrid.jpg\" rel=\"noopener\">commons.wikimedia.org</a></span></figcaption></figure><p class=\"abre\">Três poetas diante do mesmo mar, da mesma luz e dos mesmos mortos.</p><p class=\"pergunta-c\">O que pode um poema testemunhar que uma notícia não pode?</p><p>Uma notícia dá o lugar, a hora e o número. Um poema pode não dar nenhum dos três. Mesmo assim, a lição chama «testemunha» a Jorge de Sena. Este exercício põe os três poetas do módulo diante de uma notícia inventada e pergunta o que falta a cada um dos lados.</p><p class=\"nota-pensa\">Lê, compara e experimenta. Podes explicar as tuas escolhas em voz alta ou no caderno. Nas atividades de interpretação, apoia a tua leitura no texto; não precisas de adivinhar uma resposta única. Leva o tempo que precisares.</p>","g":0},{"t":"ler","rot":"Uma voz no mar","titulo":"Trinta segundos de rádio","html":"<p>Imagina uma notícia de rádio, de trinta segundos, inventada para este exercício: um barco no Mediterrâneo, um número de pessoas a bordo, um lugar, uma hora. A voz lê os factos e passa à notícia seguinte. Nada do que ouviste está errado. E no entanto falta qualquer coisa, e é isso que vais procurar.</p><p>Agora lê a abertura de «Prece no Mediterrâneo». O mar é o mesmo. Quem fala não é o jornalista: é quem vai no barco, e fala como se rezasse. A forma é a de uma oração antiga, com «Senhor» e «dai-nos»; o pedido é novo.</p><blockquote class=\"cit\"><p>Em vez de peixes, Senhor,</p><p>dai-nos a paz,</p></blockquote><p class=\"fonte-x\">Ana Luísa Amaral, «Prece no Mediterrâneo», versos 1 e 2. Ágora (2019); Seara Nova, n.º 1760</p>","g":1},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<span class=\"respira\" aria-hidden=\"true\"></span><p class=\"q-pensa\">O que muda quando quem fala é quem vai no barco, e não quem dá a notícia?</p><div class=\"dica\">Pensa em quem pede, e a quem.</div><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":2},{"t":"escolha","rot":"Uma voz no mar","p":"Comparada com a notícia inventada, o que tem a prece que a notícia não tem?","o":["Números mais exatos sobre quem vai a bordo","Uma voz de dentro do barco, que pede em vez de informar","A explicação das causas da viagem","O lugar e a hora da travessia"],"c":1,"f":"A prece dá uma voz de dentro, que pede paz, um mar sem perigo e gente que acolha; a notícia dá números, lugar e hora, e nenhuma voz. As causas da viagem não estão em nenhum dos dois textos.","g":3},{"t":"vf","p":"A prece de Ana Luísa Amaral retoma a forma da oração antiga para a deitar fora e falar de outra maneira.","v":false,"f":"Falso: a forma fica, com a apóstrofe «Senhor» e o pedido «dai-nos». O que muda é o pedido, em vez de peixes a paz, e quem fala, alguém a quem a tradição não dava voz.","g":4},{"t":"ler","rot":"Diante de um quadro","titulo":"Um pai, um quadro, um verso","html":"<p>Jorge de Sena saiu de Portugal em 1959 e escreveu de longe, como quem toma nota. Na «Carta a meus filhos sobre os fuzilamentos de Goya» parte de um quadro: Goya pintou os fuzilamentos de 1808, em Madrid. Sena não estava lá, nasceu muito depois. E escreve aos filhos sobre um mundo que ainda não existe.</p><p>A lição chama a isto a figuração do poeta como testemunha: aquele que viu e não deixa esquecer. Procuram-se nela três marcas: lugar, tempo histórico e juízo moral. Onde, quando, e o que está certo ou errado.</p><blockquote class=\"cit\"><p>Não sei, meus filhos, que mundo será o vosso.</p></blockquote><p class=\"fonte-x\">Jorge de Sena, «Carta a meus filhos sobre os fuzilamentos de Goya», verso 1. Metamorfoses (1963); Correio IMS</p>","g":5},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<span class=\"respira\" aria-hidden=\"true\"></span><p class=\"q-pensa\">Sena não estava em Madrid em 1808. Pode ser testemunha de uma coisa que não viu?</p><div class=\"dica\">A lição diz: viu e não deixa esquecer. Pergunta-te o que foi que ele viu.</div><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":6},{"t":"posicao","rot":"Diante de um quadro","cena":"_Sena, a um quadro de distância dos mortos e a cinquenta anos de distância dos filhos a quem escreve._","p":"Um poeta pode ser testemunha de um fuzilamento que só viu num quadro?","opcoes":[{"rotulo":"Sim: testemunha é quem não deixa esquecer","comentario":"Permite ver que a testemunha de Sena não é a do tribunal: viu o quadro, viu o que o quadro faz a quem olha, e escreve para que isso dure. Deixa de fora a diferença entre ver um facto e ver uma pintura."},{"rotulo":"Não: testemunha é quem estava lá","comentario":"Guarda o sentido forte da palavra e obriga a perguntar o que é então Sena: leitor, herdeiro, comentador. Deixa de fora que o poema diz onde, quando e o que está errado, as três marcas da lição."},{"rotulo":"Depende do que se testemunha","comentario":"Sena não testemunha o fuzilamento: testemunha o que ele ainda faz, um episódio entre mil. Esta posição explica melhor o verso de abertura, mas exige dizer de que é feito esse «ainda»."}],"g":7},{"t":"escolha","rot":"Diante de um quadro","p":"Das três marcas da testemunha, qual delas a notícia inventada do início não traz?","o":["O lugar","O tempo: o dia e a hora","O juízo moral","Nenhuma: traz as três"],"c":2,"f":"A notícia diz onde e a que horas: tem lugar e tempo. Não diz o que está certo ou errado, porque não é esse o seu papel. O poema de Sena diz: a alegria de estar vivo importa mais do que tudo, e que ninguém morra para outro viver mais.","g":8},{"t":"emparelhar","rot":"Diante de um quadro","p":"Liga cada poema do módulo ao que nele se testemunha.","pares":[["«Uma pequenina luz»","uma luz que brilha apesar de quem sopra para a apagar"],["«Carta a meus filhos»","os fuzilados de Goya, um episódio entre mil"],["«Prece no Mediterrâneo»","a voz de quem atravessa o mar hoje"],["«As Palavras»","as próprias palavras, frágeis, à espera de quem as recolha"]],"f":"Quatro poemas, quatro coisas vistas: a luz, os mortos, a travessia, as palavras. Só o último não fala do mundo: fala do instrumento com que os outros três falam dele.","g":9},{"t":"ler","rot":"Uma luz","titulo":"Porque a querem apagar?","html":"<p>No poema de Jorge de Sena, uma luz pequena continua a brilhar apesar de haver quem a queira apagar.</p><p>Relê o poema na edição que estás a usar. Repara no contraste entre a fragilidade da luz e a vontade de a apagar.</p><blockquote class=\"cit\"><p>Apenas como elas.</p><p>Mas brilha.</p></blockquote><p class=\"fonte-x\">Jorge de Sena, «Uma pequenina luz», última estrofe. RTP Ensina, programa Voz</p>","g":10},{"t":"ler","rot":"Escolhe uma palavra","titulo":"Onde sentes a ameaça?","html":"<p>Que palavra te faz sentir que a luz está ameaçada? Escolhe uma e explica porquê.</p><div class=\"explora-palavras\" data-explora-palavras><p class=\"explora-frase\" aria-label=\"Frase para explorar\"><button type=\"button\" aria-pressed=\"false\">Há</button> <button type=\"button\" aria-pressed=\"false\">quem</button> <button type=\"button\" aria-pressed=\"false\">sopre</button> <button type=\"button\" aria-pressed=\"false\">com</button> <button type=\"button\" aria-pressed=\"false\">raiva</button> <button type=\"button\" aria-pressed=\"false\">para</button> <button type=\"button\" aria-pressed=\"false\">a</button> <button type=\"button\" aria-pressed=\"false\">apagar.</button></p><p class=\"explora-nota\">Frase de trabalho: paráfrase de uma passagem do poema, não uma citação.</p><p class=\"explora-resposta\" role=\"status\" aria-live=\"polite\">Podes experimentar outra palavra antes de avançar.</p></div><p>Diz a tua razão a um colega ou escreve-a no caderno. Uma palavra só ganha força quando explicas o que te fez reparar nela.</p><details class=\"explora-apoio\"><summary>Uma pista, se precisares</summary><p>Podes olhar para a ação, para a emoção ou para o que alguém pretende fazer. Não tens de escolher a mesma palavra que o teu colega.</p></details>","g":11},{"t":"ler","rot":"Muda uma palavra","titulo":"Raiva ou medo?","html":"<p>Lê estas duas versões em voz alta, ou acompanha-as em silêncio.</p><div class=\"explora-versoes\"><p>Há quem sopre com <strong>raiva</strong> para a apagar.</p><p>Há quem sopre com <strong>medo</strong> para a apagar.</p></div><p>O gesto é o mesmo. A intenção também?</p><p>Escolhe uma versão. Imagina quem está a soprar e explica o que essa pessoa pode estar a sentir. Podes também propor outra palavra.</p><p class=\"explora-nota\">Estas versões são uma experiência de escrita a partir da paráfrase. Não substituem os versos de Sena.</p><details class=\"explora-apoio\"><summary>Voltar ao poema</summary><p>Que palavras do poema apoiam a tua leitura? Distingue o que o texto te permite dizer daquilo que acrescentaste ao imaginar a situação.</p></details>","g":12},{"t":"ler","rot":"As palavras","titulo":"Quem as ouve?","html":"<p>Eugénio de Andrade não escreve sobre fuzilamentos nem sobre barcos. «As Palavras» é uma arte poética: um poema sobre a própria poesia. As palavras são como um cristal; umas ferem e queimam, outras são leves como orvalho; chegam em segredo, carregadas de memória, e navegam sem segurança. O poema acaba com duas perguntas sem resposta: quem as ouve, quem as recolhe.</p><blockquote class=\"cit\"><p>São como um cristal,</p><p>as palavras.</p></blockquote><p class=\"fonte-x\">Eugénio de Andrade, «As Palavras», versos 1 e 2. Até Amanhã; RTP Ensina, programa Voz</p>","g":13},{"t":"ler","rot":"Repara no final","titulo":"Uma pergunta fica à espera","html":"<p>Relê as perguntas que fecham «As Palavras», de Eugénio de Andrade.</p><p>O que muda por o poema terminar a perguntar, em vez de responder?</p><p>Escolhe uma das perguntas e lê-a com dois tons diferentes. Podes explicar os tons sem ler em voz alta.</p>","g":14},{"t":"ler","rot":"Escolhe uma leitura","titulo":"O que precisam as palavras?","html":"<p>Escolhe uma destas pistas, ou propõe outra. Sustenta a tua leitura numa imagem ou expressão do poema.</p><details class=\"explora-apoio\"><summary>Palavras que guardam memória</summary><p>Que imagem te faz pensar no que as palavras trazem consigo? Explica o que essa imagem acrescenta à ideia de memória.</p></details><details class=\"explora-apoio\"><summary>Palavras à espera de alguém</summary><p>Que efeito têm as perguntas finais? Pensa no lugar que deixam a quem lê ou ouve.</p></details><p>Compara a tua escolha com a de um colega. Podem chegar a leituras diferentes e ambas terem apoio no texto.</p>","g":15},{"t":"ler","rot":"Constrói uma ideia","titulo":"Do verso à tua leitura","html":"<p>Escolhe um dos poemas que leste. Prepara uma explicação curta com três elementos:</p><ul class=\"explora-lista\"><li>Uma ideia tua sobre o poema.</li><li>Uma palavra, imagem ou passagem que a apoie.</li><li>A ligação entre essa passagem e a tua ideia.</li></ul><p>Podes começar pelo verso ou pela ideia. O importante é que quem te ouve consiga seguir a ligação.</p><p>Explica oralmente ou no caderno. Depois pergunta: alguém poderia ler a mesma passagem de outra maneira?</p>","g":16},{"t":"ler","rot":"Põe à prova","titulo":"A objeção","html":"<p>Agora a melhor objeção, dita a sério. Uma notícia pode salvar vidas: diz onde está o barco, e alguém vai lá. O poema chega tarde e não muda nada. Pior: a testemunha de um tribunal jura dizer a verdade; o poeta pode inventar. Sena parte de um quadro, não de um facto que viu. Amaral empresta a sua voz a alguém que não é ela.</p><p>Se a objeção tiver razão, «testemunha» é uma palavra bonita para «opinião com ritmo», e a lição de Sena está a chamar prova ao que é só emoção bem escrita. Não a afastes já. Decide primeiro, em silêncio, se um poema pode mentir, e só depois vê as posições.</p>","g":17},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<span class=\"respira\" aria-hidden=\"true\"></span><p class=\"q-pensa\">Um poema pode mentir? E se puder, pode ainda assim testemunhar?</p><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":18},{"t":"posicao","rot":"Põe à prova","cena":"","p":"A objeção diz: o poeta inventa, a testemunha jura. O que respondes?","opcoes":[{"rotulo":"A objeção tem razão","comentario":"Permite levar a sério a diferença entre facto e poema: sem verificação, o poema vale o que vale quem o lê. Deixa de fora que a lição procura no poema marcas de lugar, de tempo e de juízo, e as encontra."},{"rotulo":"A objeção confunde duas verdades","comentario":"A verdade do facto, que a notícia dá, e a verdade do que o facto faz a quem olha, que a notícia não pode dar. Sena viu o quadro de verdade; o que escreve sobre o que viu não é mentira. Deixa de fora o caso de Amaral, que imagina uma voz."},{"rotulo":"Vale para Amaral, não para Sena","comentario":"Separa os dois casos: o quadro de Goya existe, a voz da jangada é dada por quem não vai nela. É a posição mais exigente, mas tem de explicar porque é que dar voz a quem não a tinha seria inventar e não testemunhar."}],"g":19},{"t":"escolha","rot":"Põe à prova","p":"Que resposta à objeção está já na «Carta a meus filhos», segundo a lição?","o":["Os fuzilados são um episódio entre mil: o poema não relata um facto, lembra todos os perseguidos e mortos por uma ideia, uma esperança ou a fome","O poema cita o nome e a idade de cada fuzilado","Sena esteve em Madrid e viu o quadro ser pintado","O quadro de Goya é uma fotografia, logo é prova"],"c":0,"f":"Um episódio entre mil: a carta não concorre com a notícia de 1808, lembra o que se repete. Os nomes não são o assunto do poema; Sena não viu pintar o quadro; e uma pintura não é fotografia, é já um olhar sobre o facto.","g":20},{"t":"vf","p":"Em «Prece no Mediterrâneo», quem fala é a poeta, a contar o que viu da praia.","v":false,"f":"Falso: quem fala é quem atravessa o mar, numa jangada, e pede. A poeta dá voz a quem a tradição não dava. É exatamente isso que a objeção ataca, e é também o que o poema pode fazer e a notícia não.","g":21},{"t":"ler","rot":"Compara","titulo":"O caso ao contrário","html":"<p>Vira o caso. Imagina a notícia dos trinta segundos escrita como um poema: em vez de um número, uma voz; em vez de uma hora, um pedido; em vez do lugar, um mar «que é também nosso». Ouves isto na rádio, de manhã, no lugar das notícias.</p><p>A lição de Amaral acaba onde o poema acaba: o pedido volta, um pão e um peixe, mas já não é o mesmo. Lê o último verso e pergunta-te o que perdeu a notícia ao virar poema.</p><blockquote class=\"cit\"><p>que é também nosso</p></blockquote><p class=\"fonte-x\">Ana Luísa Amaral, «Prece no Mediterrâneo», último verso. Ágora (2019); Seara Nova, n.º 1760</p>","g":22},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<span class=\"respira\" aria-hidden=\"true\"></span><p class=\"q-pensa\">Se a rádio desse o poema em vez da notícia, o que ficavas sem saber?</p><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":23},{"t":"escolha","rot":"Compara","p":"O que se perde se a notícia se tornar poema?","o":["O lugar, a hora e o número, que deixam verificar e agir","A voz de quem atravessa o mar","O juízo sobre o que está certo ou errado","Nada: o poema diz tudo o que a notícia diz, e melhor"],"c":0,"f":"Perde-se o que se verifica e o que permite agir: onde, quando, quantos. A voz e o juízo são o que o poema traz, não o que perde. E «nada» é a resposta de quem não ouviu a objeção: os dois textos fazem coisas diferentes, e nenhum substitui o outro.","g":24},{"t":"posicoes","rot":"Compara","cena":"_O mesmo barco, a mesma manhã, três pessoas a dizê-lo._","p":"Quem sabe o quê, diante do mesmo barco?","papeis":[{"rotulo":"Quem escreve a notícia","texto":"Sabe o lugar, a hora e o número, e pode verificá-los. Decide o que cabe em trinta segundos. Não pode dizer o que está certo ou errado, nem falar por quem vai a bordo."},{"rotulo":"Quem escreve o poema","texto":"Não sabe o número nem precisa dele. Pode dar uma voz a quem não a tem, retomar uma oração antiga e trocar-lhe o pedido, dizer o que importa. Não pode ser verificado, e sabe-o."},{"rotulo":"Quem lê os dois","texto":"É o único que tem os dois textos. Sabe onde e quando, e sabe o que o barco pede. Decide se recolhe a voz ou se fica só com o número."}],"fb":"A comparação mostra que o poema não compete com a notícia: começa onde ela acaba. E mostra que a terceira pessoa é a única que pode juntar as duas. Eugénio perguntava quem recolhe as palavras: é quem lê.","g":25},{"t":"escolha","rot":"Compara","p":"Então: o que pode um poema testemunhar que uma notícia não pode?","o":["O que o facto faz a quem o vive ou a quem o olha, dito por uma voz que pede, lembra ou julga","O número exato de pessoas e a hora certa","As causas do acontecimento, com provas","O mesmo que a notícia, mas com rima"],"c":0,"f":"A voz de dentro, a memória que não deixa esquecer, o juízo sobre o que importa: é isso que a notícia não pode dar sem deixar de ser notícia. Número e hora são dela; as causas não estão em nenhum dos textos; e a rima não é o que separa um poema de uma notícia.","g":26},{"t":"vf","p":"Sena, Eugénio e Amaral respondem à pergunta deste exercício da mesma maneira.","v":false,"f":"Falso: Sena testemunha o que viu e não deixa esquecer; Amaral dá voz a quem atravessa o mar; Eugénio pergunta quem recolhe as palavras. Três figurações do poeta, testemunha, voz que reescreve e artesão, para uma só pergunta.","g":27},{"t":"ler","rot":"Para levar","escuro":true,"titulo":"O que fica","html":"<p class=\"levar\">A notícia diz onde, quando e quantos. O poema diz o que isso faz a quem lá vai, e só testemunha se alguém o recolher. Esse alguém és tu.</p><p>Da próxima vez que ouvires trinta segundos de rádio sobre um barco, pergunta-te quem está a falar e quem não está.</p><p>A pergunta de onde partiste: O que pode um poema testemunhar que uma notícia não pode? Responde-lhe agora em voz alta, numa frase, a alguém.</p><h3>Fontes</h3><ul class=\"fontes-l\"><li><a href=\"https://web.archive.org/web/20260509201405/https://ensina.rtp.pt/artigo/jorge-sena-poesia/\" rel=\"noopener\">Jorge de Sena, poesia (RTP Ensina, programa Voz)</a></li><li><a href=\"https://correio.ims.com.br/a-carta-poema-de-jorge-de-sena-por-lyza-brasil/\" rel=\"noopener\">«Carta a meus filhos sobre os fuzilamentos de Goya» (Correio IMS)</a></li><li><a href=\"https://searanova.publ.pt/2023/08/07/poesia-prece-no-mediterraneo/\" rel=\"noopener\">Ana Luísa Amaral, «Prece no Mediterrâneo» (Seara Nova)</a></li></ul>","g":28}],chave:"epi-pt-longos-m8-poema-testemunha",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/pt/m8/",percursoRotulo:"Percurso do módulo",voltarRotulo:"Voltar ao percurso do módulo",depois:"<div class=\"c\"><p class=\"rot\">Pensaste</p><p>A notícia diz onde, quando e quantos. O poema diz o que isso faz a quem lá vai, e só testemunha se alguém o recolher. Esse alguém és tu.</p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/m8/#m8-poema-testemunha\">Voltar ao percurso d
