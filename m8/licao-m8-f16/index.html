var K="licao-m8-f16",CARTOES=[{"t":"ler","titulo":"Recorte de George","rot":"Abre","html":"<p class=\"abre\">A descrição começa por um rosto e acaba por uma correção de palavras. Quem está a escolher a maneira de nomear a idade?<\/p><p>Vais analisar um recorte curto de «George», de Maria Judite de Carvalho, e distinguir aquilo que se vê daquilo que se pensa.<\/p>"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>Maria Judite de Carvalho é a autora de <i>Seta Despedida<\/i>, onde se inclui «George» (1995). No conto, a narração cruza perceção e vida interior.<\/p><p><strong>Narrador<\/strong> é a instância que conta. <strong>Personagem<\/strong> participa no mundo narrado. A voz narrativa pode aproximar-se do pensamento de uma personagem sem o apresentar como diálogo. Uma <strong>inferência<\/strong> precisa de indícios e tem limites.<\/p>"},{"t":"ler","titulo":"As palavras confirmadas","rot":"Lê e confronta","html":"<blockquote class=\"prosa\">«À sua frente uma senhora de idade, primeiro esboçada, finalmente completa, olha-a atentamente. De idade não, George detesta eufemismos, mesmo só pensados, uma mulher velha.»<\/blockquote><p>Maria Judite de Carvalho, «George», in <i>Seta Despedida<\/i>, Mem Martins, Europa-América, 1995. Recorte de 25 palavras, tal como se lê na página 1 do documento DGE, #EstudoEmCasa, Português, 12.º ano, Bloco 27. A fonte não indica a página da edição.<\/p><p><a href=\"https://estudoautonomo.dge.mec.pt/sites/default/files/inline-files/27_Portugu%C3%AAs.%C2%BA_ano_O%20conto%20George,%20de%20Maria%20Judite%20de%20Carvalho%20(2).pdf\" target=\"_blank\" rel=\"noopener\">Consulta o excerto oficial da DGE<\/a>. O resto do conto lê-se na edição da turma. As atividades seguintes usam apenas o recorte apresentado.<\/p>"},{"t":"escolha","p":"Que mudança ocorre entre a primeira e a segunda frase?","o":["Da perceção da figura para a escolha de palavras.","Da apresentação de George para uma fala da autora real.","Da recordação de infância para uma notícia histórica."],"c":0,"f":"A primeira frase apresenta a figura observada. A segunda recusa uma expressão e explicita a atitude de George perante os eufemismos.","g":"m8-f16-3"},{"t":"vf","p":"O recorte apresenta uma fala pronunciada em voz alta por George.","v":false,"f":"A referência a palavras apenas pensadas impede tomar a passagem por diálogo pronunciado. O leitor tem acesso a uma avaliação interior.","g":"m8-f16-4"},{"t":"emparelhar","p":"Liga cada elemento do recorte ao que permite observar.","pares":[["primeiro / finalmente","Progressão da perceção"],["George detesta eufemismos","Atitude da personagem"],["mesmo só pensados","Plano interior das palavras"]],"f":"Os marcadores temporais organizam a perceção; a referência a George atribui a atitude; a indicação do pensamento impede confundir o recorte com fala audível.","g":"m8-f16-5"},{"t":"ler","titulo":"Uma correção que caracteriza","rot":"Lê e confronta","html":"<p>Um eufemismo atenua uma expressão potencialmente dura. No recorte, a designação mais atenuada da idade é recusada e substituída por uma nomeação direta.<\/p><p>Modelo: observa a recusa, identifica a personagem a quem é atribuída e interpreta a relação com as palavras. Não concluas que já conheces todos os sentimentos de George sobre o envelhecimento.<\/p>"},{"t":"completar","p":"Completa a análise sem confundir narrador e personagem.","frase":"A narração permite conhecer uma [1] de George, embora não apresente uma [2] pronunciada.","lacunas":[{"o":["avaliação","biografia","entrevista"],"c":0},{"o":["fala","rima","cena"],"c":0}],"f":"O pensamento pode ser representado pela narração. Não precisa de surgir entre marcas de diálogo para caracterizar a personagem.","g":"m8-f16-7"},{"t":"ordenar","p":"Ordena o percurso da nomeação no recorte.","passos":["Surge uma designação atenuada da idade","Essa designação é recusada","A atitude perante eufemismos é atribuída a George","Surge uma designação direta da idade"],"f":"A ordem torna visível a correção lexical. É essa operação, mais do que um retrato físico completo, que abre o acesso à atitude da personagem.","g":"m8-f16-8"},{"t":"sublinhar","p":"Seleciona, no recorte, a palavra que nega a primeira designação.","frase":"De idade não, George detesta eufemismos,","certas":[2],"f":"Não marca a recusa. A vírgula acompanha uma correção que deixa o leitor seguir o movimento do pensamento.","g":"m8-f16-9"},{"t":"escolha","p":"Que conclusão tem apoio suficiente neste recorte?","o":["George recusa a expressão atenuada sobre a idade.","George conhece toda a história da mulher observada.","George diz à mulher aquilo que pensa da sua idade."],"c":0,"f":"A recusa é explícita e atribuída a George. Conhecer uma história inteira ou falar à mulher são ações que este recorte não comprova.","g":"m8-f16-10"},{"t":"vf","p":"A figura tornar-se completa na perceção significa que a narração já contou toda a sua vida.","v":false,"f":"A completude refere-se à apresentação da figura observada. Não equivale a conhecer a sua biografia nem a resolver o sentido do encontro.","g":"m8-f16-11"},{"t":"ler","titulo":"Experimenta uma mudança","rot":"Lê e confronta","html":"<p>Exemplos didáticos criados: A: «Ela chamou-lhe velha.» B: «Pensou na palavra velha, mas não a disse.»<\/p><p>A mudança altera o que acontece entre as personagens e o acesso do leitor à interioridade. Não são versões do conto: servem para testar a diferença entre dizer e pensar.<\/p>"},{"t":"emparelhar","p":"Associa cada exemplo criado ao seu efeito narrativo.","pares":[["Ela chamou-lhe velha.","Ato verbal dirigido a alguém"],["Pensou na palavra, mas não a disse.","Acesso a um pensamento não pronunciado"],["O narrador não revela o que ela pensa.","Restrição do acesso à interioridade"]],"f":"A escolha narrativa muda a informação disponível. Uma palavra pensada e uma palavra pronunciada podem ter consequências diferentes na relação.","g":"m8-f16-13"},{"t":"escolha","p":"Que reescrita seria necessária para restringir a cena ao observável?","o":["Retirar a informação sobre o pensamento de George.","Acrescentar pensamentos de todas as outras pessoas.","Apresentar como diálogo tudo o que George pensa."],"c":0,"f":"Uma descrição limitada ao observável não afirma pensamentos. Transformar pensamento em diálogo muda a ação; não é apenas retirar acesso interior.","g":"m8-f16-14"},{"t":"completar","p":"Completa o limite da leitura.","frase":"O recorte caracteriza a relação de George com uma [1]; para interpretar o encontro no conto, é necessária a leitura do [2].","lacunas":[{"o":["expressão","profissão","paisagem"],"c":0},{"o":["conjunto","prefácio","glossário"],"c":0}],"f":"O recorte permite uma análise lexical e narrativa precisa. O papel do encontro na estrutura da obra exige ler além dele.","g":"m8-f16-15"},{"t":"ordenar","p":"Prepara uma resposta breve sobre a caracterização de George.","passos":["Identificar a correção de palavras","Atribuir a recusa à personagem","Explicar como a narração mostra o pensamento","Limitar a conclusão ao recorte"],"f":"A resposta liga prova, atribuição e efeito. Evita completar lacunas com acontecimentos ou motivações que não foram apresentados.","g":"m8-f16-16"},{"t":"escolha","p":"Que pergunta permite prosseguir a leitura da edição da turma?","o":["Como se liga este encontro aos outros momentos do conto?","Que pormenor confirma uma biografia já provada por este recorte?","Porque corresponde toda a voz narrativa à opinião da autora?"],"c":0,"f":"A primeira pergunta procura relações no conjunto. As outras pressupõem conclusões que o recorte não autoriza.","g":"m8-f16-17"},{"t":"vf","p":"Substituir no recorte a correção por uma descrição apenas física retiraria uma pista sobre a atitude de George.","v":true,"f":"A recusa de uma designação mostra uma relação com a linguagem. Uma descrição apenas física poderia conservar o aspeto da figura e perder essa pista de interioridade.","g":"m8-f16-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Uma correção de palavras pode abrir o pensamento de uma personagem.<\/p><p>Explica oralmente o que muda entre observar, pensar e dizer. Quando leres o conto inteiro, confirma ou revê a tua interpretação deste encontro.<\/p>"}];
