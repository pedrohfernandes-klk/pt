<script>
(function(){
"use strict";
var ID="M8", D=[{"t":"Os autores","q":[["Eugénio de Andrade é o nome literário de…",["José Fontinhas","José Saramago","Jorge de Sena","Mário Cesariny"],0,"José Fontinhas."],["Jorge de Sena saiu de Portugal em 1959 e viveu…",["no Brasil e nos Estados Unidos","sempre em Lisboa","em Moçambique","em França"],0,"Morreu na Califórnia, em 1978."],["Metamorfoses (1963), de Jorge de Sena, é conhecido por…",["poemas sobre obras de arte","ser um romance policial","ser uma peça de teatro","ser um diário"],0,"Poesia a partir de pinturas, esculturas e objetos."],["Ana Luísa Amaral recebeu, em 2021, o…",["Prémio Rainha Sofia de Poesia Ibero-americana","Prémio Nobel","Óscar","Prémio Pessoa"],0,"Prémio Rainha Sofia."],["Maria Judite de Carvalho escreveu sobretudo…",["contos e crónicas","epopeias","sermões","teatro medieval"],0,"Contos, novelas e crónicas."],["Em «George», a protagonista é…",["uma pintora","uma médica","uma professora de Português","uma cantora"],0,"George é pintora."]]},{"t":"O conto","q":[["O conto é…",["uma narrativa breve, com poucas personagens e ação concentrada","um poema longo","um texto de opinião","um romance em vários volumes"],0,"Brevidade e concentração."],["O narrador heterodiegético…",["não participa na história","é a personagem principal","é sempre o autor","fala só na 1.ª pessoa"],0,"Conta de fora."],["A focalização interna mostra…",["a perspetiva de uma personagem","tudo o que acontece em todo o lado","só diálogos","só a paisagem"],0,"Ponto de vista de uma personagem."],["Em «George», os encontros com Gi e Georgina representam…",["o passado e o futuro da mesma mulher","três irmãs","três amigas de escola","três pintoras diferentes"],0,"Identidade e tempo."],["O tempo psicológico é…",["o tempo vivido e sentido pela personagem","o tempo do relógio","a data de publicação","a duração da leitura"],0,"Memória e subjetividade."],["A analepse é…",["um recuo no tempo","um salto para o futuro","uma descrição","uma elipse"],0,"Flashback."]]},{"t":"Valor aspetual","q":[["«Pintou o quadro.»",["perfetivo","imperfetivo","habitual","genérico"],0,"Situação acabada."],["«Estava a pintar quando tocaram.» («estava a pintar»)",["imperfetivo","perfetivo","iterativo","genérico"],0,"Situação em curso."],["«Costumava pintar de manhã.»",["habitual","perfetivo","iterativo","genérico"],0,"É costume."],["«Bateu três vezes à porta.»",["iterativo","habitual","imperfetivo","genérico"],0,"Repetição contada."],["«Os pintores olham antes de pintar.»",["genérico","perfetivo","iterativo","habitual"],0,"Vale sempre e para todos."],["«Todas as noites relia a carta.»",["habitual","iterativo","perfetivo","genérico"],0,"«Todas as noites»: costume, sem número de vezes."]]},{"t":"Anáfora, catáfora e elipse","q":[["«A pintora chegou. Ela vinha só.» «Ela» é…",["anáfora","catáfora","elipse","deixis"],0,"Retoma um referente anterior."],["«Quando ela chegou, a pintora sorriu.» Sabendo que «ela» e «a pintora» são a mesma pessoa, «ela» é…",["catáfora","anáfora","elipse","vocativo"],0,"Antecipa um referente que só aparece depois. Sem essa informação, «ela» podia ser outra pessoa: a posição, por si, não prova nada."],["«O João leu o conto e [–] gostou.» O espaço vazio é…",["elipse","catáfora","anáfora lexical","deixis"],0,"Omissão de um termo recuperável."],["«Li Eugénio de Andrade. O poeta fala da luz.» «O poeta» é…",["anáfora lexical","catáfora","elipse","deixis temporal"],0,"Retoma com outra expressão."],["A anáfora contribui para…",["a coesão referencial","a rima","o ritmo apenas","a pontuação"],0,"Liga partes do texto."],["«Disse-lhe isto: vou partir.» «isto» é…",["catáfora","anáfora","elipse","vocativo"],0,"Anuncia o que vem a seguir."]]},{"t":"Poesia: recursos","q":[["Na metáfora, uma coisa é dita através de outra, sem se avisar que é uma imagem. Exemplo:",["«o teu olhar é um rio»","«o teu olhar é como um rio»","«que olhar!»","«olhar, olhar, olhar»"],0,"Identifica-se pela imagem que substitui, não pela falta da palavra «como»."],["A comparação usa…",["uma palavra comparativa («como», «tal qual»)","sempre rima","três adjetivos","um vocativo"],0,"Ex.: «nítido como um girassol»."],["A aliteração é…",["a repetição de sons consonânticos","uma oposição de ideias","uma enumeração","uma pergunta retórica"],0,"Efeito sonoro."],["A anáfora (recurso estilístico) é…",["repetir palavras no início de versos","retomar um pronome","cortar palavras","usar maiúsculas"],0,"Ex.: versos que começam com a mesma palavra."],["O verso livre…",["não segue métrica fixa","tem sempre 10 sílabas","é obrigatório no soneto","rima sempre"],0,"Liberdade métrica."],["A personificação atribui…",["características humanas a seres não humanos","cores a sons","números a palavras","rimas a prosa"],0,"Ex.: «as flores respondem»."]]},{"t":"As quatro lentes","q":[["Perguntar «que mundo e que problemas do seu tempo aparecem?» é usar a lente…",["das representações do contemporâneo","da tradição literária","da arte poética","das figurações do poeta"],0,"O poema e o seu tempo."],["Um poema que retoma a forma de uma prece antiga lê-se pela lente…",["da tradição literária","da arte poética","do contemporâneo","das figurações do poeta"],0,"O que vem de textos anteriores."],["«Como se vê quem escreve?» é a pergunta…",["das figurações do poeta","da tradição literária","do contemporâneo","da arte poética"],0,"Testemunha, artesão, voz de outros."],["Um poema que fala das palavras e da poesia é…",["uma arte poética","uma écloga","uma epopeia","uma crónica"],0,"A poesia a falar de si."],["Em Jorge de Sena, quem escreve vê-se sobretudo como…",["testemunha do seu tempo","pastor","navegador","trovador"],0,"Dar conta do que se viu."],["Em Ana Luísa Amaral, a tradição é…",["retomada e mudada, com outra voz","copiada sem alterações","recusada por inteiro","ignorada"],0,"Reescrever a tradição."]]},{"t":"«George»: três idades","q":[["Os três nomes da protagonista são…",["Gi, George e Georgina","Ana, Maria e Rosa","Inês, Teresa e Mariana","Lídia, Cloé e Neera"],0,"Um nome para cada idade."],["Gi é a protagonista…",["na juventude","na velhice","na idade adulta","em criança de colo"],0,"O passado."],["Georgina é a protagonista…",["na velhice","na juventude","na idade adulta","noutro país"],0,"O futuro."],["O conto não diz se os encontros são reais, lembrados ou imaginados. Isso…",["obriga o leitor a decidir, com provas","é um erro da autora","prova que são reais","não tem importância"],0,"A sugestão pesa mais do que a explicação."],["Uma cena lembrada reconhece-se muitas vezes…",["pelo pretérito imperfeito","pelo imperativo","pelas maiúsculas","pelo tamanho das frases"],0,"O tempo do verbo é uma pista."],["«Metamorfoses da figura feminina» quer dizer…",["as mudanças da mesma mulher ao longo da vida","três mulheres diferentes","uma mulher que vira animal","uma troca de roupa"],0,"O que muda e o que permanece."]]},{"t":"Apreciação crítica e texto de opinião","q":[["A apreciação crítica avalia…",["uma obra concreta","uma questão geral","uma pessoa","uma lei"],0,"Um livro, um filme, uma leitura."],["Os quatro movimentos da apreciação crítica são…",["identificar, descrever, comentar, julgar","tese, argumento, objeção, apelo","exórdio, exposição, confirmação, peroração","princípio, meio, clímax, fim"],0,"Por esta ordem."],["Na apreciação crítica, a descrição deve ser…",["curta: duas ou três frases","metade do texto","um resumo completo","dispensada"],0,"O corpo do texto é o comentário."],["O texto de opinião começa por…",["uma tese","um resumo","uma biografia","uma citação longa"],0,"A posição, dita logo."],["Um contra-argumento serve para…",["mostrar que se conhece quem discorda e responder-lhe","mudar de assunto","repetir a tese","acabar o texto"],0,"Dá força à tese."],["«Conseguido», «frágil», «surpreende» são marcas de…",["avaliação","narração","descrição técnica","ordem"],0,"Modalidade apreciativa."]]}], CHAVE="epi-pt-quiz-"+ID, $=function(s){return document.querySelector(s)}, atual=-1;
var abertos={}; try{abertos=JSON.parse(localStorage.getItem(CHAVE)||"{}")}catch(e){}
