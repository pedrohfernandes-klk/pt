,2,"«Tabacaria», 1928."],["O Guardador de Rebanhos é de…",["Alberto Caeiro","Ricardo Reis","Álvaro de Campos","Pessoa ortónimo"],0,"Caeiro."],["A heteronímia é…",["usar pseudónimos iguais","criar autores com biografia, visão do mundo e estilo próprios","traduzir outros poetas","escrever sem nome"],1,"Heterónimo ≠ pseudónimo."]]},{"t":"Formação irregular de palavras","q":[["«info» (de informação)",["truncação","sigla","amálgama","acrónimo"],0,"Corte de parte da palavra."],["«PAP», lida letra a letra",["acrónimo","sigla","truncação","composição"],1,"Sigla: lê-se letra a letra."],["«ONU», lida como palavra",["sigla","acrónimo","amálgama","derivação"],1,"Acrónimo: lê-se como palavra."],["«portunhol» (português + español)",["amálgama","truncação","sigla","prefixação"],0,"Fusão de partes de duas palavras."],["«foto» (de fotografia)",["truncação","composição","sufixação","acrónimo"],0,"Truncação."],["«autocarro» (auto[móvel] + carro)",["composição com elemento truncado","prefixação","sigla","parassíntese"],0,"Um dos elementos está reduzido."]]},{"t":"Funções sintáticas","q":[["«O meu olhar é nítido.» «O meu olhar» é…",["sujeito","complemento direto","predicativo do sujeito","vocativo"],0,"Sujeito."],["«O meu olhar é nítido.» «nítido» é…",["modificador","predicativo do sujeito","complemento direto","complemento oblíquo"],1,"Com verbo copulativo: predicativo do sujeito."],["«Li o poema.» «o poema» é…",["complemento indireto","complemento direto","sujeito","complemento oblíquo"],1,"Complemento direto."],["«Dei o livro à Lídia.» «à Lídia» é…",["complemento indireto","complemento direto","modificador","vocativo"],0,"Complemento indireto (substituível por «lhe»)."],["«Gosto de poesia.» «de poesia» é…",["complemento direto","complemento oblíquo","complemento do nome","modificador"],1,"Exigido pelo verbo com preposição: oblíquo."],["«Lídia, vem sentar-te.» «Lídia» é…",["sujeito","vocativo","complemento direto","predicativo"],1,"Vocativo: interpelação."],["«Ontem, reli Caeiro.» «Ontem» é…",["modificador","complemento oblíquo","sujeito","predicativo"],0,"Modificador (não exigido pelo verbo)."],["«Consideraram-no um mestre.» «um mestre» é…",["predicativo do complemento direto","predicativo do sujeito","complemento indireto","sujeito"],0,"Caracteriza o complemento direto («no» = ele)."]]},{"t":"Orações subordinadas","q":[["«Não penso nele porque pensar é não compreender.»",["causal","final","concessiva","temporal"],0,"«porque» = causa."],["«Escrevo para que me leiam.»",["final","causal","consecutiva","condicional"],0,"«para que» = finalidade."],["«Embora finja, sente.»",["concessiva","causal","temporal","comparativa"],0,"«embora» = concessão."],["«Se leres o poema, percebes.»",["condicional","temporal","final","consecutiva"],0,"«se» = condição."],["«Dizem que finjo.» «que finjo» é…",["subordinada substantiva completiva","subordinada adjetiva relativa","coordenada","adverbial causal"],0,"Completa o verbo «dizem» (complemento direto)."],["«O poeta que finge é Pessoa.» «que finge» é…",["substantiva completiva","adjetiva relativa restritiva","adverbial final","coordenada"],1,"Restringe «o poeta»."]]},{"t":"Mensagem","q":[["Mensagem foi publicada em…",["1914","1934","1942","1974"],1,"1934, único livro em português publicado em vida."],["Mensagem divide-se em três partes:",["Brasão, Mar Português, O Encoberto","Terra, Mar, Céu","Passado, Presente, Futuro","Ode I, II, III"],0,"Brasão, Mar Português e O Encoberto."],["«Tudo vale a pena / Se a alma não é pequena» é de…",["«O Infante»","«Mar Português»","«Nevoeiro»","«Tabacaria»"],1,"«Mar Português»."],["O sebastianismo é…",["a esperança no regresso de D. Sebastião","o elogio de D. Afonso Henriques","uma escola de navegação","uma corrente futurista"],0,"Mito do Encoberto."],["O Quinto Império é, em Mensagem, um império…",["militar","espiritual e cultural","económico","colonial"],1,"Império do espírito."],["«Nevoeiro» termina a obra com a ideia de…",["que Portugal vive um tempo de indefinição e é preciso r
