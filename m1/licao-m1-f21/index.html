<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m1-f21",CARTOES=[{"t":"ler","titulo":"Amar contra a vontade","rot":"Abre","html":"<p class=\"abre\">Como se constrói uma vontade que não consegue realizar-se?<\/p><p class=\"abre\">E se alguém quisesse deixar de amar, mas não conseguisse? Uma cantiga pode construir um conflito sem contar uma sucessão de acontecimentos.<\/p><p>Vais seguir o que a voz deseja, aquilo de que é capaz e o efeito do refrão.<\/p>"},{"t":"vf","p":"Antes de reler. Recupera a cantiga de amor: o sofrimento apresentado pela voz basta para comprovar um episódio vivido pelo trovador?","v":false,"f":"Confundir a voz construída com o autor transforma o poema em biografia. Relê a caracterização da voz na cantiga de amor da F04 e procura o plano a que pertence a coita. Relê essa distinção na lição anterior depois de tentares responder.","g":"m1-f21-1"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>Na cantiga de amor, a voz masculina pode apresentar o sofrimento amoroso, ou <strong>coita<\/strong>. Essa voz é uma construção poética, não uma declaração biográfica automática do trovador.<\/p><p>Uma hipótese introduzida por <strong>se<\/strong> permite imaginar uma possibilidade. A oposição entre desejar e conseguir sustenta esta cantiga de Pero da Ponte.<\/p>"},{"t":"ler","titulo":"Uma hipótese e um limite","rot":"Lê e confronta","html":"<blockquote>«Se eu podesse desamar<br>a que me sempre desamou,<br>e podess’algun mal buscar<br>a quen me sempre mal buscou,<br>assi me vingaria eu<br>se eu podesse coita dar<br>a quen me sempre coita deu.»<\/blockquote><blockquote>«Mais sol non poss’eu enganar<br>meu coraçon, que m’enganou,»<\/blockquote><p>Pero da Ponte, «Se eu podesse desamar», cantiga 982, edição crítica <i>Universo Cantigas<\/i>, Universidade da Corunha, primeira estrofe e abertura da segunda. Conserva-se a grafia da edição. «Coita» significa sofrimento; «assi», assim; «non», não.<\/p><p><a href=\"https://universocantigas.gal/cantigas/se-eu-podesse-desamar\" target=\"_blank\" rel=\"noopener\">Lê a cantiga completa e a paráfrase na edição crítica<\/a>. A hipótese de retribuir o sofrimento é contrariada pela incapacidade de dominar o próprio coração.<\/p>"},{"t":"escolha","p":"Que conflito aparece entre os dois recortes?","o":["Deseja retribuir, mas não domina o amor.","Deseja retribuir e já domina o próprio amor.","Deseja esquecer e já recebe amor em resposta."],"c":0,"f":"A primeira estrofe imagina a retribuição da dor. A abertura da segunda introduz a incapacidade de enganar o coração: a vontade não controla o sentimento. Relê o cartão «Uma hipótese e um limite» e confronta a pista com a tua resposta.","g":"m1-f21-4"},{"t":"vf","p":"A primeira estrofe afirma que a vingança já aconteceu.","v":false,"f":"A hipótese depende de se e de formas como podesse. O poema imagina uma capacidade que a voz não apresenta como realizada. Relê o cartão «Uma hipótese e um limite» e confronta a pista com a tua resposta.","g":"m1-f21-5"},{"t":"emparelhar","p":"Relaciona as marcas do recorte com a sua função.","pares":[["Se eu podesse","Introdução de uma hipótese"],["sempre","Insistência na continuidade"],["Mais sol non poss’eu","Contraste com a incapacidade"]],"f":"Os elementos organizam o conflito. A repetição de sempre intensifica a assimetria; a negativa impede ler a hipótese como um facto consumado. Relê o cartão «Uma hipótese e um limite» e confronta a pista com a tua resposta.","g":"m1-f21-6"},{"t":"ler","titulo":"Quem dá e quem recebe","rot":"Lê e confronta","html":"<p>Na primeira estrofe, o desejo troca as posições: quem recebeu sofrimento imagina passá-lo a quem o causou. A construção repete palavras com alterações de pessoa e de tempo.<\/p><p>Representar este desejo não equivale a recomendar a vingança. A leitura analisa uma voz em conflito; não transforma o seu desejo numa regra para as relações.<\/p><p><strong>Modelo completo.<\/strong> A condição se eu podesse abre uma capacidade desejada. A negativa da segunda estrofe mostra o obstáculo. A conclusão distingue a vingança imaginada de uma ação realizada.<\/p>"},{"t":"completar","p":"Completa a distinção.","frase":"A vingança surge como [1]; a falta de domínio surge como [2].","lacunas":[{"o":["hipótese","memória","promessa"],"c":0},{"o":["limite","triunfo","engano"],"c":0}],"f":"Uma hipótese abre uma possibilidade no discurso. O limite mostra o que impede a voz de a concretizar, mantendo a tensão do poema. Relê o cartão «Quem dá e quem recebe» e confronta a pista com a tua resposta.","g":"m1-f21-8"},{"t":"ordenar","p":"Reconstrói o movimento dos recortes.","passos":["A voz imagina deixar de amar","Imagina retribuir o sofrimento","Nomeia a vingança como hipótese","Reconhece que não domina o coração"],"f":"A ordem conduz de uma possibilidade desejada ao obstáculo interior. O segundo recorte modifica a leitura do primeiro sem apagar o desejo. Relê o cartão «Quem dá e quem recebe» e confronta a pista com a tua resposta.","g":"m1-f21-9"},{"t":"sublinhar","p":"Que palavra impede ler este desejo como uma capacidade já realizada?","frase":"Se eu podesse desamar","certas":[0],"f":"Se introduz uma condição. Sem essa marca, e mudando a forma verbal, poderíamos passar de uma hipótese para uma afirmação de capacidade. Relê o cartão «Quem dá e quem recebe» e confronta a pista com a tua resposta.","g":"m1-f21-10"},{"t":"escolha","p":"Que leitura explica a repetição de coita no refrão?","o":["Insiste no desejo de retribuir o sofrimento.","Anuncia a resolução definitiva do sofrimento.","Retira à voz toda a lembrança do sofrimento."],"c":0,"f":"O refrão retoma a relação entre dar e receber sofrimento. A insistência conserva o conflito, em vez de anunciar que já está resolvido. Relê o cartão «Quem dá e quem recebe» e confronta a pista com a tua resposta.","g":"m1-f21-11"},{"t":"vf","p":"A forma desamar prova que o sentimento já desapareceu.","v":false,"f":"O verbo nomeia a ação desejada. É necessário ler a construção se eu podesse: ela não afirma que a voz tenha conseguido deixar de amar. Relê o cartão «Quem dá e quem recebe» e confronta a pista com a tua resposta.","g":"m1-f21-12"},{"t":"ler","titulo":"Experimenta uma transformação","rot":"Lê e confronta","html":"<p>Frases didáticas criadas: A: «Se pudesse esquecer, descansaria.» B: «Consegui esquecer e descansei.»<\/p><p>As frases partilham o assunto, mas não o mesmo conflito. Em A, o descanso depende de uma capacidade; em B, o enunciado apresenta uma realização. Este contraste ajuda a perceber a importância da hipótese na cantiga.<\/p><p>Contraexemplo à leitura de que a primeira estrofe anuncia uma vingança conseguida: a voz reconhece depois a incapacidade de dominar o coração. Critério: a interpretação tem de explicar a hipótese e a negativa.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>No segundo caso criado, observa as formas consegui e descansei. O desejo continua dependente de uma capacidade ou é apresentado como realizado?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Distingue três planos de leitura.","pares":[["O que a voz deseja","Deixar de amar e retribuir a dor"],["O que a voz reconhece","Não dominar o próprio coração"],["O que a análise evita","Transformar o desejo em conselho"]],"f":"Ler com rigor exige separar a vontade da personagem lírica, o seu limite e a posição de quem interpreta o texto. Relê o cartão «Experimenta uma transformação» e confronta a pista com a tua resposta.","g":"m1-f21-14"},{"t":"escolha","p":"Que transformação eliminaria o conflito estudado?","o":["Afirmar que a voz conseguiu deixar de amar.","Repetir que a voz gostaria de deixar de amar.","Mostrar que a voz continua sem deixar de amar."],"c":0,"f":"A realização retiraria a distância entre vontade e capacidade. As outras alterações manteriam ou intensificariam precisamente essa distância. Relê o cartão «Experimenta uma transformação» e confronta a pista com a tua resposta.","g":"m1-f21-15"},{"t":"completar","p":"Completa uma conclusão.","frase":"A repetição reforça a [1]; a negativa revela a [2].","lacunas":[{"o":["insistência","indiferença","coincidência"],"c":0},{"o":["incapacidade","reciprocidade","superioridade"],"c":0}],"f":"Repetição e negação cooperam: a voz regressa ao desejo e encontra de novo o seu limite, em vez de avançar para uma solução. Relê o cartão «Experimenta uma transformação» e confronta a pista com a tua resposta.","g":"m1-f21-16"},{"t":"ordenar","p":"Ordena o conflito entre vontade, retribuição e incapacidade.","passos":["A voz imagina deixar de amar","Deseja trocar a posição de quem recebe e dá sofrimento","Reconhece que não domina o coração","O refrão conserva o desejo sem resolver o conflito"],"f":"A sequência liga os pormenores à interpretação e conserva o seu limite. Relê o modelo e o contraexemplo: No segundo caso criado, observa as formas consegui e descansei. O desejo continua dependente de uma capacidade ou é apresentado como realizado? Relê o cartão «Experimenta uma transformação» e confronta a pista com a tua resposta.","g":"m1-f21-17"},{"t":"escolha","p":"Que comentário respeita o limite entre voz e autor?","o":["A voz apresenta na cantiga um desejo de vingança.","A voz relata na cantiga uma vingança já realizada.","A voz prevê na cantiga uma reconciliação amorosa."],"c":0,"f":"A primeira formulação atribui o desejo à voz que o texto constrói. As outras acrescentam uma biografia ou uma recomendação sem prova. Relê o cartão «Experimenta uma transformação» e confronta a pista com a tua resposta.","g":"m1-f21-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Como se constrói uma vontade que não consegue realizar-se?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];

});
