<script>
(function(){
"use strict";
var ID="M1", D=[{"t":"Cantiga de amigo: as marcas","q":[["Na cantiga de amigo, quem fala?",["Um cavaleiro","Uma rapariga","O trovador em nome próprio","Um narrador"],1,"O sujeito poético é feminino, embora o autor seja um homem."],["O «amigo» é…",["o namorado","um irmão","o rei","um colega de viagem"],0,"Na cantiga de amigo, «amigo» significa namorado."],["A quem pode a rapariga confiar os seus sentimentos?",["Só a Deus","À mãe, às amigas ou à natureza","Ao senhor feudal","Ao público da corte"],1,"Mãe, amigas e elementos da natureza (ondas, flores, aves) são confidentes."],["O refrão é…",["o primeiro verso do poema","um verso ou conjunto de versos que se repete no fim das estrofes","a última estrofe","uma rima interna"],1,"O refrão repete-se, normalmente no fim de cada estrofe."],["O paralelismo consiste em…",["repetir a mesma ideia em estrofes seguidas, com pequenas variações","usar rima cruzada","alternar verso longo e curto","contar uma história por ordem"],0,"Ex.: «verde pino» / «verde ramo»; «amigo» / «amado»."],["O leixa-pren é…",["a queda de uma vogal","a retoma do 2.º verso de uma estrofe no início de uma estrofe seguinte","o nome do refrão","uma cantiga satírica"],1,"Em Codax, «se vistes meu amigo?» regressa como «Se vistes meu amigo,»."]]},{"t":"Palavras de há 800 anos","q":[["«verrá» significa…",["verá","virá","verde","vendrá"],1,"Glossário FCSH: verrá — virá."],["«u» (em «Ai Deus, e u é?») significa…",["ou","onde","um","e"],1,"u — onde."],["«sano» significa…",["santo","são","sinal","sem"],1,"sano — são, com saúde."],["«fremosa» corresponde hoje a…",["formosa","fermentada","fria","famosa"],0,"fremosa — formosa, bela."],["«atendendo» (em Mendinho) significa…",["servindo","esperando","ouvindo","cuidando"],1,"atender — esperar."],["«levado» (em «Ondas do mar levado») significa…",["levantado, agitado","levado para longe","leve","lavado"],0,"Glossário FCSH: levado — levantado."]]},{"t":"Amor, escárnio e maldizer","q":[["Na cantiga de amor, quem fala?",["Uma rapariga","Um homem que se dirige à sua «senhor»","O povo","A mãe"],1,"O sujeito poético é masculino e dirige-se à dama («senhor»)."],["A «coita» é…",["a alegria do encontro","o sofrimento de amor","uma dança medieval","um instrumento"],1,"Coita: sofrimento amoroso."],["A relação do trovador com a dama lembra…",["a relação entre vassalo e senhor","um casamento combinado","uma amizade entre iguais","um contrato comercial"],0,"Vassalagem amorosa: submissão e serviço à dama."],["A cantiga de escárnio critica…",["de forma indireta, com ironia e duplo sentido","de forma direta, nomeando a pessoa","sempre o rei","apenas os clérigos"],0,"Escárnio: crítica velada, por palavras de duplo sentido."],["A cantiga de maldizer critica…",["de forma indireta","de forma direta e às vezes grosseira, muitas vezes nomeando o visado","só elogiando","sem alvo definido"],1,"Maldizer: crítica direta."],["Verdadeiro ou falso: as cantigas eram feitas para ser cantadas.",["Verdadeiro","Falso"],0,"A poesia trovadoresca unia texto e música."]]},{"t":"Do latim ao português","q":[["stella > estrela: no início acrescentou-se um som. Como se chama?",["Prótese","Paragoge","Aférese","Síncope"],0,"Prótese: acrescento no início."],["luna > lua: caiu um som no meio. Como se chama?",["Apócope","Síncope","Metátese","Epêntese"],1,"Síncope: queda no meio da palavra."],["mare > mar: caiu um som no fim. Como se chama?",["Aférese","Apócope","Prótese","Paragoge"],1,"Apócope: queda no fim."],["semper > sempre: sons trocaram de lugar. Como se chama?",["Assimilação","Metátese","Sonorização","Epêntese"],1,"Metátese: troca de posição."],["amicum > amigo: o som /k/ passou a /g/. Como se chama?",["Sonorização","Palatalização","Síncope","Dissimilação"],0,"Sonorização: um som surdo passa a sonoro. Na escrita, vê-se a letra c a dar lugar a g."],["plenum > cheio: pl passou a ch. Como se chama?",["Palatalização","Aférese","Paragoge","Metátese"],0,"Palatalização."],["ante > antes: acrescentou-se um som no fim. Como se chama?",["Prótese","Epêntese","Paragoge","Apócope"],2,"Paragoge: acrescento no fim."],["A língua das cantigas chama-se…",["latim vulgar","galego-português","castelhano antigo","português clássico"],1,"Galego-português, séculos XII–XIV."]]},{"t":"Complemento do nome e do adjetivo","q":[["«A construção da ponte demorou anos.» «da ponte» é…",["complemento do nome","complemento do adjetivo","modificador do grupo verbal","sujeito"],0,"Completa o nome «construção» (nome derivado de verbo)."],["«Estava orgulhoso do filho.» «do filho» é…",["complemento do nome","complemento do adjetivo","complemento direto","predicativo do sujeito"],1,"Completa o adjetivo «orgulhoso»."],["«A donzela estava ansiosa pela chegada do amigo.» «pela chegada do amigo» é…",["complemento do adjetivo","complemento do nome","modificador do nome restritivo","complemento oblíquo"],0,"Completa «ansiosa»."],["«Tenho medo do escuro.» «do escuro» é…",["complemento do adjetivo","complemento do nome","complemento direto","modificador"],1,"Completa o nome «medo»."],["«Era fiel ao rei.» «ao rei» é…",["complemento indireto","complemento do adjetivo","complemento do nome","modificador"],1,"Completa o adjetivo «fiel»."],["«A casa de pedra ficou de pé.» «de pedra» é…",["complemento do nome","modificador do nome restritivo","complemento do adjetivo","predicativo"],1,"Não é exigido pelo nome «casa»: é um modificador restritivo."]]},{"t":"Fernão Lopes e a crónica","q":[["A Crónica de D. João I trata sobretudo…",["da conquista de Ceuta","da crise de 1383–1385","da batalha de Alcácer-Quibir","das Descobertas"],1,"A crise dinástica de 1383–1385."],["Uma novidade de Fernão Lopes é dar protagonismo…",["só ao rei","ao povo como personagem coletiva","aos clérigos","aos estrangeiros"],1,"A «arraia-miúda» surge como ator coletivo."],["Fernão Lopes preocupa-se com a verdade porque…",["compara e cita fontes","inventa diálogos","segue só a tradição oral","escreve em verso"],0,"Recorre a documentos e fontes."],["O «visualismo» da escrita de Fernão Lopes significa…",["descrever cenas como se o leitor as visse","usar imagens desenhadas","escrever pouco","falar só de paisagens"],0,"As cenas ganham movimento e cor."],["Fernão Lopes foi guarda-mor…",["da Torre do Tombo","do Paço Real","da Sé de Lisboa","da Universidade"],0,"Guarda-mor da Torre do Tombo (arquivo real)."],["Verdadeiro ou falso: uma crónica relata acontecimentos por ordem cronológica.",["Verdadeiro","Falso"],0,"Crónica vem de «chronos», tempo."]]},{"t":"Orações coordenadas","q":[["«Estudei, mas não fui ao teste.» A 2.ª oração é…",["copulativa","adversativa","disjuntiva","conclusiva"],1,"«mas» indica oposição."],["«Ou vens já, ou vou sozinho.»",["disjuntiva","explicativa","copulativa","adversativa"],0,"«ou… ou» indica alternativa."],["«Choveu muito, portanto o jogo foi adiado.»",["explicativa","conclusiva","adversativa","copulativa"],1,"«portanto» indica conclusão."],["«Leva o casaco, que está frio.»",["explicativa","disjuntiva","conclusiva","copulativa"],0,"«que» (= pois) explica."],["«Li a cantiga e escrevi um comentário.»",["adversativa","copulativa","conclusiva","explicativa"],1,"«e» junta ações."],["«As flores responderam; contudo, a donzela continuou inquieta.»",["copulativa","adversativa","conclusiva","disjuntiva"],1,"«contudo» indica oposição."]]}], CHAVE="epi-pt-quiz-"+ID, $=function(s){return document.querySelector(s)}, atual=-1;
var abertos={}; try{abertos=JSON.parse(localStorage.getItem(CHAVE)||"{}")}catch(e){}
function guardar(){try{localStorage.setItem(CHAVE,JSON.stringify(abertos))}catch(e){}}
function mostrar(qual){["indice","quiz"].forEach(function(s){$("#"+s).hidden=(s!==qual)});window.scrollTo(0,0)}
function estados(){D.forEach(function(z,i){var e=$("#estado-"+i);var r=abertos[i];e.textContent=(typeof r==="number")?r+"/"+z.q.length:z.q.length+" perguntas"})}
function abrirQuiz(i){atual=i;var z=D[i];$("#titulo-q").textContent=(i+1)+". "+z.t;var f=$("#form");f.innerHTML="";z.q.forEach(function(q,k){var d=document.createElement("div");d.className="q";var p=document.createElement("p");p.textContent=(k+1)+". "+q[0];d.appendChild(p);q[1].forEach(function(o,j){var l=document.createElement("label");l.className="op";var r=document.createElement("input");r.type="radio";r.name="q"+k;r.value=j;l.appendChild(r);l.appendChild(document.createTextNode(" "+o));d.appendChild(l)});var ex=document.createElement("div");ex.className="exp";ex.hidden=true;d.appendChild(ex);f.appendChild(d)});$("#resultado").hidden=true;$("#repetir").hidden=true;$("#corrigir").hidden=false;mostrar("quiz")}
document.querySelectorAll(".abrir").forEach(function(b){b.addEventListener("click",function(){abrirQuiz(+b.dataset.i)})});
$("#voltar-2").addEventListener("click",function(e){e.preventDefault();estados();mostrar("indice")});
$("#corrigir").addEventListener("click",function(e){e.preventDefault();var z=D[atual],certas=0;document.querySelectorAll("#form .q").forEach(function(d,k){var m=d.querySelector("input:checked"),q=z.q[k],ex=d.querySelector(".exp");var ok=m&&+m.value===q[2];if(ok)certas++;ex.hidden=false;ex.className="exp "+(ok?"certo":"errado");ex.textContent=(ok?"Certo. ":"Resposta certa: "+q[1][q[2]]+". ")+q[3];d.querySelectorAll("input").forEach(function(r){r.disabled=true})});$("#resultado").textContent=certas+" / "+z.q.length;$("#resultado").hidden=false;$("#corrigir").hidden=true;$("#repetir").hidden=false;abertos[atual]=Math.max(typeof abertos[atual]==="number"?abertos[atual]:0,certas);guardar()});
$("#repetir").addEventListener("click",function(e){e.preventDefault();abrirQuiz(atual)});
estados();
})();
</script></body></html>
