<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Duchamp · Laboratório de Narrativas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet"><style>:root{--tinta:#000;--papel:#fff;--papel2:#faf8f2;--suave:#444;--fundo:#f3f2ee;--mostarda:#d9a520;--vermelho:#c8232c}@media (prefers-color-scheme:dark){:root{--tinta:#ecebe5;--papel:#121210;--papel2:#1a1a17;--suave:#b3b1aa;--fundo:#1d1d1a;--mostarda:#e0b23a;--vermelho:#e4555c}}*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.5 Arial,Helvetica,sans-serif}

.c-prim[data-seguinte]::after,.c-prim[data-confirmar]::after,.c-prim.c-vai::after{content:"→"}
.casca-folha{position:absolute;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.7,.2,1);background:var(--papel,#fff);color:var(--tinta,#000);box-shadow:0 -1px 0 rgba(0,0,0,.18),0 -12px 30px rgba(0,0,0,.08)}

.casca-folha.ok .c-folha-in{border-left-color:var(--certo,#1b7f3b)}.casca-folha.mau .c-folha-in{border-left-color:var(--errado,#c8232c)}

@keyframes cMenu{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.casca-menu .c-menu-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px}.casca-menu .c-menu-cab p{font:700 .74rem/1.35 Arial;letter-spacing:.1em;text-transform:uppercase;color:var(--suave,#444);margin:0}

.casca-menu nav a::after{content:"→";margin-left:auto;font-weight:400}

.casca-video{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}.casca-video .cx{background:#111;color:#f2f0ea;width:100%;max-width:420px;max-height:96vh;max-height:96dvh;display:flex;flex-direction:column;gap:8px;padding:12px;box-sizing:border-box}.casca-video .tt{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 .8rem Arial;letter-spacing:.1em;text-transform:uppercase;color:#d9a520}.casca-video video{width:100%;max-height:72vh;max-height:72dvh;background:#000;display:block}.casca-video .rodape-como{display:flex;justify-content:space-between;align-items:center;gap:10px}.casca-video button,.casca-video a{display:inline-flex;align-items:center;font:700 1rem Arial;color:#f2f0ea;background:none;border:0;min-height:44px;padding:0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

FD1a9pbNG1EbljFO6dBT9ZJ6V71+NzP2IhgV0nkwrsGSIrD2QGsSc8YjHEAkrNGCe5+BJgVuDDZRrC6gCR3nd4ggcVbi6q0BDeBDWEvRsHwEimYr4e1jVwhirt8igItNy7M1k5BsyjdpsdHPoyMD7I46FPboyFTGIALlD+NZGFfMsskJ+sHYAEGAFkWVriiRZ8fsf2geSjKkjmN/tKYcL7pC5AlQ2l62yYK+L65wMxenorrMccJrO5+haQnh+L3M6Kw3CCWaTLNBXl3no6Bi3nK3Eh1gosY2iC2KtcS1KhValci3k1eQkyR7NNxDdRFrA/nmyVy3cOrJNtOknljmK0t0abno3+D89Np/6UqNLTomAyzu62CFqoPaoAtuKJ3dkHwz1ksA5P5YbnScEt2S7R68LqlLeUEEL3PcfhXI/KeGa1hhtkvkQk+gwEqZZjMsObWj7VaSK6xIrtl2YZ++uHXL70boL7piiGNV3UhlGOIgbDPVYb1EuXYRKXkelSBE+5COyaAwLazw/F5pbfIIY4Yi7d3W4lWwyyw+4a4LaTVt+sR5llkENpc8R9W4tljRKtaE8xccZ9ss8qVi5NeTGpFzzaeA55EnP7IhL0zzmRONihtEaIViX5jklBoVWVmoZEw+jFpDIF45bjiokmX/TVBkwdOMfUSb0sOKKJcHCc2TjxJTTrbmwmzgPbjo0AgIpguBvmttyDmhwrcFsBuliFCoq0xKJu8IdSLRkT5gJfw0gyLK4y+gHv04MvX0035m+QLdhPw/P9h6HaOAAAA\" alt=\"Fotografia a preto e branco de um urinol de porcelana pousado de lado sobre um pedestal, com a assinatura R. Mutt 1917 pintada na borda, diante de uma pintura.\" width=\"1000\" height=\"1054\" loading=\"lazy\"><figcaption>A única imagem deste dossier: a fotografia de Alfred Stieglitz da Fountain, 1917, o urinol assinado «R. Mutt», publicada em The Blind Man, n.º 2, em maio de 1917. O original perdeu-se; o que resta é esta fotografia e as réplicas autorizadas dos anos 1950 e 1960. Alfred Stieglitz (1864-1946). Domínio público no registo de origem (<a href=\"https://commons.wikimedia.org/wiki/File:Marcel_Duchamp,_1917,_Fountain,_photograph_by_Alfred_Stieglitz.jpg\">Wikimedia Commons</a>), consulta de 2026-10-15.</figcaption></figure>"},{"t":"ler","rot":"Paris, 1912","titulo":"O quadro que os cubistas recusaram","html":"<div class=\"conceito\"><p>Marcel Duchamp nasceu em 1887 perto de Rouen, numa família de artistas: dois irmãos mais velhos pintavam e esculpiam. Em 1912 pintou <i>Nu descendo uma escada, n.º 2</i>: uma figura decomposta em dezenas de posições sucessivas, como numa cronofotografia. Entregou-o ao Salon des Indépendants de Paris; os cubistas do júri, entre eles os próprios irmãos, pediram-lhe que o retirasse ou mudasse o título. Retirou-o. Disse mais tarde que aquele dia o libertou: nunca mais quis pertencer a um grupo.</p><p>Em 1913 o quadro foi a Nova Iorque, ao Armory Show, a primeira grande exposição de arte moderna nos Estados Unidos. Foi o escândalo da mostra: um jornal descreveu-o como «uma explosão numa fábrica de telhas». Na mesma exposição estava um português de Amarante, Amadeo de Souza-Cardoso, com oito obras. O modernismo era uma conversa internacional, e Portugal estava nela.</p></div><p class=\"insight\">A primeira obra importante de Duchamp foi recusada pelos modernos. A recusa foi o seu ponto de partida.</p>"},{"t":"ler","rot":"Nova Iorque, 1917","titulo":"O readymade e a Fonte","html":"<div class=\"conceito\"><p>Em 1913, Duchamp prendeu uma roda de bicicleta a um banco de cozinha. Em 1914 comprou um porta-garrafas e assinou-o. Chamou a estes objetos <i>readymades</i>: coisas já feitas, escolhidas e não fabricadas pelo artista. Em 1917, a Society of Independent Artists de Nova Iorque anunciou uma exposição sem júri: quem pagasse a quota exporia. Chegou um urinol de porcelana, deitado de lado, assinado «R. Mutt 1917». A direção, de que Duchamp fazia parte, não o expôs. Duchamp demitiu-se.</p><p>A revista <i>The Blind Man</i>, n.º 2, de maio de 1917, publicou a fotografia de Alfred Stieglitz e um editorial, «O caso Richard Mutt»: «Se o senhor Mutt fez a fonte com as próprias mãos ou não, não tem importância. Ele escolheu-a.» O original perdeu-se; sobrevivem a fotografia e réplicas autorizadas dos anos 1950 e 1960.</p><p>Uma dúvida honesta: numa carta à irmã Suzanne, de 11 de abril de 1917, Duchamp escreveu que «uma das minhas amigas, sob um pseudónimo masculino, Richard Mutt», tinha enviado um urinol. Há investigadores que atribuem a ideia à baronesa Elsa von Freytag-Loringhoven, artista dadaísta de Nova Iorque; outros discordam. A questão continua aberta, e é ela própria uma lição sobre autoria.</p></div><p class=\"insight\">O readymade desloca a pergunta: não «como foi feito?», mas «quem escolheu, e porquê?».</p>"},{"t":"ler","rot":"A assinatura","titulo":"Quem é o autor?","html":"<div class=\"conceito\"><p>Um nome falso numa obra que ninguém fabricou: a <i>Fountain</i> é um problema de autoria em forma de objeto. O que faz de alguém autor? A mão que executa, a cabeça que escolhe, o nome que assina, a instituição que aceita? Em 1919 Duchamp comprou um postal da <i>Mona Lisa</i>, desenhou-lhe bigode e pera e escreveu por baixo «L.H.O.O.Q.», letras que em francês, lidas em voz alta, formam uma frase grosseira. A obra mais reproduzida do mundo passou a ser uma piada com assinatura.</p><p>É a pergunta do passo 4 de Cidadania: quando uma máquina escreve, desenha ou canta a partir do que outros fizeram, quem é o autor? Duchamp respondeu há um século com um gesto: autor é quem escolhe e assume a escolha. A resposta não fecha o assunto; abre-o.</p></div><p class=\"insight\">Assinar é assumir uma escolha. A pergunta «quem é o autor?» fica mais difícil cada vez que a resposta parece fácil.</p>"},{"t":"ler","rot":"O acaso e o xadrez","titulo":"Regras para não decidir tudo","html":"<div class=\"conceito\"><p>Duchamp gostava de regras que tirassem ao artista parte do controlo. Em 1913-1914 deixou cair três fios de um metro de altura e fixou-os na forma em que caíram: <i>Três estopagens-padrão</i>, uma régua feita pelo acaso. A partir de 1923 deixou quase de produzir obras em público e dedicou-se ao xadrez: fez parte da equipa francesa nas olimpíadas de xadrez entre 1928 e 1933 e escreveu com Vitaly Halberstadt um livro sobre finais, em 1932. Disse que nem todos os artistas eram enxadristas, mas que todos os enxadristas eram artistas.</p><p>O acaso e o xadrez são duas formas de dar regras ao que se faz. Um algoritmo também é uma regra que decide por nós; a diferença está em quem escreve a regra e em quem a pode ler. É o passo 6 de Cidadania, e é também o cut-up de Burroughs, a oficina «Pedaços» deste Laboratório.</p></div><p class=\"insight\">Dar uma regra ao acaso é uma forma de decidir sem mandar. Saber quem escreveu a regra é a outra metade.</p>"},{"t":"ler","rot":"Houston, 1957","titulo":"O público completa a obra","html":"<div class=\"conceito\"><p>Numa conferência de 1957, «O ato criativo», Duchamp disse que o artista faz só metade do trabalho: o espectador, ao olhar e interpretar, «acrescenta a sua contribuição ao ato criativo», e é a posteridade que decide. A obra não está acabada quando sai do ateliê; acaba em cada olhar. Entre 1946 e 1966, em segredo, construiu a última obra, <i>Étant donnés</i>: uma porta de madeira com dois buracos por onde se espreita uma cena. Só foi revelada em 1969, depois da sua morte, no museu de Filadélfia. Quem não espreita não vê nada: o público faz literalmente parte da obra.</p><p>É a ideia que atravessa este Laboratório: o leitor que preenche o subtexto, que ouve o que o diálogo não diz, que sente a espingarda antes de ela disparar. Duchamp pôs-lhe um nome e uma data.</p></div><p class=\"insight\">Uma história acaba no leitor. Escrever é deixar o espaço certo para ele entrar.</p>"},{"t":"ler","rot":"Depois","titulo":"O que mudou","html":"<div class=\"conceito\"><p>Nos anos 1960, a pop art de Warhol expôs latas de sopa e caixas de detergente; a arte conceptual declarou que a ideia valia mais do que o objeto; o grupo Fluxus fez da instrução uma obra. Todos passaram pela porta que Duchamp abriu. Em 2004, uma sondagem a quinhentos especialistas, patrocinada pelo Turner Prize, elegeu a <i>Fountain</i> a obra de arte moderna mais influente, à frente de Picasso e de Warhol.</p><p>E em Portugal? Em 1915 saiu em Lisboa a revista <i>Orpheu</i>, com Pessoa, Sá-Carneiro e Almada Negreiros, e no mesmo ano Almada publicou o <i>Manifesto Anti-Dantas</i>: a mesma vontade de escandalizar para abrir caminho. Álvaro de Campos queria ser máquina na «Ode Triunfal» (1914); Duchamp assinava uma. O modernismo português e o de Duchamp são contemporâneos e vizinhos, e é por isso que este dossier liga ao Módulo 7.</p></div><p class=\"insight\">Hoje, cada feed que escolhe por ti é um readymade ao contrário: a escolha é feita, mas ninguém assina.</p>"},{"t":"ler","rot":"Para ver e ler","titulo":"Ligações","html":"<ul class=\"ver-of\"><li><a href=\"https://sdrc.lib.uiowa.edu/dada/blindman/2/index.htm\">The Blind Man, n.º 2, maio de 1917 (International Dada Archive, Universidade de Iowa)</a><small>Em inglês. A revista onde saíram a fotografia de Stieglitz e o editorial «The Richard Mutt Case».</small></li><li><a href=\"https://www.tate.org.uk/art/artworks/duchamp-fountain-t07573\">Fountain, réplica de 1964 (Tate, Londres)</a><small>Em inglês. A história do original perdido e das réplicas.</small></li><li><a href=\"https://philamuseum.org/collection/object/65633\">Étant donnés (Philadelphia Museum of Art)</a><small>Em inglês. A última obra, revelada em 1969.</small></li><li><a href=\"https://monoskop.org/The_Blind_Man\">The Blind Man (Monoskop)</a><small>Em inglês. Os dois números da revista, em fac-símile.</small></li></ul>"},{"t":"ler","rot":"Agora faz","escuro":true,"titulo":"A oficina e as ligações","html":"<p class=\"levar\">Antes de perguntar se é arte, pergunta quem escolheu, quem assinou e quem completa.</p><ul class=\"faz-lista\"><li><a href=\"https://pedrohfernandes-klk.github.io/pt/narrativas/oficina-readymade/\">O readymade de palavras</a><small>Oficina 17, 60 a 90 min de aula</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/passo-04/\">Cidadania, Módulo 2, passo 4: quem está dentro da caixa</a><small>Quando uma máquina cria, quem é o autor? A pergunta de Duchamp, cem anos depois.</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/passo-06/\">Cidadania, Módulo 2, passo 6: tornar visível o invisível</a><small>As regras que decidem por nós, e quem as pode ler.</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/pt/m7/licao-m7-f34/\">Português, Módulo 7: «Chuva Oblíqua», Orpheu 2, 1915</a><small>O modernismo português, contemporâneo de Duchamp.</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/pt/m7/licao-m7-f06/\">Português, Módulo 7: a «Ode Triunfal», 1914</a><small>Campos quer ser máquina; Duchamp assina uma.</small></li></ul>"}],chave:"epi-narrativas-duchamp",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/pt/narrativas/",percursoRotulo:"Todas",voltarRotulo:"Voltar ao Laboratório",seguinte:"https://pedrohfernandes-klk.github.io/pt/narrativas/oficina-readymade/",seguinteRotulo:"A oficina do readymade",depois:"<div class=\"c\"><p class=\"rot\">Leste</p><p>Antes de perguntar se é arte, pergunta quem escolheu, quem assinou e quem completa.</p><p class=\"sub\">A oficina: <a href=\"https://pedrohfernandes-klk.github.io/pt/narrativas/oficina-readymade/\">O readymade de palavras</a>. <a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/passo-04/\">Cidadania, Módulo 2, passo 4: quem está dentro da caixa</a> · <a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/passo-06/\">Cidadania, Módulo 2, passo 6: tornar visível o invisível</a> · <a href=\"https://pedrohfernandes-klk.github.io/pt/m7/licao-m7-f34/\">Português, Módulo 7: «Chuva Oblíqua», Orpheu 2, 1915</a> · <a href=\"https://pedrohfernandes-klk.github.io/pt/m7/licao-m7-f06/\">Português, Módulo 7: a «Ode Triunfal», 1914</a>.</p></div>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["duchamp"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
