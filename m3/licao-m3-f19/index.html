<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m3-f19",CARTOES=[{"t":"ler","titulo":"Mudar já não é o mesmo","rot":"Abre","html":"<figure class=\"fig documento\"><a href=\"../../img/fontes/camoes-rimas-1595.jpg\" aria-label=\"Abrir a imagem inteira\"><img src=\"../../img/fontes/camoes-rimas-1595.jpg\" alt=\"Página de título de Rhythmas, com uma árvore e a data de 1595 em numeração romana.\"><\/a><details class=\"info-i info-i--linha\" name=\"info-i\"><summary aria-label=\"Créditos da imagem\"><span aria-hidden=\"true\">i<\/span><\/summary><div class=\"info-i-texto\"><p>Domínio público; <a href=\"https://commons.wikimedia.org/wiki/File:Cam%C3%B5es_-_Rimas_1595.jpg\">Fonte ↗<\/a><\/p><table><caption>Identificação do documento visual<\/caption><tr><th scope=\"row\">Autor<\/th><td>Luís de Camões; impressão de Manuel de Lira; reprodução anónima<\/td><\/tr><tr><th scope=\"row\">Obra<\/th><td><i>Rhythmas<\/i>, página de título<\/td><\/tr><tr><th scope=\"row\">Data<\/th><td>1595<\/td><\/tr><tr><th scope=\"row\">Instituição ou acervo<\/th><td>Wikimedia Commons. Coleção do exemplar não indicada na fonte da reprodução.<\/td><\/tr><tr><th scope=\"row\">Licença<\/th><td><a href=\"https://commons.wikimedia.org/wiki/File:Cam%C3%B5es_-_Rimas_1595.jpg\">Domínio público<\/a><\/td><\/tr><\/table><p><a href=\"https://commons.wikimedia.org/wiki/File:Cam%C3%B5es_-_Rimas_1595.jpg\">Consultar a fonte e os direitos ↗<\/a>. Reprodução redimensionada, sem recorte.<\/p><\/div><\/details><figcaption><p><i>Rhythmas<\/i>, 1595: página de título da edição póstuma da poesia de Camões.<\/p><\/figcaption><\/figure><p class=\"abre\"><strong>Que diferença há entre voltar a primavera e voltar a ser quem eras?<\/strong><\/p><p class=\"abre\">A primavera regressa. Uma experiência regressa da mesma maneira? Um soneto pode começar com uma regra geral e terminar por a tornar mais difícil.<\/p><p>Vais acompanhar a mudança de escala, do mundo à memória, até à surpresa final.<\/p>"},{"t":"vf","p":"Antes de reler. Na lírica camoniana, nomear uma imagem equivale a explicar o seu efeito no conjunto do poema?","v":false,"f":"Confundir o nome do recurso com a interpretação deixa a relação por explicar. Relê uma imagem da F09 e distingue identificá-la de mostrar o que faz na construção da experiência.","g":"m3-f19-1","fe":"Confundes o nome de um recurso com a explicação do seu efeito. Regressa a uma imagem da F09 e distingue identificá-la de mostrar o que ela faz na construção da experiência."},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>O <strong>soneto<\/strong> organiza catorze versos em dois quartetos e dois tercetos. A interpretação acompanha a relação entre essas partes, não apenas a contagem.<\/p><p>Em «Mudam-se os tempos, mudam-se as vontades», a mudança atravessa o mundo, a experiência e a própria forma de mudar. «Soía» significa costumava; «mor», maior.<\/p>"},{"t":"ler","titulo":"O mundo e a memória","rot":"Lê de perto","html":"<blockquote>«Mudam-se os tempos, mudam-se as vontades,<br>Muda-se o ser, muda-se a confiança;<br>Todo o mundo é composto de mudança,<br>Tomando sempre novas qualidades.»<\/blockquote><blockquote>«Continuamente vemos novidades,<br>Diferentes em tudo da esperança;<br>Do mal ficam as mágoas na lembrança,<br>E do bem, se algum houve, as saudades.»<\/blockquote><p>Luís de Camões, «Mudam-se os tempos, mudam-se as vontades», primeiros dois quartetos, transcrição da <a href=\"https://ensina.rtp.pt/artigo/mudam-se-os-tempos-mudam-se-as-vontades-de-luis-de-camoes/\" target=\"_blank\" rel=\"noopener\">RTP Ensina, com o poema integral<\/a>. O poema está em domínio público; a página não indica uma edição impressa.<\/p>"},{"t":"escolha","p":"Que relação se estabelece entre novidade e esperança?","o":["A experiência diverge do que se esperava.","A experiência confirma aquilo que se esperava.","A experiência repete aquilo que se recordava."],"c":0,"f":"O segundo quarteto apresenta novidades diferentes da esperança. A mudança não surge apenas como variedade neutra: envolve desajuste e memória afetiva.","g":"m3-f19-4","fe":["O segundo quarteto apresenta novidades diferentes da esperança. A mudança não surge apenas como variedade neutra: envolve desajuste e memória afetiva.","Confundes a expectativa com a experiência que a contraria. Relê a relação entre o que se esperava e as novidades observadas.","Reduzes a experiência a repetição do passado. Regressa ao contraste entre a novidade e a memória que a voz conserva."]},{"t":"emparelhar","p":"Liga cada elemento ao plano que desenvolve.","pares":[["Vontades e confiança","Mudança da experiência humana"],["Mágoas e saudades","Persistência afetiva na memória"],["Todo o mundo","Alargamento da afirmação inicial"]],"f":"O poema articula uma proposição ampla com efeitos particulares. O que muda pode deixar marcas, pelo que mudança não significa apagamento total.","g":"m3-f19-6","fe":"Misturas o alargamento da regra com o que fica na memória. Relê os dois quartetos e separa o verso que alarga a regra ao mundo dos versos sobre o que fica na lembrança."},{"t":"vf","p":"O primeiro quarteto relaciona a mudança com a vontade e a confiança, além da passagem do tempo.","v":true,"f":"A enumeração inclui vontades, ser e confiança. A regra é ampla e prepara a passagem para a experiência humana, não apenas para as estações.","g":"m3-f19-5","fe":"Reduzes a mudança do primeiro quarteto à passagem do tempo. Relê os dois primeiros versos do soneto e conta o que muda além dos tempos."},{"t":"ler","titulo":"A natureza e a surpresa","rot":"Para entender","html":"<blockquote>«O tempo cobre o chão de verde manto,<br>Que já coberto foi de neve fria,<br>E enfim converte em choro o doce canto.»<\/blockquote><blockquote>«E, afora este mudar-se cada dia,<br>Outra mudança faz de mor espanto:<br>Que não se muda já como soía.»<\/blockquote><p>Luís de Camões, mesmo soneto, dois tercetos, transcrição da RTP Ensina. O verde sobre o chão antes coberto de neve permite pensar o regresso das estações; o canto transformado em choro introduz uma mudança afetiva.<\/p><p>O final não diz simplesmente que tudo deixou de mudar. Apresenta como espantosa uma alteração na própria maneira de mudar.<\/p><p><strong>Modelo completo.<\/strong> A abertura alarga a mudança ao mundo e às vontades. O quarteto seguinte apresenta novidades que divergem da esperança. A regra geral passa a envolver uma experiência afetiva.<\/p>"},{"t":"sublinhar","p":"Que palavra marca a diferença atual em relação ao modo de mudar do passado?","frase":"Que não se muda já como soía.","certas":[4],"f":"«Já», associado à negação e à comparação com «soía», marca a diferença atual. A expressão não elimina toda a mudança: altera a sua relação com o passado.","g":"m3-f19-10","fe":"Escolhes uma palavra da comparação em vez da que marca o presente. Relê «Que não se muda já como soía» e procura o que opõe agora a antes."},{"t":"escolha","p":"Que leitura do último verso conserva a sua dificuldade?","o":["A maneira de mudar já não é a de antes.","A mudança deixou de ocorrer no presente.","A mudança repete a maneira de antes."],"c":0,"f":"O verso compara modos de mudar. Reduzi-lo à imobilidade ou ao regresso idêntico apagaria o espanto introduzido pelo terceto.","g":"m3-f19-11","fe":["O verso compara modos de mudar. Reduzi-lo à imobilidade ou ao regresso idêntico apagaria o espanto introduzido pelo terceto.","Confundes alteração do modo de mudar com fim da mudança. Relê a comparação introduzida por «como soía».","Apagas a diferença que o último verso introduz. Regressa a «já» e à negação que modifica a regra enunciada antes."]},{"t":"completar","p":"Completa a diferença.","frase":"A natureza sugere um [1]; a experiência conserva uma [2].","lacunas":[{"o":["ciclo","corte","limite"],"c":0},{"o":["memória","promessa","certeza"],"c":0}],"f":"O regresso natural não garante a recuperação da experiência anterior. As mágoas e as saudades tornam a memória parte do problema da mudança.","g":"m3-f19-8","fe":"Trocas o regresso da natureza pelo que a experiência guarda. Relê o verso do «verde manto» sobre a «neve fria» e, no segundo quarteto, o que fica «na lembrança»."},{"t":"ordenar","p":"Ordena o percurso da reflexão no soneto.","passos":["Afirmar a mudança do mundo e das vontades","Observar o desajuste entre novidade e esperança","Confrontar natureza e transformação afetiva","Estranhar a mudança na própria forma de mudar"],"f":"O último terceto não repete simplesmente a abertura. Reorienta-a e obriga o leitor a reconsiderar aquilo que parecia uma regra evidente.","g":"m3-f19-9","fe":"Antecipas o espanto final antes da regra que ele reorienta. Relê o soneto pela ordem das estrofes, dois quartetos e dois tercetos, e situa em cada parte o passo correspondente."},{"t":"ler","titulo":"Uma experiência de leitura","rot":"Compara","html":"<p>Frases criadas para esta lição. A: Voltou a primavera ao jardim. B: Voltei ao jardim, mas já não o reconheci da mesma maneira.<\/p><p>O lugar pode ser o mesmo e a relação com ele ter mudado. A comparação não é uma paráfrase do soneto: serve para experimentar a diferença entre repetição exterior e transformação da experiência.<\/p><p>Contraexemplo à equivalência entre mudar e apagar: mágoas e saudades continuam na memória. Critério: uma leitura da mudança deve explicar também aquilo que persiste.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>No regresso ao jardim, distingue o lugar exterior da relação de quem regressa com ele. Que elemento impede tomar regresso por repetição idêntica?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"vf","p":"A saudade conserva uma marca do passado na experiência presente da voz.","v":true,"f":"A saudade é precisamente uma relação com o que se perdeu ou ficou distante. A mudança pode conviver com a persistência na memória.","g":"m3-f19-12","fe":"Lês a mudança como apagamento completo do passado. Relê o contraexemplo: mágoas e saudades continuam na memória, mesmo quando tudo muda."},{"t":"emparelhar","p":"Classifica os três movimentos.","pares":[["Neve seguida de verde","Alternância natural"],["Canto convertido em choro","Transformação afetiva"],["Mudar de modo diferente do passado","Reflexão sobre a própria mudança"]],"f":"A interpretação ganha precisão quando conserva os planos e explica a sua relação. Nem todas as mudanças apresentadas têm o mesmo sentido.","g":"m3-f19-14","fe":"Dás o mesmo sentido a mudanças de planos diferentes. Relê os tercetos e distingue a neve e o verde, o canto que se converte em choro e a mudança que «não se muda já como soía»."},{"t":"escolha","p":"Que alteração retiraria a surpresa final?","o":["Terminar apenas com a regra de que tudo muda.","Conservar a comparação com a mudança de antes.","Manter a palavra «espanto» antes do último verso."],"c":0,"f":"A repetição simples da regra inicial apagaria a reflexão sobre a maneira de mudar. O final faz mais do que confirmar a primeira afirmação.","g":"m3-f19-15","fe":["A repetição simples da regra inicial apagaria a reflexão sobre a maneira de mudar. O final faz mais do que confirmar a primeira afirmação.","Conservas a comparação que produz a surpresa. Relê o contraste entre a regra da mudança e a maneira de mudar de antes.","Conservas uma palavra de preparação para a viragem. Regressa ao último verso e identifica a comparação que precisaria de desaparecer."]},{"t":"completar","p":"Completa uma conclusão.","frase":"O soneto parte de uma [1] geral e chega a uma [2] dessa regra.","lacunas":[{"o":["regra","prova","norma"],"c":0},{"o":["revisão","certeza","recusa"],"c":0}],"f":"A organização conduz da afirmação ao espanto. A revisão não exige negar toda a abertura, mas torna mais complexa a relação entre presente e passado.","g":"m3-f19-16","fe":"Lês o final como confirmação ou recusa da regra inicial. Relê, em «Para entender», que o final não diz que tudo deixou de mudar: apresenta como espantosa a maneira de mudar."},{"t":"escolha","p":"Que comparação com outro poema seria mais produtiva?","o":["Comparar o papel da memória em duas mudanças.","Equiparar o efeito da mudança pelo tema comum.","Atribuir o efeito da mudança à biografia do autor."],"c":0,"f":"A memória permite comparar relações entre experiência e tempo. A comparação deve conservar diferenças, em vez de procurar uma fórmula universal.","g":"m3-f19-18","fe":["A memória permite comparar relações entre experiência e tempo. A comparação deve conservar diferenças, em vez de procurar uma fórmula universal.","Confundes tema comum com efeito equivalente. Regressa ao papel da memória e compara como ela modifica a mudança em cada poema.","Substituis a relação textual por explicação biográfica. Relê os indícios da memória na voz do poema antes de atribuir experiências ao autor."]},{"t":"ordenar","p":"Ordena o movimento do soneto sem reduzir o final à repetição da abertura.","passos":["A mudança é apresentada como regra ampla","A memória conserva marcas do bem e do mal","O regresso natural contrasta com a alteração afetiva","O final interroga a própria maneira de mudar"],"f":"A regra da mudança encontra a resistência da memória e a surpresa final. A voz não diz apenas que tudo muda: questiona também a maneira como a mudança acontece.","g":"m3-f19-17","fe":"Trocas a ordem das estrofes ou fazes do final uma repetição da abertura. Relê o soneto inteiro e associa cada passo ao quarteto ou ao terceto onde se encontra."},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Que diferença há entre voltar a primavera e voltar a ser quem eras?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
