<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m3-f19",CARTOES=[{"t":"ler","titulo":"Mudar já não é o mesmo","rot":"Abre","html":"<p class=\"abre\">Que diferença há entre voltar a primavera e voltar a ser quem eras?<\/p><p class=\"abre\">A primavera regressa. Uma experiência regressa da mesma maneira? Um soneto pode começar com uma regra geral e terminar por a tornar mais difícil.<\/p><p>Vais acompanhar a mudança de escala, do mundo à memória, até à surpresa final.<\/p>"},{"t":"vf","p":"Antes de reler. Recupera a lírica camoniana: identificar uma imagem basta para explicar o efeito que produz no conjunto do poema?","v":false,"f":"Confundir o nome do recurso com a interpretação deixa a relação por explicar. Relê uma imagem da F09 e distingue identificá-la de mostrar o que faz na construção da experiência. Relê essa distinção na lição anterior depois de tentares responder.","g":"m3-f19-1"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>O <strong>soneto<\/strong> organiza catorze versos em dois quartetos e dois tercetos. A interpretação acompanha a relação entre essas partes, não apenas a contagem.<\/p><p>Em «Mudam-se os tempos, mudam-se as vontades», a mudança atravessa o mundo, a experiência e a própria forma de mudar. «Soía» significa costumava; «mor», maior.<\/p>"},{"t":"ler","titulo":"O mundo e a memória","rot":"Lê e confronta","html":"<blockquote>«Mudam-se os tempos, mudam-se as vontades,<br>Muda-se o ser, muda-se a confiança;<br>Todo o mundo é composto de mudança,<br>Tomando sempre novas qualidades.»<\/blockquote><blockquote>«Continuamente vemos novidades,<br>Diferentes em tudo da esperança;<br>Do mal ficam as mágoas na lembrança,<br>E do bem, se algum houve, as saudades.»<\/blockquote><p>Luís de Camões, «Mudam-se os tempos, mudam-se as vontades», primeiros dois quartetos, transcrição da <a href=\"https://ensina.rtp.pt/artigo/mudam-se-os-tempos-mudam-se-as-vontades-de-luis-de-camoes/\" target=\"_blank\" rel=\"noopener\">RTP Ensina, com o poema integral<\/a>. O poema está em domínio público; a página não indica uma edição impressa.<\/p>"},{"t":"escolha","p":"Que relação se estabelece entre novidade e esperança?","o":["A experiência diverge daquilo que se esperava.","A experiência realiza tudo aquilo que se esperava.","A experiência elimina qualquer forma de memória."],"c":0,"f":"O segundo quarteto apresenta novidades diferentes da esperança. A mudança não surge apenas como variedade neutra: envolve desajuste e memória afetiva. Relê o cartão «O mundo e a memória» e confronta a pista com a tua resposta.","g":"m3-f19-4"},{"t":"vf","p":"O primeiro quarteto limita a mudança ao tempo meteorológico.","v":false,"f":"A enumeração inclui vontades, ser e confiança. A regra é ampla e prepara a passagem para a experiência humana, não apenas para as estações. Relê o cartão «O mundo e a memória» e confronta a pista com a tua resposta.","g":"m3-f19-5"},{"t":"emparelhar","p":"Liga cada elemento ao plano que desenvolve.","pares":[["Vontades e confiança","Mudança da experiência humana"],["Mágoas e saudades","Persistência afetiva na memória"],["Todo o mundo","Alargamento da afirmação inicial"]],"f":"O poema articula uma proposição ampla com efeitos particulares. O que muda pode deixar marcas, pelo que mudança não significa apagamento total. Relê o cartão «O mundo e a memória» e confronta a pista com a tua resposta.","g":"m3-f19-6"},{"t":"ler","titulo":"A natureza e a surpresa","rot":"Lê e confronta","html":"<blockquote>«O tempo cobre o chão de verde manto,<br>Que já coberto foi de neve fria,<br>E enfim converte em choro o doce canto.»<\/blockquote><blockquote>«E, afora este mudar-se cada dia,<br>Outra mudança faz de mor espanto:<br>Que não se muda já como soía.»<\/blockquote><p>Luís de Camões, mesmo soneto, dois tercetos, transcrição da RTP Ensina. O verde sobre o chão antes coberto de neve permite pensar o regresso das estações; o canto transformado em choro introduz uma mudança afetiva.<\/p><p>O final não diz simplesmente que tudo deixou de mudar. Apresenta como espantosa uma alteração na própria maneira de mudar.<\/p><p><strong>Modelo completo.<\/strong> A abertura alarga a mudança ao mundo e às vontades. O quarteto seguinte apresenta novidades que divergem da esperança. A regra geral passa a envolver uma experiência afetiva.<\/p>"},{"t":"completar","p":"Completa a diferença.","frase":"A natureza sugere um [1]; a experiência conserva uma [2].","lacunas":[{"o":["ciclo","corte","limite"],"c":0},{"o":["memória","promessa","certeza"],"c":0}],"f":"O regresso natural não garante a recuperação da experiência anterior. As mágoas e as saudades tornam a memória parte do problema da mudança. Relê o cartão «A natureza e a surpresa» e confronta a pista com a tua resposta.","g":"m3-f19-8"},{"t":"ordenar","p":"Ordena o percurso da reflexão no soneto.","passos":["Afirmar a mudança do mundo e das vontades","Observar o desajuste entre novidade e esperança","Confrontar natureza e transformação afetiva","Estranhar a mudança na própria forma de mudar"],"f":"O último terceto não repete simplesmente a abertura. Reorienta-a e obriga o leitor a reconsiderar aquilo que parecia uma regra evidente. Relê o cartão «A natureza e a surpresa» e confronta a pista com a tua resposta.","g":"m3-f19-9"},{"t":"sublinhar","p":"Que palavra marca a diferença atual em relação ao modo de mudar do passado?","frase":"Que não se muda já como soía.","certas":[4],"f":"Já, associado à negação e à comparação com soía, marca a diferença atual. A expressão não elimina toda a mudança: altera a sua relação com o passado. Relê o cartão «A natureza e a surpresa» e confronta a pista com a tua resposta.","g":"m3-f19-10"},{"t":"escolha","p":"Que leitura do último verso conserva a sua dificuldade?","o":["A maneira de mudar já não é a de antes.","O mundo deixou de mudar em qualquer aspeto.","O tempo volta sempre ao mesmo ponto exato."],"c":0,"f":"O verso compara modos de mudar. Reduzi-lo à imobilidade ou ao regresso idêntico apagaria o espanto introduzido pelo terceto. Relê o cartão «A natureza e a surpresa» e confronta a pista com a tua resposta.","g":"m3-f19-11"},{"t":"vf","p":"As saudades mostram que tudo o que passou desapareceu sem deixar qualquer marca.","v":false,"f":"A saudade é precisamente uma relação com o que se perdeu ou ficou distante. A mudança pode conviver com a persistência na memória. Relê o cartão «A natureza e a surpresa» e confronta a pista com a tua resposta.","g":"m3-f19-12"},{"t":"ler","titulo":"Uma experiência de leitura","rot":"Lê e confronta","html":"<p>Frases didáticas criadas: A: «Voltou a primavera ao jardim.» B: «Voltei ao jardim, mas já não o reconheci da mesma maneira.»<\/p><p>O lugar pode ser o mesmo e a relação com ele ter mudado. A comparação não é uma paráfrase do soneto: serve para experimentar a diferença entre repetição exterior e transformação da experiência.<\/p><p>Contraexemplo à equivalência entre mudar e apagar: mágoas e saudades continuam na memória. Critério: uma leitura da mudança deve explicar também aquilo que persiste.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>No regresso ao jardim, distingue o lugar exterior da relação de quem regressa com ele. Que elemento impede tomar regresso por repetição idêntica?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Classifica os três movimentos.","pares":[["Neve seguida de verde","Alternância natural"],["Canto convertido em choro","Transformação afetiva"],["Mudar de modo diferente do passado","Reflexão sobre a própria mudança"]],"f":"A interpretação ganha precisão quando conserva os planos e explica a sua relação. Nem todas as mudanças apresentadas têm o mesmo sentido. Relê o cartão «Uma experiência de leitura» e confronta a pista com a tua resposta.","g":"m3-f19-14"},{"t":"escolha","p":"Que alteração retiraria a surpresa final?","o":["Terminar apenas com a regra de que tudo muda.","Conservar a comparação com a mudança de antes.","Manter a palavra espanto antes do último verso."],"c":0,"f":"A repetição simples da regra inicial apagaria a reflexão sobre a maneira de mudar. O final faz mais do que confirmar a primeira afirmação. Relê o cartão «Uma experiência de leitura» e confronta a pista com a tua resposta.","g":"m3-f19-15"},{"t":"completar","p":"Completa uma conclusão.","frase":"O soneto parte de uma [1] geral e chega a uma [2] dessa regra.","lacunas":[{"o":["regra","prova","norma"],"c":0},{"o":["revisão","certeza","recusa"],"c":0}],"f":"A organização conduz da afirmação ao espanto. A revisão não exige negar toda a abertura, mas torna mais complexa a relação entre presente e passado. Relê o cartão «Uma experiência de leitura» e confronta a pista com a tua resposta.","g":"m3-f19-16"},{"t":"ordenar","p":"Ordena o movimento do soneto sem reduzir o final à repetição da abertura.","passos":["A mudança é apresentada como regra ampla","A memória conserva marcas do bem e do mal","O regresso natural contrasta com a alteração afetiva","O final interroga a própria maneira de mudar"],"f":"A sequência liga os pormenores à interpretação e conserva o seu limite. Relê o modelo e o contraexemplo: No regresso ao jardim, distingue o lugar exterior da relação de quem regressa com ele. Que elemento impede tomar regresso por repetição idêntica? Relê o cartão «Uma experiência de leitura» e confronta a pista com a tua resposta.","g":"m3-f19-17"},{"t":"escolha","p":"Que comparação com outro poema seria mais produtiva?","o":["Comparar o papel da memória em duas mudanças.","Equiparar o efeito da mudança pelo tema comum.","Atribuir o efeito da mudança à biografia do autor."],"c":0,"f":"A memória permite comparar relações entre experiência e tempo. A comparação deve conservar diferenças, em vez de procurar uma fórmula universal. Relê o cartão «Uma experiência de leitura» e confronta a pista com a tua resposta.","g":"m3-f19-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Que diferença há entre voltar a primavera e voltar a ser quem eras?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
