var ID="M3", D=[{"t":"Medida velha e medida nova","q":[["A redondilha maior tem…",["5 sílabas métricas","7 sílabas métricas","10 sílabas métricas","12 sílabas métricas"],1,"Redondilha maior: 7; menor: 5."],["A «medida nova» usa sobretudo o verso…",["decassílabo","redondilho","alexandrino","livre"],0,"Decassílabo, vindo de Itália."],["Um soneto tem…",["14 versos: duas quadras e dois tercetos","12 versos","16 versos em quatro quadras","8 versos"],0,"Forma fixa de 14 versos."],["A medida nova foi influenciada por…",["Petrarca e a poesia italiana","os trovadores galegos","Fernão Lopes","Gil Vicente"],0,"Influência petrarquista."],["«Endechas a Bárbara escrava» está escrita em…",["medida velha (redondilha)","decassílabos","prosa","verso livre"],0,"Redondilha menor."],["«Mudam-se os tempos, mudam-se as vontades» é…",["um soneto","uma redondilha","uma canção épica","uma écloga"],0,"Soneto."]]},{"t":"Temas da lírica","q":[["«Todo o mundo é composto de mudança» exprime o tema…",["da mudança e do desconcerto","da natureza alegre","da pátria","da religião"],0,"Soneto «Mudam-se os tempos…»."],["O «desconcerto do mundo» é…",["a ideia de que o mundo não segue uma ordem justa","uma música desafinada","a guerra","o fim do mundo"],0,"Os bons sofrem e os maus prosperam."],["Na representação petrarquista, a amada é…",["idealizada: bela, pura, inacessível","descrita com defeitos","sempre uma camponesa","uma deusa grega"],0,"Beleza física e espiritual idealizada."],["Em «Endechas a Bárbara escrava», a amada é…",["uma mulher escrava, de pele escura, afastada do padrão petrarquista","uma rainha","a Virgem Maria","uma pastora loira"],0,"Rompe com o modelo de beleza da época."],["A antítese é…",["a aproximação de ideias opostas","a repetição de um som","uma pergunta sem resposta","a comparação com «como»"],0,"Ex.: «verde manto» / «neve fria»."],["Em «Amor é fogo que arde sem se ver», o recurso central é…",["o paradoxo","a aliteração","a enumeração","a hipálage"],0,"Afirma o contraditório do amor."]]},{"t":"Os Lusíadas","q":[["Os Lusíadas foram publicados em…",["1500","1572","1580","1640"],1,"1572."],["Os Lusíadas têm…",["5 cantos","10 cantos","12 cantos","24 cantos"],1,"Dez cantos."],["Cada estância tem…",["oito versos decassilábicos (oitava rima)","quatro versos","catorze versos","versos livres"],0,"Oitava rima: ABABABCC."],["As partes da epopeia são…",["Proposição, Invocação, Dedicatória e Narração","Introdução, Desenvolvimento e Conclusão","Exórdio e Peroração","Prólogo e Epílogo"],0,"Estrutura interna."],["O herói d'Os Lusíadas é…",["só Vasco da Gama","o povo português (herói coletivo)","D. Sebastião","Adamastor"],1,"Herói coletivo."],["Nas reflexões do Poeta, Camões critica, por exemplo,…",["a cobiça e o desprezo pelas letras","o mar","os deuses gregos","os marinheiros por serem corajosos"],0,"Ex.: canto X — «no gosto da cobiça e na rudeza»."]]},{"t":"Valor modal","q":[["«Talvez chova amanhã.»",["epistémico (probabilidade)","deôntico (obrigação)","apreciativo","deôntico (permissão)"],0,"Grau de certeza."],["«Tens de entregar o texto.»",["deôntico (obrigação)","epistémico","apreciativo","nenhum"],0,"Obrigação."],["«Podes sair mais cedo.» (autorização)",["deôntico (permissão)","epistémico (probabilidade)","apreciativo","assertivo"],0,"Permissão."],["«Felizmente, o poema chegou até nós.»",["apreciativo","deôntico","epistémico","nenhum"],0,"Avaliação de quem fala."],["«Certamente Camões conheceu Petrarca.»",["epistémico (certeza)","deôntico","apreciativo","permissão"],0,"Certeza."],["«Deves ler o soneto duas vezes.» (conselho/obrigação)",["deôntico","epistémico","apreciativo","nenhum"],0,"Valor deôntico."]]},{"t":"Étimo e palavras irmãs","q":[["«cheio» e «pleno» vêm ambos do latim…",["plenum","clavem","palatium","sanum"],0,"Palavras divergentes: uma popular, outra erudita."],["«chave» e «clave» vêm de…",["clavem","plenum","cattum","solem"],0,"Via popular e via erudita."],["«paço» e «palácio» vêm de…",["palatium","passum","pacem","patrem"],0,"Divergentes."],["Palavras de origem popular…",["sofreram mais transformações fonéticas","entraram tarde na língua, quase sem mudar","vêm sempre do grego","não têm étimo"],0,"Evoluíram na boca do povo."],["Palavras eruditas…",["foram tiradas do latim mais tarde, por via culta, e mudaram pouco","são sempre de gíria","vêm do árabe","são estrangeirismos ingleses"],0,"Via culta."],["O étimo de uma palavra é…",["a palavra de onde ela vem","o seu antónimo","a sua classe","o seu plural"],0,"Origem."]]},{"t":"Documentário e cartoon","q":[["Um documentário é…",["um filme de não ficção sobre a realidade, com um ponto de vista","um filme de ficção científica","um anúncio","um videoclipe"],0,"Não ficção com olhar de autor."],["No documentário, importa perguntar…",["que realidade mostra e de que ponto de vista","qual é o ator principal","quanto custou","quem compôs a música"],0,"Finalidade e ponto de vista."],["O cartoon usa sobretudo…",["humor, ironia e síntese visual para criticar","textos longos","fotografias sem legenda","gráficos de dados"],0,"Crítica condensada."],["Numa apreciação crítica deve haver…",["descrição do objeto e juízo fundamentado","só a opinião «gostei»","só o resumo","só a biografia do autor"],0,"Critérios e argumentos."],["A ironia consiste em…",["dizer o contrário do que se quer dar a entender","repetir palavras","exagerar sempre","usar rimas"],0,"Sentido contrário."],["Verdadeiro ou falso: um cartoon pode dispensar palavras.",["Verdadeiro","Falso"],0,"A imagem pode bastar."]]}], CHAVE="epi-pt-quiz-"+ID, $=function(s){return document.querySelector(s)}, atual=-1;
var abertos={}; try{abertos=JSON.parse(localStorage.getItem(CHAVE)||"{}")}catch(e){}
function guardar(){try{localStorage.setItem(CHAVE,JSON.stringify(abertos))}catch(e){}}
function mostrar(qual){["indice","quiz"].forEach(function(s){$("#"+s).hidden=(s!==qual)});window.scrollTo(0,0)}
function estados(){D.forEach(function(z,i){var e=$("#estado-"+i);var r=abertos[i];e.textContent=(typeof r==="number")?r+"/"+z.q.length:z.q.length+" perguntas"})}
function abrirQuiz(i){atual=i;var z=D[i];$("#titulo-q").textContent=(i+1)+". "+z.t;var f=$("#form");f.innerHTML="";z.q.forEach(function(q,k){var d=document.createElement("div");d.className="q";var p=document.createElement("p");p.textContent=(k+1)+". "+q[0];d.appendChild(p);q[1].forEach(function(o,j){var l=document.createElement("label");l.className="op";var r=document.createElement("input");r.type="radio";r.name="q"+k;r.value=j;l.appendChild(r);l.appendChild(document.createTextNode(" "+o));d.appendChild(l)});var ex=document.createElement("div");ex.className="exp";ex.hidden=true;d.appendChild(ex);f.appendChild(d)});$("#resultado").hidden=true;$("#repetir").hidden=true;$("#corrigir").hidden=false;mostrar("quiz")}

$("#corrigir").addEventListener("click",function(e){e.preventDefault();var z=D[atual],certas=0;document.querySelectorAll("#form .q").forEach(function(d,k){var m=d.querySelector("input:checked"),q=z.q[k],ex=d.querySelector(".exp");var ok=m&&+m.value===q[2];if(ok)certas++;ex.hidden=false;ex.className="exp "+(ok?"certo":"errado");ex.textContent=(ok?"Certo. ":"Resposta certa: "+q[1][q[2]]+". ")+q[3];d.querySelectorAll("input").forEach(function(r){r.disabled=true})});$("#resultado").textContent=certas+" / "+z.q.length;$("#resultado").hidden=false;$("#corrigir").hidden=true;$("#repetir").hidden=false;abertos[atual]=Math.max(typeof abertos[atual]==="number"?abertos[atual]:0,certas);guardar()});
$("#repetir").addEventListener("click",function(e){e.preventDefault();abrirQuiz(atual)});
estados();
})();
