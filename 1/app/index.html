<script>
(function(){
var D={"ano":10,"anoNome":"1.º ano","anoCurto":"1.º","modulos":[{"k":"M1","nome":"Literatura Medieval"},{"k":"M2","nome":"Teatro Vicentino"},{"k":"M3","nome":"Lírica e Épica Camoniana"}],"exercicios":[{"pasta":"Ler-a-fundo","ficheiro":"Ondas-do-Mar-de-Vigo.html","id":"ondas-vigo","cor":"#2a6f6f","corEscura":"#79c3c3","marca":"Ler a fundo · 5 min · M1 cantigas","titulo":"Ondas do mar de Vigo","subtitulo":"Martim Codax, séc. XIII","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Voz do mar","Leste o paralelismo como quem ouve uma canção antiga."],[0.5,"Bom ouvido","Já percebeste o jogo das repetições. Volta atrás e afina."],[0,"A aprender a ouvir","Relê em voz alta: estas cantigas foram feitas para se cantarem."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler em voz alta","html":"<p>Esta é uma <b>cantiga de amigo</b>: quem fala é uma rapariga, à espera do namorado que foi para o mar. Lê em voz alta, devagar.</p><p><i>Ondas do mar de Vigo,<br>se vistes meu amigo?<br>e ai Deus, se verrá cedo?</i></p><p><i>Ondas do mar levado,<br>se vistes meu amado?<br>e ai Deus, se verrá cedo?</i></p><p class=\"nota\"><b>levado</b> — agitado · <b>verrá</b> — virá · <b>cedo</b> — em breve</p>","links":[["Ver a cantiga com manuscrito e música (FCSH)","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=1308"]]},{"nivel":1,"tipo":"unica","rot":"Quem fala","pergunta":"Quem está a falar nesta cantiga?","opcoes":[["Uma rapariga que espera o namorado","certo","Sim. É a marca da cantiga de amigo: voz feminina, ausência, espera."],["Um trovador que fala da sua senhora","cuidado","Isso seria cantiga de amor. Aqui quem fala pergunta pelo «meu amigo»."],["Um marinheiro no mar de Vigo","cuidado","Repara em quem pergunta: fala de terra, para as ondas."]]},{"nivel":1,"tipo":"multi","rot":"O que muda","pergunta":"Entre a primeira e a segunda estrofe, o que muda mesmo?","opcoes":[["«de Vigo» passa a «levado»",5,"Sim: o mar deixa de ser um lugar e passa a estar agitado."],["«amigo» passa a «amado»",5,"Sim: a mesma pessoa, dito de outra maneira. Chama-se variação."],["A pergunta final desaparece",0,"Não: o refrão «e ai Deus, se verrá cedo?» repete-se igual."],["A rapariga passa a falar com Deus",0,"Deus já aparece no refrão da primeira estrofe."]]},{"nivel":2,"tipo":"unica","rot":"O mar responde?","pergunta":"Ela pergunta às ondas. O que é que isso mostra?","opcoes":[["Que não tem mais ninguém a quem perguntar","certo","Defensável: a solidão é tanta que só resta falar com a natureza."],["Que as ondas trouxeram notícias antes","cuidado","O texto não diz isso. Fica pelo que lá está."],["Que ela não sabe que ele partiu","cuidado","Ela sabe: pergunta se o viram e se voltará cedo."]]},{"nivel":2,"tipo":"cartoes","rot":"O refrão","pergunta":"O refrão repete-se sempre igual. Escolhe o efeito que te parece mais forte e explica numa linha.","cartoes":[["Insistência","Quem espera repete a mesma pergunta, vezes sem conta."],["Canção","O refrão faz da cantiga uma música, para ser cantada e dançada."],["Tempo parado","Nada avança: a espera é sempre a mesma."],["Angústia crescente","Repetir a pergunta sem resposta aumenta o desespero."]]},{"nivel":3,"tipo":"texto","rot":"A tua estrofe","pergunta":"Escreve uma terceira estrofe à maneira de Codax: muda só duas palavras e mantém o refrão. Até 20 palavras.","minPalavras":8,"maxPalavras":20,"placeholder":"Ondas do mar…"},{"nivel":3,"tipo":"texto","rot":"Hoje","pergunta":"A quem, ou a que coisa, perguntarias hoje por alguém de quem tens saudades? Uma frase, com uma imagem concreta.","minPalavras":8,"placeholder":"Perguntaria…"}],"fontes":[["Cantigas Medievais Galego-Portuguesas (FCSH), n.º 1308","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=1308"],["Sobre as cantigas (FCSH)","https://cantigas.fcsh.unl.pt/sobreascantigas.asp"]],"modulo":"M1","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Gramatica-E-Mas-Portanto.html","id":"gram-coordenadas","cor":"#4f6f2a","corEscura":"#a3c47a","marca":"Gramática em contexto · 5 min · M1 cantigas e crónica","titulo":"E, mas, portanto","subtitulo":"Orações coordenadas nas cantigas e na crónica","niveis":["Reconhecer","Provar com um teste","Usar na tua escrita"],"emblemas":[[0.8,"Ligações certas","Distingues somar, opor e concluir — e mostraste em cada caso que nenhuma oração está dentro da outra."],[0.5,"Bom caminho","Acertaste no essencial. Repete o teste da troca por «e», «mas», «portanto»."],[0,"A ligar","Volta à pergunta: que lugar ocupa cada oração na frase? Que palavra as liga?"]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Três frases verdadeiras","html":"<p>Três frases de há setecentos anos, com uma palavra pequena a ligar duas orações:</p><p><b>A.</b> «Nom hei [eu i] barqueiro <i>nem</i> sei remar.» (Mendinho)</p><p><b>B.</b> «fostes-vos queixar que vos nunca louv'en[o] meu cantar; / <i>mais</i> ora quero fazer um cantar» (Guilhade)</p><p><b>C.</b> «Acorrei ao Mestre, <i>que</i> o matam!» (Fernão Lopes)</p><p class=\"nota\"><b>nem</b> — e não · <b>mais</b> — mas · Duas orações estão <b>coordenadas</b> quando se ligam sem que nenhuma esteja dentro da outra.</p>","links":[["Mendinho, «Sedia-m'eu na ermida» (FCSH)","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=861"],["Guilhade, «Ai dona fea» (FCSH)","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=1520"]]},{"nivel":1,"tipo":"unica","rot":"Somar","pergunta":"Em A, «nem sei remar» é uma oração coordenada…","opcoes":[["copulativa","certo","Sim: «nem» soma uma segunda falta à primeira («e não sei remar»)."],["adversativa","cuidado","Teste: podes trocar «nem» por «mas»? «Não tenho barqueiro mas sei remar» diz o contrário."],["conclusiva","cuidado","Teste: «portanto não sei remar»? Não saber remar não é consequência de não ter barqueiro."]]},{"nivel":1,"tipo":"unica","rot":"Opor","pergunta":"Em B, «mais ora quero fazer um cantar» opõe-se ao que vem antes. É uma coordenada…","opcoes":[["adversativa","certo","Sim: «mais» vale por «mas». Ela queixou-se de nunca ser louvada; agora ele vai «louvá-la»… à maneira dele."],["copulativa","cuidado","Teste: se fosse só somar, servia «e». Mas há um contraste: queixa de um lado, resposta do outro."],["explicativa","cuidado","Teste: «mais» justifica alguma coisa? Não: contraria."]]},{"nivel":2,"tipo":"multi","rot":"Pistas, não provas","pergunta":"Que pistas ajudam a reconhecer coordenação? Toca nas que servem — mas repara no que não chega.","opcoes":[["Nenhuma das orações ocupa um lugar dentro da outra",5,"É esta a definição: não há uma oração a fazer de sujeito, de complemento ou de acompanhante de um nome."],["A ligação troca-se por «e», «mas» ou «portanto» sem mudar a estrutura",5,"Boa pista. Confirma sempre olhando para a função de cada oração."],["Cada oração aguenta-se sozinha como frase",0,"Isto não chega: em «Sei que ele chegou», «que ele chegou» é completiva e mesmo assim «Ele chegou» seria frase."],["Contar as sílabas de cada oração",0,"Serve para a métrica, não para a sintaxe."]]},{"nivel":2,"tipo":"unica","rot":"Um «que» que não é o do costume","pergunta":"Em C, «Acorrei ao Mestre, que o matam!», o «que» vale por…","opcoes":[["«pois»: justifica a ordem (coordenada explicativa)","certo","Sim: primeiro a ordem, depois a razão. Teste: «Acorrei ao Mestre, pois matam-no!»."],["«o qual»: refere-se ao Mestre (oração relativa)","cuidado","Teste: «o Mestre, o qual o matam» não faz sentido; o «o» já é o Mestre."],["«isso»: completa o verbo (oração completiva)","cuidado","Teste: «Acorrei isso»? Não: «acorrer» pede «ao Mestre», não uma completiva."]]},{"nivel":2,"tipo":"cartoes","rot":"A palavra que muda tudo","pergunta":"«Cercaram-me as ondas … não tenho barqueiro.» Escolhe a ligação que mais muda o que a rapariga sente e explica numa linha.","cartoes":[["e","Só soma: duas coisas más, uma a seguir à outra."],["mas","Resiste: as ondas cercam-na, e mesmo assim ela conta com alguém que não vem."],["portanto","Conclui: sem barqueiro, o cerco das ondas é o fim."],["ou","Alternativa impossível: ou as ondas, ou o barqueiro — e ela não tem escolha."]]},{"nivel":3,"tipo":"texto","rot":"Duas ligações","pergunta":"Escreve a mesma ideia duas vezes: alguém espera uma mensagem que não chega. Primeiro liga as duas orações com «mas», depois com «portanto». Até 40 palavras.","minPalavras":12,"maxPalavras":40,"placeholder":"O telemóvel está ligado, mas… / O telemóvel está ligado, portanto…"},{"nivel":3,"tipo":"detalhes","rot":"Etiquetar","pergunta":"Na tua frase com «portanto», identifica:","campos":["A primeira oração:","A segunda oração e o tipo de coordenada:","O teste que usaste:"]}],"fontes":[["Cantigas Medievais Galego-Portuguesas (FCSH), n.º 861 e n.º 1520","https://cantigas.fcsh.unl.pt"],["Fernão Lopes, Crónica de D. João I, cap. XII, ed. 1897 (Internet Archive)","https://archive.org/details/chronicadeelreid0103lopeuoft"]],"modulo":"M1","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Ines-Pereira-Escolher.html","id":"ines-escolher","cor":"#8a4a86","corEscura":"#c99bc4","marca":"Ler a fundo · 5 min · M2 Gil Vicente","titulo":"Asno que me leve","subtitulo":"Gil Vicente, Farsa de Inês Pereira, 1523","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de comédia","Apanhaste a ironia e o jogo dos provérbios."],[0.5,"Bom ouvido para o cómico","Já vês a piada. Agora procura a crítica por baixo."],[0,"A entrar na farsa","Relê em voz alta: o texto foi escrito para ser dito."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Inês Pereira queria um marido «discreto», que soubesse tocar e falar bem. Casou com o escudeiro Brás da Mata — e levou pancada. Viúva, escolhe outra vez. Agora diz:</p><p><i>Andar! Pêro Marques seja.<br>Quero tomar por esposo<br>Quem se tenha por ditoso<br>De cada vez que me veja.<br>Por usar de siso mero,<br>Asno que me leve quero,<br>E não cavalo folão.<br>Antes lebre que leão,<br>Antes lavrador que Nero.</i></p><p class=\"nota\"><b>siso mero</b> — bom senso · <b>folão</b> — fogoso, indomável · <b>Nero</b> — imperador romano, símbolo de crueldade</p>","links":[["Ler a farsa inteira (Wikisource)","https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira"]]},{"nivel":1,"tipo":"unica","rot":"A escolha","pergunta":"Que tipo de marido escolhe Inês agora?","opcoes":[["Um homem simples, que a deixe mandar","certo","Sim: «asno que me leve», não «cavalo folão». Prefere quem obedece."],["Um escudeiro elegante e culto","cuidado","Foi essa a primeira escolha — e correu mal."],["Um homem rico e poderoso","cuidado","Ela fala de «lavrador», não de senhor."]]},{"nivel":1,"tipo":"multi","rot":"Pares em oposição","pergunta":"Toca nos pares que o texto põe frente a frente.","opcoes":[["asno × cavalo folão",5,"Sim: o manso contra o indomável."],["lebre × leão",5,"Sim: o medroso contra o feroz."],["lavrador × Nero",5,"Sim: o homem do campo contra o tirano."],["Inês × a mãe",0,"A mãe não aparece nestes versos."]]},{"nivel":2,"tipo":"unica","rot":"Ironia","pergunta":"«Asno que me leve quero» é dito a sério?","opcoes":[["Sim, é uma escolha pensada, dita com humor","certo","Defensável: Inês aprendeu com a pancada e escolhe com frieza cómica."],["Não, é só um insulto ao futuro marido","cuidado","Há insulto, mas há sobretudo cálculo: ela diz o que quer ganhar com isso."],["É um provérbio popular sem ligação à história","cuidado","É mesmo um provérbio, mas aqui resume a lição que Inês tirou."]]},{"nivel":2,"tipo":"cartoes","rot":"O que Gil Vicente critica","pergunta":"Escolhe o alvo que te parece mais forte e explica numa linha.","cartoes":[["O casamento como negócio","Escolhe-se marido como quem escolhe montada."],["A aparência","O escudeiro falava bem e tocava — e era violento."],["A condição das mulheres","Para ter liberdade, Inês tem de escolher quem a domine menos."],["A hipocrisia social","Todos fingem procurar virtudes; procuram conveniências."]]},{"nivel":3,"tipo":"texto","rot":"O teu provérbio","pergunta":"Escreve um provérbio teu, à maneira de Inês, sobre uma escolha de hoje. Duas linhas, com dois animais ou dois objetos em oposição.","minPalavras":8,"maxPalavras":25,"placeholder":"Antes… que…"},{"nivel":3,"tipo":"texto","rot":"Defender Inês","pergunta":"Inês é calculista ou é uma mulher que aprendeu a sobreviver? Toma posição numa frase, com uma prova do texto.","minPalavras":10,"placeholder":"Penso que… porque no texto…"}],"fontes":[["Gil Vicente, Farsa de Inês Pereira (Wikisource)","https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira"],["Wikipédia, «Farsa de Inês Pereira»","https://pt.wikipedia.org/wiki/Farsa_de_In%C3%AAs_Pereira"]],"modulo":"M2","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Gramatica-Quem-Manda-na-Frase.html","id":"gram-subordinadas","cor":"#8a4a86","corEscura":"#c99bc4","marca":"Gramática em contexto · 5 min · M2 Gil Vicente","titulo":"Quem manda na frase","subtitulo":"Orações subordinadas na Farsa de Inês Pereira","niveis":["Reconhecer","Provar com um teste","Usar na tua escrita"],"emblemas":[[0.8,"Mão firme na sintaxe","Não adivinhaste: testaste cada oração antes de lhe dar nome."],[0.5,"Bom caminho","Acertaste no essencial. Repete a pergunta: esta oração ocupa um lugar dentro da outra?"],[0,"A construir","Volta ao princípio: procura primeiro o verbo de cada oração."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A pergunta certa","html":"<p>Numa frase com duas orações, pergunta: <b>uma delas ocupa um lugar dentro da outra?</b></p><p>Se ocupa, é <b>subordinada</b>. Vê que lugar: <i>quando?</i> temporal · <i>com que condição?</i> condicional · <i>porquê?</i> causal · acompanha um nome, relativa · é o próprio complemento, completiva.</p><p>Se as duas ficam lado a lado, sem uma estar dentro da outra, são <b>coordenadas</b>.</p><p class=\"nota\">Atenção ao atalho: «aguenta-se sozinha» não decide nada. Em «Sei que ele chegou», «Ele chegou» seria frase, e mesmo assim a oração é completiva. Os versos que se seguem são da farsa, na grafia da edição.</p>","links":[["Ler a farsa inteira (Wikisource)","https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira"]]},{"nivel":1,"tipo":"unica","rot":"Quando?","pergunta":"«Quando te não precatares, / Virão maridos a pares». A primeira oração é…","opcoes":[["subordinada adverbial temporal","certo","Sim: responde a «quando virão?». E não se aguenta sozinha: «Quando te não precatares» fica a meio."],["coordenada copulativa","cuidado","Teste: troca por «e». «E te não precatares, virão maridos» não funciona."],["subordinada adverbial condicional","cuidado","Neste verso, «quando» situa no tempo a chegada dos maridos, e é essa a leitura trabalhada. Noutros contextos, «quando» pode ter valor condicional."]]},{"nivel":1,"tipo":"unica","rot":"Se?","pergunta":"«Se não tiveres que comer / O tanger te há-de fartar?» A primeira oração é…","opcoes":[["subordinada adverbial condicional","certo","Sim: põe uma condição. A Mãe pergunta a Inês de que serve um marido que só sabe tocar."],["subordinada adverbial causal","cuidado","Teste: responde a «porquê?». Não: responde a «em que caso?»."],["subordinada substantiva completiva","cuidado","Teste: substitui por «isso». «Isso o tanger te há-de fartar?» não resulta."]]},{"nivel":2,"tipo":"multi","rot":"Qual delas","pergunta":"«Homem que não tem nem preto, / Casa muito na má hora.» Toca em tudo o que é verdade sobre «que não tem nem preto».","opcoes":[["Diz de que homem se fala",5,"Sim: restringe «homem» — é relativa restritiva."],["Pode sair sem partir a frase, mas muda o sentido",5,"Sim: «Homem casa muito na má hora» continua frase, mas já não é a mesma ideia."],["Aguenta-se sozinha como frase",0,"Não: «que não tem nem preto» precisa do nome que acompanha."],["Responde a «quando?»",0,"Responde a «qual homem?»."]]},{"nivel":2,"tipo":"unica","rot":"O quê?","pergunta":"«Não sei se me vá a el-Rei». A oração «se me vá a el-Rei» é…","opcoes":[["subordinada substantiva completiva","certo","Sim. Teste do «isso»: «Não sei isso». É o que Lianor não sabe."],["subordinada adverbial condicional","cuidado","O «se» engana. Teste: «Não sei, se me vá a el-Rei» não faz sentido como condição."],["subordinada adjetiva relativa","cuidado","Teste: que nome é que ela acompanha? Nenhum."]]},{"nivel":2,"tipo":"cartoes","rot":"A mesma ideia, outra oração","pergunta":"«Inês aceita o Escudeiro porque ele sabe tanger viola.» Escolhe a reescrita que mais muda o que se diz de Inês e explica numa linha.","cartoes":[["Inês aceita o Escudeiro, que sabe tanger viola.","Relativa: tanger passa a pormenor, deixa de ser a razão."],["Embora ele só saiba tanger viola, Inês aceita-o.","Concessiva: Inês aceita apesar de, e não por causa de."],["Se ele souber tanger viola, Inês aceita-o.","Condicional: a escolha fica em suspenso, por cumprir."],["Inês aceita o Escudeiro para que ele lhe toque viola.","Final: o tanger passa a objetivo dela."]]},{"nivel":3,"tipo":"texto","rot":"A tua escolha","pergunta":"Escreve duas frases sobre uma escolha tua: uma com subordinada causal («porque…») e outra com concessiva («embora…»). Até 40 palavras.","minPalavras":12,"maxPalavras":40,"placeholder":"Escolhi… porque… / Embora…, escolhi…"},{"nivel":3,"tipo":"detalhes","rot":"Etiquetar","pergunta":"Na frase com «embora», identifica:","campos":["A oração subordinante:","A oração subordinada e o tipo:","O teste que usaste:"]}],"fontes":[["Gil Vicente, Farsa de Inês Pereira (Wikisource)","https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira"],["Dicionário Terminológico","https://dt.dge.mec.pt"]],"modulo":"M2","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camoes-Mudam-se.html","id":"camoes-mudanca","cor":"#1f5d8c","corEscura":"#7fb3d8","marca":"Ler a fundo · 5 min · M3 Camões","titulo":"Mudam-se os tempos","subtitulo":"Luís de Camões, soneto","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de sonetos","Seguiste o argumento do soneto até à volta final."],[0.5,"Bom leitor","Percebeste a ideia. Falta afinar a leitura da chave de ouro."],[0,"A entrar no soneto","Relê: cada quarteto dá um passo, e o fim vira tudo."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Um soneto sobre uma coisa só: tudo muda.</p><p><i>Mudam-se os tempos, mudam-se as vontades,<br>Muda-se o ser, muda-se a confiança:<br>Todo o mundo é composto de mudança,<br>Tomando sempre novas qualidades.</i></p><p><i>Continuamente vemos novidades,<br>Diferentes em tudo da esperança:<br>Do mal ficam as mágoas na lembrança,<br>E do bem (se algum houve) as saudades.</i></p><p class=\"nota\">Grafia modernizada. O soneto continua com mais dois tercetos, que podes ler na íntegra.</p>","links":[["Ouvir e ler o soneto (RTP Ensina)","https://ensina.rtp.pt/artigo/mudam-se-os-tempos-mudam-se-as-vontades-de-luis-de-camoes/"]]},{"nivel":1,"tipo":"multi","rot":"O que se repete","pergunta":"Toca no que se repete mesmo nos quatro primeiros versos.","opcoes":[["O verbo «mudar»",5,"Quatro vezes em dois versos: a repetição é a própria ideia."],["A palavra «tempo»",0,"Aparece uma vez, no primeiro verso."],["A estrutura «muda-se X»",5,"Sim: a mesma forma, com sujeitos diferentes."],["A palavra «saudade»",0,"Só aparece no fim da segunda estrofe."]]},{"nivel":1,"tipo":"unica","rot":"O balanço","pergunta":"No verso «Do mal ficam as mágoas na lembrança, / E do bem (se algum houve) as saudades», o que fica de um e de outro?","opcoes":[["Do mal fica a dor; do bem fica a falta","certo","Exato. Nos dois casos fica uma perda: nada de bom se conserva inteiro."],["Do mal não fica nada; do bem fica tudo","cuidado","Repara: das duas coisas fica sempre alguma perda."],["Fica a esperança de melhores tempos","cuidado","O verso diz o contrário: as novidades são «diferentes em tudo da esperança»."]]},{"nivel":2,"tipo":"unica","rot":"O parêntese","pergunta":"Porque escreve Camões «(se algum houve)»?","opcoes":[["Para pôr em dúvida que tenha havido bem","certo","Sim: um parêntese curto que deita abaixo a consolação. É amargo e discreto."],["Para respeitar a medida do verso","cuidado","Serve o ritmo, mas o efeito é de dúvida."],["Para falar diretamente com o leitor","cuidado","Não há apelo ao leitor; há um comentário do próprio sujeito."]]},{"nivel":2,"tipo":"deslizar","rot":"O tom","pergunta":"Este soneto é mais uma constatação serena ou uma queixa?","esquerda":"constatação","direita":"queixa"},{"nivel":3,"tipo":"texto","rot":"Mudam-se os…","pergunta":"Escreve dois versos teus a começar por «Mudam-se», sobre algo que mudou na tua vida este ano. Até 20 palavras.","minPalavras":6,"maxPalavras":20,"placeholder":"Mudam-se…"},{"nivel":3,"tipo":"cartoes","rot":"Onde ouves isto hoje","pergunta":"Escolhe onde reconheces a mesma ideia e explica numa linha.","cartoes":[["Numa canção","Letras sobre tempo, perda e mudança."],["Numa fotografia antiga","O mesmo lugar, outra gente."],["No teu curso","Tecnologias que ficaram velhas depressa."],["Numa despedida","O que fica de quem já não está perto."]]}],"fontes":[["RTP Ensina: «Mudam-se os tempos, mudam-se as vontades»","https://ensina.rtp.pt/artigo/mudam-se-os-tempos-mudam-se-as-vontades-de-luis-de-camoes/"],["Obras Completas de Luís de Camões, t. II (Project Gutenberg)","https://www.gutenberg.org/ebooks/31509"]],"modulo":"M3","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camoes-Duas-Invocacoes.html","id":"camoes-invocacoes","cor":"#7a3b3b","corEscura":"#d09a9a","marca":"Ler a fundo · 5 min · M3 Camões","titulo":"Do som alto ao nô mais","subtitulo":"Os Lusíadas: o princípio e o fim","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Ouvido para o tom","Percebeste que o mesmo poema muda de voz entre a primeira página e a última."],[0.5,"Bom ouvido","Já apanhaste o essencial. Volta a ler as duas estâncias em voz alta, seguidas."],[0,"A afinar","Lê outra vez, devagar: repara em quem pede e em quem manda calar."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Duas vezes a mesma Musa","html":"<p>Uma epopeia começa a pedir ajuda às Musas. Esta acaba a mandá-las calar. São as duas pontas do mesmo poema.</p><p><b>No princípio</b> (canto I, estância 4):</p><p><i>E vós, Tágides minhas, pois criado<br>Tendes em mim um novo engenho ardente,<br>[…]<br>Dai-me agora um som alto e sublimado,<br>Um estilo grandíloquo e corrente</i></p><p><b>No fim</b> (canto X, estância 145):</p><p><i>Nô mais, Musa, nô mais, que a Lira tenho<br>Destemperada e a voz enrouquecida,<br>E não do canto, mas de ver que venho<br>Cantar a gente surda e endurecida.</i></p><p class=\"nota\"><b>Tágides</b> — ninfas do Tejo · <b>grandíloquo</b> — elevado, solene · <b>nô mais</b> — não mais · <b>destemperada</b> — desafinada</p>","links":[["Ler a estância I, 4 (oslusiadas.org)","https://oslusiadas.org/i/4.html"],["Ler a estância X, 145 (oslusiadas.org)","https://oslusiadas.org/x/145.html"]]},{"nivel":1,"tipo":"unica","rot":"O pedido","pergunta":"No princípio, o que é que o Poeta pede às Tágides?","opcoes":[["Uma voz alta e solene, à altura do que vai contar","certo","Sim: «um som alto e sublimado, / Um estilo grandíloquo e corrente»."],["Que o ajudem a chegar à Índia","cuidado","Quem viaja é a armada. Ele pede ajuda para cantar a viagem."],["Que lhe deem fama entre os poetas","cuidado","Pede o estilo, não a fama. A fama aparece mais à frente, e para outros."]]},{"nivel":1,"tipo":"multi","rot":"O fim","pergunta":"No fim, o que é que mudou? Toca em tudo o que o texto diz.","opcoes":[["A lira está desafinada",5,"Sim: «a Lira tenho / Destemperada»."],["A voz está rouca",5,"Sim: «a voz enrouquecida»."],["Quem o ouve não quer ouvir",5,"Sim: canta «a gente surda e endurecida»."],["A viagem correu mal",0,"A viagem chegou ao fim. O que corre mal é o país que o recebe."]]},{"nivel":2,"tipo":"unica","rot":"A causa","pergunta":"«E não do canto, mas de ver que venho / Cantar a gente surda.» O que é que isto quer dizer?","opcoes":[["Não está rouco de cantar: está rouco de cantar para quem não ouve","certo","Sim. O cansaço não vem do trabalho, vem da falta de resposta."],["Cantou tanto tempo que perdeu a voz","cuidado","É o que ele nega: «não do canto»."],["A Musa deixou de o ajudar","cuidado","É ele que a manda parar, não o contrário."]]},{"nivel":2,"tipo":"cartoes","rot":"Celebrar e criticar","pergunta":"O mesmo poema louva os portugueses e queixa-se deles. Escolhe a leitura que defendes e explica numa linha.","cartoes":[["São duas vozes","A do narrador que celebra e a do homem que escreve, cansado."],["A crítica é parte do elogio","Só quem ama o que canta se zanga por ser mal ouvido."],["O fim desmente o princípio","A última estância tira o chão à promessa da primeira."],["É uma queixa profissional","Ele pede, no fundo, que o país pague e reconheça quem escreve."]]},{"nivel":3,"tipo":"texto","rot":"A tua invocação","pergunta":"Escreve o princípio de um trabalho teu a pedir ajuda a alguém ou a alguma coisa (uma pessoa, uma cidade, uma máquina). Duas linhas, a pedir uma qualidade, como Camões pede «um som alto».","minPalavras":10,"maxPalavras":35,"placeholder":"E vós…"},{"nivel":3,"tipo":"texto","rot":"O teu nô mais","pergunta":"Agora o contrário: duas linhas em que desistes de falar para quem não ouve. Diz porquê, sem insultar ninguém.","minPalavras":10,"maxPalavras":35,"placeholder":"Não mais…"}],"fontes":[["Os Lusíadas, canto I, est. 4 (oslusiadas.org)","https://oslusiadas.org/i/4.html"],["Os Lusíadas, canto X, est. 145 (oslusiadas.org)","https://oslusiadas.org/x/145.html"]],"modulo":"M3","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Candide-Cultivar-o-Jardim.html","id":"candide-jardim","cor":"#3f5f3f","corEscura":"#9dc39d","marca":"Ler a fundo · 5 min · Leituras extra","titulo":"Cultivar o nosso jardim","subtitulo":"Voltaire, Cândido, 1759","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Ironia apanhada","Viste onde Voltaire diz uma coisa para dizer o contrário."],[0.5,"Bom ouvido para a ironia","Já percebeste o jogo. Relê o elogio ao barão e pergunta porquê."],[0,"A entrar no conto","Relê devagar: quando o narrador elogia, desconfia."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Em 1759, <b>Voltaire</b> escreve a história de um rapaz que aprende que vive no melhor dos mundos possíveis. Depois vêm a guerra, o naufrágio e o terramoto de Lisboa.</p><p><i>Havia na Vestefália, no castelo do senhor barão de Thunder-ten-tronckh, um rapaz a quem a natureza dera os costumes mais doces. […] Tinha o juízo bastante reto e o espírito mais simples; é, creio, por essa razão que lhe chamavam Cândido.</i></p><p><i>O senhor barão era um dos senhores mais poderosos da Vestefália, porque o seu castelo tinha uma porta e janelas.</i></p><p class=\"nota\">Tradução nossa do francês. Cândido — nome que quer dizer ingénuo, puro.</p>","links":[["Ler o original em francês (Project Gutenberg)","https://www.gutenberg.org/ebooks/4650"]]},{"nivel":1,"tipo":"unica","rot":"O castelo","pergunta":"«Era um dos senhores mais poderosos da Vestefália, porque o seu castelo tinha uma porta e janelas.» Porque é que isto faz sorrir?","opcoes":[["A razão dada é banal e desfaz a grandeza anunciada","certo","Sim: qualquer casa tem porta e janelas. O narrador finge elogiar e ridiculariza."],["Porque um castelo não pode ter janelas","cuidado","Pode. O riso está na razão apresentada, não no facto."],["Porque o barão era pobre e mentia","cuidado","O texto não diz que mente. Diz que o motivo do poder é ridículo."]]},{"nivel":1,"tipo":"unica","rot":"O nome","pergunta":"Porque é que o rapaz se chama Cândido?","opcoes":[["Pelo juízo reto e pelo espírito simples","certo","Sim, é o próprio texto que o explica: «por essa razão que lhe chamavam Cândido»."],["Por ser filho do barão","cuidado","O texto levanta dúvidas sobre a família dele, mas o nome vem do carácter."],["Por ser o mais corajoso do castelo","cuidado","Cândido quer dizer ingénuo, não corajoso."]]},{"nivel":2,"tipo":"multi","rot":"Depois do terramoto","pergunta":"Depois do terramoto de Lisboa, escreve Voltaire, decidiu-se que «o espetáculo de algumas pessoas queimadas em lume brando» seria «um segredo infalível para impedir a terra de tremer». Toca no que ele está a criticar.","opcoes":[["A superstição de ligar um castigo a um fenómeno natural",5,"Sim: a terra não treme por causa do que as pessoas fazem."],["A crueldade transformada em cerimónia pública",5,"Sim: «em grande cerimónia», como se fosse festa."],["Os sábios e a universidade que o decidem",5,"Sim: quem devia pensar é quem assina a decisão."],["Os habitantes de Lisboa que fugiram",0,"Não há crítica a quem sofreu o terramoto."]]},{"nivel":2,"tipo":"cartoes","rot":"A última frase","pergunta":"No fim, o mestre Pangloss continua a explicar que tudo está bem, e Cândido responde: «é preciso cultivar o nosso jardim». Escolhe a leitura que defendes e explica numa linha.","cartoes":[["Desistir de mudar o mundo","Cansado de teorias, fecha-se no que é seu."],["Trocar a teoria pelo trabalho","Deixa de explicar o mal e começa a fazer alguma coisa."],["Escolher onde se consegue agir","Não é o mundo inteiro: é o pedaço onde a minha mão chega."],["Uma resposta que cala o mestre","Depois de tanta explicação, uma frase curta encerra a conversa."]]},{"nivel":3,"tipo":"texto","rot":"O teu jardim","pergunta":"Qual é o teu jardim este ano: uma coisa pequena, ao teu alcance, que fique melhor se lhe pegares? Escreve o primeiro passo, com um verbo de ação.","minPalavras":10,"maxPalavras":40,"placeholder":"O meu jardim é… e o primeiro passo é…"},{"nivel":3,"tipo":"texto","rot":"À maneira de Voltaire","pergunta":"Escreve uma frase que finja elogiar alguma coisa e a deixe ridícula, com a mesma receita do castelo: elogio grande, razão banal.","minPalavras":8,"maxPalavras":30,"placeholder":"É o maior… porque…"}],"fontes":[["Voltaire, Candide, ou l'Optimisme, texto francês (Project Gutenberg)","https://www.gutenberg.org/ebooks/4650"],["Cândido, ou O Otimismo (Wikipédia)","https://pt.wikipedia.org/wiki/C%C3%A2ndido,_ou_O_Otimismo"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Dom-Casmurro-O-Titulo.html","id":"casmurro-titulo","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · Leituras extra","titulo":"Não consultes dicionários","subtitulo":"Machado de Assis, Dom Casmurro, 1899 · cap. I","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor desconfiado","Percebeste quem manda neste livro: quem o conta."],[0.5,"Bom começo","Já sabes como nasceu o título. Pergunta agora a quem interessa contá-lo assim."],[0,"A entrar no romance","Relê devagar: é tudo contado por um homem só."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Em 1899, o brasileiro <b>Machado de Assis</b> abre um romance a explicar o título. Quem fala é o próprio protagonista: no comboio, um rapaz do bairro pôs-se a recitar-lhe versos.</p><p><i>Succedeu, porém, que como eu estava cançado, fechei os olhos tres ou quatro vezes; tanto bastou para que elle interrompesse a leitura e mettesse os versos no bolso.</i> […]</p><p><i>No dia seguinte entrou a dizer de mim nomes feios, e acabou alcunhando-me Dom Casmurro. Os visinhos, que não gostam dos meus habitos reclusos e calados, deram curso á alcunha, que afinal pegou.</i> […]</p><p><i>Não consultes diccionarios. Casmurro não está aqui no sentido que elles lhe dão, mas no que lhe poz o vulgo de homem calado e mettido comsigo. Dom veiu por ironia, para attribuir-me fumos de fidalgo. Tudo por estar cochilando!</i> […]</p><p><i>O meu poeta do trem ficará sabendo que não lhe guardo rancor. E com pequeno esforço, sendo o titulo seu, poderá cuidar que a obra é sua.</i></p><p class=\"pequeno\">Grafia da edição de 1899: «succedeu», «cançado», «diccionarios». «Cochilar» é dormitar; «trem» é comboio.</p>"},{"nivel":1,"tipo":"ordenar","rot":"Como nasce um título","pergunta":"Põe por ordem o caminho que vai de uns versos no comboio até à capa do livro.","itens":["Um rapaz do bairro recita-lhe versos no comboio","O narrador, cansado, fecha os olhos três ou quatro vezes","O rapaz interrompe a leitura e mete os versos no bolso","No dia seguinte, o rapaz chama-lhe Dom Casmurro","Os vizinhos espalham a alcunha, e ela pega","O narrador dá ao livro o título que o ofendia"],"retorno":"Quem batiza o livro é um poeta amuado. O narrador pega na ofensa e assina por baixo."},{"nivel":2,"tipo":"unica","rot":"O dicionário","pergunta":"«Não consultes diccionarios.» Porque é que o narrador dá esta ordem ao leitor?","opcoes":[["Porque usa a palavra num sentido que ele escolheu, e quer mandar na leitura","certo","Sim: «calado e mettido comsigo». É ele quem decide o que as palavras querem dizer."],["Porque a palavra «casmurro» não existe","cuidado","Existe, e o narrador sabe-o: fala do «sentido que elles lhe dão». Só não quer que o uses."],["Porque os dicionários do tempo estavam errados","cuidado","Não diz que estão errados. Diz que o sentido dele é outro."]]},{"nivel":2,"tipo":"multi","rot":"Confiar em quem conta","pergunta":"Este homem vai contar a própria vida sozinho, sem mais ninguém a confirmar. Toca no que, logo na primeira página, já faz desconfiar.","opcoes":[["Decide ele o que as palavras querem dizer",5,"Sim: «Não consultes diccionarios»."],["Diz que não guarda rancor e, na frase seguinte, troça do poeta",5,"Sim: «poderá cuidar que a obra é sua»."],["Conta só o seu lado: do rapaz, sabemos o que ele nos quer dizer",5,"Sim: o poeta nunca tem a palavra."],["Engana-se no nome do comboio",0,"Não há engano nenhum: é o «trem da Central»."]]},{"nivel":3,"tipo":"texto","rot":"A tua alcunha","pergunta":"Que alcunha te deram, ou darias a ti? Explica-a à maneira de Machado: diz primeiro o que ela NÃO quer dizer, depois o que quer.","minPalavras":12,"maxPalavras":45,"placeholder":"Não consultes dicionários. … não está aqui no sentido de…, mas no de…"}],"fontes":[["Machado de Assis, Dom Casmurro (1899), texto integral (Project Gutenberg n.º 55752)","https://www.gutenberg.org/ebooks/55752"],["Dom Casmurro (Wikipédia)","https://pt.wikipedia.org/wiki/Dom_Casmurro"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Oficina-Escada-da-Tensao.html","id":"oficina-escada","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Oficina · 5 min · escrever","titulo":"A escada da tensão","subtitulo":"Oficina de escrita · cada problema resolvido cria um problema maior","niveis":["Ver a escada","Subir um degrau"],"emblemas":[[0.8,"Arquiteto de sustos","Já sabes que a tensão se constrói degrau a degrau."],[0.5,"Bom começo","Viste a escada. Agora repara: cada degrau nasce do anterior."],[0,"A subir","Relê a história pela ordem certa e pergunta o que causa o quê."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Numa história que prende, a tensão não sobe ao acaso: sobe por <b>degraus</b>. A personagem resolve um problema, e a solução cria um problema <b>maior</b>.</p><p>A história que se segue é nossa, feita para este exercício. Chegou-te com os degraus trocados.</p>"},{"nivel":1,"tipo":"ordenar","rot":"Arruma a escada","pergunta":"Põe os degraus por ordem: cada um tem de nascer do anterior.","itens":["O Rui perde o último autocarro da noite","Decide ir a pé e liga o mapa no telemóvel, que tem 3 % de bateria","O telemóvel apaga-se; para não se perder, corta por uma rua que lhe parece conhecida","A rua acaba num portão fechado, entre dois muros altos","Volta-se para trás e ouve passos a entrar na mesma rua"],"retorno":"Repara: cada solução (ir a pé, usar o mapa, cortar caminho, voltar para trás) é a causa do problema seguinte."},{"nivel":1,"tipo":"unica","rot":"O degrau partido","pergunta":"Qual destas frases, posta a meio da história, deitava a escada abaixo?","opcoes":[["«Por sorte, passou um táxi vazio e o Rui chegou a casa em dez minutos.»","certo","Sim: resolve tudo sem criar problema novo. A tensão cai a zero e o leitor fecha o livro."],["«Começou a chover, e o Rui não tinha casaco.»","cuidado","Esta ainda piora as coisas: é mais um degrau, não um degrau partido."],["«A rua estava mais escura do que ele se lembrava.»","cuidado","Esta aumenta o medo. Não resolve nada."]]},{"nivel":2,"tipo":"texto","rot":"O sexto degrau","pergunta":"Escreve o degrau seguinte: o Rui faz alguma coisa para resolver os passos atrás dele, e isso cria um problema maior.","minPalavras":12,"maxPalavras":40,"placeholder":"O Rui… e foi então que…"},{"nivel":2,"tipo":"texto","rot":"A tua escada","pergunta":"Agora a tua: três degraus para uma personagem que só quer chegar a horas a um sítio. Uma linha por degrau.","minPalavras":15,"maxPalavras":50,"placeholder":"1. … 2. … 3. …"}],"fontes":[],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Oficina-Cortar-ate-ao-Osso.html","id":"oficina-cortar","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Oficina · 5 min · rever","titulo":"Cortar até ao osso","subtitulo":"Oficina de escrita · rever é tirar o que não faz falta","niveis":["Cortar nos outros","Cortar em ti"],"emblemas":[[0.8,"Tesoura afiada","Cortas o que enfeita e deixas o que conta."],[0.5,"Bom começo","Procura primeiro os advérbios em -mente e os adjetivos aos pares."],[0,"A afinar","Pergunta a cada palavra: se saíres, a frase perde alguma coisa?"]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Um primeiro rascunho tem sempre palavras a mais. <b>Rever é cortar</b>: advérbios que repetem o verbo, adjetivos aos pares, «muito» e «realmente».</p><p>Regra de ouro: corta tudo o que puderes <b>sem perder quem faz o quê</b>.</p><p class=\"pequeno\">As frases deste exercício são nossas, feitas para treinar.</p>"},{"nivel":1,"tipo":"riscar","rot":"O pescador","pergunta":"Esta frase tem 22 palavras. Deixa-a com 14 ou menos.","frase":"Naquela manhã muito fria de inverno, o velho pescador saiu devagar de casa, completamente sozinho, e caminhou lentamente até ao pequeno cais.","limite":14,"essenciais":["pescador","saiu","cais"],"modelo":"Naquela manhã de inverno, o velho pescador saiu sozinho e caminhou até ao cais.","retorno":"«Devagar» e «lentamente» dizem o mesmo; «completamente» não acrescenta nada a «sozinho»."},{"nivel":1,"tipo":"riscar","rot":"A Marta","pergunta":"Agora esta: 22 palavras. Deixa-a com 12 ou menos.","frase":"A Marta ficou realmente muito, muito triste quando finalmente percebeu que o seu querido irmão mais novo já tinha partido para sempre.","limite":12,"essenciais":["Marta","irmão","partido"],"modelo":"A Marta ficou triste quando percebeu que o irmão tinha partido.","retorno":"Quanto mais «muito», menos se acredita. A frase curta dói mais."},{"nivel":2,"tipo":"texto","rot":"A tua frase","pergunta":"Vai buscar uma frase comprida que tenhas escrito esta semana (numa ficha, numa mensagem). Escreve aqui só a versão cortada.","minPalavras":6,"maxPalavras":25,"placeholder":"Depois do corte: …"}],"fontes":[],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Discurso-Tomar-Posse-1923.html","id":"posse-1923","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · discurso político","titulo":"Tomar posse em 1923","subtitulo":"Manuel Teixeira Gomes, 5 de outubro de 1923","niveis":["Ver o que o discurso faz","Ler a escolha","Fazer com o que leste"],"emblemas":[[0.8,"Ouvido político","Já ouves o que cada frase de um discurso está a fazer."],[0.5,"Bom começo","Pergunta a cada frase: promete, agradece, avisa ou pede?"],[0,"A afinar","Relê: um discurso de posse é feito de gestos, e cada frase é um."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Antes","html":"<p>A 5 de outubro de 1923, o escritor <b>Manuel Teixeira Gomes</b> toma posse como Presidente da República. O país está em crise. O discurso tem pouco mais de quinhentas palavras e cada frase faz um gesto: saúda, promete, avisa, confia.</p><p>Liga cada frase ao gesto que faz.</p>"},{"nivel":1,"tipo":"par","rot":"Cada frase, um gesto","pergunta":"Que gesto faz cada frase do discurso?","pares":[["«Espinhoso é o cargo de Presidente da República»","avisar que a tarefa é difícil"],["«Mantemos excelentes relações com todas as nações do Mundo»","tranquilizar sobre o país lá fora"],["«É quase angustiosa a crise que atravessam todas as nações europeias»","reconhecer o problema"],["«Tão vastos são porém os recursos naturais da nossa abençoada Pátria»","dar esperança"],["«Fio do patriotismo do Povo Português»","confiar no povo"],["«Viva a República Portuguesa!»","fechar com um grito de união"]],"retorno":"Repara na ordem: reconhece a crise, depois dá esperança, depois confia. É a escada de quase todos os discursos de posse."},{"nivel":2,"tipo":"unica","rot":"«Porém»","pergunta":"«Tão vastos são porém os recursos naturais…» O que faz a palavra «porém» neste ponto do discurso?","opcoes":[["Vira a página: depois de admitir a crise, começa a parte da esperança","certo","Sim. Um discurso que só reconhecesse a crise seria um lamento; o «porém» é a viragem."],["Contradiz o que disse antes, por descuido","cuidado","Não há descuido: a crise é real e os recursos também. O «porém» liga as duas coisas."],["Serve só para dar ritmo à frase","cuidado","Dá ritmo, mas sobretudo muda a direção do discurso."]]},{"nivel":3,"tipo":"texto","rot":"A tua posse","pergunta":"Tomas posse de alguma coisa (um clube, uma turma, um projeto). Escreve três frases com três gestos: reconhecer um problema, dar esperança, confiar em alguém.","minPalavras":20,"maxPalavras":60,"placeholder":"Sei que… Mas… Confio em…"}],"fontes":[["Manuel Teixeira Gomes, discurso de tomada de posse (5 de outubro de 1923), Diário do Congresso · Wikisource","https://pt.wikisource.org/wiki/Discurso_de_Tomada_de_Posse_do_Presidente_Manuel_Teixeira_Gomes"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Oficina-A-Frase-que-Manda.html","id":"oficina-frase-manda","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Oficina · 5 min · escrever","titulo":"A frase que manda","subtitulo":"Oficina de escrita · a frase curta, a frase longa e a ordem das coisas","niveis":["Ouvir o efeito","Escrever com intenção"],"emblemas":[[0.8,"Mão no volante","Já escolhes o comprimento e a ordem da frase pelo efeito que queres."],[0.5,"Bom começo","Lê as frases em voz alta: o fôlego diz-te o que cada uma faz."],[0,"A afinar","Pergunta a cada frase: onde está o choque, no princípio ou no fim?"]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Uma frase <b>curta</b> corta e dá choque. Uma frase <b>longa</b> estica o tempo e liga tudo. E a <b>ordem</b> também manda: dizer primeiro o que acontece («A grua tombou.») não é o mesmo que fazer esperar («Ao fim da tarde, quando já ninguém olhava, a grua tombou.»).</p><p class=\"pequeno\">As frases deste exercício são nossas, feitas para treinar.</p>"},{"nivel":1,"tipo":"classificar","rot":"Choque ou espera?","pergunta":"Em cada frase, o acontecimento chega logo (choque) ou faz-se esperar (espera)?","categorias":["choque","espera"],"itens":[["A porta abriu-se.",0],["Depois de três batidas, de um silêncio e de mais uma batida, a porta abriu-se.",1],["Perdeu o comboio.",0],["Com o bilhete na mão, a correr pela plataforma, a ver as portas a fechar-se, perdeu o comboio.",1]],"retorno":"O choque vem da frase curta com o verbo logo no início; a espera vem da frase longa que guarda o verbo para o fim."},{"nivel":1,"tipo":"par","rot":"Cada frase, um efeito","pergunta":"Liga cada frase ao efeito que produz.","pares":[["Ninguém respondeu.","corte seco: o silêncio pesa"],["A chuva caía, e caía, e continuava a cair sobre os telhados, sobre a rua, sobre nós.","o tempo estica-se"],["Foi então que ele viu a carta em cima da mesa, aberta.","a surpresa fica para o fim"],["Abriu a carta, leu-a, rasgou-a.","três ações em ritmo de martelo"]],"retorno":"O comprimento e a ordem não são enfeite: são o ritmo do que acontece."},{"nivel":2,"tipo":"texto","rot":"Duas versões","pergunta":"Escreve o mesmo acontecimento (alguém chega atrasado a um sítio) em duas frases: uma de choque, outra de espera.","minPalavras":12,"maxPalavras":50,"placeholder":"Choque: … Espera: …"}],"fontes":[],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Responder-Faz-o-que-o-Verbo-Pede.html","id":"responder-verbo","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Responder · 5 min · teste e prova","titulo":"Faz o que o verbo pede","subtitulo":"Identifica, refere, compara, caracteriza, interpreta: cinco verbos, cinco respostas diferentes","niveis":["Ler o verbo","Julgar respostas","Escrever a tua"],"emblemas":[[0.8,"Corretor de serviço","Já vês numa resposta o que falta antes do professor."],[0.5,"Bom começo","Pergunta sempre: onde está a prova? e a ligação entre a prova e a ideia?"],[0,"A afinar","Relê o verbo da pergunta: cada um pede uma coisa diferente."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Numa pergunta de teste, o <b>verbo</b> diz o que a resposta tem de fazer. Uma resposta boa não é longa nem bonita: faz <b>exatamente</b> o que o verbo pede, com <b>prova</b> no texto.</p><p class=\"pequeno\">As respostas de aluno deste exercício são nossas, feitas para treinar. O quadro completo dos verbos está no documento «Responder com precisão».</p>"},{"nivel":1,"tipo":"par","rot":"Cada verbo, um pedido","pergunta":"Liga cada verbo ao que ele pede.","pares":[["Identifique","o nome preciso, sem comentário a mais"],["Refira dois aspetos","exatamente dois, diferentes, cada um com prova"],["Compare","semelhança ou diferença, com os dois lados nomeados"],["Caracterize","um traço e a manifestação concreta desse traço"],["Interprete","um sentido proposto, com prova e coerência com o todo"]],"retorno":"Cinco verbos, cinco moldes. O erro mais comum é responder a «identifique» com uma interpretação, e a «interprete» com um resumo."},{"nivel":2,"tipo":"julgar","rot":"Passa ou não passa?","pergunta":"A pergunta era: «Caracterize Inês Pereira, com base no texto.» Julga cada resposta.","casos":[["Inês é ambiciosa e sonhadora.",false,"Não passa: dois adjetivos soltos, sem prova nem manifestação concreta."],["Inês é ambiciosa: recusa o lavrador e quer um marido «que saiba tanger» e falar de amores, como diz à mãe.",true,"Passa: um traço, a manifestação concreta e a referência ao texto."],["Inês Pereira é a protagonista da farsa de Gil Vicente, que casa duas vezes.",false,"Não passa: conta o enredo em vez de caracterizar."],["Inês quer mudar de vida, o que se vê quando prefere o escudeiro ao lavrador, apesar dos avisos.",true,"Passa: traço («quer mudar de vida») com a manifestação no texto."]],"retorno":"Repara: as duas que passam têm um traço e a prova. As duas que não passam ou não provam ou não caracterizam."},{"nivel":3,"tipo":"texto","rot":"A tua resposta","pergunta":"Escolhe uma personagem de um texto que estejas a estudar e caracteriza-a numa frase que passe: um traço e a manifestação concreta, com a expressão do texto entre aspas.","minPalavras":15,"maxPalavras":50,"placeholder":"… é …: «…»"}],"fontes":[["EPI · Português 2026/2027, documento comum 14, «Responder com precisão»",""]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Habitos-Os-Cinco.html","id":"habitos-cinco","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Pensar · 5 min · hábitos criativos","titulo":"Os cinco hábitos","subtitulo":"Inquisitivo, persistente, imaginativo, colaborativo, disciplinado","niveis":["Reconhecer","Olhar para ti"],"emblemas":[[0.8,"Olho treinado","Já reconheces um hábito criativo quando o vês em ação."],[0.5,"Bom começo","Relê as cinco definições: cada hábito é um verbo (perguntar, insistir, imaginar, partilhar, rever)."],[0,"A afinar","Pergunta a cada cena: o que é que esta pessoa está a fazer, exatamente?"]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Pensar de forma criativa não é um dom: são <b>cinco hábitos</b> que se treinam. <b>Inquisitivo</b>: pergunta, duvida, investiga o porquê. <b>Persistente</b>: aguenta a dificuldade e a incerteza. <b>Imaginativo</b>: gera ideias e faz ligações inesperadas. <b>Colaborativo</b>: partilha, dá e recebe crítica. <b>Disciplinado</b>: revê, corrige, acaba.</p><p class=\"pequeno\">Modelo de Lucas, Claxton e Spencer (OCDE, 2013), usado no documento «Hábitos de pensamento criativo». As cenas são nossas.</p>"},{"nivel":1,"tipo":"classificar","rot":"Que hábito é?","pergunta":"Em cada cena, que hábito está a trabalhar?","categorias":["inquisitivo","persistente","imaginativo","colaborativo","disciplinado"],"itens":[["Antes de filmar, a Sara pergunta ao grupo porque é que a cena tem de ser à noite.",0],["A terceira versão do cartaz também não resultou; o Tiago começa a quarta.",1],["Para o anúncio de um dicionário, o Nuno propõe filmar só mãos.",2],["A Rita mostra o rascunho a dois colegas e apontou o que lhe disseram antes de responder.",3],["A Inês leu o texto em voz alta, cortou três frases e só depois entregou.",4],["O Miguel quis saber de onde vinha a palavra «tabacaria» antes de fazer a legenda.",0]],"retorno":"Nenhum destes hábitos é «talento». Todos são coisas que se fazem, e por isso se podem fazer mais vezes."},{"nivel":2,"tipo":"deslizar","rot":"O teu ponto fraco","pergunta":"Entre estes dois, qual te custa mais?","esquerda":"persistir (insistir quando não sai)","direita":"disciplinar (rever e acabar)"},{"nivel":2,"tipo":"texto","rot":"O próximo módulo","pergunta":"Escolhe um dos cinco hábitos para treinar no próximo módulo e diz uma coisa concreta que vais fazer diferente.","minPalavras":10,"maxPalavras":40,"placeholder":"Vou treinar o hábito … : da próxima vez, …"}],"fontes":[["Lucas, B., Claxton, G. e Spencer, E. (2013), Progression in Student Creativity in School, OECD Education Working Papers n.º 86","https://www.oecd.org/en/publications/progression-in-student-creativity-in-school_5k4dp59msdwk-en.html"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Palavras-Chao-e-Plano.html","id":"palavras-dobretes","cor":"#6b4a8c","corEscura":"#c1a3dd","marca":"Palavras · 5 min · léxico e história da língua","titulo":"Chão e plano","subtitulo":"Duas vias para a mesma palavra latina","niveis":["Reconhecer","Explicar","Escolher com intenção"],"emblemas":[[0.8,"Ouvido para a língua","Já escolhes as palavras pelo efeito, não pelo acaso."],[0.5,"Bom começo","Percebeste os pares. Falta usar a diferença na escrita."],[0,"A afinar","Volta aos pares: uma palavra vem do uso, a outra veio dos livros."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Duas vias","html":"<p>Muitas palavras latinas chegaram ao português por <b>duas vias</b>: a <b>popular</b>, gasta pelo uso de todos os dias, e a <b>erudita</b>, copiada mais tarde dos livros. Daí os <b>dobretes</b>:</p><p><b>chão</b> e <b>plano</b> (de <i>planus</i>) · <b>chato</b> e <b>prato</b> (de <i>platus</i>) · <b>rezar</b> e <b>recitar</b> (de <i>recitare</i>)</p><p>A palavra popular é curta e bate no estômago; a erudita é mais distante e formal. A escolha nunca é inocente: diz quem fala e para quem.</p>","links":[["Ver mais dobretes (Wikipédia)","https://pt.wikipedia.org/wiki/Dobrete"]]},{"nivel":1,"tipo":"unica","rot":"O par","pergunta":"Qual destes pares NÃO é um dobrete (mesma origem, duas vias)?","opcoes":[["chão / plano","cuidado","É dobrete: os dois vêm de <i>planus</i>."],["cheio / pleno","cuidado","É dobrete: os dois vêm de <i>plenus</i>."],["casa / lar","certo","Certo: são sinónimos, mas de origens diferentes. Não é o mesmo caso."]]},{"nivel":1,"tipo":"multi","rot":"Popular ou erudita","pergunta":"Toca nas palavras que chegaram pela via popular (gastas pelo uso).","opcoes":[["chão",5,"Sim: perdeu o «pl-» latino, como acontece na fala."],["chama",5,"Sim, de <i>flamma</i>: o mesmo desgaste."],["pleno",0,"Erudita: guarda o «pl-» do latim."],["recitar",0,"Erudita: veio dos livros, ao lado de «rezar»."]]},{"nivel":2,"tipo":"unica","rot":"O efeito","pergunta":"«Caiu ao chão» e «caiu ao plano»: porque é que a segunda soa estranha?","opcoes":[["Porque cada palavra ficou com os seus usos, e este não é o de «plano»","certo","Sim. «Plano» continua a ser uma superfície lisa — um plano inclinado, um plano de fundo —, mas não é a palavra para o sítio onde se cai."],["Porque «plano» perdeu o sentido físico e só serve para ideias","cuidado","Não perdeu: há planos inclinados, planos de mesa e, no teu curso, planos de filmagem."],["Porque «plano» é mais antiga","cuidado","É o contrário: entrou mais tarde, pela via dos livros."]]},{"nivel":2,"tipo":"cartoes","rot":"Quem fala assim","pergunta":"Escolhe uma personagem e diz que palavra do par ela usaria, e porquê.","cartoes":[["Um trabalhador de Cesário","Fala do que vê e toca."],["Um sermão de Vieira","Fala para convencer, com solenidade."],["Uma publicação tua","Fala para ser lida depressa."],["Um relatório do curso","Fala para ser exato."]]},{"nivel":3,"tipo":"texto","rot":"Duas versões","pergunta":"Escreve a mesma frase duas vezes: uma só com palavras populares, outra com palavras eruditas. Até 40 palavras no total.","minPalavras":12,"maxPalavras":40,"placeholder":"Versão 1… / Versão 2…"},{"nivel":3,"tipo":"detalhes","rot":"Caderno de palavras","pergunta":"Escolhe uma palavra que encontraste nas tuas leituras desta semana. Indica onde a leste, explica o que significa ali e escreve uma frase com ela.","campos":["Palavra e onde a encontrei:","O que significa ali:","Uma frase minha com ela:"]}],"fontes":[["Wikipédia, «Dobrete»","https://pt.wikipedia.org/wiki/Dobrete"],["Dicionário Priberam (étimos e palavras divergentes)","https://dicionario.priberam.org"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"O-Espelho-Machado.html","id":"espelho-machado","cor":"#2f5d7c","corEscura":"#7fb4d6","marca":"Ler a fundo · 5 min · identidade","titulo":"O Espelho","subtitulo":"Machado de Assis, 1882","emblemas":[[0.8,"Leitor minucioso","Foste ao pormenor e defendeste leituras com o texto."],[0.5,"Leitor atento","Boas leituras. Volta a um passo e tenta ir mais fundo."],[0,"Leitor em construção","Começaste. Relê o texto e tenta outra vez."]],"passos":[{"tipo":"leitura","rot":"Ler","html":"<p>Num conto de <b>Machado de Assis</b> («O Espelho», <i>Papéis Avulsos</i>, 1882), um homem recebe o posto de <b>alferes</b> (uma patente militar) e a família passa a tratá-lo por «senhor alferes».</p><p>Ele conta: «<b>Cada criatura humana traz duas almas consigo: uma que olha de dentro para fora, outra que olha de fora para dentro…</b>» E mais à frente: «<b>O alferes eliminou o homem.</b> […] ficou-me uma parte mínima de humanidade.»</p><p>O texto está inteiro, de graça, na Wikisource.</p>","links":[["Ler o conto inteiro (Wikisource)","https://pt.wikisource.org/wiki/O_Espelho"]],"nota":"Domínio público: podes ler, imprimir e partilhar."},{"tipo":"unica","rot":"O que foi eliminado","pergunta":"Quando diz «o alferes eliminou o homem», o que aconteceu?","opcoes":[["Alguém morreu no conto.","cuidado","Não: ninguém morre. Pensa em duas maneiras de ser a mesma pessoa."],["A pessoa passou a ver-se só pelo cargo.","certo","Sim. A identidade encolheu até caber no posto: os outros tratam-no pela patente e ele passa a ver-se assim."],["Ele deixou o exército.","cuidado","O contrário: é o posto que passa a ocupar tudo."]]},{"tipo":"multi","rot":"Alma exterior","pergunta":"Machado diz que a «alma exterior» pode ser muita coisa. Toca no que hoje funciona como alma exterior das pessoas.","opcoes":[["O número de seguidores",5,"É um bom exemplo atual: um número que passa a dizer quem somos."],["A farda ou a bata do curso",5,"Sim: uma roupa que dá lugar e função, como a patente do conto."],["Uma máquina ou ferramenta de que não largamos",5,"Machado fala mesmo de «um objeto, uma operação»."],["Aquilo em que acreditamos quando ninguém vê",0,"Isso está mais perto da alma <b>interior</b>, a que olha de dentro para fora."]]},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e diz numa linha o que tem a ver com o conto.","cartoes":[["3.º ano · Fernando Pessoa","Heterónimos: ser vários e não caber num só nome."],["2.º ano · Frei Luís de Sousa","O Romeiro responde «Ninguém»: quem perde o nome perde o lugar no mundo."],["Curso · retrato e perfil","Uma fotografia de perfil mostra a pessoa ou a função?"],["Hoje","Como te apresentas quando não podes falar de notas nem de seguidores?"]]},{"tipo":"texto","rot":"Duas linhas","pergunta":"Escreve duas frases sobre ti: a primeira como os outros te identificam; a segunda com algo que esse rótulo esconde.","minPalavras":12,"placeholder":"Para os outros sou… / Mas também…"},{"tipo":"texto","rot":"O teu espelho","pergunta":"Se um objeto teu fosse a tua «alma exterior», qual seria e porquê? Uma frase.","minPalavras":8,"maxPalavras":30,"placeholder":"Seria… porque…"}],"fontes":[["Machado de Assis, «O Espelho» (Papéis Avulsos, 1882) · Wikisource","https://pt.wikisource.org/wiki/O_Espelho"],["Machado de Assis, Papéis Avulsos (1882), índice · Wikisource","https://pt.wikisource.org/wiki/Pap%C3%A9is_avulsos"]],"modulo":"Comum","imagemData":""},{"pasta":"Olhares","ficheiro":"Duas-Legendas.html","id":"duas-legendas","cor":"#4a4a4a","corEscura":"#bdbdbd","marca":"Olhares · 5 min · imagem e palavra","titulo":"Duas legendas","subtitulo":"O que a palavra faz à imagem","emblemas":[[0.8,"Olho de fotógrafo","Viste o que muitos não veem e imaginaste com base na imagem."],[0.5,"Olhar atento","Bom olhar. Na próxima, procura mais um pormenor."],[0,"Olhar em treino","Começaste. Observa outra vez, devagar."]],"passos":[{"tipo":"leitura","rot":"A experiência","html":"<p>Imagina uma fotografia: <b>uma pessoa diante de um espelho</b>. Agora imagina duas legendas para a mesma fotografia:</p><p>A — «Finalmente encontrou o seu lugar.»<br>B — «Já só consegue ver a sua função.»</p><p>A imagem é a mesma. O que muda é o que a palavra te manda ver. No conto «O Espelho», de Machado de Assis (1882), um homem passa a ver-se só pelo posto militar que recebeu: «O alferes eliminou o homem.»</p>","links":[["Ler o conto (Wikisource)","https://pt.wikisource.org/wiki/O_Espelho"]]},{"tipo":"unica","rot":"Mais perto de Machado","pergunta":"Qual das legendas está mais perto da frase do conto?","opcoes":[["A — «Finalmente encontrou o seu lugar.»","cuidado","É uma leitura possível do início (a família festeja o posto), mas o conto acaba noutro sítio: a pessoa quase desaparece."],["B — «Já só consegue ver a sua função.»","certo","Sim: «ficou-me uma parte mínima de humanidade». A função ocupou o lugar da pessoa."],["As duas, em momentos diferentes.","certo","Defensável: primeiro o orgulho, depois o vazio. Boa leitura do percurso do conto."]]},{"tipo":"multi","rot":"Observar e acrescentar","pergunta":"Numa fotografia de alguém ao espelho, o que é mesmo <b>observável</b>?","opcoes":[["A roupa que a pessoa tem vestida",5,"Observável: está na imagem."],["A direção do olhar",5,"Observável, se se vir o rosto ou o reflexo."],["Que está orgulhosa",0,"Isso é interpretação: acrescentas tu, a partir de pistas."],["Que acabou de ser promovida",0,"Interpretação (ou invenção): a imagem não diz isso."]]},{"tipo":"texto","rot":"A tua legenda A","pergunta":"Fotografa mentalmente (ou mesmo com o telemóvel) um objeto à tua frente. Escreve uma legenda que o torne importante. Máximo 15 palavras.","minPalavras":4,"maxPalavras":15,"placeholder":"Legenda A…"},{"tipo":"texto","rot":"A tua legenda B","pergunta":"Agora outra legenda para a mesma imagem, que a faça ler ao contrário. Máximo 15 palavras.","minPalavras":4,"maxPalavras":15,"placeholder":"Legenda B…"},{"tipo":"cartoes","rot":"Onde isto acontece","pergunta":"Escolhe um caso e explica numa linha como a legenda muda o que vemos.","cartoes":[["Notícia","A mesma fotografia com dois títulos diferentes em dois jornais."],["Rede social","A mesma imagem com uma legenda irónica ou séria."],["Exposição","A ficha ao lado da obra diz-te o que procurar."],["Escola","A legenda de um trabalho teu no mural."]]},{"tipo":"texto","rot":"Regra minha","pergunta":"Escreve uma regra tua para legendar com honestidade: o que uma legenda pode e não pode fazer.","minPalavras":10,"placeholder":"Uma legenda pode…, mas não pode…"}],"fontes":[["Machado de Assis, «O Espelho» (1882) · Wikisource","https://pt.wikisource.org/wiki/O_Espelho"],["Wikipédia, «Crítica de arte» (descrever, analisar, interpretar)","https://pt.wikipedia.org/wiki/Cr%C3%ADtica_de_arte"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Terra-Firme-Benjamim.html","id":"terra-firme","cor":"#2f6f7a","corEscura":"#7fc4cf","marca":"Ler a fundo · 5 min · canção portuguesa","titulo":"Terra Firme","subtitulo":"Benjamim e Barnaby Keen, 2017","emblemas":[[0.8,"Leitor minucioso","Foste ao pormenor e defendeste leituras com o texto."],[0.5,"Leitor atento","Boas leituras. Volta a um passo e tenta ir mais fundo."],[0,"Leitor em construção","Começaste. Relê o texto e tenta outra vez."]],"passos":[{"tipo":"leitura","rot":"Ouvir","html":"<p>Benjamim é o nome artístico de Luís Nunes (Lisboa, 1986). Gravou o álbum <i>1986</i> (2017) com o músico inglês Barnaby Keen, em português e inglês. «Terra Firme» é a faixa 4.</p><p><b>Ouve a canção inteira, com atenção às palavras.</b> Depois volta aqui.</p>","links":[["Ouvir no Bandcamp oficial de Benjamim","https://eusouobenjamim.bandcamp.com/track/terra-firme"],["Ouvir no Spotify","https://open.spotify.com/track/2KNwNTzoxdXFsL7Yy16Bx6"]],"nota":"A letra está protegida por direitos de autor: ouve-a na plataforma oficial."},{"tipo":"multi","rot":"O que ouviste","pergunta":"Toca nas palavras que ouviste na canção.","opcoes":[["mar",5,"Está lá: é a imagem que atravessa a canção."],["corrente",5,"Está lá: a força que empurra e contra a qual se luta."],["porto",5,"Está lá: o lugar de chegada, abrigo."],["sobrevivente",5,"Está lá: quem chega depois de muito custo."],["comboio",0,"Não a confirmámos na letra. Ouve outra vez: a canção fica no mar."],["deserto",0,"Não a confirmámos na letra. Ouve outra vez."]]},{"tipo":"unica","rot":"Terra firme","pergunta":"Na canção, a «terra firme» é sobretudo…","opcoes":[["Um lugar seguro onde, por fim, se pousa","certo","Defensável: depois do mar, da corrente e do peso, é a imagem da estabilidade."],["Uma decisão ou uma pessoa que dá apoio","certo","Defensável: há um «eu» que fala a um «tu» em dificuldade. A terra firme pode ser quem fica ao lado."],["Uma chegada fácil, sem esforço","cuidado","A canção fala de «peso», «azar» e «corrente»: chegar custa."]]},{"tipo":"unica","rot":"Contra-mão","pergunta":"«Contra-mão» é uma palavra de que mundo?","opcoes":[["Da estrada: o sentido proibido do trânsito","certo","Sim. Numa canção de mar, surpreende: juntar dois <b>campos lexicais</b> (estrada e mar) cria uma imagem nova. No Acordo Ortográfico escreve-se «contramão»."],["Do mar: é um termo de navegação","cuidado","Não: diz-se do trânsito. É por isso que a palavra salta à vista numa canção de mar."],["Da música: tocar fora do ritmo","cuidado","Não: diz-se do trânsito, de quem circula no sentido proibido."]]},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e diz numa linha em que se parece com «Terra Firme».","cartoes":[["1.º ano · Martim Codax","«Ondas do mar de Vigo, / se vistes meu amigo?»: falar ao mar à espera de quem não chega."],["1.º ano · Camões, Os Lusíadas","O Velho do Restelo (canto IV): ficar em terra firme ou partir?"],["3.º ano · Pessoa, Mensagem","«Valeu a pena? Tudo vale a pena / Se a alma não é pequena.»"],["2.º ano · Padre António Vieira","O sermão aos peixes: o mar como retrato da sociedade."]]},{"tipo":"texto","rot":"A tua terra firme","pergunta":"O que é terra firme para ti, numa semana difícil? Duas frases, sem nomes de pessoas.","minPalavras":12,"placeholder":"A minha terra firme é… porque…"},{"tipo":"texto","rot":"Antes de escrever","pergunta":"Quem atravessa hoje o mar à procura de terra firme? Escreve a pergunta que farias a uma fonte fiável antes de publicar sobre isso.","minPalavras":8,"placeholder":"Perguntaria…"}],"fontes":[["Benjamim / Barnaby Keen, 1986 (Bandcamp oficial)","https://eusouobenjamim.bandcamp.com/album/1986"],["RTP, Festival da Canção: Benjamim","https://media.rtp.pt/festivaldacancao/compositores/benjamim/"],["Where the Music Meets, «Terra Firme» (2017, em inglês)","https://www.wherethemusicmeets.com/2017/03/01/benjamim-barneby-keen-terra-firme/"],["FCSH, «Ondas do mar de Vigo»","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=1308"],["Arquivo Pessoa, «Mar Português»","http://arquivopessoa.net/textos/2405"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Ouvi-Dizer-Ornatos-Violeta.html","id":"ouvi-dizer","cor":"#6b4fa0","corEscura":"#b9a3e6","marca":"Ler a fundo · 5 min · canção portuguesa","titulo":"Ouvi Dizer","subtitulo":"Ornatos Violeta, 1999","emblemas":[[0.8,"Leitor minucioso","Foste ao pormenor e defendeste leituras com o texto."],[0.5,"Leitor atento","Boas leituras. Volta a um passo e tenta ir mais fundo."],[0,"Leitor em construção","Começaste. Relê o texto e tenta outra vez."]],"passos":[{"tipo":"leitura","rot":"Ouvir","html":"<p>Os Ornatos Violeta são uma banda do Porto, formada em 1991. «Ouvi Dizer» foi o primeiro single do álbum <i>O Monstro Precisa de Amigos</i> (1999). No fim, o ator Vítor Espadinha diz um texto.</p><p><b>Ouve a canção até ao fim, incluindo a parte dita.</b> Depois volta aqui.</p>","links":[["Ouvir no Spotify","https://open.spotify.com/search/Ornatos%20Violeta%20Ouvi%20Dizer"]],"nota":"A letra está protegida por direitos de autor: ouve-a na plataforma oficial."},{"tipo":"unica","rot":"O título","pergunta":"«Ouvi dizer» é uma maneira de…","opcoes":[["Contar o que outros disseram, sem garantir que é verdade","certo","Sim: é <b>discurso relatado</b>. A notícia chega em segunda mão, como um boato. O fim do amor é sabido por ouvir dizer."],["Dar uma ordem a alguém","cuidado","Não há imperativo. «Ouvi» é pretérito perfeito: alguém conta o que lhe chegou aos ouvidos."],["Descrever os sons da cidade","cuidado","A cidade aparece, mas «ouvi dizer» é sobre o que se diz, não sobre sons."]]},{"tipo":"multi","rot":"Imagens do amor","pergunta":"Toca nas expressões que mais dizem sobre este amor. Confirma-as ao ouvir.","opcoes":[["«amor é uma doença»",5,"<b>Metáfora</b> antiga: nas cantigas medievais, a «coita» é o sofrimento de amor."],["«a razão»",5,"Razão contra sentimento: um conflito da lírica desde os trovadores e Camões."],["«estúpida canção»",5,"A canção fala de si própria e desvaloriza-se: <b>autoironia</b>."],["«o mundo acaba amanhã»",5,"<b>Hipérbole</b>: tudo parece urgente e final."]]},{"tipo":"unica","rot":"Um desejo impossível","pergunta":"Em «pudesse eu pagar de outra forma», «pudesse» está no…","opcoes":[["Pretérito imperfeito do conjuntivo","certo","Sim: exprime um desejo que não se realiza. Repara na ordem: o verbo vem antes do sujeito («pudesse eu»)."],["Pretérito perfeito do indicativo","cuidado","Esse seria «pude». «Pudesse» é conjuntivo: desejo, hipótese."],["Futuro do indicativo","cuidado","Esse seria «poderei». «Pudesse» é conjuntivo."]]},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e explica-a numa linha.","cartoes":[["1.º ano · Cantigas de amigo","A ausência de quem se ama e o sofrimento de amor, a coita."],["1.º ano · Camões lírico","«Amor é fogo que arde sem se ver»: o amor como contradição."],["2.º ano · Camilo, Amor de Perdição","A paixão que perde quem ama."],["Hoje","Os versos desta canção foram escritos em paredes e tatuados (Altamont, 2024). Quando é que uma canção passa a ser de toda a gente?"]]},{"tipo":"texto","rot":"A cidade está deserta","pergunta":"O texto dito no fim começa por «A cidade está deserta». Continua-o com uma frase tua, sem nomes, sobre uma cidade depois de uma perda.","minPalavras":10,"maxPalavras":30,"placeholder":"A cidade está deserta e…"},{"tipo":"texto","rot":"Antes de partilhar","pergunta":"Um «ouvi dizer» pode magoar alguém. Que regra propões para a tua turma antes de partilhar o que ouviste?","minPalavras":10,"placeholder":"Antes de partilhar…"}],"fontes":[["Wikipédia, «O Monstro Precisa de Amigos»","https://pt.wikipedia.org/wiki/O_Monstro_Precisa_de_Amigos"],["Wikipédia, «Ornatos Violeta»","https://pt.wikipedia.org/wiki/Ornatos_Violeta"],["Altamont, «“Ouvi Dizer” – Ornatos Violeta» (2024)","https://altamont.pt/ouvi-dizer-ornatos-violeta/"],["Wikisource, Camões, «Amor é fogo que arde sem se ver»","https://pt.wikisource.org/wiki/Amor_%C3%A9_fogo_que_arde_sem_se_ver"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Capitao-Romance-Ornatos-Violeta.html","id":"capitao-romance","cor":"#1f5f99","corEscura":"#79aee0","marca":"Ler a fundo · 5 min · canção portuguesa","titulo":"Capitão Romance","subtitulo":"Ornatos Violeta com Gordon Gano, 1999","emblemas":[[0.8,"Leitor minucioso","Foste ao pormenor e defendeste leituras com o texto."],[0.5,"Leitor atento","Boas leituras. Volta a um passo e tenta ir mais fundo."],[0,"Leitor em construção","Começaste. Relê o texto e tenta outra vez."]],"passos":[{"tipo":"leitura","rot":"Ouvir","html":"<p>«Capitão Romance» foi o segundo single de <i>O Monstro Precisa de Amigos</i> (1999), dos Ornatos Violeta. Gordon Gano, vocalista da banda norte-americana Violent Femmes, canta com Manel Cruz, em português.</p><p><b>Ouve a canção inteira e repara no refrão.</b> Depois volta aqui.</p>","links":[["Ouvir no Spotify","https://open.spotify.com/track/6EuupyK5js5CVsm0QHaTq3"]],"nota":"A letra está protegida por direitos de autor: ouve-a na plataforma oficial."},{"tipo":"unica","rot":"O refrão","pergunta":"No refrão «Eu vi» / «mas não agarrei», o que liga as duas partes?","opcoes":[["Uma oposição entre ver e agarrar, marcada por «mas»","certo","Sim: <b>antítese</b> com conjunção adversativa. Teve a oportunidade diante dos olhos e deixou-a passar."],["Uma onomatopeia","cuidado","Não há imitação de sons. Há dois gestos opostos: ver e agarrar."],["Uma enumeração","cuidado","Uma enumeração junta vários elementos; aqui há dois que se opõem."]]},{"tipo":"unica","rot":"Hoje o mar sou eu","pergunta":"«Hoje o mar sou eu» é…","opcoes":[["Uma metáfora: o eu identifica-se com o mar","certo","Sim. O eu já não atravessa o mar: torna-se o mar. E «hoje» diz que é um estado, não para sempre."],["Uma comparação","cuidado","Não há «como». Com «como» seria comparação; sem ele, é metáfora."],["Uma personificação do mar","cuidado","Não é o mar que ganha traços humanos; é o eu que se torna mar."]]},{"tipo":"deslizar","rot":"Herói ou sonhador?","pergunta":"O Capitão Romance parece mais herói de aventuras ou sonhador que vê e não agarra?","esquerda":"herói de aventuras","direita":"sonhador"},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e diz numa linha o que tem em comum com a canção.","cartoes":[["1.º ano · Camões, Os Lusíadas","O herói do mar e a viagem entre maravilha e perigo."],["3.º ano · Pessoa, «O Infante»","«Senhor, falta cumprir-se Portugal!»: uma missão por cumprir."],["3.º ano · Álvaro de Campos","«Tabacaria»: «tenho em mim todos os sonhos do mundo», e não realiza nenhum."],["Estados Unidos · Violent Femmes","Um cantor norte-americano a cantar em português: a canção atravessa culturas."]]},{"tipo":"texto","rot":"Eu vi","pergunta":"Escreve dois versos: um a começar por «Eu vi» e outro por «mas não agarrei», sobre uma oportunidade tua ou inventada.","minPalavras":6,"maxPalavras":20,"placeholder":"Eu vi… / mas não agarrei…"},{"tipo":"texto","rot":"Em comunidade","pergunta":"Que oportunidade coletiva (na escola, no bairro, no país) se vê e não se agarra? Uma frase com um exemplo real, sem nomes de pessoas.","minPalavras":10,"placeholder":"Vemos… mas não…"}],"fontes":[["Wikipédia, «O Monstro Precisa de Amigos»","https://pt.wikipedia.org/wiki/O_Monstro_Precisa_de_Amigos"],["Arquivo Pessoa, Mensagem, «O Infante»","http://arquivopessoa.net/textos/2375"],["Arquivo Pessoa, «Tabacaria»","http://arquivopessoa.net/textos/163"],["Wikipédia, «Os Lusíadas»","https://pt.wikipedia.org/wiki/Os_Lus%C3%ADadas"]],"modulo":"Comum","imagemData":""},{"pasta":"Olhares","ficheiro":"Morte-do-Conde-Andeiro.html","id":"
