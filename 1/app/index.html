r":"#2a6f6f","corEscura":"#79c3c3","marca":"Ler a fundo · 5 min · M1 cantigas","titulo":"Cercada pelas ondas","subtitulo":"Mendinho, séc. XIII","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Voz da ermida","Seguiste a rapariga estrofe a estrofe até ao mar maior."],[0.5,"Bom começo","Já vês o paralelismo. Repara no que muda de estrofe para estrofe: o perigo cresce."],[0,"A entrar na cantiga","Relê: o refrão é sempre o mesmo, o mar é que sobe."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Uma <b>cantiga de amigo</b>: quem fala é uma rapariga, sozinha numa ermida à beira-mar, à espera do namorado. Os parênteses retos são palavras acrescentadas pelos editores.</p><p><i>Sedia-m'eu na ermida de Sam Simion<br>e cercarom-mi as ondas, que grandes som!<br>Eu atendendo meu amig', eu a[tendendo].</i></p><p><i>Estando na ermida ant'o altar<br>[e] cercarom-mi as ondas grandes do mar.<br>Eu atendendo meu amig', eu a[tendendo].</i></p><p><i>E cercarom-mi as ondas, que grandes som!<br>Nom hei [eu i] barqueiro nem remador.<br>Eu atendendo meu amig', eu a[tendendo].</i></p><p><i>Nom hei [eu] i barqueiro nem remador<br>[e] morrerei fremosa no mar maior.<br>Eu atendendo meu amig', eu a[tendendo].</i></p><p class=\"nota\"><b>sedia-m'eu</b> — estava eu · <b>cercarom-mi</b> — cercaram-me · <b>som</b> — são · <b>atendendo</b> — esperando · <b>nom hei i</b> — não tenho ali · <b>fremosa</b> — formosa</p>","links":[["Ler a cantiga inteira (FCSH)","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=861"]]},{"nivel":1,"tipo":"ordenar","rot":"O mar sobe","pergunta":"Põe por ordem o que a rapariga vai dizendo, do princípio ao fim.","itens":["Está na ermida de Sam Simion","As ondas cercam-na","Não tem barqueiro nem remador","Vai morrer, formosa, no mar maior"],"retorno":"É uma escada: cada estrofe repete a anterior e sobe um degrau no perigo."},{"nivel":1,"tipo":"unica","rot":"O refrão","pergunta":"«Eu atendendo meu amig', eu atendendo.» Porque se repete em todas as estrofes?","opcoes":[["Porque ela não deixa de esperar, mesmo com o mar a subir","certo","A espera é a única coisa que não muda; tudo o resto piora."],["Porque o amigo está a chegar","cuidado","Nada no texto diz que ele vem; ela é que espera."],["Porque é uma canção de festa","cuidado","Cercada pelas ondas, sem barqueiro: não é festa."]]},{"nivel":2,"tipo":"multi","rot":"Paralelismo","pergunta":"Entre a estrofe 1 e a estrofe 2, o que muda?","opcoes":[["«de Sam Simion» passa a «ant'o altar»",5,"Sim: o mesmo lugar dito de outra maneira."],["«que grandes som» passa a «grandes do mar»",5,"Sim: a mesma ideia com palavras trocadas. Chama-se paralelismo."],["O refrão",0,"O refrão fica igual: é o que segura a cantiga."],["A rapariga passa a falar do amigo",0,"Ela fala dele desde o refrão da primeira estrofe."]]},{"nivel":2,"tipo":"cartoes","rot":"O último verso","pergunta":"«E morrerei fremosa no mar maior.» Escolhe uma leitura e explica-a numa linha com uma palavra do texto.","cartoes":[["À letra","Vai morrer mesmo: não há barqueiro."],["Exagero","Quem espera muito fala assim; é a espera que dói."],["Acusação","«Fremosa»: morre bela, e a culpa é de quem não veio."]]},{"nivel":3,"tipo":"texto","rot":"A voz do amigo","pergunta":"Agora fala o amigo, longe. Escreve dois versos e um refrão que respondam ao dela, com pelo menos uma palavra da cantiga. Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"… / … / (refrão)"}],"fontes":[["Mendinho, «Sedia-m'eu na ermida de Sam Simion» (FCSH)","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=861"]],"modulo":"M1","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Guilhade-Dona-Fea.html","id":"guilhade-dona-fea","cor":"#2a6f6f","corEscura":"#79c3c3","marca":"Ler a fundo · 5 min · M1 cantigas","titulo":"Louvar e troçar","subtitulo":"D. Dinis e João Garcia de Guilhade, séc. XIII","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Ouvido para a ironia","Viste onde acaba o louvor e começa a troça."],[0.5,"Bom começo","Já distingues as duas cantigas. Repara em como a segunda usa as palavras da primeira."],[0,"A entrar nas cantigas","Relê o último verso de cada uma: um louva, o outro troça."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><b>A</b> — D. Dinis louva a sua senhora à maneira dos trovadores da Provença:</p><p><i>Quer'eu em maneira de proençal<br>fazer agora um cantar d'amor<br>e querrei muit'i loar mia senhor<br>a que prez nem fremosura nom fal,<br>nem bondade; e mais vos direi en:<br>tanto a fez Deus comprida de bem<br>que mais que todas las do mundo val.</i></p><p><b>B</b> — João Garcia de Guilhade «louva» uma dona que se queixou de nunca ser louvada:</p><p><i>Ai dona fea, fostes-vos queixar<br>que vos nunca louv'en[o] meu cantar;<br>mais ora quero fazer um cantar<br>em que vos loarei todavia;<br>e vedes como vos quero loar:<br>dona fea, velha e sandia!</i></p><p class=\"nota\"><b>loar</b> — louvar · <b>prez</b> — valor · <b>nom fal</b> — não falta · <b>comprida de bem</b> — cheia de qualidades · <b>fea</b> — feia · <b>sandia</b> — louca</p>","links":[["Cantiga 544, D. Dinis (FCSH)","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=544"],["Cantiga 1520, Guilhade (FCSH)","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=1520"]]},{"nivel":1,"tipo":"classificar","rot":"Louvor ou troça","pergunta":"De que cantiga é cada verso?","categorias":["A · louvor","B · troça"],"itens":[["que mais que todas las do mundo val",0],["dona fea, velha e sandia!",1],["e vedes como vos quero loar:",1],["a que prez nem fremosura nom fal",0]],"retorno":"As duas usam «loar»; só uma cumpre a promessa."},{"nivel":1,"tipo":"unica","rot":"A hipérbole","pergunta":"«que mais que todas las do mundo val»: que faz este verso?","opcoes":[["Exagera: a senhora vale mais do que todas as mulheres do mundo","certo","É a hipérbole do louvor cortês: não há comparação possível."],["Descreve a senhora com pormenor","cuidado","Não há um pormenor: há um superlativo."],["Critica as outras mulheres","cuidado","As outras só servem de medida."]]},{"nivel":2,"tipo":"unica","rot":"A paródia","pergunta":"Porque é que B faz troça de cantigas como A?","opcoes":[["Usa as palavras do louvor («loar», «cantar») e termina com um insulto","certo","A forma promete um louvor; o refrão entrega o contrário. É a paródia."],["Porque a dona é mesmo feia","cuidado","Não sabemos, e não é isso que faz a troça: é o jogo com o género."],["Porque Guilhade não sabia trovar","cuidado","Sabia bem: para parodiar um género é preciso dominá-lo."]]},{"nivel":2,"tipo":"julgar","rot":"Escárnio ou maldizer","pergunta":"Um colega escreveu quatro frases sobre B. Quais têm prova no texto?","casos":[["O refrão insulta diretamente: é maldizer.",true,"Passa: «dona fea, velha e sandia!» não esconde nada."],["A cantiga nunca diz o nome da dona: é uma marca de escárnio.",true,"Passa: a dona fica sem nome, só com adjetivos."],["A cantiga elogia a dona no fim.",false,"Não passa: o fim é o insulto."],["Guilhade responde a uma queixa da dona.",true,"Passa: «fostes-vos queixar / que vos nunca louv'en[o] meu cantar»."]],"retorno":"As duas leituras (escárnio e maldizer) têm apoio no texto: por isso a FCSH as junta num só género."},{"nivel":3,"tipo":"texto","rot":"Escárnio sem ferir","pergunta":"Escreve dois versos que «louvem» um objeto do teu dia com uma palavra de duplo sentido, sem visar pessoas. Até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"Ai …, fostes-vos queixar…"}],"fontes":[["D. Dinis, «Quer'eu em maneira de proençal» (FCSH, 544)","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=544"],["João Garcia de Guilhade, «Ai dona fea» (FCSH, 1520)","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=1520"]],"modulo":"M1","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Fernao-Lopes-Matam-o-Mestre.html","id":"matam-o-mestre","cor":"#2a6f6f","corEscura":"#79c3c3","marca":"Ler a fundo · 5 min · M1 Fernão Lopes","titulo":"Matam o Mestre!","subtitulo":"Fernão Lopes, Crónica de D. João I, cap. XII","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Repórter de 1383","Viste como a crónica se faz de sons, corridas e gritos."],[0.5,"Bom começo","Já ouves o grito. Repara em quem o combinou antes."],[0,"A entrar na crónica","Relê: um grito, um cavalo, uma cidade inteira a correr."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Lisboa, 6 de dezembro de 1383. O Mestre de Avis acaba de matar o conde Andeiro nos paços da rainha. Estava combinado que o pajem gritaria pela cidade:</p><p><i>«O pajem do Mestre, que estava à porta, como lhe disseram que fosse pela vila, segundo já era percebido, começou d'ir rijamente e ao galope, em cima do cavalo em que estava, dizendo a altas vozes, bradando pela rua: ‘Matam o Mestre! Matam o Mestre nos paços da rainha! Acorrei ao Mestre, que o matam!’»</i></p><p><i>«Soaram as vozes do arruído pela cidade, ouvindo todos bradar que matavam o Mestre, e, assim como viúva que rei não tinha, e como se lhe este ficasse em logo de marido, se moveram todos com mão armada, correndo à pressa para hu diziam que se esto fazia, pera lhe dar vida e escusar morte.»</i></p><p class=\"nota\"><b>percebido</b> — combinado · <b>rijamente</b> — com força · <b>arruído</b> — alvoroço · <b>em logo de</b> — em lugar de · <b>hu</b> — onde · <b>escusar</b> — evitar</p>","links":[["Ler a crónica na edição de 1897 (Internet Archive)","https://archive.org/details/chronicadeelreid0103lopeuoft"]]},{"nivel":1,"tipo":"unica","rot":"Verdade ou encenação","pergunta":"O grito «Matam o Mestre!» era verdade?","opcoes":[["Não: estava combinado, para levantar a cidade","certo","«segundo já era percebido»: o grito é uma encenação, e resulta."],["Sim: o Mestre estava a ser morto","cuidado","Quem matou foi o Mestre; o pajem grita o contrário."],["O texto não diz","cuidado","Diz: «como lhe disseram que fosse pela vila, segundo já era percebido»."]]},{"nivel":1,"tipo":"multi","rot":"Ver e ouvir","pergunta":"Que coisas se ouvem ou se veem nestes dois parágrafos?","opcoes":[["Um cavalo a galope",5,"«rijamente e ao galope»: movimento."],["Gritos pela rua",5,"«bradando pela rua», «soaram as vozes»: som."],["Gente armada a correr",5,"«se moveram todos com mão armada, correndo à pressa»."],["O conde Andeiro a fugir",0,"Andeiro já está morto; não aparece."]]},{"nivel":2,"tipo":"unica","rot":"A viúva","pergunta":"«assim como viúva que rei não tinha»: a que é Lisboa comparada, e porquê?","opcoes":[["A uma viúva sem marido: a cidade não tem rei e corre para o Mestre como para um protetor","certo","A comparação faz do Mestre o marido que falta à cidade."],["A uma rainha","cuidado","A rainha é outra: é nos paços dela que tudo se passa."],["A uma mulher que chora","cuidado","Não há choro: há gente armada a correr."]]},{"nivel":2,"tipo":"classificar","rot":"Facto ou leitura","pergunta":"Classifica cada frase.","categorias":["Facto (está no texto)","Inferência ou interpretação"],"itens":[["O pajem gritou a cavalo pela rua.",0],["A multidão tinha medo de perder o Mestre.",1],["O grito estava combinado.",0],["Fernão Lopes quer que o leitor admire o povo.",1]],"retorno":"O que o texto diz é facto; o que tu deduzes ou lês é inferência ou interpretação: as duas valem, mas não são a mesma coisa."},{"nivel":3,"tipo":"texto","rot":"Em direto","pergunta":"Escreve a primeira frase de uma reportagem em direto deste momento, no presente, a começar por um som. Até 20 palavras.","minPalavras":6,"maxPalavras":20,"placeholder":"Ouve-se …"}],"fontes":[["Fernão Lopes, Crónica de D. João I, edição de 1897 (Internet Archive)","https://archive.org/details/chronicadeelreid0103lopeuoft"],["Wikipédia, «João Fernandes Andeiro»","https://pt.wikipedia.org/wiki/Jo%C3%A3o_Fernandes_Andeiro"]],"modulo":"M1","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Fernao-Lopes-Lisboa-Cercada.html","id":"lisboa-cercada","cor":"#2a6f6f","corEscura":"#79c3c3","marca":"Ler a fundo · 5 min · M1 Fernão Lopes","titulo":"Lisboa cercada","subtitulo":"Fernão Lopes, Crónica de D. João I, caps. CXVI e CXLVIII","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Olhar de cronista","Viste a cidade forte e a cidade com fome, e o que as liga."],[0.5,"Bom começo","Já vês as duas imagens. Repara em quem sofre mais na segunda."],[0,"A entrar na crónica","Relê: primeiro brilham as torres, depois esgravata-se a terra."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Em 1384 o rei de Castela cerca Lisboa. Fernão Lopes mostra a cidade duas vezes.</p><p><b>A</b> — preparada: <i>«Havia mais nestas torres muitas lanças d'armas, e bacinetes, e d'outras armaduras, que reluziam tanto, que bem mostrava cada uma torre por si que abastaria pera se defender.»</i></p><p><b>B</b> — com fome: <i>«No lugar onde costumavam a vender o trigo, andavam homens e moços esgravatando a terra, e se achavam algum grão de trigo metiam-no na boca, sem tendo outro mantimento.»</i></p><p class=\"nota\"><b>bacinetes</b> — capacetes · <b>abastaria</b> — bastaria · <b>esgravatando</b> — remexendo a terra · <b>mantimento</b> — alimento</p>","links":[["Ler a crónica na edição de 1897 (Internet Archive)","https://archive.org/details/chronicadeelreid0103lopeuoft"]]},{"nivel":1,"tipo":"par","rot":"Duas cidades","pergunta":"Liga cada expressão à imagem da cidade a que pertence.","pares":[["«reluziam tanto»","A cidade preparada"],["«esgravatando a terra»","A cidade com fome"],["«abastaria pera se defender»","A cidade confiante"],["«sem tendo outro mantimento»","A cidade sem nada para comer"]],"retorno":"As armas brilham no cap. CXVI; no cap. CXLVIII já só há terra para esgravatar."},{"nivel":1,"tipo":"unica","rot":"Ver a fome","pergunta":"Fernão Lopes não escreve «havia muita fome». O que faz em vez disso?","opcoes":[["Mostra homens e moços a esgravatar a terra por um grão","certo","É o visualismo da crónica: vê-se a fome em vez de a ouvir nomear."],["Dá o número de mortos","cuidado","Não dá; é uma das coisas que faltam à crónica."],["Culpa os castelhanos","cuidado","Nestas linhas não há culpa: há um gesto."]]},{"nivel":2,"tipo":"riscar","rot":"Cortar até ao osso","pergunta":"Corta esta frase nossa até 8 palavras sem perder quem faz o quê.","frase":"Os homens e os moços da cidade andavam a esgravatar a terra à procura de um grão de trigo.","limite":8,"essenciais":["homens","esgravatar","terra","trigo"],"modelo":"Homens e moços esgravatavam a terra por trigo.","retorno":"O cronista também corta: cada palavra que fica tem de mostrar alguma coisa."},{"nivel":2,"tipo":"unica","rot":"Quem sofre","pergunta":"No cap. CXLVIII, o trigo «era tão caro que as pobres gentes não podiam chegar a ele». O que mostra esta frase?","opcoes":[["Que a fome não foi igual para todos: quem tinha dinheiro comia","certo","A crónica regista a desigualdade sem a comentar."],["Que não havia trigo nenhum","cuidado","Havia «mui pouco» e caro: quem podia pagar, comprava."],["Que os castelhanos vendiam o trigo","cuidado","O texto fala da cidade, não do arraial."]]},{"nivel":3,"tipo":"texto","rot":"Do outro lado","pergunta":"Um soldado castelhano no arraial escreve uma frase para casa sobre o que vê da cidade. Até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"Mãe, daqui vê-se …"}],"fontes":[["Fernão Lopes, Crónica de D. João I, edição de 1897 (Internet Archive)","https://archive.org/details/chronicadeelreid0103lopeuoft"],["Wikipédia, «Cerco de Lisboa (1384)»","https://pt.wikipedia.org/wiki/Cerco_de_Lisboa_(1384)"]],"modulo":"M1","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Dinis-No-Tempo-da-Flor.html","id":"tempo-da-flor","cor":"#2a6f6f","corEscura":"#79c3c3","marca":"Ler a fundo · 5 min · M1 cantigas","titulo":"No tempo da flor","subtitulo":"D. Dinis, séc. XIII","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de coitas","Percebeste a crítica escondida no louvor aos provençais."],[0.5,"Bom começo","Já vês a comparação. Repara em quem sofre mais, segundo o poeta."],[0,"A entrar na cantiga","Relê o fim de cada estrofe: a coita dele é sempre maior."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>D. Dinis, rei e trovador, diz que os provençais só cantam o amor na primavera. Primeira estrofe:</p><p><i>Proençaes soem mui bem trobar<br>e dizem eles que é com amor;<br>mais os que trobam no tempo da flor<br>e nom em outro, sei eu bem que nom<br>ham tam gram coita no seu coraçom<br>qual m'eu por mia senhor vejo levar.</i></p><p class=\"nota\"><b>proençaes</b> — trovadores da Provença · <b>soem</b> — costumam · <b>mais</b> — mas · <b>coita</b> — sofrimento de amor · <b>levar</b> — suportar</p>","links":[["Cantiga 548, D. Dinis (FCSH)","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=548"]]},{"nivel":1,"tipo":"lacuna","rot":"A palavra do poeta","pergunta":"Completa com a palavra de D. Dinis.","versos":[{"antes":"mais os que trobam no tempo da ","opcoes":["flor","neve","noite"],"depois":""},{"antes":"ham tam gram ","opcoes":["coita","festa","fome"],"depois":" no seu coraçom"}],"retorno":"«Flor» é a primavera dos provençais; «coita» é o sofrimento que ele diz ter o ano inteiro."},{"nivel":1,"tipo":"unica","rot":"A acusação","pergunta":"O que censura o poeta aos provençais?","opcoes":[["Só trovam na primavera, por isso a coita deles não é tão grande","certo","«no tempo da flor e nom em outro»: amor com estação é amor pequeno."],["Não sabem trovar","cuidado","Diz o contrário: «soem mui bem trobar»."],["Não amam ninguém","cuidado","«dizem eles que é com amor»: ele desconfia, mas não nega."]]},{"nivel":2,"tipo":"unica","rot":"Conceder para atacar","pergunta":"«Proençaes soem mui bem trobar… mais…»: que faz o poeta ao começar por um elogio?","opcoes":[["Concede uma coisa para depois atacar outra: é mais convincente","certo","Quem reconhece o mérito do rival parece justo, e a crítica pesa mais."],["Engana-se e corrige-se","cuidado","Não há engano: o «mais» estava planeado."],["Quer ser provençal","cuidado","Noutra cantiga quer; nesta, distingue-se deles."]]},{"nivel":2,"tipo":"deslizar","rot":"Sincero?","pergunta":"O poeta diz que a sua coita é maior do que a de todos. Quanto acreditas nele?","esquerda":"É convenção do género","direita":"É sinceridade"},{"nivel":3,"tipo":"texto","rot":"Fora de estação","pergunta":"Escreve dois versos que critiquem quem só fala de amor numa data (o Dia dos Namorados, o verão…), à maneira de D. Dinis: concede primeiro, ataca depois. Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"Embora … / mas …"}],"fontes":[["D. Dinis, «Proençaes soem mui bem trobar» (FCSH, 548)","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=548"]],"modulo":"M1","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Dinis-Ai-Flores-do-Verde-Pino.html","id":"flores-verde-pino","cor":"#2a6f6f","corEscura":"#79c3c3","marca":"Ler a fundo · 5 min · M1 cantigas","titulo":"As flores respondem","subtitulo":"D. Dinis, séc. XIII","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Voz das flores","Percebeste quem pergunta, quem responde e o que fica sem resposta."],[0.5,"Bom começo","Já vês o diálogo. Repara no refrão: repete-se mesmo depois da resposta."],[0,"A entrar na cantiga","Relê: as flores dizem que ele está vivo, mas ninguém diz onde."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Uma rapariga pergunta às flores do pinheiro pelo amigo. E as flores respondem.</p><p><i>— Ai flores, ai flores do verde pino,<br>se sabedes novas do meu amigo?<br>Ai Deus, e u é?</i></p><p><i>Se sabedes novas do meu amigo,<br>aquel que mentiu do que pôs conmigo?<br>Ai Deus, e u é?</i></p><p><i>— Vós me preguntades polo voss'amigo<br>e eu bem vos digo que é san'e vivo.<br>Ai Deus, e u é?</i></p><p><i>— E eu bem vos digo que é san'e vivo<br>e será vosco ant'o prazo saído.<br>Ai Deus, e u é?</i></p><p class=\"nota\">u é? — onde está? · <b>pino</b> — pinheiro · <b>pôs conmigo</b> — combinou comigo · <b>preguntades</b> — perguntais · <b>vosco</b> — convosco · <b>ant'o prazo saído</b> — antes de acabar o prazo</p>","links":[["Cantiga 592, D. Dinis (FCSH)","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=592"]]},{"nivel":1,"tipo":"classificar","rot":"Quem fala","pergunta":"Quem diz cada verso?","categorias":["A rapariga","As flores"],"itens":[["se sabedes novas do meu amigo?",0],["e eu bem vos digo que é san'e vivo.",1],["aquel que mentiu do que pôs conmigo?",0],["e será vosco ant'o prazo saído.",1]],"retorno":"As quatro primeiras estrofes perguntam; as quatro últimas respondem."},{"nivel":1,"tipo":"unica","rot":"O refrão","pergunta":"«Ai Deus, e u é?» repete-se mesmo depois de as flores responderem. Porquê?","opcoes":[["Porque as flores dizem que ele está vivo, mas não dizem onde","certo","A pergunta do lugar fica sem resposta até ao fim."],["Porque a rapariga não ouviu","cuidado","Ouviu: as flores repetem o que ela perguntou."],["Porque é uma canção alegre","cuidado","É uma pergunta a Deus, repetida oito vezes."]]},{"nivel":2,"tipo":"ordenar","rot":"Leixa-pren","pergunta":"Põe por ordem os versos, como na cantiga: o segundo verso de uma estrofe passa a primeiro da seguinte.","itens":["— Vós me preguntades polo voss'amigo","e eu bem vos digo que é san'e vivo.","— E eu bem vos digo que é san'e vivo","e será vosco ant'o prazo saído."],"retorno":"É o leixa-pren: deixa e toma. O verso que fecha uma estrofe abre a outra."},{"nivel":2,"tipo":"unica","rot":"O que ele fez","pergunta":"«aquel que mentiu do que pôs conmigo»: o que se fica a saber do amigo?","opcoes":[["Prometeu voltar num prazo e não cumpriu","certo","«pôs conmigo» é o que combinaram; as flores prometem que virá «ant'o prazo saído»."],["Morreu","cuidado","As flores dizem o contrário: «san'e vivo»."],["Está no pinheiro","cuidado","No pinheiro estão as flores, que respondem por ele."]]},{"nivel":3,"tipo":"texto","rot":"Pergunta à natureza","pergunta":"Escreve dois versos em que perguntas a alguma coisa da natureza por alguém de quem tens saudades, e um refrão de três palavras. Até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"Ai …, ai … / … / (refrão)"}],"fontes":[["D. Dinis, «Ai flores, ai flores do verde pino» (FCSH, 592)","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=592"]],"modulo":"M1","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Ines-Panela-sem-Asa.html","id":"ines-panela","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M2 Gil Vicente","titulo":"Como panela sem asa","subtitulo":"Gil Vicente, Farsa de Inês Pereira, 1523","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de monólogos","Ouviste Inês sozinha e percebeste o que ela quer, e como o diz."],[0.5,"Bom começo","Já vês a queixa. Repara nas imagens: panela, coruja, caramujo, bugia."],[0,"A entrar na farsa","Relê em voz alta: Inês está a falar sozinha para nós."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Inês, fechada em casa a bordar, sozinha:</p><p><i>Renego deste lavrar<br>E do primeiro que o usou;<br>Ó diabo que o eu dou,<br>Que tão mau é d'aturar.<br>Oh Jesu! que enfadamento,<br>E que raiva, e que tormento,<br>Que cegueira, e que canseira!<br>Eu hei-de buscar maneira<br>D'algum outro aviamento.</i></p><p><i>Coitada, assi hei-de estar<br>Encerrada nesta casa<br>Como panela sem asa,<br>Que sempre está num lugar?</i></p><p><i>Esta vida he mais que morta.<br>Sam eu coruja ou corujo,<br>Ou sam algum caramujo<br>Que não sai senão à porta?<br>E quando me dão algum dia<br>Licença, como a bugia,<br>Que possa estar à janela,<br>É já mais que a Madanela<br>Quando achou a aleluía.</i></p><p class=\"nota\"><b>lavrar</b> — bordar · <b>aviamento</b> — arranjo de vida (aqui, casamento) · <b>caramujo</b> — caracol · <b>bugia</b> — macaca</p>","links":[["Ler a farsa inteira na Wikisource","https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira"]]},{"nivel":1,"tipo":"lacuna","rot":"A palavra de Inês","pergunta":"Completa com a palavra de Gil Vicente.","versos":[{"antes":"Como ","opcoes":["panela","gaiola","porta"],"depois":" sem asa,"},{"antes":"Que não sai senão à ","opcoes":["porta","rua","noite"],"depois":"?"}],"retorno":"Panela sem asa e caramujo: duas coisas que não saem do sítio. Inês vê-se assim."},{"nivel":1,"tipo":"unica","rot":"O que quer","pergunta":"«Eu hei-de buscar maneira / D'algum outro aviamento.» O que decide Inês?","opcoes":[["Procurar outra vida: casar para sair de casa","certo","«Aviamento» é arranjo de vida; o resto da farsa é essa procura."],["Aprender a bordar melhor","cuidado","Renega o lavrar «e o primeiro que o usou»."],["Fugir de casa","cuidado","Não foge: procura um marido, que era a única porta."]]},{"nivel":2,"tipo":"par","rot":"Cada imagem, um sentido","pergunta":"Liga cada imagem ao que ela diz da vida de Inês.","pares":[["panela sem asa","objeto que ninguém pega nem move"],["coruja ou corujo","bicho da noite, fechado de dia"],["caramujo","só sai até à porta da casca"],["bugia à janela","animal preso a quem dão licença de ver a rua"]],"retorno":"Quatro imagens, uma só ideia: presa, e a saber que está presa."},{"nivel":2,"tipo":"unica","rot":"O tom","pergunta":"«Sam eu coruja ou corujo, / Ou sam algum caramujo»: Inês queixa-se, mas como?","opcoes":[["A rir de si própria: a queixa vem em imagens cómicas","certo","É farsa: a dor de Inês faz rir, e é nisso que a percebemos."],["A chorar, sem ironia","cuidado","Coruja, corujo, caramujo: as palavras foram escolhidas para rir."],["A rezar","cuidado","«Oh Jesu!» é exclamação de impaciência, não oração."]]},{"nivel":3,"tipo":"texto","rot":"Uma Inês de hoje","pergunta":"Escreve dois versos de uma Inês de hoje, fechada num sítio à tua escolha, com uma comparação a um objeto. Até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"Aqui hei-de estar … / como …"}],"fontes":[["Gil Vicente, Farsa de Inês Pereira (Wikisource)","https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira"]],"modulo":"M2","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Pero-Marques-Joao-das-Bestas.html","id":"pero-visita","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M2 Gil Vicente","titulo":"Que João das bestas!","subtitulo":"Gil Vicente, Farsa de Inês Pereira, 1523","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de comédia","Apanhaste os três cómicos e o aparte, e sabes de quem se ri a cena."],[0.5,"Bom começo","Já te ris. Agora diz porquê: linguagem, situação ou carácter?"],[0,"A entrar na farsa","Relê a cena a imaginar o palco: onde está cada um, para onde olha."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Pêro Marques, filho de lavrador rico, vem pedir Inês:</p><p><i>Mãe: Tomai aquela cadeira.<br>Pêro Marques: E que val aqui uma destas?<br>Inês (à parte): Ó Jesu! que João das bestas!<br>Olhai aquela canseira!</i></p><p><i>Rubrica: Assentou-se com as costas pera elas, e diz:</i></p><p><i>Pêro Marques: Eu cuido que não estou bem...</i></p><p>[…]</p><p><i>Cuido que lhe trago aqui<br>Pêras da minha pereira...<br>Hão-de estar na derradeira.<br>Tende ora, Inês, per i.<br>Inês: E isso hei-de ter na mão?<br>Pêro Marques: Deitae as peas no chão.<br>Inês: As perlas pera enfiar..<br>Três chocalhos e um novelo...<br>E as peias no capelo...<br>E as pêras? Onde estão?<br>Pêro Marques: Nunca tal me aconteceu!<br>Algum rapaz m'as comeu...</i></p><p class=\"nota\"><b>val</b> — vale · <b>João das bestas</b> — tolo · <b>peias</b> — cordas de prender animais · <b>capelo</b> — capuz</p>","links":[["Ler a farsa inteira na Wikisource","https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira"]]},{"nivel":1,"tipo":"unica","rot":"O aparte","pergunta":"«Ó Jesu! que João das bestas!» Quem ouve esta fala?","opcoes":[["O público, mas não Pêro Marques","certo","É um aparte: Inês fala para nós, e Pêro continua sem saber."],["Pêro Marques, que se ofende","cuidado","Se ouvisse, a cena mudava; ele continua a sentar-se de costas."],["Só a Mãe","cuidado","A Mãe está na cena, mas o aparte é para quem vê a peça."]]},{"nivel":1,"tipo":"multi","rot":"O que vem no capelo","pergunta":"O que sai do capuz de Pêro Marques?","opcoes":[["Três chocalhos",5,"Coisas de quem trata de gado."],["Um novelo",5,"Sim."],["As peias",5,"Cordas para prender animais: e as pêras é que não."],["As pêras",0,"Essas ficaram pelo caminho: «Algum rapaz m'as comeu...»"]]},{"nivel":2,"tipo":"classificar","rot":"Três cómicos","pergunta":"De que tipo de cómico é cada momento?","categorias":["De linguagem","De situação","De carácter"],"itens":[["«E que val aqui uma destas?» (não sabe o que é a cadeira)",0],["Senta-se de costas para as duas",1],["Traz pêras como presente e perdeu-as",2],["«João das bestas»",0]],"retorno":"Linguagem: o que se diz. Situação: o que acontece. Carácter: o que a pessoa é. A farsa junta os três em dois minutos."},{"nivel":2,"tipo":"julgar","rot":"Passa ou não passa","pergunta":"Quatro leituras de um colega. Quais têm prova no texto?","casos":[["Pêro Marques é desastrado.",true,"Passa: senta-se de costas, perde as pêras, esvazia o capelo."],["Pêro Marques é desonesto.",false,"Não passa: as pêras, «trazia-as de boa mente»; a culpa é de «algum rapaz»."],["Inês despreza-o desde o início.",true,"Passa: o aparte «João das bestas» é a primeira coisa que diz dele."],["A Mãe também se ri dele.",false,"Não passa: a Mãe oferece-lhe a cadeira e pergunta-lhe o nome; interessa-lhe o «morgado»."]],"retorno":"Prova é uma fala ou uma rubrica: sem isso, é palpite."},{"nivel":3,"tipo":"texto","rot":"Filmar o aparte","pergunta":"Como filmarias o aparte «Ó Jesu! que João das bestas!»? Diz o plano e o som, em até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"Plano …; som …"}],"fontes":[["Gil Vicente, Farsa de Inês Pereira (Wikisource)","https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira"]],"modulo":"M2","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Escudeiro-Fala-e-Tange.html","id":"escudeiro-fala","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M2 Gil Vicente","titulo":"Fala e com' ora fala!","subtitulo":"Gil Vicente, Farsa de Inês Pereira, 1523","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de apartes","Sabes mais do que Inês: ouviste o Moço."],[0.5,"Bom começo","Já vês a máscara. Repara em quem a denuncia, e quando."],[0,"A entrar na farsa","Relê: o Escudeiro ensaia as mentiras antes de entrar."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>O que os casamenteiros prometem, e o que o Escudeiro combina com o criado antes de entrar:</p><p><i>Vidal: Esperai, aguardai ora!<br>Soubemos dum escudeiro<br>De feição d'atafoneiro<br>Que virá logo essora,<br>Que fala... e com' ora fala!<br>Estrugirá esta sala.<br>E tange... e com' ora tange!</i></p><p>[…]</p><p><i>Escudeiro: E se me vires mentir<br>Gabando-me de privado,<br>Está tu dissimulado,<br>Ou sai-te pera fora a rir<br>Isto te aviso daqui,<br>Faze-o por amor de mi.<br>Moço: Porém, senhor digo eu<br>Que mau calçado é o meu<br>Pera estas vistas assi.<br>Escudeiro: Que farei, que o sapateiro<br>Não tem solas nem tem pele?<br>Moço: Sapatos me daria ele,<br>Se me vós désseis dinheiro...<br>Escudeiro: Eu o haverei agora.<br>E mais calças te prometo.<br>Moço (à parte): Homem que não tem nem preto,<br>Casa muito na má hora.</i></p><p class=\"nota\"><b>essora</b> — agora · <b>tange</b> — toca viola · <b>privado</b> — favorito de um senhor · <b>nem preto</b> — nem um tostão</p>","links":[["Ler a farsa inteira na Wikisource","https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira"]]},{"nivel":1,"tipo":"classificar","rot":"Quem diz","pergunta":"Quem diz cada fala?","categorias":["Vidal, casamenteiro","Escudeiro","Moço"],"itens":[["Que fala... e com' ora fala!",0],["E se me vires mentir",1],["Homem que não tem nem preto,",2],["Sapatos me daria ele,",2]],"retorno":"Três vozes: quem vende, quem se vende, e quem sabe o preço."},{"nivel":1,"tipo":"unica","rot":"O aviso","pergunta":"O Escudeiro avisa o Moço: «se me vires mentir…». O que lhe pede?","opcoes":[["Que disfarce, ou que saia da sala para se rir lá fora","certo","«Está tu dissimulado, / Ou sai-te pera fora a rir»: a mentira está planeada."],["Que o corrija","cuidado","Corrigi-lo estragava o plano."],["Que minta também","cuidado","Só lhe pede silêncio; o Moço, à parte, não o dá."]]},{"nivel":2,"tipo":"par","rot":"Parece e é","pergunta":"Liga o que parece ao que a cena revela.","pares":[["fala e tange","promessa dos casamenteiros, que vendem"],["gabar-se de privado","mentira ensaiada com o criado"],["«Eu o haverei agora»","não tem dinheiro para os sapatos do Moço"],["«Casa muito na má hora»","o que o público sabe e Inês não"]],"retorno":"A cena mostra o Escudeiro por dentro antes de Inês o ver por fora: é a ironia dramática."},{"nivel":2,"tipo":"unica","rot":"Quem sabe o quê","pergunta":"Depois desta cena, o público sabe uma coisa que Inês não sabe. O que é, e como se chama isso?","opcoes":[["Que o Escudeiro é pobre e mentiroso: ironia dramática","certo","Nós ouvimos o Moço; Inês vai ouvir a viola."],["Que Inês não quer casar: suspense","cuidado","Inês quer casar, e muito."],["Que o Moço vai trair o amo: reviravolta","cuidado","O Moço não trai: só diz a verdade para nós."]]},{"nivel":3,"tipo":"texto","rot":"O perfil do Moço","pergunta":"Escreve o perfil do Escudeiro numa aplicação de encontros, como o Moço o escreveria. Duas informações do texto, até 25 palavras.","minPalavras":8,"maxPalavras":25,"placeholder":"Toca viola …; …"}],"fontes":[["Gil Vicente, Farsa de Inês Pereira (Wikisource)","https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira"]],"modulo":"M2","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Escudeiro-Janelas-Pregadas.html","id":"janelas-pregadas","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M2 Gil Vicente","titulo":"Já vos preguei as janelas","subtitulo":"Gil Vicente, Farsa de Inês Pereira, 1523","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor atento ao controlo","Viste a prisão crescer verso a verso e a palavra «discrição» mudar de dono."],[0.5,"Bom começo","Já vês a prisão. Repara em como ele a justifica: com um elogio."],[0,"A entrar na cena","Relê: cada fala do Escudeiro tira uma coisa a Inês."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Casados. Inês cantava.</p><p><i>Escudeiro: Vós cantais, Inês Pereira?<br>Em vodas m'andáveis vós?<br>Juro ao corpo de Deus<br>Que esta seja a derradeira!</i></p><p>[…]</p><p><i>Vós não haveis de falar<br>Com homem nem mulher que seja;<br>Nem somente ir à igreja<br>Não vos quero eu leixar<br>Já vos preguei as janelas,<br>Por que não vos ponhais nelas.<br>Estareis aqui encerrada<br>Nesta casa, tão fechada<br>Como freira d'Oudivelas.</i></p><p><i>Inês: Que pecado foi o meu?<br>Porque me dais tal prisão?<br>Escudeiro: Vós buscastes discrição,<br>Que culpa vos tenho eu?<br>Pode ser maior aviso,<br>Maior discrição e siso<br>Que guardar o meu tisouro?<br>Não sois vós, mulher meu ouro?<br>Que mal faço em guardar isso?</i></p><p class=\"nota\"><b>vodas</b> — bodas · <b>derradeira</b> — última · <b>leixar</b> — deixar · <b>discrição</b> — inteligência, bom falar · <b>siso</b> — juízo</p>","links":[["Ler a farsa inteira na Wikisource","https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira"]]},{"nivel":1,"tipo":"ordenar","rot":"Verso a verso","pergunta":"Põe por ordem o que o Escudeiro tira a Inês.","itens":["Cantar","Falar com homem ou mulher","Ir à igreja","Pôr-se à janela"],"retorno":"Primeiro a voz, depois as pessoas, depois a rua, depois a janela: a prisão fecha-se por dentro."},{"nivel":1,"tipo":"lacuna","rot":"A palavra dele","pergunta":"Completa com a palavra de Gil Vicente.","versos":[{"antes":"Não sois vós, mulher meu ","opcoes":["ouro","bem","amor"],"depois":"?"},{"antes":"Nesta casa, tão fechada / Como ","opcoes":["freira","panela","coruja"],"depois":" d'Oudivelas."}],"retorno":"Ouro: coisa que se guarda. Freira: mulher fechada. É assim que ele a vê."},{"nivel":2,"tipo":"unica","rot":"A palavra que muda de dono","pergunta":"«Vós buscastes discrição, / Que culpa vos tenho eu?» O que faz o Escudeiro com a palavra «discrição»?","opcoes":[["Vira-a contra Inês: o que ela pediu no marido é agora a desculpa da prisão","certo","Inês quis um homem «discreto»; ele diz que guardá-la é «discrição e siso»."],["Pede-lhe desculpa","cuidado","«Que culpa vos tenho eu?»: não há desculpa, há acusação."],["Elogia-a","cuidado","«Mulher meu ouro» parece elogio, mas serve para justificar a prisão."]]},{"nivel":2,"tipo":"julgar","rot":"Passa ou não passa","pergunta":"Quatro leituras de um colega. Quais têm prova no texto?","casos":[["O Escudeiro justifica o controlo com um elogio.",true,"Passa: «Não sois vós, mulher meu ouro?»"],["Inês aceita tudo em silêncio.",false,"Não passa: «Que pecado foi o meu? / Porque me dais tal prisão?»"],["A prisão de Inês é pior do que a de casa da Mãe.",true,"Passa: janelas pregadas, nem igreja; em casa da Mãe ainda ia à janela «como a bugia»."],["O Escudeiro bate em Inês.",false,"Não passa: ameaça («Em que ponha fogo a tudo»), mas o texto não mostra pancada."]],"retorno":"Prova é um verso: sem verso, é palpite."},{"nivel":3,"tipo":"texto","rot":"Sinais","pergunta":"Escreve dois sinais de controlo desta cena que ainda hoje se reconhecem numa relação, por palavras tuas. Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"Proibir de …; decidir por …"}],"fontes":[["Gil Vicente, Farsa de Inês Pereira (Wikisource)","https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira"]],"modulo":"M2","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camoes-Maquina-do-Mundo.html","id":"maquina-mundo","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M3 Os Lusíadas","titulo":"A máquina do Mundo","subtitulo":"Luís de Camões, Os Lusíadas, canto X, est. 77–80","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor do globo","Viste o modelo do mundo e o limite que ele tem: Deus, que ninguém entende."],[0.5,"Bom começo","Já vês o globo. Repara na última estância: o que o engenho humano não alcança."],[0,"A subir ao cume","Relê: um globo de luz, com um centro só, e uma Deusa a explicar."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>A Deusa mostra ao Gama um modelo do universo:</p><p><i>Aqui um globo vêm no ar, que o lume<br>Claríssimo por ele penetrava,<br>De modo que o seu centro está evidente,<br>Como a sua superfícia, claramente.</i></p><p><i>Qual a matéria seja não se enxerga,<br>Mas enxerga-se bem que está composto<br>De vários orbes, que a Divina verga<br>Compôs, e um centro a todos só tem posto.</i></p><p>[…]</p><p><i>Vês aqui a grande máquina do Mundo,<br>Etérea e elemental, que fabricada<br>Assi foi do Saber, alto e profundo,<br>Que é sem princípio e meta limitada.<br>Quem cerca em derredor este rotundo<br>Globo e sua superfícia tão limada,<br>É Deus: mas o que é Deus, ninguém o entende,<br>Que a tanto o engenho humano não se estende.</i></p><p class=\"nota\"><b>lume</b> — luz · <b>orbes</b> — esferas · <b>verga</b> — vara · <b>derredor</b> — à volta · <b>limada</b> — polida · <b>engenho</b> — inteligência</p>","links":[["Ler o canto X em oslusiadas.org","https://oslusiadas.org/x/77.html"]]},{"nivel":1,"tipo":"multi","rot":"Como é o globo","pergunta":"O que diz o texto do globo?","opcoes":[["Está suspenso no ar",5,"«um globo vêm no ar»."],["A luz atravessa-o e vê-se o centro",5,"«o lume / Claríssimo por ele penetrava»."],["É feito de vários orbes com um só centro",5,"«um centro a todos só tem posto»."],["É de vidro",0,"«Qual a matéria seja não se enxerga»: não se sabe de que é feito."]]},{"nivel":1,"tipo":"unica","rot":"Quem o cerca","pergunta":"«Quem cerca em derredor este rotundo / Globo […] É Deus.» Que lugar tem Deus na máquina?","opcoes":[["Está à volta de tudo: envolve o globo inteiro","certo","É o nível mais alto da hierarquia: o que contém o resto."],["Está no centro","cuidado","O centro é o que organiza os orbes; Deus está «em derredor»."],["Está dentro de um dos orbes","cuidado","Não é uma camada: é o que cerca todas."]]},{"nivel":2,"tipo":"ordenar","rot":"Do mais geral ao pormenor","pergunta":"Organiza a máquina do Mundo como hierarquia, do que envolve tudo ao pormenor.","itens":["Deus, que cerca o globo","O centro único de todos os orbes","Os vários orbes","A superfície e o olhar do Gama"],"retorno":"É a hierarquia da ficha: o que envolve, o que organiza, as camadas, o pormenor."},{"nivel":2,"tipo":"unica","rot":"O limite","pergunta":"«mas o que é Deus, ninguém o entende, / Que a tanto o engenho humano não se estende.» Que tensão há entre este verso e a viagem do Gama?","opcoes":[["O homem pode ver o modelo e navegar o mundo, mas não pode compreender tudo","certo","Ambição e limite na mesma estância."],["O Gama não devia ter viajado","cuidado","A Deusa mostra-lhe o mundo «pera que vejas / Por onde vás»: a viagem é aprovada."],["Deus não existe na máquina","cuidado","Existe: é quem a cerca; só não se entende."]]},{"nivel":3,"tipo":"texto","rot":"O teu centro","pergunta":"Escolhe um projeto teu e diz, numa palavra, o seu centro; depois, numa frase, o que fica à volta. Até 30 palavras.","minPalavras":6,"maxPalavras":30,"placeholder":"Centro: …. À volta: …"}],"fontes":[["Luís de Camões, Os Lusíadas, canto X, est. 77–80 (oslusiadas.org)","https://oslusiadas.org/x/77.html"]],"modulo":"M3","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camoes-Descalca-vai-para-a-Fonte.html","id":"camoes-leonor","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M3 Camões","titulo":"Vai formosa, e não segura","subtitulo":"Luís de Camões, «Descalça vai para a fonte» (redondilhas)","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Ouvido de medida velha","Contaste as sílabas, viste as cores de Leonor e o que «não segura» esconde."],[0.5,"Bom começo","Já vês Leonor. Repara no verso que se repete e no que ele não diz."],[0,"A caminho da fonte","Relê em voz alta e bate o ritmo: sete sílabas por verso."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Mote:</p><p><i>Descalça vai para a fonte<br>Leonor pela verdura;<br>Vai formosa, e não segura.</i></p><p>Voltas:</p><p><i>Leva na cabeça o pote,<br>O testo nas mãos de prata,<br>Cinta de fina escarlata,<br>Sainho de chamalote;<br>Traz a vasquinha de cote,<br>Mais branca que a neve pura;<br>Vai formosa, e não segura.</i></p><p><i>Descobre a touca a garganta,<br>Cabelos de ouro entrançado,<br>Fita de cor de encarnado,<br>Tão linda que o mundo espanta;<br>Chove nela graça tanta,<br>Que dá graça à formosura;<br>Vai formosa, e não segura.</i></p><p class=\"nota\"><b>verdura</b> — campo verde · <b>testo</b> — tampa · <b>escarlata</b> — tecido vermelho · <b>sainho</b> — casaco curto · <b>vasquinha de cote</b> — saia de uso diário</p>","links":[["Obras Completas, t. III (Project Gutenberg n.º 37192)","https://www.gutenberg.org/ebooks/37192"]]},{"nivel":1,"tipo":"unica","rot":"Mote e voltas","pergunta":"O mote tem três versos e cada volta tem sete. Que verso do mote volta no fim de cada volta?","opcoes":[["Vai formosa, e não segura.","certo","É o verso que as voltas «glosam»: a medida velha funciona assim."],["Descalça vai para a fonte","cuidado","Esse abre o mote, mas não se repete."],["Leonor pela verdura;","cuidado","Leonor só é nomeada uma vez."]]},{"nivel":1,"tipo":"multi","rot":"As cores","pergunta":"Que cores e materiais vestem Leonor?","opcoes":[["Prata (o testo nas mãos)",5,"Sim."],["Escarlata (a cinta)",5,"Vermelho."],["Ouro (os cabelos) e encarnado (a fita)",5,"Sim."],["Azul",0,"Não há azul no poema; há branco, «mais branca que a neve pura»."]]},{"nivel":2,"tipo":"unica","rot":"Não segura","pergunta":"«Vai formosa, e não segura.» O que sugere «não segura»?","opcoes":[["Que a beleza a expõe: ao amor, aos olhares, ao desejo dos outros","certo","É o que a repetição vai carregando: bela, e por isso em risco."],["Que vai a correr e pode cair","cuidado","Leva o pote na cabeça, mas o poema não fala de tropeçar."],["Que tem medo","cuidado","Leonor não fala nem sente: é vista."]]},{"nivel":2,"tipo":"classificar","rot":"Recursos","pergunta":"Que recurso está em cada verso?","categorias":["Hipérbole","Comparação","Repetição com jogo de sentido"],"itens":[["Tão linda que o mundo espanta",0],["Mais branca que a neve pura",1],["Chove nela graça tanta, / Que dá graça à formosura",2],["Chove nela graça tanta",0]],"retorno":"Exagerar, comparar, repetir: três maneiras de dizer que Leonor é mais do que se vê."},{"nivel":3,"tipo":"texto","rot":"Uma Leonor de hoje","pergunta":"Escreve dois versos de sete sílabas sobre alguém a caminho de um sítio, com um objeto de hoje; termina com «vai formosa, e não segura». Até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"Leva … / vai formosa, e não segura."}],"fontes":[["Luís de Camões, «Descalça vai para a fonte», Obras Completas, t. III (Project Gutenberg n.º 37192)","https://www.gutenberg.org/ebooks/37192"]],"modulo":"M3","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camoes-Aquela-Cativa.html","id":"camoes-barbara","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M3 Camões","titulo":"Aquela cativa","subtitulo":"Luís de Camões, «Endechas a Bárbara escrava»","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor com olhos de hoje","Viste o elogio que desafia o gosto da época, e a voz que falta."],[0.5,"Bom começo","Já vês a inversão cativa/cativo. Repara em quem o poema contraria."],[0,"A entrar no poema","Relê: uma escrava que prende quem é livre."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><i>Aquela cativa,<br>Que me tem cativo,<br>Porque nela vivo,<br>Já não quer que viva.</i></p><p>[…]</p><p><i>Pretos os cabelos,<br>Onde o povo vão<br>Perde opinião,<br>Que os louros são belos.</i></p><p><i>Pretidão de Amor,<br>Tão doce a figura,<br>Que a neve lhe jura<br>Que trocara a cor.<br>Leda mansidão,<br>Que o siso acompanha,<br>Bem parece estranha,<br>Mas bárbara não.</i></p><p class=\"nota\"><b>o povo vão</b> — a gente comum, sem juízo · <b>perde opinião</b> — perde a convicção · <b>leda</b> — alegre · <b>siso</b> — juízo · <b>bárbara</b> — estrangeira, «selvagem» (jogo com o nome)</p>","links":[["Obras Completas, t. III (Project Gutenberg n.º 37192)","https://www.gutenberg.org/ebooks/37192"]]},{"nivel":1,"tipo":"unica","rot":"Cativa, cativo","pergunta":"«Aquela cativa, / Que me tem cativo»: que inversão há aqui?","opcoes":[["A escrava prende o homem livre: no amor, a hierarquia vira-se","certo","Cativa (escrava) e cativo (preso por amor): a mesma palavra, dois sentidos."],["O homem comprou a escrava","cuidado","O poema não fala de compra: fala de quem prende quem."],["Os dois estão presos na mesma cadeia","cuidado","Ela é cativa por condição; ele, por amor."]]},{"nivel":1,"tipo":"unica","rot":"Contra o gosto","pergunta":"«Pretos os cabelos, / Onde o povo vão / Perde opinião, / Que os louros são belos.» O que faz o poema ao gosto da época?","opcoes":[["Contraria-o: diante destes cabelos, a gente comum deixa de achar que só o louro é belo","certo","O ideal petrarquista (loura, clara) fica ridicularizado."],["Confirma-o","cuidado","«Perde opinião»: a opinião comum perde-se."],["Ignora-o","cuidado","Fala dele de propósito, para o virar."]]},{"nivel":2,"tipo":"par","rot":"Cada verso, um gesto","pergunta":"Liga cada passagem ao que ela faz.","pares":[["Que a neve lhe jura / Que trocara a cor","a própria brancura preferia ser preta"],["Bem parece estranha, / Mas bárbara não","o nome e o preconceito: estrangeira sim, selvagem não"],["Que o siso acompanha","a doçura vem com juízo"],["Já não quer que viva","o amor que prende também mata"]],"retorno":"Elogio, jogo de palavras e recusa do preconceito, tudo em versos de cinco sílabas."},{"nivel":2,"tipo":"julgar","rot":"Com olhos de hoje","pergunta":"Quatro leituras de um colega. Quais têm prova no poema?","casos":[["O poema elogia uma beleza que a época não valorizava.",true,"Passa: «Pretidão de Amor», «Que os louros são belos» posto em causa."],["A mulher fala e diz o que sente.",false,"Não passa: nunca ouvimos a voz dela; o poema fala por ela."],["O poema recusa chamar-lhe «bárbara» no sentido de selvagem.",true,"Passa: «Mas bárbara não»."],["O poema questiona a escravatura.",false,"Não passa: ela continua «cativa»; o poema não discute a condição, só a beleza."]],"retorno":"Ler criticamente é ver as duas coisas: o que o poema desafia e o que deixa como está."},{"nivel":3,"tipo":"texto","rot":"A voz que falta","pergunta":"Escreve dois versos curtos na voz de Bárbara, a responder ao poeta. Até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"… / …"}],"fontes":[["Luís de Camões, «Endechas a Bárbara escrava», Obras Completas, t. III (Project Gutenberg n.º 37192)","https://www.gutenberg.org/ebooks/37192"]],"modulo":"M3","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camoes-Perdigao.html","id":"camoes-perdigao","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M3 Camões","titulo":"Perdigão perdeu a pena","subtitulo":"Luís de Camões, mote alheio e voltas","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de alegorias","Viste o pássaro, viste o homem por baixo, e as duas penas."],[0.5,"Bom começo","Já vês o perdigão. Repara na palavra que muda de sentido."],[0,"A entrar no poema","Relê: quem quis voar alto de mais ficou sem asas."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Mote:</p><p><i>Perdigão perdeu a pena,<br>Não há mal que lhe não venha.</i></p><p>Voltas:</p><p><i>Perdigão, que o pensamento<br>Subiu a um alto lugar,<br>Perde a pena do voar,<br>Ganha a pena do tormento:<br>Não tem no ar, nem no vento,<br>Asas com que se sustenha:<br>Não há mal que lhe não venha.</i></p><p><i>Quis voar a uma alta torre,<br>Mas achou-se desasado;<br>E vendo-se depenado,<br>De puro penado morre.<br>Se a queixumes se socorre,<br>Lança no fogo mais lenha:<br>Não há mal que lhe não venha.</i></p><p class=\"nota\"><b>perdigão</b> — macho da perdiz · <b>pena</b> — pluma; sofrimento · <b>desasado</b> — sem asas · <b>penado</b> — que sofre</p>","links":[["Obras Completas, t. III (Project Gutenberg n.º 37192)","https://www.gutenberg.org/ebooks/37192"]]},{"nivel":1,"tipo":"unica","rot":"Duas penas","pergunta":"«Perde a pena do voar, / Ganha a pena do tormento.» O que acontece com a palavra «pena»?","opcoes":[["Muda de sentido: primeiro é a pluma, depois é o sofrimento","certo","Perde uma, ganha a outra: é o jogo do poema inteiro."],["Repete-se sem mudar","cuidado","Se fosse a mesma pena, não havia troca."],["Quer dizer «caneta»","cuidado","Esse sentido existe, mas não aqui."]]},{"nivel":1,"tipo":"par","rot":"O que representa","pergunta":"Liga cada elemento ao seu sentido.","pares":[["o perdigão","o amante, ou o próprio sujeito"],["a alta torre","um amor inacessível, acima dele"],["perder a pena","perder a esperança e ganhar o sofrimento"],["lançar no fogo mais lenha","queixar-se só aumenta a dor"]],"retorno":"É uma alegoria: um pássaro por fora, um homem por dentro."},{"nivel":2,"tipo":"unica","rot":"O mote alheio","pergunta":"O mote não é de Camões: é «alheio», um dito popular. O que faz Camões com ele?","opcoes":[["Glosa-o: explica-o em voltas, dando-lhe um sentido novo","certo","É a medida velha: um mote dado, voltas que o desdobram."],["Copia-o sem mudar nada","cuidado","As voltas são dele; só o mote é alheio."],["Contradiz o provérbio","cuidado","Não contradiz: prova-o, verso a verso."]]},{"nivel":2,"tipo":"julgar","rot":"Passa ou não passa","pergunta":"Quatro leituras de um colega. Quais têm prova no poema?","casos":[["O perdigão é castigado por querer subir.",true,"Passa: «Quis voar a uma alta torre, / Mas achou-se desasado»."],["O poema aconselha a queixar-se para aliviar.",false,"Não passa: queixar-se é «lançar no fogo mais lenha»."],["O tormento vem de perder a capacidade de voar.",true,"Passa: perde a pena do voar, ganha a do tormento."],["O perdigão volta a voar no fim.",false,"Não passa: «De puro penado morre»."]],"retorno":"Prova é um verso: sem verso, é palpite."},{"nivel":3,"tipo":"texto","rot":"Um perdigão de hoje","pergunta":"Descreve, em duas frases e sem nomes, alguém que quis subir alto de mais e o que perdeu. Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"Quis … Ficou sem …"}],"fontes":[["Luís de Camões, «Perdigão perdeu a pena», Obras Completas, t. III (Project Gutenberg n.º 37192)","https://www.gutenberg.org/ebooks/37192"]],"modulo":"M3","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camoes-Alma-Minha-Gentil.html","id":"camoes-alma","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M3 Camões","titulo":"Alma minha gentil","subtitulo":"Luís de Camões, soneto","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de sonetos","Seguiste o soneto do céu à terra e ao pedido final."],[0.5,"Bom começo","Já vês a quem ele fala. Repara no que pede a Deus no fim."],[0,"A entrar no soneto","Relê: o sujeito fala com quem já morreu."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><i>Alma minha gentil, que te partiste<br>Tão cedo desta vida descontente,<br>Repousa lá no céu eternamente,<br>E viva eu cá na terra sempre triste.</i></p><p><i>Se lá no assento etéreo, onde subiste,<br>Memória desta vida se consente,<br>Não te esqueças daquele amor ardente<br>Que já nos olhos meus tão puro viste.</i></p><p><i>E se vires que pode merecer-te<br>Alguma cousa a dor que me ficou<br>Da mágoa, sem remédio, de perder-te,</i></p><p><i>Roga a Deus, que teus anos encurtou,<br>Que tão cedo de cá me leve a ver-te,<br>Quão cedo de meus olhos te levou.</i></p><p class=\"nota\"><b>gentil</b> — nobre · <b>assento etéreo</b> — céu · <b>se consente</b> — é permitida · <b>roga</b> — pede</p>","links":[["Rhythmas (1595), soneto XIII (Wikisource)","https://pt.wikisource.org/wiki/Alma_minha_gentil,_que_te_partiste"]]},{"nivel":1,"tipo":"unica","rot":"A quem fala","pergunta":"A quem se dirige o sujeito?","opcoes":[["À amada que morreu: «Alma minha gentil, que te partiste»","certo","Apóstrofe a quem já não está: todo o soneto é uma fala para o céu."],["A Deus","cuidado","Pede-lhe que ela «rogue a Deus»; não fala com Deus diretamente."],["A si próprio","cuidado","«Não te esqueças», «Roga»: o «tu» é ela."]]},{"nivel":1,"tipo":"par","rot":"Céu e terra","pergunta":"Liga cada lado da antítese ao verso.","pares":[["céu","Repousa lá no céu eternamente"],["terra","E viva eu cá na terra sempre triste"],["lá","no assento etéreo, onde subiste"],["cá","Que tão cedo de cá me leve a ver-te"]],"retorno":"Lá e cá, ela e ele: o soneto vive desta separação."},{"nivel":2,"tipo":"lacuna","rot":"O paralelismo final","pergunta":"Completa os dois últimos versos.","versos":[{"antes":"Que tão ","opcoes":["cedo","longe","alto"],"depois":" de cá me leve a ver-te,"},{"antes":"Quão cedo de meus olhos te ","opcoes":["levou","tirou","roubou"],"depois":"."}],"retorno":"«Cedo» e «levar» nos dois versos: pede a Deus que o leve tão depressa como a levou."},{"nivel":2,"tipo":"unica","rot":"O pedido","pergunta":"O que pede o sujeito, no último terceto?","opcoes":[["Morrer depressa, para a voltar a ver","certo","O amor idealizado só se cumpre depois da morte."],["Esquecê-la","cuidado","Pede o contrário: que ela não se esqueça dele."],["Que ela volte à terra","cuidado","Ela fica no céu; é ele que quer ir."]]},{"nivel":3,"tipo":"texto","rot":"Lá e cá","pergunta":"Escreve dois versos sobre alguém ou algo que ficou «lá», enquanto tu ficas «cá». Até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"Lá … / cá …"}],"fontes":[["Luís de Camões, «Alma minha gentil, que te partiste», Rhythmas (1595), soneto XIII","https://pt.wikisource.org/wiki/Alma_minha_gentil,_que_te_partiste"]],"modulo":"M3","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camoes-Bicho-da-Terra.html","id":"bicho-da-terra","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M3 Os Lusíadas","titulo":"Um bicho da terra tão pequeno","subtitulo":"Luís de Camões, Os Lusíadas, I, 106 e VIII, 98","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor das reflexões","Ouviste o Poeta parar a viagem duas vezes: pelo medo e pelo dinheiro."],[0.5,"Bom começo","Já vês as duas reflexões. Repara em quem fala: não é o Gama."],[0,"A entrar no poema","Relê: a meio dos heróis, o Poeta chama-nos bichos."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><b>A</b> — Canto I, 106:</p><p><i>No mar tanta tormenta, e tanto dano,<br>Tantas vezes a morte apercebida!<br>Na terra tanta guerra, tanto engano,<br>Tanta necessidade avorrecida!<br>Onde pode acolher-se um fraco humano,<br>Onde terá segura a curta vida,<br>Que não se arme, e se indigne o Céu sereno<br>Contra um bicho da terra tão pequeno?</i></p><p><b>B</b> — Canto VIII, 98:</p><p><i>Este rende munidas fortalezas,<br>Faz tredores e falsos os amigos:<br>Este a mais nobres faz fazer vilezas,<br>E entrega Capitães aos inimigos;<br>Este corrompe virginais purezas,<br>Sem temer de honra ou fama alguns perigos:<br>Este deprava às vezes as ciências,<br>Os juízos cegando e as consciências;</i></p><p class=\"nota\"><b>apercebida</b> — à espreita · <b>avorrecida</b> — detestável · <b>rende</b> — faz render-se · <b>tredores</b> — traidores · <b>deprava</b> — corrompe</p>","links":[["Canto I, 106 (oslusiadas.org)","https://oslusiadas.org/i/106.html"],["Canto VIII, 98 (oslusiadas.org)","https://oslusiadas.org/viii/98.html"]]},{"nivel":1,"tipo":"unica","rot":"Quem fala","pergunta":"Nestas estâncias, quem fala?","opcoes":[["O Poeta, que interrompe a narrativa para julgar","certo","É uma reflexão do Poeta: um dos quatro planos de Os Lusíadas."],["Vasco da Gama","cuidado","O Gama conta a história de Portugal ao rei de Melinde; aqui é outra voz."],["Um deus","cuidado","Os deuses discutem no Olimpo; aqui fala quem escreve."]]},{"nivel":1,"tipo":"classificar","rot":"Que recurso","pergunta":"Em que estância está cada recurso?","categorias":["A · I, 106","B · VIII, 98"],"itens":[["Anáfora de «Tanta(s)»/«tanto»",0],["Anáfora de «Este…»",1],["Interrogação retórica sem resposta",0],["O dinheiro personificado, que «rende», «corrompe», «deprava»",1]],"retorno":"Duas reflexões, dois recursos: repetir para acumular; personificar para acusar."},{"nivel":2,"tipo":"unica","rot":"O bicho","pergunta":"«Contra um bicho da terra tão pequeno?» O que faz esta metáfora ao ser humano?","opcoes":[["Reduz o homem a um animal minúsculo, exposto ao Céu que se arma contra ele","certo","Depois dos heróis, a fragilidade: é a lição da reflexão."],["Faz dele um herói","cuidado","«Fraco humano», «curta vida»: nada de heroico aqui."],["Compara-o a um inseto por ser feio","cuidado","Não é a feiura: é a pequenez diante do mundo."]]},{"nivel":2,"tipo":"multi","rot":"O que o dinheiro faz","pergunta":"Segundo B, o que faz o dinheiro?","opcoes":[["Faz render fortalezas e trai amigos",5,"«rende munidas fortalezas», «Faz tredores e falsos os amigos»."],["Entrega capitães ao inimigo",5,"Sim."],["Corrompe as ciências e cega os juízos",5,"«deprava às vezes as ciências»."],["Constrói cidades",0,"Não há uma única coisa boa na lista: é uma acusação."]]},{"nivel":3,"tipo":"texto","rot":"«Este…» hoje","pergunta":"Escreve dois versos com a anáfora «Este…» sobre o que o dinheiro faz hoje, sem nomes de pessoas. Até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"Este … / Este …"}],"fontes":[["Luís de Camões, Os Lusíadas, I, 106 (oslusiadas.org)","https://oslusiadas.org/i/106.html"],["Luís de Camões, Os Lusíadas, VIII, 98 (oslusiadas.org)","https://oslusiadas.org/viii/98.html"]],"modulo":"M3","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camoes-Quem-nao-Sabe-Arte.html","id":"arte-estima","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M3 Os Lusíadas","titulo":"Quem não sabe arte, não na estima","subtitulo":"Luís de Camões, Os Lusíadas, V, 97 e VI, 95–97","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor do «Não… / Mas…»","Viste o Poeta zangado com os portugueses e a receita da glória."],[0.5,"Bom começo","Já vês a queixa. Repara na estrutura: o que não é glória, e o que é."],[0,"A entrar no poema","Relê: a glória não se herda; sofre-se."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><b>A</b> — Canto V, 97:</p><p><i>Enfim, não houve forte capitão,<br>Que não fosse também douto e ciente,<br>Da Lácia, Grega, ou Bárbara nação,<br>Senão da Portuguesa tão somente.<br>Sem vergonha o não digo, que a razão<br>De algum não ser por versos excelente,<br>É não se ver prezado o verso e rima,<br>Porque, quem não sabe arte, não na estima.</i></p><p><b>B</b> — Canto VI, 95 e 97:</p><p><i>Por meio destes hórridos perigos,<br>Destes trabalhos graves e temores,<br>Alcançam os que são de fama amigos<br>As honras imortais e graus maiores:<br>Não encostados sempre nos antigos<br>Troncos nobres de seus antecessores;<br>Não nos leitos dourados, entre os finos<br>Animais de Moscóvia zebelinos;</i></p><p>[…]</p><p><i>Mas com buscar com o seu forçoso braço<br>As honras, que ele chame próprias suas;<br>Vigiando, e vestindo o forjado aço,<br>Sofrendo tempestades e ondas cruas;</i></p><p class=\"nota\"><b>douto e ciente</b> — culto e sábio · <b>prezado</b> — estimado · <b>troncos nobres</b> — linhagens · <b>zebelinos</b> — peles de zibelina (luxo) · <b>forjado aço</b> — armadura</p>","links":[["Canto V, 97 (oslusiadas.org)","https://oslusiadas.org/v/97.html"],["Canto VI, 95 (oslusiadas.org)","https://oslusiadas.org/vi/95.html"]]},{"nivel":1,"tipo":"unica","rot":"A queixa","pergunta":"Em A, de que se queixa o Poeta?","opcoes":[["De que só os capitães portugueses não são cultos, porque em Portugal não se estima a poesia","certo","«Senão da Portuguesa tão somente»: a exceção é a pátria dele."],["De que os capitães estrangeiros são maus","cuidado","Pelo contrário: todos os outros eram «doutos»."],["De que ninguém lê o poema dele","cuidado","Fala dos capitães e da arte em geral; a queixa pessoal vem no canto X."]]},{"nivel":1,"tipo":"classificar","rot":"Não… / Mas…","pergunta":"Cada expressão de B é o que não dá glória ou o que dá?","categorias":["Não dá glória","Dá glória"],"itens":[["encostados nos antigos troncos nobres",0],["nos leitos dourados, entre os finos animais de Moscóvia",0],["buscar com o seu forçoso braço as honras",1],["Sofrendo tempestades e ondas cruas",1]],"retorno":"A herança e o luxo, não; o esforço e o sofrimento, sim: é a estrutura «Não… / Mas…»."},{"nivel":2,"tipo":"unica","rot":"Sem vergonha","pergunta":"«Sem vergonha o não digo»: porque diz isto o Poeta?","opcoes":[["Porque lhe custa dizer mal da pátria, mas di-lo na mesma","certo","Franqueza com vergonha: a crítica é sincera."],["Porque não tem vergonha de nada","cuidado","«Sem vergonha o não digo» quer dizer: não o digo sem vergonha; tenho-a."],["Porque está a brincar","cuidado","A reflexão é séria: é a queixa que volta em X, 145."]]},{"nivel":2,"tipo":"unica","rot":"Honras próprias","pergunta":"«As honras, que ele chame próprias suas»: que honras são estas?","opcoes":[["As que se conquistam, não as que se herdam","certo","Ser filho de alguém não é uma obra; a glória tem de ser «própria»."],["As que o rei dá","cuidado","Não vêm de cima: vêm do «forçoso braço»."],["As que a Fortuna dá","cuidado","A Fortuna dá apetites «mimosos»; a honra dá trabalho."]]},{"nivel":3,"tipo":"texto","rot":"Herdada ou conquistada","pergunta":"Dá um exemplo do teu curso, sem nomes, de glória herdada e outro de glória conquistada. Duas frases, até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"Herdada: … Conquistada: …"}],"fontes":[["Luís de Camões, Os Lusíadas, V, 97 (oslusiadas.org)","https://oslusiadas.org/v/97.html"],["Luís de Camões, Os Lusíadas, VI, 95–97 (oslusiadas.org)","https://oslusiadas.org/vi/95.html"]],"modulo":"M3","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camoes-Quatro-Desconcertos.html","id":"camoes-desconcerto","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M3 Camões","titulo":"O mundo todo abarco e nada aperto","subtitulo":"Luís de Camões, «Tanto de meu estado me acho incerto» e «Erros meus, má fortuna, amor ardente»","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de contrários","Viste as figuras do contrário a dizer o que o sujeito não consegue dizer de outra maneira."],[0.5,"Bom começo","Já vês os contrários. Repara na resposta final: não sei, mas suspeito."],[0,"A entrar nos sonetos","Relê: choro e rio ao mesmo tempo, não um dia sim e outro não."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><b>D</b> — «Tanto de meu estado me acho incerto»:</p><p><i>Tanto de meu estado me acho incerto,<br>Que em vivo ardor tremendo estou de frio;<br>Sem causa, juntamente choro e rio;<br>O mundo todo abarco e nada aperto.</i></p><p><i>É tudo quanto sinto um desconcerto;<br>Da alma um fogo me sai, da vista um rio;<br>Agora espero, agora desconfio,<br>Agora desvario, agora acerto.</i></p><p>[…]</p><p><i>Se me pergunta alguém porque assim ando,<br>Respondo que não sei; porém suspeito<br>Que só porque vos vi, minha senhora.</i></p><p><b>C</b> — «Erros meus, má fortuna, amor ardente»:</p><p><i>Erros meus, má fortuna, amor ardente<br>Em minha perdição se conjuraram;<br>Os erros e a fortuna sobejaram,<br>Que para mim bastava amor somente.</i></p><p class=\"nota\"><b>desconcerto</b> — desordem, falta de harmonia · <b>sobejaram</b> — foram demais</p>","links":[["Obras Completas, t. II (Project Gutenberg n.º 31509)","https://www.gutenberg.org/ebooks/31509"]]},{"nivel":1,"tipo":"classificar","rot":"Que figura","pergunta":"Que figura está em cada verso?","categorias":["Antítese","Paradoxo","Anáfora","Enumeração"],"itens":[["Sem causa, juntamente choro e rio",0],["O mundo todo abarco e nada aperto",1],["Agora espero, agora desconfio, / Agora desvario, agora acerto",2],["Erros meus, má fortuna, amor ardente",3]],"retorno":"Opor, contradizer, repetir, acumular: quatro maneiras de dizer o desconcerto."},{"nivel":1,"tipo":"unica","rot":"Ao mesmo tempo","pergunta":"«Que em vivo ardor tremendo estou de frio»: o que tem de especial este contrário?","opcoes":[["Os dois estados são verdadeiros ao mesmo tempo, não alternados","certo","Não é «ora quente, ora frio»: é arder e tremer de frio no mesmo instante."],["Descreve uma febre","cuidado","Não é doença: é o estado de quem ama."],["É um erro do poeta","cuidado","É a figura do contrário, de propósito."]]},{"nivel":2,"tipo":"unica","rot":"A resposta","pergunta":"«Respondo que não sei; porém suspeito / Que só porque vos vi, minha senhora.» A resposta explica o desconcerto?","opcoes":[["Explica e não explica: diz a causa, mas em tom de dúvida","certo","«Não sei», «suspeito»: a explicação chega sem certeza, e o desconcerto continua."],["Explica tudo","cuidado","«Suspeito» não é «sei»."],["Não responde","cuidado","Responde: «só porque vos vi»."]]},{"nivel":2,"tipo":"unica","rot":"Três culpados","pergunta":"Em C, quem são os culpados da «perdição», e qual bastava sozinho?","opcoes":[["Os erros, a má fortuna e o amor; bastava o amor","certo","«Que para mim bastava amor somente»: os outros dois «sobejaram»."],["Só os erros","cuidado","São três que «se conjuraram»."],["A má fortuna, sozinha","cuidado","A fortuna foi excesso; o amor chegava."]]},{"nivel":3,"tipo":"texto","rot":"O teu desconcerto","pergunta":"Escreve um par de contrários que sejam verdadeiros ao mesmo tempo num estado teu, à maneira de «choro e rio». Uma frase, até 20 palavras.","minPalavras":4,"maxPalavras":20,"placeholder":"… e …, ao mesmo tempo."}],"fontes":[["Luís de Camões, sonetos, Obras Completas, t. II (Project Gutenberg n.º 31509)","https://www.gutenberg.org/ebooks/31509"]],"modulo":"M3","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camoes-Sobolos-Rios.html","id":"camoes-sobolos","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M3 Camões","titulo":"Sôbolos rios que vão","subtitulo":"Luís de Camões, redondilhas (as três primeiras estrofes)","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor das duas margens","Viste Babilónia e Sião, o presente e a memória, e o que a memória faz."],[0.5,"Bom começo","Já vês os dois lugares. Repara no que o sujeito descobre ao acordar."],[0,"À beira do rio","Relê devagar: versos curtos para um assunto pesado."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><i>Sôbolos rios que vão<br>por Babilónia, me achei,<br>onde sentado chorei<br>as lembranças de Sião<br>e quanto nela passei.</i></p><p><i>Ali o rio corrente<br>de meus olhos foi manado,<br>e tudo bem comparado,<br>Babilónia ao mal presente,<br>Sião ao tempo passado.</i></p><p><i>Ali lembranças contentes<br>n'alma se representaram;<br>e minhas cousas ausentes<br>se fizeram tão presentes,<br>como se nunca passaram.<br>Ali, despois d'acordado,<br>co'o rosto banhado em água,<br>deste sonho imaginado,<br>vi que todo o bem passado<br>não é gosto, mas é mágoa.</i></p><p class=\"nota\"><b>sôbolos</b> — sobre os · <b>manado</b> — que correu · <b>Babilónia</b> — o lugar do desterro · <b>Sião</b> — a terra de origem · <b>despois d'acordado</b> — depois de acordado</p>","links":[["Obras Completas, t. III (Project Gutenberg n.º 37192)","https://www.gutenberg.org/ebooks/37192"]]},{"nivel":1,"tipo":"par","rot":"Duas margens","pergunta":"Liga cada lugar ao que representa.","pares":[["Babilónia","o mal presente, o desterro"],["Sião","o tempo passado, a pátria"],["o rio corrente de meus olhos","o choro"],["as cousas ausentes","o que ficou para trás"]],"retorno":"Dois lugares, dois tempos: o poema inteiro é esta comparação."},{"nivel":1,"tipo":"unica","rot":"Porque chora","pergunta":"O sujeito chora por causa do lugar onde está ou do lugar de onde veio?","opcoes":[["Do lugar de onde veio: chora «as lembranças de Sião»","certo","A dor vem da memória, não só do desterro."],["Do lugar onde está","cuidado","Babilónia é o «mal presente», mas o choro é pelas lembranças."],["Não chora: só pensa","cuidado","«o rio corrente / de meus olhos foi manado»: chora, e muito."]]},{"nivel":2,"tipo":"unica","rot":"O sonho","pergunta":"«vi que todo o bem passado / não é gosto, mas é mágoa.» O que descobre o sujeito ao acordar?","opcoes":[["Que lembrar o bem que passou não consola: dói","certo","As «lembranças contentes» pareceram presentes; ao acordar, só resta a mágoa."],["Que o passado foi mau","cuidado","O passado foi bom («o bem passado»); é lembrá-lo que magoa."],["Que vai voltar a Sião","cuidado","Não há regresso no poema: há memória."]]},{"nivel":2,"tipo":"lacuna","rot":"A palavra de Camões","pergunta":"Completa com a palavra do poema.","versos":[{"antes":"Babilónia ao mal ","opcoes":["presente","passado","futuro"],"depois":","},{"antes":"não é gosto, mas é ","opcoes":["mágoa","saudade","alegria"],"depois":"."}],"retorno":"Presente e mágoa: o sítio onde se está e o que a memória faz."},{"nivel":3,"tipo":"texto","rot":"A tua Babilónia","pergunta":"Escreve um par «lugar presente / lugar da memória» que seja teu, numa frase. Até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"Presente: …; memória: …"}],"fontes":[["Luís de Camões, «Sôbolos rios que vão», Obras Completas, t. III (Project Gutenberg n.º 37192)","https://www.gutenberg.org/ebooks/37192"]],"modulo":"M3","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camoes-A-Espada-e-a-Pena.html","id":"espada-pena","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M3 Os Lusíadas","titulo":"Numa mão sempre a espada, e noutra a pena","subtitulo":"Luís de Camões, Os Lusíadas, VII, 78–79 e IX, 92","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor do Poeta","Ouviste a queixa pessoal e o apelo ao leitor, e sabes o que os liga."],[0.5,"Bom começo","Já vês o batel. Repara em quem o Poeta acorda no canto IX."],[0,"A entrar no poema","Relê: o Poeta pede ajuda para acabar o que está a escrever."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><b>A</b> — a segunda invocação (canto VII, 78–79):</p><p><i>Vosso favor invoco, que navego<br>Por alto mar, com vento tão contrário,<br>Que, se não me ajudais, hei grande medo<br>Que o meu fraco batel se alague cedo.</i></p><p><i>Olhai que há tanto tempo que, cantando<br>O vosso Tejo e os vossos Lusitanos,<br>A fortuna mo traz peregrinando,<br>Novos trabalhos vendo, e novos danos:<br>Agora o mar, agora experimentando<br>Os perigos Mavórcios inumanos,<br>Qual Canace, que à morte se condena,<br>Numa mão sempre a espada, e noutra a pena.</i></p><p><b>B</b> — o apelo (canto IX, 92):</p><p><i>Por isso, ó vós que as famas estimais,<br>Se quiserdes no mundo ser tamanhos,<br>Despertai já do sono do ócio ignavo,<br>Que o ânimo, de livre, faz escravo.</i></p><p class=\"nota\"><b>batel</b> — barco pequeno · <b>peregrinando</b> — andando errante · <b>Mavórcios</b> — da guerra · <b>Canace</b> — figura mitológica que escreveu uma carta antes de morrer · <b>ócio ignavo</b> — preguiça</p>","links":[["Canto VII, 78 (oslusiadas.org)","https://oslusiadas.org/vii/78.html"],["Canto IX, 92 (oslusiadas.org)","https://oslusiadas.org/ix/92.html"]]},{"nivel":1,"tipo":"unica","rot":"O batel","pergunta":"«hei grande medo / Que o meu fraco batel se alague cedo.» De que fala o Poeta?","opcoes":[["Do próprio poema: uma travessia arriscada que pode não chegar ao fim","certo","O b "},{"pasta":"Ler-a-fundo","ficheiro":"Jorge-Palma-Na-Palma-da-Mao.html","id":"palma-vida","cor":"#6b4fa0","corEscura":"#b9a3e6","marca":"Ler a fundo · 5 min · canção portuguesa","titulo":"Na palma da mão","subtitulo":"Jorge Palma (1950–2026): uma vida em canções","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Ouvinte com memória","Sabes de onde vêm estas canções: do piano, da rua e de uma recusa."],[0.5,"Bom começo","Já tens a ordem da vida. Repara no que ele fez com as duas formações."],[0,"A começar a ouvir","Relê a cronologia devagar: piano aos seis, rua aos vinte e sete, coliseus depois."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler e ouvir","html":"<p><b>Jorge Palma</b> (Lisboa, 4 de junho de 1950 – 21 de setembro de 2026): músico, cantor e letrista. Piano aos seis anos, Conservatório aos oito; na adolescência, o rock'n'roll e a guitarra. Teclista dos Sindicato (1969–1971). Em setembro de 1973 recusou o serviço militar e a Guerra do Ultramar e partiu para a Dinamarca, com asilo político. Voltou depois do 25 de Abril; gravou o primeiro álbum em 1975. Entre 1977 e 1981 cantou na rua e nos transportes, sobretudo em Paris: Brel, Dylan, Cohen. Depois vieram os álbuns O Lado Errado da Noite (1985), Bairro do Amor (1989), Só (1991), Voo Nocturno (2007) e, em 2024, o palco com os dois filhos.</p><p><b>Ouve uma canção dele até ao fim</b> («Deixa-me Rir», «Frágil» ou «Encosta-te a Mim») e volta aqui.</p>","links":[["Ouvir no Spotify","https://open.spotify.com/search/Jorge%20Palma"],["A vida, na Wikipédia","https://pt.wikipedia.org/wiki/Jorge_Palma"]],"nota":"As letras estão protegidas por direitos de autor: ouve-as na plataforma oficial."},{"nivel":1,"tipo":"ordenar","rot":"Uma vida por ordem","pergunta":"Põe por ordem os momentos da vida de Jorge Palma.","itens":["A mãe inscreve-o no piano, aos seis anos","Teclista dos Sindicato, no primeiro Vilar de Mouros","Recusa a guerra e recebe asilo na Dinamarca","Quatro anos era qual.</i></p><p class=\"nota\">Tradução nossa do inglês; o original está em domínio público na União Europeia. Garganta — o porco que fala pelos outros (Squealer, no original) · <b>Napoleão</b> — o porco que governa</p>","links":[["Ler o original em inglês (Project Gutenberg Australia)","https://gutenberg.net.au/ebooks01/0100011h.html"]]},{"nivel":1,"tipo":"ordenar","rot":"O que aconteceu","pergunta":"Põe por ordem o caminho dos sete mandamentos até ao último.","itens":["O velho Major conta o sonho de uma quinta sem homens","Os animais expulsam o Sr. Jones","Os porcos escrevem os sete mandamentos na parede","Napoleão expulsa Bola-de-Neve com os cães","Boxer, o cavalo que mais trabalhou, é vendido ao matadouro","Os porcos andam sobre duas pernas e sobra um mandamento"],"retorno":"Do sonho à parede, e da parede a uma frase só."},{"nivel":1,"tipo":"unica","rot":"Com lençóis","pergunta":"«Nenhum animal dormirá numa cama» passa a «Nenhum animal dormirá numa cama com lençóis». O que muda?","opcoes":[["Acrescenta-se uma condição que deixa passar o que a regra proibia","certo","Sim. A regra continua na parede e já não proíbe nada: os porcos dormem em camas, sem lençóis."],["Corrige-se um erro de ortografia","cuidado","Não há erro: há uma cláusula nova, escrita por quem quer dormir na cama."],["A regra torna-se mais dura","cuidado","Torna-se mais fraca: proíbe menos do que antes."]]},{"nivel":2,"tipo":"multi","rot":"A voz de Garganta","pergunta":"Garganta convence os animais de que o leite e as maçãs são só para os porcos. Toca no que ele usa.","opcoes":[["Uma ciência que ninguém pode verificar («isto está provado pela Ciência»)",5,"Sim: autoridade sem prova."],["O medo do regresso do dono («O Jones voltava!»)",5,"Sim: a ameaça fecha a discussão."],["Um sacrifício fingido («muitos de nós até não gostam de leite»)",5,"Sim: o privilégio vestido de dever."],["Números e contas abertas a todos",0,"Não há números: há afirmações. É por isso que funciona."]]},{"nivel":2,"tipo":"
