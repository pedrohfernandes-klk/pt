# 03/11/2026: cabeçalho sobre F0 publicada, mantendo reversão e asserções.
# 03/11/2026: desfazer primeiro a camada visual do cabecalho, com as mesmas assercoes.
# 01/11/2026: desfazer a camada dos índices antes dos contratos históricos.
name: Português, texto corrido justificado
# 30/10/2026: texto corrido justificado, com hifenização em português europeu (decisão do docente). A regra está no fim
# de assets/appearance.css (mais uma linha em cada ficheiro de estilo dos painéis de notas, assets/pt-lessons/notes.css e
# m9/recursos/notas.css); as classes «prosa» e «verso» entram por uma camada literal
# (tests/fixtures/texto-justificado-edits-20261030.json), desfeita antes das outras nos testes de estado congelado.
# 12/11/2026: as duas tarefas do M3 mais fáceis de fazer e «tudo junto» no M3, a camada tarefas_faceis_m3_20261112 (passa a ser a mais recente: desfaz-se primeiro nas cadeias deste fluxo).
# 13/11/2026: as duas tarefas do M1 mais fáceis de fazer e «tudo junto» no M1, a camada tarefas_faceis_m1_20261113 (passa a ser a mais recente: desfaz-se primeiro nas cadeias deste fluxo).
on:
  pull_request:
    paths:
      - 'assets/appearance.css'
      - 'm9/recursos/notas.css'
      - 'assets/pt-lessons/notes.css'
      - 'scripts/texto_justificado_20261030.json'
      - 'tests/fixtures/texto-justificado-edits-20261030.json'
      - 'tests/auditoria_20261028.py'
      - 'tests/test_task_routes_closure.py'
      - 'tests/*texto_justificado*'
      - '.github/workflows/pt-texto-qa.yml'
      # 30/10/2026 (revisão): também as páginas (a camada põe as classes «prosa» e «verso» e o lang nas páginas; uma página
      # gerada de novo sem elas tem de falhar aqui), os dados de cartões em .js e os motores que geram a explicação, o
      # retorno, as ligações e as sessões do exame
      - '**/index.html'
      - 'm*/recursos/*.js'
      - 'assets/pt-lessons/*.js'
      - 'assets/appearance.js'
      - 'assets/exame/app.js'
permissions:
  contents: read
jobs:
  texto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regra comum, famílias de páginas, camada literal e estados congelados
        run: |
          python -m unittest discover -s tests -p 'test_texto_justificado.py' -v
          python -m unittest discover -s tests -p 'test_task_routes_closure.py' -v
          python -m unittest discover -s tests -p 'test_appearance_universal.py' -v
          # 30/10/2026: a camada das opções denunciadoras foi aplicada por cima desta; desfaz-se antes de conferir.
          # 01/11/2026: desfazer primeiro a camada das tarefas M8/M9.
          # 01/11/2026: desfaz primeiro a camada das sete lições novas.
          # 01/11/2026: desfaz antes a camada do pedido B.
          # 02/11/2026: desfaz antes de tudo a varredura, a calçada e as tarefas individuais (as mais recentes).
          # 03/11/2026: desfaz o piloto M4 e F0 antes dos créditos publicados e do lote 2.
          # 05/11/2026: a tabela dos seis movimentos desfaz-se antes da revisão de 5/11.
          # 05/11/2026: o Laboratório do exame (lição, não «leitura de apoio») é a camada mais recente; desfaz-se antes da tabela dos seis movimentos.
          # 05/11/2026: o contexto de cada sessão do Laboratório do exame (lição e excerto, não «recorte») é a camada mais recente; desfaz-se antes da ligação e das notas do Laboratório do exame.
          # 05/11/2026: a decisão 154 (os exercícios fazem-se sozinho; nada no texto do aluno depende do docente) é a camada mais recente; desfaz-se antes do contexto do Laboratório do exame, com a mesma exigência.
          # 06/11/2026: o desenho comum dos nove índices (decisão 148) é a camada mais recente, por cima dos créditos atrás de um «i»; desfaz-se primeiro, com a mesma exigência.
          # 07/11/2026: os três acertos dos índices deixados pela decisão 173 são a camada mais recente, por cima do desenho comum dos nove índices; desfazem-se primeiro, com a mesma exigência.
          # 07/11/2026 (fusão do main 29441e6b no pedido #182): a decisão 152 no M1 (cuidado_m1_20261106) passa a camada mais recente, por cima dos acertos da decisão 173; desfaz-se primeiro, com a mesma exigência.
          # 07/11/2026: os créditos atrás de um «i» na entrada, nos índices e no Atlas (creditos_i_pt1_20261107, pedido pt-1) passam a camada mais recente, por cima da decisão 152 no M1; desfazem-se primeiro, com a mesma exigência.
          # 08/11/2026: o cartaz «Ler a cidade» na entrada e o nome novo da secção nas páginas publicadas (cidade_cartaz_20261108, que também muda a frase da sugestão «continua» das lições e dos índices) passam a camada mais recente, por cima dos créditos atrás de um «i» do pedido pt-1; desfazem-se primeiro, com a mesma exigência.
          # 08/11/2026: a decisão 152 no M2 (cuidado_m2_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M2, incluindo o índice do módulo) passa a camada mais recente, por cima do cartaz «Ler a cidade» e do nome novo da secção; desfaz-se primeiro, com a mesma exigência.
          # 08/11/2026: a decisão 152 no M3 (cuidado_m3_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M3, incluindo o índice, o guia e o mapa do módulo) passa a camada mais recente, por cima da decisão 152 no M2; desfaz-se primeiro, com a mesma exigência.
          # 08/11/2026: a decisão 152 no M4 (cuidado_m4_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M4, incluindo o índice, o guia, o mapa e o portefólio do módulo) passa a camada mais recente, por cima da decisão 152 no M3; desfaz-se primeiro, com a mesma exigência.
          # 08/11/2026: a decisão 152 no M5 (cuidado_m5_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M5, incluindo o índice, o guia, o mapa e o portefólio do módulo, e nas tarefas, nos aquecimentos e nas grelhas das suas unidades) passa a camada mais recente, por cima da decisão 152 no M4; desfaz-se primeiro, com a mesma exigência.
          # 08/11/2026: a decisão 152 no M6 (cuidado_m6_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M6, incluindo o índice, o guia, o mapa e o portefólio do módulo, as páginas «Ler a fundo» e «Pensar devagar», e nas tarefas, nos aquecimentos e nas grelhas das suas unidades) passa a camada mais recente, por cima da decisão 152 no M5; desfaz-se primeiro, com a mesma exigência.
          # 11/11/2026 (fusão do main 4bf4a053 no pedido #191): a revisão dos enunciados das tarefas (tarefas_claras_20261110, #192) fica entre a decisão 152 no M6, que continua a mais recente e se desfaz primeiro, e a decisão 152 no M5.
          # 11/11/2026: a decisão 152 no M7 (cuidado_m7_20261111: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M7, incluindo o índice, o guia, o mapa e o portefólio do módulo, as páginas «Ler a fundo», «Olhar» e «Pensar devagar», e nas tarefas, nos aquecimentos e na grelha das suas unidades) passa a camada mais recente, por cima da decisão 152 no M6; desfaz-se primeiro, com a mesma exigência.
          # 12/11/2026: a decisão 152 no M8 (cuidado_m8_20261112: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M8, incluindo o índice, o guia, o mapa e o portefólio do módulo, as atividades de gramática e de escrita e as tarefas das suas unidades) passa a camada mais recente, por cima da decisão 152 no M7; desfaz-se primeiro, com a mesma exigência.
          # 12/11/2026: a decisão 152 no M9 (cuidado_m9_20261112: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M9, incluindo o índice, o guia, o mapa e o portefólio do módulo, as páginas «Ler a fundo» e «Pensar devagar», as atividades e as tarefas das suas unidades) passa a camada mais recente, por cima da decisão 152 no M8; desfaz-se primeiro, com a mesma exigência.
          # 12/11/2026: a decisão 152 no Exame e nas páginas transversais (cuidado_exame_20261112: uma tabela onde havia itens paralelos e espaços que não quebram nas sessões, no laboratório, nas provas em cartões e nos aquecimentos do Exame, nas obras, nas páginas dos anos, no mapa e na entrada) passa a camada mais recente, por cima da decisão 152 no M9; desfaz-se primeiro, com a mesma exigência.
          # 12/11/2026: a ligação «Treinos» na página principal do Exame (exame_ligacao_treinos_20261112: só a navegação de exame/index.html) passa a camada mais recente, por cima da decisão 152 no Exame e nas páginas transversais; desfaz-se primeiro, com a mesma exigência, sem nada pelo meio.
          # 12/11/2026: as provas em cartões com os documentos oficiais (exame_provas_oficial_20261112: a secção exame/provas/, as seis lições das provas de 2026 e os seus dados) passam a camada mais recente, por cima da ligação «Treinos» na página principal do Exame; desfaz-se primeiro, com a mesma exigência, sem nada pelo meio.
          python scripts/aplicar_trocas.py scripts/texto_justificado_20261030.json --manifesto tests/fixtures/texto-justificado-edits-20261030.json --verificar --desfazer-antes tests/fixtures/tarefas-faceis-m1-edits-20261113.json --desfazer-antes tests/fixtures/tarefas-faceis-m3-edits-20261112.json --desfazer-antes tests/fixtures/exame-provas-oficial-edits-20261112.json --desfazer-antes tests/fixtures/exame-ligacao-treinos-edits-20261112.json --desfazer-antes tests/fixtures/cuidado-exame-edits-20261112.json --desfazer-antes tests/fixtures/cuidado-m9-edits-20261112.json --desfazer-antes tests/fixtures/cuidado-m8-edits-20261112.json --desfazer-antes tests/fixtures/cuidado-m7-edits-20261111.json --desfazer-antes tests/fixtures/cuidado-m6-edits-20261108.json --desfazer-antes tests/fixtures/tarefas-claras-edits-20261110.json --desfazer-antes tests/fixtures/cuidado-m5-edits-20261108.json --desfazer-antes tests/fixtures/cuidado-m4-edits-20261108.json --desfazer-antes tests/fixtures/cuidado-m3-edits-20261108.json --desfazer-antes tests/fixtures/cuidado-m2-edits-20261108.json --desfazer-antes tests/fixtures/cidade-cartaz-edits-20261108.json --desfazer-antes tests/fixtures/creditos-i-pt1-edits-20261107.json --desfazer-antes tests/fixtures/cuidado-m1-edits-20261106.json --desfazer-antes tests/fixtures/indices-acertos-edits-20261107.json --desfazer-antes tests/fixtures/cartaz-indices-148-edits-20261106.json --desfazer-antes tests/fixtures/creditos-i-edits-20261105.json --desfazer-antes tests/fixtures/atlas-lote3-edits-20261105.json --desfazer-antes tests/fixtures/autonomia-154-edits-20261105.json --desfazer-antes tests/fixtures/exame-contexto-edits-20261105.json --desfazer-antes tests/fixtures/exame-licao-edits-20261105.json --desfazer-antes tests/fixtures/tabela-movimentos-edits-20261105.json --desfazer-antes tests/fixtures/revisao-edits-20261105.json --desfazer-antes tests/fixtures/cartaz-cabecalho-edits-20261103.json --desfazer-antes tests/fixtures/cartaz-m4-piloto-edits-20261102.json --desfazer-antes tests/fixtures/variedade-f0-edits-20261102.json --desfazer-antes tests/fixtures/creditos-grafismos-ia-edits-20261102.json --desfazer-antes tests/fixtures/conteudos-lote2-edits-20261101.json --desfazer-antes tests/fixtures/varredura-formatacao-edits-20261101.json --desfazer-antes tests/fixtures/calcada-mar-edits-20261102.json --desfazer-antes tests/fixtures/tarefas-individuais-edits-20261102.json --desfazer-antes tests/fixtures/cartaz-indices-edits-20261101.json --desfazer-antes tests/fixtures/licoes-m16-edits-20261101.json --desfazer-antes tests/fixtures/licoes-m89-edits-20261101.json --desfazer-antes tests/fixtures/tarefas-m89-edits-20261101.json --desfazer-antes tests/fixtures/tarefas-m356-edits-20261031.json --desfazer-antes tests/fixtures/lingua-pessoa-m7-edits-20261030.json --desfazer-antes tests/fixtures/opcoes-denunciadoras-edits-20261030.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tema comum (appearance.css e appearance.js)
        run: node --test tests/appearance.test.cjs
      - name: Instalar Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Uma página de cada família a 390 e 1366 px (justificado) e a 320 e 300 px (à esquerda)
        run: python tests/browser_texto_justificado.py
