name: Português — apoios legíveis
on:
  pull_request:
    paths:
      - 'm7/licao-m7-f15/**'
      # 05/11/2026: a tabela dos seis movimentos (M7-F10) e os intervalos de versos.
      - 'm7/licao-m7-f10/**'
      - 'm1/licao-m1-f02/**'
      - 'm1/licao-m1-f19/**'
      - 'tests/test_tabela_movimentos.py'
      - 'tests/fixtures/tabela-movimentos-*'
      - 'scripts/tabela_movimentos_*'
      - 'assets/pt-lessons/apoios-tabelas.css'
      # 06/11/2026: decisão 152 no M1: as tabelas novas (lições, índice, guia, tarefas, «Ler a fundo») e a sua camada.
      - 'm1/**'
      - 'tarefas/m1-u1/**'
      - 'tarefas/m1-u2/**'
      - 'scripts/cuidado_m1_20261106.*'
      - 'tests/fixtures/cuidado-m1-edits-20261106.json'
      - 'tests/*cuidado_m1*'
      # 08/11/2026: decisão 152 no M2: as tabelas novas (lições F02, F06, F07 e F09 e a página «Pensar devagar» A máquina de rir) e a sua camada.
      - 'm2/**'
      - 'tarefas/m2-u1/**'
      - 'tarefas/m2-u2/**'
      - 'scripts/cuidado_m2_20261108.*'
      - 'tests/fixtures/cuidado-m2-edits-20261108.json'
      - 'tests/*cuidado_m2*'
      - 'tests/*apoios*'
      - 'tests/fixtures/apoios-*'
      - '.github/workflows/pt-apoios-qa.yml'
permissions:
  contents: read
jobs:
  tables:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirmar tabela, conteúdo e chaves preservados
        run: python -m unittest discover -s tests -p 'test_apoios_tabelas.py' -v
      # 05/11/2026: pedido do docente, os seis movimentos numa tabela; a camada confere-se por cima da revisão de 5/11.
      - name: Tabela dos seis movimentos e intervalos de versos
        run: |
          python -m unittest discover -s tests -p 'test_tabela_movimentos.py' -v
          # 05/11/2026: o Laboratório do exame (lição, não «leitura de apoio») é a camada mais recente; desfaz-se antes da tabela dos seis movimentos.
          # 05/11/2026: o contexto de cada sessão do Laboratório do exame (lição e excerto, não «recorte») é a camada mais recente; desfaz-se antes da ligação e das notas do Laboratório do exame.
          # 05/11/2026: a decisão 154 (os exercícios fazem-se sozinho; nada no texto do aluno depende do docente) é a camada mais recente; desfaz-se antes do contexto do Laboratório do exame, com a mesma exigência.
          # 06/11/2026: o desenho comum dos nove índices (decisão 148) é a camada mais recente, por cima dos créditos atrás de um «i»; desfaz-se primeiro, com a mesma exigência.
          # 07/11/2026: os três acertos dos índices deixados pela decisão 173 são a camada mais recente, por cima do desenho comum dos nove índices; desfazem-se primeiro, com a mesma exigência.
          # 07/11/2026 (fusão do main 29441e6b no pedido #182): a decisão 152 no M1 (cuidado_m1_20261106) passa a camada mais recente, por cima dos acertos da decisão 173; desfaz-se primeiro, com a mesma exigência.
          # 07/11/2026: os créditos atrás de um «i» na entrada, nos índices e no Atlas (creditos_i_pt1_20261107, pedido pt-1) passam a camada mais recente, por cima da decisão 152 no M1; desfazem-se primeiro, com a mesma exigência.
          # 08/11/2026: o cartaz «Ler a cidade» na entrada e o nome novo da secção nas páginas publicadas (cidade_cartaz_20261108, que também muda a frase da sugestão «continua» das lições e dos índices) passam a camada mais recente, por cima dos créditos atrás de um «i» do pedido pt-1; desfazem-se primeiro, com a mesma exigência.
          # 08/11/2026: a decisão 152 no M2 (cuidado_m2_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M2, incluindo o índice do módulo) passa a camada mais recente, por cima do cartaz «Ler a cidade» e do nome novo da secção; desfaz-se primeiro, com a mesma exigência.
          python scripts/aplicar_trocas.py scripts/tabela_movimentos_20261105.json --manifesto tests/fixtures/tabela-movimentos-edits-20261105.json --verificar --desfazer-antes tests/fixtures/cuidado-m2-edits-20261108.json --desfazer-antes tests/fixtures/cidade-cartaz-edits-20261108.json --desfazer-antes tests/fixtures/creditos-i-pt1-edits-20261107.json --desfazer-antes tests/fixtures/cuidado-m1-edits-20261106.json --desfazer-antes tests/fixtures/indices-acertos-edits-20261107.json --desfazer-antes tests/fixtures/cartaz-indices-148-edits-20261106.json --desfazer-antes tests/fixtures/creditos-i-edits-20261105.json --desfazer-antes tests/fixtures/atlas-lote3-edits-20261105.json --desfazer-antes tests/fixtures/autonomia-154-edits-20261105.json --desfazer-antes tests/fixtures/exame-contexto-edits-20261105.json --desfazer-antes tests/fixtures/exame-licao-edits-20261105.json
          python scripts/verificar_camadas.py
      # 06/11/2026: decisão 152 no M1: as tabelas novas, os espaços que não quebram e a camada no topo.
      - name: Tabelas e referências do M1 (decisão 152)
        run: python -m unittest discover -s tests -p 'test_cuidado_m1.py' -v
      # 08/11/2026: decisão 152 no M2: as tabelas novas, os casos do mesmo tipo, os espaços que não quebram e a camada no topo.
      - name: Tabelas e referências do M2 (decisão 152)
        run: python -m unittest discover -s tests -p 'test_cuidado_m2.py' -v
      - name: Instalar Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verificar tabela, revisão e projeção
        run: python tests/browser_apoios_tabelas.py
      # 06/11/2026: decisão 152 no M1: as tabelas novas a 320, 390 e 1366 px, sem deslizar para o lado, também no cartão escuro.
      - name: Tabelas novas do M1 no navegador
        run: python tests/browser_cuidado_m1.py
      # 08/11/2026: decisão 152 no M2: as tabelas novas e a lista dos ficheiros do portefólio a 360 e 900 px, nos dois temas, sem
      # transbordar (no telemóvel, empilhadas e com o rótulo da coluna), e as referências do M2 sem se partirem.
      - name: Tabelas e referências do M2 no navegador
        run: python tests/browser_cuidado_m2.py
