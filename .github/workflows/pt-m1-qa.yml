name: Português — inventário e regressão M1–M9
on:
  pull_request:
    paths:
      - 'm[1-9]/**'
      - 'assets/pt-lessons/**'
      - 'assets/exame/**'
      - 'exame/**'
      - 'assets/unit-*.js'
      - 'assets/unit-*.css'
      - 'scripts/audit_*.py'
      - 'tests/**'
      - 'docs/pedagogia/**'
      - '.github/workflows/pt-m1-qa.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testar bancos, regressões e continuidade
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/audit_cards.py
          python scripts/audit_lessons.py
          python scripts/audit_learning_progression.py
          node tests/jogo-rotacao.cjs
          node tests/m2-f07-migration.cjs
          node tests/m2-f06-migration.cjs
          node tests/exame-catalogo.cjs
          node tests/exame-dossie.cjs
      - name: Instalar Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verificar as 108 entradas e os percursos prioritários
        run: |
          python tests/browser_m1_and_inventory.py
          python tests/browser_context_feedback.py
          python tests/browser_unit_routes.py
          python tests/browser_unit_support.py
          python tests/browser_unit_synthesis.py
          python tests/browser_exame_cache.py
          python tests/browser_exame_alignment.py
          python tests/browser_jogabilidade.py
          python tests/browser_ux06_pt.py
          python tests/browser_m5_adaptacao.py
          python tests/browser_m8_comparacao.py
          python tests/browser_m6_forma.py
          python tests/browser_m7_pilot.py
          python tests/browser_m2_balance.py
          python tests/browser_revision_activities.py
          python tests/browser_revision_activities.py --lessons 06,11
          python tests/browser_revision_activities.py --module m7 --lessons 14,15
