name: Português, fio do ano
on:
  pull_request:
    paths:
      - '1/**'
      - 'm1/index.html'
      - 'm2/index.html'
      - 'm3/index.html'
      - 'scripts/fio_do_ano_20261101.json'
      - 'tests/*fio_do_ano*'
      - 'tests/fixtures/fio-do-ano-edits-20261101.json'
      - 'docs/pedagogia/fio-do-ano-20261101.md'
      - '.github/workflows/pt-fio-do-ano-qa.yml'
permissions:
  contents: read
jobs:
  fio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Âmbito e camadas estritas
        run: |
          python -m unittest discover -s tests -p 'test_fio_do_ano.py'
          python scripts/verificar_camadas.py
      - name: Preparar navegador
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Teclado, temas, projeção e continuação
        run: python tests/browser_fio_do_ano.py
