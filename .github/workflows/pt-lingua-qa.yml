# 03/11/2026: cabeçalho sobre F0 publicada, mantendo reversão e asserções.
# 03/11/2026: desfazer primeiro a camada visual do cabecalho, com as mesmas assercoes.
# 01/11/2026: desfazer a camada dos índices antes dos contratos históricos.
name: Português, língua das perguntas
# 30/10/2026: pedido do docente («Qual citação identifica…» é muito mau em português; o problema é transversal). Corre em
# todos os pedidos de integração, como o lingua-qa.yml do Lente: nenhuma pergunta «Qual» seguida de nome e nenhum imperativo
# de «você» a abrir uma instrução. A camada literal desta passagem (tests/fixtures/lingua-pessoa-m7-edits-20261030.json,
# com o Pessoa da F13 e os acertos do M7) confere-se aqui e desfaz-se antes das outras nos testes de estado congelado.
on:
  pull_request:
permissions:
  contents: read
jobs:
  lingua:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Perguntas em português europeu, camada literal e estados congelados
        run: |
          python -m unittest discover -s tests -p 'test_lingua_perguntas.py' -v
          python -m unittest discover -s tests -p 'test_task_routes_closure.py' -v
          python -m unittest discover -s tests -p 'test_module_layout.py' -v
          python -m unittest discover -s tests -p 'test_task_aquecimentos.py' -v
          # 01/11/2026: desfazer primeiro a camada das tarefas M8/M9.
          # 01/11/2026: desfaz primeiro a camada das sete lições novas.
          # 01/11/2026: desfaz antes a camada do pedido B.
          # 02/11/2026: desfaz antes de tudo a varredura, a calçada e as tarefas individuais (as mais recentes).
          # 03/11/2026: desfaz o piloto M4 e F0 antes dos créditos publicados e do lote 2.
          # 05/11/2026: a tabela dos seis movimentos desfaz-se antes da revisão de 5/11.
          # 05/11/2026: o Laboratório do exame (lição, não «leitura de apoio») é a camada mais recente; desfaz-se antes da tabela dos seis movimentos.
          # 05/11/2026: o contexto de cada sessão do Laboratório do exame (lição e excerto, não «recorte») é a camada mais recente; desfaz-se antes da ligação e das notas do Laboratório do exame.
          # 05/11/2026: a decisão 154 (os exercícios fazem-se sozinho; nada no texto do aluno depende do docente) é a camada mais recente; desfaz-se antes do contexto do Laboratório do exame, com a mesma exigência.
          python scripts/aplicar_trocas.py scripts/lingua_pessoa_m7_20261030.json --manifesto tests/fixtures/lingua-pessoa-m7-edits-20261030.json --verificar --desfazer-antes tests/fixtures/atlas-lote3-edits-20261105.json --desfazer-antes tests/fixtures/autonomia-154-edits-20261105.json --desfazer-antes tests/fixtures/exame-contexto-edits-20261105.json --desfazer-antes tests/fixtures/exame-licao-edits-20261105.json --desfazer-antes tests/fixtures/tabela-movimentos-edits-20261105.json --desfazer-antes tests/fixtures/revisao-edits-20261105.json --desfazer-antes tests/fixtures/cartaz-cabecalho-edits-20261103.json --desfazer-antes tests/fixtures/cartaz-m4-piloto-edits-20261102.json --desfazer-antes tests/fixtures/variedade-f0-edits-20261102.json --desfazer-antes tests/fixtures/creditos-grafismos-ia-edits-20261102.json --desfazer-antes tests/fixtures/conteudos-lote2-edits-20261101.json --desfazer-antes tests/fixtures/varredura-formatacao-edits-20261101.json --desfazer-antes tests/fixtures/calcada-mar-edits-20261102.json --desfazer-antes tests/fixtures/tarefas-individuais-edits-20261102.json --desfazer-antes tests/fixtures/cartaz-indices-edits-20261101.json --desfazer-antes tests/fixtures/licoes-m16-edits-20261101.json --desfazer-antes tests/fixtures/licoes-m89-edits-20261101.json --desfazer-antes tests/fixtures/tarefas-m89-edits-20261101.json --desfazer-antes tests/fixtures/tarefas-m356-edits-20261031.json
