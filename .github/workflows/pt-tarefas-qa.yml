name: Português, aulas de tarefa M1 a M9
on:
  pull_request:
    paths:
      # 01/11/2026: quatro tarefas, percursos e leituras M8/M9.
      - 'm8/**'
      - 'm9/**'
      - 'tests/*m89*'
      - 'scripts/tarefas_m89_20261101.json'
      - 'tests/fixtures/tarefas-m89-edits-20261101.json'
      # 31/10/2026: percursos, fontes e camada das seis tarefas novas.
      - 'm3/**'
      - 'm5/**'
      - 'm6/**'
      - 'docs/pedagogia/grelhas-tarefas-20261027.json'
      - 'scripts/tarefas_m356_20261031.json'
      - 'tests/fixtures/tarefas-m356-edits-20261031.json'
      - 'tests/*m356*'
      - 'tarefas/**'
      - 'assets/task-90.*'
      - 'assets/task-reader.*'
      - 'assets/task-choice.*'
      - 'assets/relogio.*'
      - 'tests/browser_relogio.py'
      - 'assets/unit-task-route.js'
      - 'assets/pt-lessons/casca.js'
      - 'assets/pt-lessons/lesson.css'
      - 'tests/*task*'
      # 30/10/2026: aquecimento em cartões (decisão do docente)
      - 'tests/*aquecimentos_m1*'
      # 30/10/2026: aquecimentos do M4 e a sua camada literal
      - 'tests/*aquecimentos_m4*'
      # 30/10/2026: aquecimentos do M2 e a sua camada literal
      - 'tests/*aquecimentos_m2*'
      - 'm2/index.html'
      - 'm2/guia-da-tarefa-m2/**'
      - 'm4/index.html'
      - 'm4/guia-da-tarefa-m4/**'
      - 'scripts/auditar_aquecimentos_m1.py'
      - 'scripts/opcoes_equilibradas.py'
      - 'm1/index.html'
      - 'm1/guia-da-tarefa-m1/**'
      - 'tests/fixtures/*task*'
      # 29/10/2026: aquecimentos em cartões (gerador, dados e páginas) e a tarefa nova da M7-U3
      - 'scripts/aquecimentos.py'
      - 'scripts/tarefas_escolha.py'
      - 'scripts/grelhas_tarefas.py'
      - 'docs/pedagogia/aquecimentos/**'
      - 'docs/pedagogia/tarefas-escolha/**'
      # 29/10/2026 (revisão técnica): o teste de navegador dos aquecimentos também confere o percurso, a F10 e o seu painel,
      # e a página dos diapositivos do M7
      - 'm7/index.html'
      - 'm7/licao-m7-f10/**'
      - 'm7/painel-m7-f10/**'
      - 'm7/diapositivos/**'
      - 'm7/guia-da-tarefa-m7/**'
      - '.github/workflows/pt-tarefas-qa.yml'
permissions:
  contents: read
jobs:
  lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar conteúdo, continuidade e sintaxe
        run: |
          python -m unittest discover -s tests -p 'test_*task*.py' -v
          # 30/10/2026: aquecimento em cartões (decisão do docente)
          python -m unittest discover -s tests -p 'test_aquecimentos_m1_opcoes.py' -v
          python -m unittest discover -s tests -p 'test_aquecimentos_m4_opcoes.py' -v
          python -m unittest discover -s tests -p 'test_aquecimentos_m2_opcoes.py' -v
          # 31/10/2026: mesmos critérios de opções, fontes e segunda tentativa nos seis baralhos.
          python -m unittest discover -s tests -p 'test_aquecimentos_m356_opcoes.py' -v
          # 01/11/2026: desfaz primeiro a camada das sete lições novas.
          # 01/11/2026: desfaz antes a camada do pedido B.
          python scripts/aplicar_trocas.py scripts/tarefas_m356_20261031.json --manifesto tests/fixtures/tarefas-m356-edits-20261031.json --verificar --desfazer-antes tests/fixtures/conteudos-lote2-edits-20261101.json --desfazer-antes tests/fixtures/licoes-m16-edits-20261101.json --desfazer-antes tests/fixtures/licoes-m89-edits-20261101.json --desfazer-antes tests/fixtures/tarefas-m89-edits-20261101.json
          # 01/11/2026: verificar a camada nova e os quatro aquecimentos.
          python -m unittest discover -s tests -p 'test_aquecimentos_m89_opcoes.py' -v
          # 01/11/2026: desfaz primeiro a camada das sete lições novas.
          # 01/11/2026: desfaz antes a camada do pedido B.
          python scripts/aplicar_trocas.py scripts/tarefas_m89_20261101.json --manifesto tests/fixtures/tarefas-m89-edits-20261101.json --verificar --desfazer-antes tests/fixtures/conteudos-lote2-edits-20261101.json --desfazer-antes tests/fixtures/licoes-m16-edits-20261101.json --desfazer-antes tests/fixtures/licoes-m89-edits-20261101.json
          python scripts/auditar_aquecimentos_m1.py
          node --check assets/task-90.js
          node --check assets/task-reader.js
          node --check assets/relogio.js
          node tests/unit_task_route_runtime.js
      - name: Instalar Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Percorrer todas as aulas, nos dois temas e tamanhos
        run: python tests/browser_task_lesson_matrix.py
      - name: Relógio do aluno (duas pausas, recomeço obrigatório)
        run: python tests/browser_relogio.py
      # 29/10/2026: as três páginas de aquecimento do M7 até ao fim (390 claro, 1366 escuro, projeção sem gravar),
      # as ligações nas tarefas e no percurso, e a F10 reescrita. Revisão de 29/10/2026: também a lista dos diapositivos do
      # M7 depois do lançador da projeção e o arquivo do guia (itálico e blocos de 90 minutos).
      - name: Aquecimentos e ligações das 20 tarefas
        run: python tests/browser_task_aquecimentos.py
      # 30/10/2026: aquecimento em cartões (decisão do docente)
      - name: Respostas certas e erradas nos aquecimentos do M1
        run: python tests/browser_aquecimentos_m1_feedback.py
      # 30/10/2026: aquecimentos do M4 (decisão do docente)
      - name: Respostas certas e erradas nos aquecimentos do M4
        run: python tests/browser_aquecimentos_m4_feedback.py
      # 30/10/2026: aquecimentos do M2 (decisão do docente)
      - name: Respostas certas e erradas nos aquecimentos do M2
        run: python tests/browser_aquecimentos_m2_feedback.py

      # 31/10/2026: percursos, arquivos e quatro blocos dos guias novos.
      - name: Percursos e guias do M3 M5 M6
        run: python tests/browser_tarefas_m356.py

      # 31/10/2026: feedback e segunda tentativa nos seis novos aquecimentos.
      - name: Respostas certas e erradas no M3 M5 M6
        run: python tests/browser_aquecimentos_m356_feedback.py

      # 01/11/2026: segunda tentativa nas quatro tarefas novas e fecho dos nove módulos.
      - name: Respostas certas e erradas no M8 M9
        run: python tests/browser_aquecimentos_m89_feedback.py
      - name: Aulas de tarefa nos nove módulos
        run: python tests/browser_unit_synthesis.py

      - name: Percursos e guias do M8 M9
        run: python tests/browser_tarefas_m89.py
      # 01/11/2026: alvos, abertura e impressão da revisão, incluindo as grelhas anteriores afetadas.
      - name: Apresentação e impressão das tarefas revistas
        run: python tests/browser_revisao_tarefas_20261101.py
