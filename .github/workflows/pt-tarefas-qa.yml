name: Português — aulas de tarefa M1 M4 M7
on:
  pull_request:
    paths:
      - 'tarefas/**'
      - 'assets/task-90.*'
      - 'assets/task-reader.*'
      - 'assets/unit-task-route.js'
      - 'assets/pt-lessons/casca.js'
      - 'assets/pt-lessons/lesson.css'
      - 'tests/*task*'
      - 'tests/fixtures/*task*'
      - '.github/workflows/pt-tarefas-qa.yml'
permissions:
  contents: read
jobs:
  lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar conteúdo, continuidade e sintaxe
        run: |
          python -m unittest discover -s tests -p 'test_*task*.py' -v
          node --check assets/task-90.js
          node --check assets/task-reader.js
          node tests/unit_task_route_runtime.js
      - name: Instalar Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Percorrer as oito aulas, nos dois temas e tamanhos
        run: python tests/browser_task_lesson_matrix.py
