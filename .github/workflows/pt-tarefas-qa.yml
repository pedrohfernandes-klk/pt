name: Português — aulas de tarefa M1 M4 M7
on:
  pull_request:
    paths:
      - 'tarefas/**'
      - 'assets/task-90.*'
      - 'assets/task-reader.*'
      - 'assets/task-choice.*'
      - 'assets/relogio.*'
      - 'tests/browser_relogio.py'
      - 'assets/unit-task-route.js'
      - 'assets/pt-lessons/casca.js'
      - 'assets/pt-lessons/lesson.css'
      - 'tests/*task*'
      # 30/10/2026: aquecimento em cartões (decisão do docente)
      - 'tests/*aquecimentos_m1*'
      # 30/10/2026: aquecimentos do M4 e a sua camada literal
      - 'tests/*aquecimentos_m4*'
      - 'm4/index.html'
      - 'm4/guia-da-tarefa-m4/**'
      - 'scripts/auditar_aquecimentos_m1.py'
      - 'm1/index.html'
      - 'm1/guia-da-tarefa-m1/**'
      - 'tests/fixtures/*task*'
      # 29/10/2026: aquecimentos em cartões (gerador, dados e páginas) e a tarefa nova da M7-U3
      - 'scripts/aquecimentos.py'
      - 'scripts/tarefas_escolha.py'
      - 'scripts/grelhas_tarefas.py'
      - 'docs/pedagogia/aquecimentos/**'
      - 'docs/pedagogia/tarefas-escolha/**'
      # 29/10/2026 (revisão técnica): o teste de navegador dos aquecimentos também confere o percurso, a F10 e o seu painel,
      # e a página dos diapositivos do M7
      - 'm7/index.html'
      - 'm7/licao-m7-f10/**'
      - 'm7/painel-m7-f10/**'
      - 'm7/diapositivos/**'
      - 'm7/guia-da-tarefa-m7/**'
      - '.github/workflows/pt-tarefas-qa.yml'
permissions:
  contents: read
jobs:
  lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar conteúdo, continuidade e sintaxe
        run: |
          python -m unittest discover -s tests -p 'test_*task*.py' -v
          # 30/10/2026: aquecimento em cartões (decisão do docente)
          python -m unittest discover -s tests -p 'test_aquecimentos_m1_opcoes.py' -v
          python -m unittest discover -s tests -p 'test_aquecimentos_m4_opcoes.py' -v
          python scripts/auditar_aquecimentos_m1.py
          node --check assets/task-90.js
          node --check assets/task-reader.js
          node --check assets/relogio.js
          node tests/unit_task_route_runtime.js
      - name: Instalar Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Percorrer as oito aulas, nos dois temas e tamanhos
        run: python tests/browser_task_lesson_matrix.py
      - name: Relógio do aluno (duas pausas, recomeço obrigatório)
        run: python tests/browser_relogio.py
      # 29/10/2026: as três páginas de aquecimento do M7 até ao fim (390 claro, 1366 escuro, projeção sem gravar),
      # as ligações nas tarefas e no percurso, e a F10 reescrita. Revisão de 29/10/2026: também a lista dos diapositivos do
      # M7 depois do lançador da projeção e o arquivo do guia (itálico e blocos de 90 minutos).
      - name: Aquecimentos em cartões do M7 e tarefa nova da unidade 3
        run: python tests/browser_task_aquecimentos.py
      # 30/10/2026: aquecimento em cartões (decisão do docente)
      - name: Respostas certas e erradas nos aquecimentos do M1
        run: python tests/browser_aquecimentos_m1_feedback.py
      # 30/10/2026: aquecimentos do M4 (decisão do docente)
      - name: Respostas certas e erradas nos aquecimentos do M4
        run: python tests/browser_aquecimentos_m4_feedback.py
