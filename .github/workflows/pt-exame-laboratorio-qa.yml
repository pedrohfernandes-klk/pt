name: Português — laboratório de exame
on:
  pull_request:
    paths:
      - 'exame/**'
      - 'assets/exame/**'
      - 'tests/*exame*'
      - 'assets/relogio.*'
      - 'tests/browser_relogio.py'
      - '.github/workflows/pt-exame-laboratorio-qa.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript e regressões do exame
        run: |
          node --check assets/exame/laboratorio.js
          node --check assets/exame/app.js
          node --check assets/exame/dossier.js
          node --check assets/relogio.js
          python -m unittest discover -s tests -p 'test_exame*.py' -v
      - name: Preparar navegador
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Testar máquinas e sessões preservadas
        run: |
          node tests/browser_exame_laboratorio.cjs
          node tests/browser_exame_oficina_revisao.cjs
          python tests/browser_exame_cache.py
          python tests/browser_exame_alignment.py
          python tests/browser_relogio.py
