name: Português — laboratório de exame
on:
  pull_request:
    paths:
      - 'exame/**'
      - 'assets/exame/**'
      - 'assets/pt-lessons/**'
      - 'scripts/audit_cards.py'
      # 01/11/2026: os bancos e o gerador dos 27 aquecimentos também acionam a verificação.
      - 'scripts/exame_aquecimentos.py'
      - 'scripts/aquecimentos.py'
      - 'docs/pedagogia/exame-aquecimentos/**'
      - 'scripts/provas/**'
      # 30/10/2026: a medição única das opções equilibradas (também dos aquecimentos) e as páginas obras/ cujo título as
      # lições das provas leem (scripts/provas/gerar.py); mudá-las sem correr estes testes deixava as provas desatualizadas
      - 'scripts/opcoes_equilibradas.py'
      - 'scripts/auditar_aquecimentos_m1.py'
      - 'obras/**'
      - 'tests/*exame*'
      - 'tests/*provas*'
      - 'tests/fixtures/prova-639-*'
      - 'assets/relogio.*'
      - 'tests/browser_relogio.py'
      # 05/11/2026: a camada do Laboratório do exame (lição, não «leitura de apoio»).
      - 'scripts/exame_licao_20261105.json'
      - 'tests/fixtures/exame-licao-edits-20261105.json'
      # 05/11/2026: a camada do contexto de cada sessão do Laboratório do exame (lição e excerto, não «recorte»).
      - 'scripts/exame_contexto_20261105.json'
      - 'tests/fixtures/exame-contexto-edits-20261105.json'
      # 05/11/2026: a camada da decisão 154 (os exercícios fazem-se sozinho), que também muda obras/memorial e obras/mensagem.
      - 'scripts/autonomia_154_20261105.json'
      - 'tests/fixtures/autonomia-154-edits-20261105.json'
      - 'tests/fixtures/atlas-lote3-edits-20261105.json'
      # 06/11/2026: os créditos atrás de um «i» (decisão 153, pedido pt-2), a camada mais recente.
      - 'scripts/creditos_i_20261105.json'
      - 'tests/fixtures/creditos-i-edits-20261105.json'
      # 06/11/2026: o desenho comum dos nove índices (decisão 148), a camada mais recente.
      - 'scripts/cartaz_indices_148_20261106.*'
      - 'tests/fixtures/cartaz-indices-148-edits-20261106.json'
      - 'assets/cartaz-indice-comum.*'
      # 07/11/2026: os três acertos dos índices deixados pela decisão 173, a camada mais recente.
      - 'scripts/indices_acertos_20261107.*'
      - 'tests/fixtures/indices-acertos-edits-20261107.json'
      - 'tests/test_indices_acertos_20261107.py'
      # 06/11/2026: a decisão 152 no M1 (tabelas e espaços que não quebram), a camada mais recente, e o seu teste.
      - 'scripts/cuidado_m1_20261106.*'
      - 'tests/fixtures/cuidado-m1-edits-20261106.json'
      - 'tests/test_cuidado_m1.py'
      # 07/11/2026: os créditos atrás de um «i» na entrada, nos índices e no Atlas (decisões 153, 176 e 177, pedido pt-1), a camada mais recente, e o seu teste.
      - 'scripts/creditos_i_pt1_20261107.*'
      - 'tests/fixtures/creditos-i-pt1-edits-20261107.json'
      - 'tests/test_creditos_i_pt1.py'
      # 08/11/2026: o cartaz «Ler a cidade» na entrada e o nome novo da secção nas páginas publicadas, a camada mais recente, e o seu teste.
      - 'scripts/cidade_cartaz_20261108.*'
      - 'tests/fixtures/cidade-cartaz-edits-20261108.json'
      - 'tests/test_cidade_cartaz.py'
      # 08/11/2026: a decisão 152 no M2 (tabelas e espaços que não quebram), a camada mais recente, e o seu teste.
      - 'scripts/cuidado_m2_20261108.*'
      - 'tests/fixtures/cuidado-m2-edits-20261108.json'
      - 'tests/test_cuidado_m2.py'
      # 08/11/2026: a decisão 152 no M3 (tabelas e espaços que não quebram), a camada mais recente, e o seu teste.
      - 'scripts/cuidado_m3_20261108.*'
      - 'tests/fixtures/cuidado-m3-edits-20261108.json'
      - 'tests/test_cuidado_m3.py'
      # 08/11/2026: a decisão 152 no M4 (tabelas e espaços que não quebram), a camada mais recente, e o seu teste.
      - 'scripts/cuidado_m4_20261108.*'
      - 'tests/fixtures/cuidado-m4-edits-20261108.json'
      - 'tests/test_cuidado_m4.py'
      # 08/11/2026: a decisão 152 no M5 (tabelas e espaços que não quebram), a camada mais recente, e o seu teste.
      - 'scripts/cuidado_m5_20261108.*'
      - 'tests/fixtures/cuidado-m5-edits-20261108.json'
      - 'tests/test_cuidado_m5.py'
      - 'tests/test_autonomia_154.py'
      - '.github/workflows/pt-exame-laboratorio-qa.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript e regressões do exame
        run: |
          node --check assets/exame/laboratorio.js
          node --check assets/exame/app.js
          node --check assets/exame/aquecimento.js
          python scripts/exame_aquecimentos.py --check
          node tests/exame-catalogo.cjs
          node --check assets/exame/dossier.js
          node --check assets/relogio.js
          node --check assets/exame/provas.js
          node --check assets/exame/provas-licao.js
          python -m unittest discover -s tests -p 'test_exame*.py' -v
          python -m unittest discover -s tests -p 'test_provas*.py' -v
          python scripts/provas/opcoes.py --exigir
          # 05/11/2026: a camada do Laboratório do exame confere-se aqui (é a mais recente; nada por cima dela).
          # 05/11/2026: o contexto de cada sessão (lição e excerto, não «recorte») passa a ser a camada mais recente: confere-se aqui sem nada por cima, e desfaz-se antes de conferir a ligação e as notas.
          # 05/11/2026: a decisão 154 (os exercícios fazem-se sozinho) passa a ser a camada mais recente: confere-se aqui sem nada por cima, com o seu teste, e desfaz-se antes do contexto e da ligação e das notas, com a mesma exigência.
          python -m unittest discover -s tests -p 'test_autonomia_154.py' -v
          # 06/11/2026: o lote 3 do Atlas fica por cima da decisão 154 depois de juntar o main; confere-se primeiro e desfaz-se antes dela.
          # 06/11/2026: o desenho comum dos nove índices (decisão 148) é a camada mais recente, por cima dos créditos atrás de um «i»; desfaz-se primeiro, com a mesma exigência.
          # 07/11/2026: os três acertos dos índices deixados pela decisão 173 são a camada mais recente, por cima do desenho comum dos nove índices; desfazem-se primeiro, com a mesma exigência.
          # 07/11/2026 (fusão do main 29441e6b no pedido #182): a decisão 152 no M1 (cuidado_m1_20261106) passa a camada mais recente, por cima dos acertos da decisão 173; desfaz-se primeiro, com a mesma exigência.
          # 07/11/2026: os créditos atrás de um «i» na entrada, nos índices e no Atlas (creditos_i_pt1_20261107, pedido pt-1) passam a camada mais recente, por cima da decisão 152 no M1; desfazem-se primeiro, com a mesma exigência.
          # 08/11/2026: o cartaz «Ler a cidade» na entrada e o nome novo da secção nas páginas publicadas (cidade_cartaz_20261108, que também muda a frase da sugestão «continua» das lições e dos índices) passam a camada mais recente, por cima dos créditos atrás de um «i» do pedido pt-1; desfazem-se primeiro, com a mesma exigência.
          # 08/11/2026: a decisão 152 no M2 (cuidado_m2_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M2, incluindo o índice do módulo) passa a camada mais recente, por cima do cartaz «Ler a cidade» e do nome novo da secção; desfaz-se primeiro, com a mesma exigência.
