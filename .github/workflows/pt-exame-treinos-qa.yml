name: Português — treinos de exame
on:
  pull_request:
    paths:
      # 11/11/2026: os três treinos da preparação de exame (exame/treinos/), o seu gerador, os dados e os testes.
      - 'exame/treinos/**'
      - 'assets/exame/treino.*'
      - 'assets/exame/fontes/**'
      - 'assets/exame/sessoes.json'
      - 'assets/appearance.*'
      - 'assets/projection-launcher.js'
      - 'scripts/exame_treinos.py'
      - 'scripts/exame_treinos_dados/**'
      - 'docs/pedagogia/exame-aquecimentos/s14.json'
      # 12/11/2026: o treino da sessão 17 confere as citações curtas com as lições do M8 e remete para as provas em cartões.
      - 'docs/pedagogia/exame-aquecimentos/s17.json'
      - 'm8/licao-m8-f03/**'
      - 'm8/licao-m8-f04/**'
      - 'm8/licao-m8-f05/**'
      - 'exame/provas/2026-2f/grupo-i/**'
      - 'tests/test_exame_treinos.py'
      - 'tests/browser_exame_treinos.cjs'
      - 'tests/fixtures/prova-639-*'
      - 'tests/fixtures/dicionario-terminologico-20261111.json'
      - '.github/workflows/pt-exame-treinos-qa.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir o gerador, o motor e os textos oficiais
        run: |
          node --check assets/exame/treino.js
          python scripts/exame_treinos.py --check
          python -m unittest discover -s tests -p 'test_exame_treinos.py' -v
          # os 27 aquecimentos das sessões ficam como estavam
          python scripts/exame_aquecimentos.py --check
      - name: Preparar navegador
        run: |
          # playwright fixado em 1.64.1, como no fluxo do laboratório de exame
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Testar os treinos no navegador
        run: node tests/browser_exame_treinos.cjs
