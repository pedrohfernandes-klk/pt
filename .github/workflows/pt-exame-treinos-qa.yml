name: Português — treinos de exame
on:
  pull_request:
    paths:
      # 11/11/2026: os três treinos da preparação de exame (exame/treinos/), o seu gerador, os dados e os testes.
      - 'exame/treinos/**'
      - 'assets/exame/treino.*'
      - 'assets/exame/fontes/**'
      - 'assets/exame/sessoes.json'
      - 'assets/appearance.*'
      - 'assets/projection-launcher.js'
      - 'scripts/exame_treinos.py'
      - 'scripts/exame_treinos_dados/**'
      - 'docs/pedagogia/exame-aquecimentos/s14.json'
      # 12/11/2026: o treino da sessão 17 confere as citações curtas com as lições do M8 e remete para as provas em cartões.
      - 'docs/pedagogia/exame-aquecimentos/s17.json'
      - 'm8/licao-m8-f03/**'
      - 'm8/licao-m8-f04/**'
      - 'm8/licao-m8-f05/**'
      - 'exame/provas/2026-2f/grupo-i/**'
      # 12/11/2026: o treino da sessão 18 confere o recorte de «George» com a lição M8-F16 e o resumo com a M8-F08 e o exercício longo.
      - 'docs/pedagogia/exame-aquecimentos/s18.json'
      - 'm8/licao-m8-f08/**'
      - 'm8/licao-m8-f16/**'
      - 'm8/m8-george-tres-idades/**'
      # 13/11/2026: o treino da sessão 22 usa frases do aquecimento e confere as definições com o Dicionário Terminológico;
      # liga às provas em cartões do Grupo II das duas fases.
      - 'docs/pedagogia/exame-aquecimentos/s22.json'
      - 'tests/fixtures/dicionario-terminologico-20261113.json'
      - 'exame/provas/2026-1f/grupo-ii/**'
      - 'exame/provas/2026-2f/grupo-ii/**'
      # 13/11/2026: o treino da sessão 25 usa uma gravura em domínio público que a lição M9-F14 já publica, com o crédito do registo;
      # a imagem da prova não está no repositório (scripts/provas/dados/2026-1f/prova.json diz que não se reproduz).
      - 'docs/pedagogia/exame-aquecimentos/s25.json'
      - 'img/fontes/licoes-20261101/piranesi.jpg'
      - 'scripts/imagens_licoes_20261101.py'
      - 'm9/licao-m9-f14/**'
      - 'scripts/provas/dados/2026-1f/prova.json'
      - 'exame/provas/2026-1f/grupo-iii/**'
      # 13/11/2026: o treino da sessão 23 confere os dois sonetos de Camões, verso a verso, com as páginas do módulo 3 de onde vêm.
      - 'docs/pedagogia/exame-aquecimentos/s23.json'
      - 'docs/pedagogia/exame-aquecimentos/s04.json'
      - 'm3/licao-m3-f09/**'
      - 'm3/m3-soneto-raciocinio/**'
      - 'tests/test_exame_treinos.py'
      - 'tests/browser_exame_treinos.cjs'
      - 'tests/fixtures/prova-639-*'
      - 'tests/fixtures/dicionario-terminologico-20261111.json'
      - '.github/workflows/pt-exame-treinos-qa.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir o gerador, o motor e os textos oficiais
        run: |
          node --check assets/exame/treino.js
          python scripts/exame_treinos.py --check
          python -m unittest discover -s tests -p 'test_exame_treinos.py' -v
          # os 27 aquecimentos das sessões ficam como estavam
          python scripts/exame_aquecimentos.py --check
      - name: Preparar navegador
        run: |
          # playwright fixado em 1.64.1, como no fluxo do laboratório de exame
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Testar os treinos no navegador
        run: node tests/browser_exame_treinos.cjs
