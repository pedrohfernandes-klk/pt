jobs:
  pieces:
    runs-on: ubuntu-latest
    steps:
      # 01/11/2026: base disponível para os contratos de isolamento.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 03/11/2026: mesma comparação de isolamento; este checkout tem a base histórica.
      - run: git diff --exit-code 8a38a69d554dca94e7018b14e7fef581286f5896 -- '*.html' 'assets/fundos.js' 'assets/fundos.css' 'assets/appearance.js' 'assets/pt-lessons/' 'assets/task-*' 'assets/cartaz-components.*'
        # 03/11/2026: contrato deste lote; não congela páginas em futuros pedidos.
        if: github.head_ref == 'codex/calcada-continua-pt-20261103' || github.ref_name == 'codex/calcada-continua-pt-20261103'
      # 01/11/2026: bateria Python completa, sem excluir famílias.
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      # 05/11/2026: playwright fixado em 1.64.1; a 1.65.0 saiu no npm sem o playwright-core 1.65.0 (ETARGET).
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/cartaz.test.cjs tests/appearance.test.cjs tests/cartaz_animacoes.test.cjs
      # 03/11/2026: cabeçalhos compactos, contraste real, projeção e zoom nativo.
      - run: node tests/browser_cabecalhos_compactos.cjs
        env:
          HEADER_OUTPUT: ${{ runner.temp }}/cabecalhos-compactos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cabecalhos-compactos
          path: ${{ runner.temp }}/cabecalhos-compactos
          retention-days: 30
      - run: node tests/browser_cartaz.cjs
      # 01/11/2026: movimento, estado final, primeira ação e contrato do visor.
      - run: node tests/browser_cartaz_animacoes.cjs
      # 01/11/2026: decisão 61, hierarquia e escala nas páginas migradas.
      - run: node tests/hierarquia-cartaz.cjs
      # 01/11/2026: família dos índices, antes/depois, estados, acessibilidade e impressão.
      - run: node tests/browser_cartaz_indices.cjs
        env:
          CARTAZ_INDICES_OUTPUT: ${{ runner.temp }}/cartaz-indices
      - run: node tests/browser_cartaz_indices_contracts.cjs
        if: ${{ !cancelled() }}
        env:
          CARTAZ_INDICES_OUTPUT: ${{ runner.temp }}/cartaz-indices
      # 07/11/2026: decisões 153, 176 e 177 (pedido pt-1). A camada dos créditos atrás de um «i» na entrada, nos nove índices e no
      # Atlas, a mais recente, confere-se sem nada por cima; cada «i» novo abre por teclado e por toque, a 390 e a 1366 px, nos dois
      # temas, com o texto completo, sem tapar nada e sem deslocamento lateral; impressão por extenso, projeção e o botão do fundo
      # com o texto novo («Parar a animação» e «Retomar a animação»).
      # 08/11/2026: por cima dela fica agora o cartaz «Ler a cidade» e o nome novo da secção (cidade_cartaz_20261108, que também mexe
      # na entrada e nos nove índices); desfaz-se primeiro, com a mesma exigência.
      # 08/11/2026: por cima do cartaz «Ler a cidade» fica agora a decisão 152 no M2 (cuidado_m2_20261108, que também mexe no
      # índice do M2); desfaz-se primeiro, com a mesma exigência.
      # 08/11/2026: a decisão 152 no M3 (cuidado_m3_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M3, incluindo o índice, o guia e o mapa do módulo) passa a camada mais recente, por cima da decisão 152 no M2; desfaz-se primeiro, com a mesma exigência.
      # 08/11/2026: a decisão 152 no M4 (cuidado_m4_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M4, incluindo o índice, o guia, o mapa e o portefólio do módulo) passa a camada mais recente, por cima da decisão 152 no M3; desfaz-se primeiro, com a mesma exigência.
      # 08/11/2026: a decisão 152 no M5 (cuidado_m5_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M5, incluindo o índice, o guia, o mapa e o portefólio do módulo, e nas tarefas, nos aquecimentos e nas grelhas das suas unidades) passa a camada mais recente, por cima da decisão 152 no M4; desfaz-se primeiro, com a mesma exigência.
      # 08/11/2026: a decisão 152 no M6 (cuidado_m6_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M6, incluindo o índice, o guia, o mapa e o portefólio do módulo, as páginas «Ler a fundo» e «Pensar devagar», e nas tarefas, nos aquecimentos e nas grelhas das suas unidades) passa a camada mais recente, por cima da decisão 152 no M5; desfaz-se primeiro, com a mesma exigência.
      # 11/11/2026 (fusão do main 4bf4a053 no pedido #191): a revisão dos enunciados das tarefas (tarefas_claras_20261110, #192) fica entre a decisão 152 no M6, que continua a mais recente e se desfaz primeiro, e a decisão 152 no M5.
      # 11/11/2026: a decisão 152 no M7 (cuidado_m7_20261111: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M7, incluindo o índice, o guia, o mapa e o portefólio do módulo, as páginas «Ler a fundo», «Olhar» e «Pensar devagar», e nas tarefas, nos aquecimentos e na grelha das suas unidades) passa a camada mais recente, por cima da decisão 152 no M6; desfaz-se primeiro, com a mesma exigência.
      # 12/11/2026: a decisão 152 no M8 (cuidado_m8_20261112: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M8, incluindo o índice, o guia, o mapa e o portefólio do módulo, as atividades de gramática e de escrita e as tarefas das suas unidades) passa a camada mais recente, por cima da decisão 152 no M7; desfaz-se primeiro, com a mesma exigência.
      # 12/11/2026: a decisão 152 no M9 (cuidado_m9_20261112: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M9, incluindo o índice, o guia, o mapa e o portefólio do módulo, as páginas «Ler a fundo» e «Pensar devagar», as atividades e as tarefas das suas unidades) passa a camada mais recente, por cima da decisão 152 no M8; desfaz-se primeiro, com a mesma exigência.
      # 12/11/2026: a decisão 152 no Exame e nas páginas transversais (cuidado_exame_20261112: uma tabela onde havia itens paralelos e espaços que não quebram nas sessões, no laboratório, nas provas em cartões e nos aquecimentos do Exame, nas obras, nas páginas dos anos, no mapa e na entrada) passa a camada mais recente, por cima da decisão 152 no M9; desfaz-se primeiro, com a mesma exigência.
      # 12/11/2026: a ligação «Treinos» na página principal do Exame (exame_ligacao_treinos_20261112: só a navegação de exame/index.html) passa a camada mais recente, por cima da decisão 152 no Exame e nas páginas transversais; desfaz-se primeiro, com a mesma exigência, sem nada pelo meio.
      # 12/11/2026: as provas em cartões com os documentos oficiais (exame_provas_oficial_20261112: a secção exame/provas/, as seis lições das provas de 2026 e os seus dados) passam a camada mais recente, por cima da ligação «Treinos» na página principal do Exame; desfaz-se primeiro, com a mesma exigência, sem nada pelo meio.
      - run: python scripts/aplicar_trocas.py scripts/creditos_i_pt1_20261107.json --manifesto tests/fixtures/creditos-i-pt1-edits-20261107.json --verificar --desfazer-antes tests/fixtures/tarefas-faceis-m7-edits-20261113.json --desfazer-antes tests/fixtures/tarefas-faceis-m6-edits-20261113.json --desfazer-antes tests/fixtures/tarefas-faceis-m5-edits-20261113.json --desfazer-antes tests/fixtures/tarefas-faceis-m1-edits-20261113.json --desfazer-antes tests/fixtures/tarefas-faceis-m3-edits-20261112.json --desfazer-antes tests/fixtures/exame-provas-oficial-edits-20261112.json --desfazer-antes tests/fixtures/exame-ligacao-treinos-edits-20261112.json --desfazer-antes tests/fixtures/cuidado-exame-edits-20261112.json --desfazer-antes tests/fixtures/cuidado-m9-edits-20261112.json --desfazer-antes tests/fixtures/cuidado-m8-edits-20261112.json --desfazer-antes tests/fixtures/cuidado-m7-edits-20261111.json --desfazer-antes tests/fixtures/cuidado-m6-edits-20261108.json --desfazer-antes tests/fixtures/tarefas-claras-edits-20261110.json --desfazer-antes tests/fixtures/cuidado-m5-edits-20261108.json --desfazer-antes tests/fixtures/cuidado-m4-edits-20261108.json --desfazer-antes tests/fixtures/cuidado-m3-edits-20261108.json --desfazer-antes tests/fixtures/cuidado-m2-edits-20261108.json --desfazer-antes tests/fixtures/cidade-cartaz-edits-20261108.json
      - run: node tests/browser_creditos_i_pt1.cjs
        if: ${{ !cancelled() }}
        env:
          CREDITOS_I_PT1_OUTPUT: ${{ runner.temp }}/cartaz-indices/creditos-i-pt1
      # 08/11/2026: cartaz «Ler a cidade» na entrada. A camada, a mais recente, confere-se sem nada por cima; a 320, 390, 768 e
      # 1280 px (e a 390 e 1280 px no tema escuro, e a 1280 px na projeção), a página não rola para o lado, cada número cabe no seu
      # quadrado, o título não transborda e as ligações têm 44 px de altura ou mais.
      # 08/11/2026: por cima dela fica agora a decisão 152 no M2 (cuidado_m2_20261108, que também mexe nas lições e no índice do
      # M2: a frase da sugestão «continua» fica igual, mas as páginas mudam); desfaz-se primeiro, com a mesma exigência.
      # 08/11/2026: a decisão 152 no M3 (cuidado_m3_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M3, incluindo o índice, o guia e o mapa do módulo) passa a camada mais recente, por cima da decisão 152 no M2; desfaz-se primeiro, com a mesma exigência.
      # 08/11/2026: a decisão 152 no M4 (cuidado_m4_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M4, incluindo o índice, o guia, o mapa e o portefólio do módulo) passa a camada mais recente, por cima da decisão 152 no M3; desfaz-se primeiro, com a mesma exigência.
      # 08/11/2026: a decisão 152 no M5 (cuidado_m5_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M5, incluindo o índice, o guia, o mapa e o portefólio do módulo, e nas tarefas, nos aquecimentos e nas grelhas das suas unidades) passa a camada mais recente, por cima da decisão 152 no M4; desfaz-se primeiro, com a mesma exigência.
      # 08/11/2026: a decisão 152 no M6 (cuidado_m6_20261108: tabelas onde há itens paralelos e espaços que não quebram nas lições e páginas do M6, incluindo o índice, o guia, o mapa e o portefólio do módulo, as páginas «Ler a fundo» e «Pensar devagar», e nas tarefas, nos aquecimentos e nas grelhas das suas unidades) passa a camada mais recente, por cima da decisão 152 no M5; desfaz-se primeiro, com a mesma exigência.
      # 11/11/2026 (fusão do main 4bf4a053 no pedido #191): a revisão dos enunciados das tarefas (tarefas_claras_20261110, #192) fica entre a decisão 152 no M6, que continua a mais recente e se desfaz primeiro, e a decisão 152 no M5.
