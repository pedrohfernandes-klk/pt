name: Cartaz pieces
on:
  push:
    paths: ['tests/browser_cabecalhos_compactos.cjs', 'assets/calcada-*', 'scripts/gerar_calcada_continua.py', 'tests/*calcada_continua*', 'assets/cartaz-cabecalho.css', 'assets/fundo-calcada.css', 'index.html', 'scripts/cartaz_cabecalho*', 'tests/fixtures/cartaz-cabecalho*', 'assets/cartaz-indices.*', 'assets/cartaz-m4-*', 'assets/fontes/**', 'm[1-9]/index.html', 'scripts/cartaz_indices*', 'scripts/cartaz_m4*', 'tests/fixtures/cartaz-*', 'assets/cartaz-components.*', 'assets/appearance.css', 'demonstracoes/cartaz-animacoes/**', 'tests/*cartaz*', '.github/workflows/cartaz-qa.yml']
  pull_request:
    paths: ['tests/browser_cabecalhos_compactos.cjs', 'assets/calcada-*', 'scripts/gerar_calcada_continua.py', 'tests/*calcada_continua*', 'assets/cartaz-cabecalho.css', 'assets/fundo-calcada.css', 'index.html', 'scripts/cartaz_cabecalho*', 'tests/fixtures/cartaz-cabecalho*', 'assets/cartaz-indices.*', 'assets/cartaz-m4-*', 'assets/fontes/**', 'm[1-9]/index.html', 'scripts/cartaz_indices*', 'scripts/cartaz_m4*', 'tests/fixtures/cartaz-*', 'assets/cartaz-components.*', 'assets/appearance.css', 'demonstracoes/cartaz-animacoes/**', 'tests/*cartaz*', '.github/workflows/cartaz-qa.yml']
jobs:
  pieces:
    runs-on: ubuntu-latest
    steps:
      # 01/11/2026: base disponível para os contratos de isolamento.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 03/11/2026: mesma comparação de isolamento; este checkout tem a base histórica.
      - run: git diff --exit-code 8a38a69d554dca94e7018b14e7fef581286f5896 -- '*.html' 'assets/fundos.js' 'assets/fundos.css' 'assets/appearance.js' 'assets/pt-lessons/' 'assets/task-*' 'assets/cartaz-components.*'
        # 03/11/2026: contrato deste lote; não congela páginas em futuros pedidos.
        if: github.head_ref == 'codex/calcada-continua-pt-20261103' || github.ref_name == 'codex/calcada-continua-pt-20261103'
      # 01/11/2026: bateria Python completa, sem excluir famílias.
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/cartaz.test.cjs tests/appearance.test.cjs tests/cartaz_animacoes.test.cjs
      # 03/11/2026: cabeçalhos compactos, contraste real, projeção e zoom nativo.
      - run: node tests/browser_cabecalhos_compactos.cjs
        env:
          HEADER_OUTPUT: ${{ runner.temp }}/cabecalhos-compactos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cabecalhos-compactos
          path: ${{ runner.temp }}/cabecalhos-compactos
          retention-days: 30
      - run: node tests/browser_cartaz.cjs
      # 01/11/2026: movimento, estado final, primeira ação e contrato do visor.
      - run: node tests/browser_cartaz_animacoes.cjs
      # 01/11/2026: decisão 61, hierarquia e escala nas páginas migradas.
      - run: node tests/hierarquia-cartaz.cjs
      # 01/11/2026: família dos índices, antes/depois, estados, acessibilidade e impressão.
      - run: node tests/browser_cartaz_indices.cjs
        env:
          CARTAZ_INDICES_OUTPUT: ${{ runner.temp }}/cartaz-indices
      - run: node tests/browser_cartaz_indices_contracts.cjs
        if: ${{ !cancelled() }}
        env:
          CARTAZ_INDICES_OUTPUT: ${{ runner.temp }}/cartaz-indices
      # 03/11/2026: abertura e visor real, nos dois temas e nas tres larguras.
      - run: node tests/browser_cartaz_cabecalho.cjs
        env:
          CABECALHO_OUTPUT: ${{ runner.temp }}/cartaz-indices/cabecalho
      # 03/11/2026: ciclos reais completos, três ondas, paragem e zoom nativo nos dois temas.
      - run: node tests/browser_calcada_continua.cjs
        env:
          CALCADA_OUTPUT: ${{ runner.temp }}/cartaz-indices/calcada-continua
      # 02/11/2026: piloto M4, incluindo interseções reais e zoom nativo a 200%.
      - run: node tests/browser_cartaz_m4_piloto.cjs
        env:
          M4_PILOTO_OUTPUT: ${{ runner.temp }}/cartaz-indices/m4-piloto
      - run: node tests/browser_cartaz_m4_interacoes.cjs
        env:
          M4_PILOTO_OUTPUT: ${{ runner.temp }}/cartaz-indices/m4-piloto
      # 03/11/2026: M4-02, acento único e palavra inteira nos dois temas e a 200%.
      - run: node tests/browser_cartaz_m4_acento.cjs
        env:
          M4_PILOTO_OUTPUT: ${{ runner.temp }}/cartaz-indices/m4-acento
      # 01/11/2026: provas de revisão fora das páginas publicadas.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartaz-indices-antes-depois
          path: ${{ runner.temp }}/cartaz-indices
          retention-days: 30
