name: Cartaz pieces
on:
  push:
    paths: ['assets/cartaz-indices.*', 'm[1-9]/index.html', 'scripts/cartaz_indices*', 'tests/fixtures/cartaz-indices*', 'assets/cartaz-components.*', 'assets/appearance.css', 'demonstracoes/cartaz-animacoes/**', 'tests/*cartaz*', '.github/workflows/cartaz-qa.yml']
  pull_request:
    paths: ['assets/cartaz-indices.*', 'm[1-9]/index.html', 'scripts/cartaz_indices*', 'tests/fixtures/cartaz-indices*', 'assets/cartaz-components.*', 'assets/appearance.css', 'demonstracoes/cartaz-animacoes/**', 'tests/*cartaz*', '.github/workflows/cartaz-qa.yml']
jobs:
  pieces:
    runs-on: ubuntu-latest
    steps:
      # 01/11/2026: base disponível para os contratos de isolamento.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 01/11/2026: bateria Python completa, sem excluir famílias.
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/cartaz.test.cjs tests/appearance.test.cjs tests/cartaz_animacoes.test.cjs
      - run: node tests/browser_cartaz.cjs
      # 01/11/2026: movimento, estado final, primeira ação e contrato do visor.
      - run: node tests/browser_cartaz_animacoes.cjs
      # 01/11/2026: decisão 61, hierarquia e escala nas páginas migradas.
      - run: node tests/hierarquia-cartaz.cjs
      # 01/11/2026: família dos índices, antes/depois, estados, acessibilidade e impressão.
      - run: node tests/browser_cartaz_indices.cjs
        env:
          CARTAZ_INDICES_OUTPUT: ${{ runner.temp }}/cartaz-indices
      - run: node tests/browser_cartaz_indices_contracts.cjs
        if: ${{ !cancelled() }}
        env:
          CARTAZ_INDICES_OUTPUT: ${{ runner.temp }}/cartaz-indices
      # 01/11/2026: provas de revisão fora das páginas publicadas.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartaz-indices-antes-depois
          path: ${{ runner.temp }}/cartaz-indices
          retention-days: 30
