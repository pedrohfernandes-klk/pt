name: Cartaz pieces
on:
  push:
    paths: ['assets/cartaz-components.*', 'assets/appearance.css', 'tests/*cartaz*', '.github/workflows/cartaz-qa.yml']
  pull_request:
    paths: ['assets/cartaz-components.*', 'assets/appearance.css', 'tests/*cartaz*', '.github/workflows/cartaz-qa.yml']
jobs:
  pieces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/cartaz.test.cjs tests/appearance.test.cjs
      - run: node tests/browser_cartaz.cjs
      # 01/11/2026: decisão 61, hierarquia e escala nas páginas migradas.
      - run: node tests/hierarquia-cartaz.cjs
