name: Português, hierarquia dos títulos
# 01/11/2026: decisão 61 (o docente viu na entrada do exame um título mais pequeno do que devia). O teste de navegador
# tests/browser_hierarquia_titulos.py abre todas as páginas do sítio a 390 e a 1366 px e corre as regras R1, R2, R3 e R5
# da medição da hierarquia (a função MEASURE de medir-hierarquia.js); falha com qualquer caso novo e com um caso da lista
# datada (PENDENTES_20261101) que já não exista, para que a lista só diminua. A regra vale para toda a árvore publicada
# (páginas, folhas de estilo e scripts partilhados), por isso este workflow não tem filtro de caminhos, como o
# pt-sala-qa.yml. Fica num ficheiro próprio porque o pt-m1-qa.yml, que corre os outros testes de navegador, está nos
# pedidos abertos #148 e #150 e só vigia parte da árvore (não vê obras/ nem c/, nem folhas de estilo partilhadas como
# assets/appearance.css, assets/retro-portals.css e assets/pt-unit-groups.css).
on:
  pull_request:
permissions:
  contents: read
jobs:
  hierarquia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Títulos na ordem certa em todas as páginas, a 390 e a 1366 px
        run: python tests/browser_hierarquia_titulos.py
