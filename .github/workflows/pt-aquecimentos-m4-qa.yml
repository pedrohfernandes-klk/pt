name: Português M4, aquecimentos em cartões
on:
  pull_request:
    paths:
      - 'docs/pedagogia/aquecimentos/**'
      - 'tarefas/**/aquecimento/**'
      - 'scripts/aquecimentos.py'
      - 'scripts/auditar_aquecimentos_m1.py'
      - 'tests/*aquecimentos*'
      - '.github/workflows/pt-aquecimentos-m4-qa.yml'
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 30/10/2026: M4, sem omitir testes ou adaptar os contratos literais.
      - name: Suite completa em Linux
        run: python -m unittest discover -s tests
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Todos os aquecimentos e ligações já integradas
        run: python tests/browser_task_aquecimentos.py
      - name: Respostas certas e todas as opções erradas do M4
        run: python tests/browser_aquecimentos_m4_feedback.py
