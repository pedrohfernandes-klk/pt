name: Português formatação
on:
  pull_request:
permissions:
  contents: read
jobs:
  formatacao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # 13/11/2026: a bateria completa inclui o teste das tarefas do M7, que compara a árvore com o main de partida (git show).
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bateria completa e camadas
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/verificar_camadas.py
          python scripts/medir_opcoes.py --regra
          node --check assets/exame/app.js
      - name: Instalar navegador
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verificar a apresentação corrigida
        run: python tests/browser_varredura_formatacao.py
