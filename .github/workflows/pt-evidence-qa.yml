name: Português — QA de evidências M3 M5 M7
on:
  pull_request:
    paths:
      - 'm3/**'
      - 'm5/**'
      - 'm7/**'
      - 'tests/**'
      - '.github/workflows/pt-evidence-qa.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            m3
            m5
            m7
            assets
            tests
            .github
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar evidência pedagógica e dados
        run: |
          python -m unittest discover -s tests -p test_learning_evidence_m3_m5_m7.py -v
          python -m unittest discover -s tests -p test_m3_f03_perspective.py -v
      - name: Instalar Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Exercitar cartões no navegador
        run: python tests/browser_learning_evidence.py
