<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Uma decisão entre muitos · Cidadania · Ser-se humano</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet"><style>:root{--tinta:#000;--papel:#fff;--papel2:#faf8f2;--suave:#444;--fundo:#f3f2ee;--mostarda:#d9a520;--vermelho:#c8232c}@media (prefers-color-scheme:dark){:root{--tinta:#ecebe5;--papel:#121210;--papel2:#1a1a17;--suave:#b3b1aa;--fundo:#1d1d1a;--mostarda:#e0b23a;--vermelho:#e4555c}}*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.5 Arial,Helvetica,sans-serif}

/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

filas, com gestos e direções de olhar diferentes.\" width=\"787\" height=\"446\" loading=\"lazy\"><figcaption>John Morgan, O júri, 1861. Uma representação britânica do século XIX, não um fotograma de Doze Homens em Fúria. John Morgan. Domínio público no registo de origem (<a href=\"https://commons.wikimedia.org/wiki/File:The_Jury_by_John_Morgan.jpg\">Wikimedia Commons</a>), consulta de 2026-10-14.</figcaption></figure><h3>As diferenças</h3><p>Observa as orientações do corpo, das mãos e dos olhos. O grupo é apresentado como um conjunto de pessoas, não como uma única expressão.</p><h3>A composição</h3><p>Procura quem ocupa o centro e quem está nas margens. Distingue destaque visual de poder efetivo: a composição não prova quem decide melhor.</p><h3>A ausência</h3><p>O quadro mostra os jurados; não mostra a pessoa sobre quem decidem. Que cuidados exige decidir sobre quem não está presente?</p>"},{"t":"ler","rot":"Conhecer","titulo":"A obra e o problema","html":"<h3>Da escolha individual à decisão coletiva</h3><p>Uma votação conta posições. Uma deliberação põe razões em confronto, permite perguntas e pode alterar as escolhas. Uma decisão democrática precisa de mais do que uma contagem: participação, informação, igualdade de tratamento e limites ao poder. Os direitos de uma pessoa não se tornam dispensáveis porque um grupo prefere ignorá-los.</p><h3>O que muda entre os jurados</h3><p>Em Doze Homens em Fúria, o espaço fechado concentra os corpos, as falas e as tensões. Um ator pode tornar visível uma mudança por uma pausa, um olhar, uma deslocação ou uma resposta. Ao analisar, identifica a ação observável e explica a relação com o argumento. Um tom convincente não garante que a informação seja verdadeira.</p><h3>Sylvia e o gesto de interromper</h3><p>Sylvia usa o que sabe para tentar alterar a situação de Truman. A sua intervenção ajuda a pensar a responsabilidade de quem participa num sistema e reconhece uma injustiça. CHIROPTERA oferece outra experiência de muitos corpos num espaço comum. Comparar estes casos permite perguntar quem tem voz e como uma ação individual se relaciona com uma ação coletiva.</p><h3>Para consultar</h3><ul class=\"fontes-cid\"><li><a href=\"https://www.loc.gov/item/96513458/\">Library of Congress, 12 Angry Men, Sidney Lumet, 1957</a></li><li><a href=\"https://unric.org/pt/declaracao-universal-dos-direitos-humanos/\">ONU / UNRIC, Declaração Universal dos Direitos Humanos</a></li><li><a href=\"https://damienjalet.com/project/chiroptera/\">Damien Jalet, CHIROPTERA, JR, Damien Jalet e Thomas Bangalter</a></li></ul>"},{"t":"ler","rot":"Relacionar","titulo":"Das palavras à situação","html":"<p>Estas palavras ajudam a nomear o que estamos a observar.</p><dl class=\"termos\"><div class=\"termo\"><dt>Democracia</dt><dd>Forma de organizar o poder político com participação, direitos, debate público e limites a quem decide.<span class=\"exemplo\">Por exemplo: Poder questionar uma decisão e dispor de procedimentos que protejam a igualdade.</span></dd></div><div class=\"termo\"><dt>Deliberação</dt><dd>Discussão em que se examinam razões e objeções antes de decidir.<span class=\"exemplo\">Por exemplo: Rever uma acusação quando surge informação que a põe em causa.</span></dd></div><div class=\"termo\"><dt>Maioria</dt><dd>Conjunto que reúne mais votos numa decisão.<span class=\"exemplo\">Por exemplo: A maioria indica uma distribuição de escolhas, não demonstra automaticamente a verdade.</span></dd></div><div class=\"termo\"><dt>Minoria</dt><dd>Conjunto que reúne menos votos ou uma posição menos representada.<span class=\"exemplo\">Por exemplo: Uma posição minoritária pode apresentar uma razão que o grupo precisa de examinar.</span></dd></div><div class=\"termo\"><dt>Preconceito</dt><dd>Juízo formado antes de avaliar adequadamente a pessoa ou a situação.<span class=\"exemplo\">Por exemplo: Supor que a origem de alguém demonstra como agiu num caso concreto.</span></dd></div></dl><div class=\"ponte\"><div><h3>No grupo</h3><p>As pessoas podem concordar por razões diferentes ou discordar com informação relevante.</p></div><div><h3>Na democracia</h3><p>As razões devem poder ser discutidas e os direitos das pessoas afetadas devem ser protegidos.</p></div></div><p class=\"abre\">Rever uma posição pode mostrar rigor, e não uma derrota pessoal.</p>"},{"t":"posicao","rot":"A maioria já decidiu","cena":"Situação inventada: um grupo quer excluir um colega de um projeto. Quase todos acreditam que ele divulgou informação privada.","p":"O que propões?","opcoes":[{"rotulo":"Acompanhar a maioria.","comentario":"Guardaste a tua posição. Vem aí nova informação."},{"rotulo":"Pedir verificação e ouvir o colega.","comentario":"Guardaste a tua posição. Vem aí nova informação."},{"rotulo":"Defender o colega sem verificar nada.","comentario":"Guardaste a tua posição. Vem aí nova informação."}],"g":0},{"t":"ler","rot":"Nova informação","titulo":"A maioria já decidiu","html":"<p class=\"abre\">A acusação assenta numa captura de ecrã cortada. A pessoa acusada ainda não foi ouvida e existe outra explicação possível.</p><p>Com esta informação, manténs a posição?</p>","g":1},{"t":"posicao","rot":"Decidir outra vez","cena":"","p":"O que propões agora?","opcoes":[{"rotulo":"Suspender a decisão para verificar a informação.","comentario":"A revisão reconhece limites na evidência. Não declara automaticamente a pessoa inocente; procura um procedimento mais justo."},{"rotulo":"Manter a exclusão porque a maioria continua a concordar.","comentario":"A quantidade de votos não corrige a fragilidade da informação nem a ausência da voz de quem é afetado."},{"rotulo":"Concluir imediatamente que a acusação foi uma mentira deliberada.","comentario":"Uma acusação pouco sustentada não prova, por si só, intenção de mentir. Também essa conclusão precisa de evidência."}],"g":2},{"t":"posicoes","rot":"Quem interrompe o espetáculo?","cena":"","p":"Regressa à tempestade de Truman e à intervenção de Sylvia.","papeis":[{"rotulo":"Ator","texto":"Pode continuar o papel, questionar o guião ou recusar uma ação que prejudica uma pessoa. Sylvia procura devolver informação a Truman."},{"rotulo":"Equipa","texto":"Dispõe de informação e meios técnicos. Deve perguntar pelo perigo real e pela possibilidade de interromper uma decisão."},{"rotulo":"Público","texto":"Pode consumir o espetáculo, recusar alimentá-lo ou exigir a defesa da pessoa. O prazer de assistir não resolve a responsabilidade."}],"fb":"Em CHIROPTERA, muitos corpos constroem uma experiência comum. No debate cívico, uma ação coletiva também exige perguntar quem participa, quem fica de fora e como se tratam as diferenças.","g":3},{"t":"ler","rot":"Na sala","titulo":"Ler, representar, discutir","html":"<p>As propostas seguintes fazem-se oralmente e com o corpo. O docente escolhe a sequência adequada à aula.</p><h3>Leitura sentada</h3><p>Texto original: A, «Somos nove a pensar assim.» B, «Qual é a razão que os nove apresentam?» C, «Ainda não ouvimos a pessoa afetada.» Distingue contagem, fundamento e participação.</p><h3>Imagem de grupo</h3><p>Cria uma imagem de decisão coletiva com uma posição minoritária. Altera apenas a orientação dos olhares para mostrar uma passagem de isolamento a escuta.</p><h3>Debate de posições</h3><p>Cada grupo recebe uma posição. Antes da resposta, deve resumir fielmente o argumento anterior. A turma assinala quando alguém responde à razão apresentada e quando muda de assunto.</p><p class=\"fonte\">As falas identificadas como texto original foram criadas para estas atividades. Não são excertos dos autores estudados.</p>"},{"t":"ler","rot":"Rever","titulo":"O que levo deste passo","html":"<ul><li>Contar votos e discutir razões são ações diferentes.</li><li>Maioria e verdade não são sinónimos; discordância também precisa de fundamento.</li><li>Analisa informação, procedimentos e direitos na mesma decisão.</li></ul><h3>Do exemplo à explicação</h3><div class=\"modelo\"><div><span>O exemplo</span><p>O grupo quer excluir alguém com base numa imagem incompleta.</p></div><div><span>O que permite perceber</span><p>A maioria de votos não corrige a falta de verificação nem a ausência da pessoa acusada.</p></div><div><span>A ligação ao argumento</span><p>A legitimidade de uma decisão depende também do procedimento que a tornou possível.</p></div></div><h3>Uma posição minoritária é sempre mais justa?</h3><p>Não. Deve ser examinada pelas razões e evidências que apresenta, tal como uma posição maioritária.</p>"},{"t":"ler","rot":"Para levar","escuro":true,"html":"<p class=\"levar\">Discordar também participa</p><p>Uma democracia exige participação, informação, direitos e limites ao poder. Uma maioria pode tomar decisões e, ainda assim, ter de rever o modo como tratou uma pessoa.</p><div class=\"cid-debate\"><b>Para debater</b>que condições tornam uma decisão coletiva mais justa?</div>"}],chave:"epi-cidadania-m1-passo-09",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/pt/cidadania/m1/",percursoRotulo:"Os passos",voltarRotulo:"Voltar aos passos",seguinte:"https://pedrohfernandes-klk.github.io/pt/cidadania/m1/passo-10/",seguinteRotulo:"Passo seguinte",depois:"<div class=\"c\"><p class=\"rot\">Aprendeste</p><p>Distinguir votação de deliberação; reconhecer o valor da discordância fundamentada, da igualdade e da revisão de uma decisão.</p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m1/glossario/\">Palavras explicadas</a> · <a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m1/oficina/\">Preparar um argumento para o ensaio</a></p></div>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["passo-09"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
