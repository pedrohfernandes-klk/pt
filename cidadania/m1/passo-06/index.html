<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>A pistola e a prova · Cidadania · Ser-se humano</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet"><style>:root{--tinta:#000;--papel:#fff;--papel2:#faf8f2;--suave:#444;--fundo:#f3f2ee;--mostarda:#d9a520;--vermelho:#c8232c}@media (prefers-color-scheme:dark){:root{--tinta:#ecebe5;--papel:#121210;--papel2:#1a1a17;--suave:#b3b1aa;--fundo:#1d1d1a;--mostarda:#e0b23a;--vermelho:#e4555c}}*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.5 Arial,Helvetica,sans-serif}

.c-prim[data-seguinte]::after,.c-prim[data-confirmar]::after,.c-prim.c-vai::after{content:"→"}
.casca-folha{position:absolute;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.7,.2,1);background:var(--papel,#fff);color:var(--tinta,#000);box-shadow:0 -1px 0 rgba(0,0,0,.18),0 -12px 30px rgba(0,0,0,.08)}

.casca-menu .c-menu-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px}.casca-menu .c-menu-cab p{font:700 .74rem/1.35 Arial;letter-spacing:.1em;text-transform:uppercase;color:var(--suave,#444);margin:0}

.casca-menu nav a::after{content:"→";margin-left:auto;font-weight:400}

.casca-video{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}.casca-video .cx{background:#111;color:#f2f0ea;width:100%;max-width:420px;max-height:96vh;max-height:96dvh;display:flex;flex-direction:column;gap:8px;padding:12px;box-sizing:border-box}.casca-video .tt{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 .8rem Arial;letter-spacing:.1em;text-transform:uppercase;color:#d9a520}.casca-video video{width:100%;max-height:72vh;max-height:72dvh;background:#000;display:block}.casca-video .rodape-como{display:flex;justify-content:space-between;align-items:center;gap:10px}.casca-video button,.casca-video a{display:inline-flex;align-items:center;font:700 1rem Arial;color:#f2f0ea;background:none;border:0;min-height:44px;padding:0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

ão dramática tem de ser investigada nos seus textos, não deduzida da expressão do rosto.</p><h3>O nome</h3><p>Neste passo, Tchékhov designa Anton Tchékhov, o dramaturgo. A referência à arma trata da construção da narrativa.</p><h3>A passagem de contexto</h3><p>Uma arma num texto, uma pistola numa performance e um objeto apresentado como prova são situações diferentes. Antes de comparar, identifica o que está em causa em cada uma.</p>"},{"t":"ler","rot":"Conhecer","titulo":"A obra e o problema","html":"<h3>Um segundo filme, outra posição</h3><p>Doze Homens em Fúria, de Sidney Lumet, estreou em 1957. Um júri de doze homens discute um processo de homicídio. Um jovem acusado não está na sala onde se decide a sua situação. Um jurado resiste a uma conclusão apressada. O filme concentra a atenção nos argumentos, nos preconceitos e nas mudanças de posição. Apresenta um júri dos Estados Unidos, não os tribunais portugueses.</p><h3>A arma na narrativa</h3><p>Anton Tchékhov foi um escritor e dramaturgo russo. Numa carta de 1889, usa a imagem de uma arma colocada em cena para discutir a preparação e o desenvolvimento de uma peça. Um elemento destacado cria expectativas. A questão é o sentido que esse elemento terá na construção da obra. Uma expectativa narrativa não é uma autorização moral para produzir violência real.</p><h3>A pistola de Abramović</h3><p>Em Rhythm 0, de 1974, Marina Abramović colocou objetos à disposição dos participantes, incluindo uma pistola e uma bala. A sua imobilidade e a intervenção do público levantam perguntas sobre poder e limites. Truman, pelo contrário, desconhece o programa. A comparação deve considerar esta diferença de consentimento e perguntar o que exige de quem assiste um perigo que se torna real.</p><h3>Para consultar</h3><ul class=\"fontes-cid\"><li><a href=\"https://www.loc.gov/item/96513458/\">Library of Congress, 12 Angry Men, Sidney Lumet, 1957</a></li><li><a href=\"https://www.bfi.org.uk/features/sidney-lumets-first-last-films-12-angry-men-before-devil-knows-youre-dead\">BFI, Doze Homens em Fúria: espaço, atores e deliberação</a></li><li><a href=\"https://predanie.ru/book/221237-pisma-1888-1889/?chapter=chapter_224\">Anton Tchékhov, carta a Lazarev, 1 de novembro de 1889, original russo</a></li><li><a href=\"https://www.moma.org/audio/playlist/243/3118\">MoMA, Marina Abramović fala sobre Rhythm 0</a></li><li><a href=\"https://unric.org/pt/declaracao-universal-dos-direitos-humanos/\">ONU / UNRIC, Declaração Universal dos Direitos Humanos</a></li></ul>"},{"t":"ler","rot":"Relacionar","titulo":"Das palavras à situação","html":"<p>Estas palavras ajudam a nomear o que estamos a observar.</p><dl class=\"termos\"><div class=\"termo\"><dt>Expectativa</dt><dd>Aquilo que esperamos que aconteça a partir de pistas.<span class=\"exemplo\">Por exemplo: Um objeto destacado pode levar o público a esperar uma ação.</span></dd></div><div class=\"termo\"><dt>Prova</dt><dd>Elemento usado para sustentar uma afirmação sobre um facto.<span class=\"exemplo\">Por exemplo: Um objeto ou um depoimento precisa de ser relacionado com o que se quer demonstrar.</span></dd></div><div class=\"termo\"><dt>Depoimento</dt><dd>Declaração de alguém sobre factos que conhece ou diz conhecer.<span class=\"exemplo\">Por exemplo: O júri precisa de avaliar o que foi observado e em que condições.</span></dd></div><div class=\"termo\"><dt>Presunção de inocência</dt><dd>Princípio segundo o qual uma pessoa acusada é considerada inocente até a culpa ser estabelecida num processo justo.<span class=\"exemplo\">Por exemplo: Uma suspeita não substitui a demonstração exigida para condenar.</span></dd></div></dl><div class=\"ponte\"><div><h3>Na narrativa</h3><p>Perguntamos que efeito uma pista prepara e como se desenvolve.</p></div><div><h3>Na decisão cívica</h3><p>Perguntamos o que a informação permite concluir e que ação é justificável.</p></div></div><p class=\"abre\">Aquilo que esperamos não substitui a evidência nem decide o que é justo fazer.</p>"},{"t":"posicao","rot":"Tem de acontecer?","cena":"Situação inventada: uma arma é apresentada como elemento importante numa cena. O público começa a esperar um disparo.","p":"Que desenvolvimento escolherias para explorar a responsabilidade?","opcoes":[{"rotulo":"A personagem dispara.","comentario":"A expectativa pode cumprir-se. Mas o efeito dramático não torna a violência inevitável nem moralmente justificada. Que consequências mostra a cena?"},{"rotulo":"Outra personagem retira a arma.","comentario":"A intervenção interrompe uma possibilidade anunciada. Também pode ter força dramática: transforma a prevenção numa ação visível."},{"rotulo":"A personagem decide não disparar.","comentario":"A recusa pode contrariar a expectativa e revelar uma escolha. A análise deve explicar como a preparação da cena dá sentido a essa recusa."}],"g":0},{"t":"escolha","rot":"Pistola e consentimento","p":"Em Rhythm 0, Abramović colocou objetos à disposição do público, incluindo uma pistola e uma bala. Na tempestade, Truman corre um perigo criado por Christof. Que diferença deve entrar na comparação?","o":["Abramović definiu uma situação de participação; Truman desconhece o programa. Isso não elimina a responsabilidade de quem presencia perigo.","Aceitar participar elimina qualquer responsabilidade do público.","As duas situações têm exatamente o mesmo consentimento."],"c":0,"f":"A comparação permite discutir consentimento e intervenção, sem equiparar as duas situações. A presença de uma arma não impõe a obrigação moral de a usar.","g":1},{"t":"escolha","rot":"Um objeto prova tudo?","p":"Em Doze Homens em Fúria, o júri analisa objetos, depoimentos e interpretações. Qual é a atitude mais rigorosa perante uma prova aparentemente decisiva?","o":["Examinar o que mostra, o que não mostra e as condições da sua interpretação.","Concluir que um objeto nunca serve de prova.","Aceitar a primeira explicação porque parece convincente."],"c":0,"f":"O valor de uma prova depende da relação que estabelece com o facto em causa. Questionar essa relação não equivale a negar toda a evidência.","g":2},{"t":"ler","rot":"Na sala","titulo":"Ler, representar, discutir","html":"<p>As propostas seguintes fazem-se oralmente e com o corpo. O docente escolhe a sequência adequada à aula.</p><h3>Leitura sentada</h3><p>Texto original: A, «Já sabemos o que aconteceu.» B, «Sabemos ou estamos a supor?» Lê as duas posições e identifica a informação que cada uma teria de apresentar.</p><h3>Imagem de grupo</h3><p>Cria um grupo que decide sobre uma cadeira vazia. A cadeira representa a pessoa ausente. Altera a imagem para tornar visível a possibilidade de essa pessoa ser ouvida.</p><h3>Debate de posições</h3><p>Uma posição pede uma decisão imediata; outra pede verificação. Cada uma indica um risco da sua própria proposta e um modo de lhe responder.</p><p class=\"fonte\">As falas identificadas como texto original foram criadas para estas atividades. Não são excertos dos autores estudados.</p>"},{"t":"ler","rot":"Rever","titulo":"O que levo deste passo","html":"<ul><li>O segundo filme centra-se numa decisão sobre uma pessoa ausente.</li><li>Uma suspeita ou expectativa não equivale a uma prova suficiente.</li><li>Na comparação com Abramović, explica a diferença de consentimento.</li></ul><h3>Do exemplo à explicação</h3><div class=\"modelo\"><div><span>O exemplo</span><p>No segundo filme, os jurados precisam de avaliar a informação antes de decidir.</p></div><div><span>O que permite perceber</span><p>A pressão para concluir rapidamente pode fazer com que uma primeira impressão seja tratada como certeza.</p></div><div><span>A ligação ao argumento</span><p>Um procedimento justo exige tempo e condições para examinar razões, sem transformar qualquer dúvida numa desculpa para nunca decidir.</p></div></div><h3>A dúvida prova automaticamente que uma pessoa não praticou um ato?</h3><p>Não. Questionar a suficiência da prova é diferente de demonstrar com certeza uma versão alternativa dos acontecimentos.</p>"},{"t":"ler","rot":"Para levar","escuro":true,"html":"<p class=\"levar\">Três objetos, três problemas</p><p>Tchékhov permite discutir a preparação narrativa; Abramović, os limites da participação; Lumet, a avaliação de provas. São relações a investigar, não situações equivalentes.</p><div class=\"cid-debate\"><b>Para debater</b>quando confundimos o que esperamos com aquilo que sabemos?</div>"}],chave:"epi-cidadania-m1-passo-06",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/pt/cidadania/m1/",percursoRotulo:"Os passos",voltarRotulo:"Voltar aos passos",seguinte:"https://pedrohfernandes-klk.github.io/pt/cidadania/m1/passo-07/",seguinteRotulo:"Passo seguinte",depois:"<div class=\"c\"><p class=\"rot\">Aprendeste</p><p>Distinguir expectativa dramática, consentimento e evidência. O filme decorre num júri dos Estados Unidos; não apresenta o funcionamento dos tribunais portugueses.</p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m1/glossario/\">Palavras explicadas</a> · <a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m1/oficina/\">Preparar um argumento para o ensaio</a></p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m1/guiao-2/\">Segundo filme: guião de investigação de Doze Homens em Fúria</a></p></div>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["passo-06"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
