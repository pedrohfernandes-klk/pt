<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>O lugar do outro · Cidadania · Ser-se humano</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet"><style>:root{--tinta:#000;--papel:#fff;--papel2:#faf8f2;--suave:#444;--fundo:#f3f2ee;--mostarda:#d9a520;--vermelho:#c8232c}@media (prefers-color-scheme:dark){:root{--tinta:#ecebe5;--papel:#121210;--papel2:#1a1a17;--suave:#b3b1aa;--fundo:#1d1d1a;--mostarda:#e0b23a;--vermelho:#e4555c}}*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.5 Arial,Helvetica,sans-serif}

/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)}
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

dc08tKlfV8vcb06mBE+ljyUuN2WMu3J7/FsjKj0MQh9+xk12NA3Ia2pjD451y3YBiuHJrJLJcVgeR0LrUH/V/wtcbJHiccKj4kB+kF14yDZ6cgwtk1zQoADYIYCx0JJgwAAEA860AAf3jW/6vwODeADEZ2xU+oQrf7bCuv5p7CdANTYfAnZWeYKxbVr/S2UYtfhsAAARp5KXfYESt75QWOd2u/H18pg34UnzUqU5UqaB/IADHprC6dtxwa8tnls8tlx9UogegtiP6AACzupuxdjTXmCj69SmzKfnW+ih3YeLNJminEunu1Cmz1bUdXSBbS6t1CHT2fyTv/mHqUyMs8iTK1uZQDAvq0V4LmJs3ufIv6YxDq5BsQiULsACvJjIoiZC6/0AMwlw24ADoIAAA==\" alt=\"Retrato de um homem de cabelo escuro, com barba e brinco, tradicionalmente identificado como Shakespeare.\" width=\"400\" height=\"513\" loading=\"lazy\"><figcaption>Retrato Chandos, tradicionalmente identificado como William Shakespeare, início do século XVII. A identificação do retratado não é absolutamente segura. atribuído a John Taylor. Domínio público no registo de origem (<a href=\"https://commons.wikimedia.org/wiki/File:William_Shakespeare_Chandos_Portrait.jpg\">Wikimedia Commons</a>), consulta de 2026-10-14.</figcaption></figure><h3>O retrato</h3><p>Distingue aquilo que a imagem mostra daquilo que sabes sobre o autor. Uma expressão pintada não demonstra o carácter nem as opiniões de alguém.</p><h3>A identificação</h3><p>A legenda indica uma atribuição tradicional, não uma certeza absoluta. A forma como uma fonte apresenta as suas dúvidas faz parte da informação.</p><h3>Quem fala</h3><p>Passa do autor para a personagem: Shakespeare escreveu Shylock, mas autor e personagem não têm de defender a mesma posição em cada fala.</p>"},{"t":"ler","rot":"Conhecer","titulo":"A obra e o problema","html":"<h3>Uma pessoa não tem de ser parecida contigo</h3><p>A dignidade é o valor que reconhecemos a cada pessoa por ser pessoa. Não depende de ser simpática, útil, popular ou semelhante a nós. Os direitos humanos partem deste reconhecimento. Podemos criticar uma ação e continuar a reconhecer direitos a quem a praticou. A igualdade de dignidade não significa que todas as pessoas tenham a mesma história ou as mesmas condições de vida.</p><h3>Shakespeare e Shylock</h3><p>Shakespeare escreveu teatro em Inglaterra entre os séculos XVI e XVII. Em O Mercador de Veneza, Shylock é um judeu que vive num meio marcado pela hostilidade contra os judeus. No ato III, cena 1, reclama o reconhecimento de uma humanidade comum. O discurso também caminha para a vingança. A passagem obriga a discutir as duas coisas: discriminação sofrida e responsabilidade pelas ações.</p><h3>The Egg: imaginar o lugar de todos</h3><p>The Egg é um conto de Andy Weir. Uma personagem descobre uma possibilidade imaginária: todas as vidas humanas estariam ligadas à sua própria existência. O conto transforma o modo como olhamos para quem é diferente ou desconhecido. É uma proposta de ficção para pensar a empatia. Não é uma demonstração científica sobre a vida ou a morte.</p><h3>Shakespeare, O Mercador de Veneza, ato III, cena 1</h3><blockquote class=\"cid-cena\">Um judeu não tem olhos? Não tem um judeu mãos, órgãos, corpo, sentidos, afetos, paixões? […] Se nos picam, não sangramos? Se nos fazem cócegas, não rimos? Se nos envenenam, não morremos? E, se nos fazem mal, não havemos de nos vingar? Se somos como vós no resto, também nisso nos pareceremos.</blockquote><p class=\"fonte\">Tradução própria de um excerto do original em domínio público. As reticências assinalam uma omissão. Procura a passagem da humanidade comum para a justificação da vingança.</p><h3>Para consultar</h3><ul class=\"fontes-cid\"><li><a href=\"https://www.folger.edu/explore/shakespeares-works/the-merchant-of-venice/read/3/1/\">Folger Shakespeare Library, O Mercador de Veneza, III, 1</a></li><li><a href=\"https://galactanet.com/oneoff/theegg_mod.html\">Andy Weir, The Egg, original em inglês</a></li><li><a href=\"https://unric.org/pt/declaracao-universal-dos-direitos-humanos/\">ONU / UNRIC, Declaração Universal dos Direitos Humanos</a></li></ul>"},{"t":"ler","rot":"Relacionar","titulo":"Das palavras à situação","html":"<p>Estas palavras ajudam a nomear o que estamos a observar.</p><dl class=\"termos\"><div class=\"termo\"><dt>Humanismo</dt><dd>Perspetiva que coloca o valor da pessoa e a sua capacidade de pensar, agir e viver com os outros no centro da reflexão.<span class=\"exemplo\">Por exemplo: Perguntar se o programa respeita Truman como pessoa, e não apenas como produto.</span></dd></div><div class=\"termo\"><dt>Dignidade</dt><dd>Valor de uma pessoa que não depende da sua utilidade ou popularidade.<span class=\"exemplo\">Por exemplo: Truman merece respeito mesmo que o público goste do programa.</span></dd></div><div class=\"termo\"><dt>Empatia</dt><dd>Procurar compreender a experiência ou o ponto de vista de outra pessoa.<span class=\"exemplo\">Por exemplo: Perguntar como viverias a divulgação de uma imagem tua sem autorização.</span></dd></div><div class=\"termo\"><dt>Discriminação</dt><dd>Tratamento desfavorável ligado a uma característica ou pertença.<span class=\"exemplo\">Por exemplo: Excluir alguém pela sua origem, em vez de avaliar a situação com critérios justos.</span></dd></div><div class=\"termo\"><dt>Igualdade</dt><dd>Reconhecimento dos mesmos direitos e da igual dignidade.<span class=\"exemplo\">Por exemplo: Os direitos não desaparecem quando uma pessoa é impopular.</span></dd></div></dl><div class=\"ponte\"><div><h3>Nas obras</h3><p>Shylock reclama humanidade; The Egg propõe imaginar a ligação entre vidas diferentes.</p></div><div><h3>Na cidadania</h3><p>A igualdade de direitos não pode depender de conseguirmos gostar de toda a gente.</p></div></div><p class=\"abre\">A empatia ajuda a compreender; a dignidade dá uma base que também vale quando a empatia falha.</p>"},{"t":"emparelhar","rot":"Direitos em cena","p":"Seleciona um par de cada vez.","pares":[["Filmar e transmitir a intimidade de Truman sem o seu conhecimento.","Vida privada · artigo 12.º"],["Ocultar a realidade do programa e afastar quem tenta revelá-la.","Liberdade de informação · artigo 19.º"],["Tratar uma vida como um produto subordinado às audiências.","Igual dignidade · artigo 1.º"]],"f":"A exposição permanente impede Truman de decidir sobre a sua intimidade. Sem acesso à informação, Truman não consegue avaliar a sua situação. A dignidade da pessoa não depende do lucro ou do interesse do público.","g":0},{"t":"posicoes","rot":"Quem está do outro lado?","cena":"","p":"Situação inventada: um vídeo embaraçoso de um colega circula entre pessoas da escola.","papeis":[{"rotulo":"Quem partilha","texto":"Acha graça ao vídeo e não pensa no efeito da circulação. O facto de já existir não resolve a questão do consentimento."},{"rotulo":"Quem aparece","texto":"Não autorizou a publicação e teme que o vídeo passe a definir a forma como os outros o veem."},{"rotulo":"Quem assiste","texto":"Pode continuar a circulação, recusar partilhar ou procurar apoiar a pessoa exposta."}],"fb":"The Egg convida a imaginar o lugar do outro. Shakespeare permite perguntar por que razão alguém precisa de reclamar o reconhecimento da sua humanidade.","g":1},{"t":"ler","rot":"Na sala","titulo":"Ler, representar, discutir","html":"<p>As propostas seguintes fazem-se oralmente e com o corpo. O docente escolhe a sequência adequada à aula.</p><h3>Leitura sentada</h3><p>Lê a passagem de Shylock apresentada em «Conhecer». Primeiro, identifica o que a personagem reclama; depois, procura o ponto em que aparece a justificação da vingança.</p><h3>Imagem de grupo</h3><p>Uma pessoa fica fora de uma imagem de grupo. O grupo altera um único gesto para mostrar inclusão. A turma pergunta se o gesto muda também a possibilidade real de participar.</p><h3>Debate de posições</h3><p>Distribui «reconhecer a injustiça» e «avaliar a reação». Cada grupo deve reconhecer uma razão do outro antes de apresentar a sua objeção.</p><p class=\"fonte\">As falas identificadas como texto original foram criadas para estas atividades. Não são excertos dos autores estudados.</p>"},{"t":"ler","rot":"Rever","titulo":"O que levo deste passo","html":"<ul><li>Dignidade e simpatia não são a mesma coisa.</li><li>Compreender uma reação não obriga a considerá-la justa.</li><li>Relaciona um direito com um exemplo concreto, explicando o efeito sobre a pessoa.</li></ul><h3>Do exemplo à explicação</h3><div class=\"modelo\"><div><span>O exemplo</span><p>O programa expõe a intimidade de Truman sem ele o saber.</p></div><div><span>O que permite perceber</span><p>A pessoa afetada não pode aceitar ou recusar essa exposição.</p></div><div><span>A ligação ao argumento</span><p>O direito à vida privada protege uma possibilidade de decisão, e não apenas um desejo de esconder algo.</p></div></div><h3>Uma pessoa perde os seus direitos por ter uma atitude de que discordamos?</h3><p>Não. Podemos avaliar e responsabilizar ações sem negar a dignidade e os direitos da pessoa.</p>"},{"t":"ler","rot":"Para levar","escuro":true,"html":"<p class=\"levar\">Reconhecer não é idealizar</p><p>Uma pessoa pode merecer reconhecimento e, ao mesmo tempo, ter ações que devemos criticar. A discriminação sofrida por Shylock não torna automaticamente justa a vingança.</p><div class=\"cid-debate\"><b>Para debater</b>a empatia muda apenas o que sentimos ou também aquilo que fazemos?</div>"}],chave:"epi-cidadania-m1-passo-03",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/pt/cidadania/m1/",percursoRotulo:"Os passos",voltarRotulo:"Voltar aos passos",seguinte:"https://pedrohfernandes-klk.github.io/pt/cidadania/m1/passo-04/",seguinteRotulo:"Passo seguinte",depois:"<div class=\"c\"><p class=\"rot\">Aprendeste</p><p>Relacionar igualdade e dignidade com situações concretas, sem reduzir uma pessoa à sua utilidade ou pertença.</p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m1/glossario/\">Palavras explicadas</a> · <a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m1/oficina/\">Preparar um argumento para o ensaio</a></p></div>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["passo-03"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
