<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>A economia da atenção · Cidadania · Os algoritmos</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet"><style>:root{--tinta:#000;--papel:#fff;--papel2:#faf8f2;--suave:#444;--fundo:#f3f2ee;--mostarda:#d9a520;--vermelho:#c8232c}@media (prefers-color-scheme:dark){:root{--tinta:#ecebe5;--papel:#121210;--papel2:#1a1a17;--suave:#b3b1aa;--fundo:#1d1d1a;--mostarda:#e0b23a;--vermelho:#e4555c}}*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.5 Arial,Helvetica,sans-serif}

.casca-corpo{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;padding:0 max(10px,env(safe-area-inset-right)) calc(var(--folha-h,0px) + var(--d1)) max(10px,env(safe-area-inset-left));outline:0}

.c-prim[data-seguinte]::after,.c-prim[data-confirmar]::after,.c-prim.c-vai::after{content:"→"}
.casca-folha{position:absolute;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.7,.2,1);background:var(--papel,#fff);color:var(--tinta,#000);box-shadow:0 -1px 0 rgba(0,0,0,.18),0 -12px 30px rgba(0,0,0,.08)}

.casca-menu[hidden]{display:none}
.casca-menu .c-menu-in{width:min(340px,88vw);height:100%;background:var(--papel,#fff);color:var(--tinta,#000);overflow-y:auto;box-sizing:border-box;padding:max(10px,env(safe-area-inset-top)) 18px 18px;animation:cMenu .2s ease-out}
@keyframes cMenu{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.casca-menu .c-menu-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px}.casca-menu .c-menu-cab p{font:700 .74rem/1.35 Arial;letter-spacing:.1em;text-transform:uppercase;color:var(--suave,#444);margin:0}

.casca-menu nav a::after{content:"→";margin-left:auto;font-weight:400}

.casca-video{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}.casca-video .cx{background:#111;color:#f2f0ea;width:100%;max-width:420px;max-height:96vh;max-height:96dvh;display:flex;flex-direction:column;gap:8px;padding:12px;box-sizing:border-box}.casca-video .tt{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 .8rem Arial;letter-spacing:.1em;text-transform:uppercase;color:#d9a520}.casca-video video{width:100%;max-height:72vh;max-height:72dvh;background:#000;display:block}.casca-video .rodape-como{display:flex;justify-content:space-between;align-items:center;gap:10px}.casca-video button,.casca-video a{display:inline-flex;align-items:center;font:700 1rem Arial;color:#f2f0ea;background:none;border:0;min-height:44px;padding:0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

pUyrGxRXRNYn1NTkfNt9Pd0g7jdomilzRk/h58ptOWzoyHtgqJdI4wdriijCtvwct0wGrMhS5ojjJ2eaTzDIgsi19c67u16FOcgEDuzw7BtFYfKySVF9KZ9KxUQIzeEEeGfbh3OzyeLKRhTnMkjCg2zyAdy1RbxRufaFXNTJszU1pzOoV/WPHi0WVSM/jsJmmaf6m3NJUSFN4H3NirFbZjdRkRv4hOX7qBB6pP2IsuZZShFVl8PWw3RCaX5auInyN95wkeQjoLYZUjluF6mV3XGDs4rrEK2S4k1OPf/HB6V9sK9rvhziQ6srCQS3PoGXrh/BxlwPX+c5ca4xQgfIu0EWvqpxLx9j2on6gBEGXdAXvIZEXGwAX4qY3z9EL8UdL109zfZNQMR8w0KTnm/j6zk22wexlfDQaOo6ue/lTU7S0Ke12yx4+GvX4Fu9sLattizQWHGitMIdmnSoOweeM1WLxc5nsSxnzVQUkk4nNBwvM/hhjpRSKioLE2ESfLycpnExUWlXUDSeWTseASMAA\" alt=\"Gravura de um público sentado a rir, com um homem de perfil sério em primeiro plano e duas figuras distraídas atrás.\" width=\"1100\" height=\"1230\" loading=\"lazy\"><figcaption>William Hogarth, The Laughing Audience, 1733. Um público a rir no teatro, e, atrás, dois homens que não olham para o palco. A imagem abre a pergunta sobre o que prende a atenção e quem a mede. William Hogarth. Domínio público no registo de origem (<a href=\"https://commons.wikimedia.org/wiki/File:William_Hogarth,_The_Laughing_Audience,_1733,_NGA_30455.jpg\">Wikimedia Commons</a>), consulta de 2026-10-15.</figcaption></figure><h3>O documento</h3><p>Hogarth gravou um público em 1733: a atenção já era um espetáculo antes de ser um negócio.</p><h3>A composição</h3><p>Os dois homens atrás olham para outro lado. Quem mede a atenção de quem está no palco não vê os que se distraem.</p><h3>A investigação</h3><p>As regras reais de recomendação são segredo comercial; o que sabemos vem de documentos oficiais, de investigadores independentes e de leis que obrigam a explicar.</p>"},{"t":"ler","rot":"Conhecer","titulo":"A obra e o problema","html":"<h3>A economia da atenção</h3><p>Em 1971, Herbert Simon escreveu que a riqueza de informação cria pobreza de atenção. As plataformas vivem disso: cada segundo em que ficas num cartão é medido, somado e vendido. O feed de papel, na versão 2, fez o mesmo às escondidas: o utilizador não escolheu nada e, ainda assim, o feed fechou-se à volta dele.</p><h3>Recomendar não é escolher por ti</h3><p>Um sistema de recomendação ordena o que existe pelo que prevê que te vai prender. Não tem opinião sobre o que é bom: tem uma meta, o tempo que ficas. O Regulamento dos Serviços Digitais (2022) obriga as grandes plataformas a explicar os principais parâmetros dos sistemas de recomendação e a oferecer uma opção que não dependa do teu perfil.</p><h3>O diário de um feed</h3><p>Durante sete dias, os cinco primeiros temas que a tua aplicação te mostra, sempre a mesma, só temas, nunca nomes nem capturas com pessoas. É um instrumento de investigação: ao fim de uma semana, vês a tua bolha de fora. O que escreves é teu; o que a plataforma mede é dela.</p><h3>Para consultar</h3><ul class=\"fontes-cid\"><li><a href=\"https://eur-lex.europa.eu/eli/reg/2022/2065/oj?locale=pt\">Regulamento dos Serviços Digitais, Regulamento (UE) 2022/2065 (EUR-Lex)</a></li><li><a href=\"https://www.penguinrandomhouse.com/books/309214/the-filter-bubble-by-eli-pariser/\">Eli Pariser, The Filter Bubble, 2011 (Penguin Random House)</a></li><li><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/ferramentas/m2-aula-01-feed/\">O feed de papel no ecrã, a ferramenta da aula 1</a></li></ul>"},{"t":"ler","rot":"Relacionar","titulo":"Das palavras à situação","html":"<p>Estas palavras ajudam a nomear o que estamos a observar.</p><dl class=\"termos\"><div class=\"termo\"><dt>Economia da atenção</dt><dd>O mercado em que o que se compra e vende é o tempo em que olhas.<span class=\"exemplo\">Por exemplo: Um vídeo curto que começa a meio, para não largares.</span></dd></div><div class=\"termo\"><dt>Sistema de recomendação</dt><dd>O conjunto de regras que ordena o que te mostram pelo que prevê que te prende.<span class=\"exemplo\">Por exemplo: A versão 2 do feed de papel: segundos, não gostos.</span></dd></div><div class=\"termo\"><dt>Perfil</dt><dd>O que a plataforma guarda sobre ti para prever o que te prende.<span class=\"exemplo\">Por exemplo: Os temas em que ficaste mais tempo esta semana.</span></dd></div><div class=\"termo\"><dt>Opção sem perfil</dt><dd>A possibilidade, por lei, de ver um feed que não parte do que fizeste antes.<span class=\"exemplo\">Por exemplo: A ordem por data em vez da ordem «para ti».</span></dd></div></dl><div class=\"ponte\"><div><h3>No feed</h3><p>A tua atenção é a entrada; o feed seguinte é a saída.</p></div><div><h3>Na cidadania</h3><p>Um tempo que é medido e vendido sem que o saibas é um tempo que não escolheste.</p></div></div><p class=\"abre\">Saber que te medem não chega; é preciso poder dizer não.</p>"},{"t":"multi","rot":"A tese","cena":"Tese proposta: um feed que mede a atenção sem o dizer tira ao utilizador uma escolha que era dele.","p":"Seleciona dois elementos que sustentam diretamente esta tese.","opcoes":["Na versão 2 do feed de papel, o utilizador não escolheu nada e o feed fechou-se na mesma.","Os cartões do feed de papel eram de seis temas.","O Regulamento dos Serviços Digitais obriga a explicar os parâmetros da recomendação e a oferecer uma opção sem perfil.","O utilizador 1 gostava de futebol."],"certas":[0,2],"fb":"A experiência mostra a perda de escolha; a lei confirma que essa escolha é um direito. Explicar a ligação é o trabalho do ensaio.","pista":"Procura o que liga a medição escondida à perda de escolha, e o que diz a lei sobre isso. Um pormenor do exercício não é um argumento.","g":0},{"t":"escolha","rot":"Recomendar","p":"Um sistema de recomendação ordena o que existe pelo que prevê que te prende. O que é que o sistema não tem?","o":["Uma opinião sobre o que é bom para ti: tem uma meta, o tempo que ficas","Dados sobre o que fizeste antes","Regras"],"c":0,"f":"Tem dados e regras; o que não tem é um juízo sobre o que te faz bem. Por isso a meta tem de ser conhecida.","g":1},{"t":"posicoes","rot":"Quem paga o quê?","cena":"","p":"«Quem usa a aplicação de graça é o produto.» Abre as quatro posições.","papeis":[{"rotulo":"Utilizador","texto":"Paga com atenção e com dados. Recebe um feed que o prende. Não vê as regras."},{"rotulo":"Plataforma","texto":"Vende a atenção a anunciantes. Escreve as regras. Por lei, tem de explicar os parâmetros principais e oferecer uma opção sem perfil."},{"rotulo":"Anunciante","texto":"Compra a atenção medida. Quer o feed que mais prende, não o mais variado."},{"rotulo":"Legislador","texto":"Escreve a lei que obriga a explicar e a dar escolha. Chega depois das plataformas, e aplica-se devagar."}],"fb":"Quatro posições, um só recurso: a tua atenção. Saber quem a compra é o primeiro passo para a vender menos barato.","g":2},{"t":"ler","rot":"Na sala","titulo":"Ler, representar, discutir","html":"<p>As propostas seguintes fazem-se oralmente e com o corpo. O docente escolhe a sequência adequada à aula.</p><h3>Leitura sentada</h3><p>Texto original: «Fica só mais um.» Lê como uma plataforma, como um amigo e como tu próprio ao espelho. Em qual das três a frase é uma ordem?</p><h3>Imagem de grupo</h3><p>Um aluno é o utilizador, de olhos fechados. Os outros são cartões e aproximam-se em silêncio; quem conseguir que ele abra os olhos ganha a ronda seguinte. Depois: o que fizeram para prender a atenção?</p><h3>Debate de posições</h3><p>«Quem usa a aplicação de graça é o produto.» Atribui «utilizador», «plataforma», «anunciante», «legislador». Cada posição diz o que paga e o que recebe.</p><p class=\"fonte\">As falas identificadas como texto original foram criadas para estas atividades. Não são excertos dos autores estudados.</p>"},{"t":"ler","rot":"Rever","titulo":"O que levo deste passo","html":"<ul><li>A atenção é medida, somada e vendida: é uma economia.</li><li>Um sistema de recomendação tem uma meta, não uma opinião.</li><li>A lei europeia obriga a explicar as regras e a oferecer uma opção sem perfil.</li></ul><h3>Do exemplo à explicação</h3><div class=\"modelo\"><div><span>O exemplo</span><p>Na versão 2 do feed de papel, o utilizador não escolheu nada e o feed fechou-se à volta dele.</p></div><div><span>O que permite perceber</span><p>Medir a atenção sem o dizer transforma o utilizador em entrada de um cálculo que não conhece.</p></div><div><span>A ligação ao argumento</span><p>A transparência exigida pelo Regulamento dos Serviços Digitais é o mínimo para que a atenção volte a ser uma escolha.</p></div></div><h3>Se gosto do que me mostram, porque é que hei de querer ver as regras?</h3><p>Porque só com as regras sabes o que ficou de fora, e o que ficou de fora também era teu por direito.</p>"},{"t":"ler","rot":"Para levar","escuro":true,"html":"<p class=\"levar\">Ver a bolha de fora</p><p>Ao fim de sete dias do diário de um feed, vês a tua bolha de fora. É um instrumento, não um castigo: só temas, nunca pessoas. A tua atenção é tua; a lei diz que tens direito a saber quem a mede.</p><div class=\"cid-debate\"><b>Para debater</b>que opção sem perfil escolherias, se a aplicação a oferecesse hoje?</div>"}],chave:"epi-cidadania-m2-passo-03",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/",percursoRotulo:"Os passos",voltarRotulo:"Voltar aos passos",seguinte:"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/passo-04/",seguinteRotulo:"Passo seguinte",depois:"<div class=\"c\"><p class=\"rot\">Aprendeste</p><p>Explicar como os sistemas de recomendação selecionam o que vemos e o que a lei europeia exige deles; usar o diário de um feed como investigação.</p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/glossario/\">Palavras explicadas</a> · <a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/revisao/\">Rever os oito passos</a></p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/contra-feed/\">O diário de um feed: as regras</a></p></div>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["passo-03"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
