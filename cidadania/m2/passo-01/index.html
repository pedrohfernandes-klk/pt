<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Quem escolheu o que viste hoje? · Cidadania · Os algoritmos</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet"><style>:root{--tinta:#000;--papel:#fff;--papel2:#faf8f2;--suave:#444;--fundo:#f3f2ee;--mostarda:#d9a520;--vermelho:#c8232c}@media (prefers-color-scheme:dark){:root{--tinta:#ecebe5;--papel:#121210;--papel2:#1a1a17;--suave:#b3b1aa;--fundo:#1d1d1a;--mostarda:#e0b23a;--vermelho:#e4555c}}*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.5 Arial,Helvetica,sans-serif}

.c-prim[data-seguinte]::after,.c-prim[data-confirmar]::after,.c-prim.c-vai::after{content:"→"}
.casca-folha{position:absolute;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.7,.2,1);background:var(--papel,#fff);color:var(--tinta,#000);box-shadow:0 -1px 0 rgba(0,0,0,.18),0 -12px 30px rgba(0,0,0,.08)}

.casca-menu[hidden]{display:none}

.casca-menu .c-menu-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px}.casca-menu .c-menu-cab p{font:700 .74rem/1.35 Arial;letter-spacing:.1em;text-transform:uppercase;color:var(--suave,#444);margin:0}

.casca-menu nav a::after{content:"→";margin-left:auto;font-weight:400}

.casca-video{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}.casca-video .cx{background:#111;color:#f2f0ea;width:100%;max-width:420px;max-height:96vh;max-height:96dvh;display:flex;flex-direction:column;gap:8px;padding:12px;box-sizing:border-box}.casca-video .tt{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 .8rem Arial;letter-spacing:.1em;text-transform:uppercase;color:#d9a520}.casca-video video{width:100%;max-height:72vh;max-height:72dvh;background:#000;display:block}.casca-video .rodape-como{display:flex;justify-content:space-between;align-items:center;gap:10px}.casca-video button,.casca-video a{display:inline-flex;align-items:center;font:700 1rem Arial;color:#f2f0ea;background:none;border:0;min-height:44px;padding:0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

UBNe0F9QAFQA+jLnSBd5s0wqgb1y26x3Cn/gfzz3GrTMsD1agpwRm4qVsViQFbemw8TbRCOM/lxZVkeuh7hK1YaK8Dm/25wodpHhv8l77FoAKZr1WTQF8cb1Xs9VxvorJVrSOPSr92/udSEEcyVUgK2QdsLguErfoG3b8eVqc3f8v5IAMiNBkCnd/GlyiYB6Mn+OE9lWQ+Gdsr1kOyzN6l9ZTX+sMwArcroOwLTYuABoWUQ+1P5dKJmO6CUTm+hwAAA=\" alt=\"Retrato pintado de uma mulher jovem de vestido claro, sentada, com o cabelo apanhado.\" width=\"1100\" height=\"1745\" loading=\"lazy\"><figcaption>Ada Lovelace, retrato de Margaret Sarah Carpenter, 1836. Em 1843, Lovelace publicou as notas em que descreve o que uma máquina pode fazer com regras: a imagem abre a pergunta sobre quem escreve as regras. Margaret Sarah Carpenter. Domínio público no registo de origem (<a href=\"https://commons.wikimedia.org/wiki/File:Ada_Lovelace.jpg\">Wikimedia Commons</a>), consulta de 2026-10-15.</figcaption></figure><h3>O documento</h3><p>Um retrato de 1836 diz-nos como uma pessoa quis ser vista. Não mostra uma máquina nem um algoritmo.</p><h3>A ligação</h3><p>Lovelace escreveu que a máquina «não tem a pretensão de originar nada»: faz o que sabemos mandar-lhe fazer. A pergunta passa para quem manda.</p><h3>A investigação</h3><p>Para saber o que um algoritmo real faz, precisamos de documentos da plataforma, de investigação independente e de leis que obriguem a explicar.</p>"},{"t":"ler","rot":"Conhecer","titulo":"A obra e o problema","html":"<h3>O feed de papel</h3><p>Na aula, a turma fez de algoritmo com cartões: um utilizador, seis temas, três rondas. Na primeira ronda, um cartão de cada tema; nas seguintes, três do tema com mais pontos, dois do segundo e um de outro. Em três rondas, dois ou três temas desapareceram. O utilizador não pediu para deixar de os ver.</p><h3>Entrada, regras, saída</h3><p>Um algoritmo é um conjunto finito de regras que transforma uma entrada numa saída. No feed de papel, a entrada foram os gostos (ou os segundos de atenção), as regras foram o três-dois-um, a saída foi o feed seguinte. Ada Lovelace, em 1843, descreveu uma máquina que só faz o que lhe mandam fazer: as regras são de quem as escreve.</p><h3>Personalização e bolha</h3><p>Personalização: cada pessoa recebe uma saída diferente, calculada a partir do que fez antes. Bolha de filtro, a expressão de Eli Pariser (2011): ver cada vez mais do mesmo sem dar pelo que ficou de fora. Dois utilizadores do feed de papel, a falar «do que se passa no mundo», já não falam do mesmo mundo.</p><h3>Para consultar</h3><ul class=\"fontes-cid\"><li><a href=\"https://www.gutenberg.org/ebooks/74223\">Ada Lovelace, notas de 1843 (tradução do memorando de Menabrea), Project Gutenberg</a></li><li><a href=\"https://www.penguinrandomhouse.com/books/309214/the-filter-bubble-by-eli-pariser/\">Eli Pariser, The Filter Bubble, 2011 (Penguin Random House)</a></li><li><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/ferramentas/m2-aula-01-feed/\">O feed de papel no ecrã, a ferramenta da aula 1</a></li></ul>"},{"t":"ler","rot":"Relacionar","titulo":"Das palavras à situação","html":"<p>Estas palavras ajudam a nomear o que estamos a observar.</p><dl class=\"termos\"><div class=\"termo\"><dt>Algoritmo</dt><dd>Conjunto finito de regras que transforma uma entrada numa saída.<span class=\"exemplo\">Por exemplo: Gostos a entrar, três-dois-um, um feed novo a sair.</span></dd></div><div class=\"termo\"><dt>Personalização</dt><dd>Cada pessoa recebe uma saída diferente, calculada a partir do que fez antes.<span class=\"exemplo\">Por exemplo: Dois colegas abrem a mesma aplicação e veem coisas diferentes.</span></dd></div><div class=\"termo\"><dt>Bolha de filtro</dt><dd>Ver cada vez mais do mesmo sem dar pelo que ficou de fora.<span class=\"exemplo\">Por exemplo: O tema «notícias» desapareceu do feed à terceira ronda.</span></dd></div><div class=\"termo\"><dt>Transparência</dt><dd>Saber que regras estão a decidir o que vês.<span class=\"exemplo\">Por exemplo: O utilizador 2 não sabia que o algoritmo media os segundos.</span></dd></div></dl><div class=\"ponte\"><div><h3>No algoritmo</h3><p>Entrada, regras, saída: um processo que se pode descrever.</p></div><div><h3>Na cidadania</h3><p>Quem escreve as regras decide o que cada pessoa vê, e isso tem de poder ser conhecido e discutido.</p></div></div><p class=\"abre\">Descrever um algoritmo não o torna justo; torna-o discutível.</p>"},{"t":"ordenar","rot":"Entrada, regras, saída","p":"Ordena o que o feed de papel fez em cada ronda.","passos":["O utilizador diz «gosto» aos cartões que quiser","O registo soma um ponto ao tema de cada gosto","O algoritmo escolhe três cartões do tema com mais pontos, dois do segundo e um de outro","O feed seguinte aparece, mais fechado do que o anterior"],"f":"Entrada (os gostos), regras (a soma e o três-dois-um), saída (o feed seguinte). Um algoritmo é isto: descreve-se, e por isso discute-se.","g":0},{"t":"escolha","rot":"Versão 2","p":"Na versão 2, o utilizador não escolheu nada: o algoritmo mediu os segundos em cada cartão e o feed fechou-se na mesma. O que mostra a versão 2?","o":["Que a entrada pode ser o que fazes sem querer, e ainda assim decide o que vês","Que sem gostos não há personalização","Que o utilizador 2 escolheu melhor do que o 1"],"c":0,"f":"A atenção medida às escondidas é uma entrada como outra qualquer. É a versão mais próxima das plataformas reais.","g":1},{"t":"posicao","rot":"O que faltou","cena":"Ao fim de três rondas, o tema «notícias» desapareceu do feed do utilizador 1.","p":"Como lês este desaparecimento?","opcoes":[{"rotulo":"Foi o utilizador que não quis notícias.","comentario":"Ele não disse que não queria: não tocou em «gosto» na primeira ronda. Uma preferência pequena virou exclusão total por causa das regras, não da vontade."},{"rotulo":"Foram as regras que o tiraram.","comentario":"O três-dois-um transforma a primeira escolha numa espiral. As regras decidiram; o utilizador só deu o primeiro passo, sem saber o que dava."},{"rotulo":"Não tem importância: eram só cartões.","comentario":"Eram cartões; na vida são notícias, vozes, pessoas. A regra que tira um tema de um feed de papel tira um mundo de um feed real."}],"g":2},{"t":"ler","rot":"Na sala","titulo":"Ler, representar, discutir","html":"<p>As propostas seguintes fazem-se oralmente e com o corpo. O docente escolhe a sequência adequada à aula.</p><h3>Leitura sentada</h3><p>Texto original: «Vi isto porque quis.» Lê a frase como certeza, como dúvida e como pergunta a outra pessoa. O que muda no corpo quando a certeza se desfaz?</p><h3>Imagem de grupo</h3><p>Seis pessoas, uma por tema do feed. Uma sétima faz de utilizador e toca em três. As tocadas aproximam-se; as outras afastam-se um passo por ronda. Em que ronda deixam de se ver?</p><h3>Debate de posições</h3><p>«Se eu gosto, é natural que me mostrem mais.» Atribui «utilizador», «quem escreve as regras» e «quem desapareceu do feed». Cada posição diz o que ganha e o que perde.</p><p class=\"fonte\">As falas identificadas como texto original foram criadas para estas atividades. Não são excertos dos autores estudados.</p>"},{"t":"ler","rot":"Rever","titulo":"O que levo deste passo","html":"<ul><li>Um algoritmo é entrada, regras e saída; as regras são de quem as escreve.</li><li>A personalização estreita o que cada pessoa vê sem lhe perguntar.</li><li>A bolha de filtro não se vê de dentro: só se vê comparando feeds.</li></ul><h3>Do exemplo à explicação</h3><div class=\"modelo\"><div><span>O exemplo</span><p>No feed de papel, o tema «notícias» desapareceu à terceira ronda sem o utilizador pedir.</p></div><div><span>O que permite perceber</span><p>As regras três-dois-um transformam uma preferência pequena numa exclusão total.</p></div><div><span>A ligação ao argumento</span><p>Sem transparência sobre as regras, a liberdade de receber informação (DUDH, art. 19.º) fica nas mãos de quem as escreve.</p></div></div><h3>Se um utilizador só vê o que gosta, onde está o problema?</h3><p>No que deixou de ver sem saber que deixou de ver: a escolha foi feita por outro.</p>"},{"t":"ler","rot":"Para levar","escuro":true,"html":"<p class=\"levar\">Dar nome ao que vimos</p><p>Entrada, regras, saída. Personalização. Bolha. Três palavras para uma experiência que fizeste com as mãos. O diário de um feed começa hoje: sete dias, só temas, nunca pessoas.</p><div class=\"cid-debate\"><b>Para debater</b>os dois utilizadores do feed de papel vivem no mesmo mundo?</div>"}],chave:"epi-cidadania-m2-passo-01",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/",percursoRotulo:"Os passos",voltarRotulo:"Voltar aos passos",seguinte:"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/passo-02/",seguinteRotulo:"Passo seguinte",depois:"<div class=\"c\"><p class=\"rot\">Aprendeste</p><p>Descrever um algoritmo como entrada, regras e saída, e reconhecer a personalização e a bolha de filtro no que viste na aula.</p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/glossario/\">Palavras explicadas</a> · <a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/revisao/\">Rever os oito passos</a></p></div>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["passo-01"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
</script></body></html>
