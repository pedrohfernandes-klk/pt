<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Quem está dentro da caixa? · Cidadania · Os algoritmos</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet"><style>:root{--tinta:#000;--papel:#fff;--papel2:#faf8f2;--suave:#444;--fundo:#f3f2ee;--mostarda:#d9a520;--vermelho:#c8232c}@media (prefers-color-scheme:dark){:root{--tinta:#ecebe5;--papel:#121210;--papel2:#1a1a17;--suave:#b3b1aa;--fundo:#1d1d1a;--mostarda:#e0b23a;--vermelho:#e4555c}}*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.5 Arial,Helvetica,sans-serif}

.casca-folha{position:absolute;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.7,.2,1);background:var(--papel,#fff);color:var(--tinta,#000);box-shadow:0 -1px 0 rgba(0,0,0,.18),0 -12px 30px rgba(0,0,0,.08)}

.casca-menu nav a::after{content:"→";margin-left:auto;font-weight:400}

.casca-video{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}.casca-video .cx{background:#111;color:#f2f0ea;width:100%;max-width:420px;max-height:96vh;max-height:96dvh;display:flex;flex-direction:column;gap:8px;padding:12px;box-sizing:border-box}.casca-video .tt{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 .8rem Arial;letter-spacing:.1em;text-transform:uppercase;color:#d9a520}.casca-video video{width:100%;max-height:72vh;max-height:72dvh;background:#000;display:block}.casca-video .rodape-como{display:flex;justify-content:space-between;align-items:center;gap:10px}.casca-video button,.casca-video a{display:inline-flex;align-items:center;font:700 1rem Arial;color:#f2f0ea;background:none;border:0;min-height:44px;padding:0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

wbajV2rGZngnTRGP5ZY4J6rAgh6IhLr6YNydNeTgLjOx1sV9pl2+oNV5g4NTJDIWUkpIovGJ8ezdzAwCBOXEToZ6y4awa48AxDnJOcInnenC15ccWOAZ2eLA/jYwOegx7Jy0jegAaJ1++ToWTe1UlpWHb5b8/OATmQB0tCMJ4O5M+rYv+kEFXJwpcjo0FccgItcT+Z6kSx05vlPyymDoONJrasj6KKKxBX2Yjx1l8v1HzwU3l2aO+KWxUl3YmXpBZAjQwEm4kwCABmsgmwo8CsAQYzZ7g8BAAAA=\" alt=\"Gravura de um autómato vestido à turca sentado a uma mesa de xadrez, com as portas do armário abertas a mostrar engrenagens.\" width=\"1100\" height=\"1002\" loading=\"lazy\"><figcaption>O Turco, o autómato de xadrez de Wolfgang von Kempelen (1770), numa gravura de época. Dentro da caixa escondia-se um jogador humano. A imagem abre a pergunta sobre o que uma máquina faz sozinha e o que alguém faz por ela. Joseph Racknitz. Domínio público no registo de origem (<a href=\"https://commons.wikimedia.org/wiki/File:Racknitz_-_The_Turk_3.jpg\">Wikimedia Commons</a>), consulta de 2026-10-15.</figcaption></figure><h3>O documento</h3><p>A gravura mostra o armário aberto, com engrenagens: era parte do espetáculo, para provar que não havia ninguém. Havia.</p><h3>A composição</h3><p>Repara na cara do Turco, sem expressão, e no público que não aparece. A fraude precisava de um público disposto a acreditar.</p><h3>A investigação</h3><p>Poe não abriu a caixa: raciocinou a partir do que via. Verificar não é sempre ter acesso; é saber perguntar.</p>"},{"t":"ler","rot":"Conhecer","titulo":"A obra e o problema","html":"<h3>O Turco</h3><p>Em 1770, Kempelen apresentou um autómato que jogava xadrez e vencia. Durante décadas correu a Europa e a América. Era uma fraude: dentro do armário, um jogador humano movia as peças. Edgar Allan Poe, em 1836, escreveu um ensaio a explicar como se podia saber que havia alguém lá dentro. A primeira lição sobre a inteligência artificial tem 250 anos: pergunta sempre quem está dentro da caixa.</p><h3>Autoria e direitos</h3><p>Um sistema de inteligência artificial gera texto, imagem e som a partir de milhões de obras de pessoas, muitas sem autorização. Em Portugal e na União Europeia, o direito de autor protege criações humanas; o que uma máquina gera sozinha não tem autor no sentido da lei. Quem usa o sistema é responsável pelo que publica, e o Regulamento da Inteligência Artificial (2024) obriga a identificar conteúdos gerados ou manipulados, como os deepfakes.</p><h3>Criar com a máquina</h3><p>Usar uma ferramenta não é o problema: a câmara não tirou a fotografia ao fotógrafo. O problema é a transparência (dizer que foi gerado), a origem (de quem são as obras de que o sistema aprendeu) e a substituição (uma imagem falsa de uma pessoa real). A liberdade de criação cultural (Constituição, art. 42.º) é das pessoas, e inclui o direito de saber o que é de quem.</p><h3>Para consultar</h3><ul class=\"fontes-cid\"><li><a href=\"https://www.gutenberg.org/ebooks/2150\">Edgar Allan Poe, «Maelzel's Chess-Player», 1836 (Project Gutenberg, The Works of Edgar Allan Poe, vol. 4)</a></li><li><a href=\"https://eur-lex.europa.eu/eli/reg/2024/1689/oj?locale=pt\">Regulamento da Inteligência Artificial, Regulamento (UE) 2024/1689 (EUR-Lex)</a></li><li><a href=\"https://www.parlamento.pt/Legislacao/Paginas/ConstituicaoRepublicaPortuguesa.aspx\">Constituição da República Portuguesa (Parlamento)</a></li></ul>"},{"t":"ler","rot":"Relacionar","titulo":"Das palavras à situação","html":"<p>Estas palavras ajudam a nomear o que estamos a observar.</p><dl class=\"termos\"><div class=\"termo\"><dt>Autoria</dt><dd>A ligação entre uma obra e a pessoa que a criou, que a lei protege.<span class=\"exemplo\">Por exemplo: Um guião tem autor; uma lista de frases geradas ao acaso não.</span></dd></div><div class=\"termo\"><dt>Deepfake</dt><dd>Imagem, vídeo ou som gerado ou manipulado para parecer uma pessoa real a fazer ou dizer o que não fez.<span class=\"exemplo\">Por exemplo: Um vídeo de um colega a dizer frases que nunca disse.</span></dd></div><div class=\"termo\"><dt>Transparência</dt><dd>Dizer que um conteúdo foi gerado ou manipulado por um sistema.<span class=\"exemplo\">Por exemplo: A marca «gerado por IA» num cartaz.</span></dd></div><div class=\"termo\"><dt>Origem</dt><dd>As obras de que um sistema aprendeu, e com que autorização.<span class=\"exemplo\">Por exemplo: Milhões de fotografias usadas sem perguntar a quem as tirou.</span></dd></div></dl><div class=\"ponte\"><div><h3>Na criação</h3><p>Uma ferramenta nova, com regras que não se veem.</p></div><div><h3>Na cidadania</h3><p>Quem publica responde pelo que publica; quem é representado tem direito a não ser inventado.</p></div></div><p class=\"abre\">A pergunta de Poe continua a servir: quem está dentro da caixa?</p>"},{"t":"posicao","rot":"A voz gerada","cena":"Situação inventada: um grupo quer usar uma voz gerada a imitar um cantor conhecido na performance do Contra-feed.","p":"O que propões?","opcoes":[{"rotulo":"Usar, sem dizer nada: é só uma performance.","comentario":"Imitar uma pessoa real sem o dizer é pôr alguém a fazer o que não fez. A lei obriga a identificar conteúdos gerados; e a pessoa imitada tem direitos sobre a sua voz."},{"rotulo":"Usar, dizendo ao público que é gerada e de quem imita.","comentario":"A transparência resolve uma parte: o público sabe. Falta a outra: o cantor não autorizou. Identificar não é o mesmo que ter o direito."},{"rotulo":"Gerar uma voz que não imita ninguém, e dizer que é gerada.","comentario":"Transparência e sem substituição: ninguém real é posto a dizer o que não disse. A origem dos dados do sistema continua a ser uma pergunta, mas esta já não fere ninguém."}],"g":0},{"t":"escolha","rot":"Poe e a caixa","p":"Poe, em 1836, não abriu a caixa do Turco: raciocinou a partir do que via para concluir que havia um jogador escondido. O que ensina o método de Poe para hoje?","o":["Verificar é saber perguntar e observar, mesmo sem acesso ao interior","Só se verifica abrindo a caixa","Um autómato que vence é sempre uma fraude"],"c":0,"f":"Poe observou os movimentos, os tempos, o que a máquina evitava mostrar. É o método de quem analisa um sistema fechado.","g":1},{"t":"escolha","rot":"Autoria","p":"Um aluno entrega um guião inteiro gerado por um sistema, com o seu nome. Qual é o problema, segundo a lei e as regras da turma?","o":["Esconder que foi gerado, e assinar como autor o que não criou","Usar uma ferramenta","Ter escrito pouco"],"c":0,"f":"Usar a ferramenta não é o problema; esconder e assinar é. O direito de autor protege criações humanas, e a turma exige transparência.","g":2},{"t":"ler","rot":"Na sala","titulo":"Ler, representar, discutir","html":"<p>As propostas seguintes fazem-se oralmente e com o corpo. O docente escolhe a sequência adequada à aula.</p><h3>Leitura sentada</h3><p>Texto original: «Isto fui eu que fiz.» Lê como quem desenhou, como quem pediu a uma máquina e como quem copiou. A frase é a mesma; a responsabilidade não.</p><h3>Imagem de grupo</h3><p>Um aluno é o Turco, imóvel; outro está escondido atrás e move-lhe os braços. A turma só vê o Turco. Depois trocam: o escondido aparece. O que muda na maneira de olhar?</p><h3>Debate de posições</h3><p>Situação inventada: um grupo quer usar uma voz gerada a imitar um cantor conhecido no projeto. Atribui «o grupo», «o cantor», «o público da mostra». Cada posição diz o que aceita e o que exige.</p><p class=\"fonte\">As falas identificadas como texto original foram criadas para estas atividades. Não são excertos dos autores estudados.</p>"},{"t":"ler","rot":"Rever","titulo":"O que levo deste passo","html":"<ul><li>O Turco era uma fraude com um humano dentro: pergunta sempre quem está dentro da caixa.</li><li>O direito de autor protege criações humanas; quem publica responde pelo que publica.</li><li>Conteúdos gerados ou manipulados têm de ser identificados.</li></ul><h3>Do exemplo à explicação</h3><div class=\"modelo\"><div><span>O exemplo</span><p>O Turco vencia ao xadrez porque um jogador escondido movia as peças.</p></div><div><span>O que permite perceber</span><p>A máquina era um espetáculo de confiança: o público acreditava porque queria acreditar.</p></div><div><span>A ligação ao argumento</span><p>Um conteúdo gerado sem identificação pede ao público a mesma fé cega; a transparência devolve-lhe a escolha.</p></div></div><h3>Usar inteligência artificial num trabalho é batota?</h3><p>Não por si: é batota esconder que a usaste, e é ilegal pôr uma pessoa real a fazer o que não fez.</p>"},{"t":"ler","rot":"Para levar","escuro":true,"html":"<p class=\"levar\">Quem está dentro da caixa</p><p>O Turco venceu durante décadas porque o público quis acreditar. A pergunta de Poe serve para qualquer sistema fechado: quem está lá dentro, com que regras, a partir de quê. Criar com a máquina é possível; esconder a máquina não.</p><div class=\"cid-debate\"><b>Para debater</b>o que é que o teu grupo aceita gerar, e o que exige que seja feito à mão?</div>"}],chave:"epi-cidadania-m2-passo-04",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/",percursoRotulo:"Os passos",voltarRotulo:"Voltar aos passos",seguinte:"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/passo-05/",seguinteRotulo:"Passo seguinte",depois:"<div class=\"c\"><p class=\"rot\">Aprendeste</p><p>Distinguir autoria, transparência e substituição no uso de inteligência artificial, e reconhecer o que a lei exige: identificar o que é gerado ou manipulado.</p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/glossario/\">Palavras explicadas</a> · <a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/revisao/\">Rever os oito passos</a></p><p class=\"sub\">No Laboratório de Narrativas: <a href=\"https://pedrohfernandes-klk.github.io/pt/narrativas/duchamp/\">o dossier Duchamp, seis ângulos sobre o autor</a>.</p></div>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["passo-04"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
