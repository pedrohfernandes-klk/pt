<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>A mostra e o manifesto · Cidadania · Os algoritmos</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet"><style>:root{--tinta:#000;--papel:#fff;--papel2:#faf8f2;--suave:#444;--fundo:#f3f2ee;--mostarda:#d9a520;--vermelho:#c8232c}@media (prefers-color-scheme:dark){:root{--tinta:#ecebe5;--papel:#121210;--papel2:#1a1a17;--suave:#b3b1aa;--fundo:#1d1d1a;--mostarda:#e0b23a;--vermelho:#e4555c}}*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.5 Arial,Helvetica,sans-serif}
:root{--col:min(680px,100%);--d1:8px;--d2:20px;--d3:40px;--c-cinza:#d6d4ce}
@media (prefers-color-scheme:dark){:root{--c-cinza:#3d3c38}}
html.com-casca,html.com-casca body{height:100%;overflow:hidden;overscroll-behavior:none}
html.com-casca body{margin:0}
.casca{position:fixed;inset:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;height:100vh;height:var(--vh,100dvh);background:var(--fundo,#f3f2ee);color:var(--tinta,#000);z-index:10;font-family:Arial,Helvetica,sans-serif}
.casca.sobreposta{z-index:40}

.casca-topo{display:flex;align-items:center;gap:4px;width:100%;max-width:var(--col);margin:0 auto;box-sizing:border-box;min-height:48px;padding:max(2px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) 2px max(10px,env(safe-area-inset-left))}
.c-marca{font:700 .74rem/1 Arial;letter-spacing:.12em;text-transform:uppercase;color:var(--suave,#444);white-space:nowrap;flex:none;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;padding:0 4px;margin:0 -4px}.c-casa{width:15px;height:15px;margin-right:5px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}.c-marca:hover{color:var(--tinta,#000);text-decoration:underline}
.c-num{font:700 .85rem/1 Arial;white-space:nowrap;flex:none;margin:0 4px 0 6px;font-variant-numeric:tabular-nums}.c-num small{font-weight:400;color:var(--suave,#444)}
.c-modo{font:700 .72rem/1 Arial;letter-spacing:.1em;text-transform:uppercase;color:var(--vermelho,#c8232c);white-space:nowrap;flex:none}
.c-barra{flex:1 1 auto;min-width:48px;height:44px;border:0;background:none;padding:0 6px;margin:0;cursor:pointer;display:flex;align-items:center}
.c-barra svg{display:block;width:100%;height:10px;overflow:visible}

.c-barra rect.ler{fill:var(--tinta,#000)}.c-barra rect.ok{fill:var(--tinta,#000)}.c-barra rect.mau{fill:var(--vermelho,#c8232c)}.c-barra rect.atual{fill:var(--vermelho,#c8232c)}
.c-barra.ganho rect.ok{fill:var(--mostarda,#d9a520);transition-delay:calc(var(--k,0)*40ms)}
.c-barra:disabled{cursor:default}
.c-ic{flex:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--tinta,#000);padding:0;margin:0;cursor:pointer;font:700 1rem/1 Arial}
.c-ic .c-roda{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1.5px solid currentColor;border-radius:50%;font:700 .95rem/1 Arial}
.c-ic[aria-pressed="true"] .c-roda{background:var(--tinta,#000);color:var(--papel,#fff)}
.c-ic .c-tres{display:block;width:20px;height:14px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;position:relative;box-sizing:border-box}.c-ic .c-tres::after{content:"";position:absolute;left:0;right:0;top:4px;border-top:2px solid currentColor}
.c-ic[hidden]{display:none}
.casca-corpo{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;padding:0 max(10px,env(safe-area-inset-right)) calc(var(--folha-h,0px) + var(--d1)) max(10px,env(safe-area-inset-left));outline:0}
.casca-corpo>*{width:100%;max-width:var(--col);margin-left:auto;margin-right:auto;box-sizing:border-box}
.casca-corpo>.jogo-alvo,.casca-corpo>.c-enche{flex:1 0 auto;display:flex;flex-direction:column}
.casca-acoes{display:flex;align-items:center;gap:10px;width:100%;max-width:var(--col);margin:0 auto;box-sizing:border-box;min-height:64px;padding:8px max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));position:relative}
.casca-acoes::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--tinta,#000);opacity:0;transition:opacity .2s}.casca-acoes.sombra::before{opacity:.18}
.casca-acoes .c-esp{flex:1}
.c-prim,.c-sec{font:700 1rem/1.2 Arial;min-height:48px;margin:0;cursor:pointer;border-radius:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;box-sizing:border-box}
.c-prim{background:var(--tinta,#000);color:var(--papel,#fff);border:0;padding:0 22px}
.c-prim:disabled{background:var(--c-cinza);color:var(--suave,#444);cursor:default}
.c-sec{background:none;color:var(--tinta,#000);border:0;padding:0 6px;font-weight:400;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.c-sec.c-seta{text-decoration:none;font-size:1.25rem;min-width:44px;padding:0}
.c-prim[data-seguinte]::after,.c-prim[data-confirmar]::after,.c-prim.c-vai::after{content:"→"}
.casca-folha{position:absolute;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.7,.2,1);background:var(--papel,#fff);color:var(--tinta,#000);box-shadow:0 -1px 0 rgba(0,0,0,.18),0 -12px 30px rgba(0,0,0,.08)}
.casca-folha.aberta{transform:none}
.casca-folha .c-folha-in{max-width:var(--col);margin:0 auto;box-sizing:border-box;padding:14px max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));border-left:4px solid var(--tinta,#000);display:flex;flex-direction:column;gap:var(--d1)}
.casca-folha.ok .c-folha-in{border-left-color:var(--certo,#1b7f3b)}.casca-folha.mau .c-folha-in{border-left-color:var(--errado,#c8232c)}
.casca-folha .c-veredito{font:700 1.05rem/1.2 Arial;display:flex;align-items:baseline;gap:8px;margin:0}
.casca-folha .c-veredito .c-s{font-weight:900}.casca-folha.ok .c-s{color:var(--certo,#1b7f3b)}.casca-folha.mau .c-s{color:var(--errado,#c8232c)}.casca-folha.meio .c-s{color:var(--suave,#444)}
.casca-folha .c-veredito .c-pts{margin-left:auto;font:700 .9rem Arial;color:var(--mostarda,#d9a520)}
.casca-folha .c-expl{font:1.02rem/1.5 Georgia,"Times New Roman",serif;max-height:min(38dvh,320px);overflow-y:auto;overscroll-behavior:contain;margin:0}
.casca-folha .c-expl b{font-weight:700}
.casca-folha .c-prim{width:100%;margin-top:4px}
.casca-menu{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end}
.casca-menu[hidden]{display:none}
.casca-menu .c-menu-in{width:min(340px,88vw);height:100%;background:var(--papel,#fff);color:var(--tinta,#000);overflow-y:auto;box-sizing:border-box;padding:max(10px,env(safe-area-inset-top)) 18px 18px;animation:cMenu .2s ease-out}
@keyframes cMenu{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.casca-menu .c-menu-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px}.casca-menu .c-menu-cab p{font:700 .74rem/1.35 Arial;letter-spacing:.1em;text-transform:uppercase;color:var(--suave,#444);margin:0}
.casca-menu nav a,.casca-menu nav button{display:flex;align-items:center;width:100%;min-height:52px;font:700 1rem Arial;color:var(--tinta,#000);text-decoration:none;border:0;border-top:1px solid var(--c-cinza);background:none;padding:0;margin:0;cursor:pointer;text-align:left}
.casca-menu nav a::after{content:"→";margin-left:auto;font-weight:400}
.casca-menu .c-menu-extra{font-size:.85rem;color:var(--suave,#444);margin:14px 0 0}
.casca-menu .sala{margin:0;padding:10px 0 0;background:none}
.c-grelha{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:8px 0 0}.c-grelha button{min-height:52px;font:700 1rem Arial;border:1px solid var(--tinta,#000);background:var(--papel,#fff);color:var(--tinta,#000);cursor:pointer;margin:0}.c-grelha button.ok{background:var(--tinta,#000);color:var(--papel,#fff)}.c-grelha button.mau{box-shadow:inset 0 -4px 0 var(--errado,#c8232c)}.c-grelha button:disabled{opacity:.35;cursor:default}
.c-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.casca a:focus-visible,.casca button:focus-visible,.casca select:focus-visible,.casca [tabindex]:focus-visible{outline:3px solid var(--tinta,#000);outline-offset:2px}
.casca-video{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}.casca-video .cx{background:#111;color:#f2f0ea;width:100%;max-width:420px;max-height:96vh;max-height:96dvh;display:flex;flex-direction:column;gap:8px;padding:12px;box-sizing:border-box}.casca-video .tt{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 .8rem Arial;letter-spacing:.1em;text-transform:uppercase;color:#d9a520}.casca-video video{width:100%;max-height:72vh;max-height:72dvh;background:#000;display:block}.casca-video .rodape-como{display:flex;justify-content:space-between;align-items:center;gap:10px}.casca-video button,.casca-video a{display:inline-flex;align-items:center;font:700 1rem Arial;color:#f2f0ea;background:none;border:0;min-height:44px;padding:0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.c-iframe{flex:1;width:100%;max-width:none!important;border:0;background:var(--papel,#fff)}
@media (min-width:900px){.casca-topo{min-height:56px}.c-marca{font-size:.8rem}}

@media print{.casca{position:static;display:block;height:auto}.casca-topo,.casca-acoes,.casca-folha,.casca-menu{display:none!important}html.com-casca,html.com-casca body{overflow:visible;height:auto}}

/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

3QgaZGCyFRNrB/rWWjwJs2Qg6btwAAjaFA2rM6BvzHaBs8MUGfbsUcmgA6RvawAI+De2J1gOUfV+adUq3uVA6ZSQC+cL5jna54qhW9ARKQxcxKINDi0KOX7DIMiL5slgrLDLTZI+ZBYYetbKgtlg1lr/OpeCFXuvSV6ORSB9F7oT+w52+vbJlbxCFtTim+EeAuZlyCEDQcCAuMwNMXvmUAAP+Cw2ceAAg6oMHsl083EYf3fBTrlGRzP7Z3ykbXakrQm89eMFWVTgOUtajci4pJ0AAABFlAOOnYocBjU+jnppFMzQK4V1d0sKcL6ulYLZQDhAMi3J+kEKAz/cAAA+gOWAAAhopKXNKpTuO6E9ctqgLiHUHq2H1XXRlfVDQISYBcJdRw0oIN8MBANdEmxo2TKoxEBeLISfgQ2ntkWjhueOtJ4Fx3JavQALuMbSrwDGnUBkMn120StGuB63GdExpZMEE0DG+fSRfZnRPYjVaGcNyuCUU6UAgUSOjwA9PATJBpkKv7ViZMPh5vn+REF0FqDafOYgQAAA=\" alt=\"Cartaz a preto e branco com três rostos desenhados em facetas angulosas e, em baixo, o texto Künstlerkneipe Voltaire com o programa da abertura.\" width=\"1100\" height=\"1786\" loading=\"lazy\"><figcaption>Cartaz da abertura do Cabaret Voltaire, Zurique, 5 de fevereiro de 1916, desenhado por Marcel Słodki: «todas as noites, música, conferências e recitações». Foi ali que nasceu o dadaísmo, uma resposta de artistas à guerra, com manifestos, máscaras e poemas sonoros. A imagem abre a pergunta sobre o que uma mostra pública pode deixar depois de acabar. Marcel Słodki (1892-1944). Domínio público no registo de origem (<a href=\"https://commons.wikimedia.org/wiki/File:Marcel_S%C5%82odki_Cabaret-Voltaire-poster_1916.jpg\">Wikimedia Commons</a>), consulta de 2026-10-15.</figcaption></figure><h3>O documento</h3><p>Uma fotografia de 1916 de um lugar que durou meses e mudou a arte do século. O tamanho não é o alcance.</p><h3>A composição</h3><p>Repara no espaço pequeno. As mostras que importam não precisam de palco grande; precisam de público.</p><h3>A investigação</h3><p>Os manifestos dadaístas estão publicados; lê um antes de escrever o teu, para saber o que é um tom.</p>"},{"t":"ler","rot":"Conhecer","titulo":"A obra e o problema","html":"<h3>A mostra pública</h3><p>O Contra-feed apresenta-se a público, fora da sala de aula, e a turma defende as escolhas no fim. Vale 30%, com o manifesto. Uma mostra não é um teste: é o momento em que a peça encontra quem não a fez. O que o público não percebeu é informação, não falha.</p><h3>O manifesto de uso</h3><p>Em 1916, no Cabaret Voltaire, um grupo de artistas escreveu manifestos contra o mundo que os levava à guerra. Um manifesto é uma promessa escrita em público. O da turma diz como usamos as redes: o que fazemos, o que não fazemos, o que exigimos. Curto, assinado, afixado. As regras que a turma escolhe para si são o contrário da regra que lhe impõem sem perguntar.</p><h3>Defender as escolhas</h3><p>No debate depois da mostra, cada grupo explica o que escolheu e porquê, e ouve o que o público viu. Defender não é vencer: é mostrar que houve uma razão, e aceitar que a razão pode mudar. É o fim do módulo e o princípio de uma maneira de estar.</p><h3>Para consultar</h3><ul class=\"fontes-cid\"><li><a href=\"https://unric.org/pt/declaracao-universal-dos-direitos-humanos/\">ONU / UNRIC, Declaração Universal dos Direitos Humanos</a></li><li><a href=\"https://www.parlamento.pt/Legislacao/Paginas/ConstituicaoRepublicaPortuguesa.aspx\">Constituição da República Portuguesa (Parlamento)</a></li></ul>"},{"t":"ler","rot":"Relacionar","titulo":"Das palavras à situação","html":"<p>Estas palavras ajudam a nomear o que estamos a observar.</p><dl class=\"termos\"><div class=\"termo\"><dt>Mostra</dt><dd>A apresentação pública de um trabalho, seguida de debate.<span class=\"exemplo\">Por exemplo: A performance dos grupos no auditório, com convidados.</span></dd></div><div class=\"termo\"><dt>Manifesto</dt><dd>Um texto curto que diz em público o que se defende e o que se recusa.<span class=\"exemplo\">Por exemplo: «Não partilhamos o que não verificámos.»</span></dd></div><div class=\"termo\"><dt>Defesa</dt><dd>Explicar as escolhas de um trabalho e responder às perguntas.<span class=\"exemplo\">Por exemplo: Dizer porque é que a peça não usou ecrãs.</span></dd></div><div class=\"termo\"><dt>Público</dt><dd>Quem vê sem ter feito, e por isso vê o que falta.<span class=\"exemplo\">Por exemplo: Os colegas de outra turma e as famílias na mostra.</span></dd></div></dl><div class=\"ponte\"><div><h3>Na mostra</h3><p>Uma peça, um público, um debate.</p></div><div><h3>Na cidadania</h3><p>Dizer em público o que se defende, e assinar, é participar.</p></div></div><p class=\"abre\">Um manifesto sem assinatura é um feed; com assinatura é um compromisso.</p>"},{"t":"posicoes","rot":"Quem está na sala?","cena":"","p":"Abre as quatro posições antes da mostra.","papeis":[{"rotulo":"O grupo","texto":"Fez a peça. Sabe o que quis mostrar. Vai ouvir o que o público viu, que não é o mesmo."},{"rotulo":"O público","texto":"Vê sem ter feito. Repara no que falta e no que sobra. A sua confusão é informação, não falha."},{"rotulo":"O docente","texto":"Avalia o processo e a defesa, não só a peça. Pergunta pelas razões das escolhas."},{"rotulo":"A turma, como autora do manifesto","texto":"Assina em público regras que escolheu. Depois da mostra, as regras são para cumprir."}],"fb":"Quatro posições, uma sala. Defender é explicar a quem viu de fora, e deixar que o que viram mude a próxima peça.","g":0},{"t":"multi","rot":"O manifesto","cena":"Seis frases candidatas ao manifesto de uso da turma.","p":"Seleciona as três que são regras de uso, concretas e cumpríveis.","opcoes":["Não partilhamos o que não verificámos com duas fontes.","As redes sociais são más.","Nunca publicamos capturas de ecrã com pessoas sem o seu acordo.","Queremos um mundo melhor.","Uma vez por semana, vemos o feed sem perfil, por data, para saber o que ficou de fora.","A liberdade de expressão é importante."],"certas":[0,2,4],"fb":"Três regras com verbo e condição: cumprem-se ou quebram-se, e por isso valem. As outras são frases para o feed.","pista":"Uma regra de uso diz o que fazemos ou não fazemos, com um verbo concreto. Uma opinião geral não se cumpre nem se quebra.","g":1},{"t":"posicao","rot":"Depois da mostra","cena":"No debate, alguém do público diz que não percebeu a peça.","p":"Como responde o grupo?","opcoes":[{"rotulo":"Explica tudo o que a peça queria dizer.","comentario":"Explicar tudo é fazer a aula que a peça não quis ser. Responde ao que a pessoa viu, e deixa o resto."},{"rotulo":"Pergunta o que a pessoa viu, e parte daí.","comentario":"É a defesa que aprende: o que o público viu é informação para a próxima peça e para o manifesto."},{"rotulo":"Diz que o público é que não percebe de arte.","comentario":"É a resposta que fecha a sala. Uma mostra existe para o encontro, não para ter razão."}],"g":2},{"t":"ler","rot":"Na sala","titulo":"Ler, representar, discutir","html":"<p>As propostas seguintes fazem-se oralmente e com o corpo. O docente escolhe a sequência adequada à aula.</p><h3>Leitura sentada</h3><p>Texto original: «Nós, os que usamos.» Lê como abertura de manifesto, baixo, depois alto, depois a sério. Qual é a voz da turma?</p><h3>Imagem de grupo</h3><p>A turma escreve uma regra cada um num papel e lê-a em voz alta, de pé, um de cada vez. As regras repetidas juntam-se. As que ninguém mais escreveu discutem-se.</p><h3>Debate de posições</h3><p>«Um manifesto é só palavras.» Atribui «a favor», «contra», «o público da mostra». Cada posição dá um exemplo de uma regra que mudou alguma coisa.</p><p class=\"fonte\">As falas identificadas como texto original foram criadas para estas atividades. Não são excertos dos autores estudados.</p>"},{"t":"ler","rot":"Rever","titulo":"O que levo deste passo","html":"<ul><li>A mostra é o encontro com quem não fez a peça; o que não se percebeu é informação.</li><li>O manifesto é uma promessa pública, curta e assinada.</li><li>Defender as escolhas é dar razões e aceitar que mudem.</li></ul><h3>Do exemplo à explicação</h3><div class=\"modelo\"><div><span>O exemplo</span><p>No Cabaret Voltaire, um grupo pequeno escreveu manifestos que correram o mundo.</p></div><div><span>O que permite perceber</span><p>O alcance de uma ideia depende de ser dita em público e assinada, não do tamanho da sala.</p></div><div><span>A ligação ao argumento</span><p>O manifesto de uso da turma é um ato de cidadania: regras escolhidas, não impostas.</p></div></div><h3>Se o público não percebeu a peça, o projeto falhou?</h3><p>Não: a mostra existe para isso. O que falhou é informação para a defesa e para a próxima peça.</p>"},{"t":"ler","rot":"Para levar","escuro":true,"html":"<p class=\"levar\">Assinar em público</p><p>No Cabaret Voltaire, um grupo pequeno escreveu manifestos que correram o mundo. O da turma é mais pequeno e mais perto: diz como usamos as redes, assinado e afixado. Regras escolhidas, não impostas. É o fim do módulo e o começo de uma maneira de estar.</p><div class=\"cid-debate\"><b>Para debater</b>Pergunta final: que regra do manifesto vais cumprir já amanhã, e quem vai reparar?</div>"}],chave:"epi-cidadania-m2-passo-08",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/",percursoRotulo:"Os passos",voltarRotulo:"Voltar aos passos",seguinte:"https://pedrohfernandes-klk.github.io/pt/cidadania/contra-feed/",seguinteRotulo:"O projeto Contra-feed",depois:"<div class=\"c\"><p class=\"rot\">Aprendeste</p><p>Preparar a defesa pública do projeto e escrever, com a turma, um manifesto de uso curto, assinado e afixado.</p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/glossario/\">Palavras explicadas</a> · <a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/revisao/\">Rever os oito passos</a></p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/contra-feed/\">O projeto Contra-feed, as fases e o manifesto</a></p></div>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["passo-08"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
