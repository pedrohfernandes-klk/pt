<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>O caso · Cidadania · Os algoritmos</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet"><style>:root{--tinta:#000;--papel:#fff;--papel2:#faf8f2;--suave:#444;--fundo:#f3f2ee;--mostarda:#d9a520;--vermelho:#c8232c}@media (prefers-color-scheme:dark){:root{--tinta:#ecebe5;--papel:#121210;--papel2:#1a1a17;--suave:#b3b1aa;--fundo:#1d1d1a;--mostarda:#e0b23a;--vermelho:#e4555c}}*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.5 Arial,Helvetica,sans-serif}

.casca-topo{display:flex;align-items:center;gap:4px;width:100%;max-width:var(--col);margin:0 auto;box-sizing:border-box;min-height:48px;padding:max(2px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) 2px max(10px,env(safe-area-inset-left))}

.c-modo{font:700 .72rem/1 Arial;letter-spacing:.1em;text-transform:uppercase;color:var(--vermelho,#c8232c);white-space:nowrap;flex:none}

.c-barra.ganho rect.ok{fill:var(--mostarda,#d9a520);transition-delay:calc(var(--k,0)*40ms)}

.c-ic{flex:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--tinta,#000);padding:0;margin:0;cursor:pointer;font:700 1rem/1 Arial}
.c-ic .c-roda{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1.5px solid currentColor;border-radius:50%;font:700 .95rem/1 Arial}
.c-ic[aria-pressed="true"] .c-roda{background:var(--tinta,#000);color:var(--papel,#fff)}
.c-ic .c-tres{display:block;width:20px;height:14px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;position:relative;box-sizing:border-box}.c-ic .c-tres::after{content:"";position:absolute;left:0;right:0;top:4px;border-top:2px solid currentColor}
.c-ic[hidden]{display:none}
.casca-corpo{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;padding:0 max(10px,env(safe-area-inset-right)) calc(var(--folha-h,0px) + var(--d1)) max(10px,env(safe-area-inset-left));outline:0}

.casca-acoes::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--tinta,#000);opacity:0;transition:opacity .2s}.casca-acoes.sombra::before{opacity:.18}

.c-sec.c-seta{text-decoration:none;font-size:1.25rem;min-width:44px;padding:0}
.c-prim[data-seguinte]::after,.c-prim[data-confirmar]::after,.c-prim.c-vai::after{content:"→"}
.casca-folha{position:absolute;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.7,.2,1);background:var(--papel,#fff);color:var(--tinta,#000);box-shadow:0 -1px 0 rgba(0,0,0,.18),0 -12px 30px rgba(0,0,0,.08)}
.casca-folha.aberta{transform:none}

.casca-folha.ok .c-folha-in{border-left-color:var(--certo,#1b7f3b)}.casca-folha.mau .c-folha-in{border-left-color:var(--errado,#c8232c)}
.casca-folha .c-veredito{font:700 1.05rem/1.2 Arial;display:flex;align-items:baseline;gap:8px;margin:0}
.casca-folha .c-veredito .c-s{font-weight:900}.casca-folha.ok .c-s{color:var(--certo,#1b7f3b)}.casca-folha.mau .c-s{color:var(--errado,#c8232c)}.casca-folha.meio .c-s{color:var(--suave,#444)}

.casca-folha .c-expl b{font-weight:700}
.casca-folha .c-prim{width:100%;margin-top:4px}

.casca-menu[hidden]{display:none}
.casca-menu .c-menu-in{width:min(340px,88vw);height:100%;background:var(--papel,#fff);color:var(--tinta,#000);overflow-y:auto;box-sizing:border-box;padding:max(10px,env(safe-area-inset-top)) 18px 18px;animation:cMenu .2s ease-out}
@keyframes cMenu{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.casca-menu .c-menu-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px}.casca-menu .c-menu-cab p{font:700 .74rem/1.35 Arial;letter-spacing:.1em;text-transform:uppercase;color:var(--suave,#444);margin:0}
.casca-menu nav a,.casca-menu nav button{display:flex;align-items:center;width:100%;min-height:52px;font:700 1rem Arial;color:var(--tinta,#000);text-decoration:none;border:0;border-top:1px solid var(--c-cinza);background:none;padding:0;margin:0;cursor:pointer;text-align:left}
.casca-menu nav a::after{content:"→";margin-left:auto;font-weight:400}
.casca-menu .c-menu-extra{font-size:.85rem;color:var(--suave,#444);margin:14px 0 0}
.casca-menu .sala{margin:0;padding:10px 0 0;background:none}
.c-grelha{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:8px 0 0}.c-grelha button{min-height:52px;font:700 1rem Arial;border:1px solid var(--tinta,#000);background:var(--papel,#fff);color:var(--tinta,#000);cursor:pointer;margin:0}.c-grelha button.ok{background:var(--tinta,#000);color:var(--papel,#fff)}.c-grelha button.mau{box-shadow:inset 0 -4px 0 var(--errado,#c8232c)}.c-grelha button:disabled{opacity:.35;cursor:default}

.casca a:focus-visible,.casca button:focus-visible,.casca select:focus-visible,.casca [tabindex]:focus-visible{outline:3px solid var(--tinta,#000);outline-offset:2px}
.casca-video{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}.casca-video .cx{background:#111;color:#f2f0ea;width:100%;max-width:420px;max-height:96vh;max-height:96dvh;display:flex;flex-direction:column;gap:8px;padding:12px;box-sizing:border-box}.casca-video .tt{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 .8rem Arial;letter-spacing:.1em;text-transform:uppercase;color:#d9a520}.casca-video video{width:100%;max-height:72vh;max-height:72dvh;background:#000;display:block}.casca-video .rodape-como{display:flex;justify-content:space-between;align-items:center;gap:10px}.casca-video button,.casca-video a{display:inline-flex;align-items:center;font:700 1rem Arial;color:#f2f0ea;background:none;border:0;min-height:44px;padding:0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.c-iframe{flex:1;width:100%;max-width:none!important;border:0;background:var(--papel,#fff)}

/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

MkuGH7JhZ3LD/OS856Rt6hSC2n9wJ2T8Uv+G7loItWVoQYM1rAIj/ZI+nMXM/ZrDT5RgeBBS5HzkAPSGj55wC5LnIl359T5DBrFYUpsTKk0S2gTaxaKzhehNmWJBuea/pjnMDcb1paYxM8FXUJP6mTrCeCMT2bVZIsnPNQIiAUAzzhSZJupOZhetxJMOiUVI1VCU+HkaACPC8FNffVJzz9h0hQCHx5HLs2s88ciihQonwzRnBUQxBvddSClny83IGZj2rLqgDCyxkcscPqXEEKpAHMWFiHYN7qDwoqqcCd1Mcmahjnr79m5nYJghDr/HXbTIK9VmOyCb3lclcrk1pd1ZtvWtRRu60JC4xW6yD2dYEgOTRLAHoSIbwyyoMrFVqpxFXilmtvnRM2B7glgdrZabP0jDhL1Q/Qwn+Ey7OaIxQKx7qSNVwYukjZP9IJEvpKqQAAAA==\" alt=\"Fotografia de uma máquina de Jacquard num museu: um mecanismo negro sobre pés torneados, com uma tira larga de papel perfurado a descer pela frente.\" width=\"1100\" height=\"1467\" loading=\"lazy\"><figcaption>Uma máquina de Jacquard para cartões de papel contínuos (sistema Verdol), no Musée des Arts et Métiers, em Paris, fotografada em 2006. A tira perfurada que desce à frente dizia ao tear que fio levantar: regras escritas em cartão, cem anos antes dos computadores. A imagem abre a pergunta sobre como se analisa um caso. David Monniaux. Licença CC BY-SA 3.0 no registo de origem (<a href=\"https://commons.wikimedia.org/wiki/File:Jacquard_loom_p1040320.jpg\">Wikimedia Commons</a>), consulta de 2026-10-15.</figcaption></figure><h3>O documento</h3><p>A máquina de Jacquard não é um computador, mas inspirou Babbage e Lovelace: as regras em cartão perfurado são o antepassado do programa.</p><h3>A composição</h3><p>Repara na tira de papel perfurado: as regras são longas, mas estão à vista. Quem quiser pode lê-las, furo a furo.</p><h3>A investigação</h3><p>Para um caso real, começa pelos documentos da própria plataforma e compara com o que dizem jornalistas e investigadores.</p>"},{"t":"ler","rot":"Conhecer","titulo":"A obra e o problema","html":"<h3>A análise crítica de um caso</h3><p>Vale 20% do módulo. Escolhes um caso real de algoritmo e expressão: uma publicação retirada, um vídeo que se tornou viral por erro, uma conta suspensa, um deepfake de uma pessoa pública. Descreves os factos com fontes, separas o que sabes do que supões, identificas quem decidiu e com que regras, e dizes o que devia ter sido diferente, com a lei na mão.</p><h3>Os cartões de Jacquard</h3><p>O tear de 1804 lia cartões perfurados: cada furo, um fio levantado. As regras estavam no cartão, e qualquer tecelão as podia ler. É o contrário do algoritmo opaco. Na análise de um caso, a pergunta central é esta: as regras que decidiram estavam escritas em cartão, para todos lerem, ou escondidas na caixa, como no Turco?</p><h3>O método</h3><p>Quatro perguntas, por ordem: o que aconteceu (factos, com data e fonte); quem decidiu (pessoa, empresa, máquina); com que regras (lei, regras da casa, algoritmo); o que podia ter sido diferente (e que direito o permitia). Duas fontes independentes para cada facto importante. Um assistente de inteligência artificial não é uma fonte.</p><h3>Para consultar</h3><ul class=\"fontes-cid\"><li><a href=\"https://eur-lex.europa.eu/eli/reg/2022/2065/oj?locale=pt\">Regulamento dos Serviços Digitais, Regulamento (UE) 2022/2065 (EUR-Lex)</a></li><li><a href=\"https://www.gutenberg.org/ebooks/74223\">Ada Lovelace, notas de 1843 (tradução do memorando de Menabrea), Project Gutenberg</a></li><li><a href=\"https://www.pgdlisboa.pt/leis/lei_mostra_articulado.php?nid=109&amp;tabela=leis\">Código Penal, artigo 240.º (Procuradoria-Geral Distrital de Lisboa)</a></li></ul>"},{"t":"ler","rot":"Relacionar","titulo":"Das palavras à situação","html":"<p>Estas palavras ajudam a nomear o que estamos a observar.</p><dl class=\"termos\"><div class=\"termo\"><dt>Caso</dt><dd>Uma situação real, com data, intervenientes e consequências, que se pode investigar.<span class=\"exemplo\">Por exemplo: A conta de um músico suspensa por um sistema automático.</span></dd></div><div class=\"termo\"><dt>Facto</dt><dd>O que aconteceu e se pode confirmar com fontes.<span class=\"exemplo\">Por exemplo: A publicação foi retirada a 3 de março; a plataforma confirmou-o.</span></dd></div><div class=\"termo\"><dt>Suposição</dt><dd>O que achas que aconteceu sem o poder confirmar.<span class=\"exemplo\">Por exemplo: «Deve ter sido por causa de uma denúncia.»</span></dd></div><div class=\"termo\"><dt>Fonte independente</dt><dd>Quem relata o caso sem interesse direto no desfecho.<span class=\"exemplo\">Por exemplo: Um jornal que verifica, não a própria plataforma.</span></dd></div></dl><div class=\"ponte\"><div><h3>No tear</h3><p>Regras em cartão, visíveis.</p></div><div><h3>No caso</h3><p>Regras que decidem o que se vê, muitas vezes invisíveis.</p></div></div><p class=\"abre\">Analisar um caso é pedir o cartão.</p>"},{"t":"ler","rot":"As fontes","titulo":"Que fonte serve este caso?","html":"<p class=\"cid-cena\">Caso inventado para treino: a conta de um músico da cidade foi suspensa por um sistema automático na véspera de um concerto.</p><h3>A mensagem da plataforma</h3><p><b>A própria plataforma · mensagem automática</b>. Diz que a conta «violou as regras da comunidade». Não diz qual, nem quando, nem como recorrer.</p><p class=\"cid-limite\">É a decisão, não a explicação. Serve para saber o que foi dito; não serve para saber se foi justo.</p><h3>Uma reportagem</h3><p><b>Um jornal local · jornalista identificado</b>. Ouviu o músico, pediu comentário à plataforma e descreve casos semelhantes.</p><p class=\"cid-limite\">Uma só reportagem pode ter falhas; convém confrontar com outra fonte independente.</p><h3>Um vídeo de reação</h3><p><b>Um criador de conteúdos · sem fontes</b>. Indigna-se, acusa a plataforma de censura e pede partilhas.</p><p class=\"cid-limite\">Tem interesse no alcance do próprio vídeo. Não verifica nada.</p>","g":0},{"t":"posicao","rot":"Que fonte serve este caso?","cena":"","p":"Abre as três fontes e escolhe uma estratégia.","opcoes":[{"rotulo":"Partir da reportagem, confrontar com a mensagem da plataforma e procurar uma segunda fonte independente.","comentario":"A reportagem identifica-se e verifica; a mensagem diz o que foi decidido; a segunda fonte reduz o erro. É o método."},{"rotulo":"Partir do vídeo de reação, porque diz o que eu já achava.","comentario":"É o viés de confirmação. O vídeo quer partilhas, não verdade."},{"rotulo":"Aceitar a mensagem da plataforma como explicação suficiente.","comentario":"Uma decisão sem explicação não é uma explicação. A lei dá ao utilizador o direito de saber a regra e de recorrer."}],"g":1},{"t":"multi","rot":"Factos e suposições","cena":"Quatro frases sobre o caso.","p":"Seleciona as duas que são factos verificáveis.","opcoes":["A conta foi suspensa a 3 de março; a plataforma confirmou por escrito.","Deve ter sido por causa de uma denúncia de um concorrente.","O concerto era a 4 de março; o cartaz está arquivado.","A plataforma odeia músicos independentes."],"certas":[0,2],"fb":"Dois factos com data e documento; duas suposições. A análise crítica separa-os antes de julgar.","pista":"Um facto tem data e fonte. «Deve ter sido» e «odeia» são suposições, por mais prováveis que pareçam.","g":2},{"t":"ler","rot":"Na sala","titulo":"Ler, representar, discutir","html":"<p>As propostas seguintes fazem-se oralmente e com o corpo. O docente escolhe a sequência adequada à aula.</p><h3>Leitura sentada</h3><p>Texto original: «Foi o algoritmo.» Lê como desculpa, como explicação e como acusação. Em qual delas alguém responde?</p><h3>Imagem de grupo</h3><p>Uma pessoa com um cartão na mão (a decisão), outra de costas (quem foi afetado), outra a apontar (quem pergunta). A turma diz o que falta na cena.</p><h3>Debate de posições</h3><p>Situação inventada: uma conta de um aluno é suspensa por um sistema automático na véspera da mostra. Atribui «o aluno», «a plataforma», «um jornalista». Que pergunta faz cada um primeiro?</p><p class=\"fonte\">As falas identificadas como texto original foram criadas para estas atividades. Não são excertos dos autores estudados.</p>"},{"t":"ler","rot":"Rever","titulo":"O que levo deste passo","html":"<ul><li>Factos com fontes, suposições à parte.</li><li>Quem decidiu, com que regras, o que podia ter sido diferente.</li><li>As regras visíveis, como nos cartões de Jacquard, são a exigência mínima.</li></ul><h3>Do exemplo à explicação</h3><div class=\"modelo\"><div><span>O exemplo</span><p>Uma conta foi suspensa por um sistema automático sem explicação.</p></div><div><span>O que permite perceber</span><p>Sem explicação, não se sabe se a regra existe nem se foi bem aplicada.</p></div><div><span>A ligação ao argumento</span><p>O direito a uma explicação e a recurso é o que torna o caso discutível, e não só injusto.</p></div></div><h3>Porque é que a análise exige duas fontes independentes?</h3><p>Porque uma só fonte pode ter interesse no desfecho; duas que não dependem uma da outra reduzem o erro.</p>"},{"t":"ler","rot":"Para levar","escuro":true,"html":"<p class=\"levar\">Pedir o cartão</p><p>O tear de Jacquard tinha as regras em cartão, à vista. Analisar um caso é pedir o cartão: que regra decidiu, quem a escreveu, onde está escrita. Factos com fontes, suposições à parte, e a lei na mão para dizer o que podia ter sido diferente.</p><div class=\"cid-debate\"><b>Para debater</b>se a plataforma não explicar, o que fazes a seguir?</div>"}],chave:"epi-cidadania-m2-passo-07",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/",percursoRotulo:"Os passos",voltarRotulo:"Voltar aos passos",seguinte:"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/passo-08/",seguinteRotulo:"Passo seguinte",depois:"<div class=\"c\"><p class=\"rot\">Aprendeste</p><p>Analisar um caso real de algoritmo e expressão com o método: factos com fontes, quem decidiu, com que regras, o que podia ter sido diferente.</p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/glossario/\">Palavras explicadas</a> · <a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/m2/revisao/\">Rever os oito passos</a></p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/cidadania/contra-feed/\">O projeto Contra-feed, as fases e o manifesto</a></p></div>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["passo-07"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
