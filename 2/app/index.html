(function(){
var D={"ano":11,"anoNome":"2.º ano","anoCurto":"2.º","modulos":[{"k":"M4","nome":"Literatura Barroca e Romântica"},{"k":"M5","nome":"Narrativa do Séc. XIX"},{"k":"M6","nome":"Poesia Realista"}],"exercicios":[{"pasta":"Ler-a-fundo","ficheiro":"Vieira-Os-Grandes-Comem.html","id":"vieira-grandes","cor":"#7a3b1e","corEscura":"#d29368","marca":"Ler a fundo · 5 min · M4 Vieira","titulo":"Os grandes comem os pequenos","subtitulo":"Padre António Vieira, 1654","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de sermões","Seguiste a alegoria e viste quem está mesmo a ser repreendido."],[0.5,"Bom leitor","Já percebeste a alegoria. Falta afinar o alvo da crítica."],[0,"A entrar no sermão","Relê devagar: Vieira fala aos peixes para falar de outros."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Em 1654, em São Luís do Maranhão, o padre <b>António Vieira</b> pregou aos peixes — porque os homens não o queriam ouvir. No capítulo das repreensões, diz:</p><p><i>«A primeira coisa que me desedifica, peixes, de vós, é que vos comeis uns aos outros. Grande escândalo é este, mas a circunstância o faz ainda maior. Não só vos comeis uns aos outros, mas os grandes comem os pequenos.»</i></p><p><i>«Olhai, peixes, lá do mar para a terra. […] Vedes vós todo aquele trabalhar, vedes todo aquele andar, vedes aquele concorrer às praças e cruzar as ruas […]? Pois tudo aquilo é andarem os homens à procura de como hão de comer, e como se hão de comer.»</i></p>","links":[["Ler o sermão inteiro (Internet Archive)","https://archive.org/details/sermao-de-st-antonio-aos-peixes-lusolivros"]]},{"nivel":1,"tipo":"unica","rot":"A quem fala","pergunta":"Vieira repreende os peixes. Quem quer mesmo repreender?","opcoes":[["Os homens, sobretudo os poderosos","certo","Sim: a alegoria protege o pregador e deixa a crítica passar."],["Os pescadores do Maranhão","cuidado","O sermão manda olhar «do mar para a terra», para a cidade inteira."],["Os outros padres","cuidado","Esses são criticados noutro momento, quando fala do sal que não salga."]]},{"nivel":1,"tipo":"multi","rot":"O jogo das palavras","pergunta":"Na frase final, «como hão de comer, e como se hão de comer» quer dizer…","opcoes":[["Procurar sustento",5,"Sim: o primeiro «comer» é ganhar a vida."],["Devorarem-se uns aos outros",5,"Sim: o segundo é a exploração entre pessoas."],["Preparar um banquete",0,"Não há festa nenhuma: há sobrevivência e abuso."],["Comer em silêncio",0,"O sermão fala de ruído: praças, ruas, gente a correr."]]},{"nivel":2,"tipo":"unica","rot":"A força da alegoria","pergunta":"Porque é mais eficaz falar aos peixes do que acusar diretamente?","opcoes":[["Porque cada ouvinte se reconhece sem ser apontado","certo","Defensável: o riso e o espanto abrem a porta que a acusação fecharia."],["Porque os peixes não se defendem","certo","Defensável, e o próprio Vieira brinca com isso: «ouvem e não falam»."],["Porque era proibido pregar aos homens","cuidado","Não era proibido; era inútil, diz ele, porque não o ouviam."]]},{"nivel":2,"tipo":"cartoes","rot":"Hoje","pergunta":"Escolhe onde vês hoje «os grandes a comer os pequenos» e explica numa linha, sem nomes de pessoas.","cartoes":[["No trabalho","Quem tem pouco poder aguenta as piores condições."],["Na internet","Plataformas que vivem do trabalho de quem publica."],["No consumo","Preços que sobem sempre para o mesmo lado."],["Na escola","Quem já chega com menos apoio fica mais para trás."]]},{"nivel":3,"tipo":"texto","rot":"A tua repreensão","pergunta":"Escreve uma repreensão à maneira de Vieira: começa por «Olhai,» e dirige-te a um animal ou objeto para criticar um comportamento humano. Até 35 palavras.","minPalavras":12,"maxPalavras":35,"placeholder":"Olhai, …"},{"nivel":3,"tipo":"texto","rot":"Quem te ouve","pergunta":"Se tivesses de dizer uma verdade difícil à turma, que rodeio usarias para que a ouvissem? Uma frase.","minPalavras":8,"placeholder":"Falaria de… para dizer que…"}],"fontes":[["Sermão de Santo António aos Peixes (Internet Archive)","https://archive.org/details/sermao-de-st-antonio-aos-peixes-lusolivros"],["Wikisource, Sermão de Santo António (1654), texto integral","https://pt.wikisource.org/wiki/Serm%C3%A3o_de_Santo_Ant%C3%B3nio_(1654)"]],"modulo":"M4","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Gramatica-Os-Maias.html","id":"gramatica-maias","cor":"#4b6b2f","corEscura":"#a8cd7c","marca":"Gramática em contexto · 5 min · M5 Eça","titulo":"A casa que abre e fecha","subtitulo":"Gramática nas frases de Os Maias","niveis":["Reconhecer","Provar com um teste","Usar na tua escrita"],"emblemas":[[0.8,"Gramática com prova","Não decoraste: testaste cada classificação."],[0.5,"Bom caminho","Acertaste no essencial. Repete os testes que falharam."],[0,"A construir","Volta aos testes: substituir, deslocar, perguntar."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"As duas frases","html":"<p><i>Os Maias</i> abre e fecha com a mesma casa. Repara nestas duas frases, quase gémeas:</p><p><b>A.</b> «A casa que os Maias vieram habitar em Lisboa, no outono de 1875, era conhecida […] pela <i>casa do Ramalhete</i>.»</p><p><b>B.</b> «Depois na rua Carlos parou, deu um longo olhar ao sombrio casarão […] mudo, para sempre desabitado, cobrindo-se já de tons de ruína.»</p><p class=\"nota\">Grafia da edição, ligeiramente atualizada. Vamos usá-las para gramática — com um teste para cada resposta.</p>","links":[["Ler Os Maias na íntegra (Wikisource)","https://pt.wikisource.org/wiki/Os_Maias"]]},{"nivel":1,"tipo":"unica","rot":"A oração","pergunta":"Em A, «que os Maias vieram habitar em Lisboa» é uma oração subordinada…","opcoes":[["adjetiva relativa restritiva","certo","Sim: acrescenta informação ao nome «casa» e restringe de que casa se fala."],["substantiva completiva","cuidado","Teste: podes substituir por «isso»? «A casa isso era conhecida» não funciona."],["adverbial temporal","cuidado","Teste: responde a «quando»? Não: responde a «qual casa»."]]},{"nivel":1,"tipo":"unica","rot":"A função","pergunta":"Em B, «ao sombrio casarão» desempenha a função de…","opcoes":[["complemento direto","cuidado","Teste: substitui por «o»: «deu um longo olhar o casarão»? Não resulta."],["complemento indireto","certo","Sim: «deu-lhe um longo olhar». O teste do pronome «lhe» confirma."],["modificador do grupo verbal","cuidado","Pergunta antes se o verbo pede aquilo: quem dá, dá alguma coisa a alguém. «Ao sombrio casarão» é pedido pelo verbo."]]},{"nivel":2,"tipo":"multi","rot":"Provar com testes","pergunta":"Que pistas ajudam a distinguir complemento de modificador?","opcoes":[["Perguntar se o verbo, naquele sentido, pede aquela expressão",5,"É esta a pergunta que decide: o complemento é pedido pelo verbo."],["Substituir por um pronome («o», «lhe», «isso»)",5,"Boa pista, sobretudo para os complementos direto e indireto."],["Tentar cortar a expressão",0,"Ajuda, mas engana: há complementos que se podem calar sem a frase partir."],["Perguntar «quando?» ou «onde?»",0,"Engana: «Mora em Lisboa» responde a «onde?» e «em Lisboa» é complemento oblíquo, porque o verbo pede um lugar."]]},{"nivel":2,"tipo":"unica","rot":"Aspeto","pergunta":"Em «cobrindo-se já de tons de ruína», o valor aspetual é…","opcoes":[["pontual","cuidado","Teste: acontece num instante? Não: é um processo a decorrer."],["imperfetivo (em curso)","certo","Sim: o gerúndio e o «já» mostram uma ação em progressão, sem fim marcado."],["habitual","cuidado","Teste: acontece repetidamente? Não há repetição, há continuidade."]]},{"nivel":3,"tipo":"texto","rot":"A tua frase-espelho","pergunta":"Escreve duas frases sobre um mesmo lugar, uma no início e outra no fim de uma história, repetindo três palavras. Até 40 palavras.","minPalavras":15,"maxPalavras":40,"placeholder":"No princípio… No fim…"},{"nivel":3,"tipo":"detalhes","rot":"Etiquetar","pergunta":"Na tua segunda frase, identifica três elementos e o teste que usaste.","campos":["Uma função sintática + teste:","Uma oração + teste:","Um valor aspetual + teste:"]}],"fontes":[["Eça de Queirós, Os Maias (Wikisource)","https://pt.wikisource.org/wiki/Os_Maias"],["Eça de Queirós, Os Maias (Project Gutenberg n.º 40409)","https://www.gutenberg.org/ebooks/40409"]],"modulo":"M5","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Cesario-Ao-Gas.html","id":"cesario-gas","cor":"#b06a1f","corEscura":"#e6ad63","marca":"Ler a fundo · 5 min · M6 Cesário","titulo":"Ao gás","subtitulo":"Cesário Verde, 1887","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Olho de Cesário","Viste a cidade pelos pormenores, como ele."],[0.5,"Bom observador","Já apanhaste o essencial. Procura mais um pormenor concreto."],[0,"A afinar o olhar","Relê: cada estrofe é uma fotografia da rua."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Cesário Verde atravessa Lisboa à noite e escreve o que vê. Três momentos:</p><p><i>«E mais: as costureiras, as floristas / Descem dos magasins, causam-me sobressaltos; / Custa-lhes a elevar os seus pescoços altos / E muitas delas são comparsas ou coristas.»</i></p><p><i>«Num cuteleiro, de avental, ao torno, / Um forjador maneja um malho, rubramente; / E de uma padaria exala-se, inda quente, / Um cheiro salutar e honesto a pão no forno.»</i></p><p><i>«“Dó da miséria!… Compaixão de mim!…” / E, nas esquinas, calvo, eterno, sem repouso, / Pede-me sempre esmola um homemzinho idoso, / Meu velho professor nas aulas de latim!»</i></p><p class=\"nota\"><b>magasins</b> — lojas · <b>cuteleiro</b> — oficina de facas · <b>malho</b> — martelo grande</p>","links":[["Ler O Livro de Cesário Verde (Project Gutenberg)","https://www.gutenberg.org/ebooks/8698"]]},{"nivel":1,"tipo":"multi","rot":"Quem trabalha","pergunta":"Toca em todas as pessoas que trabalham nestes versos.","opcoes":[["As costureiras e floristas",5,"Saem das lojas ao fim do dia, cansadas."],["O forjador",5,"Ao torno, com o malho, «rubramente»."],["O padeiro",5,"Não aparece, mas o cheiro do pão diz que está a trabalhar."],["O velho que pede esmola",0,"Esse já não trabalha: foi docente e agora pede."]]},{"nivel":1,"tipo":"unica","rot":"Os sentidos","pergunta":"Na estrofe do forjador e da padaria, que sentidos são convocados?","opcoes":[["Visão e olfato","certo","Sim: o vermelho do ferro e o cheiro do pão quente."],["Audição e paladar","cuidado","O malho sugere som, mas o que está escrito é a cor e o cheiro."],["Só a visão","cuidado","«Exala-se […] um cheiro» é olfato, e é o centro da estrofe."]]},{"nivel":2,"tipo":"unica","rot":"A última imagem","pergunta":"O que torna o fim tão duro?","opcoes":[["O mendigo ser o antigo docente do poeta","certo","Sim: o pormenor transforma a cena numa acusação social."],["O mendigo aparecer sempre na mesma esquina","cuidado","Isso reforça, mas o choque está na identidade dele."],["O poeta não lhe dar esmola","cuidado","O texto não diz se dá ou não."]]},{"nivel":2,"tipo":"cartoes","rot":"A cidade dele e a tua","pergunta":"Escolhe um destes pares e explica numa linha o que mudou de 1887 para hoje.","cartoes":[["Quem sai do trabalho à noite","Antes: costureiras e floristas. Hoje?"],["Quem trabalha com fogo e ferro","Antes: o forjador ao torno. Hoje?"],["Quem pede na rua","Antes: o velho professor de latim. Hoje?"],["Os cheiros da cidade","Antes: pão no forno. Hoje?"]]},{"nivel":3,"tipo":"texto","rot":"Quatro versos teus","pergunta":"Escreve quatro versos sobre uma rua que conheces ao fim do dia: uma pessoa que trabalha, um cheiro e um pormenor que incomode. Até 40 palavras.","minPalavras":15,"maxPalavras":40,"placeholder":"Na rua…"},{"nivel":3,"tipo":"texto","rot":"O pormenor que acusa","pergunta":"Cesário acusa a sociedade com um pormenor, não com um discurso. Qual seria o teu pormenor? Uma frase.","minPalavras":8,"placeholder":"Mostraria…"}],"fontes":[["Cesário Verde, O Livro de Cesário Verde (Project Gutenberg n.º 8698)","https://www.gutenberg.org/ebooks/8698"],["Wikipédia, «O Livro de Cesário Verde» (edição póstuma de 1887)","https://pt.wikipedia.org/wiki/O_Livro_de_Ces%C3%A1rio_Verde"]],"modulo":"M6","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Candide-Cultivar-o-Jardim.html","id":"candide-jardim","cor":"#3f5f3f","corEscura":"#9dc39d","marca":"Ler a fundo · 5 min · Leituras extra","titulo":"Cultivar o nosso jardim","subtitulo":"Voltaire, Cândido, 1759","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Ironia apanhada","Viste onde Voltaire diz uma coisa para dizer o contrário."],[0.5,"Bom ouvido para a ironia","Já percebeste o jogo. Relê o elogio ao barão e pergunta porquê."],[0,"A entrar no conto","Relê devagar: quando o narrador elogia, desconfia."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Em 1759, <b>Voltaire</b> escreve a história de um rapaz que aprende que vive no melhor dos mundos possíveis. Depois vêm a guerra, o naufrágio e o terramoto de Lisboa.</p><p><i>Havia na Vestefália, no castelo do senhor barão de Thunder-ten-tronckh, um rapaz a quem a natureza dera os costumes mais doces. […] Tinha o juízo bastante reto e o espírito mais simples; é, creio, por essa razão que lhe chamavam Cândido.</i></p><p><i>O senhor barão era um dos senhores mais poderosos da Vestefália, porque o seu castelo tinha uma porta e janelas.</i></p><p class=\"nota\">Tradução nossa do francês. Cândido — nome que quer dizer ingénuo, puro.</p>","links":[["Ler o original em francês (Project Gutenberg)","https://www.gutenberg.org/ebooks/4650"]]},{"nivel":1,"tipo":"unica","rot":"O castelo","pergunta":"«Era um dos senhores mais poderosos da Vestefália, porque o seu castelo tinha uma porta e janelas.» Porque é que isto faz sorrir?","opcoes":[["A razão dada é banal e desfaz a grandeza anunciada","certo","Sim: qualquer casa tem porta e janelas. O narrador finge elogiar e ridiculariza."],["Porque um castelo não pode ter janelas","cuidado","Pode. O riso está na razão apresentada, não no facto."],["Porque o barão era pobre e mentia","cuidado","O texto não diz que mente. Diz que o motivo do poder é ridículo."]]},{"nivel":1,"tipo":"unica","rot":"O nome","pergunta":"Porque é que o rapaz se chama Cândido?","opcoes":[["Pelo juízo reto e pelo espírito simples","certo","Sim, é o próprio texto que o explica: «por essa razão que lhe chamavam Cândido»."],["Por ser filho do barão","cuidado","O texto levanta dúvidas sobre a família dele, mas o nome vem do carácter."],["Por ser o mais corajoso do castelo","cuidado","Cândido quer dizer ingénuo, não corajoso."]]},{"nivel":2,"tipo":"multi","rot":"Depois do terramoto","pergunta":"Depois do terramoto de Lisboa, escreve Voltaire, decidiu-se que «o espetáculo de algumas pessoas queimadas em lume brando» seria «um segredo infalível para impedir a terra de tremer». Toca no que ele está a criticar.","opcoes":[["A superstição de ligar um castigo a um fenómeno natural",5,"Sim: a terra não treme por causa do que as pessoas fazem."],["A crueldade transformada em cerimónia pública",5,"Sim: «em grande cerimónia», como se fosse festa."],["Os sábios e a universidade que o decidem",5,"Sim: quem devia pensar é quem assina a decisão."],["Os habitantes de Lisboa que fugiram",0,"Não há crítica a quem sofreu o terramoto."]]},{"nivel":2,"tipo":"cartoes","rot":"A última frase","pergunta":"No fim, o mestre Pangloss continua a explicar que tudo está bem, e Cândido responde: «é preciso cultivar o nosso jardim». Escolhe a leitura que defendes e explica numa linha.","cartoes":[["Desistir de mudar o mundo","Cansado de teorias, fecha-se no que é seu."],["Trocar a teoria pelo trabalho","Deixa de explicar o mal e começa a fazer alguma coisa."],["Escolher onde se consegue agir","Não é o mundo inteiro: é o pedaço onde a minha mão chega."],["Uma resposta que cala o mestre","Depois de tanta explicação, uma frase curta encerra a conversa."]]},{"nivel":3,"tipo":"texto","rot":"O teu jardim","pergunta":"Qual é o teu jardim este ano: uma coisa pequena, ao teu alcance, que fique melhor se lhe pegares? Escreve o primeiro passo, com um verbo de ação.","minPalavras":10,"maxPalavras":40,"placeholder":"O meu jardim é… e o primeiro passo é…"},{"nivel":3,"tipo":"texto","rot":"À maneira de Voltaire","pergunta":"Escreve uma frase que finja elogiar alguma coisa e a deixe ridícula, com a mesma receita do castelo: elogio grande, razão banal.","minPalavras":8,"maxPalavras":30,"placeholder":"É o maior… porque…"}],"fontes":[["Voltaire, Candide, ou l'Optimisme, texto francês (Project Gutenberg)","https://www.gutenberg.org/ebooks/4650"],["Cândido, ou O Otimismo (Wikipédia)","https://pt.wikipedia.org/wiki/C%C3%A2ndido,_ou_O_Otimismo"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Frei-Luis-Ninguem.html","id":"frei-luis-ninguem","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · Frei Luís de Sousa","titulo":"Ninguém","subtitulo":"Almeida Garrett, Frei Luís de Sousa, 1843 · ato II, cenas XIV e XV","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de palco","Viste o que uma palavra e um gesto fazem a uma família inteira."],[0.5,"Bom começo","Já percebeste quem é o Romeiro. Relê o gesto do bordão e pergunta porquê."],[0,"A entrar na cena","Relê devagar: o Romeiro fala de si na terceira pessoa."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Em 1843, <b>Almeida Garrett</b> escreve a peça. D. Madalena de Vilhena esperou anos pelo primeiro marido, D. João de Portugal, desaparecido na batalha de Alcácer-Quibir, e voltou a casar. Um dia chega a casa um romeiro vindo da Terra Santa. Frei Jorge pergunta-lhe se visitou os Lugares Santos.</p><p><i>ROMEIRO — Não os visitei; morei lá vinte anos cumpridos.</i></p><p>O romeiro traz um recado de um cativo:</p><p><i>«Ide a D. Madalena de Vilhena, e dizei-lhe que um homem que muito bem lhe quis… aqui está vivo… por seu mal… e daqui não pode sair nem mandar-lhe novas suas de há vinte anos que o trouxeram cativo.»</i></p><p>Madalena foge a gritar. Ficam Frei Jorge e o romeiro.</p><p><i>JORGE — Romeiro, romeiro! quem és tu?<br>ROMEIRO, apontando com o bordão para o retrato de D. João de Portugal — Ninguém.</i></p>"},{"nivel":1,"tipo":"unica","rot":"Vinte anos","pergunta":"«Não os visitei; morei lá vinte anos cumpridos.» O que diz o romeiro sobre a Terra Santa?","opcoes":[["Que não foi lá em peregrinação: esteve lá preso vinte anos","certo","Sim. A resposta desvia a pergunta de Jorge e conta, sem o dizer, uma vida inteira de cativeiro."],["Que visitou todos os Lugares Santos","cuidado","Diz o contrário: «Não os visitei»."],["Que foi lá rezar pela alma de D. João","cuidado","O texto não diz isso. Diz que morou lá vinte anos."]]},{"nivel":1,"tipo":"unica","rot":"O recado","pergunta":"«Um homem que muito bem lhe quis… aqui está vivo.» De quem fala o romeiro?","opcoes":[["De D. João de Portugal, o primeiro marido de Madalena — e o romeiro é ele próprio, embora fale dele na terceira pessoa","certo","Sim. O recado fala de «um homem» como se fosse outro; o gesto final desfaz a distância."],["De um companheiro de cativeiro que ficou lá","cuidado","É o que Madalena quer acreditar por um momento. A cena seguinte responde."],["De Manuel de Sousa Coutinho, o segundo marido","cuidado","Manuel está em casa e não foi cativo. O recado vem de quem desapareceu há vinte anos."]]},{"nivel":2,"tipo":"multi","rot":"Ninguém","pergunta":"Jorge pergunta «quem és tu?» e o romeiro aponta o bordão para o retrato e diz «Ninguém». Toca no que esta palavra faz.","opcoes":[["Diz quem ele é sem dizer o nome: o retrato responde por ele",5,"Sim: o gesto identifica, a palavra nega."],["Diz que, para esta casa, ele já não existe",5,"Sim: vivo para a lei, morto para a família."],["Deixa a família sem saída: se ele existe, o casamento e a filha perdem o nome",5,"Sim: é isso que Madalena percebe quando grita «perdidas, desonradas»."],["Diz que voltou para retomar o lugar e o nome",0,"Não: o gesto é o contrário. Ele nega-se."]]},{"nivel":2,"tipo":"cartoes","rot":"O gesto","pergunta":"Porque é que aponta com o bordão para o retrato em vez de dizer o nome? Escolhe a leitura que defendes e explica numa linha.","cartoes":[["Porque o nome já não é dele","Vinte anos depois, o nome pertence a um morto, a um retrato."],["Porque a imagem diz mais do que a palavra","Um retrato na parede não se pode negar; um nome dito pode-se."],["Porque quer poupar Jorge","Dizer o nome em voz alta seria acusar; o gesto deixa a Jorge o trabalho de perceber."],["Porque ninguém acreditaria","Um romeiro que se diz D. João de Portugal seria um impostor; o retrato prova."]]},{"nivel":3,"tipo":"texto","rot":"A tua palavra","pergunta":"No lugar do romeiro, que palavra dirias a Jorge? Escreve-a e explica numa linha o que ela faria a esta família.","minPalavras":8,"maxPalavras":40,"placeholder":"Eu diria «…», porque…"},{"nivel":3,"tipo":"texto","rot":"Olhar de encenador","pergunta":"És o encenador. Descreve em duas frases o momento do «Ninguém»: luz, posição do romeiro no palco, onde estão Jorge e o retrato.","minPalavras":12,"maxPalavras":50,"placeholder":"A luz… O romeiro está… Jorge…"}],"fontes":[["Almeida Garrett, Frei Luiz de Sousa (1844), texto integral (Project Gutenberg n.º 17591)","https://www.gutenberg.org/ebooks/17591"],["Frei Luís de Sousa (peça), Wikipédia","https://pt.wikipedia.org/wiki/Frei_Lu%C3%ADs_de_Sousa_(pe%C3%A7a_teatral)"]],"modulo":"M4","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camilo-Se-Eu-Fosse-Amada.html","id":"camilo-mariana","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · Amor de Perdição","titulo":"Se eu fosse amada como ela!","subtitulo":"Camilo Castelo Branco, Amor de Perdição, 1862 · cap. X","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de silêncios","Ouviste o que Mariana diz só para si."],[0.5,"Bom começo","Já sabes quem está à janela. Relê a frase repetida e pergunta porquê."],[0,"A entrar na cena","Relê devagar: Mariana fala com o coração, não com as pessoas."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Em 1862, <b>Camilo Castelo Branco</b> conta a história de Simão e Teresa, separados pelas famílias. Teresa está fechada num convento. <b>Mariana</b>, filha de um ferrador, ama Simão sem nunca lho dizer — e é ela quem leva a carta dele ao convento. Enquanto espera no pátio, olha para as janelas.</p><p><i>N'uma das janellas, através das rexas de ferro, viu ella uma senhora sem habito.</i></p><p><i>— Será aquella? — perguntou Marianna ao seu coração, que palpitava — Se eu fosse amada como ella!...</i></p><p><i>Marianna deu alguns passos, olhou novamente para a janella onde vira a senhora sem habito, e repetiu ainda:</i></p><p><i>— Se eu fosse amada como ella!...</i></p><p class=\"pequeno\">Grafia da edição de 1862: «janellas», «ella», «habito».</p>"},{"nivel":1,"tipo":"unica","rot":"À janela","pergunta":"«viu ella uma senhora sem habito». Quem é a senhora sem hábito?","opcoes":[["Teresa, que está no convento sem ser freira","certo","Sim. Sem hábito quer dizer que não professou: foi ali posta pela família, não por vocação."],["Uma freira que tirou o hábito","cuidado","O texto diz só «sem habito». Quem está num convento sem ser freira é quem lá foi fechada."],["A prioresa do convento","cuidado","A prioresa está à porta, a falar com o padre capelão. À janela está outra pessoa."]]},{"nivel":1,"tipo":"unica","rot":"A quem pergunta","pergunta":"«perguntou Marianna ao seu coração». A quem faz Mariana a pergunta?","opcoes":[["A si própria: ninguém a ouve","certo","Sim. Mariana nunca diz a ninguém o que sente; o leitor é o único que ouve."],["À senhora que está à janela","cuidado","Estão longe uma da outra e Mariana não fala alto. A pergunta é para dentro."],["Ao padre capelão","cuidado","O padre já saiu do pátio. Mariana está sozinha."]]},{"nivel":2,"tipo":"multi","rot":"Duas vezes","pergunta":"Mariana diz duas vezes «Se eu fosse amada como ella!...». Toca no que a repetição mostra.","opcoes":[["Que ama Simão e não o diz a ninguém",5,"Sim: a frase só existe dentro dela."],["Que se compara com Teresa e sai a perder",5,"Sim: «como ella» faz de Teresa a medida."],["Que o desejo não passa: volta quando ela volta a olhar",5,"Sim: «olhou novamente» e «repetiu ainda»."],["Que quer fazer mal a Teresa",0,"Não. Mariana leva-lhe a carta de Simão: serve o amor dos outros."]]},{"nivel":2,"tipo":"cartoes","rot":"Se eu fosse","pergunta":"«Se eu fosse amada»: o verbo está no condicional do desejo. Escolhe a leitura que defendes e explica numa linha.","cartoes":[["Sabe que não é amada","O «se» diz que a condição não se cumpre, e ela sabe-o."],["Não pede nada a ninguém","Não diz «quero ser»: diz «se eu fosse». Deseja sem exigir."],["Ama quem ama outra","Inveja o amor, não a pessoa: queria o lugar, não o mal de Teresa."],["Aceita o lugar que lhe deram","Filha de um ferrador, não espera ser escolhida por um fidalgo."]]},{"nivel":3,"tipo":"texto","rot":"O que Mariana não diz","pergunta":"Escreve uma frase que Mariana pensaria e nunca diria a Simão.","minPalavras":8,"maxPalavras":30,"placeholder":"Se eu pudesse dizer-te…"},{"nivel":3,"tipo":"texto","rot":"Olhar de realizador","pergunta":"Filma este momento em dois planos. Diz o que se vê em cada um e onde está a câmara.","minPalavras":12,"maxPalavras":50,"placeholder":"Plano 1: … Plano 2: …"}],"fontes":[["Camilo Castelo Branco, Amor de Perdição (1862), texto integral (Project Gutenberg n.º 16425)","https://www.gutenberg.org/ebooks/16425"],["Amor de Perdição (Wikipédia)","https://pt.wikipedia.org/wiki/Amor_de_Perdi%C3%A7%C3%A3o"]],"modulo":"M5","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Antero-Palacio-da-Ventura.html","id":"antero-palacio","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · Antero de Quental","titulo":"O Palácio da Ventura","subtitulo":"Antero de Quental, Os Sonetos Completos, 1886","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de sonetos","Viste como catorze versos contam uma vida inteira."],[0.5,"Bom começo","Já seguiste o cavaleiro até à porta. Relê o último verso e pergunta o que ele desfaz."],[0,"A entrar no poema","Relê devagar: cada estrofe é um passo da viagem."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><b>Antero de Quental</b> (1842–1891) escreve sonetos que pensam. Neste, um cavaleiro procura o palácio da felicidade — a Ventura.</p><p><i>Sonho que sou um cavalleiro andante.<br>Por desertos, por sóes, por noite escura,<br>Paladino do amor, busco anhelante<br>O palacio encantado da Ventura!</i></p><p><i>Mas já desmaio, exhausto e vacillante.<br>Quebrada a espada já, rota a armadura...<br>E eis que subito o avisto, fulgurante<br>Na sua pompa e aerea formosura!</i></p><p><i>Com grandes golpes bato á porta e brado:<br>Eu sou o Vagabundo, o Desherdado...<br>Abri-vos, portas d'ouro, ante meus ais!</i></p><p><i>Abrem-se as portas d'ouro, com fragor...<br>Mas dentro encontro só, cheio de dor,<br>Silencio e escuridão — e nada mais!</i></p><p class=\"pequeno\">Grafia da edição de 1886: «cavalleiro», «sóes», «anhelante» (ansioso), «subito».</p>"},{"nivel":1,"tipo":"unica","rot":"O primeiro verbo","pergunta":"O soneto começa por «Sonho que sou». O que é que este verbo avisa logo?","opcoes":[["Que a viagem se passa dentro de quem fala: é um sonho, não uma aventura","certo","Sim. O cavaleiro é uma imagem que o sujeito faz de si próprio."],["Que o poema conta uma lenda medieval","cuidado","O cenário é medieval, mas quem fala diz «Sonho que sou»: a história é dele."],["Que o cavaleiro está a dormir à porta do palácio","cuidado","O sonho vem antes de tudo: é ele que inventa o cavaleiro e o palácio."]]},{"nivel":1,"tipo":"unica","rot":"A meio caminho","pergunta":"«Quebrada a espada já, rota a armadura...» Em que estado chega o cavaleiro?","opcoes":[["Exausto e sem defesas, quase a desistir","certo","Sim: «já desmaio, exhausto e vacillante». É nesse momento que avista o palácio."],["Vitorioso, depois de vencer os inimigos","cuidado","Não há inimigos no poema. O que o gasta é a própria procura."],["Ferido por guardas do palácio","cuidado","Ainda não chegou ao palácio: a espada partiu-se pelo caminho."]]},{"nivel":2,"tipo":"multi","rot":"E nada mais","pergunta":"As portas de ouro abrem-se «com fragor» e lá dentro há «Silencio e escuridão — e nada mais!». Toca no que este final faz ao poema.","opcoes":[["Desfaz a promessa do palácio «fulgurante»: o brilho era só de fora",5,"Sim: «fulgurante» (v. 7) contra «escuridão» (v. 14)."],["Põe o ruído das portas contra o silêncio do interior",5,"Sim: «com fragor» e logo «Silencio»."],["Diz que a felicidade procurada fora de nós pode não existir",5,"Sim: é a leitura da alegoria. O palácio é a Ventura."],["Mostra que o cavaleiro se enganou na porta",0,"Não: é o palácio certo. O vazio é a resposta."]]},{"nivel":2,"tipo":"cartoes","rot":"O vazio","pergunta":"O que é o «nada» que ele encontra? Escolhe a leitura que defendes e explica numa linha.","cartoes":[["A felicidade não existe","Procurou a vida inteira uma coisa que não há."],["A felicidade não está onde a procurou","O erro é o sítio, não o desejo: procurou fora o que só podia estar dentro."],["O que valia era o caminho","Desertos, sóis, noite escura: viveu enquanto procurava."],["O ideal só brilha de longe","De perto, tudo o que se idealiza fica vazio."]]},{"nivel":3,"tipo":"texto","rot":"A tua porta","pergunta":"Se o cavaleiro batesse hoje a uma porta, que palácio seria? Diz qual e o que encontraria lá dentro.","minPalavras":10,"maxPalavras":40,"placeholder":"Hoje o palácio seria… e lá dentro…"},{"nivel":3,"tipo":"texto","rot":"Outro último verso","pergunta":"Escreve outro último verso para o soneto, com o mesmo travessão a meio.","minPalavras":5,"maxPalavras":15,"placeholder":"… — e …"}],"fontes":[["Antero de Quental, Os Sonetos Completos (1886), texto integral (Project Gutenberg n.º 20142)","https://www.gutenberg.org/ebooks/20142"],["Antero de Quental (Wikipédia)","https://pt.wikipedia.org/wiki/Antero_de_Quental"]],"modulo":"M6","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Dom-Casmurro-O-Titulo.html","id":"casmurro-titulo","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · Leituras extra","titulo":"Não consultes dicionários","subtitulo":"Machado de Assis, Dom Casmurro, 1899 · cap. I","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor desconfiado","Percebeste quem manda neste livro: quem o conta."],[0.5,"Bom começo","Já sabes como nasceu o título. Pergunta agora a quem interessa contá-lo assim."],[0,"A entrar no romance","Relê devagar: é tudo contado por um homem só."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Em 1899, o brasileiro <b>Machado de Assis</b> abre um romance a explicar o título. Quem fala é o próprio protagonista: no comboio, um rapaz do bairro pôs-se a recitar-lhe versos.</p><p><i>Succedeu, porém, que como eu estava cançado, fechei os olhos tres ou quatro vezes; tanto bastou para que elle interrompesse a leitura e mettesse os versos no bolso.</i> […]</p><p><i>No dia seguinte entrou a dizer de mim nomes feios, e acabou alcunhando-me Dom Casmurro. Os visinhos, que não gostam dos meus habitos reclusos e calados, deram curso á alcunha, que afinal pegou.</i> […]</p><p><i>Não consultes diccionarios. Casmurro não está aqui no sentido que elles lhe dão, mas no que lhe poz o vulgo de homem calado e mettido comsigo. Dom veiu por ironia, para attribuir-me fumos de fidalgo. Tudo por estar cochilando!</i> […]</p><p><i>O meu poeta do trem ficará sabendo que não lhe guardo rancor. E com pequeno esforço, sendo o titulo seu, poderá cuidar que a obra é sua.</i></p><p class=\"pequeno\">Grafia da edição de 1899: «succedeu», «cançado», «diccionarios». «Cochilar» é dormitar; «trem» é comboio.</p>"},{"nivel":1,"tipo":"ordenar","rot":"Como nasce um título","pergunta":"Põe por ordem o caminho que vai de uns versos no comboio até à capa do livro.","itens":["Um rapaz do bairro recita-lhe versos no comboio","O narrador, cansado, fecha os olhos três ou quatro vezes","O rapaz interrompe a leitura e mete os versos no bolso","No dia seguinte, o rapaz chama-lhe Dom Casmurro","Os vizinhos espalham a alcunha, e ela pega","O narrador dá ao livro o título que o ofendia"],"retorno":"Quem batiza o livro é um poeta amuado. O narrador pega na ofensa e assina por baixo."},{"nivel":2,"tipo":"unica","rot":"O dicionário","pergunta":"«Não consultes diccionarios.» Porque é que o narrador dá esta ordem ao leitor?","opcoes":[["Porque usa a palavra num sentido que ele escolheu, e quer mandar na leitura","certo","Sim: «calado e mettido comsigo». É ele quem decide o que as palavras querem dizer."],["Porque a palavra «casmurro» não existe","cuidado","Existe, e o narrador sabe-o: fala do «sentido que elles lhe dão». Só não quer que o uses."],["Porque os dicionários do tempo estavam errados","cuidado","Não diz que estão errados. Diz que o sentido dele é outro."]]},{"nivel":2,"tipo":"multi","rot":"Confiar em quem conta","pergunta":"Este homem vai contar a própria vida sozinho, sem mais ninguém a confirmar. Toca no que, logo na primeira página, já faz desconfiar.","opcoes":[["Decide ele o que as palavras querem dizer",5,"Sim: «Não consultes diccionarios»."],["Diz que não guarda rancor e, na frase seguinte, troça do poeta",5,"Sim: «poderá cuidar que a obra é sua»."],["Conta só o seu lado: do rapaz, sabemos o que ele nos quer dizer",5,"Sim: o poeta nunca tem a palavra."],["Engana-se no nome do comboio",0,"Não há engano nenhum: é o «trem da Central»."]]},{"nivel":3,"tipo":"texto","rot":"A tua alcunha","pergunta":"Que alcunha te deram, ou darias a ti? Explica-a à maneira de Machado: diz primeiro o que ela NÃO quer dizer, depois o que quer.","minPalavras":12,"maxPalavras":45,"placeholder":"Não consultes dicionários. … não está aqui no sentido de…, mas no de…"}],"fontes":[["Machado de Assis, Dom Casmurro (1899), texto integral (Project Gutenberg n.º 55752)","https://www.gutenberg.org/ebooks/55752"],["Dom Casmurro (Wikipédia)","https://pt.wikipedia.org/wiki/Dom_Casmurro"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Oficina-Escada-da-Tensao.html","id":"oficina-escada","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Oficina · 5 min · escrever","titulo":"A escada da tensão","subtitulo":"Oficina de escrita · cada problema resolvido cria um problema maior","niveis":["Ver a escada","Subir um degrau"],"emblemas":[[0.8,"Arquiteto de sustos","Já sabes que a tensão se constrói degrau a degrau."],[0.5,"Bom começo","Viste a escada. Agora repara: cada degrau nasce do anterior."],[0,"A subir","Relê a história pela ordem certa e pergunta o que causa o quê."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Numa história que prende, a tensão não sobe ao acaso: sobe por <b>degraus</b>. A personagem resolve um problema, e a solução cria um problema <b>maior</b>.</p><p>A história que se segue é nossa, feita para este exercício. Chegou-te com os degraus trocados.</p>"},{"nivel":1,"tipo":"ordenar","rot":"Arruma a escada","pergunta":"Põe os degraus por ordem: cada um tem de nascer do anterior.","itens":["O Rui perde o último autocarro da noite","Decide ir a pé e liga o mapa no telemóvel, que tem 3 % de bateria","O telemóvel apaga-se; para não se perder, corta por uma rua que lhe parece conhecida","A rua acaba num portão fechado, entre dois muros altos","Volta-se para trás e ouve passos a entrar na mesma rua"],"retorno":"Repara: cada solução (ir a pé, usar o mapa, cortar caminho, voltar para trás) é a causa do problema seguinte."},{"nivel":1,"tipo":"unica","rot":"O degrau partido","pergunta":"Qual destas frases, posta a meio da história, deitava a escada abaixo?","opcoes":[["«Por sorte, passou um táxi vazio e o Rui chegou a casa em dez minutos.»","certo","Sim: resolve tudo sem criar problema novo. A tensão cai a zero e o leitor fecha o livro."],["«Começou a chover, e o Rui não tinha casaco.»","cuidado","Esta ainda piora as coisas: é mais um degrau, não um degrau partido."],["«A rua estava mais escura do que ele se lembrava.»","cuidado","Esta aumenta o medo. Não resolve nada."]]},{"nivel":2,"tipo":"texto","rot":"O sexto degrau","pergunta":"Escreve o degrau seguinte: o Rui faz alguma coisa para resolver os passos atrás dele, e isso cria um problema maior.","minPalavras":12,"maxPalavras":40,"placeholder":"O Rui… e foi então que…"},{"nivel":2,"tipo":"texto","rot":"A tua escada","pergunta":"Agora a tua: três degraus para uma personagem que só quer chegar a horas a um sítio. Uma linha por degrau.","minPalavras":15,"maxPalavras":50,"placeholder":"1. … 2. … 3. …"}],"fontes":[],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Oficina-Cortar-ate-ao-Osso.html","id":"oficina-cortar","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Oficina · 5 min · rever","titulo":"Cortar até ao osso","subtitulo":"Oficina de escrita · rever é tirar o que não faz falta","niveis":["Cortar nos outros","Cortar em ti"],"emblemas":[[0.8,"Tesoura afiada","Cortas o que enfeita e deixas o que conta."],[0.5,"Bom começo","Procura primeiro os advérbios em -mente e os adjetivos aos pares."],[0,"A afinar","Pergunta a cada palavra: se saíres, a frase perde alguma coisa?"]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Um primeiro rascunho tem sempre palavras a mais. <b>Rever é cortar</b>: advérbios que repetem o verbo, adjetivos aos pares, «muito» e «realmente».</p><p>Regra de ouro: corta tudo o que puderes <b>sem perder quem faz o quê</b>.</p><p class=\"pequeno\">As frases deste exercício são nossas, feitas para treinar.</p>"},{"nivel":1,"tipo":"riscar","rot":"O pescador","pergunta":"Esta frase tem 22 palavras. Deixa-a com 14 ou menos.","frase":"Naquela manhã muito fria de inverno, o velho pescador saiu devagar de casa, completamente sozinho, e caminhou lentamente até ao pequeno cais.","limite":14,"essenciais":["pescador","saiu","cais"],"modelo":"Naquela manhã de inverno, o velho pescador saiu sozinho e caminhou até ao cais.","retorno":"«Devagar» e «lentamente» dizem o mesmo; «completamente» não acrescenta nada a «sozinho»."},{"nivel":1,"tipo":"riscar","rot":"A Marta","pergunta":"Agora esta: 22 palavras. Deixa-a com 12 ou menos.","frase":"A Marta ficou realmente muito, muito triste quando finalmente percebeu que o seu querido irmão mais novo já tinha partido para sempre.","limite":12,"essenciais":["Marta","irmão","partido"],"modelo":"A Marta ficou triste quando percebeu que o irmão tinha partido.","retorno":"Quanto mais «muito», menos se acredita. A frase curta dói mais."},{"nivel":2,"tipo":"texto","rot":"A tua frase","pergunta":"Vai buscar uma frase comprida que tenhas escrito esta semana (numa ficha, numa mensagem). Escreve aqui só a versão cortada.","minPalavras":6,"maxPalavras":25,"placeholder":"Depois do corte: …"}],"fontes":[],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Discurso-Tomar-Posse-1923.html","id":"posse-1923","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · discurso político","titulo":"Tomar posse em 1923","subtitulo":"Manuel Teixeira Gomes, 5 de outubro de 1923","niveis":["Ver o que o discurso faz","Ler a escolha","Fazer com o que leste"],"emblemas":[[0.8,"Ouvido político","Já ouves o que cada frase de um discurso está a fazer."],[0.5,"Bom começo","Pergunta a cada frase: promete, agradece, avisa ou pede?"],[0,"A afinar","Relê: um discurso de posse é feito de gestos, e cada frase é um."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Antes","html":"<p>A 5 de outubro de 1923, o escritor <b>Manuel Teixeira Gomes</b> toma posse como Presidente da República. O país está em crise. O discurso tem pouco mais de quinhentas palavras e cada frase faz um gesto: saúda, promete, avisa, confia.</p><p>Liga cada frase ao gesto que faz.</p>"},{"nivel":1,"tipo":"par","rot":"Cada frase, um gesto","pergunta":"Que gesto faz cada frase do discurso?","pares":[["«Espinhoso é o cargo de Presidente da República»","avisar que a tarefa é difícil"],["«Mantemos excelentes relações com todas as nações do Mundo»","tranquilizar sobre o país lá fora"],["«É quase angustiosa a crise que atravessam todas as nações europeias»","reconhecer o problema"],["«Tão vastos são porém os recursos naturais da nossa abençoada Pátria»","dar esperança"],["«Fio do patriotismo do Povo Português»","confiar no povo"],["«Viva a República Portuguesa!»","fechar com um grito de união"]],"retorno":"Repara na ordem: reconhece a crise, depois dá esperança, depois confia. É a escada de quase todos os discursos de posse."},{"nivel":2,"tipo":"unica","rot":"«Porém»","pergunta":"«Tão vastos são porém os recursos naturais…» O que faz a palavra «porém» neste ponto do discurso?","opcoes":[["Vira a página: depois de admitir a crise, começa a parte da esperança","certo","Sim. Um discurso que só reconhecesse a crise seria um lamento; o «porém» é a viragem."],["Contradiz o que disse antes, por descuido","cuidado","Não há descuido: a crise é real e os recursos também. O «porém» liga as duas coisas."],["Serve só para dar ritmo à frase","cuidado","Dá ritmo, mas sobretudo muda a direção do discurso."]]},{"nivel":3,"tipo":"texto","rot":"A tua posse","pergunta":"Tomas posse de alguma coisa (um clube, uma turma, um projeto). Escreve três frases com três gestos: reconhecer um problema, dar esperança, confiar em alguém.","minPalavras":20,"maxPalavras":60,"placeholder":"Sei que… Mas… Confio em…"}],"fontes":[["Manuel Teixeira Gomes, discurso de tomada de posse (5 de outubro de 1923), Diário do Congresso · Wikisource","https://pt.wikisource.org/wiki/Discurso_de_Tomada_de_Posse_do_Presidente_Manuel_Teixeira_Gomes"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Oficina-A-Frase-que-Manda.html","id":"oficina-frase-manda","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Oficina · 5 min · escrever","titulo":"A frase que manda","subtitulo":"Oficina de escrita · a frase curta, a frase longa e a ordem das coisas","niveis":["Ouvir o efeito","Escrever com intenção"],"emblemas":[[0.8,"Mão no volante","Já escolhes o comprimento e a ordem da frase pelo efeito que queres."],[0.5,"Bom começo","Lê as frases em voz alta: o fôlego diz-te o que cada uma faz."],[0,"A afinar","Pergunta a cada frase: onde está o choque, no princípio ou no fim?"]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Uma frase <b>curta</b> corta e dá choque. Uma frase <b>longa</b> estica o tempo e liga tudo. E a <b>ordem</b> também manda: dizer primeiro o que acontece («A grua tombou.») não é o mesmo que fazer esperar («Ao fim da tarde, quando já ninguém olhava, a grua tombou.»).</p><p class=\"pequeno\">As frases deste exercício são nossas, feitas para treinar.</p>"},{"nivel":1,"tipo":"classificar","rot":"Choque ou espera?","pergunta":"Em cada frase, o acontecimento chega logo (choque) ou faz-se esperar (espera)?","categorias":["choque","espera"],"itens":[["A porta abriu-se.",0],["Depois de três batidas, de um silêncio e de mais uma batida, a porta abriu-se.",1],["Perdeu o comboio.",0],["Com o bilhete na mão, a correr pela plataforma, a ver as portas a fechar-se, perdeu o comboio.",1]],"retorno":"O choque vem da frase curta com o verbo logo no início; a espera vem da frase longa que guarda o verbo para o fim."},{"nivel":1,"tipo":"par","rot":"Cada frase, um efeito","pergunta":"Liga cada frase ao efeito que produz.","pares":[["Ninguém respondeu.","corte seco: o silêncio pesa"],["A chuva caía, e caía, e continuava a cair sobre os telhados, sobre a rua, sobre nós.","o tempo estica-se"],["Foi então que ele viu a carta em cima da mesa, aberta.","a surpresa fica para o fim"],["Abriu a carta, leu-a, rasgou-a.","três ações em ritmo de martelo"]],"retorno":"O comprimento e a ordem não são enfeite: são o ritmo do que acontece."},{"nivel":2,"tipo":"texto","rot":"Duas versões","pergunta":"Escreve o mesmo acontecimento (alguém chega atrasado a um sítio) em duas frases: uma de choque, outra de espera.","minPalavras":12,"maxPalavras":50,"placeholder":"Choque: … Espera: …"}],"fontes":[],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Responder-Faz-o-que-o-Verbo-Pede.html","id":"responder-verbo","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Responder · 5 min · teste e prova","titulo":"Faz o que o verbo pede","subtitulo":"Identifica, refere, compara, caracteriza, interpreta: cinco verbos, cinco respostas diferentes","niveis":["Ler o verbo","Julgar respostas","Escrever a tua"],"emblemas":[[0.8,"Corretor de serviço","Já vês numa resposta o que falta antes do docente."],[0.5,"Bom começo","Pergunta sempre: onde está a prova? e a ligação entre a prova e a ideia?"],[0,"A afinar","Relê o verbo da pergunta: cada um pede uma coisa diferente."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Numa pergunta de teste, o <b>verbo</b> diz o que a resposta tem de fazer. Uma resposta boa não é longa nem bonita: faz <b>exatamente</b> o que o verbo pede, com <b>prova</b> no texto.</p><p class=\"pequeno\">As respostas de aluno deste exercício são nossas, feitas para treinar. O quadro completo dos verbos está no documento «Responder com precisão».</p>"},{"nivel":1,"tipo":"par","rot":"Cada verbo, um pedido","pergunta":"Liga cada verbo ao que ele pede.","pares":[["Identifique","o nome preciso, sem comentário a mais"],["Refira dois aspetos","exatamente dois, diferentes, cada um com prova"],["Compare","semelhança ou diferença, com os dois lados nomeados"],["Caracterize","um traço e a manifestação concreta desse traço"],["Interprete","um sentido proposto, com prova e coerência com o todo"]],"retorno":"Cinco verbos, cinco moldes. O erro mais comum é responder a «identifique» com uma interpretação, e a «interprete» com um resumo."},{"nivel":2,"tipo":"julgar","rot":"Passa ou não passa?","pergunta":"A pergunta era: «Caracterize Inês Pereira, com base no texto.» Julga cada resposta.","casos":[["Inês é ambiciosa e sonhadora.",false,"Não passa: dois adjetivos soltos, sem prova nem manifestação concreta."],["Inês é ambiciosa: recusa o lavrador e quer um marido «que saiba tanger» e falar de amores, como diz à mãe.",true,"Passa: um traço, a manifestação concreta e a referência ao texto."],["Inês Pereira é a protagonista da farsa de Gil Vicente, que casa duas vezes.",false,"Não passa: conta o enredo em vez de caracterizar."],["Inês quer mudar de vida, o que se vê quando prefere o escudeiro ao lavrador, apesar dos avisos.",true,"Passa: traço («quer mudar de vida») com a manifestação no texto."]],"retorno":"Repara: as duas que passam têm um traço e a prova. As duas que não passam ou não provam ou não caracterizam."},{"nivel":3,"tipo":"texto","rot":"A tua resposta","pergunta":"Escolhe uma personagem de um texto que estejas a estudar e caracteriza-a numa frase que passe: um traço e a manifestação concreta, com a expressão do texto entre aspas.","minPalavras":15,"maxPalavras":50,"placeholder":"… é …: «…»"}],"fontes":[["EPI · Português 2026/2027, documento comum 14, «Responder com precisão»",""]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Habitos-Os-Cinco.html","id":"habitos-cinco","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Pensar · 5 min · hábitos criativos","titulo":"Os cinco hábitos","subtitulo":"Inquisitivo, persistente, imaginativo, colaborativo, disciplinado","niveis":["Reconhecer","Olhar para ti"],"emblemas":[[0.8,"Olho treinado","Já reconheces um hábito criativo quando o vês em ação."],[0.5,"Bom começo","Relê as cinco definições: cada hábito é um verbo (perguntar, insistir, imaginar, partilhar, rever)."],[0,"A afinar","Pergunta a cada cena: o que é que esta pessoa está a fazer, exatamente?"]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Pensar de forma criativa não é um dom: são <b>cinco hábitos</b> que se treinam. <b>Inquisitivo</b>: pergunta, duvida, investiga o porquê. <b>Persistente</b>: aguenta a dificuldade e a incerteza. <b>Imaginativo</b>: gera ideias e faz ligações inesperadas. <b>Colaborativo</b>: partilha, dá e recebe crítica. <b>Disciplinado</b>: revê, corrige, acaba.</p><p class=\"pequeno\">Modelo de Lucas, Claxton e Spencer (OCDE, 2013), usado no documento «Hábitos de pensamento criativo». As cenas são nossas.</p>"},{"nivel":1,"tipo":"classificar","rot":"Que hábito é?","pergunta":"Em cada cena, que hábito está a trabalhar?","categorias":["inquisitivo","persistente","imaginativo","colaborativo","disciplinado"],"itens":[["Antes de filmar, a Sara pergunta ao grupo porque é que a cena tem de ser à noite.",0],["A terceira versão do cartaz também não resultou; o Tiago começa a quarta.",1],["Para o anúncio de um dicionário, o Nuno propõe filmar só mãos.",2],["A Rita mostra o rascunho a dois colegas e apontou o que lhe disseram antes de responder.",3],["A Inês leu o texto em voz alta, cortou três frases e só depois entregou.",4],["O Miguel quis saber de onde vinha a palavra «tabacaria» antes de fazer a legenda.",0]],"retorno":"Nenhum destes hábitos é «talento». Todos são coisas que se fazem, e por isso se podem fazer mais vezes."},{"nivel":2,"tipo":"deslizar","rot":"O teu ponto fraco","pergunta":"Entre estes dois, qual te custa mais?","esquerda":"persistir (insistir quando não sai)","direita":"disciplinar (rever e acabar)"},{"nivel":2,"tipo":"texto","rot":"O próximo módulo","pergunta":"Escolhe um dos cinco hábitos para treinar no próximo módulo e diz uma coisa concreta que vais fazer diferente.","minPalavras":10,"maxPalavras":40,"placeholder":"Vou treinar o hábito … : da próxima vez, …"}],"fontes":[["Lucas, B., Claxton, G. e Spencer, E. (2013), Progression in Student Creativity in School, OECD Education Working Papers n.º 86","https://www.oecd.org/en/publications/progression-in-student-creativity-in-school_5k4dp59msdwk-en.html"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Palavras-Chao-e-Plano.html","id":"palavras-dobretes","cor":"#6b4a8c","corEscura":"#c1a3dd","marca":"Palavras · 5 min · léxico e história da língua","titulo":"Chão e plano","subtitulo":"Duas vias para a mesma palavra latina","niveis":["Reconhecer","Explicar","Escolher com intenção"],"emblemas":[[0.8,"Ouvido para a língua","Já escolhes as palavras pelo efeito, não pelo acaso."],[0.5,"Bom começo","Percebeste os pares. Falta usar a diferença na escrita."],[0,"A afinar","Volta aos pares: uma palavra vem do uso, a outra veio dos livros."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Duas vias","html":"<p>Muitas palavras latinas chegaram ao português por <b>duas vias</b>: a <b>popular</b>, gasta pelo uso de todos os dias, e a <b>erudita</b>, copiada mais tarde dos livros. Daí os <b>dobretes</b>:</p><p><b>chão</b> e <b>plano</b> (de <i>planus</i>) · <b>chato</b> e <b>prato</b> (de <i>platus</i>) · <b>rezar</b> e <b>recitar</b> (de <i>recitare</i>)</p><p>A palavra popular é curta e bate no estômago; a erudita é mais distante e formal. A escolha nunca é inocente: diz quem fala e para quem.</p>","links":[["Ver mais dobretes (Wikipédia)","https://pt.wikipedia.org/wiki/Dobrete"]]},{"nivel":1,"tipo":"unica","rot":"O par","pergunta":"Qual destes pares NÃO é um dobrete (mesma origem, duas vias)?","opcoes":[["chão / plano","cuidado","É dobrete: os dois vêm de <i>planus</i>."],["cheio / pleno","cuidado","É dobrete: os dois vêm de <i>plenus</i>."],["casa / lar","certo","Certo: são sinónimos, mas de origens diferentes. Não é o mesmo caso."]]},{"nivel":1,"tipo":"multi","rot":"Popular ou erudita","pergunta":"Toca nas palavras que chegaram pela via popular (gastas pelo uso).","opcoes":[["chão",5,"Sim: perdeu o «pl-» latino, como acontece na fala."],["chama",5,"Sim, de <i>flamma</i>: o mesmo desgaste."],["pleno",0,"Erudita: guarda o «pl-» do latim."],["recitar",0,"Erudita: veio dos livros, ao lado de «rezar»."]]},{"nivel":2,"tipo":"unica","rot":"O efeito","pergunta":"«Caiu ao chão» e «caiu ao plano»: porque é que a segunda soa estranha?","opcoes":[["Porque cada palavra ficou com os seus usos, e este não é o de «plano»","certo","Sim. «Plano» continua a ser uma superfície lisa — um plano inclinado, um plano de fundo —, mas não é a palavra para o sítio onde se cai."],["Porque «plano» perdeu o sentido físico e só serve para ideias","cuidado","Não perdeu: há planos inclinados, planos de mesa e, no teu curso, planos de filmagem."],["Porque «plano» é mais antiga","cuidado","É o contrário: entrou mais tarde, pela via dos livros."]]},{"nivel":2,"tipo":"cartoes","rot":"Quem fala assim","pergunta":"Escolhe uma personagem e diz que palavra do par ela usaria, e porquê.","cartoes":[["Um trabalhador de Cesário","Fala do que vê e toca."],["Um sermão de Vieira","Fala para convencer, com solenidade."],["Uma publicação tua","Fala para ser lida depressa."],["Um relatório do curso","Fala para ser exato."]]},{"nivel":3,"tipo":"texto","rot":"Duas versões","pergunta":"Escreve a mesma frase duas vezes: uma só com palavras populares, outra com palavras eruditas. Até 40 palavras no total.","minPalavras":12,"maxPalavras":40,"placeholder":"Versão 1… / Versão 2…"},{"nivel":3,"tipo":"detalhes","rot":"Caderno de palavras","pergunta":"Escolhe uma palavra que encontraste nas tuas leituras desta semana. Indica onde a leste, explica o que significa ali e escreve uma frase com ela.","campos":["Palavra e onde a encontrei:","O que significa ali:","Uma frase minha com ela:"]}],"fontes":[["Wikipédia, «Dobrete»","https://pt.wikipedia.org/wiki/Dobrete"],["Dicionário Priberam (étimos e palavras divergentes)","https://dicionario.priberam.org"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"O-Espelho-Machado.html","id":"espelho-machado","cor":"#2f5d7c","corEscura":"#7fb4d6","marca":"Ler a fundo · 5 min · identidade","titulo":"O Espelho","subtitulo":"Machado de Assis, 1882","emblemas":[[0.8,"Leitor minucioso","Foste ao pormenor e defendeste leituras com o texto."],[0.5,"Leitor atento","Boas leituras. Volta a um passo e tenta ir mais fundo."],[0,"Leitor em construção","Começaste. Relê o texto e tenta outra vez."]],"passos":[{"tipo":"leitura","rot":"Ler","html":"<p>Num conto de <b>Machado de Assis</b> («O Espelho», <i>Papéis Avulsos</i>, 1882), um homem recebe o posto de <b>alferes</b> (uma patente militar) e a família passa a tratá-lo por «senhor alferes».</p><p>Ele conta: «<b>Cada criatura humana traz duas almas consigo: uma que olha de dentro para fora, outra que olha de fora para dentro…</b>» E mais à frente: «<b>O alferes eliminou o homem.</b> […] ficou-me uma parte mínima de humanidade.»</p><p>O texto está inteiro, de graça, na Wikisource.</p>","links":[["Ler o conto inteiro (Wikisource)","https://pt.wikisource.org/wiki/O_Espelho"]],"nota":"Domínio público: podes ler, imprimir e partilhar."},{"tipo":"unica","rot":"O que foi eliminado","pergunta":"Quando diz «o alferes eliminou o homem», o que aconteceu?","opcoes":[["Alguém morreu no conto.","cuidado","Não: ninguém morre. Pensa em duas maneiras de ser a mesma pessoa."],["A pessoa passou a ver-se só pelo cargo.","certo","Sim. A identidade encolheu até caber no posto: os outros tratam-no pela patente e ele passa a ver-se assim."],["Ele deixou o exército.","cuidado","O contrário: é o posto que passa a ocupar tudo."]]},{"tipo":"multi","rot":"Alma exterior","pergunta":"Machado diz que a «alma exterior» pode ser muita coisa. Toca no que hoje funciona como alma exterior das pessoas.","opcoes":[["O número de seguidores",5,"É um bom exemplo atual: um número que passa a dizer quem somos."],["A farda ou a bata do curso",5,"Sim: uma roupa que dá lugar e função, como a patente do conto."],["Uma máquina ou ferramenta de que não largamos",5,"Machado fala mesmo de «um objeto, uma operação»."],["Aquilo em que acreditamos quando ninguém vê",0,"Isso está mais perto da alma <b>interior</b>, a que olha de dentro para fora."]]},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e diz numa linha o que tem a ver com o conto.","cartoes":[["3.º ano · Fernando Pessoa","Heterónimos: ser vários e não caber num só nome."],["2.º ano · Frei Luís de Sousa","O Romeiro responde «Ninguém»: quem perde o nome perde o lugar no mundo."],["Curso · retrato e perfil","Uma fotografia de perfil mostra a pessoa ou a função?"],["Hoje","Como te apresentas quando não podes falar de notas nem de seguidores?"]]},{"tipo":"texto","rot":"Duas linhas","pergunta":"Escreve duas frases sobre ti: a primeira como os outros te identificam; a segunda com algo que esse rótulo esconde.","minPalavras":12,"placeholder":"Para os outros sou… / Mas também…"},{"tipo":"texto","rot":"O teu espelho","pergunta":"Se um objeto teu fosse a tua «alma exterior», qual seria e porquê? Uma frase.","minPalavras":8,"maxPalavras":30,"placeholder":"Seria… porque…"}],"fontes":[["Machado de Assis, «O Espelho» (Papéis Avulsos, 1882) · Wikisource","https://pt.wikisource.org/wiki/O_Espelho"],["Machado de Assis, Papéis Avulsos (1882), índice · Wikisource","https://pt.wikisource.org/wiki/Pap%C3%A9is_avulsos"]],"modulo":"Comum","imagemData":""},{"pasta":"Olhares","ficheiro":"Duas-Legendas.html","id":"duas-legendas","cor":"#4a4a4a","corEscura":"#bdbdbd","marca":"Olhares · 5 min · imagem e palavra","titulo":"Duas legendas","subtitulo":"O que a palavra faz à imagem","emblemas":[[0.8,"Olho de fotógrafo","Viste o que muitos não veem e imaginaste com base na imagem."],[0.5,"Olhar atento","Bom olhar. Na próxima, procura mais um pormenor."],[0,"Olhar em treino","Começaste. Observa outra vez, devagar."]],"passos":[{"tipo":"leitura","rot":"A experiência","html":"<p>Imagina uma fotografia: <b>uma pessoa diante de um espelho</b>. Agora imagina duas legendas para a mesma fotografia:</p><p>A — «Finalmente encontrou o seu lugar.»<br>B — «Já só consegue ver a sua função.»</p><p>A imagem é a mesma. O que muda é o que a palavra te manda ver. No conto «O Espelho», de Machado de Assis (1882), um homem passa a ver-se só pelo posto militar que recebeu: «O alferes eliminou o homem.»</p>","links":[["Ler o conto (Wikisource)","https://pt.wikisource.org/wiki/O_Espelho"]]},{"tipo":"unica","rot":"Mais perto de Machado","pergunta":"Qual das legendas está mais perto da frase do conto?","opcoes":[["A — «Finalmente encontrou o seu lugar.»","cuidado","É uma leitura possível do início (a família festeja o posto), mas o conto acaba noutro sítio: a pessoa quase desaparece."],["B — «Já só consegue ver a sua função.»","certo","Sim: «ficou-me uma parte mínima de humanidade». A função ocupou o lugar da pessoa."],["As duas, em momentos diferentes.","certo","Defensável: primeiro o orgulho, depois o vazio. Boa leitura do percurso do conto."]]},{"tipo":"multi","rot":"Observar e acrescentar","pergunta":"Numa fotografia de alguém ao espelho, o que é mesmo <b>observável</b>?","opcoes":[["A roupa que a pessoa tem vestida",5,"Observável: está na imagem."],["A direção do olhar",5,"Observável, se se vir o rosto ou o reflexo."],["Que está orgulhosa",0,"Isso é interpretação: acrescentas tu, a partir de pistas."],["Que acabou de ser promovida",0,"Interpretação (ou invenção): a imagem não diz isso."]]},{"tipo":"texto","rot":"A tua legenda A","pergunta":"Fotografa mentalmente (ou mesmo com o telemóvel) um objeto à tua frente. Escreve uma legenda que o torne importante. Máximo 15 palavras.","minPalavras":4,"maxPalavras":15,"placeholder":"Legenda A…"},{"tipo":"texto","rot":"A tua legenda B","pergunta":"Agora outra legenda para a mesma imagem, que a faça ler ao contrário. Máximo 15 palavras.","minPalavras":4,"maxPalavras":15,"placeholder":"Legenda B…"},{"tipo":"cartoes","rot":"Onde isto acontece","pergunta":"Escolhe um caso e explica numa linha como a legenda muda o que vemos.","cartoes":[["Notícia","A mesma fotografia com dois títulos diferentes em dois jornais."],["Rede social","A mesma imagem com uma legenda irónica ou séria."],["Exposição","A ficha ao lado da obra diz-te o que procurar."],["Escola","A legenda de um trabalho teu no mural."]]},{"tipo":"texto","rot":"Regra minha","pergunta":"Escreve uma regra tua para legendar com honestidade: o que uma legenda pode e não pode fazer.","minPalavras":10,"placeholder":"Uma legenda pode…, mas não pode…"}],"fontes":[["Machado de Assis, «O Espelho» (1882) · Wikisource","https://pt.wikisource.org/wiki/O_Espelho"],["Wikipédia, «Crítica de arte» (descrever, analisar, interpretar)","https://pt.wikipedia.org/wiki/Cr%C3%ADtica_de_arte"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Padre-Amaro-Paula-Rego.html","id":"padre-amaro-rego","cor":"#7a3f7a","corEscura":"#c89ac8","marca":"Ler a fundo · 5 min · da literatura à pintura","titulo":"O Crime do Padre Amaro","subtitulo":"Paula Rego a partir de Eça de Queirós","emblemas":[[0.8,"Olho de fotógrafo","Viste o que muitos não veem e imaginaste com base na imagem."],[0.5,"Olhar atento","Bom olhar. Na próxima, procura mais um pormenor."],[0,"Olhar em treino","Começaste. Observa outra vez, devagar."]],"passos":[{"tipo":"leitura","rot":"Duas obras","html":"<p>Em 1875, Eça de Queirós publicou <i>O Crime do Padre Amaro</i>: a história do padre Amaro e da jovem Amélia, passada em Leiria. Mais de cem anos depois, Paula Rego (Lisboa, 1935 – Londres, 2022) pintou uma série a partir do romance (1997–98), mostrada pela primeira vez em Portugal na Gulbenkian, em 1999.</p><p><b>Abre a página da exposição e observa as imagens.</b> Depois volta aqui.</p>","links":[["Ver a exposição (Gulbenkian, 1999)","https://gulbenkian.pt/historia-das-exposicoes/exhibitions/1105/"],["O romance na Wikipédia","https://pt.wikipedia.org/wiki/O_Crime_do_Padre_Amaro"]],"nota":"As pinturas estão protegidas por direitos de autor: vê-as na página da Gulbenkian."},{"tipo":"unica","rot":"Um livro que incomodou","pergunta":"Quando saiu, em 1875, o romance provocou protestos. De quem?","opcoes":[["Da Igreja Católica","certo","Sim. A Wikipédia descreve-o como obra polémica que causou protestos da Igreja Católica."],["Dos leitores de Paris","cuidado","Não é o que as fontes dizem. Relê a ficha do romance."],["Do rei","cuidado","Não é o que as fontes dizem. Relê a ficha do romance."]]},{"tipo":"multi","rot":"O que te prende","pergunta":"Nas imagens da série, o que te chama mais a atenção?","opcoes":[["Os gestos e as posições dos corpos",5,"Guarda um exemplo concreto: que gesto, em que imagem?"],["Os rostos e as expressões",5,"Guarda um exemplo concreto: que expressão, de quem?"],["Os espaços fechados",5,"Um espaço fechado também conta uma história: quem entra, quem fica?"],["A luz e a sombra",5,"O que está iluminado e o que fica na sombra?"]]},{"tipo":"unica","rot":"Do romance à pintura","pergunta":"O que muda quando um romance se transforma numa série de pinturas?","opcoes":[["A pintura escolhe momentos e deixa o resto por imaginar.","certo","Defensável: quem vê tem de imaginar o antes e o depois."],["A pintura mostra tudo igual ao livro.","cuidado","Uma imagem não pode seguir a narração toda: escolhe, corta, interpreta."],["A pintura dá corpo e rosto às personagens.","certo","Defensável: o que no livro são palavras passa a ser gesto, cor, rosto."]]},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e explica-a numa linha.","cartoes":[["2.º ano · Eça de Queirós","Os Maias: outra crítica de Eça à sociedade do seu tempo."],["2.º ano · Garrett","Frei Luís de Sousa: a honra, o nome e a Igreja decidem a vida das personagens."],["Lugar · Leiria","A cidade onde se passa o romance: procura-a no mapa."],["Lugar · Cascais","A Casa das Histórias Paula Rego, museu da artista, inaugurado em 2009."]]},{"tipo":"texto","rot":"Quem tem voz","pergunta":"Nesta história, quem tem poder e quem não tem voz? Duas frases.","minPalavras":12,"placeholder":"Tem poder… Não tem voz…"}],"fontes":[["Gulbenkian, «Paula Rego. O Crime do Padre Amaro e Untitled» (1999)","https://gulbenkian.pt/historia-das-exposicoes/exhibitions/1105/"],["Wikipédia, «O Crime do Padre Amaro»","https://pt.wikipedia.org/wiki/O_Crime_do_Padre_Amaro"],["Wikipédia, «Paula Rego»","https://pt.wikipedia.org/wiki/Paula_Rego"],["Wikipédia, «Casa das Histórias Paula Rego»","https://pt.wikipedia.org/wiki/Casa_das_Hist%C3%B3rias_Paula_Rego"],["OpenStreetMap, Leiria","https://www.openstreetmap.org/search?query=Leiria%2C%20Portugal"]],"modulo":"M5","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Terra-Firme-Benjamim.html","id":"terra-firme","cor":"#2f6f7a","corEscura":"#7fc4cf","marca":"Ler a fundo · 5 min · canção portuguesa","titulo":"Terra Firme","subtitulo":"Benjamim e Barnaby Keen, 2017","emblemas":[[0.8,"Leitor minucioso","Foste ao pormenor e defendeste leituras com o texto."],[0.5,"Leitor atento","Boas leituras. Volta a um passo e tenta ir mais fundo."],[0,"Leitor em construção","Começaste. Relê o texto e tenta outra vez."]],"passos":[{"tipo":"leitura","rot":"Ouvir","html":"<p>Benjamim é o nome artístico de Luís Nunes (Lisboa, 1986). Gravou o álbum <i>1986</i> (2017) com o músico inglês Barnaby Keen, em português e inglês. «Terra Firme» é a faixa 4.</p><p><b>Ouve a canção inteira, com atenção às palavras.</b> Depois volta aqui.</p>","links":[["Ouvir no Bandcamp oficial de Benjamim","https://eusouobenjamim.bandcamp.com/track/terra-firme"],["Ouvir no Spotify","https://open.spotify.com/track/2KNwNTzoxdXFsL7Yy16Bx6"]],"nota":"A letra está protegida por direitos de autor: ouve-a na plataforma oficial."},{"tipo":"multi","rot":"O que ouviste","pergunta":"Toca nas palavras que ouviste na canção.","opcoes":[["mar",5,"Está lá: é a imagem que atravessa a canção."],["corrente",5,"Está lá: a força que empurra e contra a qual se luta."],["porto",5,"Está lá: o lugar de chegada, abrigo."],["sobrevivente",5,"Está lá: quem chega depois de muito custo."],["comboio",0,"Não a confirmámos na letra. Ouve outra vez: a canção fica no mar."],["deserto",0,"Não a confirmámos na letra. Ouve outra vez."]]},{"tipo":"unica","rot":"Terra firme","pergunta":"Na canção, a «terra firme» é sobretudo…","opcoes":[["Um lugar seguro onde, por fim, se pousa","certo","Defensável: depois do mar, da corrente e do peso, é a imagem da estabilidade."],["Uma decisão ou uma pessoa que dá apoio","certo","Defensável: há um «eu» que fala a um «tu» em dificuldade. A terra firme pode ser quem fica ao lado."],["Uma chegada fácil, sem esforço","cuidado","A canção fala de «peso», «azar» e «corrente»: chegar custa."]]},{"tipo":"unica","rot":"Contra-mão","pergunta":"«Contra-mão» é uma palavra de que mundo?","opcoes":[["Da estrada: o sentido proibido do trânsito","certo","Sim. Numa canção de mar, surpreende: juntar dois <b>campos lexicais</b> (estrada e mar) cria uma imagem nova. No Acordo Ortográfico escreve-se «contramão»."],["Do mar: é um termo de navegação","cuidado","Não: diz-se do trânsito. É por isso que a palavra salta à vista numa canção de mar."],["Da música: tocar fora do ritmo","cuidado","Não: diz-se do trânsito, de quem circula no sentido proibido."]]},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e diz numa linha em que se parece com «Terra Firme».","cartoes":[["1.º ano · Martim Codax","«Ondas do mar de Vigo, / se vistes meu amigo?»: falar ao mar à espera de quem não chega."],["1.º ano · Camões, Os Lusíadas","O Velho do Restelo (canto IV): ficar em terra firme ou partir?"],["3.º ano · Pessoa, Mensagem","«Valeu a pena? Tudo vale a pena / Se a alma não é pequena.»"],["2.º ano · Padre António Vieira","O sermão aos peixes: o mar como retrato da sociedade."]]},{"tipo":"texto","rot":"A tua terra firme","pergunta":"O que é terra firme para ti, numa semana difícil? Duas frases, sem nomes de pessoas.","minPalavras":12,"placeholder":"A minha terra firme é… porque…"},{"tipo":"texto","rot":"Antes de escrever","pergunta":"Quem atravessa hoje o mar à procura de terra firme? Escreve a pergunta que farias a uma fonte fiável antes de publicar sobre isso.","minPalavras":8,"placeholder":"Perguntaria…"}],"fontes":[["Benjamim / Barnaby Keen, 1986 (Bandcamp oficial)","https://eusouobenjamim.bandcamp.com/album/1986"],["RTP, Festival da Canção (Benjamim, 2017)","https://media.rtp.pt/festivaldacancao/"],["Where the Music Meets, «Terra Firme» (2017, em inglês)","https://www.wherethemusicmeets.com/2017/03/01/benjamim-barneby-keen-terra-firme/"],["FCSH, «Ondas do mar de Vigo»","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=1308"],["Arquivo Pessoa, «Mar Português»","http://arquivopessoa.net/textos/2405"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Ouvi-Dizer-Ornatos-Violeta.html","id":"ouvi-dizer","cor":"#6b4fa0","corEscura":"#b9a3e6","marca":"Ler a fundo · 5 min · canção portuguesa","titulo":"Ouvi Dizer","subtitulo":"Ornatos Violeta, 1999","emblemas":[[0.8,"Leitor minucioso","Foste ao pormenor e defendeste leituras com o texto."],[0.5,"Leitor atento","Boas leituras. Volta a um passo e tenta ir mais fundo."],[0,"Leitor em construção","Começaste. Relê o texto e tenta outra vez."]],"passos":[{"tipo":"leitura","rot":"Ouvir","html":"<p>Os Ornatos Violeta são uma banda do Porto, formada em 1991. «Ouvi Dizer» foi o primeiro single do álbum <i>O Monstro Precisa de Amigos</i> (1999). No fim, o ator Vítor Espadinha diz um texto.</p><p><b>Ouve a canção até ao fim, incluindo a parte dita.</b> Depois volta aqui.</p>","links":[["Ouvir no Spotify","https://open.spotify.com/search/Ornatos%20Violeta%20Ouvi%20Dizer"]],"nota":"A letra está protegida por direitos de autor: ouve-a na plataforma oficial."},{"tipo":"unica","rot":"O título","pergunta":"«Ouvi dizer» é uma maneira de…","opcoes":[["Contar o que outros disseram, sem garantir que é verdade","certo","Sim: é <b>discurso relatado</b>. A notícia chega em segunda mão, como um boato. O fim do amor é sabido por ouvir dizer."],["Dar uma ordem a alguém","cuidado","Não há imperativo. «Ouvi» é pretérito perfeito: alguém conta o que lhe chegou aos ouvidos."],["Descrever os sons da cidade","cuidado","A cidade aparece, mas «ouvi dizer» é sobre o que se diz, não sobre sons."]]},{"tipo":"multi","rot":"Imagens do amor","pergunta":"Toca nas expressões que mais dizem sobre este amor. Confirma-as ao ouvir.","opcoes":[["«amor é uma doença»",5,"<b>Metáfora</b> antiga: nas cantigas medievais, a «coita» é o sofrimento de amor."],["«a razão»",5,"Razão contra sentimento: um conflito da lírica desde os trovadores e Camões."],["«estúpida canção»",5,"A canção fala de si própria e desvaloriza-se: <b>autoironia</b>."],["«o mundo acaba amanhã»",5,"<b>Hipérbole</b>: tudo parece urgente e final."]]},{"tipo":"unica","rot":"Um desejo impossível","pergunta":"Em «pudesse eu pagar de outra forma», «pudesse» está no…","opcoes":[["Pretérito imperfeito do conjuntivo","certo","Sim: exprime um desejo que não se realiza. Repara na ordem: o verbo vem antes do sujeito («pudesse eu»)."],["Pretérito perfeito do indicativo","cuidado","Esse seria «pude». «Pudesse» é conjuntivo: desejo, hipótese."],["Futuro do indicativo","cuidado","Esse seria «poderei». «Pudesse» é conjuntivo."]]},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e explica-a numa linha.","cartoes":[["1.º ano · Cantigas de amigo","A ausência de quem se ama e o sofrimento de amor, a coita."],["1.º ano · Camões lírico","«Amor é fogo que arde sem se ver»: o amor como contradição."],["2.º ano · Camilo, Amor de Perdição","A paixão que perde quem ama."],["Hoje","Os versos desta canção foram escritos em paredes e tatuados (Altamont, 2024). Quando é que uma canção passa a ser de toda a gente?"]]},{"tipo":"texto","rot":"A cidade está deserta","pergunta":"O texto dito no fim começa por «A cidade está deserta». Continua-o com uma frase tua, sem nomes, sobre uma cidade depois de uma perda.","minPalavras":10,"maxPalavras":30,"placeholder":"A cidade está deserta e…"},{"tipo":"texto","rot":"Antes de partilhar","pergunta":"Um «ouvi dizer» pode magoar alguém. Que regra propões para a tua turma antes de partilhar o que ouviste?","minPalavras":10,"placeholder":"Antes de partilhar…"}],"fontes":[["Wikipédia, «O Monstro Precisa de Amigos»","https://pt.wikipedia.org/wiki/O_Monstro_Precisa_de_Amigos"],["Wikipédia, «Ornatos Violeta»","https://pt.wikipedia.org/wiki/Ornatos_Violeta"],["Altamont, «“Ouvi Dizer” – Ornatos Violeta» (2024)","https://altamont.pt/ouvi-dizer-ornatos-violeta/"],["Wikisource, Camões, «Amor é fogo que arde sem se ver»","https://pt.wikisource.org/wiki/Amor_%C3%A9_fogo_que_arde_sem_se_ver"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Capitao-Romance-Ornatos-Violeta.html","id":"capitao-romance","cor":"#1f5f99","corEscura":"#79aee0","marca":"Ler a fundo · 5 min · canção portuguesa","titulo":"Capitão Romance","subtitulo":"Ornatos Violeta com Gordon Gano, 1999","emblemas":[[0.8,"Leitor minucioso","Foste ao pormenor e defendeste leituras com o texto."],[0.5,"Leitor atento","Boas leituras. Volta a um passo e tenta ir mais fundo."],[0,"Leitor em construção","Começaste. Relê o texto e tenta outra vez."]],"passos":[{"tipo":"leitura","rot":"Ouvir","html":"<p>«Capitão Romance» foi o segundo single de <i>O Monstro Precisa de Amigos</i> (1999), dos Ornatos Violeta. Gordon Gano, vocalista da banda norte-americana Violent Femmes, canta com Manel Cruz, em português.</p><p><b>Ouve a canção inteira e repara no refrão.</b> Depois volta aqui.</p>","links":[["Ouvir no Spotify","https://open.spotify.com/track/6EuupyK5js5CVsm0QHaTq3"]],"nota":"A letra está protegida por direitos de autor: ouve-a na plataforma oficial."},{"tipo":"unica","rot":"O refrão","pergunta":"No refrão «Eu vi» / «mas não agarrei», o que liga as duas partes?","opcoes":[["Uma oposição entre ver e agarrar, marcada por «mas»","certo","Sim: <b>antítese</b> com conjunção adversativa. Teve a oportunidade diante dos olhos e deixou-a passar."],["Uma onomatopeia","cuidado","Não há imitação de sons. Há dois gestos opostos: ver e agarrar."],["Uma enumeração","cuidado","Uma enumeração junta vários elementos; aqui há dois que se opõem."]]},{"tipo":"unica","rot":"Hoje o mar sou eu","pergunta":"«Hoje o mar sou eu» é…","opcoes":[["Uma metáfora: o eu identifica-se com o mar","certo","Sim. O eu já não atravessa o mar: torna-se o mar. E «hoje» diz que é um estado, não para sempre."],["Uma comparação","cuidado","Não há «como». Com «como» seria comparação; sem ele, é metáfora."],["Uma personificação do mar","cuidado","Não é o mar que ganha traços humanos; é o eu que se torna mar."]]},{"tipo":"deslizar","rot":"Herói ou sonhador?","pergunta":"O Capitão Romance parece mais herói de aventuras ou sonhador que vê e não agarra?","esquerda":"herói de aventuras","direita":"sonhador"},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e diz numa linha o que tem em comum com a canção.","cartoes":[["1.º ano · Camões, Os Lusíadas","O herói do mar e a viagem entre maravilha e perigo."],["3.º ano · Pessoa, «O Infante»","«Senhor, falta cumprir-se Portugal!»: uma missão por cumprir."],["3.º ano · Álvaro de Campos","«Tabacaria»: «tenho em mim todos os sonhos do mundo», e não realiza nenhum."],["Estados Unidos · Violent Femmes","Um cantor norte-americano a cantar em português: a canção atravessa culturas."]]},{"tipo":"texto","rot":"Eu vi","pergunta":"Escreve dois versos: um a começar por «Eu vi» e outro por «mas não agarrei», sobre uma oportunidade tua ou inventada.","minPalavras":6,"maxPalavras":20,"placeholder":"Eu vi… / mas não agarrei…"},{"tipo":"texto","rot":"Em comunidade","pergunta":"Que oportunidade coletiva (na escola, no bairro, no país) se vê e não se agarra? Uma frase com um exemplo real, sem nomes de pessoas.","minPalavras":10,"placeholder":"Vemos… mas não…"}],"fontes":[["Wikipédia, «O Monstro Precisa de Amigos»","https://pt.wikipedia.org/wiki/O_Monstro_Precisa_de_Amigos"],["Arquivo Pessoa, Mensagem, «O Infante»","http://arquivopessoa.net/textos/2375"],["Arquivo Pessoa, «Tabacaria»","http://arquivopessoa.net/textos/163"],["Wikipédia, «Os Lusíadas»","https://pt.wikipedia.org/wiki/Os_Lus%C3%ADadas"]],"modulo":"Comum","imagemData":""},{"pasta":"Olhares","ficheiro":"D-Joao-de-Portugal-Lupi.html","id":"olhar-lupi","cor":"#e0822a","corEscura":"#f0ad6a","marca":"Olhar · 5 min · M4 Frei Luís de Sousa","titulo":"D. João de Portugal","subtitulo":"Miguel Ângelo Lupi, 1863","imagem":"joao-de-portugal-lupi.jpg","credito":"Miguel Ângelo Lupi, D. João de Portugal (1863) · domínio público · Wikimedia Commons","creditoUrl":"https://commons.wikimedia.org/w/index.php?curid=39076717","emblemas":[[0.8,"Olho de fotógrafo","Viste o que muitos não veem e imaginaste com base na imagem."],[0.5,"Olhar atento","Bom olhar. Na próxima, procura mais um pormenor."],[0,"Olhar em treino","Começaste. Observa outra vez, devagar."]],"passos":[{"tipo":"memoria","rot":"Memória","segundos":20,"pergunta":"Olha 20 segundos. Depois toca no que estava na imagem.","elementos":[["Um homem de barba branca comprida",true],["Um braço levantado",true],["Quadros escuros na parede",true],["Uma mulher sentada com gola de renda",true],["Uma espada",false],["Uma janela aberta",false]]},{"tipo":"unica","rot":"Que momento?","pergunta":"O título é «D. João de Portugal». Que momento da peça de Garrett pode estar aqui?","opcoes":[["O regresso do Romeiro, no ato II","certo","Sim: o Romeiro é D. João de Portugal, que volta vinte anos depois de Alcácer-Quibir."],["O incêndio da casa, no ato I","cuidado","Não há fogo nem pânico; há espanto e um gesto."],["A morte de Maria, no ato III","cuidado","Maria não aparece; e o homem de barba é o centro."]]},{"tipo":"unica","rot":"O gesto","pergunta":"O braço aponta para cima e para trás. O que pode estar a dizer?","opcoes":[["«É aquele»: aponta o retrato","certo","Defensável: na peça, o Romeiro aponta o retrato de D. João."],["«Deus é testemunha»","certo","Defensável: o gesto para o alto pode ser um juramento."],["«Lembra-te de quem fui»","certo","Defensável: há retratos atrás dele, como o passado da casa."]]},{"tipo":"detalhes","rot":"Luz","pergunta":"Olha para a luz. Responde em poucas palavras.","campos":["O que está mais iluminado:","O que fica na sombra:","O que isso sugere:"]},{"tipo":"texto","rot":"Primeira fala","pergunta":"Dá voz à mulher sentada: escreve a prim
