ada pergunta de Vieira é uma saída que o santo recusa."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Vieira conta o que fez <b>Santo António</b> em Rimini, e é isso que ele próprio vai fazer em São Luís:</p><p><i>«Pregava Santo António em Itália na cidade de Arimino, contra os hereges, que nela eram muitos; e como erros de entendimento são dificultosos de arrancar, não só não fazia fruto o Santo, mas chegou o povo a se levantar contra ele, e faltou pouco, para que lhe não tirassem a vida. Que faria neste caso o ânimo generoso do grande António? […] Retirar-se-ia? Calar-se-ia? Dissimularia? Daria tempo ao tempo? […] Pois que fez? Mudou somente o púlpito e o auditório, mas não desistiu da doutrina. Deixa as praças, vai-se às praias; deixa a terra, e vai-se ao mar, e começa a dizer a altas vozes: ‘Já que me não querem ouvir os homens, ouçam-me os peixes’.»</i></p><p class=\"nota\"><b>Arimino</b> — Rimini, cidade de Itália · <b>hereges</b> — os que se afastam da doutrina da Igreja · <b>dissimular</b> — fingir que não é nada</p>","links":[["Ler o capítulo I (Wikisource)","https://pt.wikisource.org/wiki/Serm%C3%A3o_de_Santo_Ant%C3%B3nio_(1654)"]]},{"nivel":1,"tipo":"ordenar","rot":"Pela ordem","pergunta":"Põe por ordem o que acontece a Santo António em Rimini.","itens":["Prega contra os hereges, que são muitos","O povo levanta-se contra ele e quase lhe tira a vida","Recusa retirar-se, calar-se ou dissimular","Muda de púlpito e de auditório, mas não de doutrina","Vai à praia e fala em voz alta para o mar","Os peixes ouvem-no"],"retorno":"É uma escada: cada degrau nasce do anterior, e no fim o santo não cedeu nada."},{"nivel":1,"tipo":"unica","rot":"Porquê os peixes","pergunta":"Porque é que Santo António vai pregar aos peixes?","opcoes":[["Porque os homens não o querem ouvir","certo","É o que ele diz: «Já que me não querem ouvir os homens»."],["Porque os peixes precisam de doutrina","cuidado","Não é por eles: é por quem ficou na praça."],["Porque desistiu de pregar","cuidado","Ao contrário: «não desistiu da doutrina»."]]},{"nivel":2,"tipo":"unica","rot":"As perguntas","pergunta":"«Retirar-se-ia? Calar-se-ia? Dissimularia? Daria tempo ao tempo?» Que fazem estas quatro perguntas?","opcoes":[["Enumeram as saídas fáceis, para as recusar todas","certo","Cada pergunta é uma tentação; a resposta é «Pois que fez? Mudou somente o púlpito»."],["Mostram que o santo tinha dúvidas","cuidado","Quem duvida é o ouvinte; o santo já decidiu."],["Pedem ajuda ao público","cuidado","São perguntas retóricas: não esperam resposta."]]},{"nivel":2,"tipo":"cartoes","rot":"O mesmo gesto","pergunta":"Vieira conta isto três dias antes de embarcar para Lisboa. Escolhe o que ele está a fazer com a história e explica numa linha.","cartoes":[["Justificar-se","Também ele vai deixar a praça: São Luís não o ouve."],["Avisar","Quem não ouve o sermão vai ouvir o rei."],["Elogiar o santo","É dia de Santo António: o sermão é sobre ele."]]},{"nivel":3,"tipo":"texto","rot":"A tua praia","pergunta":"Escreve a tua frase «Já que … não me querem ouvir, ouçam-me …»: a quem deixas de falar e a quem passas a falar. Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"Já que … não me querem ouvir, ouçam-me …"}],"fontes":[["Wikisource, Sermão de Santo António (1654), texto integral","https://pt.wikisource.org/wiki/Serm%C3%A3o_de_Santo_Ant%C3%B3nio_(1654)"],["Wikipédia, «Sermão de Santo António aos Peixes»","https://pt.wikipedia.org/wiki/Serm%C3%A3o_de_Santo_Ant%C3%B3nio_aos_Peixes"]],"modulo":"M4","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Vieira-O-Sal-e-a-Terra.html","id":"vieira-sal","cor":"#7a3b1e","corEscura":"#d29368","marca":"Ler a fundo · 5 min · M4 Vieira","titulo":"O sal e a terra","subtitulo":"Padre António Vieira, 1654 · cap. I","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de dilemas","Viste as duas portas do «ou… ou…» e quem está atrás de cada uma."],[0.5,"Bom começo","Já sabes quem é o sal. Repara em como a frase obriga a escolher."],[0,"A entrar no sermão","Relê a primeira frase: o sal são os pregadores, a terra somos nós."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>O sermão abre com uma frase de Cristo, «Vós sois o sal da terra», e com uma pergunta:</p><p><i>«O efeito do sal é impedir a corrupção, mas quando a terra se vê tão corrupta como está a nossa, havendo tantos nela que têm ofício de sal, qual será, ou qual pode ser a causa desta corrupção? Ou é porque o sal não salga, ou porque a terra se não deixa salgar. Ou é porque o sal não salga, e os pregadores não pregam a verdadeira doutrina; ou porque a terra se não deixa salgar, e os ouvintes, sendo verdadeira a doutrina que lhes dão, a não querem receber.»</i></p><p class=\"nota\"><b>ofício</b> — função, dever · <b>corrupção</b> — aqui, o mal moral que se espalha</p>","links":[["Ler o capítulo I (Wikisource)","https://pt.wikisource.org/wiki/Serm%C3%A3o_de_Santo_Ant%C3%B3nio_(1654)"]]},{"nivel":1,"tipo":"par","rot":"Sal ou terra","pergunta":"Liga cada parte da alegoria ao que ela representa.","pares":[["O sal","os pregadores"],["A terra","os ouvintes, a sociedade"],["Impedir a corrupção","o que o sal devia fazer"],["O sal não salga","os pregadores não pregam a verdadeira doutrina"],["A terra não se deixa salgar","os ouvintes não querem receber a doutrina"]],"retorno":"A alegoria tem duas colunas; Vieira vai passar o sermão a decidir de que lado está a culpa."},{"nivel":1,"tipo":"unica","rot":"A construção","pergunta":"«Ou é porque… ou porque…»: o que faz esta construção a quem ouve?","opcoes":[["Obriga a escolher entre duas causas, e só duas","certo","É uma disjunção: fecha as outras portas."],["Dá muitas causas possíveis","cuidado","Dá duas, e repete-as: é isso que prende."],["Não decide nada","cuidado","Decide muito: quem não está de um lado está do outro."]]},{"nivel":2,"tipo":"unica","rot":"A porta fechada","pergunta":"Que terceira causa a frase de Vieira deixa de fora?","opcoes":[["A doutrina é verdadeira, os ouvintes querem-na, mas é mal explicada","certo","Defensável: a culpa seria do modo de pregar, e um pregador prefere não a nomear."],["Não há corrupção nenhuma","cuidado","Vieira dá isso por certo logo na primeira linha: «tão corrupta como está a nossa»."],["O sal é o rei","cuidado","No texto o sal são os pregadores, sem ambiguidade."]]},{"nivel":3,"tipo":"texto","rot":"O teu dilema","pergunta":"Escreve um dilema à maneira de Vieira sobre uma turma que não lê: «Ou é porque…, ou porque…». Sem nomes. Até 35 palavras.","minPalavras":10,"maxPalavras":35,"placeholder":"Ou é porque …, ou porque …"}],"fontes":[["Wikisource, Sermão de Santo António (1654), texto integral","https://pt.wikisource.org/wiki/Serm%C3%A3o_de_Santo_Ant%C3%B3nio_(1654)"]],"modulo":"M4","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Vieira-Nunca-Pior-Auditorio.html","id":"vieira-auditorio","cor":"#7a3b1e","corEscura":"#d29368","marca":"Ler a fundo · 5 min · M4 Vieira","titulo":"Nunca pior auditório","subtitulo":"Padre António Vieira, 1654 · caps. II–III","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de ironias","Percebeste que o elogio aos peixes é uma crítica aos homens."],[0.5,"Bom começo","Já vês o elogio. Pergunta sempre: elogiar isto acusa quem?"],[0,"A entrar no sermão","Relê «ouvem e não falam» a pensar em quem fala e não ouve."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Antes de repreender, Vieira louva os peixes. Começa assim:</p><p><i>«Enfim, que havemos de pregar hoje aos peixes? Nunca pior auditório. Ao menos têm os peixes duas boas qualidades de ouvintes: ouvem e não falam.»</i></p><p>E explica o que um pregador deve fazer, como o sal:</p><p><i>«Uma é louvar o bem, outra repreender o mal: louvar o bem para o conservar e repreender o mal para preservar dele.»</i></p><p class=\"nota\"><b>auditório</b> — público · <b>preservar dele</b> — proteger do mal</p>","links":[["Ler o sermão inteiro (Internet Archive)","https://archive.org/details/sermao-de-st-antonio-aos-peixes-lusolivros"]]},{"nivel":1,"tipo":"unica","rot":"Elogio ou crítica","pergunta":"«Ouvem e não falam.» É um elogio aos peixes ou uma crítica?","opcoes":[["As duas coisas: elogia os peixes para acusar os homens, que falam e não ouvem","certo","É ironia: o elogio mínimo aos peixes é uma seta apontada à plateia."],["Só um elogio: os peixes são bons ouvintes","cuidado","Repara em «Nunca pior auditório»: o elogio vem com um encolher de ombros."],["Só uma crítica aos peixes, que são mudos","cuidado","Ser mudo é aqui uma qualidade; a crítica vai para outro lado."]]},{"nivel":1,"tipo":"multi","rot":"Duas propriedades","pergunta":"Quais são as duas coisas que um pregador deve fazer, segundo o sal?","opcoes":[["Louvar o bem",5,"Para o conservar: é a primeira parte do sermão."],["Repreender o mal",5,"Para preservar dele: é a segunda parte."],["Calar-se quando não o ouvem",0,"Vieira faz o contrário: muda de auditório e continua."],["Contar histórias",0,"Conta uma (a de Rimini), mas não é isso que o sal faz."]]},{"nivel":2,"tipo":"classificar","rot":"Louvor ou repreensão","pergunta":"Em que parte do sermão cabe cada frase?","categorias":["Louvor","Repreensão"],"itens":[["Ao menos têm os peixes duas boas qualidades de ouvintes.",0],["Não só vos comeis uns aos outros, mas os grandes comem os pequenos.",1],["Quisestes ser melhor que os outros peixes, e por isso sois mais infeliz que todos.",1],["Nem cuideis que isto pertence só aos homens, porque também nos peixes tem seu lugar.",0]],"retorno":"Louvar primeiro, repreender depois: é a ordem que o próprio Vieira anuncia com o sal."},{"nivel":3,"tipo":"texto","rot":"O teu elogio","pergunta":"Escreve um elogio a alguma coisa (um objeto, um animal) que seja, ao mesmo tempo, uma crítica a quem te ouve, como «ouvem e não falam». Até 25 palavras, sem nomes.","minPalavras":6,"maxPalavras":25,"placeholder":"Ao menos … tem uma qualidade: …"}],"fontes":[["Sermão de Santo António aos Peixes (Internet Archive)","https://archive.org/details/sermao-de-st-antonio-aos-peixes-lusolivros"],["Wikisource, Sermão de Santo António (1654), texto integral","https://pt.wikisource.org/wiki/Serm%C3%A3o_de_Santo_Ant%C3%B3nio_(1654)"]],"modulo":"M4","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Vieira-Tres-Peixes.html","id":"vieira-peixes","cor":"#7a3b1e","corEscura":"#d29368","marca":"Ler a fundo · 5 min · M4 Vieira","titulo":"Pegadores, voadores, polvo","subtitulo":"Padre António Vieira, 1654 · cap. V","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de alegorias","De cada peixe tiraste o vício, e do vício a repreensão."],[0.5,"Bom começo","Já ligas o peixe ao vício. Falta ver como Vieira o repreende: com uma pergunta."],[0,"A entrar no sermão","Relê: um traço natural do peixe é sempre um defeito humano."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>No capítulo V, Vieira repreende três peixes em particular:</p><p><i>«Pegadores chamam-se estes de que agora falo, e com grande propriedade, porque sendo pequenos, não só se chegam a outros maiores, mas de tal sorte se lhes pegam aos costados, que nunca os desferram.»</i></p><p><i>«Dizei-me, voadores, não vos fez Deus peixes? Pois porque vos quereis ser aves? […] Quisestes ser melhor que os outros peixes, e por isso sois mais infeliz que todos.»</i></p><p><i>«O Polvo, com aquele seu capelo na cabeça, parece um monge; […] Se está nos limos, faz-se verde; se está na areia, faz-se branco; se está no lodo, faz-se pardo.»</i></p><p class=\"nota\"><b>costados</b> — lados do corpo · <b>desferram</b> — largam · <b>capelo</b> — capuz · <b>limos</b> — algas</p>","links":[["Ler o sermão inteiro (Internet Archive)","https://archive.org/details/sermao-de-st-antonio-aos-peixes-lusolivros"]]},{"nivel":1,"tipo":"par","rot":"Peixe e vício","pergunta":"Liga cada peixe ao defeito humano que representa.","pares":[["Pegadores","agarrar-se aos poderosos e viver à custa deles"],["Voadores","querer ser o que não se é, por vaidade"],["Polvo","mudar de cor conforme convém: hipocrisia, traição"]],"retorno":"Três peixes, três vícios: Vieira parte sempre de um traço que o peixe tem mesmo."},{"nivel":1,"tipo":"unica","rot":"O castigo","pergunta":"«Aos outros peixes mata-os a fome e engana-os a isca; ao Voador mata-o…»","opcoes":[["a vaidade de voar, e a sua isca é o vento","certo","Quem quer ser ave morre na vela do navio."],["o anzol, como a todos","cuidado","Vieira diz o contrário: «sem fisga nem anzol»."],["o polvo, que o apanha","cuidado","O polvo trai outros peixes; o voador cai sozinho."]]},{"nivel":2,"tipo":"unica","rot":"Como repreende","pergunta":"«Dizei-me, voadores, não vos fez Deus peixes?» Que faz Vieira para repreender?","opcoes":[["Fala-lhes diretamente e pergunta-lhes o que já sabe","certo","Apóstrofe e pergunta retórica: o peixe não responde, e a plateia responde por ele."],["Conta uma história","cuidado","Aqui não há história: há uma pergunta que acusa."],["Pede desculpa","cuidado","Não há pedido de desculpa em capítulo nenhum."]]},{"nivel":2,"tipo":"cartoes","rot":"Hoje","pergunta":"Qual dos três peixes te parece mais atual? Explica numa linha, sem nomes de pessoas.","cartoes":[["Pegador","Quem só aparece ao lado de quem manda."],["Voador","Quem se apresenta como o que não é."],["Polvo","Quem muda de opinião conforme a sala."]]},{"nivel":3,"tipo":"texto","rot":"Um peixe novo","pergunta":"Inventa um peixe para um comportamento de hoje e repreende-o à maneira de Vieira: começa por «Dizei-me,» e faz-lhe uma pergunta. Até 35 palavras, sem visar pessoas.","minPalavras":10,"maxPalavras":35,"placeholder":"Dizei-me, …, não …?"}],"fontes":[["Sermão de Santo António aos Peixes (Internet Archive)","https://archive.org/details/sermao-de-st-antonio-aos-peixes-lusolivros"]],"modulo":"M4","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Garrett-Ilumino-a-Minha-Casa.html","id":"garrett-fogo","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M4 Garrett","titulo":"Ilumino a minha casa","subtitulo":"Almeida Garrett, Frei Luís de Sousa, 1844 · ato I","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de palco","Leste a didascália e a fala juntas: é assim que se lê teatro."],[0.5,"Bom começo","Já vês o gesto. Repara na palavra que Manuel escolhe para lhe chamar."],[0,"A entrar na peça","Relê a didascália: sem ela, «ilumino» não se entende."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Os governadores ao serviço de Castela querem instalar-se no palácio de <b>Manuel de Sousa Coutinho</b>. Ele responde assim:</p><p><i>MANUEL — […] Mas fique-se aprendendo em Portugal como um homem de honra e coração, por mais poderosa que seja a tirania, sempre lhe pode resistir, em perdendo o amor a coisas tão vis e precárias como são esses haveres que duas faíscas destroem num momento… (Arrebata duas tochas das mãos dos criados, corre à porta da esquerda, atira com uma para dentro: e vê-se atear logo uma labareda imensa.)</i></p><p><i>MADALENA — Que fazes?… que fizeste? — Que é isto, oh meu Deus!</i></p><p><i>MANUEL, tranquilamente — Ilumino a minha casa para receber os muito poderosos e excelentes senhores governadores destes reinos.</i></p><p class=\"nota\"><b>haveres</b> — bens, riqueza · <b>atear</b> — acender · o texto entre parênteses é a didascália: o que se faz em palco</p>","links":[["Ler a peça inteira (Project Gutenberg)","https://www.gutenberg.org/ebooks/17591"]]},{"nivel":1,"tipo":"ordenar","rot":"Pela ordem","pergunta":"Põe por ordem o que se passa no fim do ato I.","itens":["Os governadores querem instalar-se no palácio","Manuel fala da honra e do que um homem pode perder","Arrebata as tochas e deita fogo à casa","Madalena grita: «Que fizeste?»","Manuel responde, tranquilamente, que ilumina a casa","Madalena pede que salvem o retrato"],"retorno":"A calma da resposta vem depois do fogo: é isso que a torna desafiadora."},{"nivel":1,"tipo":"unica","rot":"A palavra","pergunta":"Manuel diz «Ilumino a minha casa». O que está a fazer?","opcoes":[["A incendiá-la, para não a entregar","certo","Chama iluminar ao que é destruir: ironia dita com calma."],["A acender velas para a receção","cuidado","As tochas atiradas para dentro não são velas: «vê-se atear logo uma labareda imensa»."],["A pedir aos criados que limpem a casa","cuidado","Os criados ficam sem as tochas nas mãos."]]},{"nivel":2,"tipo":"unica","rot":"O que perde","pergunta":"De que é que Manuel está disposto a abrir mão, segundo a sua fala?","opcoes":[["Dos bens («haveres») e até da vida, para resistir à tirania","certo","«coisas tão vis e precárias»: a casa vale menos do que a honra."],["Da família","cuidado","Não fala da família; fala de haveres e da própria vida."],["Do nome","cuidado","O nome é o que ele quer guardar; é a família que vai perdê-lo no ato II."]]},{"nivel":2,"tipo":"julgar","rot":"Passa ou não passa","pergunta":"Um colega escreveu quatro leituras do gesto. Qual delas tem prova no texto?","casos":[["Manuel age por impulso, sem pensar.",false,"Não passa: ele diz o que vai fazer antes de o fazer, e fala «tranquilamente»."],["Manuel prefere perder a casa a receber os governadores.",true,"Passa: é o que a fala e o gesto dizem, e a didascália confirma."],["Madalena aprova o incêndio.",false,"Não passa: «Que fizeste?» e o pedido do retrato dizem o contrário."],["A ironia de «ilumino» é dita com calma de propósito.",true,"Passa: a didascália diz «tranquilamente»."]],"retorno":"Uma leitura passa quando tens uma fala ou uma didascália que a prove."},{"nivel":3,"tipo":"texto","rot":"Com calma","pergunta":"Escreve a frase que dirias, com toda a calma, a quem te quisesse tirar uma coisa tua, chamando ao teu gesto o contrário do que ele é (como «ilumino»). Até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"… para receber …"}],"fontes":[["Almeida Garrett, Frei Luís de Sousa (Project Gutenberg n.º 17591)","https://www.gutenberg.org/ebooks/17591"],["Wikipédia, «Frei Luís de Sousa (peça teatral)»","https://pt.wikipedia.org/wiki/Frei_Lu%C3%ADs_de_Sousa_(pe%C3%A7a_teatral)"]],"modulo":"M4","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Garrett-O-Nome-do-Pai.html","id":"garrett-nome","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M4 Garrett","titulo":"O nome do pai","subtitulo":"Almeida Garrett, Frei Luís de Sousa, 1844 · ato III","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de tragédias","Percebeste o que Maria pede, o que perde e porque muda de ideias."],[0.5,"Bom começo","Já sabes o que ela pede. Falta ver o que ela dizia no ato II."],[0,"A entrar na peça","Relê a última frase de Maria: é um pedido de mentira."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>No ato III, o Romeiro já disse quem é. Os pais de Maria vão entrar num convento. Ela agarra-se aos dois:</p><p><i>MARIA — […] Que Deus é esse que está nesse altar, e quer roubar o pai e a mãe a sua filha? […] Mãe, mãe, eu bem o sabia… nunca to disse, mas sabia-o: tinha-mo dito aquele anjo terrível que me aparecia todas as noites […] que me arrancava dos teus braços quando eu adormecia neles… […] Pobre mãe! tu não podes… coitada!… não tens ânimo… — nunca mentiste?… Pois mente agora para salvar a honra de tua filha, para que lhe não tirem o nome de seu pai.</i></p><p><i>MADALENA — Misericórdia, meu Deus!</i></p><p class=\"nota\"><b>ânimo</b> — coragem · <b>honra</b> — aqui, o bom nome perante os outros</p>","links":[["Ler a peça inteira (Project Gutenberg)","https://www.gutenberg.org/ebooks/17591"]]},{"nivel":1,"tipo":"lacuna","rot":"A palavra certa","pergunta":"Completa com a palavra de Garrett.","versos":[{"antes":"Pois mente agora para salvar a ","opcoes":["honra","vida","casa"],"depois":" de tua filha,"},{"antes":"para que lhe não tirem o ","opcoes":["nome","amor","pão"],"depois":" de seu pai."}],"retorno":"O que está em jogo não é a vida: é o nome, isto é, o lugar de Maria no mundo."},{"nivel":1,"tipo":"unica","rot":"O pedido","pergunta":"O que pede Maria à mãe?","opcoes":[["Que minta, para a filha não perder o nome do pai","certo","Se o primeiro casamento vale, Maria é tida por filha ilegítima."],["Que fuja com ela","cuidado","Não fala de fugir: fala de mentir."],["Que reze","cuidado","Ela desafia o altar: «Que Deus é esse…?»"]]},{"nivel":2,"tipo":"unica","rot":"O que mudou","pergunta":"No ato II, Maria dizia a Telmo: «não diz a verdade toda… que é quase o mesmo» que mentir. E agora?","opcoes":[["Pede a mentira que antes condenava, porque é ela quem vai perder tudo","certo","A peça faz a personagem mais exigente com a verdade pedir a maior mentira."],["Continua a exigir a verdade","cuidado","«Pois mente agora» é o oposto."],["Não se lembra do que disse","cuidado","Lembra-se demasiado bem: «nunca mentiste?»"]]},{"nivel":2,"tipo":"multi","rot":"O anjo","pergunta":"O anjo do sonho de Maria «arrancava-a dos braços» da mãe. O que é que esse sonho mostra?","opcoes":[["Que ela já sabia que o seu nascimento era tido por ilegítimo",5,"«nunca to disse, mas sabia-o»."],["Que temia ser separada dos pais",5,"É o que o anjo faz todas as noites, e o que a lei vai fazer de dia."],["Que gostava de dormir",0,"O anjo aparecia «para me não deixar dormir»."],["Que queria ir para um convento",0,"É o contrário: quer ficar com o pai e a mãe."]]},{"nivel":3,"tipo":"texto","rot":"A resposta","pergunta":"Madalena só diz «Misericórdia, meu Deus!». Escreve a resposta que ela não consegue dar: mente, recusa ou cala-se? Uma ou duas frases, até 30 palavras.","minPalavras":6,"maxPalavras":30,"placeholder":"MADALENA — …"}],"fontes":[["Almeida Garrett, Frei Luís de Sousa (Project Gutenberg n.º 17591)","https://www.gutenberg.org/ebooks/17591"]],"modulo":"M4","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camilo-Dezoito-Annos.html","id":"camilo-assento","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · Amor de Perdição","titulo":"Dezoito annos!","subtitulo":"Camilo Castelo Branco, Amor de Perdição, 1862 · Introdução","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de arquivos","Distingues o papel da cadeia da voz que chora por cima dele."],[0.5,"Bom começo","Já vês o documento. Repara em quem fala a seguir, e como."],[0,"A entrar no romance","Relê: primeiro um registo de polícia, depois um homem a comover-se com ele."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>O romance abre com um papel de arquivo:</p><p><i>Folheando os livros de antigos assentamentos, no cartorio das cadêas da Relação do Porto, li, no das entradas dos presos desde 1803 a 1805, a folhas 232, o seguinte:</i></p><p><i>Simão Antonio Botelho, que assim disse chamar-se, ser solteiro, e estudante na Universidade de Coimbra, natural da cidade de Lisboa, e assistente na occasião de sua prisão na cidade de Vizeu, idade de dezoito annos, filho de Domingos José Correia Botelho e de D. Rita Preciosa Caldeirão Castello-Branco, estatura ordinaria, cara redonda, olhos castanhos, cabello e barba preta, vestido com jaqueta de baetão azul, collête de fustão pintado e calça de panno pedrez. E fiz este assento, que assignei.</i></p><p><i>Á margem esquerda d'este assento está escripto: Foi para a India em 17 de Março de 1807.</i></p><p>[…]</p><p><i>O leitor de certo se compungia; e a leitora se lhe dissessem, em menos de uma linha, a historia d'aquelles dezoito annos, choraria! Pois não? A olhos enchutos poderia ouvil-a a mulher, a creatura mais bem formada das branduras da piedade, a que por vezes traz comsigo do ceo um reflexo da divina misericordia, essa, a minha leitora, a carinhosa amiga de todos os infelizes não choraria se lhe dissessem que o pobre moço perdêra honra, rehabilitação, patria, liberdade, irmãs, mãe, tudo, por amor da primeira mulher que o despertou do seu dormir de innocentes desejos?!</i></p><p class=\"nota\"><b>assentamentos</b> — registos · <b>a folhas 232</b> — na página 232 · <b>baetão</b> — pano grosso de lã · <b>pedrez</b> — com pintas · <b>compungia</b> — comovia · <b>enchutos</b> — secos</p>","links":[["Ler o romance inteiro no Project Gutenberg","https://www.gutenberg.org/ebooks/16425"]]},{"nivel":1,"tipo":"multi","rot":"O que diz o papel","pergunta":"O que regista o assento da cadeia sobre Simão?","opcoes":[["Que tem dezoito anos e é estudante em Coimbra",5,"Idade e ocupação."],["A cor dos olhos e a roupa que veste",5,"«olhos castanhos», «jaqueta de baetão azul»: descrição de polícia."],["O nome dos pais",5,"Domingos José e D. Rita Preciosa."],["Porque foi preso",0,"Isso o papel não diz: é o romance que o vai contar."]]},{"nivel":1,"tipo":"unica","rot":"A margem","pergunta":"«Foi para a India em 17 de Março de 1807.» O que é esta linha?","opcoes":[["Uma nota à margem do registo: o destino de Simão, em meia linha","certo","O degredo, escrito por um funcionário, sem uma palavra a mais."],["Uma carta de Simão","cuidado","Não há voz de Simão aqui: só o registo."],["O título do capítulo","cuidado","É uma anotação de arquivo, copiada pelo narrador."]]},{"nivel":2,"tipo":"classificar","rot":"Duas vozes","pergunta":"Cada frase é do assento (registo) ou do narrador?","categorias":["O assento da cadeia","A voz do narrador"],"itens":[["estatura ordinaria, cara redonda, olhos castanhos",0],["a creatura mais bem formada das branduras da piedade",1],["E fiz este assento, que assignei.",0],["o pobre moço perdêra honra, rehabilitação, patria, liberdade",1]],"retorno":"O papel descreve e assina; o narrador chora e enumera. O romance nasce entre os dois."},{"nivel":2,"tipo":"unica","rot":"A leitora","pergunta":"O narrador separa «o leitor» da «leitora» e diz que ela «choraria». Para que serve esta figura?","opcoes":[["Para preparar a leitura sentimental: pede ao público que se comova","certo","É a imagem romântica do público, usada para conquistar quem lê."],["Para dizer que as mulheres não devem ler o livro","cuidado","Pelo contrário: chama-lhe «a minha leitora», «carinhosa amiga»."],["Para contar quem eram as leitoras em 1862","cuidado","Não é um dado histórico: é uma técnica de narrador."]]},{"nivel":3,"tipo":"texto","rot":"Uma abertura","pergunta":"Escreve, em duas frases, como abrias um documentário sobre Simão a partir do assento: o que se vê e o que se ouve. Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"Vê-se … Ouve-se …"}],"fontes":[["Camilo Castelo Branco, Amor de Perdição (Project Gutenberg n.º 16425)","https://www.gutenberg.org/ebooks/16425"]],"modulo":"M5","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camilo-Em-Que-Seculo.html","id":"camilo-seculo","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · Amor de Perdição","titulo":"Em que século estamos nós?","subtitulo":"Camilo Castelo Branco, Amor de Perdição, 1862 · cap. I","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de ironias","Ouviste a luneta de D. Rita e o sorriso do narrador."],[0.5,"Bom começo","Já vês a corte a chegar à província. Repara em quem se ri de quem."],[0,"A entrar no romance","Relê as falas em voz alta: a de D. Rita tem sempre uma segunda intenção."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>O pai de Simão:</p><p><i>Domingos Botelho devia ter uma vocação qualquer; e tinha: era excellente flautista; foi a primeira flauta do seu tempo; e a tocar flauta se sustentou dois annos em Coimbra, durante os quaes seu pae lhe suspendeu as mesadas, porque os rendimentos da casa não bastavam a livrar outro filho de um crime de morte.</i></p><p>A mãe, dama da corte, chega a Vila Real:</p><p><i>D. Rita, avistando o prestito das liteiras, ajustou ao olho direito a sua grande luneta de oiro, e disse:<br>— Ó Menezes, aquillo que é?!<br>— São os nossos amigos e parentes que veem esperar-nos.<br>— Em que seculo estamos nós n'esta montanha? — tornou a dama do paço.<br>— Em que seculo?! o seculo tanto é dezoito aqui como em Lisboa.<br>— Ah! sim? Cuidei que o tempo parára aqui no seculo doze.<br>O marido achou que devia rir-se do chiste, que o não lisonjeára grandemente.</i></p><p class=\"nota\"><b>prestito</b> — cortejo · <b>liteiras</b> — cadeiras cobertas levadas por homens ou animais · <b>dama do paço</b> — senhora da corte · <b>chiste</b> — piada</p>","links":[["Ler o romance inteiro no Project Gutenberg","https://www.gutenberg.org/ebooks/16425"]]},{"nivel":1,"tipo":"unica","rot":"A luneta","pergunta":"D. Rita «ajustou ao olho direito a sua grande luneta de oiro» antes de perguntar o que é aquilo. O que diz o gesto?","opcoes":[["Olha a família do marido de longe e de cima, como uma curiosidade","certo","A luneta de ouro é a corte a examinar a província."],["Vê mal","cuidado","Pode ver mal, mas o narrador escolheu dizer «de oiro» e «grande»."],["Está comovida","cuidado","Nada na cena é comoção: é inspeção."]]},{"nivel":1,"tipo":"classificar","rot":"Quem diz","pergunta":"Quem diz cada frase?","categorias":["D. Rita","Domingos Botelho (Menezes)","O narrador"],"itens":[["Cuidei que o tempo parára aqui no seculo doze.",0],["o seculo tanto é dezoito aqui como em Lisboa.",1],["devia ter uma vocação qualquer; e tinha",2],["Ó Menezes, aquillo que é?!",0]],"retorno":"D. Rita ataca, o marido defende sem convicção, o narrador ri-se dos dois."},{"nivel":2,"tipo":"unica","rot":"A vocação","pergunta":"«Domingos Botelho devia ter uma vocação qualquer; e tinha: era excellente flautista.» Onde está a ironia?","opcoes":[["O narrador anuncia uma vocação a sério e entrega uma flauta","certo","O ponto e vírgula e os dois pontos preparam a queda: a única coisa que ele sabia fazer."],["Tocar flauta é uma grande vocação","cuidado","Para um fidalgo juiz, o narrador acha que não; por isso o diz assim."],["Não há ironia: é um elogio","cuidado","Um elogio que vem depois de «extremamente feio» e «alcançadissimo de intelligencia» não é um elogio."]]},{"nivel":2,"tipo":"julgar","rot":"Passa ou não passa","pergunta":"Quatro leituras de um colega. Quais têm prova no texto?","casos":[["D. Rita despreza a província.",true,"Passa: «seculo doze», a luneta, o chiste."],["Domingos Botelho ri-se de gosto.",false,"Não passa: «achou que devia rir-se», e o chiste «não o lisonjeára»."],["O narrador admira Domingos Botelho.",false,"Não passa: «feio», «alcançadissimo de intelligencia», «brocas»."],["A família de Domingos é da nobreza antiga.",true,"Passa: as liteiras com brasão, a «velha nobreza» que veio no tempo de D. Dinis."]],"retorno":"Prova é uma frase do texto: sem frase, é palpite."},{"nivel":3,"tipo":"texto","rot":"Pela luneta","pergunta":"Descreve a chegada a Vila Real em duas frases, como um criado a veria: um pormenor do texto em cada. Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"Vi a senhora … Depois …"}],"fontes":[["Camilo Castelo Branco, Amor de Perdição (Project Gutenberg n.º 16425)","https://www.gutenberg.org/ebooks/16425"]],"modulo":"M5","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camilo-A-Violencia-de-um-Pai.html","id":"camilo-pai","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · Amor de Perdição","titulo":"A violência de um pai é sempre amor","subtitulo":"Camilo Castelo Branco, Amor de Perdição, 1862 · cap. IV","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de confrontos","Viste a voz do pai mudar de tom e a filha não mudar de sítio."],[0.5,"Bom começo","Já vês a ordem. Repara em como ela começa: com a palavra amor."],[0,"A entrar na cena","Relê: cada fala de Tadeu tira uma coisa; a última de Teresa não tem uma lágrima."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Tadeu de Albuquerque, ao romper do dia, à filha:</p><p><i>— Vais hoje dar a mão de esposa a teu primo Balthazar, minha filha. É preciso que te deixes cegamente levar pela mão de teu pae. Logo que déres este passo difficil, conhecerás que a tua felicidade é d'aquellas que precisam ser impostas pela violencia. Mas repara, minha querida filha, que a violencia de um pae é sempre amor. Amor tem sido a minha condescendencia e brandura para comtigo. Outro teria subjugado a tua desobediencia com maus tractos, com os rigores do convento, e talvez com o desfalque do teu grande patrimonio. Eu, não. Esperei que o tempo te aclarasse a razão, e felicito-me de te julgar desassombrada do diabolico prestigio do maldito, que acordou o teu innocente coração. Não te consultei outra vez sobre este casamento, por temer que a reflexão fizesse mal ao fervor de boa filha com que tu vais abraçar teu pae, e agradecer-lhe a sisudez com que elle respeitou o teu genio, velando sempre a hora de te encontrar digna do seu amor.</i></p><p>[…]</p><p><i>— E será o pae feliz com o meu sacrificio?</i></p><p>[…]</p><p><i>— E não será mais certo odial-o eu sempre!? Eu agora mesmo o abomino como nunca pensei que se podesse abominar! Meu pae... — continuou ella, chorando, com as mãos erguidas — mate-me; mas não me force a casar com meu primo! E' escusada a violencia, porque eu não caso!..<br>Thadeu mudou de aspecto, e disse irado:<br>— Hás de casar! Quero que cases! Quero!... Quando não, amaldiçoada serás para sempre, Thereza! Morrerás n'um convento! Esta casa irá para teu primo! Nenhum infame ha de aqui pôr um pé nas alcatifas de meus avós. Se és uma alma vil, não me pertences, não és minha filha, não podes herdar appellidos honrosos, que foram pela primeira vez insultados pelo pae d'esse miseravel que tu amas! Maldita sejas! Entra n'esse quarto, e espera que d'ahi te arranquem para outro, onde não verás um raio de sol.</i></p><p><i>Thereza ergueu-se sem lagrimas, e entrou serenamente no seu quarto. Thadeu de Albuquerque foi encontrar seu sobrinho, e disse-lhe:</i></p><p class=\"nota\"><b>condescendencia</b> — tolerância · <b>desfalque</b> — corte · <b>desassombrada</b> — livre · <b>sisudez</b> — juízo · <b>escusada</b> — inútil · <b>alcatifas</b> — tapetes</p>","links":[["Ler o romance inteiro no Project Gutenberg","https://www.gutenberg.org/ebooks/16425"]]},{"nivel":1,"tipo":"unica","rot":"A frase","pergunta":"«a violencia de um pae é sempre amor.» Que recurso é este?","opcoes":[["Um paradoxo: junta duas coisas que se contradizem","certo","Violência igual a amor: a contradição serve para justificar a imposição."],["Uma comparação","cuidado","Não há «como»: a frase iguala, não compara."],["Uma hipérbole","cuidado","Não exagera: inverte."]]},{"nivel":1,"tipo":"ordenar","rot":"Verso a verso","pergunta":"Põe por ordem o que Tadeu diz à filha.","itens":["Vais hoje casar com o teu primo","A violência de um pai é sempre amor","Hás de casar! Quero!","Maldita sejas!","Entra n'esse quarto"],"retorno":"Do «minha querida filha» à maldição em meia página: a violência estava lá desde a primeira frase, vestida de amor."},{"nivel":2,"tipo":"classificar","rot":"Afeto ou ameaça","pergunta":"Cada expressão de Tadeu é afeto (ou parece) ou ameaça?","categorias":["Afeto (ou aparência de afeto)","Ameaça"],"itens":[["minha querida filha",0],["Morrerás n'um convento!",1],["a minha condescendencia e brandura para comtigo",0],["não és minha filha",1]],"retorno":"As palavras de afeto vêm todas antes do «não»; as ameaças, todas depois. É Teresa que muda o pai."},{"nivel":2,"tipo":"unica","rot":"Sem lágrimas","pergunta":"«Thereza ergueu-se sem lagrimas, e entrou serenamente no seu quarto.» O que mostra este gesto?","opcoes":[["Firmeza: Teresa não cede, não implora e não se humilha","certo","Chorou antes, a pedir; depois da maldição, nem uma lágrima: a «mulher varonil» do narrador."],["Indiferença: Teresa não se importa","cuidado","Importa-se tanto que vai morrer por isto; a serenidade é decisão, não frieza."],["Obediência: Teresa aceita casar","cuidado","Acabou de dizer «eu não caso!»; entrar no quarto não é ceder."]]},{"nivel":3,"tipo":"texto","rot":"Por amor","pergunta":"Escreve uma frase de hoje em que «é para o teu bem» esconda uma imposição, e diz numa segunda frase o que esconde. Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"«…, é para o teu bem.» Esconde …"}],"fontes":[["Camilo Castelo Branco, Amor de Perdição (Project Gutenberg n.º 16425)","https://www.gutenberg.org/ebooks/16425"]],"modulo":"M5","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Camilo-A-Carta-de-Teresa.html","id":"camilo-carta","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · Amor de Perdição","titulo":"É já o meu espírito que te fala","subtitulo":"Camilo Castelo Branco, Amor de Perdição, 1862 · Conclusão","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de cartas","Percebeste quem escreve, a que horas, e o que deixa por responder."],[0.5,"Bom começo","Já ouves Teresa. Repara nas perguntas: são para Simão responder no mar."],[0,"A entrar na carta","Relê a primeira frase: quem escreve já se dá por morta."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Simão, na nau dos degredados, abre a última carta de Teresa:</p><p><i>«É já o meu espirito que te falla, Simão. A tua amiga morreu. A tua pobre Thereza, á hora em que leres esta carta, se me Deus não engana, está em descanso.</i></p><p><i>Eu devia poupar-te a esta ultima tortura; não devia escrever-te; mas perdôa á tua esposa do ceu a culpa pela consolação que sinto em conversar comtigo a esta hora, hora final da noite da minha vida.</i></p><p>[…]</p><p><i>Ó Simão, de que ceu tão lindo cahimos! Á hora que te escrevo estás tu para entrar na nau dos degredados, e eu na sepultura.</i></p><p>[…]</p><p><i>Tu nunca hás de amar, não, meu esposo? Terias pejo de ti mesmo, se uma vez visses passar rapidamente a minha imagem por diante dos teus olhos enxutos? Soffre, soffre ao coração da tua amiga estas derradeiras perguntas, a que tu responderás, no alto mar, quando esta carta lêres.</i></p><p><i>Rompe a manhã. Vou vêr a minha ultima aurora... a ultima dos meus dezoito annos!</i></p><p>[…]</p><p><i>Adeus; á luz da eternidade parece-me que já te vejo, Simão.»</i></p><p class=\"nota\"><b>consolação</b> — conforto · <b>degredados</b> — condenados ao exílio · <b>pejo</b> — vergonha · <b>derradeiras</b> — últimas</p>","links":[["Ler o romance inteiro no Project Gutenberg","https://www.gutenberg.org/ebooks/16425"]]},{"nivel":1,"tipo":"unica","rot":"Quem fala","pergunta":"«É já o meu espirito que te falla, Simão. A tua amiga morreu.» Como é possível uma morta escrever?","opcoes":[["Teresa escreve antes de morrer, para uma hora em que já terá morrido","certo","«á hora em que leres esta carta… está em descanso»: a carta está escrita para o futuro."],["É uma carta falsa","cuidado","É a carta dela: escrita de madrugada, lida à meia-noite no mar."],["Simão está a sonhar","cuidado","Simão «rompeu a obreia» e leu: a carta é real."]]},{"nivel":1,"tipo":"par","rot":"Marcas da carta","pergunta":"Liga cada marca do texto epistolar ao exemplo.","pares":[["vocativo","Simão; meu esposo"],["momento da escrita","Á hora que te escrevo; Rompe a manhã"],["metáfora da vida como um dia","hora final da noite da minha vida; a minha ultima aurora"],["despedida","Adeus; á luz da eternidade parece-me que já te vejo"]],"retorno":"Uma carta tem quem a recebe, uma hora e um adeus; esta tem tudo isso e mais uma sepultura."},{"nivel":2,"tipo":"lacuna","rot":"A palavra de Teresa","pergunta":"Completa com a palavra de Camilo.","versos":[{"antes":"Vou vêr a minha ultima ","opcoes":["aurora","noite","carta"],"depois":"..."},{"antes":"perdôa á tua ","opcoes":["esposa","amiga","irmã"],"depois":" do ceu"}],"retorno":"Aurora: a vida como um dia que acaba de manhã. Esposa do céu: nunca casaram, e casaram para sempre."},{"nivel":2,"tipo":"unica","rot":"As perguntas","pergunta":"Teresa faz perguntas a Simão «a que tu responderás, no alto mar». Porque deixa perguntas a quem já não a pode ouvir?","opcoes":[["Para o o astica que competia a uma edificação do reinado da sr.^a D. Maria I: com uma sineta e com uma cruz no topo assimilhar-se-hia a um Collegio de Jesuitas. O nome de Ramalhete provinha de certo d'um revestimento quadrado de azulejos fazendo painel no logar heraldico do Escudo d'Armas, que nunca chegara a ser collocado, e representando um grande ramo de girasoes atado por uma fita onde se distinguiam letras e numeros d'uma data.</i></p><p><b>B</b> — dez anos depois, Carlos parte:</p><p><i>Depois na rua Carlos parou, deu um longo olhar ao sombrio casarão, que n'aquella primeira penumbra tomava um aspecto mais carregado de residencia ecclesiastica, com as suas paredes severas, a sua fila de janellinhas fechadas, as grades dos postigos terreos cheias de treva, mudo, para sempre deshabitado, cobrindo-se já de tons de ruina.</i></p><p><i>— É curioso! Só vivi dois annos n'esta casa, e é n'ella que me parece estar mettida a minha vida inteira!</i></p><p class=\"nota\"><b>renque</b> — fila · <b>Residencia Ecclesiastica</b> — casa de padres · <b>Escudo d'Armas</b> — brasão · <b>postigos terreos</b> — pequenas janelas ao nível da rua</p>","links":[["Ler o romance inteiro no Project Gutenberg","https://www.gutenberg.org/ebooks/40409"]]},{"nivel":1,"tipo":"multi","rot":"O que se repete","pergunta":"Que expressões de A voltam em B?","opcoes":[["sombrio casarão",5,"Sim: a mesma casa, as mesmas palavras."],["paredes severas",5,"Sim."],["residencia ecclesiastica",5,"Sim: o ar de casa de padres nunca saiu."],["fresco nome de vivenda campestre",0,"Não: em B já não há nome fresco; só ruína."]]},{"nivel":1,"tipo":"unica","rot":"O nome","pergunta":"De onde vem o nome «Ramalhete»?","opcoes":[["De um painel de azulejos com um ramo de girassóis, no lugar onde devia estar o brasão","certo","As flores ocupam o lugar da honra: um brasão «que nunca chegara a ser collocado»."],["Do jardim da casa","cuidado","O jardim é um «pobre quintal inculto»; o nome vem dos azulejos."],["Do nome da rua","cuidado o realismo por uma razão diferente, e ninguém ouve."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Jantar no Hotel Central. Discute-se o realismo:</p><p><i>— Isso é absurdo, dizia Carlos, os caracteres só se podem manifestar pela acção...<br>— E a obra d'arte, accrescentou Craft, vive apenas pela fórma...<br>Alencar interrompeu-os, exclamando que não eram necessarias tantas philosophias.<br>— Vocês estão gastando cêra com ruins defuntos, filhos. O realismo critica-se d'este modo: mão no nariz! Eu quando vejo um d'esses livros, enfrasco-me logo em agua de colonia. Não discutamos o excremento.<br>— Sole normande? perguntou-lhe o creado, adiantando a travessa.</i></p><p>[…]</p><p><i>Carlos não entendia de finanças: mas parecia-lhe que, d'esse modo, o paiz ia alegremente e lindamente para a banca-rota.<br>— N'um galopesinho muito seguro e muito a direito, disse o Cohen, sorrindo. Ah, sobre isso, ninguem tem illusões, meu caro senhor. Nem os proprios ministros da fazenda!... A banca-rota é inevitavel: é como quem faz uma somma...<br>Ega mostrou-se impressionado. Olha que brincadeira, hein! E todos escutavam o Cohen. Ega, depois de lhe encher o calice de novo, fincara os cotovellos na meza para lhe beber melhor as palavras.</i></p><p class=\"nota\">gastando cêra com ruins defuntos — a perder tempo com o que não merece · <b>sole normande</b> — linguado à normanda (francês) · <b>banca-rota</b> — falência · <b>fazenda</b> — finanças</p>","links":[["Ler o romance inteiro no Project Gutenberg","https://www.gutenberg.org/ebooks/40409"]]},{"nivel":1,"tipo":"classificar","rot":"Quem diz","pergunta":"De quem é cada fala ou gesto?","categorias":["Alencar","Craft","Cohen","Ega"],"itens":[["Não discutamos o excremento.",0],["a obra d'arte vive apenas pela fórma",1],["A banca-rota é inevitavel: é como quem faz uma somma...",2],["fincara os cotovellos na meza para lhe beber melhor as palavras",3]],"retorno":"O poeta, o esteta, o financeiro e o discípulo: quatro maneira },{"pasta":"Ler-a-fundo","ficheiro":"Eca-Falhamos-a-Vida.html","id":"eca-falhamos","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · Os Maias","titulo":"Falhámos a vida, menino!","subtitulo":"Eça de Queirós, Os Maias, 1888 · último capítulo","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de balanços","Percebeste o que Carlos e Ega chamam a si próprios, e porquê."],[0.5,"Bom começo","Já ouves a frase. Repara na lista de Paris: é uma vida cheia de coisas e vazia."],[0,"A entrar no fim","Relê: dez anos e «não me tem succedido nada»."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Dez anos depois, Carlos e Ega, no Ramalhete:</p><p><i>— E aqui tens tu uma existencia d'homem! Em dez annos não me tem succedido nada, a não ser quando se me quebrou o phaeton na estrada de Saint-Cloud... Vim no Figaro.<br>Ega ergueu-se, atirou um gesto desolado:<br>— Falhámos a vida, menino!<br>— Creio que sim... Mas todo o mundo mais ou menos a falha. Isto é, falha-se sempre na realidade aquella vida que se planeou com a imaginação. Diz-se: «vou ser assim, porque a belleza está em ser assim». E nunca se é assim, é-se invariavelmente assado, como dizia o pobre marquez. Ás vezes melhor, mas sempre differente.</i></p><p>[…]</p><p><i>— Muitas outras coisas dão valor á vida... Isso é uma velha idéa de romantico, meu Ega!<br>— E que somos nós? exclamou Ega. Que temos nós sido desde o collegio, desde o exame de latim? Romanticos: isto é, individuos inferiores que se governam na vida pelo sentimento e não pela razão...</i></p><p class=\"nota\"><b>phaeton</b> — carruagem ligeira · <b>Saint-Cloud</b> — arredores de Paris · <b>Figaro</b> — jornal de Paris</p>","links":[["Ler o romance inteiro no Project Gutenberg","https://www.gutenberg.org/ebooks/40409"]]},{"nivel":1,"tipo":"lacuna","rot":"A palavra de Eça","pergunta":"Completa com a palavra do romance.","versos":[{"antes":"— Falhámos a ","opcoes":["vida","prova" ergunta":"«Do palacio encantado da Illusão / Desci a passo e passo a escada estreita.» Que palácio é este?","opcoes":[["O mesmo palácio da Ventura da ficha 1, agora chamado Ilusão, e deixado para trás","certo","Da porta batida ao descer devagar: o percurso de Antero."],["A casa onde o poeta nasceu","cuidado","«Encantado» e «Illusão»: não é uma casa real."],["O céu","cuidado","O céu é para onde vai o coração; o palácio é de onde sai."]]},{"nivel":1,"tipo":"par","rot":"As três palavras do Ideal","pergunta":"Em A, o Ideal é dito por três palavras. Liga cada uma ao que ela sugere.","pares":[["miragem","o que se vê e não existe"],["Nuvem","o que não se agarra"],["sonho impalpavel do Desejo","o que se deseja e não se toca"],["solidão","onde o Ideal nasceu"]],"retorno":"Três imagens para uma coisa sem nome: o Ideal só se diz por aproximação."},{"nivel":2,"tipo":"unica","rot":"A criança ao colo","pergunta":"«Como criança, em lobrega jornada, / Que a mãe leva ao collo agasalhada». A que é comparado o coração?","opcoes":[["A uma criança ao colo, que atravessa perigos sem medo porque alguém a leva","certo","Selvas, mares, desertos: já não é ela que caminha."],["A uma mãe","cuidado","A mãe é quem leva; o coração é a criança."],["A um cavaleiro","cuidado","Esse era o da ficha 1; aqui já ninguém combate."]]},{"nivel":2,"tipo":"julgar","rot":"Vitória ou derrota","pergunta":"Quatro leituras de um colega. Quais têm prova no soneto?","casos":[["O sujeito desiste do Ideal.",true,"Passa: «Depuz do Ideal e da Paixão / A forma transitoria e imperfeita»."],["O sujeito encontra paz.",true,"Passa: «Descançou a final meu coração», «coração liberto»."],["O sujeito volta a procurar o palácio.",false,"Não passa: desce dele «a passo e passo» e não volta."],["O soneto acaba com uma pergunta.",false,"Não passa: acaba com uma ordem ao coração: «Dorme… eternamente!»."]],"retorno":"Derrota e vitória no mesmo soneto: é por isso que a ficha pede para decidir."},{"nivel":3,"tipo":"texto","rot":"Três «não é»","pergunta":"Define o teu ideal pela negação, à maneira de A: três coisas que ele não é. Até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"Não é …, não é …, nem …"}],"fontes":[["Antero de Quental, Os Sonetos Completos (Project Gutenberg n.º 20142)","https://www.gutenberg.org/ebooks/20142"]],"modulo":"M6","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Cesario-Ave-Marias.html","id":"cesario-avemarias","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M6 Cesário","titulo":"Ave-Marias","subtitulo":"Cesário Verde, «O Sentimento dum Ocidental», I (1887)","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Olhos de Cesário","Viste a cidade com os cinco sentidos e as naus que ele evoca."],[0.5,"Bom começo","Já sentes a melancolia. Repara no que ele vê a seguir: coisas concretas."],[0,"A sair à rua","Relê devagar: cada estrofe é um sítio e uma sensação."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>O anoitecer, junto ao rio:</p><p><i>Nas nossas ruas, ao anoitecer,<br>Ha tal soturnidade, ha tal melancholia,<br>Que as sombras, o bulicio, o Tejo, a maresia<br>Despertam-me um desejo absurdo de soffrer.</i></p><p><i>O ceu parece baixo e de neblina,<br>O gaz extravasado enjôa-me, perturba;<br>E os edificios, com as chaminés, e a turba<br>Toldam-se d'uma côr monotona e londrina.</i></p><p>[…]</p><p><i>E evoco, então, as chronicas navaes:<br>Mouros, baixeis, heroes, tudo resuscitado!<br>Lucta Camões no Sul, salvando um livro a nado!<br>Singram soberbas naus que eu não verei jámais!</i></p><p>[…]</p><p><i>Vem sacudindo as ancas opulentas!<br>Seus troncos varonis recordam-me pilastras;<br>E algumas, á cabeça, embalam nas canastras<br>Os filhos que depois naufragam nas tormentas,</i></p><p class=\"nota\"><b>soturnidade</b> — tristeza sombria · <b>bulicio</b> — agitação · <b>extravasado</b> — que se espalha · <b>baixeis</b> — navios · <b>singram</b> — navegam · <b>varonis</b> — fortes</p>","links":[["O Livro de Cesário Verde (Project Gutenberg n.º 8698)","https://www.gutenberg.org/ebooks/8698"]]},{"nivel":1,"tipo":"classificar","rot":"Cinco sentidos","pergunta":"Que sentido está em cada expressão?","categorias":["Visão","Olfato","Audição"],"itens":[["O ceu parece baixo e de neblina",0],["O gaz extravasado enjôa-me",1],["o bulicio",2],["côr monotona e londrina",0]],"retorno":"Cesário lê a cidade com o corpo: é o que se chama perceção sensorial."},{"nivel":1,"tipo":"unica","rot":"O desejo absurdo","pergunta":"«Despertam-me um desejo absurdo de soffrer.» Porque é «absurdo»?","opcoes":[["Porque não tem causa: as sombras, o rio e a maresia não deviam fazer sofrer","certo","É a melancolia do sujeito, projetada sobre a cidade."],["Porque o sujeito gosta de sofrer","cuidado","Não gosta: o desejo aparece-lhe sem ele o querer."],["Porque está a chover","cuidado","Há neblina, não chuva; e o absurdo não é meteorológico."]]},{"nivel":2,"tipo":"unica","rot":"As naus","pergunta":"«Singram soberbas naus que eu não verei jámais!» O que acontece nesta estrofe?","opcoes":[["O sujeito passa do que vê (os cais) ao que imagina: a epopeia, Camões, as naus","certo","Imaginário épico: o passado heroico contra o presente cinzento."],["O sujeito vê naus a passar no Tejo","cuidado","«que eu não verei jámais»: não as vê; evoca-as."],["O sujeito lê Os Lusíadas","cuidado","Lembra Camões a nadar com o livro, mas está na rua, a olhar."]]},{"nivel":2,"tipo":"par","rot":"As varinas","pergunta":"Liga cada expressão ao que ela faz às varinas.","pares":[["Seus troncos varonis recordam-me pilastras","força e grandeza de coluna"],["embalam nas canastras / Os filhos","trabalho e maternidade ao mesmo tempo"],["que depois naufragam nas tormentas","a miséria que espera os filhos"],["Vem sacudindo as ancas opulentas!","vitalidade, corpo em movimento"]],"retorno":"Dignidade e miséria na mesma estrofe: é o olhar de Cesário."},{"nivel":3,"tipo":"texto","rot":"O teu anoitecer","pergunta":"Es  montes,<br>A Dôr humana busca os amplos horisontes,<br>E tem marés, de fel, como um sinistro mar!</i></p><p class=\"nota\"><b>mortifica</b> — atormenta · <b>aljube</b> — prisão · <b>mulher de «dom»</b> — senhora de família nobre · <b>enfezados</b> — raquíticos · <b>emparedados</b> — fechados entre paredes · <b>fel</b> — amargura</p>","links":[["O Livro de Cesário Verde (Project Gutenberg n.º 8698)","https://www.gutenberg.org/ebooks/8698"]]},{"nivel":1,"tipo":"unica","rot":"Quem está preso","pergunta":"«O aljube, em que hoje estão velhinhas e creanças, / Bem raramente encerra uma mulher de «dom»!» O que denuncia o verso?","opcoes":[["Que a prisão é para os pobres: as senhoras nobres nunca lá entram","certo","Crítica social em dois versos: velhinhas e crianças presas, as de «dom» de fora."],["Que a prisão está vazia","cuidado","Está cheia de «velhinhas e creanças»."],["Que as mulheres não cometem crimes","cuidado","Não é isso: é quem é apanhado e quem não é."]]},{"nivel":1,"tipo":"unica","rot":"Palácio e casebre","pergunta":"«Inflamma-se um palacio em face de um casebre.» Que recurso está aqui e o que mostra?","opcoes":[["Antítese: a riqueza iluminada mesmo em frente da miséria","certo","Lado a lado, na mesma rua: é a cidade de Cesário."],["Metáfora: o palácio arde","cuidado","«Inflamma-se» é iluminar-se, acender as luzes; não é incêndio."],["Hipérbole: exagera o tamanho do palácio","cuidado","Não exagera: põe em frente."]]},{"nivel":2,"tipo":"ordenar","rot":"O sonho e o Mas","pergunta":"Põe por ordem o movimento de IV.","itens":["O sujeito sonha não morrer nunca e buscar a perfeição","Imagina esposas puras em mansões de vidro","«Mas se vivemos, os emparedados»: volta à cidade sem árvores","Vê navalhas e ouve gritos na treva","A Dor humana, enorme, como um mar de fel"],"retorno":"Sonho, viragem, realidade, dor: o «Mas» é a dobradiça de todo o poema."},{"nivel":2,"tipo":"unica","rot":"O mar de fel","pergunta":"«A Dôr humana busca os amplos horisontes, / E tem marés, d cantou na rua e nos transportes, sobretudo em Paris: Brel, Dylan, Cohen. Depois vieram os álbuns O Lado Errado da Noite (1985), Bairro do Amor (1989), Só (1991), Voo Nocturno (2007) e, em 2024, o palco com os dois filhos.</p><p><b>Ouve uma canção dele até ao fim</b> («Deixa-me Rir», «Frágil» ou «Encosta-te a Mim») e volta aqui.</p>","links":[["Ouvir no Spotify","https://open.spotify.com/search/Jorge%20Palma"],["A vida, na Wikipédia","https://pt.wikipedia.org/wiki/Jorge_Palma"]],"nota":"As letras estão protegidas por direitos de autor: ouve-as na plataforma oficial."},{"nivel":1,"tipo":"ordenar","rot":"Uma vida por ordem","pergunta":"Põe por ordem os momentos da vida de Jorge Palma.","itens":["A mãe inscreve-o no piano, aos seis anos","Teclista dos Sindicato, no primeiro Vilar de Mouros","Recusa a guerra e recebe asilo na Dinamarca","Quatro anos a cantar na rua, em Paris","«Deixa-me Rir» e O Lado Errado da Noite","3 Palmas na Mão, em palco com os filhos"],"retorno":"Piano, banda, recusa, rua, sucesso, família: cinquenta anos numa linha."},{"nivel":1,"tipo":"unica","rot":"Uma frase","pergunta":"Numa entrevista de 2002, resumiu 1973 assim: «Com licença, meus amigos, mas para a guerra não vou.» O que recusou?","opcoes":[["O serviço militar e a Guerra do Ultramar; partiu para a Dinamarca","certo","Sim. A frase é cortês e não deixa margem: pede licença e não vai."],["Um concerto no Festival da Canção","cuidado","Concorreu ao Festival em 1975, depois de voltar. A recusa é outra."],["Um contrato com a editora","cuidado","Isso foi em 1989, com Bairro do Amor. Em 1973 o que recusou foi a guerra."]]},{"nivel":2,"tipo":"classificar","rot":"Quatro escolas","pergunta":"De que escola vem cada momento?","categorias":["Formação erudita","Rock","Rua","Ofício de arranjador"],"itens":[["Curso Geral de Piano no Conservatório (1986)",0],["Órgão e metais nos Sindicato (1969–1971)",1],["Brel e Dylan nos transportes de Paris (1978)",2],["Arranjos para Amália Rodrigues (1974–1977)",3],["Primeira audição aos oito anos",0],["Palma's Gang, com Zé Pedro dos Xutos (1993)",1]],"retorno":"As quatro escolas cabem na mesma pessoa: é isso que se ouve nas canções."},{"nivel":2,"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação ao programa e explica-a numa linha.","cartoes":[["1.º ano · Cantigas","Uma letra é poesia que se canta: as cantigas medievais também eram."],["2.º ano · Cesário","Lisboa à noite, como cenário e como personagem."],["3.º ano · Pessoa","Quem fala numa canção não é quem a assina."],["Hoje","Cinquenta anos de canções, um piano e uma voz: o que fica quando o autor morre?"]]},{"nivel":3,"tipo":"texto","rot":"Um perfil numa frase","pergunta":"Escreve uma frase que apresente Jorge Palma a quem nunca o ouviu: um facto da vida e uma coisa que as canções fazem. 15 a 35 palavras.","minPalavras":15,"maxPalavras":35,"placeholder":"Jorge Palma foi… e as canções dele…"}],"fontes":[["Wikipédia, «Jorge Palma»","https://pt.wikipedia.org/wiki/Jorge_Palma"],["Sítio oficial","https://www.jorgepalma.pt/"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Quinta-dos-Animais-Sete-Mandamentos.html","id":"quinta-mandamentos","cor":"#3f5f3f","corEscura":"#9dc39d","marca":"Ler a fundo · 5 min · Leituras para os três anos","titulo":"Mais iguais do que os outros","subtitulo":"George Orwell, Animal Farm, 1945","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de paredes","Viste como se muda uma regra sem a apagar."],[0.5,"Bom começo","Já sabes o que sobrou na parede. Pergunta agora quem a reescreveu e como."],[0,"A entrar na quinta","Relê os sete mandamentos e depois o único: o que falta pelo caminho?"]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Em 1945, <b>George Orwell</b> publica uma fábula: os animais de uma quinta expulsam o dono e escrevem as regras na parede do celeiro.</p><p><i>OS SETE MANDAMENTOS. 1. Tudo o que anda sobre duas pernas é inimigo. 2. Tudo o que anda sobre quatro patas, ou tem asas, é amigo. 3. Nenhum animal usará roupa. 4. Nenhum animal dormirá numa cama. 5. Nenhum animal beberá álcool. 6. Nenhum animal matará outro animal. 7. Todos os animais são iguais.</i></p><p>Anos depois, os porcos andam sobre duas pernas e na parede ficou uma frase só:</p><p><i>TODOS OS ANIMAIS SÃO IGUAIS MAS ALGUNS ANIMAIS SÃO MAIS IGUAIS DO QUE OS OUTROS</i></p><p>No original: <i>ALL ANIMALS ARE EQUAL BUT SOME ANIMALS ARE MORE EQUAL THAN OTHERS</i>. E o último parágrafo do livro, com os outros animais a espreitar os porcos a jantar com os homens:</p><p><i>Doze vozes gritavam de raiva, e eram todas iguais. Já não havia dúvida sobre o que acontecera às caras dos porcos. As criaturas lá fora olhavam do porco para o homem, e do homem para o porco, e do porco para o homem outra vez; mas já era impossível dizer qual era qual.</i></p><p class=\"nota\">Tradução nossa do inglês; o original está em domínio público na União Europeia. Garganta — o porco que fala pelos outros (Squealer, no original) · <b>Napoleão</b> — o porco que governa</p>","links":[["Ler o original em inglês (Project Gutenberg Australia)","https://gutenberg.net.au/ebooks01/0100011h.html"]]},{"nivel":1,"tipo":"ordenar","rot":"O que aconteceu","pergunta":"Põe por ordem o caminho dos sete mandamentos até ao último.","itens":["O velho Major conta o sonho de uma quinta sem homens","Os animais expulsam o Sr. Jones","Os porcos escrevem os sete mandamentos na parede","Napoleão expulsa Bola-de-Neve com os cães","Boxer, o cavalo que mais trabalhou, é vendido ao matadouro","Os porcos andam sobre duas pernas e sobra um mandamento"],"retorno":"Do sonho à parede, e da parede a uma frase só."},{"nivel":1,"tipo":"unica","rot":"Com lençóis","pergunta":"«Nenhum animal dormirá numa cama» passa a «Nenhum animal dormirá numa cama com lençóis». O que muda?","opcoes":[["Acrescenta-se uma condição que deixa passar o que a regra proibia","certo","Sim. A regra continua na parede e já não proíbe nada: os porcos dormem em camas, sem lençóis."],["Corrige-se um erro de ortografia","cuidado","Não há erro: há uma cláusula nova, escrita por quem quer dormir na cama."],["A regra torna-se mais dura","cuidado","Torna-se mais fraca: proíbe menos do que antes."]]},{"nivel":2,"tipo":"multi","rot":"A voz de Garganta","pergunta":"Garganta convence os animais de que o leite e as maçãs são só para os porcos. Toca no que ele usa.","opcoes":[["Uma ciência que ninguém pode verificar («isto está provado pela Ciência»)",5,"Sim: autoridade sem prova."],["O medo do regresso do dono («O Jones voltava!»)",5,"Sim: a ameaça fecha a discussão."],["Um sacrifício fingido («muitos de nós até não gostam de leite»)",5,"Sim: o privilégio vestido de dever."],["Números e contas abertas a todos",0,"Não há números: há afirmações. É por isso que funciona."]]},{"nivel":2,"tipo":"julgar","rot":"Passa ou não passa","pergunta":"Quatro frases de um colega. Quais têm prova no livro?","casos":[["«Igual» admite grau: pode-se ser mais ou menos igual.",false,"Não passa: ou se é igual ou não se é. «Mais iguais» é a contradição que sustenta o poder dos porcos."],["As ovelhas repetem a frase que os porcos lhes dão.",true,"Passa: «Quatro patas bom, duas pernas mau», e depois «melhor», quando os porcos se põem de pé."],["No fim, os animais já não distinguem os porcos dos homens.",true,"Passa: é a última frase do livro."],["Boxer morreu no hospital, como Garganta anunciou.",false,"Não passa: a carrinha que o levou dizia «matadouro de cavalos»; o hospital é a versão de Garganta."]],"retorno":"Prova é uma frase do livro; o resto é o que Garganta quer que se acredite."},{"nivel":3,"tipo":"texto","rot":"A tua parede","pergunta":"Escreve um mandamento para a tua turma e, a seguir, a versão dos porcos: a mesma regra com a cláusula que a desfaz. 12 a 40 palavras.","minPalavras":12,"maxPalavras":40,"placeholder":"Nenhum aluno… / Nenhum aluno… sem…"}],"fontes":[["George Orwell, Animal Farm, texto inglês (Project Gutenberg A
