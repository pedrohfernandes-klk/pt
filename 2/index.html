<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Português · 2.º ano</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet"><style>body{font-family:Arial,sans-serif;margin:0;padding:20px 16px 60px;max-width:720px;margin:0 auto;color:#000;background:#fff;line-height:1.4;-webkit-text-size-adjust:100%}

.simbolo{display:inline-block;vertical-align:middle}.simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.calcada{display:block;width:100%;height:14px}.calcada *{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.simbolo[data-ico]{transform-origin:50% 60%}.simbolo[data-gesto]{cursor:pointer}.simbolo.gesto-pisca{animation:gPisca 1s ease-in-out 1}.simbolo.gesto-nada{animation:gNada 1s ease-in-out 1}.simbolo.gesto-balanca{animation:gBalanca 1s ease-in-out 1}.simbolo.gesto-ri{animation:gRi .8s ease-in-out 1}.simbolo.gesto-abana{animation:gAbana .7s ease-in-out 1}.simbolo.gesto-voa{animation:gVoa 1s ease-in-out 1}.simbolo.gesto-vibra{animation:gVibra .6s linear 1}.simbolo.gesto-gira{animation:gGira 1s ease-in-out 1}.simbolo.gesto-canta{animation:gCanta .9s ease-in-out 1}.simbolo.gesto-mergulha{animation:gMergulha 1s ease-in-out 1}.simbolo.gesto-brilha{animation:gBrilha 1s ease-in-out 1}.simbolo.gesto-sino{animation:gSino 1s ease-in-out 1}.simbolo.gesto-tecla{animation:gTecla .6s steps(3) 1}.simbolo.gesto-escreve{animation:gEscreve 1s ease-in-out 1}
