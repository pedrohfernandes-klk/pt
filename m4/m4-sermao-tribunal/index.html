/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)}
/* 16/10/2026: um traço curto desenha-se debaixo do título de cada cartão de leitura (nada com «reduzir movimento») */
.jogo .ler .tit{padding-bottom:5px;background:linear-gradient(currentColor,currentColor) no-repeat 0 100%/0 2px;animation:titTraco .8s cubic-bezier(.2,.7,.2,1) .3s forwards}@keyframes titTraco{to{background-size:2.6em 2px}}@media (prefers-reduced-motion:reduce){.jogo .ler .tit{animation:none;background-size:2.6em 2px}} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

var K="epi-pt-longos";EPIJogo.montar({casca:CASCA,el:document.getElementById("baralho"),marca:"Caso",titulo:"O sermão posto em tribunal",itens:[{"t":"ler","rot":"Abre","titulo":"O sermão posto em tribunal","html":"<p class=\"etq-m\">Módulo 4 · Pensar devagar · cerca de 25 min</p><figure class=\"fig-rev \"><span class=\"fr-moldura\"><img src=\"https://pedrohfernandes-klk.github.io/pt/img/fontes/santo-antonio-peixes-garcia-fernandes.jpg\" alt=\"A cena que dá o tema ao sermão, pintada um século antes de Vieira.\" loading=\"lazy\" decoding=\"async\" style=\"object-position:50% 40%\"></span><figcaption><span class=\"fr-leg\">Santo António a pregar aos peixes, Garcia Fernandes, cerca de 1535: o tribunal já estava pintado.</span> <span class=\"fr-cred\">Domínio público. <a href=\"https://commons.wikimedia.org/wiki/File:Garcia_Fernandes_Santo_Ant%C3%B3nio_pregando_aos_peixes_MNAA.jpg\" rel=\"noopener\">commons.wikimedia.org</a></span></figcaption></figure><p class=\"abre\">Vieira acusa os peixes, mas quem está a ser julgado.</p><p class=\"pergunta-c\">Se o sermão fosse um julgamento, quem seria o réu?</p><p>Um tribunal tem um acusador, um réu, provas e uma sentença. O <i>Sermão de Santo António aos Peixes</i> tem um pregador, um auditório de peixes e uma cidade atrás dele. Vais ler o sermão como se fosse um julgamento e descobrir que o lugar do réu muda de mãos mais do que uma vez.</p><p>Trabalhas com excertos que já conheces das lições e com um que ainda não leste de perto: o momento, na peroração, em que o pregador fala de si.</p><p class=\"nota-pensa\">Não há nada para escrever. Há perguntas para decidir em silêncio antes de ver as opções, posições para justificar em voz alta e explicações que só aparecem depois de escolheres. Leva o tempo que precisares.</p>","g":0},{"t":"ler","rot":"Ato 1","titulo":"Uma praia, um pregador, uma cidade que não ouve","html":"<p>São Luís do Maranhão, 13 de junho de 1654. Vieira sobe ao púlpito e conta a história de Santo António em Arimino: pregava contra os hereges, o povo levantou-se contra ele, e o santo foi pregar aos peixes. Três dias depois do sermão, Vieira embarca para Lisboa, onde vai defender os indígenas que os colonos escravizavam.</p><p>Lê o que António podia ter feito e o que fez. Repara nas saídas que Vieira enumera, uma a uma, e recusa. A frase que fecha o episódio é a que Vieira vai fazer sua: «Já que me não querem ouvir os homens, ouçam-me os peixes».</p><blockquote class=\"cit\"><p>Pregava Santo António em Itália na cidade de Arimino, contra os hereges, que nela eram muitos; e como erros de entendimento são dificultosos de arrancar, não só não fazia fruto o Santo, mas chegou o povo a se levantar contra ele, e faltou pouco, para que lhe não tirassem a vida. Que faria neste caso o ânimo generoso do grande António? Sacudiria o pó dos sapatos, como Cristo aconselha em outro lugar? Mas António com os pés descalços não podia fazer esta protestação; e uns pés, a que se não pegou nada da terra, não tinham que sacudir. Que faria logo? Retirar-se-ia? Calar-se-ia? Dissimularia? Daria tempo ao tempo? Isso ensinaria porventura a prudência, ou a covardia humana; mas o zelo da glória divina, que ardia naquele peito, não se rendeu a semelhantes partidos. Pois que fez? Mudou somente o púlpito e o auditório, mas não desistiu da doutrina. Deixa as praças, vai-se às praias; deixa a terra, e vai-se ao mar, e começa a dizer a altas vozes:</p><p>«Já que me não querem ouvir os homens, ouçam-me os peixes». Oh! maravilhas do Altíssimo! Oh! poderes do que criou o mar, e a terra! Começam a ferver as ondas, começam a concorrer os peixes, os grandes, os maiores, os pequenos, e postos todos por sua ordem com as cabeças de fora da água, António pregava, e eles ouviam.</p></blockquote><p class=\"fonte-x\">Padre António Vieira, <i>Sermão de Santo António aos Peixes</i>, Cap. I, Santo António em Rimini. 1654; texto da Wikisource, grafia da época; as fichas atualizam a ortografia</p>","g":1},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<span class=\"respira\" aria-hidden=\"true\"></span><p class=\"q-pensa\">Quando António deixa a praça e vai para a praia, está a desistir ou a insistir?</p><div class=\"dica\">Olha para o que muda e para o que fica igual.</div><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":2},{"t":"escolha","rot":"O gesto de António","p":"Segundo Vieira, o que muda e o que não muda quando António vai pregar aos peixes?","o":["Muda o lugar e o auditório; a doutrina fica a mesma","Muda a doutrina; o lugar fica o mesmo","Muda tudo: António desiste dos homens e dedica-se aos peixes","Não muda nada: a praia é só uma pausa antes de voltar à praça"],"c":0,"f":"«Mudou somente o púlpito e o auditório, mas não desistiu da doutrina.» A doutrina é a acusação, e mantém-se; o que muda é diante de quem se diz. Quem lê desistência (terceira opção) esquece o «a altas vozes»: fala-se alto para a praia inteira ouvir. A pausa (quarta opção) não tem apoio no texto, e a segunda inverte-o. Retirar-se, calar-se, dissimular eram saídas que, diz Vieira, «ensinaria porventura a prudência, ou a covardia humana»; António recusa-as todas.","g":3},{"t":"ler","rot":"Ato 2","titulo":"O réu que se senta primeiro","html":"<p>Vieira anuncia duas metades: louvar o bem para o conservar, repreender o mal para preservar dele. Os louvores vêm primeiro, e já são estranhos: os peixes são bons ouvintes porque «ouvem e não falam». No capítulo IV começa a acusação formal.</p><p>Lê a primeira repreensão e repara na testemunha que Vieira chama a depor. A segunda metade do capítulo, a ordem de olhar para a cidade e a lista dos que comem o defunto, já a leste na lição; aqui conta como prova.</p><blockquote class=\"cit\"><p>Antes, porém, que vos vás embora, assim como ouvistes os vossos louvores, ouvi também agora as vossas repreensões. Servir-vos-ão de confusão, já que não seja de emenda. A primeira coisa que me desedifica, peixes, de vós, é que vos comeis uns aos outros. Grande escândalo é este, mas a circunstância o faz ainda maior. Não só vos comeis uns aos outros, mas os grandes comem os pequenos. Se fosse ao contrário, era menos mal. Se os pequenos comessem os grandes, bastara um grande para muitos pequenos; mas como os grandes comem os pequenos, não bastam cem pequenos, nem mil, para um só grande. Olhai como estranha isto Santo Agostinho: […] «Os homens, com as suas más e perversas cobiças, vêm a ser como os peixes que se comem uns aos outros». Tão alheia coisa é, não só da razão, mas da mesma natureza, que, sendo todos criados no mesmo elemento, todos cidadãos da mesma pátria, e todos finalmente irmãos, vivais de vos comer! Santo Agostinho, que pregava aos homens, para encarecer a fealdade deste escândalo, mostrou-lho nos peixes; e eu, que prego aos peixes, para que vejais quão feio e abominável é, quero que o vejais nos homens.</p></blockquote><p class=\"fonte-x\">Padre António Vieira, <i>Sermão de Santo António aos Peixes</i>, Cap. IV, as repreensões. 1654; digitalização Luso Livros, com ortografia atualizada</p>","g":4},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<span class=\"respira\" aria-hidden=\"true\"></span><p class=\"q-pensa\">Vieira chama Santo Agostinho a depor. Que prova traz a testemunha: um facto sobre peixes, ou uma frase sobre homens?</p><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":5},{"t":"escolha","rot":"A testemunha","p":"Que faz a citação de Santo Agostinho na acusação de Vieira?","o":["Diz que os homens são como os peixes que se comem: a testemunha fala de homens, não de peixes","Prova, com observação do mar, que os peixes grandes comem os pequenos","Desculpa os peixes, porque a natureza os fez assim","Mostra que Agostinho também pregou aos peixes"],"c":0,"f":"A frase citada é «Os homens, com as suas más e perversas cobiças, vêm a ser como os peixes […]». Agostinho «pregava aos homens» e mostrou-lhes o escândalo nos peixes; Vieira inverte o espelho. A testemunha depõe contra os homens no julgamento dos peixes. As outras opções fazem de Agostinho um naturalista ou um defensor, e o texto não permite nenhuma das duas leituras.","g":6},{"t":"sublinhar","p":"Toca nas duas palavras que dizem para onde Vieira obriga os peixes a olhar.","frase":"Para cá, para cá; para a cidade é que haveis de olhar.","certas":[6,11],"f":"«para a cidade é que haveis de olhar»: os peixes olhavam para os matos e os campos, e Vieira corrige-os. A ordem desloca o julgamento: o escândalo que importa ver não está no mar, está na cidade onde o sermão é pregado.","g":7},{"t":"multi","rot":"Seleciona","cena":"","p":"Seleciona as duas provas que Vieira apresenta contra a cidade, no capítulo IV.","opcoes":["O movimento das ruas: «tudo aquilo é andarem os homens à procura de como hão de comer, e como se hão de comer»","A lista dos que comem o defunto, dos herdeiros aos que o levam a enterrar","Um inquérito aos colonos de São Luís, com os nomes de cada um","A contagem dos peixes grandes e pequenos da costa do Maranhão","A confissão de um herdeiro que roubou um testamento"],"certas":[0,1],"fb":"As provas são duas cenas que todos podem ver: o corre-corre das praças e das ruas, e a gradação dos que comem o defunto. Vieira não nomeia ninguém (terceira opção) nem conta peixes (quarta): a prova é o comportamento visível de uma cidade inteira, que cada ouvinte reconhece. A confissão (quinta opção) não existe no texto.","pista":"","g":8},{"t":"posicao","rot":"Escolhe uma posição","cena":"Diz em voz alta a tua posição e uma passagem que a sustente.","p":"Depois do capítulo IV, quem é o réu do sermão?","opcoes":[{"rotulo":"Os peixes: é a eles que Vieira fala, chama e repreende","comentario":"Permite ver a forma do sermão: vocativos, ordens e repreensões dirigidas aos peixes: «Olhai, peixes». Deixa de fora o espelho de Agostinho e a ordem de olhar para a cidade, que tiram o processo do mar."},{"rotulo":"Os homens da cidade: os peixes são só o espelho","comentario":"Permite ver o alvo da alegoria e a ironia de «Nunca pior auditório». Deixa de fora uma coisa: Vieira nunca nomeia ninguém, acusa cargos, ofícios e uma cidade inteira, não pessoas, e essa escolha tem um preço."},{"rotulo":"Os dois, à vez: Vieira muda de réu quando lhe convém","comentario":"Permite ver o mecanismo: cada vício é provado nos peixes e aplicado aos homens. Falta dizer qual dos dois pode responder à acusação e qual é que se pode emendar."}],"g":9},{"t":"ler","rot":"Ato 3","titulo":"Acusados com nome","html":"<p>No capítulo V, Vieira desce «ao particular» e acusa peixes pelo nome: roncadores, pegadores, voadores, polvo. Para cada um há um traço observado e um vício humano. Lê o pegador: repara em como a acusação passa do peixe a um cargo.</p><blockquote class=\"cit\"><p>[…] sendo pequenos, não só se chegam a outros maiores, mas de tal sorte se lhes pegam aos costados, que nunca os desferram.</p><p>[…] não parte vice-rei ou governador para as conquistas, que não vá rodeado de pegadores […].</p></blockquote><p class=\"fonte-x\">Padre António Vieira, <i>Sermão de Santo António aos Peixes</i>, cap. V, os pegadores. 1654; digitalização Luso Livros, com ortografia atualizada</p>","g":10},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<span class=\"respira\" aria-hidden=\"true\"></span><p class=\"q-pensa\">«não parte vice-rei ou governador para as conquistas, que não vá rodeado de pegadores»: nesta frase, ainda há alegoria?</p><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":11},{"t":"escolha","rot":"A máscara cai","p":"Em «não parte vice-rei ou governador para as conquistas, que não vá rodeado de pegadores», o que acontece à alegoria?","o":["Vieira aplica o nome do peixe aos homens: a acusação sai do mar e nomeia um cargo","Vieira descreve peixes que acompanham os navios dos governadores","Vieira louva os governadores por protegerem os peixes pequenos","Vieira pede desculpa aos pegadores pela comparação"],"c":0,"f":"«Pegadores» passa a designar os homens que rodeiam o vice-rei e o governador: o traço do peixe, pegar-se ao grande e nunca o largar, serve de prova contra quem vive à custa do poder. A alegoria não desaparece, mas aqui deixa de esconder o réu. A segunda opção lê à letra o que é figura; as outras duas invertem o sentido da repreensão.","g":12},{"t":"ler","rot":"O excerto","titulo":"O polvo","html":"<p>Lê agora o acusado mais grave do capítulo V. Conta as vezes que Vieira diz «parece» antes de dizer o que o polvo faz.</p><blockquote class=\"cit\"><p>O Polvo, com aquele seu capelo na cabeça, parece um monge; com aqueles seus raios estendidos, parece uma estrela; como não tem osso nem espinha, parece a mesma brandura, a mesma mansidão. E debaixo desta aparência tão modesta, ou desta hipocrisia tão santa, testemunham constantemente os dois grandes Doutores da Igreja latina e grega, que o dito polvo é o maior traidor do mar. Consiste esta traição do polvo primeiramente em se vestir ou pintar das mesmas cores de todas aquelas cores a que está pegado. […] Se está nos limos, faz-se verde; se está na areia, faz-se branco; se está no lodo, faz-se pardo; e se está nalguma pedra, como mais ordinariamente costuma estar, faz-se da cor da mesma pedra. E daqui que sucede? Sucede que o outro peixe, inocente da traição, vai passando desacautelado, e o salteador, que está de emboscada dentro do seu próprio engano, lança-lhe os braços de repente, e fá-lo prisioneiro.</p></blockquote><p class=\"fonte-x\">Padre António Vieira, <i>Sermão de Santo António aos Peixes</i>, Cap. V, três peixes. 1654; digitalização Luso Livros, com ortografia atualizada</p>","g":13},{"t":"sublinhar","p":"Toca nas duas palavras que nomeiam o polvo pelo que faz, e não pelo que parece.","frase":"e o salteador, que está de emboscada dentro do seu próprio engano, lança-lhe os braços de repente, e fá-lo prisioneiro.","certas":[2,6],"f":"«salteador» e «emboscada»: depois de três «parece» (monge, estrela, mansidão), a sentença chega nos nomes da ação. A prova contra o polvo não é a aparência, é o gesto: os braços de repente. É assim que Vieira acusa: primeiro o que se vê, depois o que se faz.","g":14},{"t":"emparelhar","p":"Liga cada acusado à prova que Vieira apresenta contra ele.","pares":[["Roncadores","pequenos, e roncam; o espadarte, que tem espada, não ronca"],["Pegadores","pegam-se ao grande e nunca o largam; ele sustenta-lhes o peso e a fome"],["Voadores","querem ser aves; tocam na vela e caem; a isca é o vento"],["Polvo","parece monge e estrela; muda de cor e lança os braços de repente"]],"f":"Cada acusação tem um traço observável e uma consequência: o barulho do pequeno, o peso do parasita, a queda do presunçoso, a emboscada do que parece manso. Sem a passagem, o nome do vício é só um rótulo; com ela, é uma prova.","g":15},{"t":"ordenar","p":"Põe por ordem os passos de uma acusação de Vieira: a ordem lógica, não a ordem das frases.","passos":["Chama o peixe pelo nome e descreve o que se vê nele","Mostra o que o peixe faz, com a consequência para os outros","Dá nome ao vício que esse comportamento figura","Manda olhar para os homens em que o mesmo se vê"],"f":"Primeiro o traço visível, depois a ação e o dano, depois o nome do vício, no fim os homens. É a ordem de um processo: observação, prova, qualificação do crime, identificação do réu. Nas frases, Vieira troca-a quando quer (nos pegadores chega aos homens logo; no polvo diz «traidor» antes de mostrar a emboscada), mas a prova é sempre o traço e a ação: sem eles, o nome do vício não acusa ninguém.","g":16},{"t":"ler","rot":"Ato 4","titulo":"A melhor objeção","html":"<p>Imagina um ouvinte de São Luís que responde ao sermão: «O padre falou de peixes. Se eu me reconheci, o problema é meu. Ninguém me acusou de nada, e eu não posso defender-me de uma acusação que não foi feita.» A objeção é séria. Um réu que não é nomeado não pode responder; e um acusador que fala por figuras pode sempre dizer que falava de peixes.</p><p>Há uma segunda objeção, mais dura: três dias depois, Vieira embarca para Lisboa. O acusador acusa e parte. Lê o que o próprio sermão responde à primeira, na peroração.</p><blockquote class=\"cit\"><p>Oh que boa doutrina era esta para a terra, se eu não pregara para o mar!</p></blockquote><p class=\"fonte-x\">Padre António Vieira, <i>Sermão de Santo António aos Peixes</i>, Ler, Texto A. 1654; digitalização Luso Livros, com ortografia atualizada</p>","g":17},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<span class=\"respira\" aria-hidden=\"true\"></span><p class=\"q-pensa\">«se eu não pregara para o mar»: Vieira lamenta-se, confessa ou ironiza? O que ganha ao dizer isto em voz alta diante da cidade?</p><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":18},{"t":"escolha","rot":"A confissão","p":"«Oh que boa doutrina era esta para a terra, se eu não pregara para o mar!» Que faz esta frase à objeção do ouvinte («ninguém me acusou»)?","o":["Desmonta-a: Vieira diz à cidade que a doutrina era para ela, e deixa de haver dúvida sobre o réu","Confirma-a: Vieira admite que a doutrina se perdeu no mar","Ignora-a: a frase fala só da qualidade da doutrina","Reforça-a: Vieira diz que nunca quis falar aos homens"],"c":0,"f":"A frase é irónica: finge lamentar que a doutrina se desperdice no mar, e com isso diz à terra que era para ela. O ouvinte que se reconheceu já não pode dizer que ninguém o acusou. A segunda opção lê o lamento à letra; a terceira ignora o «para a terra»; a quarta é o contrário do que a frase faz.","g":19},{"t":"vf","p":"Dizer que o sermão fala dos homens e não dos peixes é uma interpretação que o próprio texto sustenta.","v":true,"f":"Verdadeiro. Não é uma opinião: há passagens que o provam, a ordem de olhar «para a cidade», a frase sobre vice-reis e governadores, a peroração com o seu «para a terra». Uma interpretação sustentada distingue-se de uma opinião por isto: tem prova localizada no texto.","g":20},{"t":"posicao","rot":"Escolhe uma posição","cena":"Um colega diz: «É fácil acusar uma cidade e ir-se embora.»","p":"O acusador acusa e, três dias depois, embarca. Isso enfraquece o sermão?","opcoes":[{"rotulo":"Enfraquece: quem acusa devia ficar para responder","comentario":"Permite ver o que falta a uma acusação sem contraditório. Deixa de fora o destino da viagem: Vieira vai a Lisboa defender os indígenas, ou seja, levar a mesma causa a quem pode decidir."},{"rotulo":"Não enfraquece: a viagem é a continuação da acusação","comentario":"Permite ver o sermão como primeiro passo de uma ação que continua em Lisboa. Deixa de fora o ouvinte de São Luís, que fica sem ninguém com quem discutir o que ouviu."},{"rotulo":"Depende: o sermão vale pelo que prova, não por quem fica","comentario":"Permite separar o argumento da pessoa que o diz. Deixa de fora uma dimensão do próprio sermão: Vieira põe em causa o pregador e não só a doutrina, como vais ver a seguir."}],"g":21},{"t":"ler","rot":"Ato 5","titulo":"O acusador senta-se no banco","html":"<p>No fim do sermão, Vieira faz uma coisa que nenhum acusador faz: compara-se com os réus e perde. Lê devagar: quem fala, quem ofende a Deus, e quem cumpre o fim para que foi criado.</p><blockquote class=\"cit\"><p>Ah peixes, quantas invejas vos tenho a essa natural irregularidade! Quanto melhor me fora não tomar a Deus nas mãos, que tomá-lo tão indignamente! Em tudo o que vos excedo, peixes, vos reconheço muitas vantagens. A vossa bruteza é melhor que a minha razão e o vosso instinto melhor que o meu arbítrio. Eu falo, mas vós não ofendeis a Deus com as palavras; eu lembro-me, mas vós não ofendeis a Deus com a memória; eu discorro, mas vós não ofendeis a Deus com o entendimento; eu quero, mas vós não ofendeis a Deus com a vontade. Vós fostes criados por Deus, para servir ao homem, e conseguis o fim para que fostes criados; a mim criou-me para o servir a Ele, e eu não consigo o fim para que me criou.</p></blockquote><p class=\"fonte-x\">Padre António Vieira, <i>Sermão de Santo António aos Peixes</i>, Cap. VI, a peroração. 1654; digitalização Luso Livros, com ortografia atualizada</p>","g":22},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<span class=\"respira\" aria-hidden=\"true\"></span><p class=\"q-pensa\">«A vossa bruteza é melhor que a minha razão […]». Se o pregador é pior do que os peixes, quem fica no banco dos réus no fim do sermão?</p><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":23},{"t":"escolha","rot":"A sentença","p":"Na peroração, Vieira diz que os peixes conseguem «o fim para que fostes criados» e que ele não consegue o seu. Que faz isto ao julgamento?","o":["Inverte-o: o pregador, que tem palavra, memória, entendimento e vontade, é quem mais pode ofender; os peixes ficam absolvidos","Encerra-o sem sentença: Vieira muda de assunto","Agrava-o para os peixes: são brutos e não têm razão","Absolve toda a gente: ninguém ofende a Deus"],"c":0,"f":"Cada «eu» tem uma faculdade (falo, lembro-me, discorro, quero) e cada «vós» tem a mesma ausência de culpa. Quem pode mais, deve mais: o homem, e o pregador em primeiro lugar. A terceira opção lê «bruteza» como insulto, e no texto é vantagem. A quarta esquece que Vieira se acusa a si; a segunda não vê que esta é a sentença.","g":24},{"t":"sublinhar","p":"Toca nas duas palavras que Vieira reconhece como melhores nos peixes do que nele.","frase":"A vossa bruteza é melhor que a minha razão e o vosso instinto melhor que o meu arbítrio.","certas":[2,12],"f":"«bruteza» e «instinto»: o que nos peixes parecia inferioridade é o que os livra da culpa. A razão e o arbítrio, o que o homem tem a mais, são o que o faz responsável. O réu, no fim, é quem pode escolher.","g":25},{"t":"ler","rot":"O caso ao contrário","titulo":"E se o espelho fosse hoje","html":"<p>Imagina que um colega faz uma apresentação sobre os pegadores de Vieira e descreve, sem nomes, um comportamento que toda a turma reconhece numa pessoa concreta. No fim diz: «Eu falava de peixes.» A sala ri. Faz o que Vieira fez?</p>","g":26},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<span class=\"respira\" aria-hidden=\"true\"></span><p class=\"q-pensa\">O que distingue uma alegoria que acusa um vício de uma alegoria que serve para apontar uma pessoa sem a nomear?</p><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":27},{"t":"posicoes","rot":"Quem sabe o quê","cena":"","p":"No caso do colega, abre as três posições e compara.","papeis":[{"rotulo":"O colega que apresenta","texto":"Sabe de quem fala e esconde-se na figura. Pode dizer que falava de peixes, como o ouvinte de São Luís podia dizer que ninguém o acusou."},{"rotulo":"A pessoa reconhecida","texto":"Não foi nomeada e não se pode defender de uma acusação que não foi feita. É o réu sem processo: a objeção do Ato 4, agora do lado de quem a sofre."},{"rotulo":"Vieira, se estivesse na sala","texto":"Acusou uma cidade e um vício, não uma pessoa; nomeou cargos, não nomes; e no fim sentou-se no banco com os réus. Falta ao colega o último passo: incluir-se."}],"fb":"A comparação mostra onde está a diferença: não na alegoria, que é a mesma, mas no alvo e no acusador. Vieira acusa um comportamento que qualquer um pode reconhecer em si, e acusa-se primeiro. Uma figura usada para apontar uma pessoa sem a nomear tira-lhe a defesa e poupa quem acusa: é o contrário da peroração.","g":28},{"t":"escolha","rot":"A pergunta central","p":"Se o sermão fosse um julgamento, quem seria o réu?","o":["Os peixes: é a eles que o sermão fala do princípio ao fim","Os homens da cidade, e no fim o próprio pregador, que se acusa com eles","Só os colonos que escravizavam os indígenas","Santo Agostinho, que inventou a comparação"],"c":1,"f":"Os peixes são o espelho e os absolvidos; os homens de São Luís são o réu que a alegoria aponta e a peroração nomeia («para a terra»); e o pregador senta-se no banco no fim, com a razão e o arbítrio que os peixes não têm. A terceira opção restringe o que o texto alarga a uma cidade inteira, «para a cidade é que haveis de olhar», «muito mais se comem os brancos»; a quarta confunde a testemunha com o réu.","g":29},{"t":"ler","rot":"Para levar","escuro":true,"titulo":"O que fica","html":"<p class=\"levar\">Vieira acusa os peixes para que a cidade se reconheça, e no fim senta-se no banco com os réus: quem pode escolher é quem responde.</p><p>Uma alegoria que acusa um vício inclui quem a diz; uma que aponta uma pessoa sem a nomear só esconde quem acusa.</p><p>A pergunta de onde partiste: Se o sermão fosse um julgamento, quem seria o réu? Responde-lhe agora em voz alta, numa frase, a alguém.</p>","g":30}],chave:"epi-pt-longos-m4-sermao-tribunal",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/pt/m4/",percursoRotulo:"Percurso do módulo",voltarRotulo:"Voltar ao percurso do módulo",depois:"<div class=\"c\"><p class=\"rot\">Pensaste</p><p>Vieira acusa os peixes para que a cidade se reconheça, e no fim senta-se no banco com os réus: quem pode escolher é quem responde.</p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/m4/#m4-sermao-tribunal\">Voltar ao percurso do módulo</a>. O outro exercício longo: <a href=\"https://pedrohfernandes-klk.github.io/pt/m4/m4-frei-luis-quem-sabia/\">Quem sabia, e quando</a>.</p></div>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["m4-sermao-tribunal"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
