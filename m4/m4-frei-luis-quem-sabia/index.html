<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Quem sabia, e quando · Português · Módulo 4</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet"><style>:root{--tinta:#000;--papel:#fff;--papel2:#faf8f2;--suave:#444;--fundo:#f3f2ee;--mostarda:#d9a520;--vermelho:#c8232c}@media (prefers-color-scheme:dark){:root{--tinta:#ecebe5;--papel:#121210;--papel2:#1a1a17;--suave:#b3b1aa;--fundo:#1d1d1a;--mostarda:#e0b23a;--vermelho:#e4555c}}*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.5 Arial,Helvetica,sans-serif}

.casca-folha{position:absolute;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.7,.2,1);background:var(--papel,#fff);color:var(--tinta,#000);box-shadow:0 -1px 0 rgba(0,0,0,.18),0 -12px 30px rgba(0,0,0,.08)}

.casca-menu .c-menu-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px}.casca-menu .c-menu-cab p{font:700 .74rem/1.35 Arial;letter-spacing:.1em;text-transform:uppercase;color:var(--suave,#444);margin:0}

.casca-menu nav a::after{content:"→";margin-left:auto;font-weight:400}

.casca-video{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}.casca-video .cx{background:#111;color:#f2f0ea;width:100%;max-width:420px;max-height:96vh;max-height:96dvh;display:flex;flex-direction:column;gap:8px;padding:12px;box-sizing:border-box}.casca-video .tt{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 .8rem Arial;letter-spacing:.1em;text-transform:uppercase;color:#d9a520}.casca-video video{width:100%;max-height:72vh;max-height:72dvh;background:#000;display:block}.casca-video .rodape-como{display:flex;justify-content:space-between;align-items:center;gap:10px}.casca-video button,.casca-video a{display:inline-flex;align-items:center;font:700 1rem Arial;color:#f2f0ea;background:none;border:0;min-height:44px;padding:0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

var K="epi-pt-longos";EPIJogo.montar({casca:CASCA,el:document.getElementById("baralho"),marca:"Caso",titulo:"Quem sabia, e quando",itens:[{"t":"ler","rot":"Abre","titulo":"Quem sabia, e quando","html":"<p class=\"etq-m\">Módulo 4 · Pensar devagar · cerca de 25 min</p><p class=\"abre\">Em <i>Frei Luís de Sousa</i>, cada cena distribui a verdade de maneira desigual.</p><p class=\"pergunta-c\">Se todos tivessem dito tudo o que sabiam no ato I, a tragédia teria sido evitada?</p><p>Uma casa, três atos e uma pergunta em cada cena: quem sabe o quê neste momento? Vais seguir a informação como se segue um objeto em palco: quem a tem, quem a esconde, quem a recebe e o que faz com ela.</p><p>No fim decides se a tragédia é um problema de informação (alguém calou o que devia dizer) ou um problema de dever (todos souberam, e não havia nada a fazer).</p><p class=\"nota-pensa\">Não há nada para escrever. Há perguntas para decidir em silêncio antes de ver as opções, posições para justificar em voz alta e explicações que só aparecem depois de escolheres. Leva o tempo que precisares.</p>","g":0},{"t":"ler","rot":"Ato 1","titulo":"Uma carta com três palavras","html":"<p>Madalena ficou viúva aos dezassete anos, quando D. João de Portugal desapareceu em Alcácer Quibir. Procurou-o durante sete anos. Casou depois com Manuel de Sousa Coutinho; da batalha até hoje passaram vinte e um anos, sete de buscas e catorze de casamento. Telmo, o velho escudeiro, continua a duvidar. Lê o que ele guarda e o que ela responde.</p><blockquote class=\"cit\"><p>MADALENA — […] Depois que fiquei só, depois daquela funesta jornada de África que me deixou viúva, órfã e sem ninguém… sem ninguém, e numa idade… com dezassete anos! — em vós, Telmo, em vós só, achei o carinho e proteção, o amparo que eu precisava. […] D. João ficou naquela batalha com seu pai, com a flor da nossa gente. (Sinal de impaciência em Telmo) Sabeis como chorei a sua perda, como respeitei a sua memória, como durante sete anos, incrédula a tantas provas e testemunhos de sua morte, o fiz procurar por essas costas de Berberia, por todas as sejanas de Fez e Marrocos, por todos quantos aduares de Alarves aí houve… […] Tudo foi inútil; e a ninguém mais ficou resto de dúvida…</p><p>TELMO — Senão a mim.</p><p>MADALENA — Dúvida de fiel servidor, esperança de leal amigo, meu bom Telmo! que diz com vosso coração, mas que tem atormentado o meu… — E então sem nenhum fundamento, sem o mais leve indício… Pois dizei-me em consciência, dizei-mo de uma vez, claro e desenganado: a que se apega esta vossa credulidade de sete… e hoje mais catorze… vinte e um anos?</p><p>TELMO, gravemente — Às palavras, às formais palavras daquela carta escrita na própria madrugada do dia da batalha, e entregue a Frei Jorge que vo-la trouxe. — «Vivo ou morto» — rezava ela — vivo ou morto… Não me esqueceu uma letra daquelas palavras; e eu sei que homem era meu amo para as escrever em vão: — «Vivo ou morto, Madalena, hei de ver-vos pelo menos ainda uma vez neste mundo.» — Não era assim que dizia?</p><p>MADALENA, aterrada — Era.</p></blockquote><p class=\"fonte-x\">Almeida Garrett, <i>Frei Luís de Sousa</i>, Ato I, cena II, «Vivo ou morto». 1844; transcrição do Project Gutenberg n.º 17591; as fichas atualizam a ortografia</p>","g":1},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<p class=\"q-pensa\">Telmo diz «Senão a mim». Madalena, aterrada, responde «Era». Quem dos dois sabe mais, e quem teme mais?</p><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":2},{"t":"escolha","rot":"O que se sabe","p":"No ato I, o que sabe Madalena sobre D. João, de certeza?","o":["Que nunca apareceu, apesar de sete anos de buscas; da morte só tem «provas e testemunhos», não a certeza","Que morreu na batalha, porque o viram cair","Que está vivo e cativo em Berberia","Que voltou e vive escondido em Almada"],"c":0,"f":"«incrédula a tantas provas e testemunhos de sua morte, o fiz procurar»: Madalena tem provas da morte, mas nunca um corpo, e a carta «vivo ou morto» continua a fazer-lhe medo. Ninguém o viu cair (segunda opção). As duas últimas usam o que só se revela no ato II para explicar o que ela sabe antes, e esse é o erro a evitar.","g":3},{"t":"vf","p":"Telmo tem uma prova de que D. João está vivo.","v":false,"f":"Falso. Telmo tem «às formais palavras daquela carta» e a confiança no amo: «eu sei que homem era meu amo para as escrever em vão». É uma esperança apoiada numa promessa, não uma prova. A dúvida de Telmo e a quase certeza de Madalena assentam ambas em papéis, não em factos.","g":4},{"t":"ler","rot":"O que ela esconde","titulo":"Um medo guardado","html":"<p>Na primeira cena, antes de Telmo entrar, Madalena está só, com um livro no regaço. Lê o que diz de si, e repara em quem é o «ele».</p><blockquote class=\"cit\"><p>Com paz e alegria d'alma… um engano, um engano de poucos instantes que seja… deve de ser a felicidade suprema neste mundo. — E que importa que o não deixe durar muito a fortuna? Viveu-se, pode-se morrer. Mas eu!… (pausa) Oh! que o não saiba ele ao menos, que não suspeite o estado em que eu vivo… este medo, estes contínuos terrores que ainda me não deixaram gozar um só momento de toda a imensa felicidade que me dava o seu amor.</p></blockquote><p class=\"fonte-x\">Almeida Garrett, <i>Frei Luís de Sousa</i>, ato I, cena I. 1844; transcrição do Project Gutenberg n.º 17591; as fichas atualizam a ortografia</p>","g":5},{"t":"sublinhar","p":"Toca nas duas palavras que dizem o que Madalena esconde de Manuel.","frase":"Oh! que o não saiba ele ao menos, que não suspeite o estado em que eu vivo… este medo, estes contínuos terrores","certas":[18,21],"f":"«este medo, estes contínuos terrores»: na cena I, Madalena quer que Manuel não suspeite «o estado em que eu vivo»; na cena VIII acaba por lhe dizer o medo. O que lhe fica escondido é a razão dele: a carta «vivo ou morto» e a dúvida de Telmo. O que Manuel não sabe não é que D. João vive (ninguém o sabe); é que há uma promessa escrita e um escudeiro que ainda espera.","g":6},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<p class=\"q-pensa\">Manuel diz a Madalena, no ato I, que «não há espectros que nos possam aparecer senão os das más ações que fazemos». Para ele, Madalena fez alguma má ação? E para ela?</p><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":7},{"t":"posicao","rot":"Escolhe uma posição","cena":"","p":"No ato I, Madalena devia ter dito a Manuel a razão do seu medo, a carta «vivo ou morto» e a dúvida de Telmo?","opcoes":[{"rotulo":"Sim: um casamento com uma razão de medo escondida já é uma meia-verdade","comentario":"Permite ver a tragédia como problema de informação: o que se cala cresce. Deixa de fora o que ela daria a Manuel se falasse: nenhum facto novo, só uma carta antiga e a esperança de um criado."},{"rotulo":"Não: não há facto nenhum para dizer, só uma promessa escrita e uma dúvida sem prova","comentario":"Permite ver que a informação de Madalena é vazia: provas da morte, uma carta de vinte e um anos. Deixa de fora que o medo ela acaba por dizer, na cena VIII; o que guarda sozinha é a razão dele."},{"rotulo":"Devia ter dito a Frei Jorge, que trouxe a carta e é quem pode julgar","comentario":"Permite ver que em cada cena há alguém a quem se pode falar e alguém a quem não. Deixa de fora que Jorge, no ato I, não ouve este medo: quem o ouve é Manuel, e responde-lhe que só as más ações têm espectros."}],"g":8},{"t":"ler","rot":"Ato 2","titulo":"Uma casa com retratos","html":"<p>Depois do incêndio, a família muda-se para o palácio que fora de D. João, em Almada. Nas paredes, retratos: D. Sebastião, Camões, D. João de Portugal. Maria, diante de um deles, pergunta a Telmo de quem é. Lê a resposta e o gesto.</p><blockquote class=\"cit\"><p>Oh! mas é verdade… vinde cá: (Leva-o diante dos três retratos que estão no fundo; e apontando para o de D. João) de quem é este retrato aqui, Telmo?</p><p>TELMO, olha, e vira a cara de repente — Esse é… há de ser… é um da família, destes senhores da casa de Vimioso que aqui estão tantos.</p><p>MARIA, ameaçando-o com o dedo — Tu não dizes a verdade, Telmo.</p><p>TELMO, quase ofendido — Eu nunca menti, senhora D. Maria de Noronha.</p><p>MARIA — Mas não diz a verdade toda o senhor Telmo Pais; que é quase o mesmo.</p></blockquote><p class=\"fonte-x\">Almeida Garrett, <i>Frei Luís de Sousa</i>, Ato II, cena I, o retrato. 1844; transcrição do Project Gutenberg n.º 17591; as fichas atualizam a ortografia</p>","g":9},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<p class=\"q-pensa\">Telmo «vira a cara de repente» e diz «há de ser». O que sabe Telmo, o que sabe Maria, e o que sabes tu, que vês o gesto?</p><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":10},{"t":"escolha","rot":"Omitir e mentir","p":"Na cena do retrato, que diferença há entre o que Telmo faz e o que Maria lhe chama?","o":["Telmo omite o nome; Maria chama a isso não dizer «a verdade toda», que é «quase o mesmo» que mentir","Telmo mente, e Maria perdoa-lhe a mentira","Telmo diz a verdade, e Maria não acredita","Telmo não sabe de quem é o retrato, e Maria sabe"],"c":0,"f":"«Eu nunca menti» é verdade: Telmo não afirma nada falso, desvia. Maria dá o nome certo ao gesto: omitir é quase mentir. A didascália, «vira a cara», diz ao público que ele sabe. A quarta opção inverte quem sabe; a terceira ignora o «há de ser»; a segunda chama mentira ao que Maria distingue de mentira.","g":11},{"t":"ler","rot":"O excerto","titulo":"O homem que se vê a um espelho","html":"<p>À noite chega um Romeiro, com um recado para D. Madalena. Frei Jorge pergunta-lhe se conhece o homem de quem fala. Lê as respostas do Romeiro e a didascália da última.</p><blockquote class=\"cit\"><p>Conheceis bem esse homem, romeiro: não é assim?</p><p>ROMEIRO — Como a mim mesmo.</p><p>JORGE — […] conhecê-lo-eis?</p><p>ROMEIRO — Como se me visse a mim mesmo num espelho.</p><p>JORGE — Procurai nestes retratos, e dizei-me se algum deles pode ser.</p><p>ROMEIRO, sem procurar, e apontando logo para o retrato de D. João — É aquele.</p></blockquote><p class=\"fonte-x\">Almeida Garrett, <i>Frei Luís de Sousa</i>, ato II, cena XIV (2/2). 1844; transcrição do Project Gutenberg n.º 17591; as fichas atualizam a ortografia</p>","g":12},{"t":"sublinhar","p":"Toca nas duas palavras da didascália que dizem que o Romeiro já sabia a resposta antes de olhar.","frase":"ROMEIRO, sem procurar, e apontando logo para o retrato de D. João","certas":[2,5],"f":"«sem procurar» e «logo»: a didascália dá ao público uma informação que nenhuma fala dá. Quem reconhece um rosto entre muitos sem o procurar conhece-o «Como se me visse a mim mesmo num espelho». O público sabe antes de Jorge perguntar «quem és tu?».","g":13},{"t":"ordenar","p":"Põe por ordem o que se fica a saber, nas cenas XIV e XV do ato II.","passos":["O Romeiro diz que traz o recado de um homem vivo, há vinte anos cativo","Madalena pergunta de que batalha, ouve «De Alcácer-Quibir» e fica espavorida","O Romeiro aponta «sem procurar» para o retrato de D. João: «É aquele»","Madalena grita pela filha, «perdidas, desonradas», e foge","Jorge pergunta «quem és tu?» e o Romeiro responde «Ninguém»"],"f":"A informação chega por degraus: um homem vivo, uma batalha, um retrato, um grito, uma palavra. Repara em quem está presente em cada degrau: Madalena foge antes do «Ninguém»; Maria não está na sala em nenhum deles. Cada personagem sai da cena com uma quantidade diferente de verdade.","g":14},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<p class=\"q-pensa\">O Romeiro aponta para o retrato e diz «Ninguém». Está a esconder quem é, ou a dizer o que é?</p><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":15},{"t":"escolha","rot":"Gesto e palavra","p":"Que faz o Romeiro quando diz «Ninguém» apontando para o retrato de D. João?","o":["O gesto diz quem foi; a palavra diz o que já é: um homem sem lugar, sem nome e sem casa","Esconde a identidade: não quer que saibam que é D. João","Nega ser o homem do retrato","Diz que o retrato é de um desconhecido"],"c":0,"f":"Gesto e palavra fazem coisas diferentes: o bordão identifica, a palavra interpreta. D. João não esconde quem foi (segunda opção): o retrato responde por ele. O que diz é que esse homem já não existe para esta casa. As duas últimas opções leem «Ninguém» como a negação de um facto, e é um juízo sobre o que resta dele.","g":16},{"t":"posicoes","rot":"Quem sabe o quê","cena":"O pano desce lentamente sobre Frei Jorge prostrado.","p":"Na cena XV, abre o que cada um sabe e compara.","papeis":[{"rotulo":"Frei Jorge","texto":"Perguntou e teve a resposta: sabe quem é o Romeiro. Cai prostrado diante da tribuna. É, com o Romeiro, quem sabe tudo, e não diz nada."},{"rotulo":"Madalena","texto":"Fugiu antes do «Ninguém», mas já tinha percebido: «perdidas, desonradas». Sabe o que a verdade faz antes de a ouvir confirmada."},{"rotulo":"Maria","texto":"Não está na sala. Não ouviu a batalha, não viu o bordão. No ato III dirá que «bem o sabia», por uma visão de todas as noites: suspeita, não informação."},{"rotulo":"O público","texto":"Viu o «sem procurar», ouviu o «Ninguém», viu Jorge cair. Sabe mais do que qualquer personagem, e não pode fazer nada."}],"fb":"A comparação mostra que a cena distribui a verdade de forma desigual, e que quem sabe mais (Jorge, o público) é quem menos pode agir. Saber, aqui, não dá poder: dá peso. É a primeira pista para a pergunta central: a tragédia não se resolve com mais informação.","g":17},{"t":"ler","rot":"Ato 3","titulo":"Quando já todos sabem","html":"<p>No ato III a informação está completa: D. João vive, o casamento não vale, Maria perde o nome. Manuel e Madalena vão tomar o hábito. Maria trava a cerimónia e pede uma coisa à mãe. Lê o pedido e o que lhe respondem.</p><blockquote class=\"cit\"><p>MARIA, separando-se com eles da outra gente, e trazendo-os para a boca da cena — Esperai: aqui não morre ninguém sem mim. Que quereis fazer? Que cerimónias são estas? Que Deus é esse que está nesse altar, e quer roubar o pai e a mãe a sua filha? — (Para os circunstantes) Vós quem sois, espectros fatais?… quereis-mos tirar dos meus braços?… Esta é a minha mãe, este é o meu pai… Que me importa a mim com o outro? Que morresse ou não, que esteja com os mortos ou com os vivos — que se fique na cova ou que ressuscite agora para me matar?… Mate-me, mate-me, se quer, mas deixe-me este pai, esta mãe, que são meus. — Não há mais do que vir ao meio de uma família e dizer: «Vós não sois marido e mulher?… e esta filha do vosso amor, esta filha criada ao colo de tantas meiguices, de tanta ternura, esta filha é…» — Mãe, mãe, eu bem o sabia… nunca to disse, mas sabia-o: tinha-mo dito aquele anjo terrível que me aparecia todas as noites para me não deixar dormir… aquele anjo que descia com uma espada de chamas na mão, e a atravessava entre mim e ti, que me arrancava dos teus braços quando eu adormecia neles… que me fazia chorar quando meu pai ia beijar-me no teu colo. — Mãe, mãe, tu não hás de morrer sem mim… Pai, dá cá um pano da tua mortalha… dá cá, eu quero morrer antes que ele venha: (encolhendo-se no hábito do pai) quero-me esconder aqui, antes que venha esse homem do outro mundo dizer-me na minha cara e na tua — aqui diante de toda esta gente: «Essa filha é a filha do crime e do pecado!…» Não sou; dize, meu pai, não sou… dize a essa gente toda, dize que não sou. (Vai para Madalena) Pobre mãe! tu não podes… coitada!… não tens ânimo… — nunca mentiste?… Pois mente agora para salvar a honra de tua filha, para que lhe não tirem o nome de seu pai.</p><p>MADALENA — Misericórdia, meu Deus!</p><p>MARIA — Não queres? Tu também não, pai? — Não querem. E eu hei de morrer assim… e ele vem aí…</p></blockquote><p class=\"fonte-x\">Almeida Garrett, <i>Frei Luís de Sousa</i>, Ato III, cena XI, Maria. 1844; transcrição do Project Gutenberg n.º 17591; as fichas atualizam a ortografia</p>","g":18},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<p class=\"q-pensa\">Maria pede à mãe que minta. No ato II condenava Telmo por não dizer a verdade toda. Mudou Maria, ou mudou o que está em jogo?</p><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":19},{"t":"escolha","rot":"O pedido","p":"Que pede Maria à mãe, e o que responde Madalena?","o":["Que minta diante de todos para lhe salvar o nome do pai; Madalena responde «Misericórdia, meu Deus!» e não mente","Que fuja com ela antes que o Romeiro chegue; Madalena aceita","Que diga a verdade toda; Madalena cala-se","Que entre no convento em seu lugar; Madalena recusa"],"c":0,"f":"«Pois mente agora para salvar a honra de tua filha, para que lhe não tirem o nome de seu pai.» A resposta não é uma recusa dita: é uma oração, e Maria lê-a como recusa: «Não querem.» A verdade toda (terceira opção) é o que Maria exigia no ato II; agora pede o contrário, porque agora a verdade custa-lhe o nome.","g":20},{"t":"vf","p":"No ato III, a catástrofe acontece porque ainda falta saber alguma coisa.","v":false,"f":"Falso. No ato III já não falta informação a ninguém: Maria sabe, Madalena sabe, Manuel sabe, o Romeiro sabe. O que falta não é uma verdade, é uma saída. Quando a informação está completa e a desgraça continua, o problema não era a informação.","g":21},{"t":"multi","rot":"Seleciona","cena":"","p":"Seleciona as duas razões que fazem da verdade, no ato III, uma coisa que ninguém pode usar.","opcoes":["A norma da época: se D. João vive, o casamento não vale e Maria é tida por ilegítima, diga-se o que se disser","Manuel e Madalena recusam mentir: a única saída que Maria propõe é a que eles não tomam","Maria não acredita que D. João esteja vivo","Telmo destruiu a carta «vivo ou morto»","O Romeiro foi-se embora e ninguém o pode encontrar"],"certas":[0,1],"fb":"A verdade é inútil por duas razões que se somam: uma regra que ninguém na peça pode mudar (a norma da época sobre o casamento e o nome) e uma escolha que ninguém quer fazer (mentir). As três últimas opções inventam factos que a peça não tem. Repara que a segunda razão é uma decisão: a tragédia tem regra e tem escolha.","pista":"","g":22},{"t":"ler","rot":"A objeção","titulo":"A melhor objeção","html":"<p>Um colega objeta: «A tragédia é um problema de escolhas, não de dever. Se o Romeiro não tivesse apontado para o retrato, ninguém sabia de nada: ele escolheu revelar-se. Madalena escolheu calar, durante catorze anos de casamento, a carta e a dúvida de Telmo. Cada um calou ou disse quando quis. Chamar-lhe dever é desculpar escolhas.»</p><p>A objeção tem força: há escolhas em toda a peça. Lê outra vez o recado do Romeiro e decide se ele escolheu revelar-se, ou se a verdade lhe saiu antes da vontade.</p><blockquote class=\"cit\"><p>Ide a D. Madalena de Vilhena, e dizei-lhe que um homem que muito bem lhe quis… aqui está vivo… por seu mal… e daqui não pode sair nem mandar-lhe novas suas de há vinte anos que o trouxeram cativo.</p></blockquote><p class=\"fonte-x\">Almeida Garrett, <i>Frei Luís de Sousa</i>, ato II, cena XIV, o recado do cativo. 1844; transcrição do Project Gutenberg n.º 17591; o exercício atualiza a ortografia</p>","g":23},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<p class=\"q-pensa\">«um homem que muito bem lhe quis… aqui está vivo… por seu mal…»: o Romeiro fala de si na terceira pessoa. Porquê?</p><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":24},{"t":"escolha","rot":"A terceira pessoa","p":"O recado do Romeiro fala de «um homem», na terceira pessoa. O que faz isso à objeção («ele escolheu revelar-se»)?","o":["Enfraquece-a: o Romeiro tenta dar a notícia sem se dar a si; é Jorge quem o leva aos retratos, e o reconhecimento sai-lhe «sem procurar»","Confirma-a: a terceira pessoa é uma maneira de se fazer interessante","Não muda nada: o recado e o gesto são a mesma coisa","Prova que o Romeiro mente: o homem do recado é outro"],"c":0,"f":"O recado separa a notícia (um homem vivo) de quem a traz. É Jorge quem pergunta «conhecê-lo-eis?» e manda procurar nos retratos. O Romeiro não procura: o rosto vem-lhe antes da vontade. A informação revela-se contra a intenção de quem a traz. Resta à objeção uma parte verdadeira: «por seu mal» é um juízo, e esse foi escolhido.","g":25},{"t":"posicao","rot":"Escolhe uma posição","cena":"","p":"Então, o que faz a tragédia: o que se calou, ou o que não se podia mudar?","opcoes":[{"rotulo":"O que se calou: Madalena, Telmo e o Romeiro escolheram o silêncio","comentario":"Permite ver as escolhas e dar-lhes responsabilidade; a peça mostra-as todas. Deixa de fora que nenhum dos três silêncios criou o facto: D. João vive, e isso não se calou nem se disse, aconteceu."},{"rotulo":"O que não se podia mudar: a regra que faz de uma verdade uma desgraça","comentario":"Permite ver porque é que, no ato III, saber tudo não serve de nada. Deixa de fora a última escolha, a de Manuel e Madalena, que recusam mentir e tomam o hábito: podiam ter escolhido de outra maneira."},{"rotulo":"As duas, e a ordem importa: primeiro o facto, depois a regra, no fim as escolhas","comentario":"Permite montar a tragédia como uma sequência e ver onde cada um entra. Deixa de fora o que Maria sente: para ela não há sequência, há um anjo com uma espada que a separa da mãe todas as noites."}],"g":26},{"t":"ler","rot":"O caso ao contrário","titulo":"O caso ao contrário","html":"<p>Imagina a peça virada: no ato I, Telmo mostra a carta a Manuel; Madalena conta-lhe de que tem medo e porquê; Maria ouve tudo. Toda a gente sabe o que há para saber. Chega o Romeiro, e tudo o que diz já era esperado. O que muda, e o que fica igual?</p>","g":27},{"t":"ler","rot":"Pensa primeiro","titulo":"Decide em silêncio","html":"<p class=\"q-pensa\">Com toda a informação dita no ato I, a casa de Almada ainda recebe o Romeiro. Há alguma cena que deixe de acontecer?</p><p class=\"nota-pensa\">Não escrevas. Decide na cabeça, ou diz a um colega em meia frase. Só depois viras o cartão.</p>","g":28},{"t":"escolha","rot":"A pergunta central","p":"Se todos tivessem dito tudo o que sabiam no ato I, a tragédia teria sido evitada?","o":["Não: no ato I ninguém sabia que D. João vivia; dizer tudo era dizer um medo, e o medo não muda a regra que a volta dele aciona","Sim: Manuel não teria casado se soubesse da carta","Sim: Maria não teria pedido a mentira se soubesse antes","Não, porque Telmo teria mentido de qualquer maneira"],"c":0,"f":"O que havia para dizer no ato I era uma carta antiga e um medo; o facto que destrói, D. João vivo, não estava em posse de ninguém. E quando chega, no ato II, a regra transforma-o em desgraça sem precisar de segredo nenhum. A segunda opção esquece que Manuel casou com uma viúva com provas da morte; a terceira esquece que Maria «bem o sabia» e isso não a salvou; a quarta inventa.","g":29},{"t":"vf","p":"Dizer que _Frei Luís de Sousa_ é uma tragédia feita de silêncios é uma interpretação com prova no texto: «vira a cara», «há de ser», «nunca to disse».","v":true,"f":"Verdadeiro. É uma interpretação, não um facto nem uma opinião: tem passagens localizadas que a sustentam. Mas repara no que acabaste de concluir: os silêncios adiam a desgraça, não a fazem. A interpretação é boa e é incompleta, e saber isso faz parte de a defender.","g":30},{"t":"ler","rot":"Para levar","escuro":true,"titulo":"O que fica","html":"<p class=\"levar\">A tragédia não é feita de segredos: é feita de uma verdade que, quando chega, ninguém pode usar.</p><p>Os silêncios adiam; a regra decide; a última escolha, a de não mentir, ainda foi deles.</p><p>A pergunta de onde partiste: Se todos tivessem dito tudo o que sabiam no ato I, a tragédia teria sido evitada? Responde-lhe agora em voz alta, numa frase, a alguém.</p>","g":31}],chave:"epi-pt-longos-m4-frei-luis-quem-sabia",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/pt/m4/",percursoRotulo:"Percurso do módulo",voltarRotulo:"Voltar ao percurso do módulo",depois:"<div class=\"c\"><p class=\"rot\">Pensaste</p><p>A tragédia não é feita de segredos: é feita de uma verdade que, quando chega, ninguém pode usar.</p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/pt/m4/#m4-frei-luis-quem-sabia\">Voltar ao percurso do módulo</a>. O outro exercício longo: <a href=\"https://pedrohfernandes-klk.github.io/pt/m4/m4-sermao-tribunal/\">O sermão posto em tribunal</a>.</p></div>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["m4-frei-luis-quem-sabia"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
