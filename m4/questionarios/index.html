"use strict";
var ID="M4", D=[{"t":"O Sermão: contexto e estrutura","q":[["Onde foi pregado o Sermão de Santo António aos Peixes?",["Lisboa","São Luís do Maranhão","Baía","Coimbra"],1,"São Luís do Maranhão, 13 de junho de 1654."],["Três dias depois, Vieira partiu para Lisboa para…",["ser nomeado bispo","pedir leis que protegessem os indígenas","fugir da Inquisição","pregar na corte"],1,"Pedir ao rei proteção para os indígenas."],["O tema do sermão é…",["«Vós sois o sal da terra»","«Amai-vos uns aos outros»","«No princípio era o Verbo»","«Bem-aventurados os pobres»"],0,"Vos estis sal terrae (Mateus 5, 13)."],["O capítulo I corresponde ao…",["exórdio","louvor em particular","repreensão em geral","peroração"],0,"Exórdio: introdução e apresentação do tema."],["O capítulo VI corresponde à…",["confirmação","peroração","narração","exposição"],1,"Peroração: conclusão."],["Porque prega Vieira aos peixes?",["Porque os homens não o ouvem","Porque gosta de animais","Porque está numa praia por acaso","Porque os peixes são pecadores"],0,"Imita Santo António: «Já que me não querem ouvir os homens, ouçam-me os peixes.»"]]},{"t":"Os peixes e o que representam","q":[["Qual destes peixes é LOUVADO?",["O polvo","A rémora","Os roncadores","Os pegadores"],1,"Capítulo III: Tobias, rémora, torpedo, quatro-olhos."],["Qual destes peixes é REPREENDIDO?",["O quatro-olhos","O torpedo","Os voadores","O peixe de Tobias"],2,"Capítulo V: roncadores, pegadores, voadores, polvo."],["O peixe de Tobias é louvado porque o seu fel e o seu coração…",["alimentam os pobres","curam a cegueira e afastam o demónio","servem de isco","anunciam tempestades"],1,"Fel: cura a cegueira; coração: afasta o demónio."],["Os roncadores representam…",["a soberba e a vaidade","a humildade","a vigilância","a generosidade"],0,"Muito barulho, pouca coisa: arrogância."],["Os pegadores representam…",["os que vivem à custa dos outros","os trabalhadores","os pregadores","os sábios"],0,"Parasitismo e oportunismo."],["O polvo representa…",["a traição e a dissimulação","a sabedoria","a coragem","a pobreza"],0,"Muda de cor e ataca de emboscada."],["O quatro-olhos simboliza…",["a vigilância: olhar para cima e para baixo","a cegueira","a gula","a ambição"],0,"Ver o céu e o inferno: prudência."],["A alegoria dos peixes serve para criticar…",["os animais marinhos","os colonos e a sociedade","Santo António","os indígenas"],1,"Os peixes representam comportamentos humanos."]]},{"t":"Atos de fala","q":[["«Prometo entregar o trabalho amanhã.»",["assertivo","compromissivo","diretivo","expressivo"],1,"Quem fala compromete-se."],["«Fecha a janela, por favor.»",["diretivo","declarativo","assertivo","compromissivo"],0,"Pede ao outro que faça algo."],["«Obrigado pela ajuda.»",["expressivo","assertivo","diretivo","declarativo"],0,"Exprime um sentimento."],["«A sessão está aberta.» (dito pelo presidente)",["declarativo","compromissivo","expressivo","diretivo"],0,"Muda uma situação pelo facto de ser dito."],["«Os peixes ouvem e não falam.»",["assertivo","diretivo","compromissivo","expressivo"],0,"Afirma algo como verdadeiro."],["«Ouçam-me os peixes.»",["assertivo","diretivo","declarativo","expressivo"],1,"Ordem ou pedido."]]},{"t":"Deíticos e referentes","q":[["Em «Eu vim hoje», «eu» é um deítico…",["pessoal","espacial","temporal","social"],0,"Refere quem fala."],["Em «Senta-te aqui», «aqui» é um deítico…",["temporal","espacial","pessoal","textual"],1,"Depende do lugar de quem fala."],["Em «Amanhã há teste», «amanhã» é um deítico…",["espacial","pessoal","temporal","social"],2,"Depende do momento em que se fala."],["No Sermão, «a nossa [terra]» refere-se…",["a Portugal inteiro","à terra onde estão o pregador e os ouvintes","ao mar","ao céu"],1,"Maranhão: lugar da enunciação."],["Em Frei Luís de Sousa, o Romeiro responde «Ninguém!». O que revela?",["Que perdeu a identidade para os outros","Que não quer falar","Que é um estrangeiro","Que está a brincar"],0,"D. João de Portugal regressa sem lugar nem nome."],["Um referente é…",["a entidade do mundo a que uma expressão se refere","um tipo de verso","um sinal de pontuação","o autor do texto"],0,"Aquilo de que se fala."]]},{"t":"Coesão e coerência","q":[["«A rapariga chegou. Ela vinha cansada.» «Ela» é um caso de…",["anáfora","catáfora","elipse","deixis"],0,"Retoma um referente já mencionado."],["Qual destes conectores tem valor conclusivo?",["contudo","portanto","embora","porque"],1,"portanto = conclusão."],["Qual tem valor de oposição?",["além disso","no entanto","assim","por exemplo"],1,"no entanto = oposição."],["Substituir «Vieira» por «o pregador» é coesão…",["lexical","temporal","frásica","interfrásica"],0,"Coesão lexical (sinónimo ou expressão equivalente)."],["Um texto coerente…",["tem sentido e não se contradiz","não tem vírgulas","é sempre curto","tem rimas"],0,"Coerência: unidade de sentido."],["«Chegou cedo. Mas saiu tarde.» O «Mas» assegura coesão…",["interfrásica","referencial","lexical","temporal"],0,"Conectores: coesão interfrásica."]]},{"t":"Frei Luís de Sousa","q":[["Quem escreveu Frei Luís de Sousa?",["Camilo Castelo Branco","Almeida Garrett","Alexandre Herculano","Eça de Queirós"],1,"Almeida Garrett."],["D. João de Portugal desapareceu na batalha de…",["Aljubarrota","Alcácer-Quibir","Ourique","Toro"],1,"Alcácer-Quibir, 1578."],["Madalena casou, em segundas núpcias, com…",["Telmo Pais","Manuel de Sousa Coutinho","D. Sebastião","Frei Jorge"],1,"Manuel de Sousa Coutinho."],["Telmo mantém-se fiel…",["a Manuel de Sousa","à memória de D. João de Portugal","ao rei de Espanha","a Maria"],1,"Telmo, o velho aio, crê no regresso de D. João."],["O regresso do Romeiro provoca…",["a festa da família","a catástrofe: o casamento deixa de ser válido","a cura de Maria","a guerra"],1,"Madalena e Manuel separam-se; Maria morre."],["A crença no regresso do rei desaparecido chama-se…",["sebastianismo","iluminismo","romantismo","classicismo"],0,"Esperança no regresso de D. Sebastião."]]}], CHAVE="epi-pt-quiz-"+ID, $=function(s){return document.querySelector(s)}, atual=-1;
var abertos={}; try{abertos=JSON.parse(localStorage.getItem(CHAVE)||"{}")}catch(e){}

estados();
})();
