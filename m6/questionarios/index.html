tiva","olfativa","tátil","gustativa"],0,"Ruído, agitação."],["«a maresia» remete para uma sensação…",["olfativa","visual","auditiva","tátil"],0,"Cheiro do mar."],["A sinestesia é…",["a mistura de sensações diferentes","uma rima pobre","uma pergunta retórica","um exagero"],0,"Ex.: «cor que se ouve»."],["A hipálage é…",["atribuir a um nome uma qualidade que pertence a outro","repetir um som","comparar com «como»","enumerar"],0,"Ex.: «o cigarro pensativo»."],["A enumeração é…",["uma sequência de elementos","uma oposição","um diminutivo","uma rima"],0,"Ex.: «as sombras, o bulício, o Tejo, a maresia»."],["O realismo em poesia valoriza…",["a observação concreta do quotidiano","o sonho e a fantasia apenas","os deuses antigos","as batalhas"],0,"Poesia do real."]]},{"t":"Orações","q":[["«Há tal melancolia que me apetece sofrer.» «que me apetece sofrer» é…",["subordinada adverbial consecutiva","relativa","causal","final"],0,"«tal… que»."],["«Quando anoitece, a cidade muda.»",["temporal","causal","condicional","final"],0,"«quando»."],["«Embora cansado, o poeta continuou.»",["concessiva","causal","comparativa","consecutiva"],0,"«embora»."],["«A rua que atravessei estava escura.» «que atravessei» é…",["relativa restritiva","completiva","causal","coordenada"],0,"Restringe «a rua»."],["«Sei que a cidade dorme.» «que a cidade dorme» é…",["substantiva completiva","relativa","temporal","final"],0,"Complemento direto de «sei»."],["«Como estava frio, fechou a janela.»",["causal","comparativa","temporal","final"],0,"«como» = porque."]]},{"t":"Realismo e Geração de 70","q":[["A Geração de 70 inclui…",["Antero, Eça e outros intelectuais","Camões e Vieira","Pessoa e Sá-Carneiro","Gil Vicente e Fernão Lopes"],0,"Renovação cultural."],["O Realismo propõe…",["observar e criticar a sociedade","fugir para o sonho","imitar os trovadores","celebrar reis"],0,"Arte como análise do real."],["O Naturalismo acrescenta a ideia de que…",["o meio e a hereditariedade determinam as pessoas","tudo é sonho","Deus decide tudo","o passado é perfeito"],0,"Determinismo."],["As Conferências do Casino foram…",["proibidas pelo governo","um sucesso sem polémica","no século XVI","em Paris"],0,"Foram interrompidas por ordem do governo."],["O ultrarromantismo era criticado por…",["sentimentalismo excessivo e artificial","ser demasiado científico","falar de política","usar prosa"],0,"Excesso de sentimento."],["Verdadeiro ou falso: Cesário Verde é um poeta do quotidiano urbano.",["Verdadeiro","Falso"],0,"Lisboa é o seu grande tema."]]}], CHAVE="epi-pt-quiz-"+ID, $=function(s){return document.querySelector(s)}, atual=-1;
