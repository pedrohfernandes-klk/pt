<h1 class="c-sr">Lição M6-F12: Um cabaz pode tornar-se um corpo?</h1><main class="casca-corpo" id="casca-corpo" tabindex="-1"><div id="baralho" class="jogo-alvo"></div></main><footer class="casca-acoes" data-c-acoes></footer><section class="casca-folha" data-c-folha role="status" aria-live="polite" hidden></section>
<div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 6 · Um cabaz pode tornar-se um corpo?</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação da lição"><a href="../#m6-f12">Voltar ao percurso do módulo</a><a href="../licao-m6-f02/">Retomar uma leitura anterior</a><a href="../licao-m6-f09/">Continuar no módulo</a><a href="https://www.gutenberg.org/cache/epub/8698/pg8698-images.html" target="_blank" rel="noopener">Fonte: texto integral</a></nav><p class="c-menu-extra">EPI · Português 2026/2027. Resumos didáticos e leitura orientada. O progresso fica neste aparelho.</p></div></div></div><noscript>Esta lição precisa de JavaScript. <a href="../">Voltar ao módulo</a>.</noscript><script>document.addEventListener("DOMContentLoaded",function(){"use strict";var K="licao-m6-f12",ID="m6-f12",CARTOES=[{"t":"ler","rot":"Lê de perto","titulo":"Um cabaz pode tornar-se um corpo?","html":"<figure class=\"fig\"><span class=\"moldura\"><img src=\"../../img/fontes/cesario-verde-columbano-1887.jpg\" alt=\"Retrato de Cesário Verde por Columbano.\" loading=\"lazy\" decoding=\"async\"></span><figcaption>Cesário Verde, retrato de Columbano Bordalo Pinheiro, 1887. Domínio público. <a href=\"https://commons.wikimedia.org/wiki/File:CesarioVerde_Columbano.jpg\" target=\"_blank\" rel=\"noopener\">Fonte da imagem</a>.</figcaption></figure><p>Em «Num Bairro Moderno», um sujeito vai para o emprego e encontra uma vendedora. O cabaz transforma-se pela imaginação; depois há um pedido e um esforço partilhado. O que muda entre olhar e ajudar?</p><p>Vais distinguir observação, transfiguração e ação, e testar uma leitura com versos. Cerca de 12–15 minutos; oito atividades. A imagem identifica o autor: não representa o encontro do poema.</p>","g":"m6-f12-0"},{"t":"ler","rot":"Lê de perto","titulo":"Manhã e contraste","html":"<blockquote><p>Dez horas da manhã; os transparentes</p><p>Matizam uma casa apalaçada;</p><p>Pelos jardins estancam-se os nascentes,</p><p>E fere a vista, com brancuras quentes,</p><p>A larga rua macadamisada.</p></blockquote><blockquote><p>E rota, pequenina, aramafada,</p><p>Notei de costas uma rapariga,</p><p>Que no xadrez marmoreo d&#x27;uma escada,</p><p>Como um retalho de horta agglomerada,</p><p>Pousára, ajoelhando, a sua giga.</p></blockquote><p>Entre estes dois recortes, o sujeito admira o conforto das casas e diz que desce para o emprego. «Giga» é o cesto da vendedora. Os recortes não são consecutivos; a fonte integral está no fim. Grafia da edição consultada.</p>","g":"m6-f12-1"},{"t":"escolha","p":"Que contraste podes fundamentar nestes dois recortes?","o":["O conforto da casa apalaçada e a precariedade da vendedora","A noite na cidade e a manhã no campo","O desemprego de ambos os intervenientes","A ausência de trabalho no bairro"],"c":0,"f":"A casa é «apalaçada»; a rapariga surge «rota» e ajoelha-se com o cesto. O contraste social assenta nestas escolhas concretas. O texto situa-se de manhã e o sujeito vai trabalhar: as outras opções acrescentam ou contradizem informação.","g":"m6-f12-2"},{"t":"escolha","p":"Um colega escreve: «A rapariga é pobre, logo o sujeito descreve-a sem escolher palavras.» Como corriges a inferência?","o":["A pobreza prova que nenhuma palavra foi escolhida","«Rota», «pequenina» e «aramafada» mostram um olhar que seleciona traços","Só há escolha de palavras nos poemas sobre o amor","Uma descrição não pode conter um ponto de vista"],"c":1,"f":"Uma condição social não torna a descrição neutra. Os três qualificativos selecionam o que o leitor vê. Isto permite analisar o ponto de vista sem confundir o sujeito do poema com uma câmara imparcial.","g":"m6-f12-3"},{"t":"ler","rot":"Lê de perto","titulo":"A hipótese do artista","html":"<blockquote><p>Subitamente,—que visão de artista!—</p><p>Se eu transformasse os simples vegetaes,</p><p>Á luz do sol, o intenso colorista,</p><p>N&#x27;um ser humano que se mova e exista</p><p>Cheio de bellas proporções carnaes?!</p></blockquote><blockquote><p>E eu recompunha, por anatomia,</p><p>Um novo corpo organico, aos bocados.</p><p>Achava os tons e as fórmas. Descobria</p><p>Uma cabeça n&#x27;uma melancia,</p></blockquote><p>O sujeito não afirma que os vegetais ganharam vida fora da sua imaginação. «Se eu transformasse» propõe uma hipótese; «recompunha» mostra o trabalho imaginativo. Mais adiante, nabos tornam-se ossos e uvas tornam-se olhos. Este último enunciado é um resumo nosso.</p>","g":"m6-f12-4"},{"t":"emparelhar","p":"Liga cada elemento à transformação imaginada no recorte ou no resumo.","pares":[["Melancia","Cabeça"],["Nabos","Ossos"],["Uvas","Olhos"]],"f":"A anatomia recompõe um corpo a partir das formas dos vegetais. As correspondências apoiam-se no texto e não num corpo que tenha aparecido realmente na rua.","g":"m6-f12-5"},{"t":"completar","p":"Completa uma explicação que distinga perceção e imaginação.","frase":"O cabaz pertence ao plano do [1]; o corpo recomposto resulta da [2].","lacunas":[{"o":["observado","sobrenatural comprovado"],"c":0},{"o":["transfiguração imaginativa","reprodução sem escolhas"],"c":0}],"f":"Os vegetais são observados; o sujeito transforma-os pela imaginação. O real fornece matéria ao poema, mas a escrita não se limita a copiar a rua.","g":"m6-f12-6"},{"t":"escolha","p":"Qual frase usa melhor a prova «Se eu transformasse»?","o":["A condição verbal confirma que todos viram o mesmo corpo","A formulação apresenta uma possibilidade imaginada pelo sujeito","O sujeito garante uma experiência científica repetível","A frase elimina qualquer ligação aos vegetais reais"],"c":1,"f":"O «se» e a forma «transformasse» abrem uma possibilidade. A leitura deve manter a diferença entre hipótese imaginativa e acontecimento partilhado. Também não apaga a matéria concreta que alimenta essa hipótese.","g":"m6-f12-7"},{"t":"ler","rot":"Lê de perto","titulo":"Do olhar às mãos","html":"<blockquote><p>Eu acerquei-me d&#x27;ella, sem desprezo;</p><p>E, pelas duas azas a quebrar,</p><p>Nós levantámos todo aquelle peso</p><p>Que ao chão de pedra resistia preso,</p><p>Com um enorme esforço muscular.</p></blockquote><blockquote><p>E em quanto sigo para o lado opposto,</p><p>E ao longe rodam umas carruagens,</p><p>A pobre afasta-se, ao calor de agosto,</p><p>Descolorida nas maçãs do rosto,</p><p>E sem quadris na saia de ramagens.</p></blockquote><p>A vendedora pede ajuda; o sujeito aproxima-se e ambos levantam o cesto. Depois seguem em direções diferentes. «Aramafada» sugere aspeto desgrenhado; a grafia e o vocabulário antigos não alteram quem realiza as ações.</p>","g":"m6-f12-8"},{"t":"ordenar","p":"Ordena estas quatro ações do episódio, não os versos individuais.","passos":["O sujeito repara na vendedora e no cesto","Imagina um corpo a partir dos vegetais","Ajuda a levantar o peso","Segue para o lado oposto ao da vendedora"],"f":"O encontro e o cesto precedem a «visão de artista»; a ajuda surge depois, a pedido da vendedora; por fim separam-se. A ordem mostra uma passagem da observação à ação, sem inventar uma solução duradoura.","g":"m6-f12-9"},{"t":"escolha","p":"O que autoriza afirmar o verso «Nós levantámos todo aquelle peso»?","o":["Só o sujeito levantou o cabaz e a vendedora assistiu","A desigualdade social deixou de existir naquele bairro","O esforço foi partilhado, sem que isso prove o fim da pobreza","A transformação imaginada tornou o cesto leve"],"c":2,"f":"«Nós» inclui os dois intervenientes, e «enorme esforço muscular» conserva o peso real. O gesto de ajuda é concreto; o recorte seguinte continua a chamar-lhe «pobre». Não é prova de que o problema social ficou resolvido.","g":"m6-f12-10"},{"t":"escolha","p":"Que conclusão articula os três momentos sem os reduzir?","o":["A fantasia substitui a rua e torna inútil a ajuda","O poema observa desigualdades, recria as formas do real e encena um gesto de aproximação","O poema demonstra que toda a arte resolve a pobreza","O sujeito nunca deixa a posição de observador distante"],"c":1,"f":"Os recortes dão provas para as três operações: casa/rapariga, vegetais/corpo e «Nós levantámos». A síntese mantém as relações sem prometer que o gesto resolve a desigualdade nem tratar a imaginação como fuga total.","g":"m6-f12-11"},{"t":"ler","rot":"Lê de perto","titulo":"Leva uma prova, não uma etiqueta","html":"<p>Transfigurar não é deixar de observar: é trabalhar sobre o que se observa. Para defenderes uma leitura de «Num Bairro Moderno», liga uma escolha verbal, um efeito e uma conclusão.</p><p>Experimenta em voz alta: «A palavra ___ permite ler ___, porque ___.» Há várias leituras possíveis; o verso limita o que podes afirmar.</p><p>Cesário Verde, «N'um Bairro Moderno», <i>O Livro de Cesário Verde</i>, 1887. Recortes na grafia da transcrição; explicações e resumos nossos. <a href=\"https://www.gutenberg.org/cache/epub/8698/pg8698-images.html\" target=\"_blank\" rel=\"noopener\">Ler o poema integral e verificar o contexto</a>.</p>","g":"m6-f12-12"}];var C=EPICasca.pagina();EPIJogo.montar({casca:C,el:document.getElementById("baralho"),itens:CARTOES,chave:K,marca:"M6",titulo:"Um cabaz pode tornar-se um corpo?",variar:false,gestalt:true,percurso:"../#m6-f12",seguinte:"../licao-m6-f09/",depois:'<div class="depois"><p><a href="../#m6-f12">Voltar a esta lição no percurso</a></p></div>',fim:function(){try{localStorage.setItem(K+"-a1",JSON.stringify({lida:true,t:Date.now()}))}catch(e){}}});try{localStorage.setItem("epi-ultima",JSON.stringify({id:"m6-f12",m:"M6",t:Date.now()}))}catch(e){}});</script><script defer src="../../assets/projection-launcher.js?v=20261019.4" data-site="pt"></script></body></html>
