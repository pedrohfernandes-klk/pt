window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m6-f14",CARTOES=[{"t":"ler","titulo":"Discordar sem excluir","rot":"Abre","html":"<p class=\"abre\">Se alguém discorda de ti, deixou de poder pensar contigo? A abertura de uma conferência pode definir a relação com o público antes de apresentar a tese.<\/p><p>Vais distinguir respeito pelas pessoas, exame das ideias e condições de uma discussão.<\/p>"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>O <strong>ethos<\/strong> é a imagem de quem fala construída no discurso. Uma <strong>concessão<\/strong> reconhece um ponto que poderia favorecer uma objeção, sem abandonar necessariamente a tese.<\/p><p>A <strong>refutação<\/strong> enfrenta uma ideia com razões. Atacar a identidade de quem a apresenta não substitui esse trabalho.<\/p>"},{"t":"ler","titulo":"Um público que pode discordar","rot":"Lê e confronta","html":"<blockquote class=\"prosa\">«Não posso pois apelar para a fraternidade das ideias: conheço que as minhas palavras não devem ser bem aceites por todos.»<\/blockquote><blockquote class=\"prosa\">«não pretendemos impor as nossas opiniões, mas simplesmente expô-las: não pedimos a adesão das pessoas que nos escutam; pedimos só a discussão»<\/blockquote><p>Antero de Quental, <i>Causas da Decadência dos Povos Peninsulares nos Últimos Três Séculos<\/i>, conferência de 27 de maio de 1871, abertura, transcrição no <a href=\"https://www.arqnet.pt/portal/discursos/maio01.html\" target=\"_blank\" rel=\"noopener\">Portal da História, com o texto integral<\/a>. A página não identifica a edição impressa usada.<\/p><p>O segundo recorte retoma uma declaração sobre as Conferências. O orador admite a divergência e propõe uma relação que não depende da concordância prévia.<\/p>"},{"t":"escolha","p":"Que relação com o público é proposta?","o":["A discussão das ideias admite a discordância.","A escuta das ideias exige a adesão antecipada.","A divergência das ideias impede todo o respeito."],"c":0,"f":"O orador distingue ouvir e discutir de aderir. A relação com o público pode manter-se mesmo quando as opiniões não coincidem.","g":"m6-f14-3"},{"t":"vf","p":"Recusar impor uma opinião significa não defender nenhuma tese.","v":false,"f":"Uma tese pode ser defendida com razões e permanecer aberta à discussão. A alternativa à imposição não é necessariamente a ausência de posição.","g":"m6-f14-4"},{"t":"emparelhar","p":"Relaciona cada expressão com a operação discursiva.","pares":[["não devem ser bem aceites por todos","Reconhecer a divergência possível"],["não pretendemos impor","Recusar a adesão forçada"],["pedimos só a discussão","Propor o exame das ideias"]],"f":"As expressões constroem uma relação com o auditório. A abertura prepara as condições da discussão antes de desenvolver as razões históricas.","g":"m6-f14-5"},{"t":"ler","titulo":"Uma fraternidade que não exige acordo","rot":"Lê e confronta","html":"<p>Na abertura, Antero distingue a concordância de ideias de uma relação moral fundada na tolerância e no respeito. A disposição para discutir constrói uma imagem de sinceridade e de procura da verdade.<\/p><p>Essa imagem é uma estratégia discursiva que deve ser analisada. Não prova automaticamente que todas as afirmações históricas da conferência estejam corretas.<\/p>"},{"t":"completar","p":"Completa a distinção.","frase":"O respeito dirige-se às [1]; a crítica examina as [2].","lacunas":[{"o":["pessoas","teorias","símbolos"],"c":0},{"o":["ideias","formas","origens"],"c":0}],"f":"Separar pessoas e ideias permite discutir razões sem reduzir o interlocutor a uma etiqueta. Isso não obriga a aceitar como verdadeira qualquer afirmação.","g":"m6-f14-7"},{"t":"ordenar","p":"Ordena a construção de uma discordância fundamentada.","passos":["Identificar a ideia em discussão","Apresentar uma razão ou uma prova contrária","Explicar a relação entre prova e conclusão","Responder à ideia sem atacar a pessoa"],"f":"A discordância torna-se verificável quando explicita o seu fundamento. A identidade do interlocutor não decide por si só o valor da tese.","g":"m6-f14-8"},{"t":"sublinhar","p":"Seleciona a palavra que marca o contraste entre impor e expor.","frase":"não pretendemos impor as nossas opiniões, mas simplesmente expô-las","certas":[6],"f":"Mas contrapõe duas maneiras de se relacionar com o auditório. A exposição admite uma resposta; a imposição procura dispensar esse exame.","g":"m6-f14-9"},{"t":"escolha","p":"Que efeito produz admitir a discordância do público?","o":["Constrói uma imagem de abertura à discussão.","Demonstra a verdade de todas as teses futuras.","Dispensa a apresentação de razões verificáveis."],"c":0,"f":"A admissão participa no ethos do orador. Uma imagem de abertura não substitui as provas nem garante a validade de todos os argumentos.","g":"m6-f14-10"},{"t":"vf","p":"Respeitar uma pessoa obriga a considerar igualmente válidas todas as suas afirmações.","v":false,"f":"O respeito não elimina os critérios de verdade, relevância ou coerência. É possível criticar uma afirmação com rigor e preservar a dignidade da pessoa.","g":"m6-f14-11"},{"t":"ler","titulo":"Duas respostas, duas relações","rot":"Lê e confronta","html":"<p>Respostas didáticas criadas: A: «Essa conclusão ignora o documento que acabaste de citar.» B: «Pessoas como tu não merecem ser ouvidas.»<\/p><p>A primeira aponta uma dificuldade que pode ser examinada. A segunda exclui a pessoa sem responder à razão apresentada. O desacordo não se torna mais forte por se transformar em ataque pessoal.<\/p>"},{"t":"emparelhar","p":"Classifica os procedimentos.","pares":[["Confrontar uma tese com um documento","Refutação apoiada numa prova"],["Excluir alguém pela sua identidade","Ataque à pessoa"],["Admitir que uma objeção é pertinente","Reconhecimento de um limite"]],"f":"A classificação orienta a revisão de uma resposta. Não é a intensidade da discordância que distingue os casos, mas o objeto e o fundamento da crítica.","g":"m6-f14-13"},{"t":"escolha","p":"Que revisão torna a resposta B discutível com razões?","o":["Nomear a conclusão contestada e explicar a objeção.","Repetir a exclusão com palavras ainda mais duras.","Trocar a identidade visada por uma outra identidade."],"c":0,"f":"A revisão desloca a resposta para a ideia e permite contestação fundamentada. Intensificar ou trocar o alvo pessoal conserva o mesmo problema.","g":"m6-f14-14"},{"t":"completar","p":"Completa uma regra.","frase":"A abertura constrói uma [1] do orador; a tese precisa de [2].","lacunas":[{"o":["imagem","certeza","atitude"],"c":0},{"o":["provas","elogios","aliança"],"c":0}],"f":"O ethos influencia a relação com o público. A avaliação da tese continua a exigir fundamentos, e não apenas confiança na pessoa que a apresenta.","g":"m6-f14-15"},{"t":"ordenar","p":"Prepara uma intervenção breve.","passos":["Resumir a posição alheia sem a deformar","Assinalar o ponto exato de divergência","Apresentar uma razão pertinente","Indicar o que te faria rever a conclusão"],"f":"A possibilidade de revisão torna explícito que a discussão procura conhecimento. Não significa abandonar antecipadamente a posição defendida.","g":"m6-f14-16"},{"t":"escolha","p":"Que pergunta permite avaliar uma discussão?","o":["As razões apresentadas respondem à ideia debatida?","O número de aplausos torna dispensáveis as provas?","A origem de quem fala decide sempre quem tem razão?"],"c":0,"f":"A pertinência das razões liga a resposta ao problema. A popularidade e a origem da pessoa não substituem esse exame.","g":"m6-f14-17"},{"t":"vf","p":"Podemos analisar a abertura da conferência sem assumir como factos todas as suas interpretações históricas.","v":true,"f":"A análise discursiva estuda a relação com o público e os procedimentos argumentativos. A confirmação histórica das teses exige investigação própria.","g":"m6-f14-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Discordar de uma ideia não exige excluir a pessoa que a apresenta.<\/p><p>Explica como Antero prepara a discussão e distingue a imagem do orador da prova de uma tese.<\/p>"}];
