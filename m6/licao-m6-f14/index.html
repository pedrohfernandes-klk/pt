window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m6-f14",CARTOES=[{"t":"ler","titulo":"Discordar sem excluir","rot":"Abre","html":"<figure class=\"fig documento\"><a href=\"../../img/fontes/antero-de-quental-1887.jpg\" aria-label=\"Abrir a imagem inteira\"><img data-original=\"../../img/fontes/antero-de-quental-1887-original.jpg\" src=\"../../img/fontes/antero-de-quental-1887.jpg\" alt=\"Retrato fotográfico de Antero de Quental, de barba e perfil a três quartos.\"><\/a><details class=\"info-i info-i--linha\" name=\"info-i\"><summary aria-label=\"Créditos da imagem\"><span aria-hidden=\"true\">i<\/span><\/summary><div class=\"info-i-texto\"><p>Domínio público; <a href=\"https://commons.wikimedia.org/wiki/File:Antero_de_Quental_(ca._1887).jpg\">Fonte ↗<\/a><\/p><table><caption>Identificação do documento visual<\/caption><tr><th scope=\"row\">Autor<\/th><td>Fotógrafo não identificado<\/td><\/tr><tr><th scope=\"row\">Obra<\/th><td>Retrato de Antero de Quental<\/td><\/tr><tr><th scope=\"row\">Data<\/th><td>Cerca de 1887; publicado em <i>In Memoriam<\/i>, 1896<\/td><\/tr><tr><th scope=\"row\">Instituição ou acervo<\/th><td>Biblioteca Nacional de Portugal; reprodução no Wikimedia Commons.<\/td><\/tr><tr><th scope=\"row\">Licença<\/th><td><a href=\"https://commons.wikimedia.org/wiki/File:Antero_de_Quental_(ca._1887).jpg\">Domínio público<\/a><\/td><\/tr><\/table><p><a href=\"https://commons.wikimedia.org/wiki/File:Antero_de_Quental_(ca._1887).jpg\">Consultar a fonte e os direitos ↗<\/a>. Reprodução redimensionada, sem recorte.<\/p><\/div><\/details><figcaption><p>Antero de Quental num retrato de cerca de 1887, posterior à conferência de 1871.<\/p><\/figcaption><\/figure><p class=\"abre\"><strong>Como se pode defender uma ideia e aceitar que ela seja contrariada?<\/strong><\/p><p class=\"abre\">Se alguém discorda de ti, deixou de poder pensar contigo? A abertura de uma conferência pode definir a relação com o público antes de apresentar a tese.<\/p><p>Vais distinguir respeito pelas pessoas, exame das ideias e condições de uma discussão.<\/p>"},{"t":"vf","p":"Antes de reler. Recupera a distinção entre tese e argumento: a confiança em quem fala substitui a razão apresentada para defender uma ideia?","v":false,"f":"Confundir credibilidade e fundamento dispensa o exame da tese. Relê a relação entre posição e razões na unidade de Antero e procura o que sustenta a conclusão.","g":"m6-f14-1","fe":"Deixas que a confiança em quem fala substitua a razão apresentada. Regressa às lições anteriores sobre Antero e procura, em cada tese, a razão que a sustenta."},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>O <strong>ethos<\/strong> é a imagem de quem fala construída no discurso. Uma <strong>concessão<\/strong> reconhece um ponto que poderia favorecer uma objeção, sem abandonar necessariamente a tese.<\/p><p>A <strong>refutação<\/strong> enfrenta uma ideia com razões. Atacar a identidade de quem a apresenta não substitui esse trabalho.<\/p>"},{"t":"ler","titulo":"Um público que pode discordar","rot":"Lê de perto","html":"<blockquote class=\"prosa\">«Não posso pois apelar para a fraternidade das ideias: conheço que as minhas palavras não devem ser bem aceites por todos.»<\/blockquote><blockquote class=\"prosa\">«não pretendemos impor as nossas opiniões, mas simplesmente expô-las: não pedimos a adesão das pessoas que nos escutam; pedimos só a discussão»<\/blockquote><p>Antero de Quental, <i>Causas da Decadência dos Povos Peninsulares nos Últimos Três Séculos<\/i>, conferência de 27 de maio de 1871, abertura, transcrição no <a href=\"https://www.arqnet.pt/portal/discursos/maio01.html\" target=\"_blank\" rel=\"noopener\">Portal da História, com o texto integral<\/a>. A página não identifica a edição impressa usada.<\/p><p>O segundo recorte retoma uma declaração sobre as Conferências. O orador admite a divergência e propõe uma relação que não depende da concordância prévia.<\/p>"},{"t":"sublinhar","p":"Que palavra opõe exigir adesão e apresentar uma posição à discussão?","frase":"não pretendemos impor as nossas opiniões, mas simplesmente expô-las","certas":[6],"f":"«Mas» contrapõe duas maneiras de se relacionar com o auditório. A exposição admite uma resposta; a imposição procura dispensar esse exame.","g":"m6-f14-10","fe":"Escolhes uma palavra de um dos lados da oposição, e não a que liga os dois. Relê «não pretendemos impor as nossas opiniões, mas simplesmente expô-las» e procura a conjunção que contrapõe impor e expor."},{"t":"escolha","p":"Que relação com o público é proposta?","o":["A discussão das ideias admite a discordância.","A escuta das ideias pressupõe o acordo mútuo.","A discussão das ideias adia a avaliação crítica."],"c":0,"f":"O orador distingue ouvir e discutir de aderir. A relação com o público pode manter-se mesmo quando as opiniões não coincidem.","g":"m6-f14-4","fe":["O orador distingue ouvir e discutir de aderir. A relação com o público pode manter-se mesmo quando as opiniões não coincidem.","Transformas o acordo em condição de escuta. Relê a recusa de impor uma opinião e a abertura à discordância.","Confundes abertura ao público com suspensão da crítica. Regressa ao convite para discutir ideias e à responsabilidade de fundamentar."]},{"t":"emparelhar","p":"Relaciona cada expressão com a operação discursiva.","pares":[["não devem ser bem aceites por todos","Reconhecer a divergência possível"],["não pretendemos impor","Recusar a adesão forçada"],["pedimos só a discussão","Propor o exame das ideias"]],"f":"As expressões constroem uma relação com o auditório. A abertura prepara as condições da discussão antes de desenvolver as razões históricas.","g":"m6-f14-6","fe":"Trocas o reconhecimento da divergência pela recusa da adesão ou pelo pedido de exame. Relê os dois recortes da abertura pela ordem: primeiro o que o orador admite, depois o que recusa e o que pede."},{"t":"vf","p":"Recusar impor uma opinião permite defender uma tese e admitir que o público a conteste.","v":true,"f":"Uma tese pode ser defendida com razões e permanecer aberta à discussão. A alternativa à imposição não é necessariamente a ausência de posição.","g":"m6-f14-5","fe":"Pensas que recusar impor uma opinião obriga a abandonar a tese. Relê «não pretendemos impor as nossas opiniões, mas simplesmente expô-las»: expor é ainda defender uma posição."},{"t":"ler","titulo":"Uma fraternidade que não exige acordo","rot":"Para entender","html":"<p>Na abertura, Antero distingue a concordância de ideias de uma relação moral fundada na tolerância e no respeito. A disposição para discutir constrói uma imagem de sinceridade e de procura da verdade.<\/p><p>Essa imagem é uma estratégia discursiva que deve ser analisada. Não prova automaticamente que todas as afirmações históricas da conferência estejam corretas.<\/p><p><strong>Modelo completo.<\/strong> O orador reconhece a divergência e recusa exigir adesão. Esse gesto constrói abertura à discussão. A imagem de abertura não comprova, por si só, as interpretações históricas que se seguem.<\/p>"},{"t":"escolha","p":"Que efeito produz admitir a discordância do público?","o":["Cria uma imagem de abertura à discussão.","Apresenta a divergência como razão da tese.","Apresenta o acordo como condição da escuta."],"c":0,"f":"A admissão participa no ethos do orador. Uma imagem de abertura não substitui as provas nem garante a validade de todos os argumentos.","g":"m6-f14-11","fe":["A admissão participa no ethos do orador. Uma imagem de abertura não substitui as provas nem garante a validade de todos os argumentos.","Tomas a existência de divergência como argumento da tese. Relê a diferença entre acolher uma objeção e justificar uma ideia.","Invertes a relação entre abertura e acordo: o orador aceita ouvir quem discorda. Relê as palavras em que recusa impor a sua opinião."]},{"t":"completar","p":"Completa a distinção.","frase":"O respeito dirige-se às [1]; a crítica examina as [2].","lacunas":[{"o":["pessoas","teorias","símbolos"],"c":0},{"o":["ideias","formas","origens"],"c":0}],"f":"Separar pessoas e ideias permite discutir razões sem reduzir o interlocutor a uma etiqueta. Isso não obriga a aceitar como verdadeira qualquer afirmação.","g":"m6-f14-8","fe":"Trocas o alvo do respeito pelo alvo da crítica. Relê, em «O essencial», que a refutação enfrenta uma ideia e que atacar a identidade de quem a apresenta não a substitui."},{"t":"ordenar","p":"Ordena a construção de uma discordância fundamentada.","passos":["Identificar a ideia em discussão","Apresentar uma razão ou uma prova contrária","Explicar a relação entre prova e conclusão","Responder à ideia sem atacar a pessoa"],"f":"A discordância torna-se verificável quando explicita o seu fundamento. A identidade do interlocutor não decide por si só o valor da tese.","g":"m6-f14-9","fe":"Começas pela resposta à pessoa sem teres identificado a ideia nem a prova. Relê a resposta A criada para esta lição: nomeia uma conclusão e o documento que a contraria."},{"t":"ler","titulo":"Duas respostas, duas relações","rot":"Compara","html":"<p>Respostas criadas para esta lição. A: Essa conclusão ignora o documento que acabaste de citar. B: Pessoas como tu não merecem ser ouvidas.<\/p><p>A primeira aponta uma dificuldade que pode ser examinada. A segunda exclui a pessoa sem responder à razão apresentada. O desacordo não se torna mais forte por se transformar em ataque pessoal.<\/p><p>Contraexemplo à equivalência entre discordar e excluir: a resposta criada que aponta um documento contesta a conclusão sem atacar a pessoa. Critério: identifica se a objeção incide na ideia e apresenta uma razão.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Compara o objeto das duas respostas: uma conclusão ou a identidade de alguém? Que alteração tornaria possível responder com provas?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"escolha","p":"Que revisão torna a resposta B discutível com razões?","o":["Nomear a conclusão contestada e explicar a objeção.","Nomear a pessoa contestada e explicar a sua origem.","Nomear a conclusão contestada e invocar a reputação."],"c":0,"f":"A objeção discutível identifica a conclusão e uma razão. Confundir a origem ou a reputação da pessoa com prova da ideia desloca o debate para outro objeto.","g":"m6-f14-15","fe":["A objeção discutível identifica a conclusão e uma razão. Confundir a origem ou a reputação da pessoa com prova da ideia desloca o debate para outro objeto.","Deslocas a discussão da conclusão para a origem da pessoa. Regressa à resposta criada que ataca quem fala em vez do argumento.","Substituis uma razão verificável por reputação. Relê a conclusão contestada e identifica o documento que pode sustentá-la ou contrariá-la."]},{"t":"emparelhar","p":"Classifica os procedimentos.","pares":[["Confrontar uma tese com um documento","Refutação apoiada numa prova"],["Excluir alguém pela sua identidade","Ataque à pessoa"],["Admitir que uma objeção é pertinente","Limite reconhecido"]],"f":"A classificação orienta a revisão de uma resposta. Não é a intensidade da discordância que distingue os casos, mas o objeto e o fundamento da crítica.","g":"m6-f14-14","fe":"Classificas pela intensidade da discordância, e não pelo seu objeto. Relê as duas respostas criadas para esta lição: uma aponta um documento, a outra exclui a pessoa."},{"t":"completar","p":"Completa uma regra.","frase":"O ethos é [1] de quem fala construída no discurso; a tese precisa de [2].","lacunas":[{"o":["uma imagem","uma certeza","a biografia"],"c":0},{"o":["provas","elogios","aliança"],"c":0}],"f":"O ethos influencia a relação com o público. A imagem construída no discurso não equivale à biografia de quem fala. A avaliação da tese continua a exigir fundamentos, e não apenas confiança na pessoa que a apresenta.","g":"m6-f14-16","fe":"Tomas a imagem que o orador constrói por uma prova da tese. Relê, em «Para entender», que a disposição para discutir constrói uma imagem e não prova automaticamente as afirmações históricas."},{"t":"vf","p":"Respeitar quem fala dispensa examinar a razão que essa pessoa apresenta.","v":false,"f":"O respeito não elimina os critérios de verdade, relevância ou coerência. É possível criticar uma afirmação com rigor e preservar a dignidade da pessoa.","g":"m6-f14-12","fe":"Confundes o respeito pela pessoa com a aceitação da razão que apresenta. Relê, em «Para entender», que a imagem de abertura não comprova, por si só, as interpretações históricas que se seguem."},{"t":"escolha","p":"Que pergunta permite avaliar uma discussão?","o":["As razões respondem à ideia que está em debate?","A reputação de quem fala confirma a ideia em debate?","O acordo dos presentes confirma a ideia em debate?"],"c":0,"f":"A pertinência das razões liga a resposta ao problema. A popularidade e a origem da pessoa não substituem esse exame.","g":"m6-f14-18","fe":["A pertinência das razões liga a resposta ao problema. A popularidade e a origem da pessoa não substituem esse exame.","Confundes reputação com pertinência do argumento. Regressa à tese em debate e procura a razão que a sustenta.","Confundes acordo dos presentes com prova da ideia. Relê a diferença entre acolhimento pelo público e fundamento da tese."]},{"t":"ordenar","p":"Ordena a relação proposta ao público e o limite do ethos.","passos":["O orador reconhece opiniões divergentes","Recusa fazer da escuta uma adesão obrigatória","Propõe examinar as ideias em discussão","A tese continua dependente de razões e provas"],"f":"A abertura à discordância estabelece uma relação com o auditório. Para avaliar a tese, é preciso examinar as razões: respeitar uma pessoa não impede contestar o seu argumento.","g":"m6-f14-17","fe":"Colocas o limite do ethos antes da relação que ele qualifica. Relê o modelo completo: o orador reconhece a divergência, recusa exigir adesão e só então se avalia o que essa imagem não comprova."},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Como se pode defender uma ideia e aceitar que ela seja contrariada?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
