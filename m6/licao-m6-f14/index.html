<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m6-f14",CARTOES=[{"t":"ler","titulo":"Discordar sem excluir","rot":"Abre","html":"<p class=\"abre\">Como se pode defender uma ideia e aceitar que ela seja contrariada?<\/p><p class=\"abre\">Se alguém discorda de ti, deixou de poder pensar contigo? A abertura de uma conferência pode definir a relação com o público antes de apresentar a tese.<\/p><p>Vais distinguir respeito pelas pessoas, exame das ideias e condições de uma discussão.<\/p><figure class=\"fig documento\"><a href=\"../../img/fontes/antero-de-quental-1887.jpg\" aria-label=\"Abrir a imagem inteira\"><img src=\"../../img/fontes/antero-de-quental-1887.jpg\" alt=\"Retrato fotográfico de Antero de Quental, de barba e perfil a três quartos.\"><\/a><figcaption><p>Antero de Quental num retrato de cerca de 1887, posterior à conferência de 1871.<\/p><details><summary>Créditos e fonte da imagem<\/summary><table><caption>Identificação do documento visual<\/caption><tr><th scope=\"row\">Autor<\/th><td>Fotógrafo não identificado<\/td><\/tr><tr><th scope=\"row\">Obra<\/th><td>Retrato de Antero de Quental<\/td><\/tr><tr><th scope=\"row\">Data<\/th><td>Cerca de 1887; publicado em <i>In Memoriam<\/i>, 1896<\/td><\/tr><tr><th scope=\"row\">Instituição ou acervo<\/th><td>Biblioteca Nacional de Portugal; reprodução no Wikimedia Commons.<\/td><\/tr><tr><th scope=\"row\">Licença<\/th><td><a href=\"https://commons.wikimedia.org/wiki/File:Antero_de_Quental_(ca._1887).jpg\">Domínio público<\/a><\/td><\/tr><\/table><p><a href=\"https://commons.wikimedia.org/wiki/File:Antero_de_Quental_(ca._1887).jpg\">Consultar a fonte e os direitos<\/a>. Reprodução redimensionada, sem recorte.<\/p><\/details><\/figcaption><\/figure>"},{"t":"vf","p":"Antes de reler. Recupera a distinção entre tese e argumento: a confiança em quem fala substitui a razão apresentada para defender uma ideia?","v":false,"f":"Confundir credibilidade e fundamento dispensa o exame da tese. Relê a relação entre posição e razões na unidade de Antero e procura o que sustenta a conclusão. Relê essa distinção na lição anterior depois de tentares responder.","g":"m6-f14-1"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>O <strong>ethos<\/strong> é a imagem de quem fala construída no discurso. Uma <strong>concessão<\/strong> reconhece um ponto que poderia favorecer uma objeção, sem abandonar necessariamente a tese.<\/p><p>A <strong>refutação<\/strong> enfrenta uma ideia com razões. Atacar a identidade de quem a apresenta não substitui esse trabalho.<\/p>"},{"t":"ler","titulo":"Um público que pode discordar","rot":"Lê e confronta","html":"<blockquote class=\"prosa\">«Não posso pois apelar para a fraternidade das ideias: conheço que as minhas palavras não devem ser bem aceites por todos.»<\/blockquote><blockquote class=\"prosa\">«não pretendemos impor as nossas opiniões, mas simplesmente expô-las: não pedimos a adesão das pessoas que nos escutam; pedimos só a discussão»<\/blockquote><p>Antero de Quental, <i>Causas da Decadência dos Povos Peninsulares nos Últimos Três Séculos<\/i>, conferência de 27 de maio de 1871, abertura, transcrição no <a href=\"https://www.arqnet.pt/portal/discursos/maio01.html\" target=\"_blank\" rel=\"noopener\">Portal da História, com o texto integral<\/a>. A página não identifica a edição impressa usada.<\/p><p>O segundo recorte retoma uma declaração sobre as Conferências. O orador admite a divergência e propõe uma relação que não depende da concordância prévia.<\/p>"},{"t":"escolha","p":"Que relação com o público é proposta?","o":["A discussão das ideias admite a discordância.","A escuta das ideias pressupõe o acordo mútuo.","A discussão das ideias adia a avaliação crítica."],"c":0,"f":"O orador distingue ouvir e discutir de aderir. A relação com o público pode manter-se mesmo quando as opiniões não coincidem. Relê o cartão «Um público que pode discordar» e confronta a pista com a tua resposta.","g":"m6-f14-4"},{"t":"vf","p":"Recusar impor uma opinião significa não defender nenhuma tese.","v":false,"f":"Uma tese pode ser defendida com razões e permanecer aberta à discussão. A alternativa à imposição não é necessariamente a ausência de posição. Relê o cartão «Um público que pode discordar» e confronta a pista com a tua resposta.","g":"m6-f14-5"},{"t":"emparelhar","p":"Relaciona cada expressão com a operação discursiva.","pares":[["não devem ser bem aceites por todos","Reconhecer a divergência possível"],["não pretendemos impor","Recusar a adesão forçada"],["pedimos só a discussão","Propor o exame das ideias"]],"f":"As expressões constroem uma relação com o auditório. A abertura prepara as condições da discussão antes de desenvolver as razões históricas. Relê o cartão «Um público que pode discordar» e confronta a pista com a tua resposta.","g":"m6-f14-6"},{"t":"ler","titulo":"Uma fraternidade que não exige acordo","rot":"Lê e confronta","html":"<p>Na abertura, Antero distingue a concordância de ideias de uma relação moral fundada na tolerância e no respeito. A disposição para discutir constrói uma imagem de sinceridade e de procura da verdade.<\/p><p>Essa imagem é uma estratégia discursiva que deve ser analisada. Não prova automaticamente que todas as afirmações históricas da conferência estejam corretas.<\/p><p><strong>Modelo completo.<\/strong> O orador reconhece a divergência e recusa exigir adesão. Esse gesto constrói abertura à discussão. A imagem de abertura não comprova, por si só, as interpretações históricas que se seguem.<\/p>"},{"t":"completar","p":"Completa a distinção.","frase":"O respeito dirige-se às [1]; a crítica examina as [2].","lacunas":[{"o":["pessoas","teorias","símbolos"],"c":0},{"o":["ideias","formas","origens"],"c":0}],"f":"Separar pessoas e ideias permite discutir razões sem reduzir o interlocutor a uma etiqueta. Isso não obriga a aceitar como verdadeira qualquer afirmação. Relê o cartão «Uma fraternidade que não exige acordo» e confronta a pista com a tua resposta.","g":"m6-f14-8"},{"t":"ordenar","p":"Ordena a construção de uma discordância fundamentada.","passos":["Identificar a ideia em discussão","Apresentar uma razão ou uma prova contrária","Explicar a relação entre prova e conclusão","Responder à ideia sem atacar a pessoa"],"f":"A discordância torna-se verificável quando explicita o seu fundamento. A identidade do interlocutor não decide por si só o valor da tese. Relê o cartão «Uma fraternidade que não exige acordo» e confronta a pista com a tua resposta.","g":"m6-f14-9"},{"t":"sublinhar","p":"Que palavra opõe exigir adesão e apresentar uma posição à discussão?","frase":"não pretendemos impor as nossas opiniões, mas simplesmente expô-las","certas":[6],"f":"Mas contrapõe duas maneiras de se relacionar com o auditório. A exposição admite uma resposta; a imposição procura dispensar esse exame. Relê o cartão «Uma fraternidade que não exige acordo» e confronta a pista com a tua resposta.","g":"m6-f14-10"},{"t":"escolha","p":"Que efeito produz admitir a discordância do público?","o":["Cria uma imagem de abertura à discussão.","Apresenta a divergência como razão da tese.","Apresenta o acordo como condição da escuta."],"c":0,"f":"A admissão participa no ethos do orador. Uma imagem de abertura não substitui as provas nem garante a validade de todos os argumentos. Relê o cartão «Uma fraternidade que não exige acordo» e confronta a pista com a tua resposta.","g":"m6-f14-11"},{"t":"vf","p":"Respeitar uma pessoa obriga a considerar igualmente válidas todas as suas afirmações.","v":false,"f":"O respeito não elimina os critérios de verdade, relevância ou coerência. É possível criticar uma afirmação com rigor e preservar a dignidade da pessoa. Relê o cartão «Uma fraternidade que não exige acordo» e confronta a pista com a tua resposta.","g":"m6-f14-12"},{"t":"ler","titulo":"Duas respostas, duas relações","rot":"Lê e confronta","html":"<p>Respostas didáticas criadas: A: «Essa conclusão ignora o documento que acabaste de citar.» B: «Pessoas como tu não merecem ser ouvidas.»<\/p><p>A primeira aponta uma dificuldade que pode ser examinada. A segunda exclui a pessoa sem responder à razão apresentada. O desacordo não se torna mais forte por se transformar em ataque pessoal.<\/p><p>Contraexemplo à equivalência entre discordar e excluir: a resposta criada que aponta um documento contesta a conclusão sem atacar a pessoa. Critério: identifica se a objeção incide na ideia e apresenta uma razão.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Compara o objeto das duas respostas: uma conclusão ou a identidade de alguém? Que alteração tornaria possível responder com provas?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Classifica os procedimentos.","pares":[["Confrontar uma tese com um documento","Refutação apoiada numa prova"],["Excluir alguém pela sua identidade","Ataque à pessoa"],["Admitir que uma objeção é pertinente","Reconhecimento de um limite"]],"f":"A classificação orienta a revisão de uma resposta. Não é a intensidade da discordância que distingue os casos, mas o objeto e o fundamento da crítica. Relê o cartão «Duas respostas, duas relações» e confronta a pista com a tua resposta.","g":"m6-f14-14"},{"t":"escolha","p":"Que revisão torna a resposta B discutível com razões?","o":["Nomear a conclusão contestada e explicar a objeção.","Nomear a pessoa contestada e explicar a sua origem.","Nomear a conclusão contestada e invocar a reputação."],"c":0,"f":"A objeção discutível identifica a conclusão e uma razão. Confundir a origem ou a reputação da pessoa com prova da ideia desloca o debate para outro objeto. Relê o cartão «Duas respostas, duas relações» e confronta a pista com a tua resposta.","g":"m6-f14-15"},{"t":"completar","p":"Completa uma regra.","frase":"A abertura constrói uma [1] do orador; a tese precisa de [2].","lacunas":[{"o":["imagem","certeza","atitude"],"c":0},{"o":["provas","elogios","aliança"],"c":0}],"f":"O ethos influencia a relação com o público. A avaliação da tese continua a exigir fundamentos, e não apenas confiança na pessoa que a apresenta. Relê o cartão «Duas respostas, duas relações» e confronta a pista com a tua resposta.","g":"m6-f14-16"},{"t":"ordenar","p":"Ordena a relação proposta ao público e o limite do ethos.","passos":["O orador reconhece opiniões divergentes","Recusa fazer da escuta uma adesão obrigatória","Propõe examinar as ideias em discussão","A tese continua dependente de razões e provas"],"f":"A sequência liga os pormenores à interpretação e conserva o seu limite. Relê o modelo e o contraexemplo: Compara o objeto das duas respostas: uma conclusão ou a identidade de alguém? Que alteração tornaria possível responder com provas? Relê o cartão «Duas respostas, duas relações» e confronta a pista com a tua resposta.","g":"m6-f14-17"},{"t":"escolha","p":"Que pergunta permite avaliar uma discussão?","o":["As razões respondem à ideia que está em debate?","A reputação de quem fala confirma a ideia em debate?","O acordo dos presentes confirma a ideia em debate?"],"c":0,"f":"A pertinência das razões liga a resposta ao problema. A popularidade e a origem da pessoa não substituem esse exame. Relê o cartão «Duas respostas, duas relações» e confronta a pista com a tua resposta.","g":"m6-f14-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Como se pode defender uma ideia e aceitar que ela seja contrariada?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
