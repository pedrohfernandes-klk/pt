<h1 class="c-sr">Lição M6-F13: O sonho pode pedir ação?</h1><main class="casca-corpo" id="casca-corpo" tabindex="-1"><div id="baralho" class="jogo-alvo"></div></main><footer class="casca-acoes" data-c-acoes></footer><section class="casca-folha" data-c-folha role="status" aria-live="polite" hidden></section>
<div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 6 · Passo 4 de 13<br>Unidade 1 · O ideal e a rua</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação da lição"><a href="../#m6-f13">Voltar ao percurso do módulo</a><a href="../licao-m6-f02/">Retomar uma leitura anterior</a><a href="../licao-m6-f12/">Continuar no módulo</a><a href="https://www.gutenberg.org/cache/epub/20142/pg20142-images.html" target="_blank" rel="noopener">Fonte: texto integral</a></nav><p class="c-menu-extra">EPI · Português 2026/2027. Resumos didáticos e leitura orientada. O progresso fica neste aparelho.</p></div></div></div><noscript>Esta lição precisa de JavaScript. <a href="../">Voltar ao módulo</a>.</noscript><script>document.addEventListener("DOMContentLoaded",function(){"use strict";var K="licao-m6-f13",ID="m6-f13",CARTOES=[{"t":"ler","rot":"Lê de perto","titulo":"O sonho pode pedir ação?","html":"<figure class=\"fig\"><span class=\"moldura\"><img src=\"../../img/fontes/antero-columbano-1889.jpg\" alt=\"Antero de Quental, retratado por Columbano.\" loading=\"lazy\" decoding=\"async\"></span><figcaption>Antero de Quental, Columbano Bordalo Pinheiro, 1889. Domínio público. <a href=\"https://commons.wikimedia.org/wiki/File:Retrato_de_Antero_de_Quental_(1889)_-_Columbano_Bordalo_Pinheiro_(MNAC_Inv._1108).png\" target=\"_blank\" rel=\"noopener\">Fonte da imagem</a>.</figcaption></figure><p>Já leste uma procura que termina no vazio. «A um poeta» propõe outra posição: uma voz chama um poeta a acordar, escutar e agir. Não precisas de reduzir um autor a uma só atitude.</p><p>Vais seguir a interpelação, interpretar as imagens e testar o que uma comparação permite concluir. Oito atividades; cerca de 10–12 minutos. O retrato identifica o autor, não o destinatário do poema.</p>","g":"m6-f13-0"},{"t":"ler","rot":"Lê de perto","titulo":"Quem é chamado?","html":"<blockquote><p>Tu, que dormes, espirito sereno,</p><p>Posto á sombra dos cedros seculares,</p><p>Como um levita á sombra dos altares,</p><p>Longe da lucta e do fragor terreno,</p></blockquote><p>O título identifica o destinatário como poeta. A voz que o interpela descreve-o afastado da luta. «Levita» designa aqui uma figura ligada ao serviço religioso; a comparação reforça o recolhimento. Não identifica documentalmente uma pessoa concreta.</p>","g":"m6-f13-1"},{"t":"escolha","p":"Que relação de enunciação se constrói nesta primeira quadra?","o":["Um narrador relata a vida inteira de Antero na terceira pessoa","Uma voz dirige-se a um «tu», um poeta que aparece recolhido","Uma multidão conta a sua própria história sem destinatário","O poeta destinatário já responde à voz que o chama"],"c":1,"f":"O título e o «Tu» sustentam a interpelação. O recorte não é uma biografia nem contém a resposta do destinatário. Distinguir quem fala e a quem fala evita tomar qualquer voz poética como confissão direta do autor.","g":"m6-f13-2"},{"t":"emparelhar","p":"Liga cada expressão à função que cumpre neste recorte.","pares":[["«Tu»","Marca o destinatário da interpelação"],["«Como um levita»","Constrói uma comparação"],["«Longe da lucta»","Caracteriza o afastamento do conflito"]],"f":"As marcas trabalham em conjunto: a voz aponta um destinatário, compara o seu recolhimento e situa-o longe da luta. Nomear o recurso só ajuda quando explicas o que faz neste contexto.","g":"m6-f13-3"},{"t":"ler","rot":"Lê de perto","titulo":"A mudança de tom","html":"<blockquote><p>Accorda! é tempo! O sol, já alto e pleno,</p><p>Afugentou as larvas tumulares…</p><p>Para surgir do seio d&#x27;esses mares,</p><p>Um mundo novo espera só um aceno…</p></blockquote><blockquote><p>Escuta! é a grande voz das multidões!</p><p>São teus irmãos, que se erguem! são canções…</p><p>Mas de guerra… e são vozes de rebate!</p><p>Ergue-te pois, soldado do Futuro,</p></blockquote><p>O apelo passa do recolhimento à urgência: acordar, escutar, erguer-se. «Larvas tumulares» associa-se a imagens de morte; «rebate» é um sinal de alarme. A imagem do «mundo novo» anuncia uma possibilidade coletiva, não uma notícia comprovada.</p>","g":"m6-f13-4"},{"t":"completar","p":"Relaciona a forma verbal com o efeito do apelo.","frase":"«Accorda!» e «Escuta!» são formas de [1]; contribuem para um tom de [2].","lacunas":[{"o":["imperativo","infinitivo"],"c":0},{"o":["exortação urgente","descrição indiferente"],"c":0}],"f":"Os imperativos procuram levar o destinatário a uma ação. As exclamações e «é tempo» reforçam a urgência. Isto é diferente de contar de modo indiferente algo que já aconteceu.","g":"m6-f13-5"},{"t":"escolha","p":"O que acrescentam «multidões» e «teus irmãos» ao chamamento?","o":["O apelo desloca o poeta de uma posição isolada para uma relação coletiva","O poema identifica o nome civil de cada pessoa","A voz afirma que todos têm os mesmos pais","O destinatário deixa de ser poeta e passa a narrador"],"c":0,"f":"«Irmãos» constrói uma relação de proximidade e solidariedade com a multidão. É uma pertença figurada: não um registo genealógico nem a identificação de todas as pessoas.","g":"m6-f13-6"},{"t":"ler","rot":"Lê de perto","titulo":"Uma espada feita de sonho","html":"<blockquote><p>Sonhador, faze espada de combate!</p></blockquote><p>Este é o último verso do soneto. O apelo final não manda apagar o sonho: procura convertê-lo em força de intervenção. A expressão «soldado do Futuro» e o vocabulário de combate dão ao apelo intensidade e conflito.</p><p>Uma metáfora pode mobilizar o leitor sem constituir, por si só, uma instrução literal. Importa explicar a relação que constrói, não substituí-la por um slogan.</p>","g":"m6-f13-7"},{"t":"escolha","p":"Que leitura do último verso se apoia melhor no seu contexto?","o":["O sonho deve desaparecer porque impede qualquer ação","O poeta deve transformar a força do sonho em intervenção","O verso descreve o fabrico material de uma arma","A voz pede apenas que o destinatário continue a dormir"],"c":1,"f":"«Sonhador» mantém o sonho na identidade do destinatário e «faze» pede transformação. A imagem aproxima criação e ação; a leitura literal do fabrico de armas ignora a relação metafórica com o sonhador.","g":"m6-f13-8"},{"t":"vf","p":"Neste poema, o uso de imagens de combate prova, por si só, que a voz recomenda uma ação armada literal.","v":false,"f":"Não. O vocabulário de combate é relevante para a intensidade do apelo, mas a «espada» liga-se metaforicamente ao sonho. Uma conclusão literal exigiria provas adicionais; não basta isolar uma palavra do contexto.","g":"m6-f13-9"},{"t":"ler","rot":"Lê de perto","titulo":"Comparar sem reduzir","html":"<p>Em «O Palácio da Ventura», o sujeito sonha ser um cavaleiro; a procura termina em «Silencio e escuridão — e nada mais!». Em «A um poeta», a voz pede ao sonhador que se erga. A primeira frase é um resumo nosso; o segmento entre aspas é o fecho do soneto na edição consultada.</p><p>Não transformes estes dois textos numa biografia linear nem numa regra para todos os poemas de Antero: compara as posições construídas em cada um.</p>","g":"m6-f13-10"},{"t":"escolha","p":"Qual comparação mantém a diferença entre os dois poemas?","o":["Antero deixou de pensar e passou definitivamente a agir","Todos os sonetos de Antero defendem a mesma atitude","A procura frustrada de um sujeito contrasta com o apelo à ação dirigido a outro destinatário","A presença de um sonhador prova que os dois finais são iguais"],"c":2,"f":"A comparação descreve o que os textos fazem: um apresenta a frustração da procura; o outro procura despertar um destinatário. Não permite concluir uma mudança biográfica definitiva nem generalizar a toda a obra.","g":"m6-f13-11"},{"t":"escolha","p":"Um comentário diz: «É um poema interventivo porque tem imperativos.» Qual desenvolvimento melhora a justificação?","o":["Repetir a etiqueta «interventivo» três vezes","Acrescentar que «Accorda» e «Escuta» chamam o poeta a aproximar-se das multidões","Afirmar que todo o imperativo pertence a Antero","Substituir os versos por uma opinião sobre o autor"],"c":1,"f":"A forma verbal precisa de ser ligada ao efeito e ao destinatário: os imperativos procuram deslocar o poeta do recolhimento para a vida coletiva. Assim, a prova deixa de ser uma lista de recursos e passa a sustentar uma interpretação.","g":"m6-f13-12"},{"t":"ler","rot":"Lê de perto","titulo":"Uma obra, várias posições","html":"<p>Uma leitura fundamentada liga a marca verbal ao seu efeito: a apóstrofe escolhe um destinatário; os imperativos procuram movê-lo; a metáfora transforma o sonho em força de intervenção. Isto amplia a imagem de Antero sem apagar os sonetos já estudados.</p><p>Antes de avançar, ensaia uma frase com uma prova de cada poema: «Os dois textos dão ao sonho funções diferentes porque ___.»</p><p>Antero de Quental, «A um poeta», <i>Os Sonetos Completos</i>, 1886. Recortes na grafia da transcrição, sem formar uma transcrição integral; explicações nossas. <a href=\"https://www.gutenberg.org/cache/epub/20142/pg20142-images.html\" target=\"_blank\" rel=\"noopener\">Consultar o soneto e o contexto da edição</a>.</p>","g":"m6-f13-13"}];var C=EPICasca.pagina();EPIJogo.montar({casca:C,el:document.getElementById("baralho"),itens:CARTOES,chave:K,marca:"M6",titulo:"O sonho pode pedir ação?",variar:false,gestalt:true,percurso:"../#m6-f13",seguinte:"../licao-m6-f11/",depois:'<div class="depois"><p><a href="../#m6-f13">Voltar a esta lição no percurso</a></p></div>',fim:function(){try{localStorage.setItem(K+"-a1",JSON.stringify({lida:true,t:Date.now()}))}catch(e){}}});try{localStorage.setItem("epi-ultima",JSON.stringify({id:"m6-f13",m:"M6",t:Date.now()}))}catch(e){}});</script><script defer src="../../assets/projection-launcher.js?v=20261019.4" data-site="pt"></script></body></html>
