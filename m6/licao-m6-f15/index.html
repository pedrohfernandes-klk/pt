<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m6-f15",CARTOES=[{"t":"ler","titulo":"Quem faz a rua","rot":"Abre","html":"<p class=\"abre\">Que revela o olhar sobre quem trabalha na cidade?<\/p><p class=\"abre\">Passas numa rua pronta. Quem a fez? Um poema pode tornar visível o trabalho e, ao mesmo tempo, revelar os limites de quem o observa.<\/p><p>Vais distinguir pormenor sensorial, imagem poética e avaliação em «Cristalizações».<\/p><figure class=\"fig documento\"><a href=\"../../img/fontes/cesario-verde-columbano-1887.jpg\" aria-label=\"Abrir a imagem inteira\"><img src=\"../../img/fontes/cesario-verde-columbano-1887.jpg\" alt=\"Retrato desenhado de Cesário Verde, com bigode, assinado por Columbano.\"><\/a><figcaption><p>Cesário Verde retratado por Columbano em 1887.<\/p><details><summary>Créditos e fonte da imagem<\/summary><table><caption>Identificação do documento visual<\/caption><tr><th scope=\"row\">Autor<\/th><td>Columbano Bordalo Pinheiro<\/td><\/tr><tr><th scope=\"row\">Obra<\/th><td>Retrato de Cesário Verde<\/td><\/tr><tr><th scope=\"row\">Data<\/th><td>1887<\/td><\/tr><tr><th scope=\"row\">Instituição ou acervo<\/th><td>Publicado em <i>O Livro de Cesário Verde<\/i>; reprodução no Wikimedia Commons.<\/td><\/tr><tr><th scope=\"row\">Licença<\/th><td><a href=\"https://commons.wikimedia.org/wiki/File:CesarioVerde_Columbano.jpg\">Domínio público<\/a><\/td><\/tr><\/table><p><a href=\"https://commons.wikimedia.org/wiki/File:CesarioVerde_Columbano.jpg\">Consultar a fonte e os direitos<\/a>. Reprodução redimensionada, sem recorte.<\/p><\/details><\/figcaption><\/figure>"},{"t":"vf","p":"Antes de reler. Recupera a leitura de Cesário na F12: os pormenores sensoriais podem coexistir com avaliações da voz que observa?","v":true,"f":"Confundir observação concreta e neutralidade apaga a seleção poética. Relê uma imagem da F12 e distingue o pormenor observado da relação que a voz constrói. Relê essa distinção na lição anterior depois de tentares responder.","g":"m6-f15-1"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>A poesia de Cesário Verde cruza observação da cidade, sensações e transformação imaginativa. O sujeito poético seleciona e interpreta: não funciona como uma câmara neutra.<\/p><p>Uma comparação pode tornar um corpo visível e também enquadrá-lo por um olhar social. A análise pergunta o que se observa e o que se projeta sobre o observado.<\/p>"},{"t":"ler","titulo":"O trabalho ganha forma","rot":"Lê e confronta","html":"<blockquote>«Faz frio. Mas, depois d’uns dias de aguaceiros,<br>Vibra uma immensa claridade crua.<br>De cocaras, em linha os calceteiros,<br>Com lentidão, terrosos e grosseiros,<br>Calcam de lado a lado a longa rua.»<\/blockquote><p>Cesário Verde, «Cristalizações» (na edição, «Crystalisações»), em <i>O Livro de Cesario Verde<\/i>, edição de Silva Pinto, Lisboa, 1887. Primeira estrofe, transcrição do <a href=\"https://www.gutenberg.org/cache/epub/8698/pg8698-images.html\" target=\"_blank\" rel=\"noopener\">Projeto Gutenberg, com o poema integral<\/a>. Conserva-se a grafia histórica; «de cocaras» corresponde a de cócoras.<\/p><p>A luz, a postura e os movimentos apresentam uma rua em construção. As palavras avaliativas também fazem parte desse enquadramento.<\/p>"},{"t":"escolha","p":"Que leitura articula sensação e trabalho?","o":["A luz e as posturas tornam o esforço visível.","A luz e as posturas tornam o esforço agradável.","A luz e as posturas exprimem a voz dos operários."],"c":0,"f":"A claridade acompanha corpos e ações. O poema não nos dá, por isso, acesso automático ao pensamento de cada trabalhador. Relê o cartão «O trabalho ganha forma» e confronta a pista com a tua resposta.","g":"m6-f15-4"},{"t":"vf","p":"A presença de pormenores observáveis torna o sujeito poético inteiramente neutro.","v":false,"f":"Selecionar pormenores e usar palavras avaliativas já constrói um olhar. A observação pode coexistir com interpretações e imagens. Relê o cartão «O trabalho ganha forma» e confronta a pista com a tua resposta.","g":"m6-f15-5"},{"t":"emparelhar","p":"Distingue os elementos da primeira estrofe.","pares":[["Faz frio","Sensação térmica"],["De cocaras","Postura corporal"],["terrosos e grosseiros","Caracterização pelo olhar da voz"]],"f":"Os elementos pertencem a planos diferentes e atuam em conjunto. A postura torna o trabalho concreto; a caracterização revela a maneira de o apresentar. Relê o cartão «O trabalho ganha forma» e confronta a pista com a tua resposta.","g":"m6-f15-6"},{"t":"ler","titulo":"O corpo e a imagem","rot":"Lê e confronta","html":"<blockquote>«Bom tempo. E os rapagões, morosos, duros, baços,<br>Cuja columna nunca se endireita,<br>Partem penedos; cruzam-se estilhaços.<br>Pesam enormemente os grossos maços,<br>Com que outros batem a calçada feita.»<\/blockquote><p>Cesário Verde, mesmo poema e edição. «Columna» corresponde a coluna; os maços são ferramentas usadas para bater. A postura curvada e o peso das ferramentas tornam sensível o esforço.<\/p><p>Mais adiante, o sujeito aproxima a roupa do povo de uma bandeira e lê nela sinais. Essa passagem transforma a observação em projeção simbólica, não numa opinião pronunciada pelos trabalhadores.<\/p><p><strong>Modelo completo.<\/strong> A postura curvada e o peso dos maços tornam o esforço sensível. A leitura simbólica da roupa acrescenta outra operação. A imagem pertence à voz que observa, não a uma declaração dos trabalhadores.<\/p>"},{"t":"completar","p":"Completa a distinção.","frase":"A ferramenta participa na [1] do trabalho; a bandeira é uma leitura [2].","lacunas":[{"o":["descrição","recordação","antevisão"],"c":0},{"o":["simbólica","documental","biográfica"],"c":0}],"f":"O trabalho fornece elementos concretos. A leitura simbólica nasce do modo como o sujeito os relaciona, e deve ser atribuída a esse olhar. Relê o cartão «O corpo e a imagem» e confronta a pista com a tua resposta.","g":"m6-f15-8"},{"t":"ordenar","p":"Ordena uma análise da representação do trabalho.","passos":["Localizar uma postura ou uma ferramenta","Explicar a sensação de esforço que produz","Identificar uma avaliação ou uma imagem","Distinguir o observado do que a voz projeta"],"f":"O percurso conserva o corpo concreto e interroga o enquadramento. Uma leitura apenas simbólica poderia apagar quem trabalha. Relê o cartão «O corpo e a imagem» e confronta a pista com a tua resposta.","g":"m6-f15-9"},{"t":"sublinhar","p":"Que palavra intensifica o esforço, em vez de indicar apenas a presença de ferramentas?","frase":"Pesam enormemente os grossos maços,","certas":[1],"f":"Enormemente intensifica o peso e contribui para a perceção do esforço. A escolha verbal transforma a informação numa experiência sensível. Relê o cartão «O corpo e a imagem» e confronta a pista com a tua resposta.","g":"m6-f15-10"},{"t":"escolha","p":"Que conclusão respeita a posição de quem observa?","o":["A voz interpreta os corpos através das imagens.","A voz recolhe nos corpos a opinião dos operários.","A voz descreve nos corpos uma identidade fixa."],"c":0,"f":"A imagem pertence à construção poética. Não deve ser atribuída aos trabalhadores como se eles a tivessem pronunciado ou confirmado. Relê o cartão «O corpo e a imagem» e confronta a pista com a tua resposta.","g":"m6-f15-11"},{"t":"vf","p":"Descrever a dureza do trabalho obriga a idealizar todos os comportamentos dos trabalhadores.","v":false,"f":"O reconhecimento do esforço não transforma as pessoas em figuras sem contradições. O poema pode apresentar relações e olhares desconfortáveis. Relê o cartão «O corpo e a imagem» e confronta a pista com a tua resposta.","g":"m6-f15-12"},{"t":"ler","titulo":"Uma atriz também vai trabalhar","rot":"Lê e confronta","html":"<p>Na parte final, surge uma atriz a caminho do ensaio. O poema mostra a atenção dos trabalhadores sobre ela e as dificuldades da passagem. Não basta classificá-la como uma figura sem trabalho: o destino indicado é o ensaio.<\/p><p>A cidade reúne corpos com tarefas e vulnerabilidades diferentes. A análise pode reconhecer o trabalho dos calceteiros sem apagar o desconforto produzido pelo olhar dirigido à mulher.<\/p><p>Contraexemplo à divisão entre trabalhadores e uma mulher que apenas passa: a atriz dirige-se ao ensaio. Critério: a interpretação social tem de explicar também o destino de trabalho explicitado no poema.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Distingue o destino da atriz, os olhares dirigidos a ela e o que não sabemos do seu pensamento. Que prova impede reduzi-la a uma presença decorativa?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Relaciona os planos da cena urbana.","pares":[["Calceteiros a preparar a rua","Trabalho material da cidade"],["Atriz a caminho do ensaio","Outro percurso de trabalho"],["Olhar dirigido à mulher","Relação que merece interpretação"]],"f":"Os planos coexistem. Reconhecer um não exige negar os outros, e a cena torna-se mais complexa quando se conservam essas relações. Relê o cartão «Uma atriz também vai trabalhar» e confronta a pista com a tua resposta.","g":"m6-f15-14"},{"t":"escolha","p":"Que mudança criativa testa os limites do olhar?","o":["Criar uma versão da rua vista pela atriz.","Imaginar a rua vista pelo sujeito, com outra cor.","Imaginar a rua vista pelo sujeito, noutra altura."],"c":0,"f":"Mudar para a perspetiva da atriz altera o acesso à cena. Confundir alteração de cor ou de momento com alteração de ponto de vista mantém a mesma posição de observação; a voz nova tem de ser identificada como criação. Relê o cartão «Uma atriz também vai trabalhar» e confronta a pista com a tua resposta.","g":"m6-f15-15"},{"t":"completar","p":"Completa uma regra de leitura.","frase":"A criação pode abrir uma [1]; a análise precisa de uma [2].","lacunas":[{"o":["hipótese","conclusão","sentença"],"c":0},{"o":["prova","ficção","lenda"],"c":0}],"f":"Imaginar e demonstrar são operações diferentes. A criação explora possibilidades; a análise sustenta o que afirma com elementos do texto. Relê o cartão «Uma atriz também vai trabalhar» e confronta a pista com a tua resposta.","g":"m6-f15-16"},{"t":"ordenar","p":"Ordena a ampliação do olhar sobre a rua e as pessoas que a atravessam.","passos":["A luz torna visíveis corpos e movimentos","As posturas e as ferramentas apresentam esforço","As imagens acrescentam o olhar do sujeito","A atriz introduz outro trabalho e outra vulnerabilidade"],"f":"A sequência liga os pormenores à interpretação e conserva o seu limite. Relê o modelo e o contraexemplo: Distingue o destino da atriz, os olhares dirigidos a ela e o que não sabemos do seu pensamento. Que prova impede reduzi-la a uma presença decorativa? Relê o cartão «Uma atriz também vai trabalhar» e confronta a pista com a tua resposta.","g":"m6-f15-17"},{"t":"escolha","p":"Que conclusão liga forma poética e relação social?","o":["As imagens mostram esforço e um olhar situado.","As imagens registam a opinião dita pelos operários.","As imagens traduzem o pensamento interior da atriz."],"c":0,"f":"A forma torna o esforço sensível e permite interrogar quem observa. Não fornece um retrato neutro nem uma experiência igual para todas as pessoas. Relê o cartão «Uma atriz também vai trabalhar» e confronta a pista com a tua resposta.","g":"m6-f15-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Que revela o olhar sobre quem trabalha na cidade?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
