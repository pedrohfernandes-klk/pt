window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m6-f15",CARTOES=[{"t":"ler","titulo":"Quem faz a rua","rot":"Abre","html":"<p class=\"abre\">Passas numa rua pronta. Quem a fez? Um poema pode tornar visível o trabalho e, ao mesmo tempo, revelar os limites de quem o observa.<\/p><p>Vais distinguir pormenor sensorial, imagem poética e avaliação em «Cristalizações».<\/p>"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>A poesia de Cesário Verde cruza observação da cidade, sensações e transformação imaginativa. O sujeito poético seleciona e interpreta: não funciona como uma câmara neutra.<\/p><p>Uma comparação pode tornar um corpo visível e também enquadrá-lo por um olhar social. A análise pergunta o que se observa e o que se projeta sobre o observado.<\/p>"},{"t":"ler","titulo":"O trabalho ganha forma","rot":"Lê e confronta","html":"<blockquote>«Faz frio. Mas, depois d’uns dias de aguaceiros,<br>Vibra uma immensa claridade crua.<br>De cocaras, em linha os calceteiros,<br>Com lentidão, terrosos e grosseiros,<br>Calcam de lado a lado a longa rua.»<\/blockquote><p>Cesário Verde, «Cristalizações» (na edição, «Crystalisações»), em <i>O Livro de Cesario Verde<\/i>, edição de Silva Pinto, Lisboa, 1887. Primeira estrofe, transcrição do <a href=\"https://www.gutenberg.org/cache/epub/8698/pg8698-images.html\" target=\"_blank\" rel=\"noopener\">Projeto Gutenberg, com o poema integral<\/a>. Conserva-se a grafia histórica; «de cocaras» corresponde a de cócoras.<\/p><p>A luz, a postura e os movimentos apresentam uma rua em construção. As palavras avaliativas também fazem parte desse enquadramento.<\/p>"},{"t":"escolha","p":"Que leitura articula sensação e trabalho?","o":["A luz e as posturas tornam o esforço visível.","A luz elimina qualquer presença humana na rua.","A luz demonstra a opinião de todos os operários."],"c":0,"f":"A claridade acompanha corpos e ações. O poema não nos dá, por isso, acesso automático ao pensamento de cada trabalhador.","g":"m6-f15-3"},{"t":"vf","p":"A presença de pormenores observáveis torna o sujeito poético inteiramente neutro.","v":false,"f":"Selecionar pormenores e usar palavras avaliativas já constrói um olhar. A observação pode coexistir com interpretações e imagens.","g":"m6-f15-4"},{"t":"emparelhar","p":"Distingue os elementos da primeira estrofe.","pares":[["Faz frio","Sensação térmica"],["De cocaras","Postura corporal"],["terrosos e grosseiros","Caracterização pelo olhar da voz"]],"f":"Os elementos pertencem a planos diferentes e atuam em conjunto. A postura torna o trabalho concreto; a caracterização revela a maneira de o apresentar.","g":"m6-f15-5"},{"t":"ler","titulo":"O corpo e a imagem","rot":"Lê e confronta","html":"<blockquote>«Bom tempo. E os rapagões, morosos, duros, baços,<br>Cuja columna nunca se endireita,<br>Partem penedos; cruzam-se estilhaços.<br>Pesam enormemente os grossos maços,<br>Com que outros batem a calçada feita.»<\/blockquote><p>Cesário Verde, mesmo poema e edição. «Columna» corresponde a coluna; os maços são ferramentas usadas para bater. A postura curvada e o peso das ferramentas tornam sensível o esforço.<\/p><p>Mais adiante, o sujeito aproxima a roupa do povo de uma bandeira e lê nela sinais. Essa passagem transforma a observação em projeção simbólica, não numa opinião pronunciada pelos trabalhadores.<\/p>"},{"t":"completar","p":"Completa a distinção.","frase":"A ferramenta participa na [1] do trabalho; a bandeira é uma leitura [2].","lacunas":[{"o":["descrição","recordação","antevisão"],"c":0},{"o":["simbólica","documental","biográfica"],"c":0}],"f":"O trabalho fornece elementos concretos. A leitura simbólica nasce do modo como o sujeito os relaciona, e deve ser atribuída a esse olhar.","g":"m6-f15-7"},{"t":"ordenar","p":"Ordena uma análise da representação do trabalho.","passos":["Localizar uma postura ou uma ferramenta","Explicar a sensação de esforço que produz","Identificar uma avaliação ou uma imagem","Distinguir o observado do que a voz projeta"],"f":"O percurso conserva o corpo concreto e interroga o enquadramento. Uma leitura apenas simbólica poderia apagar quem trabalha.","g":"m6-f15-8"},{"t":"sublinhar","p":"Seleciona a palavra que intensifica o peso das ferramentas.","frase":"Pesam enormemente os grossos maços,","certas":[1],"f":"Enormemente intensifica o peso e contribui para a perceção do esforço. A escolha verbal transforma a informação numa experiência sensível.","g":"m6-f15-9"},{"t":"escolha","p":"Que conclusão respeita a posição de quem observa?","o":["A voz interpreta os corpos através das suas imagens.","Os corpos confirmam uma opinião dita por todos eles.","A voz regista todos os pormenores sem fazer escolhas."],"c":0,"f":"A imagem pertence à construção poética. Não deve ser atribuída aos trabalhadores como se eles a tivessem pronunciado ou confirmado.","g":"m6-f15-10"},{"t":"vf","p":"Descrever a dureza do trabalho obriga a idealizar todos os comportamentos dos trabalhadores.","v":false,"f":"O reconhecimento do esforço não transforma as pessoas em figuras sem contradições. O poema pode apresentar relações e olhares desconfortáveis.","g":"m6-f15-11"},{"t":"ler","titulo":"Uma atriz também vai trabalhar","rot":"Lê e confronta","html":"<p>Na parte final, surge uma atriz a caminho do ensaio. O poema mostra a atenção dos trabalhadores sobre ela e as dificuldades da passagem. Não basta classificá-la como uma figura sem trabalho: o destino indicado é o ensaio.<\/p><p>A cidade reúne corpos com tarefas e vulnerabilidades diferentes. A análise pode reconhecer o trabalho dos calceteiros sem apagar o desconforto produzido pelo olhar dirigido à mulher.<\/p>"},{"t":"emparelhar","p":"Relaciona os planos da cena urbana.","pares":[["Calceteiros a preparar a rua","Trabalho material da cidade"],["Atriz a caminho do ensaio","Outro percurso de trabalho"],["Olhar dirigido à mulher","Relação que merece interpretação"]],"f":"Os planos coexistem. Reconhecer um não exige negar os outros, e a cena torna-se mais complexa quando se conservam essas relações.","g":"m6-f15-13"},{"t":"escolha","p":"Que mudança criativa testa os limites do olhar?","o":["Imaginar a rua vista pela atriz, como texto criado.","Atribuir à atriz pensamentos inventados como citação.","Apagar os operários e chamar ao resultado uma prova."],"c":0,"f":"Uma perspetiva criada pode explorar o que o poema não revela, desde que seja identificada como criação. Não se confunde com informação da obra.","g":"m6-f15-14"},{"t":"completar","p":"Completa uma regra de leitura.","frase":"A criação pode abrir uma [1]; a análise precisa de uma [2].","lacunas":[{"o":["hipótese","certeza","memória"],"c":0},{"o":["prova","ficção","lenda"],"c":0}],"f":"Imaginar e demonstrar são operações diferentes. A criação explora possibilidades; a análise sustenta o que afirma com elementos do texto.","g":"m6-f15-15"},{"t":"ordenar","p":"Planeia uma comparação com outro poema urbano.","passos":["Escolher uma figura de trabalho em cada poema","Observar os pormenores sensoriais","Comparar as avaliações de cada voz","Concluir sobre a visibilidade dada às pessoas"],"f":"Comparar a cidade não é apenas contar ruas ou edifícios. O modo de tornar pessoas visíveis pode revelar diferenças decisivas entre os poemas.","g":"m6-f15-16"},{"t":"escolha","p":"Que conclusão liga forma poética e relação social?","o":["As imagens mostram esforço e revelam um olhar situado.","As imagens substituem as pessoas por factos sem interpretação.","As imagens garantem que todos se sentem da mesma maneira."],"c":0,"f":"A forma torna o esforço sensível e permite interrogar quem observa. Não fornece um retrato neutro nem uma experiência igual para todas as pessoas.","g":"m6-f15-17"},{"t":"vf","p":"Reconhecer o olhar situado da voz impede-nos de estudar os pormenores concretos do trabalho.","v":false,"f":"Os pormenores continuam a ser essenciais. A leitura ganha rigor ao relacionar aquilo que é observado com a forma como é selecionado e interpretado.","g":"m6-f15-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Ver quem faz a cidade também exige perguntar quem está a olhar.<\/p><p>Relaciona uma ferramenta, uma sensação e uma avaliação. Explica por que razão a atriz não deve ser reduzida a uma figura que apenas passa.<\/p>"}];
