<script id="exame-aquecimento-dados" type="application/json">{"sessao": "s06", "versao": 1, "titulo": "Vieira: os peixes são o argumento", "cartoes": [{"t": "ler", "titulo": "Texto para consultar", "html": "<p>Consulta o texto quando precisares de confirmar uma escolha.<\/p><details><summary>Abrir o texto de apoio<\/summary><p class=\"pr\" data-l=\"0-0\"><b>[1]<\/b> Ou é porque o sal não salga, e os pregadores não pregam a verdadeira doutrina; ou porque a terra se não deixa salgar, e os ouvintes, sendo verdadeira a doutrina que lhes dão, a não querem receber.<\/p><p class=\"pr\" data-l=\"0-1\"><b>[2]<\/b> Enfim, que havemos de pregar hoje aos peixes? Nunca pior auditório. Ao menos têm os peixes duas boas qualidades de ouvintes: ouvem e não falam.<\/p><p class=\"pr\" data-l=\"0-2\"><b>[3]<\/b> Uma é louvar o bem, outra repreender o mal: louvar o bem para o conservar e repreender o mal para preservar dele.<\/p><p class=\"fonte\">Vieira, <i>Sermão de Santo António<\/i> (1654), caps. I e II, ortografia atualizada.<\/p><p class=\"pr\" data-l=\"1-0\"><b>[1]<\/b> É possível que, sendo vós uns peixinhos tão pequenos, haveis de ser as roncas do mar?<\/p><p class=\"pr\" data-l=\"1-1\"><b>[2]<\/b> Pegadores chamam-se estes de que agora falo, e com grande propriedade, porque, sendo pequenos, não só se chegam a outros maiores, mas de tal sorte se lhes pegam aos costados, que nunca os desferram. […] e assim lhes sustenta o peso e mais a fome.<\/p><p class=\"pr\" data-l=\"1-2\"><b>[3]<\/b> Dizei-me, voadores, não vos fez Deus peixes? Pois porque vos quereis ser aves? […] ao voador mata-o a vaidade de voar, e a sua isca é o vento.<\/p><p class=\"fonte\">Vieira, <i>Sermão de Santo António<\/i> (1654), cap. V, ortografia atualizada.<\/p><p class=\"pr\" data-l=\"2-0\"><b>[4]<\/b> O polvo, com aquele seu capelo na cabeça, parece um monge; com aqueles seus raios estendidos, parece uma estrela; como não tem osso nem espinha, parece a mesma brandura, a mesma mansidão. […] o outro peixe, inocente da traição, vai passando desacautelado, e o salteador, que está de emboscada dentro do seu próprio engano, lança-lhe os braços de repente, e fá-lo prisioneiro.<\/p><p class=\"fonte\">Vieira, <i>Sermão de Santo António<\/i> (1654), cap. V, ortografia atualizada.<\/p><p class=\"fonte\"><a href=\"../../../m4/licao-m4-f25/\">Texto e fontes na lição de origem<\/a><\/p><\/details>", "recycledFrom": "/pt/m4/licao-m4-f25/"}, {"p": "Na alegoria do sal, quem pode falhar?", "f": "As duas responsabilidades: «o sal não salga» (os pregadores) ou «a terra se não deixa salgar» (os ouvintes). O texto nomeia os dois.", "legacyId": "s06-q1", "recycledFrom": "/pt/m4/licao-m4-f25/", "t": "escolha", "o": ["Quem prega ou quem recebe a pregação.", "Só quem ouve, nunca quem faz o sermão.", "Só quem prega, nunca quem ouve o sermão."], "c": 0, "fe": [null, "A primeira alternativa do sermão responsabiliza quem prega.", "A segunda alternativa responsabiliza quem recusa ouvir."]}, {"p": "Louvar os peixes por ouvirem calados é também uma crítica aos homens.", "f": "Verdadeiro: o contraste faz a qualidade dos peixes corrigir os homens, que falam e não ouvem. «Nunca pior auditório» é irónico.", "legacyId": "s06-q2", "recycledFrom": "/pt/m4/licao-m4-f25/", "t": "vf", "v": true, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"p": "«Haveis de ser as roncas do mar?»: que contraste faz a censura?", "f": "Pequenez contra ruído: a pergunta retórica já contém o juízo. Não se quer medir o som; censura-se o fanfarrão.", "legacyId": "s06-q3", "recycledFrom": "/pt/m4/licao-m4-f25/", "t": "escolha", "o": ["Pouco tamanho e muita fanfarronice.", "Grande tamanho e excessiva timidez.", "Pouco tamanho e excessiva modéstia."], "c": 0, "fe": [null, "A censura refere o pequeno tamanho, não a grandeza.", "O contraste é entre pequenez e ruído, não entre pequenez e modéstia."]}, {"t": "emparelhar", "p": "Ironia, mentira ou diz o que pensa? Arruma cada fala pela situação.", "pares": [["Perdes o autocarro por um minuto: «Que sorte a minha!»", "ironia"], ["Ganhas a rifa da turma: «Que sorte a minha!»", "diz o que pensa"], ["Sem o trabalho feito, à docente: «Deixei-o em casa.»", "mentira"], ["Depois do teste mais difícil do ano: «Que teste tão fácil!»", "ironia"]], "f": "A ironia quer ser apanhada: o autocarro perdido e o teste difícil mostram o contrário do que se diz. Com a rifa, a mesma frase é à letra. Quem mente quer que acreditem.", "fe": "Olha primeiro para a situação: é ela que mostra se a frase diz o contrário do que se pensa.", "recycledFrom": "/pt/m4/licao-m4-f25/", "sourceCard": 8}, {"t": "emparelhar", "p": "Que vício dos peixes prova cada passagem? Uma delas louva-os.", "pares": [["«peixinhos tão pequenos», «as roncas do mar»", "fazer mais barulho do que se vale"], ["«Pois porque vos quereis ser aves?»", "querer ser mais do que se é"], ["«parece um monge» e «lança-lhe os braços de repente»", "trair com cara de bondade"], ["«ouvem e não falam»", "nenhum: é um louvor"]], "f": "Os roncadores são pequenos e fazem barulho; o voador quer ser ave, sendo peixe; o polvo parece manso e ataca de emboscada. «Ouvem e não falam» não repreende os peixes: louva-os, e a farpa vai para os homens.", "fe": "Pergunta a cada passagem: que gesto do peixe mostra, e esse gesto é um defeito?", "recycledFrom": "/pt/m4/licao-m4-f25/", "sourceCard": 15}, {"t": "vf", "p": "Uma resposta cheia de citações está necessariamente bem fundamentada.", "v": false, "f": "Falso: **uma citação só apoia a ideia quando explicas a ligação**, respeitas o contexto e não escondes uma objeção decisiva. Uma prova explicada vale mais do que cinco copiadas.", "fe": "É falso: uma citação só apoia a ideia quando explicas a ligação; cinco citações copiadas não valem uma explicada.", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 11}, {"t": "emparelhar", "p": "Que verbo cumpre cada resposta: identifica, explica ou compara?", "pares": [["«Há uma alegoria.»", "identifica"], ["«Há uma apóstrofe: “Olhai, peixes”.»", "identifica"], ["«Os grandes que comem os pequenos são os poderosos.»", "explica"], ["«Nos dois, alguém orienta o olhar: Vieira para a cidade, Maria para o retrato.»", "compara"]], "f": "«Há uma alegoria» e «Há uma apóstrofe» só dão o nome do recurso: cumprem «identifica». Dizer quem são os grandes é explicar o que a imagem quer dizer. Juntar Vieira e Maria pelo mesmo gesto, orientar o olhar, é comparar.", "fe": "Pergunta a cada resposta: dá só o nome, diz o que significa, ou junta os dois textos?", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 14}, {"t": "sublinhar", "p": "No exemplo imaginário, toca no facto que permite reconhecer a ironia.", "frase": "Perdes o autocarro e dizes: «Que sorte a minha!»", "certas": [0, 1, 2], "f": "Perder o autocarro contraria o elogio à sorte. A ironia depende da relação entre a fala e a situação.", "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "recycledFrom": "/pt/m4/licao-m4-f25/", "sourceCard": 8, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "completar", "p": "Completa os dois testes da ironia.", "frase": "Primeiro observas o que a fala [1]; depois verificas se a situação [2] o sentido literal.", "lacunas": [{"o": ["afirma", "sugere"], "c": 0, "fe": [null, "Nesta lacuna, sugere não corresponde à relação pedida."]}, {"o": ["contraria", "corrobora"], "c": 0, "fe": [null, "Nesta lacuna, corrobora não corresponde à relação pedida."]}], "f": "Na ironia, o sentido literal é contrariado pela situação. Não basta haver uma frase falsa: importa que o destinatário reconheça o contraste.", "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "recycledFrom": "/pt/m4/licao-m4-f25/", "sourceCard": 8, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "ordenar", "p": "Ordena os passos para explicar uma imagem do sermão.", "passos": ["Localizar a imagem no excerto", "Identificar a relação que a imagem apresenta", "Relacionar essa relação com o comportamento humano", "Explicar o efeito da imagem na crítica"], "f": "Nomear alegoria não explica a crítica. Parte da relação apresentada e mostra como ela passa dos peixes aos homens.", "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 3, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "vf", "p": "Dizer apenas que há uma alegoria explica por completo a crítica de Vieira.", "v": false, "f": "Alegoria dá o nome do recurso. Falta mostrar que relação existe na imagem e que comportamento humano ela permite criticar.", "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 3, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "sublinhar", "p": "No exemplo imaginário, toca na palavra que exige uma justificação da ligação.", "frase": "A imagem aproxima os dois comportamentos porque partilham a mesma relação.", "certas": [6], "f": "Porque anuncia uma razão. Depois dele, a resposta tem de explicar a relação, não apenas repetir o nome do recurso.", "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 3, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}]}</script>
