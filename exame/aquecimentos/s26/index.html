<script id="exame-aquecimento-dados" type="application/json">{"sessao": "s26", "versao": 1, "titulo": "Oficina final: transformar uma resposta", "cartoes": [{"t": "ler", "rot": "Abre", "titulo": "Aquecer", "html": "<p class=\"abre-t\">Oficina final: transformar uma resposta<\/p><p><b>Objetivo:<\/b> diagnosticar, reescrever e justificar alterações.<\/p><p>Doze cartões, dez minutos. A seguir, voltas à sessão para ler e escrever no caderno.<\/p>", "recycledFrom": "/pt/exame/", "adaptacao": "Cartão de abertura da sessão (02/11/2026)."}, {"p": "Que pergunta deve vir primeiro ao rever uma resposta?", "f": "A revisão começa pela adequação ao pedido e pelo conteúdo. Uma frase correta não compensa uma resposta a outra pergunta.", "legacyId": "s26-q1", "recycledFrom": "/pt/m9/licao-m9-f07/", "t": "escolha", "o": ["Respondi ao que foi pedido?", "Usei um vocabulário elaborado?", "Escrevi o máximo possível?"], "c": 0, "fe": [null, "Vocabulário elaborado não garante adequação ao pedido.", "Extensão não garante que respondeste à pergunta."]}, {"t": "vf", "p": "Na resposta de treino _A personagem hesita; portanto, mente_, trocar «portanto» por «talvez porque» torna a conclusão mais rigorosa.", "v": true, "f": "Verdadeiro: «portanto» apresenta a mentira como consequência certa da hesitação; «talvez porque» faz dela uma hipótese, que é o que uma hesitação permite. A revisão ajusta a força da conclusão à prova.", "fe": "Responder «falso» é achar que trocar o conector só muda a forma. Aqui muda a força: com «portanto», a hesitação prova a mentira; com «talvez porque», só a torna possível.", "recycledFrom": "/pt/m9/licao-m9-f07/", "adaptacao": "Cartão novo sobre a operação da sessão, no lugar de um cartão repetido de outra sessão (02/11/2026)."}, {"t": "emparelhar", "p": "Liga cada problema da resposta à pergunta de revisão que o deteta.", "pares": [["A resposta fala de outra personagem", "Respondi ao que foi pedido?"], ["A citação fica sem comentário", "Expliquei o que a prova mostra?"], ["O pronome «ela» pode ser duas pessoas", "Cada pronome tem um referente claro?"]], "f": "Cada pergunta de revisão apanha um problema: a adequação ao pedido, a prova explicada, o referente claro. Fazê-las por esta ordem é rever do sentido para a forma.", "fe": "Trocaste problema e pergunta. Pergunta-te o que falha em cada caso: o pedido, a explicação da prova ou o referente do pronome.", "recycledFrom": "/pt/m9/licao-m9-f07/", "adaptacao": "Cartão novo sobre a operação da sessão, no lugar de um cartão repetido de outra sessão (02/11/2026)."}, {"t": "sublinhar", "p": "Nesta resposta de treino, toca no nome que se repete sem necessidade, sempre que aparece.", "frase": "A personagem é ambiciosa. A personagem quer subir. A personagem casa por interesse.", "certas": [1, 5, 9], "f": "**Personagem**, três vezes: a repetição não acrescenta nada. Reescrever é ligar as frases e retomar com um pronome quando o referente é claro, como em _A personagem é ambiciosa: quer subir e casa por interesse._", "fe": "Marcaste os artigos ou as qualidades, não o nome repetido. Lê só o começo de cada frase: o mesmo nome volta três vezes.", "recycledFrom": "/pt/m9/licao-m9-f07/", "adaptacao": "Cartão novo sobre a operação da sessão, no lugar de um cartão repetido de outra sessão (02/11/2026)."}, {"p": "Qual destas notas explica uma revisão?", "f": "«Nomeei o antecedente e desfiz a ambiguidade» identifica a operação e o efeito que produziu na leitura.", "legacyId": "s26-q2", "recycledFrom": "/pt/m9/licao-m9-f07/", "t": "escolha", "o": ["Nomeei o antecedente e desfiz a ambiguidade.", "Mudei as palavras para o texto ficar mais bonito.", "Troquei palavras sem explicar o meu motivo."], "c": 0, "fe": [null, "«Bonito» não identifica o problema resolvido.", "Uma lista de trocas sem motivo não explica a revisão."]}, {"t": "completar", "p": "Completa os critérios para corrigir uma interpretação.", "frase": "A [1] deve sustentar a ideia; o [2] liga as frases, mas não cria essa sustentação.", "lacunas": [{"o": ["prova", "forma", "frase"], "c": 0, "fe": [null, "A forma da frase não sustenta nada; o que sustenta a ideia é a prova.", "Uma frase bem feita não basta; a ideia sustenta-se com uma prova do texto."]}, {"o": ["conector", "contexto", "parágrafo"], "c": 0, "fe": [null, "O contexto ajuda a ler a prova; o que liga as frases é o conector, e ligar não é provar.", "O parágrafo organiza o texto; a palavra que liga as frases é o conector."]}], "f": "Uma ligação verbal não transforma um indício insuficiente numa prova. Olha para a passagem e verifica exatamente o que ela permite concluir.", "fe": "Trocaste prova e ligação. A prova sustenta a ideia; o conector só liga as frases, e uma boa ligação não substitui a prova.", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 8, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "ordenar", "p": "Ordena uma revisão que começa pelo sentido.", "passos": ["Confrontar a resposta com o pedido", "Verificar a prova de cada afirmação", "Resolver referentes e ligações ambíguas", "Rever pontuação e ortografia"], "f": "Uma frase bem escrita pode não responder ao pedido. Revê primeiro a adequação e a fundamentação, antes dos pormenores de forma.", "fe": "Começaste pela forma. Primeiro confrontas a resposta com o pedido, depois a prova de cada afirmação, a seguir referentes e ligações; pontuação e ortografia ficam para o fim.", "recycledFrom": "/pt/m2/licao-m2-f08/", "sourceCard": 18, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "sublinhar", "p": "No exemplo imaginário, toca no pronome cujo referente precisas de esclarecer.", "frase": "A Ana falou com a Rita quando ela chegou.", "certas": [7], "f": "«Ela» pode remeter para Ana ou Rita. Nomear quem chegou desfaz a ambiguidade sem mudar o acontecimento.", "fe": "Marcaste um nome, não o pronome que pode remeter para as duas. Procura a palavra que vem depois de «quando».", "recycledFrom": "/pt/m5/licao-m5-f07/", "sourceCard": 10, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"p": "Se uma citação não é comentada, o que pode faltar?", "f": "A prova textual precisa de ser ligada ao argumento. A simples presença de aspas não demonstra uma interpretação.", "legacyId": "s26-q3", "recycledFrom": "/pt/m9/licao-m9-f07/", "t": "escolha", "o": ["A ligação entre prova e interpretação.", "A repetição exata da citação escolhida.", "A indicação de vários autores adicionais."], "c": 0, "fe": [null, "Copiar de novo não explica a prova.", "Acrescentar autores não relaciona a passagem com a interpretação."]}, {"t": "vf", "p": "Trocar um pronome pelo nome pode piorar um texto quando o referente já é claro.", "v": true, "f": "Verdadeiro: a substituição é útil quando elimina uma ambiguidade. Quando o referente já é claro, pode apenas criar repetição desnecessária.", "fe": "Responder «falso» é achar que o nome é sempre mais claro. Quando o referente já se percebe, repetir o nome só acrescenta peso; a troca ajuda quando há ambiguidade.", "recycledFrom": "/pt/m5/licao-m5-f07/", "sourceCard": 10, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "emparelhar", "p": "Liga cada alteração ao problema que resolve.", "pares": [["Nomear quem chegou", "Referente ambíguo"], ["Explicar o alcance da citação", "Prova sem comentário"], ["Retirar uma generalização sem apoio", "Conclusão excessiva"]], "f": "O comentário da revisão deve dizer que problema foi resolvido. Trocar palavras sem explicar a razão não mostra esse trabalho.", "fe": "Trocaste alteração e problema. Nomear quem chegou resolve a ambiguidade; explicar a citação resolve a prova sem comentário; retirar a generalização resolve a conclusão excessiva.", "recycledFrom": "/pt/m2/licao-m2-f08/", "sourceCard": 7, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "sublinhar", "p": "No exemplo imaginário, toca na palavra que generaliza para além de uma única cena.", "frase": "A personagem hesitou só nesta cena e, logo, mente sempre.", "certas": [9], "f": "«Sempre» alarga uma observação a todas as situações. Uma hesitação nesta cena não prova mentira constante.", "fe": "Marcaste a conclusão, não a palavra que a estende a todas as cenas. Está no fim da frase.", "recycledFrom": "/pt/m2/licao-m2-f08/", "sourceCard": 7, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}]}</script>
