 ideia quando explicas a ligação; cinco citações copiadas não valem uma explicada.", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 11}, {"t": "emparelhar", "p": "Que verbo cumpre cada resposta: identifica, explica ou compara?", "pares": [["«Há uma alegoria.»", "identifica"], ["«Há uma apóstrofe: “Olhai, peixes”.»", "identifica"], ["«Os grandes que comem os pequenos são os poderosos.»", "explica"], ["«Nos dois, alguém orienta o olhar: Vieira para a cidade, Maria para o retrato.»", "compara"]], "f": "«Há uma alegoria» e «Há uma apóstrofe» só dão o nome do recurso: cumprem «identifica». Dizer quem são os grandes é explicar o que a imagem quer dizer. Juntar Vieira e Maria pelo mesmo gesto, orientar o olhar, é comparar.", "fe": "Pergunta a cada resposta: dá só o nome, diz o que significa, ou junta os dois textos?", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 14}, {"t": "sublinhar", "p": "Toca nas duas palavras do modificador do grupo verbal.", "frase": "«Teresa ergueu-se sem lágrimas.»", "certas": [2, 3], "f": "**«sem lágrimas»**: «Teresa ergueu-se» aguenta-se sozinha; o que se corta é modificador do grupo verbal.", "recycledFrom": "/pt/m5/licao-m5-f07/", "sourceCard": 4, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "completar", "p": "Completa os critérios para corrigir uma interpretação.", "frase": "A [1] deve sustentar a ideia; o [2] liga as frases, mas não cria essa sustentação.", "lacunas": [{"o": ["prova", "forma"], "c": 0, "fe": [null, "Nesta lacuna, forma não corresponde à relação pedida."]}, {"o": ["conector", "contexto"], "c": 0, "fe": [null, "Nesta lacuna, contexto não corresponde à relação pedida."]}], "f": "Uma ligação verbal não transforma um indício insuficiente numa prova. Olha para a passagem e verifica exatamente o que ela permite concluir.", "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 8, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "ordenar", "p": "Ordena uma revisão que começa pelo sentido.", "passos": ["Confrontar a resposta com o pedido", "Verificar a prova de cada afirmação", "Resolver referentes e ligações ambíguas", "Rever pontuação e ortografia"], "f": "Uma frase bem escrita pode não responder ao pedido. Revê primeiro a adequação e a fundamentação, antes dos pormenores de forma.", "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "recycledFrom": "/pt/m2/licao-m2-f08/", "sourceCard": 18, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "sublinhar", "p": "No exemplo imaginário, toca no pronome cujo referente precisas de esclarecer.", "frase": "A Ana falou com a Rita quando ela chegou.", "certas": [7], "f": "Ela pode remeter para Ana ou Rita. Nomear quem chegou desfaz a ambiguidade sem mudar o acontecimento.", "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "recycledFrom": "/pt/m5/licao-m5-f07/", "sourceCard": 10, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "vf", "p": "Substituir sempre os pronomes pelos nomes torna qualquer texto melhor.", "v": false, "f": "A substituição é útil quando elimina uma ambiguidade. Quando o referente já é claro, pode apenas criar repetição desnecessária.", "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "recycledFrom": "/pt/m5/licao-m5-f07/", "sourceCard": 10, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "emparelhar", "p": "Liga cada alteração ao problema que resolve.", "pares": [["Nomear quem chegou", "Referente ambíguo"], ["Explicar o alcance da citação", "Prova sem comentário"], ["Retirar uma generalização sem apoio", "Conclusão excessiva"]], "f": "O comentário da revisão deve dizer que problema foi resolvido. Trocar palavras sem explicar a razão não mos
