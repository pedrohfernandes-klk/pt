<script id="exame-aquecimento-dados" type="application/json">{"sessao": "s11", "versao": 1, "titulo": "Cesário: uma cidade em transformação", "cartoes": [{"t": "ler", "rot": "Abre", "titulo": "Aquecer", "html": "<p class=\"abre-t\">Cesário: uma cidade em transformação<\/p><p><b>Objetivo:<\/b> relacionar perceção, percurso e crítica social.<\/p><p>Doze cartões, dez minutos. O texto de apoio está no cartão seguinte. A seguir, voltas à sessão para ler e escrever no caderno.<\/p>", "recycledFrom": "/pt/exame/", "adaptacao": "Cartão de abertura da sessão (02/11/2026)."}, {"t": "ler", "titulo": "Texto para consultar", "html": "<p>Consulta o texto quando precisares de confirmar uma escolha.<\/p><details><summary>Abrir o texto de apoio<\/summary><div><p class=\"v\"><span class=\"ln\" data-l=\"0-0\">Toca-se as grades, nas cadeias. Som<\/span>\n<span class=\"ln\" data-l=\"0-1\">Que mortifica e deixa umas loucuras mansas!<\/span>\n<span class=\"ln\" data-l=\"0-2\">O aljube, em que hoje estão velhinhas e creanças,<\/span>\n<span class=\"ln\" data-l=\"0-3\">Bem raramente encerra uma mulher de «dom»!<\/span><\/p><p class=\"v\"><span class=\"ln\">[…]<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"0-15\">Duas egrejas, n'um saudoso largo,<\/span>\n<span class=\"ln\" data-l=\"0-16\">Lançam a nodoa negra e funebre do clero:<\/span>\n<span class=\"ln\" data-l=\"0-17\">N'ellas esfumo um ermo inquisidor severo,<\/span>\n<span class=\"ln\" data-l=\"0-18\">Assim que pela Historia eu me aventuro e alargo.<\/span><\/p><p class=\"v\"><span class=\"ln\">[…]<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"0-25\">Mas, n'um recinto publico e vulgar,<\/span>\n<span class=\"ln\" data-l=\"0-26\">Com bancos de namoro e exiguas pimenteiras,<\/span>\n<span class=\"ln\" data-l=\"0-27\">Bronzeo, monumental, de proporções guerreiras,<\/span>\n<span class=\"ln\" data-l=\"0-28\">Um épico d'outr'ora ascende, n'um pilar!<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"0-30\">E eu sonho o Colera, imagina a Febre,<\/span>\n<span class=\"ln\" data-l=\"0-31\">N'esta accumulação de corpos enfezados;<\/span>\n<span class=\"ln\" data-l=\"0-32\">Sombrios e espectraes recolhem os soldados;<\/span>\n<span class=\"ln\" data-l=\"0-33\">Inflamma-se um palacio em face de um casebre.<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"0-35\">Partem patrulhas de cavallaria<\/span>\n<span class=\"ln\" data-l=\"0-36\">Dos arcos dos quarteis que foram já conventos;<\/span>\n<span class=\"ln\" data-l=\"0-37\">Edade-média! A pé, outras, a passos lentos,<\/span>\n<span class=\"ln\" data-l=\"0-38\">Derramam-se por toda a capital, que esfria.<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"0-40\">Triste cidade! Eu temo que me avives<\/span>\n<span class=\"ln\" data-l=\"0-41\">Uma paixão defunta! Aos lampeões distantes,<\/span>\n<span class=\"ln\" data-l=\"0-42\">Enlutam-me, alvejando, as tuas elegantes,<\/span>\n<span class=\"ln\" data-l=\"0-43\">Curvadas a sorrir ás montras dos ourives.<\/span><\/p><p class=\"fonte\">Cesário Verde, «O Sentimento dum Ocidental», II. «Noite Fechada», <i>O Livro de Cesário Verde<\/i> (1887) (grafia da edição); estrofes escolhidas, cortes marcados com […].<\/p><p class=\"v\"><span class=\"ln\" data-l=\"1-20\">«Dó da miseria!... Compaixão de mim!...»<\/span>\n<span class=\"ln\" data-l=\"1-21\">E, nas esquinas, calvo, eterno, sem repouso,<\/span>\n<span class=\"ln\" data-l=\"1-22\">Pede-me sempre esmola um homemzinho idoso,<\/span>\n<span class=\"ln\" data-l=\"1-23\">Meu velho professor nas aulas de latim!<\/span><\/p><p class=\"fonte\">Cesário Verde, «O Sentimento dum Ocidental», III. «Ao Gás», <i>O Livro de Cesário Verde<\/i> (1887) (grafia da edição); uma estrofe.<\/p><p class=\"v\"><span class=\"ln\" data-l=\"2-5\">Por baixo, que portões! Que arruamentos!<\/span>\n<span class=\"ln\" data-l=\"2-6\">Um parafuso cáe nas lages, ás escuras:<\/span>\n<span class=\"ln\" data-l=\"2-7\">Collocam-se taipaes, rangem as fechaduras,<\/span>\n<span class=\"ln\" data-l=\"2-8\">E os olhos d'um caleche espantam-me, sangrentos.<\/span><\/p><p class=\"v\"><span class=\"ln\">[…]<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"2-15\">Se eu não morresse, nunca! E eternamente<\/span>\n<span class=\"ln\" data-l=\"2-16\">Buscasse e conseguisse a perfeição das cousas!<\/span>\n<span class=\"ln\" data-l=\"2-17\">Esqueço-me a prever castissimas esposas,<\/span>\n<span class=\"ln\" data-l=\"2-18\">Que aninhem em mansões de vidro transparente!<\/span><\/p><p class=\"fonte\">Cesário Verde, «O Sentimento dum Ocidental», IV. «Horas Mortas», <i>O Livro de Cesário Verde<\/i> (1887) (grafia da edição); estrofes escolhidas, cortes marcados com […].<\/p><p class=\"fonte\"><a href=\"../../../m6/licao-m6-f07/\" target=\"_blank\" rel=\"noopener\">Texto e fontes na lição de origem<\/a><\/p><\/div><\/details>", "recycledFrom": "/pt/m6/licao-m6-f07/", "rot": "Texto de apoio"}, {"p": "Como abre «Noite Fechada» e que imagem dá da cidade?", "f": "«Toca-se as grades, nas cadeias»: a noite fecha-se e a cidade ganha grades.", "legacyId": "s11-q1", "recycledFrom": "/pt/m6/licao-m6-f07/", "t": "escolha", "o": ["Grades de cadeias: a cidade aprisiona.", "Sinos das igrejas: a cidade consola.", "Luzes das montras: a cidade deslumbra."], "c": 0, "fe": [null, "As igrejas não são a imagem que abre esta parte.", "As montras surgem no percurso, mas não constituem a abertura."]}, {"t": "versos", "p": "Põe os versos da estrofe das duas igrejas pela ordem.", "linhas": ["Duas egrejas, n'um saudoso largo,", "Lançam a nodoa negra e funebre do clero:", "N'ellas esfumo um ermo inquisidor severo,", "Assim que pela Historia eu me aventuro e alargo."], "f": "As igrejas, a nódoa do clero, o inquisidor imaginado, a viagem pela História.", "recycledFrom": "/pt/m6/licao-m6-f07/", "sourceCard": 7, "fe": "Trocaste a ordem da estrofe. Primeiro as duas igrejas no largo, depois a «nodoa» do clero, a seguir o inquisidor que o sujeito imagina, e só no fim a viagem pela História."}, {"t": "completar", "p": "Que antítese social fecha a estrofe do Cólera e da Febre?", "frase": "A luz de um [1] diante de um [2] põe riqueza e miséria lado a lado.", "lacunas": [{"o": ["palácio", "convento", "quartel"], "c": 0, "fe": [null, "Os conventos aparecem noutra estrofe, já transformados em quartéis; aqui é um palácio que se acende.", "Os quartéis vêm noutra estrofe; a luz que se acende é a de um palácio, «em face de um casebre»."]}, {"o": ["casebre", "estanco", "hospital"], "c": 0, "fe": [null, "Nestes versos não há estanco (loja de tabaco); diante do palácio está um casebre, a casa pobre.", "Não há hospital neste verso; o contraste é entre o palácio e o casebre."]}], "f": "«Inflamma-se um **palacio** em face de um **casebre**»: desigualdade numa só imagem.", "recycledFrom": "/pt/m6/licao-m6-f07/", "sourceCard": 10, "fe": "Trocaste os termos da antítese. Relê o último verso da estrofe que começa em «E eu sonho o Colera»: a casa rica e a casa pobre ficam frente a frente."}, {"t": "sublinhar", "p": "Toca na palavra que diz o que os quartéis foram antes.", "frase": "Dos arcos dos quarteis que foram já conventos;", "certas": [7], "f": "«Conventos»: os quartéis guardam o passado nas pedras, «Edade-média!».", "recycledFrom": "/pt/m6/licao-m6-f07/", "sourceCard": 11, "fe": "Marcaste o que os quartéis são hoje, não o que foram. A palavra está depois de «que foram já»."}, {"p": "«Um épico d'outr'ora ascende, n'um pilar!»: quem é este épico?", "f": "O «épico d'outr'ora» é a estátua de Camões, «Bronzeo, monumental», segundo o glossário.", "legacyId": "s11-q2", "recycledFrom": "/pt/m6/licao-m6-f07/", "t": "escolha", "o": ["Camões, representado numa estátua.", "Um soldado, montado no seu cavalo.", "Um forjador, ocupado na sua oficina."], "c": 0, "fe": [null, "«Épico» designa aqui o poeta representado, não um soldado.", "Nenhum forjador aparece nestes versos: quem «ascende, n'um pilar» é uma figura «Bronzeo, monumental», um poeta épico."]}, {"t": "sublinhar", "p": "Toca nas duas palavras com que o sujeito chama a cidade.", "frase": "Triste cidade! Eu temo que me avives", "certas": [0, 1], "f": "«Triste cidade!»: o sujeito fala à cidade como a uma pessoa, antes de temer a paixão.", "recycledFrom": "/pt/m6/licao-m6-f07/", "sourceCard": 12, "fe": "Marcaste o que o sujeito teme, não o modo como chama a cidade. A apóstrofe abre o verso, antes do ponto de exclamação."}, {"t": "vf", "p": "O homem idoso que pede esmola nas esquinas ensinou latim ao sujeito.", "v": true, "f": "Verdadeiro: o verso seguinte revela-o: quem lhe ensinou latim, agora calvo, eterno, sem repouso.", "cita": "Pede-me sempre esmola um homemzinho idoso,", "fe": "É verdadeiro: o verso seguinte diz quem é o homenzinho: o seu velho mestre «nas aulas de latim».", "recycledFrom": "/pt/m6/licao-m6-f07/", "sourceCard": 19}, {"t": "vf", "p": "Os «olhos» do caleche que espantam o sujeito são vermelhos, «sangrentos».", "v": true, "f": "Verdadeiro: «E os olhos d'um caleche espantam-me, sangrentos»: os «olhos» da carruagem, que se podem ler como as suas lanternas, vermelhos na escuridão.", "cita": "E os olhos d'um caleche espantam-me, sangrentos.", "fe": "É verdadeiro: «E os olhos d'um caleche espantam-me, sangrentos»: as lanternas do caleche, vermelhas na escuridão.", "recycledFrom": "/pt/m6/licao-m6-f07/", "sourceCard": 21}, {"p": "Em «Um cheiro salutar e honesto a pão no forno», «honesto» é…", "f": "«Honesto» atribui ao cheiro uma qualidade moral associada a quem produz o pão: é uma hipálage. A expressão não deve ser classificada como sinestesia apenas por associar uma sensação a uma qualidade moral; a sinestesia cruza domínios sensoriais.", "legacyId": "s11-q3", "recycledFrom": "/pt/m6/licao-m6-f07/", "t": "escolha", "o": ["Um valor moral aplicado ao cheiro.", "Um contraste entre valores opostos.", "Uma fusão entre presente e passado."], "c": 0, "fe": [null, "«Salutar» e «honesto» não formam um par de ideias opostas.", "«Honesto» não liga duas épocas: desloca uma qualidade moral."]}, {"t": "versos", "p": "Põe os versos do sonho de «Horas Mortas» pela ordem.", "linhas": ["Se eu não morresse, nunca! E eternamente", "Buscasse e conseguisse a perfeição das cousas!", "Esqueço-me a prever castissimas esposas,", "Que aninhem em mansões de vidro transparente!"], "f": "Não morrer, buscar a perfeição, prever esposas em mansões de vidro: o sonho antes do «Mas».", "recycledFrom": "/pt/m6/licao-m6-f07/", "sourceCard": 23, "fe": "Trocaste a ordem do sonho. Começa na condição («Se eu não morresse»), segue para a perfeição das coisas e só depois imagina as esposas nas mansões de vidro."}, {"t": "emparelhar", "p": "Liga cada verso à reportagem ou ao sonho.", "pares": [["«Collocam-se taipaes, rangem as fechaduras»", "A reportagem"], ["«Se eu não morresse, nunca! E eternamente»", "O sonho"], ["«Pede-me sempre esmola um homemzinho idoso»", "A reportagem"], ["«Que aninhem em mansões de vidro transparente!»", "O sonho"]], "f": "As fechaduras que rangem e o velho mestre de latim a pedir esmola pertencem à cidade percebida; não morrer e as mansões de vidro pertencem ao sonho de «Horas Mortas».", "recycledFrom": "/pt/m6/licao-m6-f07/", "sourceCard": 30, "fe": "Trocaste reportagem e sonho. Pergunta a cada verso se descreve o que o sujeito vê e ouve na rua, como as fechaduras ou o homenzinho, ou se imagina outra vida, como não morrer e as mansões de vidro."}, {"t": "emparelhar", "p": "Liga cada palavra do texto de apoio ao seu sentido.", "pares": [["aljube", "prisão"], ["nodoa", "mancha"], ["taipaes", "tábuas que fecham as lojas"], ["exiguas", "pequenas, escassas"]], "f": "Aljube, nodoa, taipaes, exiguas: a prisão, a mancha, o fecho das lojas, a pequenez da cidade à noite.", "recycledFrom": "/pt/m6/licao-m6-f07/", "sourceCard": 32, "fe": "Trocaste os sentidos. Lê a palavra dentro do verso: o «aljube» encerra pessoas, a «nodoa» é negra, os «taipaes» colocam-se quando a cidade fecha, as pimenteiras são «exiguas»."}]}</script>
