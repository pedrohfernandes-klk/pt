<script id="exame-aquecimento-dados" type="application/json">{"sessao": "s19", "versao": 1, "titulo": "Saramago: quem conta e quem faz", "cartoes": [{"t": "ler", "titulo": "Texto para consultar", "html": "<p>Consulta o texto quando precisares de confirmar uma escolha.<\/p><details><summary>Abrir o texto de apoio<\/summary><p class=\"pr\" data-l=\"0-0\"><b>[1]<\/b> Desta meditação e agonia não saiu el-rei para vestir o burel da penitência e da renúncia, mas para fazer voltar os camaristas, os secretários e os frades, a cantarina viria mais tarde, a estes perguntando se era realmente verdade, consoante julgava saber, que a sagração das basílicas se deve fazer aos domingos, e eles responderam que sim, segundo o Ritual, e então el-rei mandou apurar quando cairia o dia do seu aniversário, vinte e dois de Outubro, a um domingo, tendo os secretários respondido, após cuidadosa verificação do calendário, que tal coincidência se daria daí a dois anos, em mil setecentos e trinta, Então é nesse dia que se fará a sagração da basílica de Mafra, assim o quero, ordeno e determino, e quando isto ouviram foram os camaristas beijar a mão do seu senhor, vós me direis qual é mais excelente, se ser do mundo rei, se desta gente.<\/p><p class=\"pr\" data-l=\"0-1\"><b>[2]<\/b> Deitaram reverentemente alguma água na fervura João Frederico Ludovice e o doutor Leandro de Melo, chamados à pressa de Mafra, aonde o primeiro tinha ido e onde o segundo assistia, os quais, com a memória fresca do que lá viam, disseram que o estado da obra não consentia tão feliz previsão, tanto no que tocava ao convento, cujo segundo corpo se ia levantando lentamente de paredes, como à igreja, por sua natureza de delicada construção, um assembramento de pedras que não poderia ser feito à ligeira, vossa majestade o sabe melhor que ninguém, se tão harmoniosamente concilia e equilibra as partes de que se forma a nação.<\/p><p class=\"pr\" data-l=\"0-2\"><b>[3]<\/b> Carregou-se o sobrecenho de D. João V, porque a cansada lisonja em nada o aliviara, e indo abrir a boca para responder com secura, preferiu chamar outra vez os secretários e perguntar-lhes em que data voltaria a cair a um domingo o seu aniversário, passada esta de mil setecentos e trinta, pelos vistos não bastante prazo. Trabalharam eles afanosamente as suas aritméticas e com alguma dúvida responderam que o acontecimento tornaria a dar-se dez anos depois, em mil setecentos e quarenta.<\/p><p class=\"pr\" data-l=\"0-3\"><b>[4]<\/b> Estavam ali oito ou dez pessoas, entre rei, Ludovice, Leandro, secretários e fidalgos de semana, e todos acenaram gravemente a cabeça, como se o próprio Halley tivesse acabado de explicar a periodicidade dos cometas, as coisas que os homens são capazes de descobrir.<\/p><p class=\"pr\" data-l=\"0-4\"><b>[5]<\/b> Porém, D. João V teve um pensamento negro, viu-se-lhe na cara, e faz rápidas contas, mentais, com ajuda dos dedos, Em mil setecentos e quarenta terei cinquenta e um anos, e acrescentou lugubremente, Se ainda for vivo. E por alguns terríveis minutos tornou a subir este rei ao Monte das Oliveiras, ali se agoniou com o medo da morte e o pavor do roubo que lhe seria feito, agora acrescentando um sentimento de inveja, imaginar seu filho já rei, com a rainha nova que está para vir de Espanha, gozando ambos as delícias de inaugurar e ver sagrar Mafra, enquanto ele estaria apodrecendo em S. Vicente de Fora, perto do infantezinho D. Pedro, morto tão pequenino da brutalidade do desmame. Estavam os circunstantes olhando o rei, Ludovice com alguma curiosidade científica, Leandro de Melo indignado contra a severidade da lei do tempo que nem as majestades respeita, os secretários duvidando de terem acertado nos bissextos, os camaristas avaliando as suas próprias probabilidades de sobrevivência. Todos esperavam.<\/p><p class=\"pr\" data-l=\"0-5\"><b>[6]<\/b> E então D. João V disse, A sagração da basílica de Mafra será feita no dia vinte e dois de Outubro de mil setecentos e trinta, tanto faz que o tempo sobre como falte, venha sol ou venha chuva, caia a neve ou sopre o vento, nem que se alague o mundo ou lhe dê o tranglomango.<\/p><p class=\"fonte\">José Saramago, <i>Memorial do Convento<\/i> (1982), capítulo XXI; grafia da edição. Excerto para estudo.<\/p><p class=\"fonte\"><a href=\"../../../m9/licao-m9-f01/\">Texto e fontes na lição de origem<\/a><\/p><\/details>", "recycledFrom": "/pt/m9/licao-m9-f01/"}, {"p": "Em que época se passa a história do _Memorial do Convento_?", "f": "Reinado de D. João V e tempo da Inquisição: início do século XVIII; o século XX é o da escrita.", "legacyId": "s19-q1", "recycledFrom": "/pt/m9/licao-m9-f01/", "t": "escolha", "o": ["No início do século XVIII.", "No começo do século XVI.", "Nos finais do século XVII."], "c": 0, "fe": [null, "O século XVI não corresponde ao reinado evocado.", "O início do XVIII é diferente do fim do XVII."]}, {"p": "«essa é a medida de hoje, não a da época»: o que mostra este aviso do narrador?", "f": "Neste comentário sobre as unidades de medida, o «hoje» pertence ao presente de quem narra e é contrastado com a época da construção. Isto situa o tempo da narração relativamente aos acontecimentos; não é, por si só, um recuo ou uma antecipação do enredo. A data de publicação do livro é uma informação diferente.", "legacyId": "s19-q2", "recycledFrom": "/pt/m9/licao-m9-f01/", "t": "escolha", "o": ["Separa o presente da voz do passado narrado.", "Situa a voz de quem narra no tempo do rei.", "Denuncia um erro no cálculo dos metros da obra."], "c": 0, "fe": [null, "A palavra hoje distingue a voz narrativa do tempo de D. João V.", "O aviso distingue unidades de medida de épocas diferentes; não denuncia um cálculo errado."]}, {"p": "O que antecipa «do Convento», a segunda parte do título?", "f": "«Do Convento» põe a construção no centro, e com ela a crítica ao poder que a mandou fazer.", "legacyId": "s19-q3", "recycledFrom": "/pt/m9/licao-m9-f01/", "t": "escolha", "o": ["A construção ligada à crítica do poder.", "A promessa ligada ao nascimento do filho.", "A vida dos frades depois de sagrado o local."], "c": 0, "fe": [null, "A promessa faz parte da ação, mas não esgota a função do título.", "O título não limita o centro do romance à vida dos frades depois da sagração."]}, {"t": "emparelhar", "p": "Liga cada elemento à dimensão temporal que permite observar.", "pares": [["A época em que a história se passa", "Tempo histórico"], ["Recuos, avanços e prolepses", "Organização temporal do relato"], ["D. João V e a Inquisição", "Tempo histórico"], ["O «hoje» do comentário sobre os metros, distinto da época narrada", "Tempo da narração"]], "f": "A época de D. João V situa a ação historicamente. Os recuos e as antecipações dizem respeito à ordem do relato. Já o «hoje» deste comentário aponta para o presente de quem narra. Distinguir os três evita tratar qualquer comentário posterior como uma prolepse.", "recycledFrom": "/pt/m9/licao-m9-f01/", "sourceCard": 5, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "sublinhar", "p": "Toca nas duas palavras que dizem o que não vence a vaidade e o que a vence.", "frase": "A vaidade não se vence pela humildade, vence-se pelo excesso.", "certas": [6, 9], "f": "«Humildade» e «excesso»: o rei não se encolhe, marca a data falte o tempo que faltar.", "recycledFrom": "/pt/m9/licao-m9-f01/", "sourceCard": 10, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "completar", "p": "Porque manda o rei construir o Convento de Mafra, e com que dinheiro?", "frase": "O rei manda construir o Convento de Mafra para cumprir [1] e paga a obra com [2] enquanto milhares carregam a pedra.", "lacunas": [{"o": ["uma promessa ligada à sucessão", "uma pena imposta pela Inquisição"], "c": 0, "fe": [null, "Nesta lacuna, uma pena imposta pela Inquisição não corresponde à relação pedida."]}, {"o": ["o ouro e os diamantes do Brasil", "o trabalho pago dos trabalhadores"], "c": 0, "fe": [null, "Nesta lacuna, o trabalho pago dos trabalhadores não corresponde à relação pedida."]}], "f": "A **promessa** liga-se à sucessão do trono; o dinheiro vem do **Brasil**, em ouro e diamantes.", "recycledFrom": "/pt/m9/licao-m9-f01/", "sourceCard": 12, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "versos", "p": "Põe pela ordem do texto o que o rei faz no capítulo XXI.", "linhas": ["No capítulo XXI, D. João V fecha-se numa sala do torreão,", "com medo de morrer antes de ver Mafra sagrada,", "e acaba por marcar a sagração para o dia dos seus anos,", "22 de outubro de 1730, falte o tempo que faltar."], "f": "Primeiro fecha-se, depois o medo, depois a decisão e a data: **22 de outubro de 1730**.", "recycledFrom": "/pt/m9/licao-m9-f01/", "sourceCard": 13, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "ordenar", "p": "Põe pela ordem do excerto o que acontece no capítulo XXI.", "passos": ["Os secretários dizem que o aniversário cai a um domingo em 1730", "Ludovice e Leandro de Melo avisam que a obra não estará pronta", "O rei faz contas: em 1740 terá cinquenta e um anos, se for vivo", "O rei marca a sagração para 22 de outubro de 1730"], "f": "Domingo em 1730, o aviso da obra atrasada, o medo de morrer, e a decisão: **falte o tempo que faltar**.", "recycledFrom": "/pt/m9/licao-m9-f01/", "sourceCard": 15, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "emparelhar", "p": "Liga cada noção ao que quer dizer.", "pares": [["Tempo histórico", "a época em que a história se passa"], ["Organização temporal do relato", "a ordem em que o narrador apresenta os acontecimentos"], ["Tempo da narração", "o momento de onde a voz conta"], ["Prolepse", "o narrador adianta o que vai acontecer"], ["Romance histórico", "ficção numa época real, com figuras dela"]], "f": "Tempo histórico situa a época; organização temporal do relato explica a ordem; tempo da narração situa o ato de contar. Prolepse é uma antecipação de acontecimentos. Nenhuma destas distinções transforma a voz narrativa automaticamente no autor real.", "recycledFrom": "/pt/m9/licao-m9-f01/", "sourceCard": 16, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "completar", "p": "Que palavra do texto diz o contrário de «avanços», ao falar da organização temporal do relato?", "frase": "O narrador arruma os acontecimentos com [1] e avanços.", "lacunas": [{"o": ["recuos", "saltos"], "c": 0, "fe": [null, "Nesta lacuna, saltos não corresponde à relação pedida."]}], "f": "**Recuos**: o narrador arruma os acontecimentos com recuos e avanços.", "recycledFrom": "/pt/m9/licao-m9-f01/", "sourceCard": 20, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "vf", "p": "O _Memorial do Convento_ foi publicado em outubro de 1730, no reinado de D. João V.", "v": false, "f": "Falso: foi publicado em **outubro de 1982**; 1730 é a data da sagração, dentro da história.", "fe": "Não: 1730 é o ano da sagração, dentro da história (capítulo XXI); o livro sai em outubro de 1982 (linha de vida).", "recycledFrom": "/pt/m9/licao-m9-f01/", "sourceCard": 21}, {"t": "vf", "p": "No romance histórico, figuras reais da época, como D. João V, entram na ficção.", "v": true, "f": "Verdadeiro: o romance histórico é **ficção numa época real**, com figuras e factos dela.", "fe": "É verdadeiro: o romance histórico é ficção numa época real; D. João V e a sagração de Mafra vêm da história e entram na ficção («Recorda», em «Para entender»).", "recycledFrom": "/pt/m9/licao-m9-f01/", "sourceCard": 26}]}</script>
