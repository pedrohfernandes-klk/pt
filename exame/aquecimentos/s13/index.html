<script id="exame-aquecimento-dados" type="application/json">{"sessao": "s13", "versao": 1, "titulo": "Caeiro: o rio e a medida do olhar", "cartoes": [{"t": "ler", "rot": "Abre", "titulo": "Aquecer", "html": "<p class=\"abre-t\">Caeiro: o rio e a medida do olhar<\/p><p><b>Objetivo:<\/b> relacionar pensamento, sensação e presença.<\/p><p>Doze cartões, dez minutos. O texto de apoio está no cartão seguinte. A seguir, voltas à sessão para ler e escrever no caderno.<\/p>", "recycledFrom": "/pt/exame/", "adaptacao": "Cartão de abertura da sessão (02/11/2026)."}, {"t": "ler", "titulo": "Texto para consultar", "html": "<p>Consulta o texto quando precisares de confirmar uma escolha.<\/p><details><summary>Abrir o texto de apoio<\/summary><div><p class=\"v\"><span class=\"ln\" data-l=\"0-0\">O Tejo é mais belo que o rio que corre pela minha aldeia,<\/span>\n<span class=\"ln\" data-l=\"0-1\">Mas o Tejo não é mais belo que o rio que corre pela minha aldeia<\/span>\n<span class=\"ln\" data-l=\"0-2\">Porque o Tejo não é o rio que corre pela minha aldeia.<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"0-4\">O Tejo tem grandes navios<\/span>\n<span class=\"ln\" data-l=\"0-5\">E navega nele ainda,<\/span>\n<span class=\"ln\" data-l=\"0-6\">Para aqueles que veem em tudo o que lá não está,<\/span>\n<span class=\"ln\" data-l=\"0-7\">A memória das naus.<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"0-9\">O Tejo desce de Espanha<\/span>\n<span class=\"ln\" data-l=\"0-10\">E o Tejo entra no mar em Portugal.<\/span>\n<span class=\"ln\" data-l=\"0-11\">Toda a gente sabe isso.<\/span>\n<span class=\"ln\" data-l=\"0-12\">Mas poucos sabem qual é o rio da minha aldeia<\/span>\n<span class=\"ln\" data-l=\"0-13\">E para onde ele vai<\/span>\n<span class=\"ln\" data-l=\"0-14\">E donde ele vem.<\/span>\n<span class=\"ln\" data-l=\"0-15\">E por isso, porque pertence a menos gente,<\/span>\n<span class=\"ln\" data-l=\"0-16\">É mais livre e maior o rio da minha aldeia.<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"0-18\">Pelo Tejo vai-se para o mundo.<\/span>\n<span class=\"ln\" data-l=\"0-19\">Para além do Tejo há a América<\/span>\n<span class=\"ln\" data-l=\"0-20\">E a fortuna daqueles que a encontram.<\/span>\n<span class=\"ln\" data-l=\"0-21\">Ninguém nunca pensou no que há para além<\/span>\n<span class=\"ln\" data-l=\"0-22\">Do rio da minha aldeia.<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"0-24\">O rio da minha aldeia não faz pensar em nada.<\/span>\n<span class=\"ln\" data-l=\"0-25\">Quem está ao pé dele está só ao pé dele.<\/span><\/p><p class=\"fonte\">Alberto Caeiro, <i>O Guardador de Rebanhos<\/i>, XX (1914; <i>Athena<\/i>, 1925), Arquivo Pessoa, grafia atualizada.<\/p><p class=\"fonte\"><a href=\"../../../m7/licao-m7-f35/\" target=\"_blank\" rel=\"noopener\">Texto e fontes na lição de origem<\/a><\/p><\/div><\/details>", "recycledFrom": "/pt/m7/licao-m7-f35/", "rot": "Texto de apoio"}, {"p": "O Tejo é mais belo e, logo a seguir, não é. Como pode o sujeito dizer as duas coisas?", "f": "«Porque o Tejo não é o rio que corre pela minha aldeia»: o critério muda, da fama para a relação. Não há dúvida sobre os rios nem igualdade entre eles.", "legacyId": "s13-q1", "recycledFrom": "/pt/m7/licao-m7-f35/", "t": "escolha", "o": ["Muda de critério ao comparar os rios.", "Esquece-se do rio de que estava a falar.", "Conclui que os rios são todos iguais."], "c": 0, "fe": [null, "A mudança de avaliação não vem de esquecer o rio: o sujeito sabe que fala do Tejo e do rio da aldeia.", "O sujeito distingue grandeza reconhecida e relação pessoal."]}, {"t": "sublinhar", "p": "Toca nas duas palavras que dizem o critério novo do terceiro verso.", "frase": "Porque o Tejo não é o rio que corre pela minha aldeia.", "certas": [10, 11], "f": "«Pela **minha aldeia**»: o rio vale pela relação de quem o conhece, não pelo que toda a gente sabe dele.", "cita": "Porque o Tejo não é o rio que corre pela minha aldeia.", "recycledFrom": "/pt/m7/licao-m7-f35/", "sourceCard": 5, "fe": "Marcaste o que o verso nega do Tejo, não o que põe no seu lugar. Relê o fim do verso: de quem é o rio?"}, {"t": "emparelhar", "p": "Liga cada expressão ao que ela é no poema.", "pares": [["«grandes navios»", "o que está no rio"], ["«a memória das naus»", "o que certos olhares acrescentam"], ["«o rio da minha aldeia»", "o que poucos conhecem e ninguém carrega"]], "f": "Navios no rio, naus na memória, e um rio que **ninguém transforma em símbolo**: as três linhas do poema.", "recycledFrom": "/pt/m7/licao-m7-f35/", "sourceCard": 7, "fe": "Trocaste os planos do poema. Os navios estão no rio; a memória das naus é posta por quem olha; o rio da aldeia é o que quase ninguém conhece nem carrega de sentidos."}, {"t": "vf", "p": "«Toda a gente sabe isso» refere o que se sabe do Tejo sem precisar de o ver: donde vem, onde entra no mar.", "v": true, "f": "Verdadeiro: a geografia do Tejo é **saber partilhado**; do rio da aldeia «poucos sabem» donde vem e para onde vai. O poema vai valorizar esse pouco.", "cita": "Toda a gente sabe isso.", "fe": "É verdadeiro: «O Tejo desce de Espanha / E o Tejo entra no mar em Portugal. / Toda a gente sabe isso»: é saber, não olhar.", "recycledFrom": "/pt/m7/licao-m7-f35/", "sourceCard": 10}, {"p": "«Para aqueles que veem em tudo o que lá não está»: quem vê as naus no Tejo?", "f": "A associação do Tejo às naus é atribuída a «aqueles»: o sujeito separa o seu olhar do deles. A memória não é um navio visível.", "legacyId": "s13-q2", "recycledFrom": "/pt/m7/licao-m7-f35/", "t": "escolha", "o": ["Quem associa o rio ao passado naval.", "Quem vê navios antigos ainda a passar.", "Quem ignora as viagens dos navegantes."], "c": 0, "fe": [null, "O texto fala da memória das naus, não de embarcações ainda presentes.", "Associar as naus ao rio exige acrescentar uma memória histórica."]}, {"t": "completar", "p": "Porque é o rio da aldeia diferente do Tejo? Completa.", "frase": "E por isso, porque pertence a [1] gente, / É mais [2] e maior o rio da minha aldeia.", "lacunas": [{"o": ["menos", "toda a", "muita"], "c": 0, "fe": [null, "É o Tejo que pertence a toda a gente; o rio da aldeia pertence «a menos gente».", "Ao contrário: o rio da aldeia é de poucos, «pertence a menos gente», e por isso é mais livre."]}, {"o": ["livre", "fundo", "calmo"], "c": 0, "fe": [null, "O poema não mede a profundidade; diz que o rio da aldeia é «mais livre e maior».", "Não é a calma: o verso diz que o rio da aldeia é «mais livre e maior», porque é de menos gente."]}], "f": "Pertence a **menos** gente, por isso é mais **livre**: livre dos significados que muitos põem em cima do Tejo.", "recycledFrom": "/pt/m7/licao-m7-f35/", "sourceCard": 11, "fe": "Trocaste a razão ou a qualidade. Relê os dois versos que fecham a terceira estrofe: o rio da aldeia «pertence a menos gente», e por isso é «mais livre e maior»."}, {"t": "versos", "p": "Põe por ordem a quarta estrofe, do Tejo à aldeia.", "linhas": ["Pelo Tejo vai-se para o mundo.", "Para além do Tejo há a América", "E a fortuna daqueles que a encontram.", "Ninguém nunca pensou no que há para além", "Do rio da minha aldeia."], "f": "Do Tejo ao mundo, à América, à fortuna; e depois um rio **para além do qual ninguém pensou nada**.", "recycledFrom": "/pt/m7/licao-m7-f35/", "sourceCard": 14, "fe": "Trocaste a ordem da estrofe. Vai do Tejo ao mundo, à América e à fortuna, e só depois volta ao rio da aldeia, para além do qual «Ninguém nunca pensou»."}, {"t": "vf", "p": "«Não faz pensar em nada» é uma crítica ao rio da aldeia.", "v": false, "f": "Falso: é o **elogio**. Para Caeiro, um rio que não faz pensar deixa-se ver; «pensar é estar doente dos olhos».", "cita": "O rio da minha aldeia não faz pensar em nada.", "fe": "É um elogio: para Caeiro, «pensar é estar doente dos olhos»; o rio que «não faz pensar em nada» deixa-se ver (v. 21).", "recycledFrom": "/pt/m7/licao-m7-f35/", "sourceCard": 16}, {"p": "Que palavra do poema designa os navios antigos das viagens marítimas?", "f": "Naus: os navios das viagens; «a memória das naus» é a história posta no rio por quem olha.", "legacyId": "s13-q3", "recycledFrom": "/pt/m7/licao-m7-f35/", "t": "escolha", "o": ["A palavra «naus».", "O nome «fortuna».", "A palavra «navios»."], "c": 0, "fe": [null, "«Fortuna» não designa uma embarcação.", "«Navios» são os do Tejo de hoje, «grandes navios»; os das viagens antigas são as «naus»."]}, {"t": "vf", "p": "Neste poema, Caeiro descreve dois rios para defender uma maneira de olhar.", "v": true, "f": "Verdadeiro: as paisagens servem para **construir uma posição** sobre sensação, pensamento e relação com o mundo: o poema compara, dá razões («Porque», «E por isso») e acaba no rio sem camadas.", "fe": "Responder «falso» é ler o poema só como descrição. Repara nos conectores «Porque» e «E por isso»: o poema dá razões e defende uma maneira de olhar.", "recycledFrom": "/pt/m7/licao-m7-f35/", "sourceCard": 21}, {"t": "ordenar", "p": "O percurso do poema, pela ordem das estrofes.", "passos": ["O Tejo é mais belo, mas não é", "Os grandes navios e a memória das naus", "O que toda a gente sabe e o que poucos sabem", "Pelo Tejo vai-se para o mundo", "Estar só ao pé do rio"], "f": "Da comparação à presença: **o poema tira camadas ao rio** até ficar só o rio.", "recycledFrom": "/pt/m7/licao-m7-f35/", "sourceCard": 22, "fe": "Trocaste o percurso. O poema começa na comparação dos rios, passa aos navios e à memória das naus, ao que toda a gente sabe, ao Tejo que leva ao mundo, e acaba no rio sem nada à volta."}, {"t": "sublinhar", "p": "No último verso, toca na palavra que tira ao rio tudo o que não é o próprio rio.", "frase": "O rio da minha aldeia não faz pensar em nada. Quem está ao pé dele está só ao pé dele.", "certas": [16], "f": "**Só**: ao pé do rio da aldeia está-se ao pé dele, e de mais nada; nenhuma memória, nenhum símbolo. É o fim do percurso do poema: o rio sem camadas.", "fe": "Marcaste a negação do penúltimo verso, não a palavra do último que limita. Compara as duas metades do último verso: a segunda repete a primeira e acrescenta uma palavra.", "recycledFrom": "/pt/m7/licao-m7-f35/", "adaptacao": "Cartão novo sobre o texto de apoio da sessão (02/11/2026)."}]}</script>
