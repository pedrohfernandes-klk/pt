ma lente de leitura do poema; perguntar o que o poema retoma é a lente da tradição.", "A história do seu tempo é a lente do contemporâneo; o que o poema retoma de autores e formas antigas é a tradição."]}, {"o": ["poesia", "pintura", "música"], "c": 0, "fe": [null, "Falar de pintura é relacionar artes; a arte poética pergunta se o poema fala da própria poesia.", "A música pode estar no ritmo, mas a lente da arte poética pergunta se o poema fala da própria poesia."]}], "f": "A **tradição** olha o que se retoma; a arte poética, se o poema fala de **poesia**.", "recycledFrom": "/pt/m8/licao-m8-f01/", "sourceCard": 8, "fe": "Trocaste as perguntas das lentes. A tradição pergunta o que o poema retoma de antes; a arte poética, se o poema fala da própria poesia."}, {"t": "escolha", "p": "Qual destas perguntas a um poeta é aberta e usa uma lente?", "o": ["«Que poeta antigo retoma, e porquê?»", "«Em que cidade nasceu e cresceu?»", "«Escreve em verso livre, sim ou não?»"], "c": 0, "fe": [null, "É aberta, mas fica na biografia: não usa nenhuma das quatro lentes nem pergunta nada sobre a obra.", "Fala da forma, mas o «sim ou não» fecha a pergunta: o poeta não tem de explicar nada."], "f": "**«Que poeta antigo retoma, e porquê?»**: é aberta e olha pela lente da tradição; as outras ficam na biografia ou respondem-se com uma palavra.", "recycledFrom": "/pt/m8/licao-m8-f01/", "sourceCard": 19, "adaptacao": "Cartão da lição de origem, no lugar de um cartão repetido ou trivial (02/11/2026)."}, {"p": "Quando um poema reflete sobre o fazer poético, pode ser lido como…", "f": "Uma arte poética interroga ou apresenta modos de criar e compreender poesia. Não se confunde automaticamente com a biografia do autor.", "legacyId": "s17-q2", "recycledFrom": "/pt/m8/licao-m8-f01/", "t": "escolha", "o": ["Uma reflexão sobre a criação poética.", "Uma transcrição sem criação literária.", "Uma reconstituição fiel da vida vivida."], "c": 0, "fe": [null, "A construção poética não desaparece por o poema refletir sobre si.", "A voz do poema não é necessariamente uma autobiografia fiel."]}, {"t": "vf", "p": "A lente das figurações do poeta pergunta que mundo e que problemas aparecem no poema.", "v": false, "f": "Falso: as figurações perguntam **como se vê quem escreve**; que mundo aparece é a lente do contemporâneo.", "fe": "Trocaste duas lentes. Que mundo e que problemas aparecem é a pergunta do contemporâneo; as figurações perguntam como se vê, no poema, quem escreve.", "recycledFrom": "/pt/m8/licao-m8-f01/", "sourceCard": 21, "adaptacao": "Cartão da lição de origem, no lugar de um cartão repetido ou trivial (02/11/2026)."}, {"t": "emparelhar", "p": "Liga cada lente ao que pergunta a um poema.", "pares": [["Contemporâneo", "que mundo e que problemas aparecem"], ["Tradição literária", "que autores, formas ou mitos retoma"], ["Figurações do poeta", "como se vê quem escreve"], ["Arte poética", "se o poema fala da própria poesia"]], "f": "Quatro portas: o mundo do seu tempo, o que retoma de antes, como se vê quem escreve, se fala de poesia.", "recycledFrom": "/pt/m8/licao-m8-f01/", "sourceCard": 15, "fe": "Trocaste as lentes. O contemporâneo olha o mundo do seu tempo; a tradição, o que se retoma; as figurações, como se vê quem escreve; a arte poética, se o poema fala de poesia."}, {"t": "vf", "p": "As lentes olham, mas é o poema que se lê.", "v": true, "f": "Verdadeiro: as lentes são portas; o que se lê é **o poema, com a sua forma e os seus recursos**.", "fe": "É verdadeiro: as lentes só fazem perguntas; quem responde é o poema, com a sua forma e os seus recursos.", "recycledFrom": "/pt/m8/licao-m8-f01/", "sourceCard": 16}, {"p": "Que pergunta ajuda a estudar a relação entre poesia e mundo?", "f": "Importa analisar o que o poema torna visível e os procedimentos que constroem essa visão.", "legacyId": "s17-q3", "recycledFrom": "/pt/m8/licao-m8-f01/", "t": "escolha", "o": ["Como transforma a linguagem o mundo?", "Que acontecimentos viveu o poeta?", "Quantas estrofes e versos tem o poema?"], "c": 0, "fe": [null, "A biografia situa o poeta, mas não mostra como o poema transforma o mundo.", "Contar estrofes descreve a forma; falta perguntar o que essa forma faz ao mundo representado."]}, {"t": "vf", "p": "Perguntar porque é que um poeta de 1960 escreve um soneto, uma forma antiga, é olhar pela lente da tradição.", "v": true, "f": "Verdadeiro: pedir emprestada uma forma ou discutir com quem a usou antes é olhar pela **tradição**.", "fe": "É verdadeiro: o soneto é uma forma antiga; perguntar porque um poeta de 1960 a usa é perguntar o que o poema retoma, a pergunta da tradição.", "recycledFrom": "/pt/m8/licao-m8-f01/", "sourceCard": 17}, {"t": "ordenar", "p": "Para comparar dois poemas, por ordem:", "passos": ["Escolhe um eixo comum aos dois poemas", "Procura em cada um a passagem que o mostra", "Diz o que se mantém e o que muda", "Conclui o que a diferença revela"], "f": "Sem eixo, a comparação vira duas descrições lado a lado. O eixo diz o que procurar; as passagens provam; a conclusão diz o que a diferença revela.", "fe": "Começaste pelas passagens soltas ou pela conclusão. Primeiro escolhes o eixo; com ele procuras a passagem em cada poema, comparas e só então concluis.", "recycledFrom": "/pt/m8/licao-m8-f01/", "adaptacao": "Operação da sessão (comparar dois poemas), no lugar de um cartão trivial (02/11/2026)."}, {"t": "ordenar", "p": "Como se faz a entrevista a um poeta, por ordem:", "passos": ["Imagina que entrevistas Jorge de Sena ou Ana Luísa Amaral", "Escreve três perguntas, uma por lente", "Escolhe a que abre melhor a conversa", "Justifica a escolha"], "f": "Três perguntas abertas, cada uma com uma lente, e a melhor escolhida com razão.", "recycledFrom": "/pt/m8/licao-m8-f01/", "sourceCard": 21, "fe": "Trocaste a ordem da preparação. Primeiro escolhes o poeta, depois escreves três perguntas, uma por lente, escolhes a que abre melhor a conversa e só no fim justificas."}]}</script>
