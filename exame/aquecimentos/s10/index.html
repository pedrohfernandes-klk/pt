Sonetos Completos<\/i> (1886) (grafia da edição; v. 6 corrigido: «rota», onde o <i>e-book<\/i> lê «roda»).<\/p><p class=\"fonte\"><a href=\"../../../m6/licao-m6-f01/\" target=\"_blank\" rel=\"noopener\">Texto e fontes na lição de origem<\/a><\/p><\/div><\/details>", "recycledFrom": "/pt/m6/licao-m6-f01/", "rot": "Texto de apoio"}, {"p": "Quem fala em «O Palacio da Ventura» e o que se sonha?", "f": "«Sonho que sou um cavalleiro andante» (v. 1): o sujeito sonha-se o próprio cavaleiro, não o vê de fora.", "legacyId": "s10-q1", "recycledFrom": "/pt/m6/licao-m6-f01/", "t": "escolha", "o": ["O sujeito sonha ser um cavaleiro andante.", "O sujeito recorda um cavaleiro de outrora.", "O sujeito observa um cavaleiro que passa."], "c": 0, "fe": [null, "«Sonho que sou» não apresenta uma simples recordação.", "A voz assume o papel de cavaleiro, não observa outro a passar."]}, {"t": "sublinhar", "p": "Toca nas três palavras repetidas que fazem a anáfora do verso.", "frase": "Por desertos, por sóes, por noite escura,", "certas": [0, 2, 4], "f": "«Por… por… por»: a **anáfora** acumula os lugares da busca.", "cita": "Por desertos, por sóes, por noite escura,", "recycledFrom": "/pt/m6/licao-m6-f01/", "sourceCard": 6, "fe": "Marcaste os lugares, não a palavra que se repete. A anáfora está no começo de cada segmento: a mesma preposição, três vezes."}, {"t": "sublinhar", "p": "Toca nos dois adjetivos que dizem o estado do cavaleiro.", "frase": "Mas já desmaio, exhausto e vacillante.", "certas": [3, 5], "f": "«Exhausto» e «vacillante»: cansado e a cambalear, antes de avistar o palácio.", "cita": "Mas já desmaio, exhausto e vacillante.", "recycledFrom": "/pt/m6/licao-m6-f01/", "sourceCard": 9, "fe": "Marcaste o verbo, não os adjetivos. Depois de «desmaio» vêm as duas palavras que dizem como está o cavaleiro."}, {"t": "completar", "p": "Que armas do cavaleiro estão desfeitas na segunda quadra?", "frase": "«Quebrada a [1] já, rota a [2]...»: as armas do cavaleiro desfeitas.", "lacunas": [{"o": ["espada", "viseira", "escudo"], "c": 0, "fe": [null, "A viseira protege o rosto; o verso fala da arma que se quebra: «Quebrada a espada já».", "O escudo não aparece no verso; a arma quebrada é a espada."]}, {"o": ["armadura", "bandeira", "vestidura"], "c": 0, "fe": [null, "A bandeira não aparece no verso; o que está «rota», partida, é a armadura.", "«Rota» também se diz da roupa, mas o verso fala das armas do cavaleiro: «rota a armadura»."]}], "f": "«Quebrada a **espada** já, rota a **armadura**»: «rota» é partida, desfeita.", "recycledFrom": "/pt/m6/licao-m6-f01/", "sourceCard": 10, "fe": "Trocaste as armas. Relê o verso 6, «Quebrada a espada já, rota a armadura...»: a espada quebra-se, a armadura rompe-se."}, {"p": "A primeira quadra termina com «O palacio encantado da Ventura!».", "f": "Verdadeiro: a primeira quadra fecha no alvo da busca, «O palacio encantado da Ventura!».", "legacyId": "s10-q2", "recycledFrom": "/pt/m6/licao-m6-f01/", "t": "vf", "v": true, "fe": "Conta os quatro primeiros versos: o quarto é «O palacio encantado da Ventura!», e fecha a primeira quadra."}, {"t": "versos", "p": "Põe os versos do primeiro terceto pela ordem do soneto.", "linhas": ["Com grandes golpes bato á porta e brado:", "Eu sou o Vagabundo, o Desherdado...", "Abri-vos, portas d'ouro, ante meus ais!"], "f": "Bate, diz quem é, pede que abram: o apelo vem antes do vazio.", "recycledFrom": "/pt/m6/licao-m6-f01/", "sourceCard": 12, "fe": "Trocaste a ordem do apelo. Primeiro o gesto («bato á porta e brado»), depois quem é («Eu sou o Vagabundo»), por fim o pedido («Abri-vos, portas d'ouro»)."}, {"t": "vf", "p": "As portas de ouro abrem-se devagar e em silêncio.", "v": false, "f": "Falso: «Abrem-se as portas d'ouro, com **fragor**», com estrondo; o silêncio está lá dentro.", "cita": "Abrem-se as portas d'ouro, com fragor...", "fe": "É falso: o verso 12 diz que as portas se abrem «com fragor», com estrondo; o silêncio é o que se encontra lá dentro (v. 14).", "recycledFrom": "/pt/m6/licao-m6-f01/", "sourceCard": 15}, {"t": "vf", "p": "A chave de ouro deste soneto está na primeira quadra, em «busco anhelante».", "v": false, "f": "Falso: a **chave de ouro** é o último verso, «e nada mais!», que fecha o sentido e o vira.", "fe": "É falso: «busco anhelante» está no verso 3, ainda na busca; a chave de ouro é o último verso, «e nada mais!», que vira o sentido do soneto.", "recycledFrom": "/pt/m6/licao-m6-f01/", "sourceCard": 19}, {"p": "«E eis que subito o avisto, fulgurante»: o que avista o cavaleiro?", "f": "Avista o palácio, «Na sua pompa e aerea formosura»: a promessa de luz antes do vazio.", "legacyId": "s10-q3", "recycledFrom": "/pt/m6/licao-m6-f01/", "t": "escolha", "o": ["O palácio brilhante que procurava.", "A espada destruída que abandonara.", "O deserto escuro que atravessara."], "c": 0, "fe": [null, "A espada já quebrada não é o objeto fulgurante avistado.", "O deserto pertence ao percurso, não à descoberta anunciada."]}, {"t": "emparelhar", "p": "Liga cada elemento da alegoria ao que representa.", "pares": [["O cavaleiro", "o sujeito, que busca"], ["O palácio", "a promessa de felicidade"], ["O vazio final", "a desilusão"]], "f": "Cavaleiro, palácio, vazio: o sujeito, a promessa de sentido, a desilusão; a alegoria da busca do Ideal.", "recycledFrom": "/pt/m6/licao-m6-f01/", "sourceCard": 20, "fe": "Trocaste os elementos da alegoria. O cavaleiro é quem procura; o palácio, o que promete; o vazio, o que fica quando a promessa falha."}, {"t": "completar", "p": "Como se organizam as estrofes de «O Palacio da Ventura»?", "frase": "Neste poema, os [1] versos distribuem-se por [2] e dois tercetos.", "lacunas": [{"o": ["14", "12", "16"], "c": 0, "fe": [null, "Doze versos não chegam para um soneto: conta as duas quadras e os dois tercetos, 4 + 4 + 3 + 3.", "Dezasseis versos são dois a mais: duas quadras e dois tercetos dão 4 + 4 + 3 + 3, catorze."]}, {"o": ["duas quadras", "três quadras", "dois quintetos"], "c": 0, "fe": [null, "Com três quadras e dois tercetos haveria dezoito versos; o soneto tem duas quadras.", "Não há quintetos: as estrofes de cima têm quatro versos cada, são quadras."]}], "f": "**Catorze** versos, **duas quadras** e dois tercetos. A organização estrófica e a medida dos versos são aspetos diferentes: neste poema há decassílabos, mas existem sonetos com outras medidas. Relaciona agora a última estrofe com a expectativa criada nas anteriores.", "recycledFrom": "/pt/m6/licao-m6-f01/", "sourceCard": 21, "fe": "Conta os versos de cada estrofe no texto de apoio: duas estrofes de quatro, duas de três."}, {"t": "ordenar", "p": "Os quatro tempos do soneto, por ordem:", "passos": ["Sonha-se cavaleiro em busca do palácio", "Exausto e com as armas desfeitas, avista-o fulgurante", "Bate à porta e pede que abram", "As portas abrem-se: dentro não há nada"], "f": "Busca, visão, apelo, vazio: uma estrofe para cada momento. A sequência termina com a abertura das portas, mas frustra a expectativa de felicidade. O texto diz que a espada está quebrada e a armadura rota; não afirma que o cavaleiro foi ferido.", "recycledFrom": "/pt/m6/licao-m6-f01/", "sourceCard": 22, "fe": "Trocaste os tempos do soneto. Cada estrofe tem o seu momento: a busca, a visão do palácio, o apelo à porta e, no fim, o vazio."}]}</script>
