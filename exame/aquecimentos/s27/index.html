 não explica o que a citação demonstra", "escrever a frase que liga prova e ideia"]], "f": "Reconhecer ao reler não prova que sabes: fecha a explicação e testa. A hesitação numa frase nova pede mais casos novos. A citação sem comentário pede a frase que diz o que ela mostra.", "fe": "Trocaste dificuldade e estratégia. Pergunta a cada caso se o problema é só reconhecer, aplicar a um caso novo, ou explicar uma prova.", "recycledFrom": "/pt/m5/licao-m5-f07/", "adaptacao": "Cartão novo sobre o texto de apoio da sessão (02/11/2026)."}, {"t": "vf", "p": "No texto de apoio, a dificuldade do Rui não é a rapidez: é não explicar o que a citação demonstra.", "v": true, "f": "Verdadeiro: acabar depressa não é o problema; o problema é a citação sem explicação. O que ele deve rever é a ligação entre a prova e a ideia.", "fe": "Responder «falso» é tomar o «depressa» pela dificuldade. Relê o fim da frase sobre o Rui: o «mas» introduz o que falta.", "recycledFrom": "/pt/m5/licao-m5-f07/", "adaptacao": "Cartão novo sobre o texto de apoio da sessão (02/11/2026)."}, {"t": "sublinhar", "p": "No texto de apoio, toca nas duas palavras que mostram onde aparece a dificuldade da Inês.", "frase": "A Inês reconhece as definições quando as relê. Numa frase nova, hesita na função sintática.", "certas": [9, 10], "f": "**Frase nova**: a Inês reconhece o que já viu, mas hesita quando aplica a um caso diferente. É aí que o estudo deve insistir.", "fe": "Marcaste o que ela faz bem ou a função, não a situação que a faz hesitar. Repara no que vem depois de «Numa».", "recycledFrom": "/pt/m5/licao-m5-f07/", "adaptacao": "Cartão novo sobre o texto de apoio da sessão (02/11/2026)."}, {"p": "Qual destes registos ajuda mais a decidir o que rever?", "f": "O registo concreto permite escolher uma ação de revisão e verificar depois se a dificuldade foi ultrapassada.", "legacyId": "s27-q2", "recycledFrom": "/pt/m5/licao-m5-f07/", "t": "escolha", "o": ["Identifiquei a função, mas não a expliquei.", "Dediquei basta
