<script id="exame-aquecimento-dados" type="application/json">{"sessao": "s04", "versao": 1, "titulo": "Camões lírico: o que a forma faz sentir", "cartoes": [{"t": "ler", "titulo": "Texto para consultar", "html": "<p>Consulta o texto quando precisares de confirmar uma escolha.<\/p><details><summary>Abrir o texto de apoio<\/summary><p class=\"v\"><span class=\"ln\" data-l=\"0-0\">Alma minha gentil, que te partiste<\/span>\n<span class=\"ln\" data-l=\"0-1\">Tão cedo desta vida descontente,<\/span>\n<span class=\"ln\" data-l=\"0-2\">Repousa lá no céu eternamente,<\/span>\n<span class=\"ln\" data-l=\"0-3\">E viva eu cá na terra sempre triste.<\/span>\n<span class=\"ln\" data-l=\"0-5\">Se lá no assento etéreo, onde subiste,<\/span>\n<span class=\"ln\" data-l=\"0-6\">Memória desta vida se consente,<\/span>\n<span class=\"ln\" data-l=\"0-7\">Não te esqueças daquele amor ardente<\/span>\n<span class=\"ln\" data-l=\"0-8\">Que já nos olhos meus tão puro viste.<\/span>\n<span class=\"ln\" data-l=\"0-10\">E se vires que pode merecer-te<\/span>\n<span class=\"ln\" data-l=\"0-11\">Alguma cousa a dor que me ficou<\/span>\n<span class=\"ln\" data-l=\"0-12\">Da mágoa, sem remédio, de perder-te,<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"0-14\">Roga a Deus, que teus anos encurtou,<\/span>\n<span class=\"ln\" data-l=\"0-15\">Que tão cedo de cá me leve a ver-te,<\/span>\n<span class=\"ln\" data-l=\"0-16\">Quão cedo de meus olhos te levou.<\/span><\/p><p class=\"fonte\">Luís de Camões, <i>Rhythmas<\/i> (1595), soneto XIII (grafia modernizada).<\/p><p class=\"v\"><span class=\"ln\" data-l=\"1-0\">Busque Amor novas artes, novo engenho,<\/span>\n<span class=\"ln\" data-l=\"1-1\">Para matar-me, e novas esquivanças;<\/span>\n<span class=\"ln\" data-l=\"1-2\">Que não pode tirar-me as esperanças,<\/span>\n<span class=\"ln\" data-l=\"1-3\">Pois mal me tirará o que eu não tenho.<\/span>\n<span class=\"ln\" data-l=\"1-5\">Olhai de que esperanças me mantenho!<\/span>\n<span class=\"ln\" data-l=\"1-6\">Vede que perigosas seguranças!<\/span>\n<span class=\"ln\" data-l=\"1-7\">Pois não temo contrastes nem mudanças,<\/span>\n<span class=\"ln\" data-l=\"1-8\">Andando em bravo mar, perdido o lenho.<\/span>\n<span class=\"ln\" data-l=\"1-10\">Mas, conquanto não pode haver desgosto<\/span>\n<span class=\"ln\" data-l=\"1-11\">Onde esperança falta, lá me esconde<\/span>\n<span class=\"ln\" data-l=\"1-12\">Amor um mal, que mata e não se vê.<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"1-14\">Que dias há que na alma me tem posto<\/span>\n<span class=\"ln\" data-l=\"1-15\">Um não sei quê, que nasce não sei onde,<\/span>\n<span class=\"ln\" data-l=\"1-16\">Vem não sei como, e dói não sei porquê.<\/span><\/p><p class=\"fonte\">Luís de Camões, sonetos (edição de 1843).<\/p><p class=\"fonte\"><a href=\"../../../m3/licao-m3-f09/\">Texto e fontes na lição de origem<\/a><\/p><\/details>", "recycledFrom": "/pt/m3/licao-m3-f09/"}, {"p": "Em «_Alma minha gentil_», «gentil» significa, neste contexto…", "f": "O adjetivo valoriza a pessoa evocada e participa na sua idealização; deve ser lido no contexto elegíaco.", "legacyId": "s04-q1", "recycledFrom": "/pt/m3/licao-m3-f09/", "t": "escolha", "o": ["De natureza nobre e elevada.", "De conversa educada e banal.", "De juventude leve e alegre."], "c": 0, "fe": [null, "Aqui não se avaliam regras de conversa.", "Gentil não informa sobre despreocupação."]}, {"p": "A quem se dirige a voz em «Alma minha gentil, que te partiste»?", "f": "A apóstrofe «_Alma minha gentil_» dirige-se à amada ausente pela morte. A voz fala-lhe; não se confunde automaticamente com o autor real.", "legacyId": "s04-q2", "recycledFrom": "/pt/m3/licao-m3-f09/", "t": "escolha", "o": ["À amada que deixou a vida.", "A Deus que responde à voz.", "Ao leitor que surge no verso."], "c": 0, "fe": [null, "Deus é mencionado depois, mas não é o destinatário desta abertura.", "O verso interpela a amada, não nomeia um leitor."]}, {"p": "«Que tão cedo de cá me leve a ver-te, / Quão cedo de meus olhos te levou»: que recurso é?", "f": "Paralelismo: a mesma construção em dois versos; pede morrer tão depressa como ela.", "legacyId": "s04-q3", "recycledFrom": "/pt/m3/licao-m3-f09/", "t": "escolha", "o": ["Um paralelismo sintático.", "Uma interpelação ao leitor.", "Uma comparação de lugares."], "c": 0, "fe": [null, "A pergunta pede a relação entre as construções dos dois versos.", "Não se comparam dois lugares: repete-se uma construção sintática."]}, {"t": "sublinhar", "p": "Toca nas três palavras que dizem onde vive o sujeito, na antítese com «lá no céu».", "frase": "E viva eu cá na terra sempre triste.", "certas": [3, 4, 5], "f": "**Cá na terra**: contra o «lá no céu» da amada, ele vive cá na terra, sempre triste.", "cita": "E viva eu cá na terra sempre triste.", "recycledFrom": "/pt/m3/licao-m3-f09/", "sourceCard": 6, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "completar", "p": "Completa os dois pedidos, um de cada soneto.", "frase": "«Se lá no assento etéreo, onde subiste, / Memória desta vida se consente», pede à amada que [1]. «Busque Amor novas artes, novo engenho, / Para matar-me»: o Amor procura [2].", "lacunas": [{"o": ["não se esqueça do amor dele", "volte do céu para viver com ele"], "c": 0, "fe": [null, "Nesta lacuna, volte do céu para viver com ele não corresponde à relação pedida."]}, {"o": ["novas maneiras de o matar", "novas esperanças para lhe dar"], "c": 0, "fe": [null, "Nesta lacuna, novas esperanças para lhe dar não corresponde à relação pedida."]}], "f": "Se no céu se permite a memória, **que não se esqueça** «daquele amor ardente» que viu nos olhos dele. **Novas maneiras de o matar**: novas artes, novo engenho e novas esquivanças, desdéns.", "cita": "Se lá no assento etéreo, onde subiste,", "recycledFrom": "/pt/m3/licao-m3-f09/", "sourceCard": 7, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "sourceCards": [7, 12]}, {"t": "versos", "p": "Põe o primeiro terceto de A pela ordem do soneto.", "linhas": ["E se vires que pode merecer-te", "Alguma cousa a dor que me ficou", "Da mágoa, sem remédio, de perder-te,"], "f": "Se a dor merecer alguma coisa; a dor que ficou; da mágoa de a perder: o primeiro terceto.", "cita": "E se vires que pode merecer-te", "recycledFrom": "/pt/m3/licao-m3-f09/", "sourceCard": 8, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "vf", "p": "«Pois mal me tirará o que eu não tenho»: o sujeito ainda tem esperanças.", "v": false, "f": "Falso: Amor «não pode tirar-me as esperanças» porque ele **já não as tem**.", "cita": "Pois mal me tirará o que eu não tenho.", "fe": "Lê o verso com atenção: Amor não lhe pode tirar a esperança porque ele já não a tem («o que eu não tenho»).", "recycledFrom": "/pt/m3/licao-m3-f09/", "sourceCard": 13}, {"t": "sublinhar", "p": "Toca no nome e no adjetivo que dizem por onde anda o sujeito.", "frase": "Andando em bravo mar, perdido o lenho.", "certas": [2, 3], "f": "**Bravo mar**: anda num mar bravo, «perdido o lenho», sem navio.", "cita": "Andando em bravo mar, perdido o lenho.", "recycledFrom": "/pt/m3/licao-m3-f09/", "sourceCard": 14, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "vf", "p": "Segundo B, onde falta a esperança não pode haver desgosto, e no entanto Amor esconde lá um mal.", "v": true, "f": "Verdadeiro: «conquanto», embora, não possa haver desgosto, Amor esconde **um mal que mata e não se vê**.", "cita": "Mas, conquanto não pode haver desgosto", "fe": "Repara no «conquanto» (embora): onde falta a esperança não pode haver desgosto, e mesmo assim Amor esconde lá «um mal, que mata e não se vê».", "recycledFrom": "/pt/m3/licao-m3-f09/", "sourceCard": 15}, {"t": "emparelhar", "p": "Liga cada verso ao soneto de onde vem.", "pares": [["«Roga a Deus, que teus anos encurtou»", "«_Alma minha gentil_»"], ["«Vem não sei como, e dói não sei porquê»", "«_Busque Amor novas artes_»"], ["«Repousa lá no céu eternamente»", "«_Alma minha gentil_»"], ["«Olhai de que esperanças me mantenho!»", "«_Busque Amor novas artes_»"]], "f": "Em A, a amada morta e o céu; em B, o mal de amor que não se sabe dizer.", "recycledFrom": "/pt/m3/licao-m3-f09/", "sourceCard": 20, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "emparelhar", "p": "Liga cada poema à forma como representa a amada ou o amor.", "pares": [["«_Descalça vai para a fonte_»", "Leonor: roupa e cores"], ["«_Alma minha gentil_»", "a amada: alma, sem corpo"], ["«_Busque Amor novas artes_»", "o amor: um não sei quê sem nome"]], "f": "Leonor de roupa e cores, na lição «Leonor e o perdigão»; a amada que é só alma; o amor que não tem nome.", "recycledFrom": "/pt/m3/licao-m3-f09/", "sourceCard": 22, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "vf", "p": "Nestes sonetos, o amor é representado como experiência de contemplação e sofrimento.", "v": true, "f": "Verdadeiro **nestes poemas**: a amada surge idealizada e o sujeito exprime sofrimento. É uma leitura sustentada pelos versos estudados, não uma regra para toda a lírica petrarquista.", "fe": "Os dois sonetos sustentam a afirmação: a amada idealizada («alma gentil», no «assento etéreo») e o sofrimento do sujeito («sempre triste», «um mal que mata»).", "recycledFrom": "/pt/m3/licao-m3-f09/", "sourceCard": 24}]}</script>
