<script id="exame-aquecimento-dados" type="application/json">{"sessao": "s15", "versao": 1, "titulo": "Campos: desejo e desencontro", "cartoes": [{"t": "ler", "titulo": "Texto para consultar", "html": "<p>Consulta o texto quando precisares de confirmar uma escolha.<\/p><details><summary>Abrir o texto de apoio<\/summary><p class=\"v\"><span class=\"ln\" data-l=\"0-0\">Não sou nada.<\/span>\n<span class=\"ln\" data-l=\"0-1\">Nunca serei nada.<\/span>\n<span class=\"ln\" data-l=\"0-2\">Não posso querer ser nada.<\/span>\n<span class=\"ln\" data-l=\"0-3\">À parte isso, tenho em mim todos os sonhos do mundo.<\/span><\/p><p class=\"fonte\">Álvaro de Campos, «<i>Tabacaria<\/i>» (1928), vv. 1 a 4, Arquivo Pessoa.<\/p><p class=\"v\"><span class=\"ln\" data-l=\"1-0\">(Come chocolates, pequena;<\/span>\n<span class=\"ln\" data-l=\"1-1\">Come chocolates!<\/span>\n<span class=\"ln\" data-l=\"1-2\">Olha que não há mais metafísica no mundo senão chocolates.<\/span>\n<span class=\"ln\" data-l=\"1-3\">Olha que as religiões todas não ensinam mais que a confeitaria.<\/span>\n<span class=\"ln\" data-l=\"1-4\">Come, pequena suja, come!<\/span>\n<span class=\"ln\" data-l=\"1-5\">Pudesse eu comer chocolates com a mesma verdade com que comes!<\/span>\n<span class=\"ln\" data-l=\"1-6\">Mas eu penso e, ao tirar o papel de prata, que é de folhas de estanho,<\/span>\n<span class=\"ln\" data-l=\"1-7\">Deito tudo para o chão, como tenho deitado a vida.)<\/span><\/p><p class=\"fonte\">Álvaro de Campos, «<i>Tabacaria<\/i>» (1928), Arquivo Pessoa; os parênteses são do poema.<\/p><p class=\"v\"><span class=\"ln\" data-l=\"2-0\">Fiz de mim o que não soube,<\/span>\n<span class=\"ln\" data-l=\"2-1\">E o que podia fazer de mim não o fiz.<\/span>\n<span class=\"ln\" data-l=\"2-2\">O dominó que vesti era errado.<\/span>\n<span class=\"ln\" data-l=\"2-3\">Conheceram-me logo por quem não era e não desmenti, e perdi-me.<\/span>\n<span class=\"ln\" data-l=\"2-4\">Quando quis tirar a máscara,<\/span>\n<span class=\"ln\" data-l=\"2-5\">Estava pegada à cara.<\/span>\n<span class=\"ln\" data-l=\"2-6\">Quando a tirei e me vi ao espelho,<\/span>\n<span class=\"ln\" data-l=\"2-7\">Já tinha envelhecido.<\/span><\/p><p class=\"fonte\">Álvaro de Campos, «<i>Tabacaria<\/i>» (1928), Arquivo Pessoa.<\/p><p class=\"fonte\"><a href=\"../../../m7/licao-m7-f36/\">Texto e fontes na lição de origem<\/a><\/p><\/details>", "recycledFrom": "/pt/m7/licao-m7-f36/"}, {"p": "Como progride a negação nos três primeiros versos?", "f": "Três alcances: o que é, o que será, o que pode querer ser. Repete «nada», mas os verbos alargam a negação.", "legacyId": "s15-q1", "recycledFrom": "/pt/m7/licao-m7-f36/", "t": "escolha", "o": ["Nega ser, vir a ser e querer ser.", "Afirma sonhar, agir e realizar-se.", "Repete sempre a negação inicial."], "c": 0, "fe": [null, "Os três versos negam, em vez de afirmar a realização dos sonhos.", "As formas sou, serei e querer ser não dizem exatamente o mesmo."]}, {"p": "«À parte isso, tenho em mim todos os sonhos do mundo»: que relação tem com os três versos anteriores?", "f": "«Tenho em mim», não «realizei»: a plenitude é interior. Não ser nada e ter todos os sonhos ficam lado a lado.", "legacyId": "s15-q2", "recycledFrom": "/pt/m7/licao-m7-f36/", "t": "escolha", "o": ["Contrapõe o sonho à autonegação.", "Desfaz as negações já enunciadas.", "Desvia o tema para outra pessoa."], "c": 0, "fe": [null, "A amplitude do sonho não apaga as negações anteriores.", "A voz continua a falar de si e da tensão que a constitui."]}, {"p": "«Não há mais metafísica no mundo senão chocolates»: o que diz a voz à pequena?", "f": "A experiência imediata posta acima da metafísica e das religiões: é o que a voz inveja na pequena.", "legacyId": "s15-q3", "recycledFrom": "/pt/m7/licao-m7-f36/", "t": "escolha", "o": ["Dá valor à experiência de comer.", "Pede uma reflexão mais filosófica.", "Avisa sobre o perigo do açúcar."], "c": 0, "fe": [null, "A voz contrapõe comer com verdade à reflexão que a impede de o fazer.", "Não se trata de um conselho alimentar sobre o açúcar."]}, {"t": "versos", "p": "Põe por ordem os quatro versos da abertura.", "linhas": ["Não sou nada.", "Nunca serei nada.", "Não posso querer ser nada.", "À parte isso, tenho em mim todos os sonhos do mundo."], "f": "Sou, serei, posso querer ser: a negação cresce; e depois, **todos os sonhos**.", "cita": "Não sou nada.", "recycledFrom": "/pt/m7/licao-m7-f36/", "sourceCard": 4, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "sublinhar", "p": "Toca nas duas palavras que dizem onde estão os sonhos.", "frase": "À parte isso, tenho em mim todos os sonhos do mundo.", "certas": [4, 5], "f": "«**Em mim**»: dentro. O verso diz que os possui, não que os viveu.", "cita": "À parte isso, tenho em mim todos os sonhos do mundo.", "recycledFrom": "/pt/m7/licao-m7-f36/", "sourceCard": 7, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "completar", "p": "Completa o desejo e o obstáculo.", "frase": "Pudesse eu comer chocolates com a mesma [1] com que comes! / Mas eu [2]", "lacunas": [{"o": ["verdade", "alegria"], "c": 0, "fe": [null, "Nesta lacuna, alegria não corresponde à relação pedida."]}, {"o": ["penso", "durmo"], "c": 0, "fe": [null, "Nesta lacuna, durmo não corresponde à relação pedida."]}], "f": "«Com a mesma **verdade**» é o desejo; «Mas eu **penso**» é o obstáculo. Entre os dois, um «mas».", "cita": "Pudesse eu comer chocolates com a mesma verdade com que comes!", "recycledFrom": "/pt/m7/licao-m7-f36/", "sourceCard": 10, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "vf", "p": "«Fiz de mim o que não soube» diz que o sujeito construiu a vida que queria.", "v": false, "f": "Falso: fez o que **não soube**, e «o que podia fazer de mim não o fiz». O possível e o vivido não coincidem.", "cita": "Fiz de mim o que não soube,", "fe": "É o contrário: fez de si «o que não soube», e «o que podia fazer de mim não o fiz».", "recycledFrom": "/pt/m7/licao-m7-f36/", "sourceCard": 15}, {"t": "emparelhar", "p": "Liga cada verso da máscara ao que diz.", "pares": [["«O dominó que vesti era errado»", "a vida como um disfarce que não era o seu"], ["«Estava pegada à cara»", "o disfarce tornou-se a pessoa"], ["«Já tinha envelhecido»", "quando se viu, era tarde"]], "f": "Disfarce errado, máscara colada, espelho tardio: **a distância entre o possível e o vivido, contada em três tempos**.", "cita": "Quando quis tirar a máscara,", "recycledFrom": "/pt/m7/licao-m7-f36/", "sourceCard": 16, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "vf", "p": "O quarto verso da abertura resolve os três primeiros.", "v": false, "f": "Falso: **afirma a plenitude interior, não prova que os sonhos se realizem**; conserva a tensão com a autonegação.", "fe": "Não resolve: o quarto verso diz onde estão os sonhos, não que se cumpriram; o «nada» dos três primeiros versos fica de pé.", "recycledFrom": "/pt/m7/licao-m7-f36/", "sourceCard": 20}, {"t": "vf", "p": "Campos é sempre derrotado: todos os seus poemas dizem o mesmo.", "v": false, "f": "Falso: a voz **muda entre poemas** e tem tensões dentro do mesmo poema. A «Ode Triunfal» não é «_Tabacaria_»; a interpretação localiza a passagem.", "fe": "A voz muda: na «Ode Triunfal» há febre e euforia; aqui, «Não sou nada». E até dentro de «_Tabacaria_» há sonhos ao lado do nada.", "recycledFrom": "/pt/m7/licao-m7-f36/", "sourceCard": 22}, {"t": "emparelhar", "p": "Liga cada pedaço ou valor ao conector a que pertence.", "pares": [["«como se estivesse para morrer»", "«Como se»"], ["«porque não se pensam»", "«Porque»"], ["Hipótese, com conjuntivo", "«Como se»"], ["Causa, com indicativo", "«Porque»"]], "f": "«Como se» abre uma hipótese, com conjuntivo; «porque» fecha com uma causa, no indicativo.", "recycledFrom": "/pt/m7/licao-m7-f07/", "sourceCard": 4, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "ordenar", "p": "Como se classifica uma oração subordinada, por ordem:", "passos": ["Procura a palavra que liga", "Diz o que a oração faz", "Dá o nome à oração"], "f": "Primeiro o conector («como se», «que», «porque»), depois a função, depois o nome.", "recycledFrom": "/pt/m7/licao-m7-f07/", "sourceCard": 18, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}]}</script>
