<script id="exame-aquecimento-dados" type="application/json">{"sessao": "s01", "versao": 1, "titulo": "Cantigas: comparar sem confundir", "cartoes": [{"t": "ler", "rot": "Abre", "titulo": "Aquecer", "html": "<p class=\"abre-t\">Cantigas: comparar sem confundir<\/p><p><b>Objetivo:<\/b> voz e natureza na lírica medieval.<\/p><p>Doze cartões, dez minutos. O texto de apoio está no cartão seguinte. A seguir, voltas à sessão para ler e escrever no caderno.<\/p>", "recycledFrom": "/pt/exame/", "adaptacao": "Cartão de abertura da sessão (02/11/2026)."}, {"t": "ler", "titulo": "Texto para consultar", "html": "<p>Consulta o texto quando precisares de confirmar uma escolha.<\/p><details><summary>Abrir o texto de apoio<\/summary><div><p class=\"v\"><span class=\"ln\" data-l=\"0-0\">Ondas do mar de Vigo,<\/span>\n<span class=\"ln\" data-l=\"0-1\">se vistes meu amigo?<\/span>\n<span class=\"ln\" data-l=\"0-2\">e ai Deus, se verrá cedo?<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"0-4\">Ondas do mar levado,<\/span>\n<span class=\"ln\" data-l=\"0-5\">se vistes meu amado?<\/span>\n<span class=\"ln\" data-l=\"0-6\">e ai Deus, se verrá cedo?<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"0-8\">Se vistes meu amigo,<\/span>\n<span class=\"ln\" data-l=\"0-9\">o por que eu sospiro?<\/span>\n<span class=\"ln\" data-l=\"0-10\">e ai Deus, se verrá cedo?<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"0-12\">Se vistes meu amado,<\/span>\n<span class=\"ln\" data-l=\"0-13\">o por que hei gram coidado?<\/span>\n<span class=\"ln\" data-l=\"0-14\">e ai Deus, se verrá cedo?<\/span><\/p><p class=\"fonte\">Martim Codax (séc. XIII), «Ondas do mar de Vigo», cantiga 1308, <i>Cantigas Medievais Galego-Portuguesas<\/i> (FCSH/NOVA): a cantiga inteira, com a grafia da edição.<\/p><p class=\"v\"><span class=\"ln\" data-l=\"1-0\">Quer'eu em maneira de proençal<\/span>\n<span class=\"ln\" data-l=\"1-1\">fazer agora um cantar d'amor<\/span>\n<span class=\"ln\" data-l=\"1-2\">e querrei muit'i loar mia senhor<\/span>\n<span class=\"ln\" data-l=\"1-3\">a que prez nem fremosura nom fal,<\/span>\n<span class=\"ln\" data-l=\"1-4\">nem bondade; e mais vos direi en:<\/span>\n<span class=\"ln\" data-l=\"1-5\">tanto a fez Deus comprida de bem<\/span>\n<span class=\"ln\" data-l=\"1-6\">que mais que todas las do mundo val.<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"1-8\">Ai dona fea, fostes-vos queixar<\/span>\n<span class=\"ln\" data-l=\"1-9\">que vos nunca louv'en[o] meu cantar;<\/span>\n<span class=\"ln\" data-l=\"1-10\">mais ora quero fazer um cantar<\/span>\n<span class=\"ln\" data-l=\"1-11\">em que vos loarei todavia;<\/span>\n<span class=\"ln\" data-l=\"1-12\">e vedes como vos quero loar:<\/span>\n<span class=\"ln\" data-l=\"1-13\">dona fea, velha e sandia!<\/span><\/p><p class=\"fonte\">D. Dinis, cantiga 544 (cantiga de amor), e Guilhade, cantiga 1520 (escárnio e maldizer), primeiras estrofes, <i>Cantigas Medievais Galego-Portuguesas<\/i> (FCSH/NOVA). Inteiras na lição «Louvar e troçar».<\/p><p class=\"fonte\"><a href=\"../../../m1/licao-m1-f19/\" target=\"_blank\" rel=\"noopener\">Texto e fontes na lição de origem<\/a><\/p><\/div><\/details>", "recycledFrom": "/pt/m1/licao-m1-f19/", "rot": "Texto de apoio"}, {"p": "Mendinho (lição «Cercada pelas ondas»): «cercarom-mi as ondas». Codax: «se vistes meu amigo?». Que papel tem o mar em cada uma?", "f": "Em Codax, o mar ouve: é a quem se pergunta. Em Mendinho, o mar cerca. A mesma espera do amigo, dois mares.", "legacyId": "s01-q1", "recycledFrom": "/pt/m1/licao-m1-f19/", "t": "escolha", "o": ["Em Mendinho cerca; em Codax escuta.", "Em Mendinho salva; em Codax ameaça.", "Em Mendinho cala; em Codax castiga."], "c": 0, "fe": [null, "O verso de Mendinho descreve um cerco, não um salvamento.", "Nenhuma das passagens apresenta o mar como castigo."]}, {"t": "emparelhar", "p": "Na cantiga inteira de Codax, que repetição faz cada verso?", "pares": [["«e ai Deus, se verrá cedo?», no fim das quatro estrofes", "refrão"], ["«Ondas do mar levado», a seguir a «Ondas do mar de Vigo»", "paralelismo"], ["«Se vistes meu amigo», a abrir a estrofe 3", "leixa-pren"]], "f": "O refrão fecha as quatro estrofes, igual. A estrofe 2 diz quase o mesmo que a 1, com «levado» e «amado» trocados: paralelismo. O 2.º verso da estrofe 1, «se vistes meu amigo?», volta a abrir a 3: leixa-pren.", "fe": "Pergunta a cada verso: volta igual no fim de todas as estrofes, repete a estrofe anterior com uma troca, ou passa do 2.º verso para o começo de uma estrofe adiante?", "recycledFrom": "/pt/m1/licao-m1-f19/", "sourceCard": 4}, {"t": "vf", "p": "Caso imaginário: um colega diz «Já está feito!» sem o ter feito, e quer que acreditem. É mentira, não ironia.", "v": true, "fe": "Responder «falso» é chamar ironia a tudo o que contraria a verdade. Quem é irónico quer ser apanhado; este colega quer que acreditem nele.", "f": "Verdadeiro: **quem mente quer que acreditem; quem é irónico quer ser apanhado**. Na ironia, a situação denuncia a frase; aqui, nada a denuncia, e o colega conta com isso.", "recycledFrom": "/pt/m1/licao-m1-f19/", "sourceCard": 12}, {"t": "emparelhar", "p": "Três casos imaginários e um verso de Codax: em cada um, há ironia, paródia ou nenhuma das duas?", "pares": [["Uma hora à espera do autocarro: «Que rapidez!»", "ironia"], ["A turma faz um telejornal a fingir, para fazer rir com o fim dos testes", "paródia"], ["A sopa está boa, e alguém diz: «Que sopa boa!»", "nenhuma"], ["«e ai Deus, se verrá cedo?», pergunta a rapariga de Codax", "nenhuma"]], "f": "«Que rapidez!» diz o contrário, e a espera denuncia-o: ironia. O telejornal a fingir imita a forma de um género para fazer rir: paródia. A sopa e a pergunta de Codax dizem o que querem dizer. Só o verso de Codax é citado; os outros casos foram inventados.", "fe": "Pergunta a cada caso: imita a forma de um género? Diz o contrário, e a situação mostra-o? Ou diz o que quer dizer?", "recycledFrom": "/pt/m1/licao-m1-f19/", "sourceCard": 16}, {"p": "Em «se vistes meu amigo?», quem pergunta é Martim Codax, a falar da sua amada.", "f": "Falso: autor e voz não se confundem. Codax escreve; quem pergunta às ondas é uma rapariga à espera do «amigo».", "legacyId": "s01-q2", "recycledFrom": "/pt/m1/licao-m1-f19/", "t": "vf", "v": false, "fe": "Responder «verdadeiro» é confundir o autor com a voz. Relê o refrão: quem pergunta pelo «amigo» é uma rapariga, não Codax."}, {"t": "sublinhar", "cita": "Ondas do mar de Vigo, / se vistes meu amigo?", "p": "Toca nas duas palavras da estrofe 2 que não estão na estrofe 1.", "frase": "Ondas do mar levado, se vistes meu amado?", "certas": [3, 7], "f": "**Levado** troca «de Vigo» e **amado** troca «amigo»; o resto repete-se. É o **paralelismo**: a estrofe 2 diz quase o mesmo que a 1, com duas palavras trocadas. O refrão, esse, fica igual.", "recycledFrom": "/pt/m1/licao-m1-f11/", "sourceCard": 3, "fe": "Compara com «Ondas do mar de Vigo, / se vistes meu amigo?»: «Ondas do mar» e «se vistes meu» repetem-se; só muda a última palavra de cada verso."}, {"t": "vf", "cita": "Ondas do mar levado,", "p": "Nas duas primeiras estrofes de Codax há leixa-pren: «se vistes meu amigo?» volta a abrir a estrofe 2.", "v": false, "fe": "A estrofe 2 abre com «Ondas do mar levado»: diz quase o mesmo que a 1, com palavras trocadas. Isso é paralelismo; o leixa-pren desta cantiga só vem depois, da estrofe 1 para a 3.", "f": "Falso: no **leixa-pren**, o segundo verso de uma estrofe volta a abrir uma estrofe seguinte. Em Codax, «se vistes meu amigo?» só volta a abrir a estrofe 3; entre a 1 e a 2 há paralelismo.", "recycledFrom": "/pt/m1/licao-m1-f11/", "sourceCard": 5}, {"t": "vf", "p": "Na frase de treino _A rapariga pergunta às ondas, mas as ondas não respondem_, trocar «mas» por «e» torna a segunda oração copulativa.", "v": true, "fe": "Com «e», a ligação passa a somar: copulativa. O contraste entre perguntar e não ter resposta continua a perceber-se, mas vem da situação, não da conjunção.", "f": "Verdadeiro: com **«mas»**, a segunda oração é coordenada adversativa; com **«e»**, passa a copulativa, porque a ligação soma. O contraste entre perguntar e não ter resposta fica, mas vem do contexto, não da conjunção.", "recycledFrom": "/pt/m1/licao-m1-f11/", "sourceCard": 16}, {"p": "Em «e mais vos direi en», que marca evidencia a interpelação de um destinatário?", "f": "«Vos» marca a segunda pessoa: a voz dirige-se a alguém. A identificação do destinatário exige depois o contexto da cantiga.", "legacyId": "s01-q3", "recycledFrom": "/pt/m1/licao-m1-f19/", "t": "escolha", "o": ["A segunda pessoa em «vos».", "A primeira pessoa em «direi».", "A marca de tempo em «mais»."], "c": 0, "fe": [null, "«Direi» marca quem fala, não a quem se fala.", "«Mais» não marca aqui um destinatário nem um tempo; só «vos» aponta para quem ouve."]}, {"t": "completar", "p": "Completa a distinção entre repetição e mudança.", "frase": "O verso que volta no fim de cada estrofe funciona como [1]; trocar «amigo» por «amado» conserva uma construção em [2].", "lacunas": [{"o": ["um refrão", "uma finda", "um dístico"], "c": 0, "fe": [null, "A finda fecha a cantiga uma só vez; o verso que volta no fim de cada estrofe é o refrão.", "Um dístico são dois versos seguidos; o que volta igual no fim de cada estrofe é um só verso, o refrão."]}, {"o": ["paralelismo", "encadeamento", "aliteração"], "c": 0, "fe": [null, "Encadeamento é outro nome do leixa-pren: um verso passa de uma estrofe para o começo de outra. Trocar «amigo» por «amado» repete a construção: paralelismo.", "A aliteração repete sons consonânticos; aqui repete-se a construção inteira do verso, só com uma palavra trocada: paralelismo."]}], "f": "O refrão regressa na mesma posição; o paralelismo repete a construção com palavras diferentes. Procura o fim das estrofes e depois compara os segundos versos.", "fe": "Procura o verso que volta no fim das quatro estrofes; depois compara «meu amigo» com «meu amado».", "recycledFrom": "/pt/m1/licao-m1-f19/", "sourceCard": 4, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "ordenar", "p": "Ordena a verificação de uma repetição entre estrofes.", "passos": ["Ler as duas estrofes por inteiro", "Pôr lado a lado os versos correspondentes", "Distinguir palavras repetidas e palavras trocadas", "Nomear o procedimento e apontar os versos"], "f": "Começa pela comparação dos versos, não pelo nome do recurso. Uma palavra repetida, sozinha, não prova todos os tipos de repetição.", "fe": "Não se dá nome ao recurso antes de comparar: lês as duas estrofes, pões os versos lado a lado e só depois distingues o que se repete do que muda.", "recycledFrom": "/pt/m1/licao-m1-f19/", "sourceCard": 4, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "sublinhar", "p": "Neste exemplo imaginário, toca nas palavras que contradizem o elogio.", "frase": "Depois de uma hora à espera, alguém diz: «Que rapidez!»", "certas": [2, 3, 4, 5], "f": "**Uma hora à espera** contradiz «rapidez». Sem a situação, as palavras poderiam ser um elogio literal.", "fe": "A ironia está no choque entre a frase e a situação: toca na situação que desmente «Que rapidez!», não na frase.", "recycledFrom": "/pt/m1/licao-m1-f19/", "sourceCard": 16, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}]}</script>
