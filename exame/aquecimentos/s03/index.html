], ["«Experiência dá lição»", "Inês no fim"]], "f": "No **início**, Inês queixa-se da casa e do lavrar; no **fim**, escolhe a frio e manda.", "recycledFrom": "/pt/m2/licao-m2-f08/", "sourceCard": 4, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "ordenar", "p": "As partes da apreciação crítica, por ordem:", "passos": ["Identifica obra, autor, data e personagem", "Descreve Inês no início", "Descreve a mudança até ao desfecho", "Aprecia com citações e conclui"], "f": "Introdução, dois desenvolvimentos descritivos, o juízo com citações e a conclusão com atualidade.", "recycledFrom": "/pt/m2/licao-m2-f08/", "sourceCard": 6, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "sublinhar", "p": "Apenas com esta fala de Inês, «Encerrada nesta casa», que palavra da conclusão excede a prova disponível?", "frase": "Inês viveu sempre sem poder sair de casa.", "certas": [2], "f": "**Sempre** alarga a conclusão à vida inteira. A fala sustenta a queixa de encerramento neste momento; não comprova todas as situações anteriores ou posteriores. Uma interpretação ganha precisão quando delimita o alcance da prova.", "recycledFrom": "/pt/m2/licao-m2-f08/", "sourceCard": 7, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "completar", "p": "Como se chega à tese da apreciação?", "frase": "Uma tese é uma frase que se pode [1] e escreves [2] antes de escolher a melhor.", "lacunas": [{"o": ["provar com citações do texto", "copiar do «essencial» da lição"], "c": 0, "fe": [null, "Nesta lacuna, copiar do «essencial» da lição não corresponde à relação pedida."]}, {"o": ["três", "duas"], "c": 0, "fe": [null, "Nesta lacuna, duas não corresponde à relação pedida."]}], "f": "**Três** teses de natureza diferente; fica a que tem mais e melhores **provas no texto**.", "recycledFrom": "/pt/m2/licao-m2-f08/", "sourceCard": 8, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "completar", "p": "Com que palavras se marca o juízo na apreciação?", "frase": "O juízo marca-se com modalização apreciativa, [1] e verbos de opinião, em registo [2] do princípio ao fim.", "lacunas": [{"o": ["adjetivos e advérbios", "numerais e determinantes"], "c": 0, "fe": [null, "Nesta lacuna, numerais e determinantes não corresponde à relação pedida."]}, {"o": ["formal", "poético"], "c": 0, "fe": [null, "Nesta lacuna, poético não corresponde à relação pedida."]}], "f": "Apreciar é dizer o que se pensa com palavras de juízo, **adjetivos e advérbios**, em registo **formal**.", "recycledFrom": "/pt/m2/licao-m2-f08/", "sourceCard": 11, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "emparelhar", "p": "Com «Encerrada nesta casa» como única passagem de apoio, distingue o que se cita, o que se interpreta e o que se inventa.", "pares": [["Inês diz «Encerrada nesta casa».", "Citação da passagem"], ["A queixa permite discutir uma limitação da liberdade.", "Interpretação apoiada na passagem"], ["Inês esteve encerrada durante dez anos.", "Informação que a passagem não fornece"]], "f": "A **citação** recupera palavras; a **interpretação** explica o seu alcance; os **dez anos** acrescentam uma informação ausente. Não basta colocar uma citação ao lado de qualquer afirmação.", "recycledFrom": "/pt/m2/licao-m2-f08/", "sourceCard": 12, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "sublinhar", "p": "No parágrafo modelo, toca na palavra que diz que mais ninguém cumpre o que diz.", "frase": "é o único que cumpre o que diz.", "certas": [2], "f": "«Único» exprime exclusividade no modelo. Para aceitar esse juízo, é preciso confrontar promessas e comportamentos das várias personagens: esta palavra, sozinha, não é uma prova.", "recycledFrom": "/pt/m2/licao-m2-f08/", "sourceCard": 13, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "sublinhar", "p": "Toca nas duas palavras que a tese modelo nega sobre Inês.", "frase": "Inês não é uma vítima passiva: é ela quem escolhe, duas vezes,", "certas": [4, 5], "f": "«Vítima passiva» são as palavras negadas pela tese do modelo. Identificar essa negação não obriga a aceitar toda a tese: discute as escolhas de Inês e as restrições que sofreu com passagens concretas.", "recycledFrom": "/pt/m2/licao-m2-f08/", "sourceCard": 16, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "completar", "p": "Que verificas ao reler a primeira versão?", "frase": "Lês o texto em [1] e cortas o que [2].", "lacunas": [{"o": ["voz alta", "voz baixa"], "c": 0, "fe": [null, "Nesta lacuna, voz baixa não corresponde à relação pedida."]}, {"o": ["repete", "aprecia"], "c": 0, "fe": [null, "Nesta lacuna, aprecia não corresponde à relação pedida."]}], "f": "Ler em voz alta ajuda a notar frases difíceis; cortar o que repete torna a resposta mais precisa.", "recycledFrom": "/pt/m2/licao-m2-f08/", "sourceCard": 18, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}]}</script>
