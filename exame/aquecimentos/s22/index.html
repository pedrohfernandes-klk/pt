<script id="exame-aquecimento-dados" type="application/json">{"sessao": "s22", "versao": 1, "titulo": "Gramática: ligar, retomar e situar", "cartoes": [{"t": "ler", "rot": "Abre", "titulo": "Aquecer", "html": "<p class=\"abre-t\">Gramática: ligar, retomar e situar<\/p><p><b>Objetivo:<\/b> coesão, referência, tempos e modalidade em uso.<\/p><p>Doze cartões, dez minutos. O texto de apoio está no cartão seguinte. A seguir, voltas à sessão para ler e escrever no caderno.<\/p>", "recycledFrom": "/pt/exame/", "adaptacao": "Cartão de abertura da sessão (02/11/2026)."}, {"t": "ler", "titulo": "Texto para consultar", "html": "<p>Consulta o texto quando precisares de confirmar uma escolha.<\/p><details><summary>Abrir o texto de apoio<\/summary><div><p class=\"v\"><span class=\"ln\" data-l=\"0-0\">Estou hoje vencido, como se soubesse a verdade.<\/span>\n<span class=\"ln\" data-l=\"0-1\">Estou hoje lúcido, como se estivesse para morrer,<\/span><\/p><p class=\"fonte\">Álvaro de Campos, «Tabacaria» (15-1-1928); Arquivo Pessoa.<\/p><p class=\"v\"><span class=\"ln\" data-l=\"1-0\">Sossegadamente fitemos o seu curso e aprendamos<\/span>\n<span class=\"ln\" data-l=\"1-1\">Que a vida passa, e não estamos de mãos enlaçadas.<\/span><\/p><p class=\"fonte\">Ricardo Reis, «Vem sentar-te comigo, Lídia, à beira do rio» (12-6-1914); Arquivo Pessoa.<\/p><p class=\"v\"><span class=\"ln\" data-l=\"2-0\">A realidade<\/span>\n<span class=\"ln\" data-l=\"2-1\">Sempre é mais ou menos<\/span>\n<span class=\"ln\" data-l=\"2-2\">Do que nós queremos.<\/span><\/p><p class=\"v\"><span class=\"ln\">[…]<\/span><\/p><p class=\"v\"><span class=\"ln\" data-l=\"2-4\">Os deuses são deuses<\/span>\n<span class=\"ln\" data-l=\"2-5\">Porque não se pensam.<\/span><\/p><p class=\"fonte\">Ricardo Reis, «Segue o teu destino» (1-7-1916); Arquivo Pessoa.<\/p><p class=\"fonte\"><a href=\"../../../m7/licao-m7-f07/\" target=\"_blank\" rel=\"noopener\">Texto e fontes na lição de origem<\/a><\/p><\/div><\/details>", "recycledFrom": "/pt/m7/licao-m7-f07/", "rot": "Texto de apoio"}, {"p": "Na frase de treino _Inês viu a mãe quando ela entrou_, o que convém rever?", "f": "Sem contexto, «ela» pode remeter para referentes diferentes. A revisão deve explicitar quem entrou.", "legacyId": "s22-q1", "recycledFrom": "/pt/m7/licao-m7-f07/", "t": "escolha", "o": ["A identidade de quem é «ela».", "A necessidade de retirar «viu».", "A obrigação de encurtar a frase."], "c": 0, "fe": [null, "Retirar «viu» não esclarece a identidade do pronome.", "O problema é o referente, não uma regra sobre extensão."]}, {"t": "emparelhar", "p": "Liga cada pedaço ou valor ao conector a que pertence.", "pares": [["«como se estivesse para morrer»", "«Como se»"], ["«porque não se pensam»", "«Porque»"], ["Hipótese, com conjuntivo", "«Como se»"], ["Causa, com indicativo", "«Porque»"]], "f": "«Como se» abre uma hipótese, com conjuntivo; «porque» fecha com uma causa, no indicativo.", "recycledFrom": "/pt/m7/licao-m7-f07/", "sourceCard": 4, "fe": "Trocaste os conectores. «Como se» abre uma hipótese e pede conjuntivo («estivesse»); «porque» dá uma causa, com indicativo («não se pensam»)."}, {"t": "sublinhar", "p": "No verso de Álvaro de Campos, toca nas duas palavras que abrem a oração comparativa hipotética.", "frase": "Estou hoje vencido, como se soubesse a verdade.", "certas": [3, 4], "f": "«**Como se**»: abre a comparação hipotética e leva o verbo ao conjuntivo.", "recycledFrom": "/pt/m7/licao-m7-f07/", "sourceCard": 5, "fe": "Marcaste o verbo da oração, não o que a abre. A comparativa hipotética começa por duas palavras juntas, logo a seguir à vírgula."}, {"t": "completar", "p": "Que oração é «como se soubesse a verdade»?", "frase": "Em «Estou hoje vencido, como se soubesse a verdade», a oração é subordinada adverbial [1] e exprime uma [2].", "lacunas": [{"o": ["comparativa", "condicional", "concessiva"], "c": 0, "fe": [null, "A condicional põe uma condição, com «se»; aqui «como se» compara com uma situação imaginada: comparativa.", "A concessiva admite um obstáculo, com «embora»; «como se» compara: é comparativa."]}, {"o": ["hipótese", "oposição", "concessão"], "c": 0, "fe": [null, "Não se opõem duas ideias: imagina-se uma situação que não é real, uma hipótese.", "A concessão é da versão com «embora»; «como se soubesse» exprime uma hipótese."]}], "f": "Subordinada adverbial **comparativa**, hipotética: exprime uma **hipótese**, não um facto.", "recycledFrom": "/pt/m7/licao-m7-f07/", "sourceCard": 7, "fe": "Repara no conector «como se»: compara com uma situação imaginada e leva o verbo ao conjuntivo; é comparativa e exprime uma hipótese."}, {"p": "Que relação exprime «contudo»?", "f": "O conector orienta a leitura para um contraste; deve corresponder à relação efetiva entre as ideias.", "legacyId": "s22-q2", "recycledFrom": "/pt/m7/licao-m7-f07/", "t": "escolha", "o": ["Uma oposição ao que se esperava.", "Uma causa para o que se afirmou.", "Uma repetição do que já foi dito."], "c": 0, "fe": [null, "«Contudo» não introduz uma causa.", "O conector contraria uma expectativa em vez de repetir a afirmação."]}, {"t": "vf", "p": "Em «Estou hoje lúcido, como se estivesse para morrer», «estivesse» está no conjuntivo, como «soubesse».", "v": true, "f": "Verdadeiro: «como se» pede o **conjuntivo**, «estivesse», «soubesse»: a morte fica como hipótese.", "fe": "É verdadeiro: depois de «como se», o verbo vai para o conjuntivo: «estivesse», como «soubesse».", "recycledFrom": "/pt/m7/licao-m7-f07/", "sourceCard": 8}, {"t": "completar", "p": "Que oração é «Que a vida passa»?", "frase": "Em «fitemos o seu curso e aprendamos / Que a vida passa», «Que a vida passa» é [1] e funciona como [2] de «aprendamos».", "lacunas": [{"o": ["subordinada completiva", "subordinada concessiva", "subordinada relativa"], "c": 0, "fe": [null, "A concessiva admite um obstáculo, com «embora»; «que a vida passa» completa o verbo «aprendamos»: completiva.", "A relativa refere-se a um nome que vem antes; aqui «que» introduz o que se aprende: completiva."]}, {"o": ["complemento direto", "complemento oblíquo", "sujeito da oração"], "c": 0, "fe": [null, "O complemento oblíquo é introduzido por preposição; «que a vida passa» responde a «aprendamos o quê?»: complemento direto.", "O sujeito de «aprendamos» somos nós; «que a vida passa» é o que aprendemos: complemento direto."]}], "f": "**Substantiva completiva**: completa o verbo **«aprendamos»**; o que aprendemos é «que a vida passa».", "recycledFrom": "/pt/m7/licao-m7-f07/", "sourceCard": 9, "fe": "Pergunta ao verbo: aprendamos o quê? «Que a vida passa» responde; é uma completiva e funciona como complemento direto."}, {"t": "sublinhar", "p": "Toca na palavra que liga as duas orações e dá a causa.", "frase": "Os deuses são deuses porque não se pensam.", "certas": [4], "f": "«**Porque**»: introduz a razão de os deuses serem deuses.", "recycledFrom": "/pt/m7/licao-m7-f07/", "sourceCard": 10, "fe": "Marcaste os deuses ou a negação, não a palavra que liga as orações. Procura o conector que vem antes de «não se pensam»."}, {"p": "Na frase de treino _Talvez a personagem reconheça o erro_, «talvez» apresenta…", "f": "A marca de modalidade indica possibilidade; não transforma a interpretação numa certeza.", "legacyId": "s22-q3", "recycledFrom": "/pt/m7/licao-m7-f07/", "t": "escolha", "o": ["a possibilidade de acontecer", "a certeza de que já aconteceu", "uma ordem para que aconteça"], "c": 0, "fe": [null, "«Talvez» impede tomar a afirmação como certeza absoluta.", "A frase não ordena à personagem que reconheça o erro."]}, {"t": "completar", "p": "Que versão é «embora não saiba a verdade», e o que faz?", "frase": "«Estou hoje vencido, embora não saiba a verdade» é a versão [1] da frase e opõe duas [2].", "lacunas": [{"o": ["concessiva", "comparativa", "condicional"], "c": 0, "fe": [null, "A comparativa é a versão com «como se»; com «embora», a frase é concessiva.", "A condicional põe uma condição com «se»; «embora» concede: concessiva."]}, {"o": ["ideias", "causas", "pessoas"], "c": 0, "fe": [null, "Não há causas a opor: «embora» junta duas ideias que parecem não combinar.", "O sujeito é o mesmo; o que se opõe são duas ideias: estar vencido e não saber a verdade."]}], "f": "**Concessiva**, com «embora»: opõe duas **ideias**, estar vencido e não saber.", "recycledFrom": "/pt/m7/licao-m7-f07/", "sourceCard": 15, "fe": "Repara em «embora»: a oração admite uma coisa que parecia contrariar a outra. É concessiva e opõe duas ideias."}, {"t": "ordenar", "p": "Como se classifica uma oração subordinada, por ordem:", "passos": ["Procura a palavra que liga", "Diz o que a oração faz", "Dá o nome à oração"], "f": "Primeiro o conector («como se», «que», «porque»), depois a função, depois o nome.", "recycledFrom": "/pt/m7/licao-m7-f07/", "sourceCard": 18, "fe": "Trocaste a ordem. Primeiro encontras a palavra que liga, depois dizes o que a oração faz, e só no fim lhe dás o nome."}, {"t": "emparelhar", "p": "Liga cada conector ao valor que dá à oração.", "pares": [["como se", "comparação hipotética"], ["porque", "causa"], ["embora", "concessão"]], "f": "«Como se» compara por hipótese, «porque» dá a causa, «embora» concede.", "recycledFrom": "/pt/m7/licao-m7-f07/", "sourceCard": 19, "fe": "Trocaste os valores. «Como se» compara por hipótese; «porque» dá a causa; «embora» concede."}]}</script>
