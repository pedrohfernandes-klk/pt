<script id="exame-aquecimento-dados" type="application/json">{"sessao": "s08", "versao": 1, "titulo": "Prosa romântica: paixão e condicionamento", "cartoes": [{"t": "ler", "titulo": "Texto para consultar", "html": "<p>Consulta o texto quando precisares de confirmar uma escolha.<\/p><details><summary>Abrir o texto de apoio<\/summary><p class=\"pr\" data-l=\"0-0\"><b>[1]<\/b> Folheando os livros de antigos assentamentos, no cartorio das cadêas da Relação do Porto, li, no das entradas dos presos desde 1803 a 1805, a folhas 232, o seguinte:<\/p><p class=\"pr\" data-l=\"0-1\"><b>[2]<\/b> <i>Simão Antonio Botelho, que assim disse chamar-se, ser solteiro, e estudante na Universidade de Coimbra, natural da cidade de Lisboa, e assistente na occasião de sua prisão na cidade de Vizeu, idade de dezoito annos, filho de Domingos José Correia Botelho e de D. Rita Preciosa Caldeirão Castello-Branco, estatura ordinaria, cara redonda, olhos castanhos, cabello e barba preta, vestido com jaqueta de baetão azul, collête de fustão pintado e calça de panno pedrez. E fiz este assento, que assignei.<\/i><\/p><p class=\"pr\" data-l=\"0-2\"><b>[3]<\/b> <i>Filippe Moreira Dias<\/i>.<\/p><p class=\"pr\" data-l=\"0-3\"><b>[4]<\/b> Á margem esquerda d'este assento está escripto: <i>Foi para a India em 17 de Março de 1807<\/i>.<\/p><p class=\"pr\" data-l=\"0-4\"><b>[5]<\/b> Não será fiar demasiadamente na sensibilidade do leitor, se cuido que o degredo de um moço de dezoito annos lhe havia de fazer dó.<\/p><p class=\"pr\" data-l=\"0-5\"><b>[6]<\/b> Dezoito annos! O arrebol dourado e escarlate da manhã da vida! As louçanias do coração que ainda não sonha em fructos, e todo se embalsama no perfume das flôres! Dezoito annos! O amor d'aquella idade! A passagem do seio da familia, dos braços de mãe, dos beijos das irmãs para as caricias mais dôces da virgem, que se lhe abre ao lado como flôr da mesma sazão e dos mesmos aromas, e á mesma hora da vida! Dezoito annos!... E degradado da patria, do amor, e da familia! Nunca mais o ceo de Portugal, nem liberdade, nem irmãos, nem mãe, nem rehabilitação, nem dignidade, nem um amigo!... É triste!<\/p><p class=\"pr\" data-l=\"0-6\"><b>[7]<\/b> O leitor de certo se compungia; e a leitora se lhe dissessem, em menos de uma linha, a historia d'aquelles dezoito annos, choraria! Pois não? A olhos enchutos poderia ouvil-a a mulher, a creatura mais bem formada das branduras da piedade, a que por vezes traz comsigo do ceo um reflexo da divina misericordia, essa, a minha leitora, a carinhosa amiga de todos os infelizes não choraria se lhe dissessem que o pobre moço perdêra honra, rehabilitação, patria, liberdade, irmãs, mãe, tudo, por amor da primeira mulher que o despertou do seu dormir de innocentes desejos?!<\/p><p class=\"fonte\">Camilo Castelo Branco, <i>Amor de Perdição<\/i> (1862) (grafia da edição).<\/p><p class=\"fonte\"><a href=\"../../../m5/licao-m5-f02/\">Texto e fontes na lição de origem<\/a><\/p><\/details>", "recycledFrom": "/pt/m5/licao-m5-f02/"}, {"p": "«natural da cidade de Lisboa, e assistente na occasião de sua prisão na cidade de Vizeu»: o que diz?", "f": "Natural de Lisboa, assistente em Viseu: «assistente» é residente; a prisão foi em Viseu.", "legacyId": "s08-q1", "recycledFrom": "/pt/m5/licao-m5-f02/", "t": "escolha", "o": ["Nasceu em Lisboa e vivia em Viseu", "Nasceu em Viseu e vivia em Coimbra", "Nasceu em Coimbra e vivia no Porto"], "c": 0, "fe": [null, "Trocas o lugar de nascimento pelo de residência.", "Porto e Coimbra não são os lugares indicados nesta expressão."]}, {"p": "A nota sobre a ida para a Índia está escrita no fim do assento, depois da assinatura.", "f": "Falso: está «á margem esquerda d'este assento», escrita depois, à parte; o assento acaba na assinatura.", "legacyId": "s08-q2", "recycledFrom": "/pt/m5/licao-m5-f02/", "t": "vf", "v": false, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"p": "«o degredo de um moço de dezoito annos lhe havia de fazer dó»: que reação espera o narrador?", "f": "Dó: o narrador aposta na sensibilidade de quem lê antes de contar uma linha da história.", "legacyId": "s08-q3", "recycledFrom": "/pt/m5/licao-m5-f02/", "t": "escolha", "o": ["Compaixão pelo jovem degredado.", "Desconfiança do registo prisional.", "Condenação do jovem prisioneiro."], "c": 0, "fe": [null, "Fazer dó indica compaixão, não suspeita da fonte.", "O narrador pede uma reação ao sofrimento, não uma sentença judicial."]}, {"t": "sublinhar", "p": "Toca na palavra que mostra que é o narrador quem leu o livro da cadeia.", "frase": "no cartorio das cadêas da Relação do Porto, li, no das entradas dos presos", "certas": [8], "f": "**«li»**: o narrador apresenta-se como quem encontrou o documento no arquivo; o romance abre com um papel verdadeiro.", "cita": "Folheando os livros de antigos assentamentos, no cartorio das cadêas da Relação do Porto, li, no das entradas dos presos desde 1803 a 1805, a folhas…", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 5, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "completar", "p": "Que tom tem o assento quando regista os pais, a idade e a roupa de Simão?", "frase": "O assento regista a filiação, a idade e a roupa de Simão num tom [1], sem um [2].", "lacunas": [{"o": ["neutro", "emotivo"], "c": 0, "fe": [null, "Nesta lacuna, emotivo não corresponde à relação pedida."]}, {"o": ["juízo", "número"], "c": 0, "fe": [null, "Nesta lacuna, número não corresponde à relação pedida."]}], "f": "Tom **neutro**, de documento: descreve Simão de fora, sem um **juízo**; a emoção fica para o narrador.", "cita": "Simão Antonio Botelho, que assim disse chamar-se, ser solteiro, e estudante na Universidade de Coimbra, natural da cidade de Lisboa, e assistente na…", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 7, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "sublinhar", "p": "Toca nas duas palavras seguidas que fazem a comparação da rapariga amada com uma flor.", "frase": "da virgem, que se lhe abre ao lado como flôr da mesma sazão", "certas": [8, 9], "f": "**«como flôr»**: a virgem abre-se ao lado do moço como uma flor da mesma estação; é uma comparação.", "cita": "Dezoito annos! O arrebol dourado e escarlate da manhã da vida!", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 11, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "versos", "p": "Põe pela ordem do texto estas quatro frases do narrador.", "linhas": ["As louçanias do coração que ainda não sonha em fructos", "O amor d'aquella idade!", "E degradado da patria, do amor, e da familia!", "É triste!"], "f": "Primeiro o viço e o amor da idade, depois o degredo e, a fechar, o juízo: «É triste!».", "cita": "Dezoito annos! O arrebol dourado e escarlate da manhã da vida!", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 13, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "emparelhar", "p": "Liga cada expressão à voz que a diz.", "pares": [["«estatura ordinaria, cara redonda»", "O assento da cadeia"], ["«Dezoito annos!»", "A voz do narrador"], ["«E fiz este assento, que assignei.»", "O assento da cadeia"], ["«É triste!»", "A voz do narrador"]], "f": "O assento descreve Simão sem um juízo; o narrador exclama e fala à leitora para a comover.", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 19, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "vf", "p": "O assento usa frases curtas e exclamativas; o narrador, frases longas e informativas.", "v": false, "f": "Falso: é ao contrário. O **assento** tem frases longas e informativas; o **narrador**, exclamações curtas e enumerações.", "fe": "É ao contrário: o assento é uma frase longa e neutra («estatura ordinaria, cara redonda»); as exclamações curtas, como «Dezoito annos!», são do narrador.", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 21}, {"t": "emparelhar", "p": "Liga cada expressão ou efeito ao registo a que pertence.", "pares": [["«estatura ordinaria, cara redonda»", "assento: descrição exterior"], ["«É triste!»", "narrador: juízo em exclamação"], ["Credibilidade", "efeito do documento"], ["Comoção", "efeito da voz do narrador"]], "f": "O assento descreve e dá credibilidade; o narrador exclama e comove: dois registos na mesma página.", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 22, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "ordenar", "p": "Como se lê a Introdução, por ordem:", "passos": ["Lê o assento como documento", "Repara na nota à margem", "Ouve a voz que exclama", "Distingue documento de ficção"], "f": "Primeiro o documento e a sua margem, depois a voz, por fim a distinção: o papel é real, a história é ficção.", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 23, "fe": "Confere o indício e a relação pedidos, antes de voltares a responder."}, {"t": "vf", "p": "«Abrir com um documento é a melhor maneira de começar um romance» é uma opinião, não um facto.", "v": true, "f": "Verdadeiro: «a melhor maneira» é um juízo de valor, uma **opinião**; o facto é que o romance abre com um documento.", "fe": "É verdadeiro: «a melhor maneira» é um juízo de valor, e há quem prefira outro começo. Facto é só que o romance abre com o assento.", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 24}]}</script>
