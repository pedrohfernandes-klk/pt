<script id="exame-aquecimento-dados" type="application/json">{"sessao": "s08", "versao": 1, "titulo": "Prosa romântica: paixão e condicionamento", "cartoes": [{"t": "ler", "rot": "Abre", "titulo": "Aquecer", "html": "<p class=\"abre-t\">Prosa romântica: paixão e condicionamento<\/p><p><b>Objetivo:<\/b> relacionar escolhas individuais e regras sociais.<\/p><p>Doze cartões, dez minutos. O texto de apoio está no cartão seguinte. A seguir, voltas à sessão para ler e escrever no caderno.<\/p>", "recycledFrom": "/pt/exame/", "adaptacao": "Cartão de abertura da sessão (02/11/2026)."}, {"t": "ler", "titulo": "Texto para consultar", "html": "<p>Consulta o texto quando precisares de confirmar uma escolha.<\/p><details><summary>Abrir o texto de apoio<\/summary><div><p class=\"pr\" data-l=\"0-0\"><b>[1]<\/b> Folheando os livros de antigos assentamentos, no cartorio das cadêas da Relação do Porto, li, no das entradas dos presos desde 1803 a 1805, a folhas 232, o seguinte:<\/p><p class=\"pr\" data-l=\"0-1\"><b>[2]<\/b> <i>Simão Antonio Botelho, que assim disse chamar-se, ser solteiro, e estudante na Universidade de Coimbra, natural da cidade de Lisboa, e assistente na occasião de sua prisão na cidade de Vizeu, idade de dezoito annos, filho de Domingos José Correia Botelho e de D. Rita Preciosa Caldeirão Castello-Branco, estatura ordinaria, cara redonda, olhos castanhos, cabello e barba preta, vestido com jaqueta de baetão azul, collête de fustão pintado e calça de panno pedrez. E fiz este assento, que assignei.<\/i><\/p><p class=\"pr\" data-l=\"0-2\"><b>[3]<\/b> <i>Filippe Moreira Dias<\/i>.<\/p><p class=\"pr\" data-l=\"0-3\"><b>[4]<\/b> Á margem esquerda d'este assento está escripto: <i>Foi para a India em 17 de Março de 1807<\/i>.<\/p><p class=\"pr\" data-l=\"0-4\"><b>[5]<\/b> Não será fiar demasiadamente na sensibilidade do leitor, se cuido que o degredo de um moço de dezoito annos lhe havia de fazer dó.<\/p><p class=\"pr\" data-l=\"0-5\"><b>[6]<\/b> Dezoito annos! O arrebol dourado e escarlate da manhã da vida! As louçanias do coração que ainda não sonha em fructos, e todo se embalsama no perfume das flôres! Dezoito annos! O amor d'aquella idade! A passagem do seio da familia, dos braços de mãe, dos beijos das irmãs para as caricias mais dôces da virgem, que se lhe abre ao lado como flôr da mesma sazão e dos mesmos aromas, e á mesma hora da vida! Dezoito annos!... E degradado da patria, do amor, e da familia! Nunca mais o ceo de Portugal, nem liberdade, nem irmãos, nem mãe, nem rehabilitação, nem dignidade, nem um amigo!... É triste!<\/p><p class=\"fonte\">Camilo Castelo Branco, <i>Amor de Perdição<\/i> (1862) (grafia da edição).<\/p><p class=\"fonte\"><a href=\"../../../m5/licao-m5-f02/\" target=\"_blank\" rel=\"noopener\">Texto e fontes na lição de origem<\/a><\/p><\/div><\/details>", "recycledFrom": "/pt/m5/licao-m5-f02/", "rot": "Texto de apoio"}, {"p": "«natural da cidade de Lisboa, e assistente na occasião de sua prisão na cidade de Vizeu»: o que diz?", "f": "Natural de Lisboa, assistente em Viseu: «assistente» é residente; a prisão foi em Viseu.", "legacyId": "s08-q1", "recycledFrom": "/pt/m5/licao-m5-f02/", "t": "escolha", "o": ["Nasceu em Lisboa e vivia em Viseu", "Nasceu em Viseu e vivia em Coimbra", "Nasceu em Coimbra e vivia no Porto"], "c": 0, "fe": [null, "Trocas o lugar de nascimento pelo de residência.", "Porto e Coimbra não são os lugares indicados nesta expressão."]}, {"t": "sublinhar", "p": "Toca na palavra que mostra que é o narrador quem leu o livro da cadeia.", "frase": "no cartorio das cadêas da Relação do Porto, li, no das entradas dos presos", "certas": [8], "f": "**«li»**: o narrador apresenta-se como quem encontrou o documento no arquivo; o romance abre com um papel verdadeiro.", "cita": "Folheando os livros de antigos assentamentos, no cartorio das cadêas da Relação do Porto, li, no das entradas dos presos desde 1803 a 1805, a folhas…", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 5, "fe": "Marcaste o lugar ou o livro, não a ação de quem conta. Procura o verbo na primeira pessoa: é ele que põe o narrador dentro do arquivo."}, {"t": "completar", "p": "Que tom tem o assento quando regista os pais, a idade e a roupa de Simão?", "frase": "O assento regista a filiação, a idade e a roupa de Simão num tom [1], sem um [2].", "lacunas": [{"o": ["neutro", "emotivo", "irónico"], "c": 0, "fe": [null, "Emotivo é o tom do narrador, nas exclamações; o assento regista dados sem os comentar: tom neutro.", "Nada no assento diz o contrário do que pensa: lista filiação, idade e roupa num tom neutro, de documento."]}, {"o": ["juízo", "número", "facto"], "c": 0, "fe": [null, "O assento tem números, como a idade; o que lhe falta é um juízo sobre Simão.", "O assento é feito de factos; o que lhe falta é um juízo, uma avaliação de quem escreve."]}], "f": "Tom **neutro**, de documento: descreve Simão de fora, sem um **juízo**; a emoção fica para o narrador.", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 7, "fe": "Confundiste o tom do documento com o do narrador. O assento lista filiação, idade e roupa sem comentar; as exclamações e a pena vêm depois, na voz de quem conta."}, {"t": "sublinhar", "p": "Toca nas duas palavras seguidas que fazem a comparação da rapariga amada com uma flor.", "frase": "da virgem, que se lhe abre ao lado como flôr da mesma sazão", "certas": [8, 9], "f": "**«como flôr»**: a virgem abre-se ao lado do moço como uma flor da mesma estação; é uma comparação.", "cita": "Dezoito annos! O arrebol dourado e escarlate da manhã da vida!", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 11, "fe": "Marcaste a flor ou a estação, não a comparação inteira. Procura a palavra que liga a virgem à flor e a flor que vem logo a seguir."}, {"p": "A nota sobre a ida para a Índia está escrita no fim do assento, depois da assinatura.", "f": "Falso: está «á margem esquerda d'este assento», escrita depois, à parte; o assento acaba na assinatura.", "legacyId": "s08-q2", "recycledFrom": "/pt/m5/licao-m5-f02/", "t": "vf", "v": false, "fe": "A nota não está no fim: relê «Á margem esquerda d'este assento está escripto». O assento acaba na assinatura de Filippe Moreira Dias."}, {"t": "ordenar", "p": "Põe pela ordem do texto estas quatro frases do narrador.", "f": "Primeiro o viço e o amor da idade, depois o degredo e, a fechar, o juízo: «É triste!».", "cita": "Dezoito annos! O arrebol dourado e escarlate da manhã da vida!", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 13, "fe": "Trocaste a ordem das exclamações. O narrador começa no viço («As louçanias do coração»), passa ao amor da idade, depois ao degredo, e só no fim julga: «É triste!».", "passos": ["As louçanias do coração que ainda não sonha em fructos", "O amor d'aquella idade!", "E degradado da patria, do amor, e da familia!", "É triste!"]}, {"t": "emparelhar", "p": "Liga cada expressão à voz que a diz.", "pares": [["«estatura ordinaria, cara redonda»", "O assento da cadeia"], ["«Dezoito annos!»", "A voz do narrador"], ["«E fiz este assento, que assignei.»", "O assento da cadeia"], ["«É triste!»", "A voz do narrador"]], "f": "O assento descreve Simão sem um juízo; o narrador exclama e fala à leitora para a comover.", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 19, "fe": "Trocaste as vozes. Pergunta a cada expressão se regista um dado sem comentar, como o assento, ou se exclama e julga, como o narrador."}, {"t": "vf", "p": "O assento usa frases curtas e exclamativas; o narrador, frases longas e informativas.", "v": false, "f": "Falso: é ao contrário. O **assento** tem frases longas e informativas; o **narrador**, exclamações curtas e enumerações.", "fe": "É ao contrário: o assento é uma frase longa e neutra («estatura ordinaria, cara redonda»); as exclamações curtas, como «Dezoito annos!», são do narrador.", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 21}, {"p": "«o degredo de um moço de dezoito annos lhe havia de fazer dó»: que reação espera o narrador?", "f": "Dó: o narrador aposta na sensibilidade de quem lê antes de contar uma linha da história.", "legacyId": "s08-q3", "recycledFrom": "/pt/m5/licao-m5-f02/", "t": "escolha", "o": ["Compaixão pelo jovem degredado.", "Desconfiança do registo prisional.", "Condenação do jovem prisioneiro."], "c": 0, "fe": [null, "«Fazer dó» indica compaixão, não suspeita da fonte.", "O narrador pede uma reação ao sofrimento, não uma sentença judicial."]}, {"t": "emparelhar", "p": "Liga cada expressão ou efeito ao registo a que pertence.", "pares": [["«estatura ordinaria, cara redonda»", "assento: descrição exterior"], ["«É triste!»", "narrador: juízo em exclamação"], ["Credibilidade", "efeito do documento"], ["Comoção", "efeito da voz do narrador"]], "f": "O assento descreve e dá credibilidade; o narrador exclama e comove: dois registos na mesma página.", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 22, "fe": "Trocaste os efeitos. O assento, com a sua descrição exterior, dá credibilidade ao que se conta; o narrador, com o juízo em exclamação, procura comover."}, {"t": "ordenar", "p": "Como se lê a Introdução, por ordem:", "passos": ["Lê o assento como documento", "Repara na nota à margem", "Ouve a voz que exclama", "Distingue documento de ficção"], "f": "Primeiro o documento e a sua margem, depois a voz, por fim a distinção: o papel é real, a história é ficção.", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 23, "fe": "Começaste pela conclusão. Primeiro lês o assento como documento e reparas na nota à margem; depois ouves a voz que exclama; só no fim distingues o documento da ficção."}, {"t": "vf", "p": "«Abrir com um documento é a melhor maneira de começar um romance» é uma opinião, não um facto.", "v": true, "f": "Verdadeiro: «a melhor maneira» é um juízo de valor, uma **opinião**; o facto é que o romance abre com um documento.", "fe": "É verdadeiro: «a melhor maneira» é um juízo de valor, e há quem prefira outro começo. Facto é só que o romance abre com o assento.", "recycledFrom": "/pt/m5/licao-m5-f02/", "sourceCard": 24}]}</script>
