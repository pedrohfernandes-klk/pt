ira para a cidade, Maria para o retrato.»", "compara"]], "f": "«Há uma alegoria» e «Há uma apóstrofe» só dão o nome do recurso: cumprem «identifica». Dizer quem são os grandes é explicar o que a imagem quer dizer. Juntar Vieira e Maria pelo mesmo gesto, orientar o olhar, é comparar.", "fe": "Pergunta a cada resposta: dá só o nome, diz o que significa, ou junta os dois textos?", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 14}, {"t": "vf", "p": "Uma resposta cheia de citações está necessariamente bem fundamentada.", "v": false, "f": "Falso: **uma citação só apoia a ideia quando explicas a ligação**, respeitas o contexto e não escondes uma objeção decisiva. Uma prova explicada vale mais do que cinco copiadas.", "fe": "É falso: uma citação só apoia a ideia quando explicas a ligação; cinco citações copiadas não valem uma explicada.", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 11}, {"t": "completar", "p": "Completa o plano de uma explicação apoiada no texto.", "frase": "Começas por uma [1], escolhes uma passagem como [2] e explicas a ligação.", "lacunas": [{"o": ["ideia", "cópia"], "c": 0, "fe": [null, "Nesta lacuna, cópia não corresponde à relação pedida."]}, {"o": ["prova", "pausa"], "c": 0, "fe": [null, "Nesta lacuna, pausa não corresponde à relação pedida."]}], "f": "A ideia responde ao pedido; a passagem sustenta-a. Falta sempre tornar explícita a ligação, mesmo quando a citação é correta.", "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 13, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "ordenar", "p": "Ordena a construção de um parágrafo explicativo.", "passos": ["Delimitar a ideia do parágrafo", "Escolher um exemplo pertinente", "Explicar o que o exemplo mostra", "Ligar o resultado ao foco da exposição"], "f": "O exemplo não substitui a explicação. Depois de o apresentar, mostra por que razão sustenta a ideia delimitada.", "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 13, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "sublinhar", "p": "No exemplo imaginário, toca na expressão que anuncia uma comparação.", "frase": "Nos dois textos, a imagem orienta a atenção do leitor.", "certas": [0, 1, 2], "f": "Nos dois textos anuncia um critério comum. Nomear dois autores, sem relacionar o que fazem, não constitui comparação.", "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 15, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "vf", "p": "Uma exposição pode juntar dois resumos separados e chamar a isso uma comparação.", "v": false, "f": "Comparar exige um critério aplicado aos dois textos. Procura a frase que relaciona as observações em vez de apenas as encadear.", "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 15, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "emparelhar", "p": "Liga cada problema à revisão necessária.", "pares": [["O parágrafo só enumera citações", "Explicar a ligação à ideia"], ["Os textos são descritos separadamente", "Estabelecer um critério comum"], ["A conclusão introduz um tema novo", "Retomar a explicação construída"]], "f": "A revisão responde ao problema detetado. Mais citações não resolvem a falta de explicação, e mais títulos não criam um critério comum.", "fe": "Confere o indício e a relação pedidos, antes de voltares a responder.", "recycledFrom": "/pt/m4/licao-m4-f27/", "sourceCard": 11, "adaptacao": "Operação da lição aplicada a um recorte ou exemplo indicado no cartão."}, {"t": "sublinhar", "p": "No exemplo imaginário, toca na palavra que exige uma explicação a
