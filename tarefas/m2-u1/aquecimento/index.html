font-size:1.7rem}.casca .jogo button.op{font-size:1.06rem;min-height:52px}.casca .jogo .dica{font-size:.95rem}.casca .jogo .pista{font-size:1.12rem}.casca .jogo .ler .fig{display:flex;align-items:flex-end;gap:22px;margin-bottom:28px}.casca .jogo .ler .fig img{flex:0 1 auto;min-width:0;max-height:min(46vh,520px);object-fit:contain}.casca .jogo .ler .fig figcaption a{color:inherit}.casca .jogo .ler .fig figcaption{flex:0 0 13.5rem;margin:0;font-size:.84rem;line-height:1.45;padding-bottom:2px;border-top:2px solid var(--tinta);padding-top:8px}}@media (min-width:1600px) and (min-height:760px){:root{--col:min(900px,100%)}.casca>.casca-corpo{padding-top:4vh}.casca .jogo .ler{font-size:1.32rem}.casca .jogo .ler .abre{font-size:1.5rem}.casca .jogo .q{font-size:1.75rem}.casca .jogo button.op{font-size:1.12rem}}@media (min-width:1024px) and (min-height:560px) and (prefers-reduced-motion:reduce){.casca>.casca-folha{transition:none;transform:none}}</style><link rel="stylesheet" href="../../../assets/appearance.css?v=20261025-universal-1"><script src="../../../assets/appearance.js?v=20261025-universal-1"></script></head><body data-unit-return="../../../m2/#unidade-pedagogica-1" data-unit-number="1"><div class="casca" data-casca><header class="casca-topo"><a class="c-marca" href="../" aria-label="Voltar à aula de tarefa da unidade 1 do módulo 2">M2</a><span class="c-num" data-c-num></span><button type="button" class="c-barra" data-c-barra aria-label="Ver os cartões já feitos" disabled><svg viewBox="0 0 1 10" preserveAspectRatio="none" aria-hidden="true"></svg></button><span class="c-modo" data-c-modo hidden></span><button type="button" class="c-ic" data-c-som aria-pressed="false" aria-label="Som"><span class="c-roda">♪</span></button><button type="button" class="c-ic" data-c-menu aria-label="Menu" aria-expanded="false"><span class="c-tres"></span></button></header><h1 class="c-sr">Aquecer: Uma conclusão à medida da prova</h1><main class="casca-corpo" tabindex="-1"><div id="baralho" class="jogo-alvo"></div></main><footer class="casca-acoes" data-c-acoes></footer><section class="casca-folha" data-c-folha role="status" aria-live="polite" hidden></section><div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 2 · No início da aula de tarefa<br>Unidade 1</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação do aquecimento"><a href="../">Aula de tarefa</a><a href="../../../m2/#unidade-pedagogica-1">Unidade 1 no percurso</a><a href="../../../m2/licao-m2-f02/">Relembrar F02</a><a href="../../../m2/licao-m2-f07/">Relembrar F07</a><a href="../../../m2/licao-m2-f06/">Relembrar F06</a><a href="?projetar=1">Projetar para a turma</a></nav><p class="c-menu-extra">Aquecimento com consulta livre; não conta para a nota. O progresso fica neste aparelho.</p></div></div></div><noscript>Este aquecimento precisa de JavaScript. <a href="../">Abrir a aula de tarefa</a>.</noscript><script>document.addEventListener("DOMContentLoaded",function(){"use strict";var K="aquecimento-m2-u1",CARTOES=[{"t": "ler", "rot": "Abre", "titulo": "O que a prova permite dizer", "html": "<p>Dez minutos com consulta, sem nota. Treinas as operações da tarefa com outras falas da lição F02 e com casos inventados, não com os versos da panela, das janelas ou da escolha final. As frases de gramática e de recursos e os cartazes do arquivo foram criados para treinar. A tua tarefa continua a pedir provas próprias.<\/p>"}, {"t": "emparelhar", "p": "Liga cada operação ao que tens de mostrar na tarefa.", "p2": "Copiar, nomear ou opinar é só o primeiro gesto. Liga cada pedido ao trabalho completo que exige.", "pares": [["Citar e localizar", "Copiar letra a letra; dizer quem fala e quando"], ["Explicar uma passagem", "Dizer que sentido as palavras ganham no texto"], ["Classificar e justificar", "Dar o nome ao tipo; mostrar o traço que o confirma"], ["Defender uma ideia", "Articular provas sem concluir mais do que permitem"]], "f": "Citar é copiar letra a letra e dizer quem fala e quando; explicar diz o sentido das palavras; classificar não dispensa a justificação; defender pede provas articuladas, sem ir além delas (lições F02, F06 e F07; critérios da tarefa).", "fe": "Só copiar deixa a prova sem localização; só dar o nome deixa a classificação sem justificação. Procura o que cada pedido exige além desse primeiro gesto.", "g": 1}, {"t": "escolha", "p": "Na lição F02, quem diz «Acaba esse travesseiro!» e em que momento?", "p2": "A que personagem pertence a fala «Acaba esse travesseiro!», e em que ponto da cena da lição F02 é dita?", "o": ["A Mãe, quando regressa e manda trabalhar.", "Inês, quando responde à Mãe e se queixa.", "A Mãe, quando recorda trabalho acabado."], "c": 0, "f": "A Mãe chega da missa e dá a ordem ao não encontrar Inês a lavrar. Identifica a voz e o momento, não apenas o nome da obra (lição F02).", "fe": [null, "A fala não é de Inês: é uma ordem, no imperativo, que a Mãe lhe dirige quando chega.", "«Acaba» pede uma ação ainda por concluir; não recorda um trabalho terminado."], "g": 2}, {"t": "completar", "p": "Frase criada: “Arrumei os livros para que a mesa ficasse livre.” Classifica a oração iniciada por _para que_.", "p2": "Na frase dos livros, a oração com _para que_ diz uma causa, um objetivo ou um tempo? Escolhe a classificação completa.", "frase": "A oração “para que a mesa ficasse livre” é [1].", "lacunas": [{"o": ["uma subordinada adverbial causal", "uma subordinada adverbial final", "uma subordinada adverbial temporal"], "c": 1}], "f": "Indica o objetivo da ação de arrumar: libertar a mesa. A classificação completa é oração subordinada adverbial final (lição F07).", "fe": "A causal apresentaria a causa de arrumar; a temporal situaria a ação no tempo. Aqui exprime-se o que se pretende obter, não o que já aconteceu.", "g": 3}, {"t": "escolha", "p": "Que justificação aponta, na frase criada, os traços que confirmam a classificação de “para que a mesa ficasse livre”?", "p2": "Não basta repetir o nome da oração. Que traços da frase dos livros confirmam a classificação?", "o": ["_Para que_ abre um fim pretendido e _ficasse_ está no conjuntivo.", "_Para que_ abre um fim já alcançado e _ficasse_ está no indicativo.", "A oração vem logo depois de _arrumei_ e, por isso, exprime um fim."], "c": 0, "f": "**Para que** introduz a finalidade e **ficasse** está no conjuntivo, como na oração final da lição F07. A frase diz o que se pretende; não confirma que a mesa tenha ficado livre.", "fe": [null, "**Ficasse** está no conjuntivo, e a frase não diz que a mesa ficou livre: um fim pretendido não é um fim alcançado.", "A posição não classifica a oração: “Para que a mesa ficasse livre, arrumei os livros.” continua a ser final. Confirmam-na o conector e o conjuntivo."], "g": 4}, {"t": "ordenar", "p": "Ordena este ciclo de revisão: partes do rascunho e terminas com a confirmação de que o texto cabe no intervalo de 180 a 240 palavras.", "p2": "Se a primeira contagem mostrar que o texto está curto ou longo, em que sequência verificas e corriges a extensão?", "passos": ["Contar as palavras do rascunho", "Comparar essa contagem com o intervalo pedido", "Ajustar o rascunho se estiver fora do intervalo", "Voltar a contar a versão que acabaste de ajustar"], "f": "Cada passo usa o resultado do anterior: contagem, comparação, alteração orientada e nova contagem. Cortar repetições não deve apagar as provas necessárias (critérios da tarefa U1).", "fe": "Não podes comparar uma contagem que ainda não fizeste, nem conferir uma versão ajustada que ainda não existe. O ciclo acaba na nova verificação, não no corte.", "g": 5}, {"t": "emparelhar", "p": "Estas frases foram criadas para treinar. Liga cada recurso ao que mostra de quem fala.", "p2": "Já tens o nome de cada recurso. Que sentimento ou situação revela cada frase criada?", "pares": [["Comparação: “A notícia caiu como água gelada.”", "Um choque súbito e frio"], ["Antítese: “Sorrio por fora, choro por dentro.”", "Uma tristeza escondida"], ["Enumeração: “Testes, treinos, recados, turnos.”", "Obrigações a mais"], ["Interrogação retórica: “De que serve correr?”", "Um esforço sem proveito"]], "f": "Explicar um recurso é dizer o que mostra: a **comparação** dá à notícia o frio da água; a **antítese** opõe o sorriso ao choro; a **enumeração** acumula obrigações; a **interrogação retórica** dá como certo que correr não serve (lição F02).", "fe": "Lê o que cada recurso põe em relação: o que se compara, o que se opõe, o que se acumula, o que a pergunta dá como certo. Depois diz o que isso mostra de quem fala.", "g": 6}, {"t": "completar", "p": "No tema, defendes uma ideia com duas provas. Que gesto torna a resposta articulada?", "p2": "Que ligação impede que duas citações ou dois factos fiquem apenas em lista?", "frase": "Depois de apresentar as provas, preciso de [1].", "lacunas": [{"o": ["acrescentar mais citações até a ideia parecer certa", "repetir a ideia inicial por outras palavras", "dizer o que cada uma mostra e como se completam"], "c": 2}], "f": "Articular é dizer o que cada prova mostra e como as duas, juntas, sustentam a ideia. No tema B, os dois factos do dossiê não dispensam a passagem da farsa pedida no enunciado (lição F06; tarefa U1).", "fe": "Mais citações não substituem a explicação, e repetir a ideia não a liga às provas. Diz o que cada prova mostra e o que acrescenta à outra.", "g": 7}, {"t": "escolha", "p": "Caso inventado: num arquivo, o cartaz de 2019 anuncia uma leitura ao fim da tarde; o de 2024 anuncia a mesma leitura à noite. Que comparação fica dentro destas duas provas?", "p2": "Os dois cartazes são as únicas provas. Que comparação entre eles podes defender sem acrescentar nada?", "o": ["O horário anunciado mudou e a atividade manteve-se.", "A mudança de horário trouxe mais público à leitura.", "A leitura passou para a noite porque à tarde falhou."], "c": 0, "f": "Comparar é pôr lado a lado o que muda e o que se mantém, com uma prova de cada momento. Os cartazes não registam o público nem a razão da mudança (lições F02 e F06, cartões «Em paralelo»).", "fe": [null, "Os cartazes anunciam horários; não contam quem assistiu. **Mais público** é uma conclusão sem prova.", "Nenhum cartaz diz a razão da mudança. Inventar a causa vai além das duas provas."], "g": 8}, {"t": "rever", "p": "Revê só o trecho destacado, como farás na síntese final: a conclusão tem de caber na fala de apoio.", "p2": "A fala de apoio é uma pergunta da Mãe. Que substituição fica dentro do que ela permite afirmar?", "o": ["proíbe a filha de pensar em casar", "liga o casamento à fama da filha", "manda a filha casar sem esperar"], "c": 1, "f": "A pergunta liga o casamento à **fama** de preguiçosa que a Mãe dá à filha: não proíbe nem apressa. A conclusão revista diz só o que a fala mostra, como pede a síntese final (lições F02 e F06).", "fe": ["A pergunta não contém uma proibição: é uma interrogação retórica que avisa a filha. **Proibir** diz mais do que a fala mostra.", null, "A Mãe diz o contrário pouco depois: «Não te apresses tu, Inês.» Esta pergunta não manda casar."], "frase": "Com esta pergunta, a Mãe proíbe a filha de pensar em casar.", "trecho": "proíbe a filha de pensar em casar", "apoio": "Mãe, a ralhar com Inês: «Como queres tu casar / Com fama de preguiçosa?» (lição F02).", "g": 9}, {"t": "vf", "p": "Ao citar a Mãe na lição F02, podes escrever _Cala-te, que poderá ser_ em vez da forma da edição, porque o sentido é o mesmo.", "p2": "Atualizar a grafia de uma fala da lição F02, por exemplo _Cal'-te_ para _Cala-te_, mantém a citação exata.", "v": false, "f": "Falso. A citação exata copia a grafia da edição letra a letra, como em «Cal'-te, que poderá ser». Se quiseres explicar uma forma antiga, fá-lo fora das aspas (lição F02; critérios da tarefa).", "fe": "Uma citação exata não atualiza formas antigas: a lição F02 escreve «Cal'-te, que poderá ser». Copia letra a letra e explica o sentido fora das aspas.", "g": 10}, {"t": "ler", "rot": "Para levar", "titulo": "Agora, regressa às tuas provas", "html": "<p>Na tarefa, cita letra a letra, com a voz e o momento, e explica o que as palavras mostram. Compara os momentos pedidos, classifica a oração e justifica com traços da frase; articula a ideia com as provas do tema escolhido. Revê a escrita e a extensão e fecha com as duas linhas da síntese: uma conclusão tua sobre Inês, limitada à passagem que apontas.<\/p>"}];var C=EPICasca.pagina();EPIJogo.montar({casca:C,el:document.getElementById("baralho"),itens:CARTOES,chave:K,"marca": "M2", "titulo": "Aquecer: Uma conclusão à medida da prova", "variar": false, "gestalt": true, "percurso": "../../../m2/#unidade-pedagogica-1", "seguinte": "../", "seguinteRotulo": "Abrir a aula de tarefa", "versao": "1",depois:"<p><a href=\"../\">Abrir a aula de tarefa</a> · <a href=\"../../../m2/#unidade-pedagogica-1\">Voltar à unidade 1</a></p>"});});</script><script defer src="../../../assets/projection-launcher.js?v=20261019.4" data-site="pt"></script></body></html>
