" class="jogo-alvo"></div></main><footer class="casca-acoes" data-c-acoes></footer><section class="casca-folha" data-c-folha role="status" aria-live="polite" hidden></section><div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 2 · No início da aula de tarefa<br>Unidade 1</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação do aquecimento"><a href="../">Aula de tarefa</a><a href="../../../m2/#unidade-pedagogica-1">Unidade 1 no percurso</a><a href="../../../m2/licao-m2-f02/">Relembrar F02</a><a href="../../../m2/licao-m2-f07/">Relembrar F07</a><a href="../../../m2/licao-m2-f08/">Relembrar F08</a><a href="?projetar=1">Projetar para a turma</a></nav><p class="c-menu-extra">Aquecimento com consulta livre; não conta para a nota. O progresso fica neste aparelho.</p></div></div></div><noscript>Este aquecimento precisa de JavaScript. <a href="../">Abrir a aula de tarefa</a>.</noscript><script>document.addEventListener("DOMContentLoaded",function(){"use strict";var K="aquecimento-m2-u1",CARTOES=[{"t": "ler", "rot": "Abre", "titulo": "O que a prova permite dizer", "html": "<p>Dez minutos com consulta, sem nota. Treinas as operações da tarefa com outras passagens: a ordem da Mãe ao regressar e a sua voz no diálogo, não os versos da panela, das janelas ou da escolha final. Os casos gramaticais e os registos de uma oficina são inventados. A tua tarefa continua a pedir provas próprias.<\/p>"}, {"t": "emparelhar", "p": "Liga cada operação ao que tens de mostrar na tarefa.", "p2": "Que trabalho falta depois de copiares ou nomeares? Liga cada pedido à resposta completa.", "pares": [["Citar e localizar", "Copiar com exatidão; identificar a voz e o momento"], ["Classificar e justificar", "Dar o nome ao tipo; mostrar o traço que o confirma"], ["Explicar uma passagem", "Ligar as palavras ao sentido que defendes"], ["Defender uma ideia", "Articular provas sem concluir mais do que permitem"]], "f": "Citar inclui identificar quem fala e em que momento; classificar não dispensa a justificação. A explicação liga a prova à ideia (lições F07 e F08; critérios da tarefa).", "fe": "Só copiar deixa a prova sem localização; só dar o nome deixa a classificação sem justificação. Procura o que cada pedido exige além desse primeiro gesto.", "g": 1}, {"t": "escolha", "p": "Na lição F02, quem diz «Acaba esse travesseiro!» e em que momento?", "p2": "Localiza a ordem do travesseiro: quem regressa e se dirige a Inês?", "o": ["A Mãe, quando regressa e manda trabalhar.", "Inês, quando lamenta não poder circular.", "A Mãe, quando recorda trabalho acabado."], "c": 0, "f": "A Mãe chega da missa e dá a ordem ao não encontrar Inês a lavrar. Identifica a voz e o momento, não apenas o nome da obra (lição F02).", "fe": [null, "A fala não pertence à queixa de Inês. É uma ordem que lhe é dirigida pela Mãe.", "«Acaba» pede uma ação ainda por concluir; não recorda um trabalho terminado."], "g": 2}, {"t": "completar", "p": "Frase criada: “Arrumei os livros para que a mesa ficasse livre.” Classifica a oração iniciada por _para que_.", "p2": "Na frase dos livros, a oração destacada indica uma razão anterior, um objetivo ou um momento?", "frase": "A oração “para que a mesa ficasse livre” é [1].", "lacunas": [{"o": ["uma subordinada adverbial causal", "uma subordinada adverbial final", "uma subordinada adverbial temporal"], "c": 1}], "f": "Indica o objetivo da ação de arrumar: libertar a mesa. A classificação completa é oração subordinada adverbial final (lição F07).", "fe": "A causal apresentaria a causa de arrumar; a temporal situaria a ação no tempo. Aqui exprime-se o que se pretende obter, não o que já aconteceu.", "g": 3}, {"t": "escolha", "p": "Que justificação confirma a classificação da oração “para que a mesa ficasse livre”, na frase criada?", "p2": "Para justificar, lê a relação entre as ações. O que a segunda oração acrescenta a arrumar os livros?", "o": ["Diz a causa que já provocou a arrumação.", "Diz o efeito que ocorreu após arrumar.", "Diz o objetivo de se arrumarem livros."], "c": 2, "f": "A oração exprime uma finalidade. Arrumar os livros visa libertar a mesa; a frase não confirma que o objetivo tenha sido alcançado (lição F07).", "fe": ["Confunde a finalidade pretendida com a causa que já teria levado à ação.", "Um objetivo não é um resultado confirmado. A frase não relata o sucesso da arrumação.", null], "g": 4}, {"t": "ordenar", "p": "Ordena este ciclo de revisão: partes do rascunho e terminas na versão ajustada ao intervalo de 180 a 240 palavras.", "p2": "Se a primeira contagem mostrar que o texto está curto ou longo, em que sequência verificas e corriges a extensão?", "passos": ["Contar as palavras do rascunho", "Comparar essa contagem com o intervalo pedido", "Ajustar o rascunho se estiver fora do intervalo", "Voltar a contar a versão que acabaste de ajustar"], "f": "Cada passo usa o resultado do anterior: contagem, comparação, alteração orientada e nova contagem. Cortar repetições não deve apagar as provas necessárias (lição F08; tarefa U1).", "fe": "Não podes comparar uma contagem que ainda não fizeste, nem conferir uma versão ajustada que ainda não existe. O ciclo acaba na nova verificação, não no corte.", "g": 5}, {"t": "emparelhar", "p": "Estas falas foram criadas só para reconhecer recursos. Liga cada uma ao nome usado na lição F02.", "p2": "Que traço da frase permite dar nome ao recurso? Procura comparação, oposição, lista ou pergunta sem resposta esperada.", "pares": [["“A mesa é como uma ilha.”", "Comparação"], ["“Uns entram; outros saem.”", "Antítese"], ["“Trouxe livros, mapas, cadernos.”", "Enumeração"], ["“Quem não quer ter uma oportunidade?”", "Interrogação retórica"]], "f": "A comparação aproxima com uma marca de semelhança; a antítese opõe; a enumeração acumula; a pergunta retórica não procura uma informação desconhecida (lição F02).", "fe": "Não basta reconhecer uma palavra: olha para a relação. Entrar/sair opõe ações; livros/mapas/cadernos acumula elementos; a ilha aproxima duas realidades.", "g": 6}, {"t": "completar", "p": "No tema escolhido, uma ideia precisa de duas provas. Completa a ligação entre a ideia e as provas.", "p2": "Que ligação impede que duas citações ou dois factos fiquem apenas em lista?", "frase": "Depois de apresentar as provas, preciso de [1].", "lacunas": [{"o": ["repetir os seus títulos sem os explicar", "somar os seus nomes para lhes dar peso", "mostrar como sustentam a ideia defendida"], "c": 2}], "f": "A explicação articula as provas com a ideia. No tema B, os dois factos do dossiê não dispensam a passagem da farsa pedida no enunciado (lição F08; tarefa U1).", "fe": "Títulos e nomes podem ajudar a identificar, mas não explicam a pertinência. Mostra a ligação de cada prova ao que defendes e cumpre todos os pedidos do tema.", "g": 7}, {"t": "escolha", "p": "Caso inventado: num arquivo, um cartaz anuncia uma leitura e outro anuncia uma conversa. Que conclusão fica dentro destas duas provas?", "p2": "Dois cartazes permitem confirmar o que foi anunciado. Qual destas afirmações não exige conhecer a assistência nem a reação do público?", "o": ["Os cartazes anunciam dois tipos de atividade.", "As duas sessões tiveram uma assistência igual.", "As duas sessões agradaram a todo o público."], "c": 0, "f": "Os documentos mostram o anúncio de leitura e conversa. Não registam a assistência nem a reação de quem esteve presente. Limitar a conclusão é parte da leitura fundamentada (lição F08).", "fe": [null, "Os cartazes não contam quem assistiu. Serem dois anúncios não permite concluir igualdade de assistência.", "O anúncio não demonstra que as sessões ocorreram nem que todos gostaram. A conclusão ultrapassa a prova."], "g": 8}, {"t": "rever", "p": "Revê só o trecho destacado para não transformar uma ordem num retrato de toda a vida.", "p2": "A Mãe dá uma ordem num momento. Que substituição limita a conclusão ao que essa fala mostra?", "o": ["nunca trabalha por vontade própria", "recebe uma ordem naquele momento", "rejeita qualquer trabalho para sempre"], "c": 1, "f": "A ordem permite identificar o que a Mãe exige naquele momento. Não prova como Inês age em todos os outros. A revisão limita a conclusão (lições F02 e F08).", "fe": ["_Nunca_ generaliza a toda a vida. A ordem não basta para provar essa conclusão.", null, "Qualquer trabalho e para sempre também ultrapassam o que uma única fala demonstra."], "frase": "A fala mostra que Inês nunca trabalha por vontade própria.", "trecho": "nunca trabalha por vontade própria", "apoio": "Mãe, ao regressar: «Acaba esse travesseiro!» (lição F02).", "g": 9}, {"t": "vf", "p": "As duas linhas finais da tarefa U1 devem indicar uma conclusão que limitaste e apontar a passagem que te levou a limitá-la.", "p2": "Na síntese final da U1, tens de ligar uma conclusão revista à passagem que sustenta essa revisão.", "v": true, "f": "Verdadeiro. A síntese exige a conclusão revista e a passagem. Não é apenas um resumo da farsa. Confere os critérios e o fecho da tarefa U1.", "fe": "A síntese pede a relação entre a mudança na conclusão e a prova. Repetir uma opinião, sem apontar a passagem, deixa essa relação por mostrar.", "g": 10}, {"t": "ler", "rot": "Para levar", "titulo": "Agora, regressa às tuas provas", "html": "<p>Na tarefa, cita e identifica a voz e o momento. Classifica a oração e justifica a relação; articula a ideia com as provas do tema escolhido. Revê a escrita e a extensão, e usa a síntese para mostrar uma conclusão que tiveste de limitar.<\/p>"}];var C=EPICasca.pagina();EPIJogo.montar({casca:C,el:document.getElementById("baralho"),itens:CARTOES,chave:K,"marca": "M2", "titulo": "Aquecer: Uma conclusão à medida da prova", "variar": false, "gestalt": true, "percurso": "../../../m2/#unidade-pedagogica-1", "seguinte": "../", "seguinteRotulo": "Abrir a aula de tarefa", "versao": "1",depois:"<p><a href=\"../\">Abrir a aula de tarefa</a> · <a href=\"../../../m2/#unidade-pedagogica-1\">Voltar à unidade 1</a></p>"});});</script><script defer src="../../../assets/projection-launcher.js?v=20261019.4" data-site="pt"></script></body></html>
