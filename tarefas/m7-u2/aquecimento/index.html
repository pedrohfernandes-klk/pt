<!doctype html><html lang="pt-PT" data-appearance-site="pt" data-appearance-family="cards"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aquecer · Uma ideia de heterónimo · M7</title><meta name="description" content="Aquecimento em cartões no início da aula de tarefa da unidade 2 do M7: reconhecer Caeiro, Reis e Campos, separar heterónimo de pseudónimo, ver em que ideia duas vozes discordam, ligar a linguagem a uma maneira de ver, pesar duas fontes, julgar dois perfis e planear a apresentação."><link rel="stylesheet" href="../../../assets/pt-lessons/lesson.css"><script defer src="../../../assets/pt-lessons/casca.js"></script><script defer src="../../../assets/pt-lessons/jogo.js?v=20261021-ux06"></script><style id="casca-pc">@media (min-width:1024px) and (min-height:560px){:root{--col:min(820px,100%)}.casca{grid-template-rows:auto auto minmax(0,auto) auto 1fr}.casca>.casca-corpo{padding-top:clamp(8px,2vh,24px);padding-bottom:0}.casca>.casca-acoes,.casca>.casca-folha{grid-row:4;grid-column:1}.casca>.casca-acoes{padding-left:0;padding-right:0}.casca>.casca-folha{position:relative;left:auto;right:auto;bottom:auto;z-index:20;align-self:start;justify-self:center;width:100%;max-width:var(--col);transform:translateY(6px);opacity:0;transition:transform .18s cubic-bezier(.2,.7,.2,1),opacity .18s;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 14px 30px rgba(0,0,0,.08)}.casca>.casca-folha.aberta{transform:none;opacity:1}.casca>.casca-folha .c-folha-in{padding:18px 24px 16px}.casca>.casca-folha .c-expl{font-size:1.12rem;max-height:min(34vh,340px)}.casca .jogo{margin-bottom:0}.casca .jogo .cartao{padding:clamp(28px,3vw,44px) clamp(28px,3.4vw,52px)}.casca .jogo .rot{font-size:.76rem;margin-bottom:24px}.casca .jogo .tit.cartaz{font-size:clamp(2.4rem,3.2vw,3rem)}.casca .jogo .tit{font-size:1.3rem}.casca .jogo .q{font-size:1.62rem;line-height:1.32}.casca .jogo .ler{font-size:1.24rem;line-height:1.62}.casca .jogo .ler .abre{font-size:1.42rem;line-height:1.45}.casca .jogo .ler .levar{font-size:1.7rem}.casca .jogo button.op{font-size:1.06rem;min-height:52px}.casca .jogo .dica{font-size:.95rem}.casca .jogo .pista{font-size:1.12rem}.casca .jogo .ler .fig{display:flex;align-items:flex-end;gap:22px;margin-bottom:28px}.casca .jogo .ler .fig img{flex:0 1 auto;min-width:0;max-height:min(46vh,520px);object-fit:contain}.casca .jogo .ler .fig figcaption a{color:inherit}.casca .jogo .ler .fig figcaption{flex:0 0 13.5rem;margin:0;font-size:.84rem;line-height:1.45;padding-bottom:2px;border-top:2px solid var(--tinta);padding-top:8px}}@media (min-width:1600px) and (min-height:760px){:root{--col:min(900px,100%)}.casca>.casca-corpo{padding-top:4vh}.casca .jogo .ler{font-size:1.32rem}.casca .jogo .ler .abre{font-size:1.5rem}.casca .jogo .q{font-size:1.75rem}.casca .jogo button.op{font-size:1.12rem}}@media (min-width:1024px) and (min-height:560px) and (prefers-reduced-motion:reduce){.casca>.casca-folha{transition:none;transform:none}}</style><link rel="stylesheet" href="../../../assets/appearance.css?v=20261025-universal-1"><script src="../../../assets/appearance.js?v=20261025-universal-1"></script></head><body data-unit-return="../../../m7/#unidade-pedagogica-2" data-unit-number="2"><div class="casca" data-casca><header class="casca-topo"><a class="c-marca" href="../" aria-label="Voltar à aula de tarefa da unidade 2 do módulo 7">M7</a><span class="c-num" data-c-num></span><button type="button" class="c-barra" data-c-barra aria-label="Ver os cartões já feitos" disabled><svg viewBox="0 0 1 10" preserveAspectRatio="none" aria-hidden="true"></svg></button><span class="c-modo" data-c-modo hidden></span><button type="button" class="c-ic" data-c-som aria-pressed="false" aria-label="Som"><span class="c-roda">♪</span></button><button type="button" class="c-ic" data-c-menu aria-label="Menu" aria-expanded="false"><span class="c-tres"></span></button></header><h1 class="c-sr">Aquecer: Uma ideia de heterónimo</h1><main class="casca-corpo" tabindex="-1"><div id="baralho" class="jogo-alvo"></div></main><footer class="casca-acoes" data-c-acoes></footer><section class="casca-folha" data-c-folha role="status" aria-live="polite" hidden></section><div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 7 · No início da aula de tarefa<br>Unidade 2</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação do aquecimento"><a href="../">Aula de tarefa</a><a href="../../../m7/#unidade-pedagogica-2">Unidade 2 no percurso</a><a href="../../../m7/licao-m7-f04/">Relembrar F04, Caeiro</a><a href="../../../m7/licao-m7-f05/">Relembrar F05, Reis</a><a href="../../../m7/licao-m7-f36/">Relembrar F36, Campos</a><a href="?projetar=1">Projetar para a turma</a></nav><p class="c-menu-extra">Aquecimento com consulta livre; não conta para a nota. O progresso fica neste aparelho.</p></div></div></div><noscript>Este aquecimento precisa de JavaScript. <a href="../">Abrir a aula de tarefa</a>.</noscript><script>document.addEventListener("DOMContentLoaded",function(){"use strict";var K="aquecimento-m7-u2",CARTOES=[{"t": "ler", "rot": "Abre", "titulo": "Antes de inventares uma voz", "html": "<p class=\"abre\"><b>Pessoa inventou poetas com nome, vida e maneira de escrever.<\/b> Na tarefa, inventas uma voz que discorda de ti. Antes, com Caeiro, Reis e Campos, treinas o que a tarefa pede: reconhecer uma voz, separá-la de um pseudónimo, ver em que ideia discorda, provar uma maneira de ver na linguagem, pesar fontes, julgar perfis e planear os dois minutos.<\/p><p>No início da aula de tarefa, dez minutos. Podes abrir as lições. Não conta para a nota.<\/p>"}, {"t": "emparelhar", "g": "1", "p": "Liga cada verso à voz que o assina.", "p2": "Caeiro, Reis ou Campos? Liga cada verso à sua voz.", "pares": [["«O meu olhar é nítido como um girassol.»", "Caeiro"], ["«Penso com os olhos e com os ouvidos»", "Caeiro"], ["«Mais vale saber passar silenciosamente»", "Reis"], ["«As rosas amo dos jardins de Adónis»", "Reis"], ["«Ó rodas, ó engrenagens, r-r-r-r-r-r-r eterno!»", "Campos"], ["«Não posso querer ser nada.»", "Campos"]], "f": "Caeiro pensa pelos sentidos, em frases simples; Reis aconselha sem agitação, com palavras clássicas como Adónis; Campos exclama e faz crescer o «nada». Os versos de Campos são de 1914 e de 1928: a febre vira cansaço, mas «o desejo desmedido mantém-se» (lição F36). **Muda o humor, fica a voz.**", "fe": "Procura a marca de cada voz: o «como» simples e os sentidos em Caeiro; o conselho sereno e a mitologia em Reis; a exclamação, a onomatopeia e a negação em Campos."}, {"t": "escolha", "g": "2", "p": "Eugénio de Andrade, poeta que vais ler no M8, chamava-se José Fontinhas: «José Fontinhas escolheu este nome para assinar» (lição M8-F01). É um pseudónimo. Um heterónimo é «um poeta que Pessoa inventou, com nome, vida e estilo próprios, diferente do dele» (lição F01). O que os separa?", "p2": "Um nome novo e um poeta novo: o que separa um pseudónimo de um heterónimo?", "o": ["Nada: os dois são nomes inventados para assinar.", "O pseudónimo muda o nome de quem assina; o heterónimo é outro poeta, com vida e estilo que não são os de quem o inventa.", "O pseudónimo esconde quem escreve; o heterónimo serve para Pessoa se esconder ainda melhor."], "c": 1, "f": "Pseudónimo: outro nome, a mesma voz. Heterónimo: **outro poeta**, com «as idades e as vidas» e uma escrita próprias. Na tarefa, se o teu texto podia ser teu com outra assinatura, é um pseudónimo: a grelha pede um texto em que «mudam as frases, as palavras ou a pontuação».", "fe": ["O nome é só o começo: a F01 junta-lhe «vida e estilo próprios». Um nome novo sem vida nem estilo novos é um pseudónimo.", null, "A primeira metade pode dizer-se de um pseudónimo, a segunda não: a carta não fala em esconder, diz «Construí-lhes as idades e as vidas» (lição F01). O que separa os dois é a vida e o estilo."]}, {"t": "escolha", "g": "3", "p": "Reis: «Mais vale saber passar silenciosamente / E sem desassossegos grandes». Campos: «Pudesse eu comer chocolates com a mesma verdade com que comes!» Em que ideia discordam?", "p2": "Um conselho de Reis e uma exclamação de Campos: sobre que ideia têm posições contrárias?", "o": ["Sobre desejar: Reis aceita e pede pouco; Campos deseja uma verdade que não tem.", "Não discordam: os dois pedem prazeres simples, o silêncio e os chocolates.", "Sobre a natureza: Reis olha para o rio; Campos olha para a cidade."], "c": 0, "f": "Reis «aceita e pede pouco»; Campos «quer sentir tudo e cansa-se» (lição F11) e aqui exclama um desejo que não se cumpre. Reis nunca escreveria o verso dos chocolates. Testa assim a tua voz: em que ideia discorda de ti, e que frase tua nunca diria?", "fe": [null, "Parecem próximos pelo assunto, não pela posição: Reis aconselha a passar «sem desassossegos grandes», Campos exclama um desejo que não se cumpre.", "Nenhum dos versos diz o que a voz vê: um aconselha a querer pouco, o outro deseja."]}, {"t": "emparelhar", "g": "4", "p": "Liga cada escolha de linguagem à maneira de ver que ela mostra.", "p2": "Uma razão, um convite, uma hipótese, um desejo: liga cada escolha à maneira de ver.", "pares": [["Caeiro: «Porque o vejo»", "crê no que vê e diz porquê, sem hipótese"], ["Reis: «fitemos o seu curso e aprendamos»", "convida a dois a aceitar que a vida passa"], ["Campos: «como se soubesse a verdade»", "não afirma que sabe a verdade: deixa-a em hipótese"], ["Campos: «Ah, poder exprimir-me todo como um motor se exprime!»", "quer fundir-se com a máquina, sem medida"]], "f": "«Porque» dá uma razão no indicativo; «fitemos» inclui «nós»; «como se» mantém a hipótese; «Ah, poder» abre um desejo em exclamação. **A escolha de linguagem é a prova da maneira de ver.**", "fe": "Pergunta o que cada escolha faz: dá uma razão, convida, imagina ou deseja? Depois procura a maneira de ver que pede essa escolha."}, {"t": "completar", "g": "5", "p": "Como se explica uma escolha de linguagem? Completa, com um verso de Caeiro.", "p2": "O que faz Caeiro com «ao pé dele», e em que insiste essa escolha?", "frase": "Em «Quem está ao pé dele está só ao pé dele», Caeiro [1] «ao pé dele». A escolha insiste na [2] do rio: quem vê sem pensar não lhe põe nada em cima.", "lacunas": [{"o": ["repete", "pergunta", "nega"], "c": 0}, {"o": ["presença", "memória", "grandeza"], "c": 0}], "f": "Repete, para insistir na **presença**: «o rio não representa nada, e isso é o seu valor» (lição F35). Na tarefa, cada escolha que explicares faz este caminho: a palavra do teu texto, o que ela faz, a maneira de ver que mostra.", "fe": "Não há pergunta nem negação no verso: conta quantas vezes aparece «ao pé dele». A memória é o que põem no Tejo «aqueles que veem em tudo o que lá não está», não Caeiro. E o verso não mede o rio: fica junto dele."}, {"t": "emparelhar", "g": "6", "p": "Numa fonte, nem todas as frases são do mesmo tipo. Liga cada frase ao que ela é.", "p2": "Aconteceu, foi inventado, é deduzido ou é gosto? Liga cada frase.", "pares": [["A carta a Adolfo Casais Monteiro é de 13 de janeiro de 1935.", "facto da vida real"], ["Álvaro de Campos nasceu em Tavira, em 1890.", "facto sobre a ficção"], ["Reis tem medo de morrer.", "interpretação, que pede prova"], ["A «Tabacaria» é o melhor poema de Campos.", "opinião"]], "f": "A data da carta aconteceu; Tavira foi inventado por Pessoa e registado na carta; o medo de Reis é deduzido, e o poema não diz «medo»; «o melhor» é gosto. **Quando duas fontes discordam, vê em que tipo de frase discordam.**", "fe": "Pergunta a cada frase: aconteceu? foi inventado e registado? alguém o deduz? é gosto? Na lição F01, o nascimento de Reis no Porto é um facto sobre a ficção; na F23, o medo de Reis é uma inferência."}, {"t": "escolha", "g": "7", "p": "Segundo a carta a Casais Monteiro (13 de janeiro de 1935), Campos é engenheiro naval e nasceu em Tavira. Lição F01: «a vida inventada prepara o estilo». Lição F11: «Estes dados ajudam a caracterizar a figura, mas não explicam, por si sós, a presença de máquinas ou o verso livre». Como registas a diferença?", "p2": "Duas lições leem os mesmos dados da carta de maneiras diferentes. O que fazes com a diferença?", "o": ["Fico com uma e deixo a outra: fontes que discordam não servem.", "A F01 liga a vida ao estilo; a F11 diz que a vida não chega para o explicar. Anoto as duas e vou ao poema buscar a prova.", "Escrevo que dizem o mesmo, porque as duas dizem que Campos é engenheiro naval."], "c": 1, "f": "A diferença é de grau: a vida **prepara** a voz, mas a prova está no verso, como «Ser completo como uma máquina!». Data cada fonte (a carta, 13 de janeiro de 1935; uma lição, com o dia da consulta) e anota onde não coincidem.", "fe": ["Discordar não estraga uma fonte: a grelha da tarefa pede «três fontes que discordam, com data, e as diferenças anotadas». Deixar uma de fora apaga a diferença.", null, "Partem dos mesmos dados e tiram conclusões diferentes: uma diz «prepara o estilo», a outra diz «não explicam, por si sós». Se escreves que dizem o mesmo, perdes a diferença."]}, {"t": "escolha", "g": "8", "p": "Dois perfis inventados para este aquecimento (não uses estes ofícios nem estas maneiras de ver). A: Benedita Arroio, faroleira, só acredita no que se repete, ao contrário de quem a criou, que gosta de surpresas; escreve com a mesma palavra a abrir versos seguidos, horas exatas e nenhuma exclamação. B: Tomé Varela, afinador de pianos, desconfia de todas as certezas, ao contrário de quem o criou, que acredita em regras fixas; escreve frases curtas, todas no indicativo, sem uma pergunta. Qual dos dois perfis está mais bem construído?", "p2": "Benedita (A), faroleira, só acredita no que se repete e escreve com repetições, horas exatas e sem exclamações; Tomé (B), afinador de pianos, desconfia das certezas e escreve frases curtas, só no indicativo e sem perguntas. Os dois discordam de quem os criou. Num perfil, cada parte deve confirmar as outras: qual dos dois o consegue?", "o": ["O perfil B: afinar pianos é um ofício mais raro do que guardar um farol.", "O perfil A: ofício, maneira de ver e maneira de escrever puxam para o mesmo lado, e a discordância é clara.", "Valem o mesmo: os dois têm nome, datas, ofício, maneira de ver e maneira de escrever."], "c": 1, "f": "Em A, quem só acredita no que se repete escreve com repetições e horas exatas, sem exclamações. Em B, nada na escrita deixa ver a desconfiança de Tomé. **Um perfil está bem construído quando cada parte confirma as outras.**", "fe": ["Um ofício raro não chega: em B, a maneira de escrever não mostra a desconfiança que a maneira de ver anuncia.", null, "Ter tudo preenchido não chega: a grelha da tarefa dá menos pontos a um «perfil completo, com um ponto que não bate certo». Em B, há um ponto assim."]}, {"t": "sublinhar", "g": "9", "p": "Na maneira de escrever do perfil B, toca nas duas palavras que não deixam ver a desconfiança de Tomé: o modo verbal e o que nunca aparece.", "p2": "Que duas palavras da maneira de escrever de B mostram que a escrita não deixa nada em aberto? Toca nelas.", "frase": "Frases curtas e todas no indicativo, sem uma pergunta.", "certas": [5, 8], "f": "**Indicativo** e **pergunta**: o indicativo afirma e, sem perguntas, nada fica em aberto. Nada nesta maneira de escrever mostra a desconfiança de quem escreve. Na tarefa, aponta a prova assim, com as palavras exatas do teu texto.", "fe": "Procura o nome de um modo verbal e aquilo que a frase diz que nunca aparece. A lição F07 lembra que, com «porque sei», o indicativo «afirma uma causa certa»."}, {"t": "ordenar", "g": "10", "p": "Põe por ordem os teus dois minutos de apresentação ao grupo.", "p2": "Apresentar a voz, prová-la, responder: ordena os passos dos dois minutos.", "passos": ["Dizes quem é a voz e em que ideia discorda de ti", "Lês uma frase do texto dessa voz", "Explicas que escolha de linguagem a frase lida mostra", "Respondes à pergunta que te fizerem, com o teu texto ou uma fonte"], "f": "Apresentar não é ler o perfil: a grelha dá menos pontos a quem «lê o perfil do princípio ao fim». No teu grupo de 4 ou 5, diz quem é a voz, prova-a com uma frase lida e responde com o texto ou uma fonte.", "fe": "Primeiro a voz e a discordância, depois a frase lida e o que ela mostra; a pergunta vem de quem te ouve no grupo, por isso fecha."}, {"t": "ler", "rot": "Para levar", "escuro": true, "html": "<p class=\"levar\">Uma voz é uma maneira de ver que se prova na maneira de escrever.<\/p><p>Na tarefa, a voz é tua: discorda de ti numa ideia, tem uma vida que a prepara e escolhas de linguagem que a provam. Anota onde as fontes não coincidem e, nos dois minutos, prova a voz com uma frase lida.<\/p>"}];var C=EPICasca.pagina();EPIJogo.montar({casca:C,el:document.getElementById("baralho"),itens:CARTOES,chave:K,"marca": "M7", "titulo": "Aquecer: Uma ideia de heterónimo", "variar": false, "gestalt": true, "percurso": "../../../m7/#unidade-pedagogica-2", "seguinte": "../", "seguinteRotulo": "Abrir a aula de tarefa", "versao": "4",depois:"<p><a href=\"../\">Abrir a aula de tarefa</a> · <a href=\"../../../m7/#unidade-pedagogica-2\">Voltar à unidade 2</a></p>"});});</script><script defer src="../../../assets/projection-launcher.js?v=20261019.4" data-site="pt"></script></body></html>
