button.op{font-size:1.06rem;min-height:52px}.casca .jogo .dica{font-size:.95rem}.casca .jogo .pista{font-size:1.12rem}.casca .jogo .ler .fig{display:flex;align-items:flex-end;gap:22px;margin-bottom:28px}.casca .jogo .ler .fig img{flex:0 1 auto;min-width:0;max-height:min(46vh,520px);object-fit:contain}.casca .jogo .ler .fig figcaption a{color:inherit}.casca .jogo .ler .fig figcaption{flex:0 0 13.5rem;margin:0;font-size:.84rem;line-height:1.45;padding-bottom:2px;border-top:2px solid var(--tinta);padding-top:8px}}@media (min-width:1600px) and (min-height:760px){:root{--col:min(900px,100%)}.casca>.casca-corpo{padding-top:4vh}.casca .jogo .ler{font-size:1.32rem}.casca .jogo .ler .abre{font-size:1.5rem}.casca .jogo .q{font-size:1.75rem}.casca .jogo button.op{font-size:1.12rem}}@media (min-width:1024px) and (min-height:560px) and (prefers-reduced-motion:reduce){.casca>.casca-folha{transition:none;transform:none}}</style><link rel="stylesheet" href="../../../assets/appearance.css?v=20261025-universal-1"><script src="../../../assets/appearance.js?v=20261025-universal-1"></script></head><body data-unit-return="../../../m4/#unidade-pedagogica-1" data-unit-number="1"><div class="casca" data-casca><header class="casca-topo"><a class="c-marca" href="../" aria-label="Voltar à aula de tarefa da unidade 1 do módulo 4">M4</a><span class="c-num" data-c-num></span><button type="button" class="c-barra" data-c-barra aria-label="Ver os cartões já feitos" disabled><svg viewBox="0 0 1 10" preserveAspectRatio="none" aria-hidden="true"></svg></button><span class="c-modo" data-c-modo hidden></span><button type="button" class="c-ic" data-c-som aria-pressed="false" aria-label="Som"><span class="c-roda">♪</span></button><button type="button" class="c-ic" data-c-menu aria-label="Menu" aria-expanded="false"><span class="c-tres"></span></button></header><h1 class="c-sr">Aquecer: Uma imagem que se explica</h1><main class="casca-corpo" tabindex="-1"><div id="baralho" class="jogo-alvo"></div></main><footer class="casca-acoes" data-c-acoes></footer><section class="casca-folha" data-c-folha role="status" aria-live="polite" hidden></section><div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 4 · No início da aula de tarefa<br>Unidade 1</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação do aquecimento"><a href="../">Aula de tarefa</a><a href="../../../m4/#unidade-pedagogica-1">Unidade 1 no percurso</a><a href="../../../m4/">Voltar ao percurso do M4</a><a href="?projetar=1">Projetar para a turma</a></nav><p class="c-menu-extra">Aquecimento com consulta livre; não conta para a nota. O progresso fica neste aparelho.</p></div></div></div><noscript>Este aquecimento precisa de JavaScript. <a href="../">Abrir a aula de tarefa</a>.</noscript><script>document.addEventListener("DOMContentLoaded",function(){"use strict";var K="aquecimento-m4-u1",CARTOES=[{"t": "ler", "rot": "Abre", "titulo": "Uma imagem precisa de prova", "html": "<p>Dez minutos com consulta. Treinas a alegoria, a citação exata e localizada, o recurso com nome e efeito, o gesto sem nomes, a resposta a uma objeção com o texto e o tempo da fala. Usas o exórdio de Vieira e casos inventados. Os peixes das repreensões ficam para a tua tarefa. Não conta para a nota.<\/p>"}, {"t": "emparelhar", "p": "Liga cada operação da tarefa ao que tens de mostrar.", "p2": "O que conta na tarefa? Liga cada operação à maneira de a mostrar.", "pares": [["Localizar a citação", "Indicar a obra e o capítulo"], ["Explicar o recurso", "Dar o nome e dizer o efeito"], ["Mostrar o comportamento", "Descrever o gesto, sem nomes"], ["Responder à objeção", "Voltar ao texto com uma prova"], ["Usar uma imagem", "Dar o crédito: autor, título, data"]], "f": "São as operações avaliadas na tarefa. Dar só o nome do recurso, ou responder à objeção com outra opinião, não basta: o efeito e a prova do texto também contam.", "fe": "Localizar é dizer onde está a passagem; explicar um recurso é nomeá-lo e mostrar o efeito; o comportamento descreve-se pelo gesto; a objeção responde-se com o texto; cada imagem leva crédito.", "g": 1}, {"t": "escolha", "p": "No exórdio, Vieira escreve «O efeito do sal é impedir a corrupção». Lida como alegoria, o que cabe aos pregadores?", "p2": "O sal impede que a comida apodreça. Na imagem de Vieira, o que devem impedir os pregadores?", "o": ["Impedir que o vício corrompa as pessoas.", "Impedir que se desvie o dinheiro de todos.", "Impedir que o chão de São Luís apodreça."], "c": 0, "f": "Na imagem, cada coisa vale por outra: o sal são os pregadores, a terra as pessoas, a corrupção os vícios que nelas apodrecem (F02, cap. I). Na tarefa, mostra a mesma correspondência, ponto por ponto, entre o teu peixe e o comportamento.", "fe": [null, "É o sentido de hoje, o dos jornais. Em Vieira, corrupção é o que apodrece, como a comida sem sal: os vícios.", "É a leitura à letra. Na imagem, a terra são as pessoas a quem os pregadores falam, não o chão."], "g": 2}, {"t": "completar", "p": "Completa a definição de alegoria da aula F01.", "p2": "Alegoria ou comparação solta? Completa o que distingue a alegoria.", "frase": "Na alegoria, fala-se de uma coisa para dizer outra, [1].", "lacunas": [{"o": ["ponto por ponto, numa imagem que continua", "uma só vez, juntando as duas com «como»", "com animais numa história, com a moral dita"], "c": 0}], "f": "Alegoria: falar de uma coisa para dizer outra, ponto por ponto, numa imagem que continua; no sermão, do princípio ao fim (F01). A comparação solta junta as duas coisas uma vez, com «como»; na fábula, a moral vem dita.", "fe": "Juntar as duas coisas uma vez, com «como», é uma comparação solta; uma história de animais com a moral dita é uma fábula. Na alegoria, a imagem continua e cada parte vale por outra.", "g": 3}, {"t": "escolha", "p": "No ensaio com relógio, a tua apresentação chega aos cinco minutos. O que fazes?", "p2": "A apresentação tem de durar três a quatro minutos, e o ensaio deu cinco. Qual é a boa decisão?", "o": ["Cortas o que se repete e voltas a ensaiar.", "Falas mais depressa, para caber tudo no tempo.", "Deixas assim: um minuto a mais não conta."], "c": 0, "f": "Três a quatro minutos é um critério, e o ensaio com relógio serve para mudares alguma coisa (F10). Corta o que se repete, não a citação, o recurso ou a resposta à objeção.", "fe": [null, "Falar depressa tira clareza: quem ouve não pode voltar atrás. Ganha tempo a cortar, não a acelerar.", "O tempo conta: são três a quatro minutos. Um ensaio que passa do limite pede uma mudança."], "g": 4}, {"t": "ordenar", "p": "Põe por ordem as partes da apresentação, como no plano da aula F10.", "p2": "Da abertura à objeção: ordena o caminho que quem te ouve vai fazer.", "passos": ["Abrir com uma pergunta, uma imagem ou uma citação", "Ler a passagem de Vieira e dizer o capítulo", "Nomear o recurso e explicar o efeito", "Mostrar o gesto de hoje, sem nomes", "Dizer a objeção e responder com o texto"], "f": "É o plano da F10: a abertura e, por esta ordem, Vieira com citação, o recurso explicado, o comportamento de hoje sem nomes, a objeção e a resposta. Quem ouve conhece o peixe antes de o reconhecer hoje.", "fe": "A abertura vem primeiro. O recurso está na passagem, por isso vem depois dela; a comparação com hoje precisa do peixe já provado; a objeção ataca essa comparação, por isso fecha.", "g": 5}, {"t": "emparelhar", "p": "Depois de uma apresentação sobre Santo António em Arimino, a turma fala. Liga cada fala ao que faz.", "p2": "Apresentação sobre Santo António em Arimino: liga cada fala da turma a objeção, dado, forma ou elogio.", "pares": [["Ir para a praia também é desistir dos homens.", "Faz uma objeção"], ["Em que capítulo está essa passagem?", "Pede um dado"], ["Falaste depressa na última parte.", "Critica a forma"], ["A pergunta do início prendeu-me.", "Elogia a abertura"]], "f": "Só a primeira discorda: ataca a leitura de que mudar de auditório não é desistir. É essa que pede resposta com prova no texto (F10). Pedir o capítulo, comentar a voz ou elogiar não é objetar.", "fe": "Pergunta a cada fala: discorda da leitura, pede um dado, comenta a forma ou elogia? Só a que discorda pede resposta com o texto.", "g": 6}, {"t": "completar", "p": "No exórdio, a terra que «se não deixa salgar» figura quem recusa a verdade que lhe dão. Que gesto de hoje serve, sem visar ninguém?", "p2": "A terra que se não deixa salgar recusa a verdade. Que frase de hoje mantém esse traço e não aponta ninguém?", "frase": "Na apresentação, dizes: [1].", "lacunas": [{"o": ["há quem se recuse a ouvir uma crítica justa", "o delegado da nossa turma nunca aceita críticas", "toda a gente foge das críticas, justas ou não"], "c": 0}], "f": "O gesto mantém o traço da terra, recusar o que é verdadeiro, e não aponta ninguém: é um comportamento equivalente (F10). Um cargo da tua turma identifica uma pessoa; «toda a gente» perde o traço.", "fe": "O delegado da tua turma é uma pessoa que todos reconhecem, mesmo sem nome; «toda a gente» generaliza e perde o traço. Descreve o gesto, não a pessoa.", "g": 7}, {"t": "escolha", "p": "No cap. I, Vieira pergunta: «Retirar-se-ia? Calar-se-ia? Dissimularia? Daria tempo ao tempo?» Que recurso é este e que efeito tem?", "p2": "«Retirar-se-ia? Calar-se-ia? Dissimularia? Daria tempo ao tempo?»: como se chama o recurso e o que faz a quem ouve?", "o": ["Perguntas retóricas: põem quem ouve a pesar cada saída.", "Apóstrofe: Vieira chama António e fica à espera da resposta.", "Dilema: fecha as saídas em duas e obriga a escolher uma."], "c": 0, "f": "São perguntas retóricas: não esperam resposta, porque já trazem o juízo, e levam quem ouve a pesar cada saída (F01 e F25). Na tarefa, o recurso diz-se com o nome e com o efeito em quem ouve.", "fe": [null, "Ninguém é chamado: Vieira fala de António, na terceira pessoa, e não espera resposta. Uma pergunta não basta para haver apóstrofe (F04).", "Há quatro saídas, não duas, e nenhum «ou… ou…»: não é um dilema (F02)."], "g": 8}, {"t": "rever", "p": "Revê a resposta à objeção: troca a opinião por uma prova do texto, com o lugar certo.", "p2": "A resposta à objeção não volta ao texto. Que versão a prova e diz onde está a passagem?", "o": ["no cap. I, António «mudou somente o púlpito e o auditório»", "no cap. V, António «mudou somente o púlpito e o auditório»", "quem diz isso não leu o sermão com a devida atenção"], "c": 0, "f": "A resposta volta ao texto e diz onde: António muda só quem o ouve, e a doutrina fica (F01). Responde-se a uma objeção com prova do texto, não com outra opinião (F10).", "fe": [null, "A prova serve, mas o lugar está errado: a passagem é do exórdio, o cap. I (F01). O cap. V é o das repreensões aos peixes pelo nome.", "Atacar quem objeta não responde à objeção: continua a faltar a prova do texto."], "frase": "Ir para a praia não é desistir: acho que um santo nunca desiste.", "trecho": "acho que um santo nunca desiste", "apoio": "a objeção possível da aula F01, «Ir para a praia pode ser uma maneira bonita de desistir».", "g": 9}, {"t": "vf", "p": "Numa citação entre aspas, podes pôr um sinónimo teu no lugar de uma palavra difícil de Vieira, sem o assinalar.", "p2": "Entre aspas, palavras tuas podem substituir as de Vieira sem marca nenhuma, se disserem o mesmo.", "v": false, "f": "Falso. Entre aspas, as palavras são as de Vieira, letra a letra. Se cortas, marcas o corte com […], como nas lições; se queres palavras tuas, explica fora das aspas.", "fe": "A citação exata é um critério: entre aspas, nada muda. Para simplificar, explica por palavras tuas, fora das aspas; para encurtar, marca o corte com […].", "g": 10}, {"t": "ler", "rot": "Para levar", "titulo": "Escolhe tu o peixe", "html": "<p>Na tarefa, o peixe e a passagem são teus. Abre com uma pergunta, uma imagem ou uma citação; cita com o capítulo; nomeia e explica o recurso; mostra o gesto de hoje sem nomes; responde à objeção com o texto. Até três imagens, cada uma com crédito. Ensaia com relógio: três a quatro minutos.<\/p>"}];var C=EPICasca.pagina();EPIJogo.montar({casca:C,el:document.getElementById("baralho"),itens:CARTOES,chave:K,"marca": "M4", "titulo": "Aquecer: Uma imagem que se explica", "variar": false, "gestalt": true, "percurso": "../../../m4/#unidade-pedagogica-1", "seguinte": "../", "seguinteRotulo": "Abrir a aula de tarefa", "versao": "1",depois:"<p><a href=\"../\">Abrir a aula de tarefa</a> · <a href=\"../../../m4/#unidade-pedagogica-1\">Voltar à unidade 1</a></p>"});});</script><script defer src="../../../assets/projection-launcher.js?v=20261019.4" data-site="pt"></script></body></html>
