oter class="casca-acoes" data-c-acoes></footer><section class="casca-folha" data-c-folha role="status" aria-live="polite" hidden></section><div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 4 · No início da aula de tarefa<br>Unidade 1</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação do aquecimento"><a href="../">Aula de tarefa</a><a href="../../../m4/#unidade-pedagogica-1">Unidade 1 no percurso</a><a href="../../../m4/">Voltar ao percurso do M4</a><a href="?projetar=1">Projetar para a turma</a></nav><p class="c-menu-extra">Aquecimento com consulta livre; não conta para a nota. O progresso fica neste aparelho.</p></div></div></div><noscript>Este aquecimento precisa de JavaScript. <a href="../">Abrir a aula de tarefa</a>.</noscript><script>document.addEventListener("DOMContentLoaded",function(){"use strict";var K="aquecimento-m4-u1",CARTOES=[{"t": "ler", "rot": "Abre", "titulo": "Uma imagem precisa de prova", "html": "<p>Dez minutos com consulta. Treinas a alegoria, a citação localizada, o efeito de um recurso, a objeção e a fala clara. Usas o exórdio de Vieira e casos inventados. Os peixes das repreensões ficam para a tua tarefa. Não conta para a nota.<\/p>"}, {"t": "emparelhar", "p": "Liga cada operação ao que tens de mostrar.", "p2": "Liga cada operação ao que tens de mostrar.", "pares": [["Localizar a citação", "Indicar a obra e o capítulo"], ["Explicar o recurso", "Ligar a forma ao efeito"], ["Apresentar uma objeção", "Dizer uma discordância pertinente"], ["Descrever um comportamento", "Mostrar um gesto sem apontar pessoas"]], "f": "Na tarefa, precisas de fazer as quatro operações. Dar só o nome do recurso ou da pessoa não basta.", "fe": "Localizar permite reencontrar a passagem; explicar mostra como funciona; a objeção contesta a ideia; o comportamento descreve-se por um gesto.", "g": 1}, {"t": "escolha", "p": "No exórdio, Vieira escreve «O efeito do sal é impedir a corrupção». Que ligação sustenta a imagem?", "p2": "No exórdio, Vieira escreve «O efeito do sal é impedir a corrupção». Que ligação sustenta a imagem?", "o": ["O sal conserva; a pregação combate o mal.", "O sal conserva; a pregação cozinha o pão.", "O sal conserva; a pregação tempera todo o mar."], "c": 0, "f": "A função de conservar é transposta para a pregação: impedir a corrupção moral. É a correspondência desenvolvida em F02, cap. I.", "fe": [null, "A imagem não atribui à pregação a função de cozinhar. A ligação é moral, não culinária.", "Temperar o mar não é a função atribuída aos pregadores. O texto fala de combater a corrupção."], "g": 2}, {"t": "completar", "p": "Completa a explicação da alegoria do sal em F02.", "p2": "Completa a explicação da alegoria do sal em F02.", "frase": "A imagem torna-se alegoria quando [1].", "lacunas": [{"o": ["se repete apenas o mesmo som final", "se mantém a ligação de sentidos", "se contam apenas os sons finais"], "c": 1}], "f": "A alegoria mantém uma correspondência: o que se diz de uma realidade permite falar de outra. Uma semelhança solta não chega (F01/F02).", "fe": "Repetir sons é um efeito sonoro; contá-los também não explica a correspondência de sentidos. Procura a relação que a imagem mantém.", "g": 3}, {"t": "escolha", "p": "A passagem «Ou é porque o sal não salga, ou porque a terra se não deixa salgar» vem do cap. I do Sermão de Santo António. Que indicação permite localizá-la?", "p2": "A passagem «Ou é porque o sal não salga, ou porque a terra se não deixa salgar» vem do cap. I do Sermão de Santo António. Que indicação permite localizá-la?", "o": ["Vieira, Sermão de Santo António, cap. II.", "Vieira, Sermão de Santo António, cap. V.", "Vieira, Sermão de Santo António, cap. I."], "c": 2, "f": "O nome da obra e o capítulo permitem regressar ao texto. A passagem está em F02. Acrescenta a página se a edição consultada a disponibilizar.", "fe": ["O cap. II pertence aos louvores. A passagem do sal é do exórdio, cap. I.", "O cap. V pertence às repreensões particulares. A indicação fornecida é cap. I.", null], "g": 4}, {"t": "ordenar", "p": "Organiza uma explicação para ser ouvida: a imagem do sal em Vieira.", "p2": "Organiza uma explicação para ser ouvida: a imagem do sal em Vieira.", "passos": ["Apresentar a ligação entre sal e pregadores", "Ler uma citação curta e dizer o capítulo", "Explicar o que a função do sal faz perceber", "Enfrentar uma objeção e retomar a ligação"], "f": "Quem ouve precisa de saber a ideia, ouvir a prova e compreender a ligação. A objeção testa a leitura; não substitui a explicação.", "fe": "Uma citação isolada deixa a quem ouve o trabalho de perceber a ideia. Apresenta-a, prova-a e responde depois ao que a pode limitar.", "g": 5}, {"t": "emparelhar", "p": "Liga cada caso inventado ao que faz numa apresentação.", "p2": "Liga cada caso inventado ao que faz numa apresentação.", "pares": [["Um farol orienta; uma boa explicação também.", "Propõe uma correspondência"], ["Mas uma pessoa pode escolher outro caminho.", "Limita a correspondência"], ["A luz orienta, não decide o destino.", "Responde à limitação"], ["Imagina que procuras a entrada à noite.", "Aproxima a ideia de quem ouve"]], "f": "A objeção é útil quando testa a ligação e a resposta explica até onde ela vale. Este farol é só um caso criado, não um peixe escolhido por ti.", "fe": "A primeira frase estabelece a ligação; a segunda mostra um limite; a terceira responde sem o apagar; a última convida quem ouve a imaginar o caso.", "g": 6}, {"t": "completar", "p": "Dois exemplos inventados: alguém retém toda a informação; outro gesto é partilhar os apontamentos. Como comparar sem expor colegas?", "p2": "Dois exemplos inventados: alguém retém toda a informação; outro gesto é partilhar os apontamentos. Como comparar sem expor colegas?", "frase": "Na apresentação, descreve [1].", "lacunas": [{"o": ["o gesto sem identificar pessoas", "o nome de quem provoca problemas", "a aparência de quem te incomoda"], "c": 0}], "f": "A crítica incide num comportamento verificável, sem identificar pessoas reais. A tarefa pede essa separação, também trabalhada em F10.", "fe": "Nome e aparência expõem pessoas e não provam o comportamento. Seleciona a ação que podes explicar sem visar alguém.", "g": 7}, {"t": "escolha", "p": "Vieira põe lado a lado «Deixa as praças, vai-se às praias» e «deixa a terra, e vai-se ao mar». O que explica o paralelismo?", "p2": "Vieira põe lado a lado «Deixa as praças, vai-se às praias» e «deixa a terra, e vai-se ao mar». O que explica o paralelismo?", "o": ["A estrutura repetida muda a direção.", "A estrutura repetida mantém o local.", "A estrutura repetida apaga o trajeto."], "c": 0, "f": "A construção repete-se, mas praça/terra dão lugar a praia/mar. O ritmo torna audível a mudança de auditório (F01, cap. I).", "fe": [null, "Os lugares mudam: praças e terra são abandonadas, praias e mar tornam-se o destino.", "A repetição organiza o trajeto; não o elimina."], "g": 8}, {"t": "rever", "p": "Revê esta resposta para enfrentar a objeção sem atacar quem a faz.", "p2": "Revê esta resposta para enfrentar a objeção sem atacar quem a faz.", "o": ["A comparação vale em tudo; ninguém deve contestar.", "A comparação vale num ponto; explico o seu limite.", "A comparação vale por mim; os outros sabem menos."], "c": 1, "f": "Reconhecer o limite afina a comparação. É preciso mostrar o ponto comum e responder à discordância, como se treina em F10.", "fe": ["Proibir a contestação não mostra que a comparação funciona.", null, "Desvalorizar quem discorda evita o argumento em vez de lhe responder."], "frase": "A comparação vale por mim; os outros sabem menos.", "trecho": "A comparação vale por mim; os outros sabem menos.", "apoio": "Caso inventado: alguém compara uma explicação a um farol; outra pessoa lembra que o destino não vem decidido pela luz.", "g": 9}, {"t": "vf", "p": "Ler o guião uma vez em voz alta ajuda-te a detetar frases que perdem clareza quando são ouvidas.", "p2": "Ler o guião uma vez em voz alta ajuda-te a detetar frases que perdem clareza quando são ouvidas.", "v": true, "f": "Verdadeiro. Quem ouve não pode voltar à frase com os olhos. Testar pausas, extensão e articulação ajuda a escrever para dizer. Não substitui a revisão da prova.", "fe": "A correção escrita não garante que a frase se compreenda à primeira audição. Experimenta lê-la sem parar e marca onde precisas de respirar.", "g": 10}, {"t": "ler", "rot": "Para levar", "titulo": "Escolhe tu o peixe", "html": "<p>Na tarefa, o peixe e a passagem são teus. Mostra o comportamento, localiza a prova, nomeia e explica o recurso. Testa a comparação com uma objeção e lê o guião em voz alta antes de o rever.<\/p>"}];var C=EPICasca.pagina();EPIJogo.montar({casca:C,el:document.getElementById("baralho"),itens:CARTOES,chave:K,"marca": "M4", "titulo": "Aquecer: Uma imagem que se explica", "variar": false, "gestalt": true, "percurso": "../../../m4/#unidade-pedagogica-1", "seguinte": "../", "seguinteRotulo": "Abrir a aula de tarefa", "versao": "1",depois:"<p><a href=\"../\">Abrir a aula de tarefa</a> · <a href=\"../../../m4/#unidade-pedagogica-1\">Voltar à unidade 1</a></p>"});});</script><script defer src="../../../assets/projection-launcher.js?v=20261019.4" data-site="pt"></script></body></html>
