="casca-acoes" data-c-acoes></footer><section class="casca-folha" data-c-folha role="status" aria-live="polite" hidden></section><div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 4 · No início da aula de tarefa<br>Unidade 2</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação do aquecimento"><a href="../">Aula de tarefa</a><a href="../../../m4/#unidade-pedagogica-2">Unidade 2 no percurso</a><a href="../../../m4/">Voltar ao percurso do M4</a><a href="?projetar=1">Projetar para a turma</a></nav><p class="c-menu-extra">Aquecimento com consulta livre; não conta para a nota. O progresso fica neste aparelho.</p></div></div></div><noscript>Este aquecimento precisa de JavaScript. <a href="../">Abrir a aula de tarefa</a>.</noscript><script>document.addEventListener("DOMContentLoaded",function(){"use strict";var K="aquecimento-m4-u2",CARTOES=[{"t": "ler", "rot": "Abre", "titulo": "O que viste, o que lês, o que julgas", "html": "<p>Dez minutos com consulta. As cenas e o texto teatral deste aquecimento são inventados e não descrevem TPC nem Garrett. Treinas as operações de F20: observar, interpretar, julgar com razões e localizar uma passagem. Na tarefa, usas apenas recordações seguras e o texto confirmado. Não conta para a nota.<\/p>"}, {"t": "emparelhar", "p": "Caso inventado: numa cena, uma intérprete para junto de uma cadeira vazia. Liga cada frase à operação.", "p2": "Caso inventado: numa cena, uma intérprete para junto de uma cadeira vazia. Liga cada frase à operação.", "pares": [["A intérprete ficou junto da cadeira.", "Descreve o que se vê"], ["A cadeira pode sugerir uma ausência.", "Propõe uma interpretação"], ["A pausa foi eficaz: deu peso à ausência.", "Julga com uma razão"], ["O espetáculo chama-se Porta aberta.", "Identifica a criação inventada"]], "f": "Uma apreciação distingue informação, sentido e juízo. Aqui, o título e a cena foram criados só para o treino.", "fe": "A descrição aponta o gesto; pode sugerir apresenta uma leitura; eficaz julga e pede uma razão; o título identifica a criação.", "g": 1}, {"t": "escolha", "p": "Cena inventada: a luz ilumina apenas uma cadeira vazia. Que frase descreve sem atribuir intenções?", "p2": "Cena inventada: a luz ilumina apenas uma cadeira vazia. Que frase descreve sem atribuir intenções?", "o": ["A luz deixou uma cadeira iluminada.", "A luz quis mostrar uma vida perdida.", "A luz provou uma saudade escondida."], "c": 0, "f": "O foco na cadeira é observável; vida perdida e saudade escondida já interpretam o sinal. A intenção não se vê diretamente (F20).", "fe": [null, "Quis atribui uma intenção que não foi confirmada. Podes propor uma leitura, identificando-a como tal.", "A saudade não é um dado visível, e provou apresenta uma interpretação como certeza."], "g": 2}, {"t": "completar", "p": "Completa a regra de escrita da apreciação (F20).", "p2": "Completa a regra de escrita da apreciação (F20).", "frase": "Um juízo crítico precisa de [1].", "lacunas": [{"o": ["um resumo do enredo inteiro", "um critério e de um pormenor", "um elogio do elenco completo"], "c": 1}], "f": "O critério diz o que avalias; o pormenor mostra por que razão o juízo se sustenta. Resumir não é avaliar.", "fe": "Um resumo conta a história, e um elogio genérico não mostra por que funciona. Liga o critério ao que efetivamente viste ou ouviste.", "g": 3}, {"t": "escolha", "p": "Texto inventado para o treino: ato II, cena IV. A fala é Fica a cadeira. Que registo a copia e localiza sem alterar?", "p2": "Texto inventado para o treino: ato II, cena IV. A fala é Fica a cadeira. Que registo a copia e localiza sem alterar?", "o": ["Fica essa cadeira. Ato II, cena IV.", "Fica a cadeira. Ato III, cena IV.", "Fica a cadeira. Ato II, cena IV."], "c": 2, "f": "A transcrição conserva as palavras e a indicação fornecida: ato II, cena IV. É um texto inventado, não uma citação de Garrett.", "fe": ["Essa acrescenta uma palavra que não está no texto fornecido.", "A fala está certa, mas o ato foi alterado: II não é III.", null], "g": 4}, {"t": "ordenar", "p": "Organiza um parágrafo sobre a cena inventada da cadeira vazia.", "p2": "Organiza um parágrafo sobre a cena inventada da cadeira vazia.", "passos": ["Indicar a escolha cénica que vais avaliar", "Descrever o pormenor relevante sem contar tudo", "Propor o seu efeito e confrontá-lo com o texto", "Fechar com um juízo e a razão que o sustenta"], "f": "O parágrafo seleciona, descreve, relaciona e avalia. A interpretação não dispensa a observação que a sustenta (F20).", "fe": "Antes de julgar, mostra o que avalias. A relação com o texto vem apoiada num pormenor, e o juízo fecha com a sua razão.", "g": 5}, {"t": "emparelhar", "p": "Liga cada elemento inventado à origem indicada no próprio caso.", "p2": "Liga cada elemento inventado à origem indicada no próprio caso.", "pares": [["Ato II, cena IV: a didascália indica uma cadeira.", "Pertence ao texto de treino"], ["A montagem usa uma cadeira transparente.", "É uma escolha de encenação"], ["Quem viu anotou uma pausa antes da saída.", "É um registo de observação"], ["A transparência pode sugerir fragilidade.", "É uma interpretação do sinal"]], "f": "Distingue o que o texto prescreve, o que a montagem escolhe, o que foi observado e o sentido proposto. Não atribuas tudo ao autor.", "fe": "O texto só indica uma cadeira; o material vem da montagem; a pausa é observada; a fragilidade é uma leitura que precisa de apoio.", "g": 6}, {"t": "completar", "p": "Numa nota sobre a cena inventada, não tens a certeza de ter ouvido uma fala. Como proceder?", "p2": "Numa nota sobre a cena inventada, não tens a certeza de ter ouvido uma fala. Como proceder?", "frase": "Antes de citar de memória, [1].", "lacunas": [{"o": ["transforma a dúvida numa certeza", "procura uma frase mais dramática", "assinala a dúvida e confirma-a"], "c": 2}], "f": "Uma memória incerta precisa de confirmação num registo. Se não consegues confirmar palavras, não as apresentes como transcrição exata (F20).", "fe": "Tornar a dúvida certeza ou escolher uma frase dramática inventa informação. A observação limita o que podes afirmar.", "g": 7}, {"t": "escolha", "p": "Sobre a cadeira transparente, que frase formula um juízo com critério e pormenor?", "p2": "Sobre a cadeira transparente, que frase formula um juízo com critério e pormenor?", "o": ["A cena foi fiel; a luz provou o desejo do autor.", "A cena foi exata; a luz confirmou toda a história.", "A cena foi legível; a luz isolou a cadeira vazia."], "c": 2, "f": "Legível é o critério; a cadeira isolada pela luz é o pormenor observado que o sustenta. Os outros juízos ficam sem apoio pertinente.", "fe": ["A luz não prova uma intenção do autor. Julgar a fidelidade exigiria confrontar a escolha cénica com o texto.", "Um pormenor de luz não confirma a história toda. O juízo ultrapassa o que o caso permite observar.", null], "g": 8}, {"t": "rever", "p": "Revê a frase para distinguir a criação inventada do texto em que se apoia.", "p2": "Revê a frase para distinguir a criação inventada do texto em que se apoia.", "o": ["O texto manda uma cadeira; a montagem escolhe o vidro.", "O texto manda uma cadeira; o próprio autor escolhe o vidro.", "O texto manda uma cadeira; a leitura comprova o vidro."], "c": 0, "f": "Neste caso, a didascália indica só uma cadeira. O material transparente pertence à montagem inventada, não ao texto. Esta distinção transfere-se para a tarefa.", "fe": [null, "O caso não atribui o material ao autor. Estarias a acrescentar uma prescrição ao texto.", "Ler a indicação uma cadeira não comprova que ela seja de vidro."], "frase": "O autor mandou pôr em palco uma cadeira de vidro.", "trecho": "O autor mandou pôr em palco uma cadeira de vidro.", "apoio": "Caso inventado: o texto indica uma cadeira; a montagem usa vidro. Nenhuma destas escolhas descreve o espetáculo visto pela turma.", "g": 9}, {"t": "vf", "p": "Se recordas o sentido de uma fala mas não consegues confirmar as palavras, podes apresentá-la como citação exata.", "p2": "Se recordas o sentido de uma fala mas não consegues confirmar as palavras, podes apresentá-la como citação exata.", "v": false, "f": "Falso. Descreve o sentido sem fingir uma transcrição; para citar literalmente, confirma as palavras e a localização no texto (F20).", "fe": "As aspas prometem palavras exatas. Uma paráfrase de memória deve ser identificada como descrição do sentido, não como transcrição.", "g": 10}, {"t": "ler", "rot": "Para levar", "titulo": "A tua experiência é a fonte", "html": "<p>Na tarefa, identifica o espetáculo e separa o que recordas do que interpretas. Escolhe pormenores observados, confirma Garrett com ato e cena e fundamenta os juízos. Se usares a alternativa de leitura em aula, identifica essa opção.<\/p>"}];var C=EPICasca.pagina();EPIJogo.montar({casca:C,el:document.getElementById("baralho"),itens:CARTOES,chave:K,"marca": "M4", "titulo": "Aquecer: Do pormenor ao juízo", "variar": false, "gestalt": true, "percurso": "../../../m4/#unidade-pedagogica-2", "seguinte": "../", "seguinteRotulo": "Abrir a aula de tarefa", "versao": "1",depois:"<p><a href=\"../\">Abrir a aula de tarefa</a> · <a href=\"../../../m4/#unidade-pedagogica-2\">Voltar à unidade 2</a></p>"});});</script><script defer src="../../../assets/projection-launcher.js?v=20261019.4" data-site="pt"></script></body></html>
