<!doctype html><html lang="pt-PT" data-appearance-site="pt" data-appearance-family="cards"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aquecer · Do pormenor ao juízo · M4</title><meta name="description" content="Aquecimento da unidade 2 do M4: dez minutos com consulta, com outros exemplos para preparar a tarefa."><link rel="stylesheet" href="../../../assets/pt-lessons/lesson.css"><script defer src="../../../assets/pt-lessons/casca.js"></script><script defer src="../../../assets/pt-lessons/jogo.js?v=20261021-ux06"></script><script defer src="../../../assets/pt-lessons/rever-frase.js?v=20261021"></script><style id="casca-pc">@media (min-width:1024px) and (min-height:560px){:root{--col:min(820px,100%)}.casca{grid-template-rows:auto auto minmax(0,auto) auto 1fr}.casca>.casca-corpo{padding-top:clamp(8px,2vh,24px);padding-bottom:0}.casca>.casca-acoes,.casca>.casca-folha{grid-row:4;grid-column:1}.casca>.casca-acoes{padding-left:0;padding-right:0}.casca>.casca-folha{position:relative;left:auto;right:auto;bottom:auto;z-index:20;align-self:start;justify-self:center;width:100%;max-width:var(--col);transform:translateY(6px);opacity:0;transition:transform .18s cubic-bezier(.2,.7,.2,1),opacity .18s;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 14px 30px rgba(0,0,0,.08)}.casca>.casca-folha.aberta{transform:none;opacity:1}.casca>.casca-folha .c-folha-in{padding:18px 24px 16px}.casca>.casca-folha .c-expl{font-size:1.12rem;max-height:min(34vh,340px)}.casca .jogo{margin-bottom:0}.casca .jogo .cartao{padding:clamp(28px,3vw,44px) clamp(28px,3.4vw,52px)}.casca .jogo .rot{font-size:.76rem;margin-bottom:24px}.casca .jogo .tit.cartaz{font-size:clamp(2.4rem,3.2vw,3rem)}.casca .jogo .tit{font-size:1.3rem}.casca .jogo .q{font-size:1.62rem;line-height:1.32}.casca .jogo .ler{font-size:1.24rem;line-height:1.62}.casca .jogo .ler .abre{font-size:1.42rem;line-height:1.45}.casca .jogo .ler .levar{font-size:1.7rem}.casca .jogo button.op{font-size:1.06rem;min-height:52px}.casca .jogo .dica{font-size:.95rem}.casca .jogo .pista{font-size:1.12rem}.casca .jogo .ler .fig{display:flex;align-items:flex-end;gap:22px;margin-bottom:28px}.casca .jogo .ler .fig img{flex:0 1 auto;min-width:0;max-height:min(46vh,520px);object-fit:contain}.casca .jogo .ler .fig figcaption a{color:inherit}.casca .jogo .ler .fig figcaption{flex:0 0 13.5rem;margin:0;font-size:.84rem;line-height:1.45;padding-bottom:2px;border-top:2px solid var(--tinta);padding-top:8px}}@media (min-width:1600px) and (min-height:760px){:root{--col:min(900px,100%)}.casca>.casca-corpo{padding-top:4vh}.casca .jogo .ler{font-size:1.32rem}.casca .jogo .ler .abre{font-size:1.5rem}.casca .jogo .q{font-size:1.75rem}.casca .jogo button.op{font-size:1.12rem}}@media (min-width:1024px) and (min-height:560px) and (prefers-reduced-motion:reduce){.casca>.casca-folha{transition:none;transform:none}}</style><link rel="stylesheet" href="../../../assets/appearance.css?v=20261025-universal-1"><script src="../../../assets/appearance.js?v=20261025-universal-1"></script></head><body data-unit-return="../../../m4/#unidade-pedagogica-2" data-unit-number="2"><div class="casca" data-casca><header class="casca-topo"><a class="c-marca" href="../" aria-label="Voltar à aula de tarefa da unidade 2 do módulo 4">M4</a><span class="c-num" data-c-num></span><button type="button" class="c-barra" data-c-barra aria-label="Ver os cartões já feitos" disabled><svg viewBox="0 0 1 10" preserveAspectRatio="none" aria-hidden="true"></svg></button><span class="c-modo" data-c-modo hidden></span><button type="button" class="c-ic" data-c-som aria-pressed="false" aria-label="Som"><span class="c-roda">♪</span></button><button type="button" class="c-ic" data-c-menu aria-label="Menu" aria-expanded="false"><span class="c-tres"></span></button></header><h1 class="c-sr">Aquecer: Do pormenor ao juízo</h1><main class="casca-corpo" tabindex="-1"><div id="baralho" class="jogo-alvo"></div></main><footer class="casca-acoes" data-c-acoes></footer><section class="casca-folha" data-c-folha role="status" aria-live="polite" hidden></section><div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 4 · No início da aula de tarefa<br>Unidade 2</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação do aquecimento"><a href="../">Aula de tarefa</a><a href="../../../m4/#unidade-pedagogica-2">Unidade 2 no percurso</a><a href="../../../m4/">Voltar ao percurso do M4</a><a href="?projetar=1">Projetar para a turma</a></nav><p class="c-menu-extra">Aquecimento com consulta livre; não conta para a nota. O progresso fica neste aparelho.</p></div></div></div><noscript>Este aquecimento precisa de JavaScript. <a href="../">Abrir a aula de tarefa</a>.</noscript><script>document.addEventListener("DOMContentLoaded",function(){"use strict";var K="aquecimento-m4-u2",CARTOES=[{"t": "ler", "rot": "Abre", "titulo": "O que viste, o que lês, o que julgas", "html": "<p>Dez minutos com consulta. Para não antecipar a tarefa, tudo aqui é inventado: uma peça com atos e cenas e <i>Porta aberta<\/i>, uma recriação dessa peça com outra autora. Nada disto descreve <i>TPC<\/i> nem cita Garrett. As falas inventadas vêm em itálico; na tua apreciação, a citação de Garrett vai entre aspas. Treinas as operações da lição F20: observar, interpretar, julgar com razões, citar com ato e cena e distinguir duas obras. Não conta para a nota.<\/p>"}, {"t": "emparelhar", "p": "Caso inventado: em _Porta aberta_, uma intérprete fica parada, numa longa pausa, junto de uma cadeira vazia. Liga cada frase ao que faz.", "p2": "Identificação, facto, interpretação ou opinião? Liga cada frase sobre a cena inventada de _Porta aberta_.", "pares": [["Vi _Porta aberta_ num teatro da cidade, em maio.", "Identifica o espetáculo"], ["A intérprete ficou parada junto da cadeira.", "Facto: vê-se e confirma-se"], ["A cadeira vazia pode sugerir uma ausência.", "Interpretação: lê um sinal"], ["A pausa resultou: a sala ficou em silêncio.", "Opinião: julga com uma razão"]], "f": "A apreciação identifica o espetáculo (título, autoria, teatro, data) e separa o facto, que se confirma, a interpretação, que lê um sinal visto, e a opinião, que julga com uma razão (lição F20).", "fe": "Pergunta a cada frase como se prova: vendo (facto), lendo um sinal, com **pode sugerir** (interpretação), ou dando uma razão, como a sala em silêncio (opinião). Título, lugar e data identificam.", "g": 1}, {"t": "escolha", "p": "Cena inventada de _Porta aberta_: o palco fica às escuras e só a cadeira vazia tem luz. Que frase só descreve o que se vê?", "p2": "Na cena inventada, a luz deixa à vista apenas a cadeira vazia. Qual destas frases é um facto, sem interpretação?", "o": ["A luz deixou só a cadeira vazia à vista.", "A encenadora quis lembrar uma pessoa morta.", "A cadeira vazia provou uma saudade antiga."], "c": 0, "f": "Que a luz deixa só a cadeira à vista, vê-se e confirma-se: é um facto. A intenção de quem encena e o sentimento sugerido já são interpretações, a dizer com prudência (lição F20).", "fe": [null, "**Quis** atribui uma intenção à encenadora, e a intenção não se vê. Para a propor, aponta o sinal e usa **pode sugerir**.", "A saudade não se vê, e **provou** apresenta uma interpretação como certeza. Seria uma leitura a dizer com prudência."], "g": 2}, {"t": "completar", "p": "Completa a regra do juízo crítico que a tarefa avalia.", "p2": "O que faz de uma opinião sobre uma cena um juízo crítico?", "frase": "Um juízo crítico liga [1].", "lacunas": [{"o": ["um critério a um pormenor visto", "um adjetivo forte a um superlativo", "um resumo à intenção da encenadora"], "c": 0}], "f": "O critério diz o que avalias (a clareza de uma cena, por exemplo); o pormenor visto mostra por que razão o juízo se sustenta. Um superlativo não é prova, e a intenção não se vê (lição F20).", "fe": "Um adjetivo mais forte não acrescenta prova, e resumir ou adivinhar intenções não é julgar. Liga o que avalias a algo que viste ou ouviste.", "g": 3}, {"t": "escolha", "p": "Peça inventada, ato II, cena IV. A personagem diz: _Fica a cadeira._ Que cópia conserva as palavras e a localização?", "p2": "No ato II, cena IV, da peça inventada, uma personagem diz _Fica a cadeira._ Que cópia está exata, com o lugar certo?", "o": ["_Fica essa cadeira._ (ato II, cena IV)", "_Fica a cadeira._ (ato III, cena IV)", "_Fica a cadeira._ (ato II, cena IV)"], "c": 2, "f": "A cópia conserva as palavras e o lugar. Aqui, o itálico só marca a fala inventada: na tua apreciação, a citação curta de Garrett vai entre aspas, com o ato e a cena entre parênteses (lição F20).", "fe": ["**Essa** não está na fala: uma cópia não acrescenta nem troca palavras.", "As palavras estão certas, mas o ato não: é o II, não o III. Com o lugar errado, a citação não se confirma no texto.", null], "g": 4}, {"t": "ordenar", "p": "Põe por ordem os passos de uma apreciação sobre a cena inventada de _Porta aberta_.", "p2": "Do título ao juízo final: ordena a apreciação da cena inventada da cadeira vazia.", "passos": ["Dar um título e identificar o espetáculo visto", "Descrever só o pormenor que vais comentar", "Citar a passagem da peça, com ato e cena", "Fechar com um juízo e a razão que o sustenta"], "f": "Abres com o título e a identificação, descreves só o que vais comentar, comparas com a peça numa citação curta e fechas com o juízo e a sua razão, como pede a lição F20.", "fe": "Primeiro diz o que viste e onde. A descrição prepara a comparação, a citação apoia-a no texto, e o juízo fecha com a razão que o sustenta.", "g": 5}, {"t": "emparelhar", "p": "Cena inventada de _Porta aberta_. Liga cada pormenor à sua origem: o texto da peça ou uma escolha de quem encena.", "p2": "Texto da peça, desenho de luz, cenografia ou marcação? Liga cada pormenor da cena inventada.", "pares": [["A didascália do ato II, cena IV pede uma cadeira.", "Texto da peça"], ["Um foco deixa só a cadeira à vista.", "Desenho de luz"], ["A cadeira posta em palco é de vidro.", "Cenografia"], ["A intérprete fica de costas, ao fundo.", "Marcação"]], "f": "A didascália é do texto. A luz, o espaço com o que nele está e o lugar de quem representa são escolhas de quem encena: desenho de luz, cenografia e marcação (lição F20). Usa estas palavras com rigor.", "fe": "Pergunta a cada pormenor: está escrito na peça, ou é o que a luz mostra, o espaço e os objetos, ou o lugar de alguém em palco?", "g": 6}, {"t": "completar", "p": "Na nota sobre _Porta aberta_, não tens a certeza da cor da luz numa cena. Completa.", "p2": "Não sabes ao certo a cor da luz numa cena de _Porta aberta_. Que fazes na tua nota?", "frase": "Sem certeza sobre o pormenor, [1].", "lacunas": [{"o": ["assinalo a dúvida e procuro um registo", "escrevo a cor que me parece provável", "uso a memória de um colega como certa"], "c": 0}], "f": "Uma memória incerta não é um erro: assinala-se e confirma-se num registo, como um vídeo do espetáculo (lição F20). O que não confirmas não se apresenta como visto.", "fe": "Uma cor provável não é uma cor vista, e a memória de outra pessoa não passa a ser tua. Assinala a dúvida e esclarece-a num registo.", "g": 7}, {"t": "escolha", "p": "Sobre a cena inventada da cadeira de vidro, que frase formula um juízo com critério e pormenor visto?", "p2": "Qual destas opiniões sobre a cena inventada da cadeira tem um critério e um pormenor que se viu?", "o": ["A cena foi fiel; a luz provou o desejo do autor.", "A cena foi exata; a luz confirmou toda a história.", "A cena foi legível; a luz isolou a cadeira vazia."], "c": 2, "f": "**Legível** é o critério; a cadeira isolada pela luz é o pormenor visto que o sustenta. Os outros juízos apoiam-se numa intenção ou numa generalização.", "fe": ["A luz não prova uma intenção do autor. Julgar a fidelidade exigiria confrontar a escolha cénica com o texto.", "Um pormenor de luz não confirma a história toda. O juízo ultrapassa o que o caso permite observar.", null], "g": 8}, {"t": "rever", "p": "Revê a frase do rascunho: separa o que vem da peça do que escolheu a encenação de _Porta aberta_.", "p2": "O rascunho dá ao autor da peça uma escolha que não é dele. Que versão separa as duas obras?", "o": ["A peça pede uma cadeira; a encenação escolhe o vidro.", "A peça pede uma cadeira de vidro; a encenação cumpre.", "A peça não fala de cadeira; a encenação põe uma de vidro."], "c": 0, "f": "A didascália pede só uma cadeira; o vidro é uma escolha da encenação da recriação. Na tarefa, separa da mesma maneira o que é de Garrett e o que é do espetáculo.", "fe": [null, "A didascália só pede uma cadeira: o vidro não está no texto. Não atribuas à peça uma escolha de quem encena.", "A didascália do ato II, cena IV pede uma cadeira: a encenação não a inventa, escolhe-lhe o material."], "frase": "O autor da peça pôs em palco uma cadeira de vidro.", "trecho": "O autor da peça pôs em palco uma cadeira de vidro.", "apoio": "Didascália da peça inventada, ato II, cena IV: pede uma cadeira. Na recriação, a cadeira é de vidro. Nada disto descreve o espetáculo visto pela turma.", "g": 9}, {"t": "vf", "p": "Uma fala que ouviste em _Porta aberta_, recriação da peça inventada, pode citar-se como fala da peça sem a procurares no texto.", "p2": "Numa recriação com outra autora, tudo o que se ouve em palco foi escrito pelo autor da peça de partida.", "v": false, "f": "Falso. Uma recriação tem texto e encenação próprios. Entre aspas, como fala da peça, só o que copias do texto, com ato e cena; o que ouviste no palco descreve-se sem aspas (lição F20).", "fe": "A recriação tem outra autora: uma fala ouvida só é da peça depois de a encontrares no texto. Na tarefa, o mesmo vale para o espetáculo do LU.CA e para Garrett.", "g": 10}, {"t": "ler", "rot": "Para levar", "titulo": "A tua experiência é a fonte", "html": "<p>Na tarefa, dá um título e identifica o espetáculo. Descreve só o momento que comentas e separa o que recordas do que interpretas. Distingue as duas obras: <i>TPC<\/i> é uma recriação, com outra autoria, e não tem de repetir as cenas de Garrett; não forces correspondências. Entre aspas, só o que copias de Garrett, com ato e cena. Fundamenta cada juízo num pormenor visto, com o vocabulário do teatro. Se usares a alternativa de leitura em aula, identifica essa opção.<\/p>"}];var C=EPICasca.pagina();EPIJogo.montar({casca:C,el:document.getElementById("baralho"),itens:CARTOES,chave:K,"marca": "M4", "titulo": "Aquecer: Do pormenor ao juízo", "variar": false, "gestalt": true, "percurso": "../../../m4/#unidade-pedagogica-2", "seguinte": "../", "seguinteRotulo": "Abrir a aula de tarefa", "versao": "1",depois:"<p><a href=\"../\">Abrir a aula de tarefa</a> · <a href=\"../../../m4/#unidade-pedagogica-2\">Voltar à unidade 2</a></p>"});});</script><script defer src="../../../assets/projection-launcher.js?v=20261019.4" data-site="pt"></script></body></html>
