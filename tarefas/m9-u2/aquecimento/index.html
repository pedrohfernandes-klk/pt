r class="casca-acoes" data-c-acoes></footer><section class="casca-folha" data-c-folha role="status" aria-live="polite" hidden></section><div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 9 · No início da aula de tarefa<br>Unidade 2</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação do aquecimento"><a href="../">Aula de tarefa</a><a href="../../../m9/#unidade-pedagogica-2">Unidade 2 no percurso</a><a href="../../../m9/licao-m9-f10/">Relembrar F10</a><a href="../../../m9/licao-m9-f13/">Relembrar F13</a><a href="../../../m9/licao-m9-f03/">Relembrar F03</a><a href="?projetar=1">Projetar para a turma</a></nav><p class="c-menu-extra">Aquecimento com consulta livre; não conta para a nota. O progresso fica neste aparelho.</p></div></div></div><noscript>Este aquecimento precisa de JavaScript. <a href="../">Abrir a aula de tarefa</a>.</noscript><script>document.addEventListener("DOMContentLoaded",function(){"use strict";var K="aquecimento-m9-u2",CARTOES=[{"t": "ler", "rot": "Abre", "titulo": "Uma decisão que aguenta perguntas", "html": "<p>Dez minutos com consulta, sem nota. Os exemplos foram inventados para treinar operações de leitura e escrita; não dão as respostas da tarefa.<\/p><p>Caso inventado: numa exposição escolar, as legendas só dão os títulos das fotografias. A turma discute se deve acrescentar as datas. Algumas imagens mostram o mesmo lugar em anos diferentes.<\/p>"}, {"t": "escolha", "p": "Que decisão responde ao problema das imagens?", "p2": "Que proposta permite comparar momentos do lugar?", "o": ["Juntar datas para distinguir os momentos.", "Retirar títulos para igualar os momentos.", "Trocar imagens para esquecer os momentos."], "c": 0, "f": "As datas permitem situar mudanças; a decisão precisa ainda de justificação e de uma resposta a objeções.", "fe": [null, "Retirar informação não ajuda a situar os momentos.", "Apagar diferenças evita a questão em vez de a resolver."], "g": "1"}, {"t": "emparelhar", "p": "Liga cada função ao elemento do caso.", "p2": "Que elemento observa, interpreta ou limita?", "pares": [["Decisão", "acrescentar datas às legendas"], ["Fundamento", "há imagens de anos diferentes"], ["Objeção", "mais texto pode dificultar a leitura"]], "f": "Uma interpretação precisa de observação e de uma relação explicada. Mantém distintas as funções.", "fe": "Volta ao caso: uma coisa é observar, outra é concluir ou propor.", "g": "2"}, {"t": "rever", "p": "Revê a conclusão para a ajustar ao caso.", "p2": "Que substituição evita afirmar mais do que o exemplo permite?", "apoio": "Caso inventado: numa exposição escolar, as legendas só dão os títulos das fotografias. A turma discute se deve acrescentar as datas. Algumas imagens mostram o mesmo lugar em anos diferentes.", "frase": "As datas devem entrar porque sim.", "trecho": "porque sim", "o": ["para dispensar qualquer leitura", "para distinguir épocas das imagens", "para evitar todas as diferenças"], "c": 1, "f": "A revisão ajusta a conclusão aos elementos disponíveis e conserva uma frase completa.", "fe": ["Esta alternativa não resolve o desajuste entre a conclusão e os elementos do caso. Confere o que foi observado.", null, "Esta alternativa não resolve o desajuste entre a conclusão e os elementos do caso. Volta ao contexto antes de decidir."], "g": "3"}, {"t": "vf", "p": "Dar nome a um recurso basta para explicar o seu efeito.", "p2": "Uma classificação, sem contexto, já fundamenta a leitura?", "v": false, "f": "O nome classifica; a explicação mostra o que a escolha faz neste contexto.", "fe": "Volta ao pormenor e pergunta que diferença faz para quem lê.", "g": "4"}, {"t": "ordenar", "p": "Ordena um percurso de revisão.", "p2": "Que sequência permite testar uma interpretação?", "passos": ["Localizar um pormenor no texto.", "Explicar o efeito desse pormenor.", "Confrontar a explicação com o contexto."], "f": "Localizas, explicas e testas. Podes voltar atrás se o contexto contrariar a hipótese.", "fe": "Não confirmes uma leitura antes de a confrontares com aquilo que o texto mostra.", "g": "5"}, {"t": "escolha", "p": "Que comentário ajuda a melhorar uma resposta?", "p2": "Que pedido exige uma relação verificável?", "o": ["Explica como o pormenor sustenta a leitura.", "Afirma que a leitura é sempre a mais bonita.", "Repete que o autor escreveu muitos textos."], "c": 0, "f": "O comentário pede uma relação entre prova e conclusão, em vez de elogio ou informação lateral.", "fe": [null, "A preferência não substitui a justificação.", "A quantidade de textos do autor não prova esta leitura."], "g": "6"}, {"t": "completar", "p": "Completa a revisão do argumento.", "p2": "Que palavras articulam prova e limite?", "frase": "Um indício ajuda a [1] uma leitura, mas não permite [2] todas as alternativas.", "lacunas": [{"o": ["sustentar", "disfarçar", "substituir"], "c": 0}, {"o": ["acolher", "excluir", "registar"], "c": 1}], "f": "O indício dá fundamento. Para excluir uma alternativa, precisas de a confrontar com o contexto.", "fe": "Distingue dar apoio a uma hipótese de eliminar automaticamente todas as outras.", "g": "7"}, {"t": "vf", "p": "Uma objeção pertinente pode obrigar a limitar a tua conclusão.", "p2": "Responder a uma dificuldade pode tornar a posição menos absoluta?", "v": true, "f": "Responder não exige manter tudo igual: podes precisar melhor as condições da tua posição.", "fe": "A revisão serve para tornar a posição defensável, não para a repetir sem mudança.", "g": "8"}, {"t": "escolha", "p": "Que fonte de informação permite conferir o indício?", "p2": "Onde regressas para verificar a tua interpretação?", "o": ["À passagem e ao contexto que a acompanha.", "À popularidade de quem dá a interpretação.", "À quantidade de vezes que repetes a ideia."], "c": 0, "f": "É no texto e no contexto que a hipótese se testa; a repetição e a popularidade não são provas.", "fe": [null, "Ser popular não garante rigor de leitura.", "Repetir a hipótese não acrescenta evidência."], "g": "9"}, {"t": "sublinhar", "p": "Toca na palavra que limita a certeza da conclusão.", "p2": "Que palavra apresenta a afirmação como hipótese?", "frase": "Este gesto talvez indique uma hesitação.", "certas": [2], "f": "Talvez assinala uma possibilidade. A hipótese tem de ser sustentada e pode ser revista.", "fe": "Procura a palavra que admite que a conclusão não está garantida.", "g": "10"}, {"t": "ler", "rot": "Para levar", "html": "<p>Na tarefa, escolhe as tuas passagens. Localiza, explica e revê: os exemplos deste aquecimento não são um texto para copiares.<\/p><p><a href=\"../\">Abrir a aula de tarefa<\/a><\/p>"}];var C=EPICasca.pagina();EPIJogo.montar({casca:C,el:document.getElementById("baralho"),itens:CARTOES,chave:K,"marca": "M9", "titulo": "Aquecer: Uma decisão que aguenta perguntas", "variar": false, "gestalt": true, "percurso": "../../../m9/#unidade-pedagogica-2", "seguinte": "../", "seguinteRotulo": "Abrir a aula de tarefa", "versao": "1",depois:"<p><a href=\"../\">Abrir a aula de tarefa</a> · <a href=\"../../../m9/#unidade-pedagogica-2\">Voltar à unidade 2</a></p>"});});</script><script defer src="../../../assets/projection-launcher.js?v=20261019.4" data-site="pt"></script></body></html>
