var K="licao-m2-f15",CARTOES=[{"t":"ler","titulo":"Uma língua, várias formas","rot":"Abre","html":"<p class=\"abre\">Uma palavra diferente não é automaticamente um erro. Mas também não basta encontrar uma diferença para saber de onde ela vem.<\/p><p>Vais distinguir lugar, tempo, situação e presença de outra língua, regressando à linguagem da <i>Farsa de Inês Pereira<\/i>.<\/p>"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>A <strong>variação geográfica<\/strong> relaciona diferenças com comunidades e lugares; a <strong>mudança histórica<\/strong>, com o tempo. O <strong>registo<\/strong> depende da situação de comunicação. Uma pessoa pode adaptar o registo sem mudar de variedade nacional.<\/p><p>Uma língua crioula é uma língua com organização própria, não uma forma errada de português. A diferença entre línguas não se reduz à diferença entre variedades de uma língua.<\/p>"},{"t":"ler","titulo":"Diferenças documentadas","rot":"Lê e confronta","html":"<p>Margarita Correia apresenta «ônibus/autocarro» e «bolsista/bolseiro» como exemplos de variantes lexicais no artigo <a href=\"https://ciberduvidas.iscte-iul.pt/artigos/rubricas/idioma/variantes-ou-variedades-de-portugues/5089\" target=\"_blank\" rel=\"noopener\">«Variantes ou variedades de português?», <i>Ciberdúvidas da Língua Portuguesa<\/i>, 17 de janeiro de 2023<\/a>. São formas associadas às variedades brasileira e europeia.<\/p><p>O recurso <a href=\"https://estudoemcasaapoia.dge.mec.pt/index.php/recurso/lingua-portuguesa-no-mundo-0\" target=\"_blank\" rel=\"noopener\">«A língua portuguesa no mundo», DGE/#EstudoEmCasa<\/a>, propõe estudar variedades e crioulos. Aqui, os exemplos lexicais provêm do artigo identificado, não de uma transcrição do vídeo.<\/p><p>Não precisas de conhecer todas as variedades para fazer uma classificação: precisas de saber que informação sustenta a diferença observada.<\/p>"},{"t":"escolha","p":"Que diferença exemplifica o par autocarro e ônibus?","o":["Uma variação lexical entre variedades nacionais.","Uma oposição entre duas línguas sem relação.","Uma mudança de pessoa numa conjugação verbal."],"c":0,"f":"As duas palavras são apresentadas como variantes lexicais do português. Não correspondem a duas formas flexionadas do mesmo verbo nem a línguas sem relação.","g":"m2-f15-3"},{"t":"vf","p":"Uma variedade nacional corresponde a uma única maneira de falar usada por toda a população.","v":false,"f":"Uma variedade nacional contém diversidade interna. O lugar, os grupos e as situações não deixam de produzir diferenças dentro de um país.","g":"m2-f15-4"},{"t":"emparelhar","p":"Liga o tipo de comparação ao fenómeno em análise.","pares":[["Usos de comunidades em lugares diferentes","Variação geográfica"],["Usos documentados em épocas diferentes","Mudança histórica"],["Pedidos à mesma pessoa em situações diferentes","Mudança de registo"]],"f":"A classificação depende do eixo comparado. Um caso pode envolver vários eixos; é necessário indicar qual deles se está a observar.","g":"m2-f15-5"},{"t":"ler","titulo":"Regressar à Farsa","rot":"Lê e confronta","html":"<blockquote>«Señora, tengo-os servido<br>Y vos a mi despreciado;»<\/blockquote><p>Gil Vicente, <i>Farsa de Inês Pereira<\/i> (1523), fala do Ermitão, conforme a <a href=\"https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira\" target=\"_blank\" rel=\"noopener\">transcrição integral na Wikisource<\/a>. Conserva-se a forma do testemunho transcrito.<\/p><p>A presença de castelhano na peça não é um exemplo de português brasileiro. A distância histórica de uma grafia portuguesa e a presença de outra língua são problemas diferentes. Uma grafia, por si só, também não permite reconstruir toda a pronúncia.<\/p>"},{"t":"completar","p":"Completa a distinção.","frase":"Comparar lugares permite estudar a variação [1]; comparar épocas permite estudar a mudança [2].","lacunas":[{"o":["geográfica","cronológica","situacional"],"c":0},{"o":["histórica","geográfica","estilizada"],"c":0}],"f":"Os nomes identificam eixos de análise. Saber de onde e de quando vêm os testemunhos é parte da prova, não um detalhe acessório.","g":"m2-f15-7"},{"t":"ordenar","p":"Ordena uma investigação de uma diferença linguística.","passos":["Registar as formas observadas","Identificar a origem e a data dos exemplos","Comparar o mesmo fenómeno em contexto","Classificar a diferença com uma justificação"],"f":"A classificação vem depois da identificação das fontes. A aparência de uma palavra não basta para atribuir nacionalidade a quem a usa.","g":"m2-f15-8"},{"t":"sublinhar","p":"Seleciona a palavra que torna abusiva esta generalização criada.","frase":"Uma palavra revela sempre a nacionalidade de quem fala.","certas":[3],"f":"Sempre transforma uma pista possível numa certeza universal. Pessoas podem usar formas de várias origens e adaptar o vocabulário à situação.","g":"m2-f15-9"},{"t":"escolha","p":"Que informação ajuda a distinguir tempo e lugar?","o":["A data e a comunidade dos exemplos comparados.","O tamanho e a cor das letras usadas nos exemplos.","A ordem e o número das páginas dos dois exemplos."],"c":0,"f":"A data e a comunidade permitem testar os eixos histórico e geográfico. Os aspetos de apresentação não demonstram a origem da diferença linguística.","g":"m2-f15-10"},{"t":"vf","p":"Uma língua crioula deve ser corrigida até se tornar português padrão.","v":false,"f":"Uma língua crioula tem estrutura própria. Descrevê-la como português defeituoso confunde sistemas linguísticos e desvaloriza injustificadamente os seus falantes.","g":"m2-f15-11"},{"t":"ler","titulo":"Adequação sem desvalorização","rot":"Lê e confronta","html":"<p>Pedidos didáticos criados: A: «Podes mandar-me a informação?» B: «Solicito o envio da informação.»<\/p><p>A diferença pode relacionar-se com a situação e a relação entre as pessoas. Não permite concluir que uma delas é mais inteligente. Numa produção escolar, aplicas a norma pedida, distinguindo adequação de inferioridade linguística.<\/p>"},{"t":"emparelhar","p":"Relaciona a conclusão com o cuidado necessário.","pares":[["Uma palavra tem uso noutra variedade","Confirmar o uso numa fonte"],["Um pedido muda de formulação","Observar a situação comunicativa"],["Uma fala está noutra língua","Não a classificar como erro de português"]],"f":"Cada conclusão pede um tipo de informação. Os exemplos não servem para ordenar pessoas por valor, mas para descrever usos com precisão.","g":"m2-f15-13"},{"t":"escolha","p":"Que alteração adapta o registo sem mudar o assunto?","o":["Reformular o mesmo pedido para uma entidade pública.","Substituir o pedido por uma descrição de uma paisagem.","Trocar a informação pedida por uma narrativa de infância."],"c":0,"f":"A reformulação conserva a finalidade e adapta a relação comunicativa. As outras opções mudam o conteúdo e não isolam a diferença de registo.","g":"m2-f15-14"},{"t":"completar","p":"Completa uma regra de análise.","frase":"A diferença precisa de [1]; a adequação depende da [2].","lacunas":[{"o":["contexto","correção","silêncio"],"c":0},{"o":["situação","pronúncia","população"],"c":0}],"f":"Contexto e situação permitem compreender a função das formas. Uma palavra diferente, isolada, não demonstra erro nem permite uma conclusão sobre a pessoa.","g":"m2-f15-15"},{"t":"ordenar","p":"Planeia um pequeno levantamento de variantes.","passos":["Escolher um conceito comum","Recolher formas em fontes identificadas","Anotar comunidade e contexto de uso","Apresentar semelhanças sem hierarquizar falantes"],"f":"A recolha exige documentação e contexto. Não basta colecionar palavras curiosas ou imitar pronúncias para demonstrar uma variedade.","g":"m2-f15-16"},{"t":"escolha","p":"Que conclusão respeita os exemplos estudados?","o":["O português admite formas diferentes documentadas.","O português exige uma forma única em todos os países.","O português antigo equivale à variedade brasileira atual."],"c":0,"f":"Os exemplos mostram diversidade dentro da língua. A mudança histórica e a variação geográfica continuam a ser dimensões distintas.","g":"m2-f15-17"},{"t":"vf","p":"Reconhecer a diversidade impede aprender a norma pedida numa produção escolar.","v":false,"f":"É possível aprender convenções de uma situação e reconhecer outros usos legítimos. Adequação não exige transformar toda a diferença em inferioridade.","g":"m2-f15-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Antes de chamar erro a uma diferença, identifica o que estás a comparar.<\/p><p>Explica um caso de variação geográfica, distingue-o de mudança histórica e indica que informação te permite fazê-lo.<\/p>"}];
