<div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 2<br>Unidade 2</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação da lição"><a href="../#m2-f15">Esta lição no percurso</a><a href="../licao-m2-f11/">Lição anterior</a><a href="../licao-m2-f10/">Lição seguinte</a></nav><p class="c-menu-extra">As citações têm crédito junto ao texto. Os exemplos criados estão identificados. O progresso fica neste aparelho.</p></div></div>

window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m2-f15",CARTOES=[{"t":"ler","titulo":"Uma língua, várias formas","rot":"Abre","html":"<p class=\"abre\"><strong>Que diferenças pertencem ao lugar, ao tempo ou a outra língua?<\/strong><\/p><p class=\"abre\">Uma palavra diferente não é automaticamente um erro. Mas também não basta encontrar uma diferença para saber de onde ela vem.<\/p><p>Vais distinguir lugar, tempo, situação e presença de outra língua, regressando à linguagem da <i>Farsa de Inês Pereira<\/i>.<\/p>"},{"t":"vf","p":"Antes de reler. Recupera as falas do Ermitão: encontrar castelhano na peça é o mesmo que encontrar uma variedade geográfica do português?","v":false,"f":"Confundir outra língua com uma variedade de português altera a classificação. Relê as falas do Ermitão e identifica o sistema linguístico antes de comparar lugares ou épocas.","g":"m2-f15-1","fe":"Confundes outra língua com uma variedade geográfica do português. Regressa às falas do Ermitão na Farsa de Inês Pereira e identifica a língua antes de comparar lugares ou épocas."},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>A <strong>variação geográfica<\/strong> relaciona diferenças com comunidades e lugares; a <strong>mudança histórica<\/strong>, com o tempo. O <strong>registo<\/strong> depende da situação de comunicação. Uma pessoa pode adaptar o registo sem mudar de variedade nacional.<\/p><p>Uma língua crioula é uma língua com organização própria, não uma forma errada de português. A diferença entre línguas não se reduz à diferença entre variedades de uma língua.<\/p>"},{"t":"ler","titulo":"Diferenças documentadas","rot":"Lê de perto","html":"<p>Margarita Correia apresenta «ônibus/autocarro» e «bolsista/bolseiro» como exemplos de variantes lexicais no artigo <a href=\"https://ciberduvidas.iscte-iul.pt/artigos/rubricas/idioma/variantes-ou-variedades-de-portugues/5089\" target=\"_blank\" rel=\"noopener\">«Variantes ou variedades de português?», <i>Ciberdúvidas da Língua Portuguesa<\/i>, 17 de janeiro de 2023<\/a>. São formas associadas às variedades brasileira e europeia.<\/p><p>O recurso <a href=\"https://estudoemcasaapoia.dge.mec.pt/index.php/recurso/lingua-portuguesa-no-mundo-0\" target=\"_blank\" rel=\"noopener\">«A língua portuguesa no mundo», DGE/#EstudoEmCasa<\/a>, propõe estudar variedades e crioulos. Aqui, os exemplos lexicais provêm do artigo identificado, não de uma transcrição do vídeo.<\/p><p>Não precisas de conhecer todas as variedades para fazer uma classificação: precisas de saber que informação sustenta a diferença observada.<\/p>"},{"t":"escolha","p":"Que diferença exemplifica o par «autocarro» e «ônibus»?","o":["Uma diferença lexical entre variedades nacionais.","Uma diferença de registo entre situações formais.","Uma diferença de época entre testemunhos escritos."],"c":0,"f":"«Autocarro» e «ônibus» documentam uma diferença lexical entre variedades nacionais. Confundir essa diferença com registo ou época exige dados que este par não fornece.","g":"m2-f15-4","fe":["«Autocarro» e «ônibus» documentam uma diferença lexical entre variedades nacionais. Confundir essa diferença com registo ou época exige dados que este par não fornece.","Confundes uma diferença entre variedades com a adequação à situação. Regressa à origem documentada de «autocarro» e «ônibus».","Confundes variação geográfica com mudança histórica. Confere as comunidades em que as duas formas apresentadas são usadas."]},{"t":"vf","p":"Dentro de uma variedade nacional podem coexistir diferenças regionais e sociais.","v":true,"f":"Uma variedade nacional contém diversidade interna. O lugar, os grupos e as situações não deixam de produzir diferenças dentro de um país.","g":"m2-f15-5","fe":"Tratas uma variedade nacional como um bloco sem diferenças internas. Relê, em «O essencial», a relação da variação geográfica com comunidades e lugares, que também existem dentro de um país."},{"t":"emparelhar","p":"Liga o tipo de comparação ao fenómeno em análise.","pares":[["Usos de comunidades em lugares diferentes","Variação geográfica"],["Usos documentados em épocas diferentes","Mudança histórica"],["Pedidos à mesma pessoa em situações diferentes","Mudança de registo"]],"f":"A classificação depende do eixo comparado. Um caso pode envolver vários eixos; é necessário indicar qual deles se está a observar.","g":"m2-f15-6","fe":"Trocas o eixo que muda em cada comparação. Relê, em «O essencial», as definições de variação geográfica, mudança histórica e registo, e pergunta o que muda: o lugar, o tempo ou a situação."},{"t":"ler","titulo":"Regressar à Farsa","rot":"Para entender","html":"<blockquote>«Señora, tengo-os servido<br>Y vos a mi despreciado;»<\/blockquote><p>Gil Vicente, <i>Farsa de Inês Pereira<\/i> (1523), fala do Ermitão, conforme a <a href=\"https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira\" target=\"_blank\" rel=\"noopener\">transcrição integral na Wikisource<\/a>. Conserva-se a forma do testemunho transcrito.<\/p><p>A presença de castelhano na peça não é um exemplo de português brasileiro. A distância histórica de uma grafia portuguesa e a presença de outra língua são problemas diferentes. Uma grafia, por si só, também não permite reconstruir toda a pronúncia.<\/p><p><strong>Modelo completo.<\/strong> O par «autocarro» e «ônibus» está documentado como diferença lexical entre variedades. A origem dos exemplos sustenta a classificação. A fala do Ermitão pede outra pergunta: não é uma variedade do português, é castelhano.<\/p>"},{"t":"sublinhar","p":"Que palavra transforma uma pista de uso numa certeza indevida sobre a nacionalidade?","frase":"Uma palavra revela sempre a nacionalidade de quem fala.","certas":[3],"f":"«Sempre» transforma uma pista possível numa certeza universal. As pessoas podem usar formas de várias origens e adaptar o vocabulário à situação.","g":"m2-f15-10","fe":"Escolhes uma palavra que não altera o alcance da afirmação. Relê a frase e procura o advérbio que torna universal uma pista que só às vezes se confirma."},{"t":"completar","p":"Completa a distinção.","frase":"Comparar lugares permite estudar a variação [1]; comparar épocas permite estudar a mudança [2].","lacunas":[{"o":["geográfica","cronológica","situacional"],"c":0},{"o":["histórica","geográfica","estilizada"],"c":0}],"f":"Os nomes identificam eixos de análise. Saber de onde e de quando vêm os testemunhos é parte da prova, não um detalhe acessório.","g":"m2-f15-8","fe":"Trocas o nome do eixo de lugar pelo do eixo de tempo. Relê a primeira frase de «O essencial» e associa cada eixo ao que se compara: comunidades e lugares, ou épocas."},{"t":"ordenar","p":"Ordena uma investigação de uma diferença linguística.","passos":["Registar as formas observadas","Identificar a origem e a data dos exemplos","Comparar o mesmo fenómeno em contexto","Classificar a diferença com uma justificação"],"f":"A classificação vem depois da identificação das fontes. A aparência de uma palavra não basta para atribuir nacionalidade a quem a usa.","g":"m2-f15-9","fe":"Classificas a diferença antes de saberes de onde e de quando vêm os exemplos. Relê o modelo completo: a classificação de «autocarro» e «ônibus» apoia-se na origem documentada dos exemplos."},{"t":"escolha","p":"Que informação ajuda a distinguir tempo e lugar?","o":["As datas e as comunidades dos exemplos comparados.","As comunidades e os registos dos exemplos comparados.","As datas e os registos de cada exemplo comparado."],"c":0,"f":"Para distinguir mudança no tempo e diferença entre comunidades, são necessárias datas e comunidades. Confundir registo com um desses eixos troca a situação de comunicação pela época ou pelo lugar.","g":"m2-f15-11","fe":["Para distinguir mudança no tempo e diferença entre comunidades, são necessárias datas e comunidades. Confundir registo com um desses eixos troca a situação de comunicação pela época ou pelo lugar.","Substituis a dimensão temporal pela adequação à situação. Regressa ao critério: comparar época e comunidade exige saber quando e onde.","Substituis a comunidade pelo grau de formalidade. Regressa ao critério: uma data não identifica o lugar de uso."]},{"t":"ler","titulo":"Adequação sem desvalorização","rot":"Compara","html":"<p>Pedidos criados para esta lição. A: Podes mandar-me a informação? B: Solicito o envio da informação.<\/p><p>A diferença pode relacionar-se com a situação e a relação entre as pessoas. Não permite concluir que uma delas é mais inteligente. Numa produção escolar, aplicas a norma pedida, distinguindo adequação de inferioridade linguística.<\/p><p>Contraexemplo à conclusão de que toda a diferença decorre do país: os dois pedidos criados podem ser feitos pela mesma pessoa em situações distintas. Critério: identifica o eixo que efetivamente mudou.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Mantém o assunto do pedido e compara a relação entre os interlocutores. Mudou o lugar, a época ou a situação comunicativa?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Relaciona a conclusão com o cuidado necessário.","pares":[["Uma palavra tem uso noutra variedade","Confirmar o uso numa fonte"],["Um pedido muda de formulação","Observar a situação comunicativa"],["Uma fala está noutra língua","Não a classificar como erro de português"]],"f":"Cada conclusão pede um tipo de informação. Os exemplos não servem para ordenar pessoas por valor, mas para descrever usos com precisão.","g":"m2-f15-14","fe":"Pedes a uma conclusão um cuidado que pertence a outra. Relê os pedidos A e B criados para esta lição e a fala do Ermitão: cada caso pede uma fonte, uma situação ou a identificação da língua."},{"t":"escolha","p":"Que alteração adapta o registo sem mudar o assunto?","o":["Reformular o mesmo pedido para uma entidade pública.","Reformular o pedido trocando a informação solicitada.","Reformular o pedido trocando a finalidade pretendida."],"c":0,"f":"A reformulação conserva a finalidade e adapta a relação comunicativa. As outras opções mudam o conteúdo e não isolam a diferença de registo.","g":"m2-f15-15","fe":["A reformulação conserva a finalidade e adapta a relação comunicativa. As outras opções mudam o conteúdo e não isolam a diferença de registo.","Mudas a informação pedida, não apenas o registo. Compara o assunto dos dois pedidos criados para esta lição.","Mudas a finalidade do pedido, não apenas a forma. Relê o que se pretende obter nas duas formulações."]},{"t":"completar","p":"Completa uma regra de análise.","frase":"A diferença precisa de [1]; a adequação depende da [2].","lacunas":[{"o":["contexto","correção","silêncio"],"c":0},{"o":["situação","pronúncia","população"],"c":0}],"f":"Contexto e situação permitem compreender a função das formas. Uma palavra diferente, isolada, não demonstra erro nem permite uma conclusão sobre a pessoa.","g":"m2-f15-16","fe":"Procuras a resposta na correção ou na pronúncia, e não no que rodeia a forma usada. Relê o contraexemplo: os dois pedidos podem ser feitos pela mesma pessoa em situações distintas."},{"t":"vf","p":"Uma língua crioula corresponde a uma variedade de português que precisa de correção.","v":false,"f":"Uma língua crioula tem estrutura própria. Descrevê-la como português defeituoso confunde sistemas linguísticos e desvaloriza injustificadamente os seus falantes.","g":"m2-f15-12","fe":"Tratas uma língua crioula como português com erros. Relê, em «O essencial», que uma língua crioula é uma língua com organização própria, não uma forma errada de português."},{"t":"ordenar","p":"Ordena a comparação que impede atribuir toda a diferença ao lugar.","passos":["Identificam-se as formas «autocarro» e «ônibus»","A fonte situa os usos em variedades nacionais","A comparação dos pedidos introduz outro eixo","A classificação distingue geografia e situação"],"f":"A origem documentada das palavras sustenta a comparação entre variedades. Uma escolha lexical não identifica a nacionalidade de uma pessoa, e a fala do Ermitão, em castelhano, não é uma variedade de português.","g":"m2-f15-17","fe":"Introduzes o eixo da situação antes de documentar a diferença entre variedades. Relê o modelo completo e o contraexemplo: primeiro «autocarro» e «ônibus» com a sua fonte, depois os dois pedidos."},{"t":"escolha","p":"Que conclusão respeita os exemplos estudados?","o":["A diferença lexical está documentada entre variedades.","A diferença lexical identifica a nacionalidade pessoal.","A diferença lexical distingue por si só registos formais."],"c":0,"f":"Os exemplos mostram diversidade dentro da língua. A mudança histórica e a variação geográfica continuam a ser dimensões distintas.","g":"m2-f15-18","fe":["Os exemplos mostram diversidade dentro da língua. A mudança histórica e a variação geográfica continuam a ser dimensões distintas.","Transformas o uso de uma palavra numa identificação pessoal. Regressa à diferença entre comunidade de uso e nacionalidade de quem fala.","Transformas diferença lexical em oposição de formalidade. Regressa aos contextos documentados de «autocarro» e «ônibus»."]},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Que diferenças pertencem ao lugar, ao tempo ou a outra língua?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
