<div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 2<br>Unidade 1</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação da lição"><a href="../#m2-f14">Esta lição no percurso</a><a href="../licao-m2-f16/">Lição anterior</a><a href="../licao-m2-f07/">Continuar o percurso</a></nav><p class="c-menu-extra">As citações têm crédito junto ao texto. Os exemplos criados estão identificados. O progresso fica neste aparelho.</p></div></div>

window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m2-f14",CARTOES=[{"t":"ler","titulo":"As palavras também julgam","rot":"Abre","html":"<p class=\"abre\">Chamar alguém por uma palavra pode fazer mais do que identificá-lo. Pode revelar uma expectativa, uma hierarquia ou um desprezo.<\/p><p>Vais observar a formação de uma palavra e o valor que recebe na fala de Inês.<\/p>"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>A <strong>derivação<\/strong> forma palavras a partir de uma base e de afixos. Os sufixos diminutivos podem exprimir dimensão, afeto ou depreciação, conforme o contexto.<\/p><p>A <strong>flexão<\/strong> produz formas da mesma palavra, por exemplo no plural. Identificar um sufixo não basta: é necessário explicar o efeito da escolha lexical na cena.<\/p>"},{"t":"ler","titulo":"Antes de conhecer","rot":"Lê e confronta","html":"<blockquote>«Deve ser um vilãozinho<br>Ei-lo, se vem penteando:<br>Será com algum ancinho?»<\/blockquote><p>Gil Vicente, <i>Farsa de Inês Pereira<\/i> (1523), fala de Inês antes da entrada de Pêro Marques, transcrição da Wikisource. «Ancinho» é um instrumento agrícola. A comparação associa antecipadamente a figura aos trabalhos rurais.<\/p><p><a href=\"https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira\" target=\"_blank\" rel=\"noopener\">Lê a fala e a entrada de Pêro Marques no texto integral<\/a>. Inês ainda está a imaginar o pretendente: a nomeação revela o seu próprio olhar.<\/p>"},{"t":"escolha","p":"Que leitura explica vilãozinho neste contexto?","o":["Marca uma avaliação depreciativa do pretendente.","Fornece uma medição objetiva da sua altura física.","Confirma uma manifestação inequívoca de ternura."],"c":0,"f":"A associação ao ancinho e a antecipação da figura apoiam a depreciação. O sufixo sozinho não autorizaria concluir qual é o valor afetivo.","g":"m2-f14-3"},{"t":"vf","p":"Todos os diminutivos exprimem obrigatoriamente carinho.","v":false,"f":"O valor depende da situação e das palavras que rodeiam o diminutivo. Neste contexto, a imagem do ancinho contribui para uma avaliação depreciativa.","g":"m2-f14-4"},{"t":"emparelhar","p":"Liga cada operação à descrição correta.","pares":[["vilão → vilãozinho","Derivação por sufixação"],["vilão → vilões","Flexão em número"],["ancinho no retrato imaginado","Associação ao universo rural"]],"f":"A primeira operação forma uma palavra derivada; a segunda produz o plural. A terceira já pertence à construção do retrato e ao seu efeito.","g":"m2-f14-5"},{"t":"ler","titulo":"O retrato revela dois lados","rot":"Lê e confronta","html":"<p>Inês antecipa uma figura que considera pouco desejável. A fala caracteriza indiretamente o seu sistema de preferências: valoriza uma imagem de distinção e desvaloriza uma imagem rural.<\/p><p>Não é necessário adotar esse juízo para o analisar. A personagem nomeada e a personagem que nomeia são ambas objeto da leitura.<\/p>"},{"t":"completar","p":"Completa a análise.","frase":"O sufixo participa na [1] da palavra; o contexto esclarece a [2] de Inês.","lacunas":[{"o":["formação","pronúncia","contagem"],"c":0},{"o":["avaliação","profissão","formação"],"c":0}],"f":"A formação é uma observação linguística. A avaliação exige relacionar essa observação com a comparação e com as expectativas da personagem.","g":"m2-f14-7"},{"t":"ordenar","p":"Ordena a passagem da forma ao efeito.","passos":["Identificar a base e o sufixo","Ler a comparação que acompanha a palavra","Interpretar a avaliação do pretendente","Relacionar essa avaliação com o olhar de Inês"],"f":"O processo evita tratar o sufixo como um rótulo de sentido fixo. A conclusão sobre a personagem resulta do encontro entre forma e contexto.","g":"m2-f14-8"},{"t":"sublinhar","p":"Seleciona a palavra que introduz uma expectativa ainda não confirmada.","frase":"Deve ser um vilãozinho","certas":[0],"f":"Deve apresenta uma suposição de Inês. Não se trata de uma descrição neutra feita depois de conhecer todos os comportamentos do pretendente.","g":"m2-f14-9"},{"t":"escolha","p":"Que distinção se deve conservar na interpretação?","o":["O juízo de Inês difere de um retrato neutro.","O juízo de Inês equivale a uma prova neutra.","O juízo de Inês elimina qualquer outro olhar."],"c":0,"f":"A fala pertence a uma personagem com preferências. O desenvolvimento da cena pode confirmar, complicar ou contrariar a antecipação que ela constrói.","g":"m2-f14-10"},{"t":"vf","p":"Retirar o diminutivo apagaria necessariamente toda a depreciação do recorte.","v":false,"f":"A comparação com o ancinho também participa na avaliação. Um efeito pode resultar de várias escolhas, e não apenas de uma palavra.","g":"m2-f14-11"},{"t":"ler","titulo":"A mesma forma, outros efeitos","rot":"Lê e confronta","html":"<p>Exemplos didáticos criados: A: «Guardei a casinha de madeira da maqueta.» B: «A nossa casinha acolheu toda a família.» C: «É só uma casinha, não merece atenção.»<\/p><p>A dimensão, o afeto e a depreciação podem sobrepor-se. Nas atividades seguintes, escolhe o valor tornado mais saliente pelo contexto apresentado.<\/p>"},{"t":"emparelhar","p":"Relaciona cada contexto criado com o valor mais saliente.","pares":[["Casa numa maqueta","Dimensão reduzida"],["Casa que acolhe a família","Relação afetiva"],["Casa declarada sem valor","Avaliação depreciativa"]],"f":"Os exemplos orientam uma leitura contextual, sem estabelecer um significado obrigatório para todos os usos futuros da mesma palavra.","g":"m2-f14-13"},{"t":"escolha","p":"Que alteração reduz mais diretamente o juízo sobre Pêro?","o":["Trocar a antecipação por uma descrição observável.","Intensificar a comparação com instrumentos rurais.","Acrescentar outro diminutivo de valor depreciativo."],"c":0,"f":"Uma descrição observável pode limitar a avaliação antecipada. As outras decisões reforçam precisamente o mecanismo de desvalorização estudado.","g":"m2-f14-14"},{"t":"completar","p":"Completa a diferença.","frase":"A derivação cria uma palavra [1]; a flexão produz uma forma [2].","lacunas":[{"o":["derivada","alterada","corrigida"],"c":0},{"o":["gramatical","derivacional","avaliativa"],"c":0}],"f":"A distinção é morfológica: formação de palavras e variação gramatical não são a mesma operação, embora ambas possam ser observadas no discurso.","g":"m2-f14-15"},{"t":"ordenar","p":"Prepara uma explicação de quatro passos.","passos":["Citar a palavra em análise","Identificar o processo de formação","Apresentar uma pista do contexto","Explicar o que a escolha revela de Inês"],"f":"Uma resposta completa liga estrutura, prova e efeito. Dizer apenas diminutivo deixaria por explicar a função da escolha na cena.","g":"m2-f14-16"},{"t":"escolha","p":"Que conclusão evita adotar o preconceito da personagem?","o":["Inês associa o universo rural à falta de distinção.","O universo rural prova sempre a falta de inteligência.","A fala demonstra que o pretendente não tem valor."],"c":0,"f":"A primeira frase atribui a avaliação a Inês. As outras convertem o olhar da personagem numa regra geral ou numa desvalorização assumida pela análise.","g":"m2-f14-17"},{"t":"vf","p":"Uma palavra que nomeia alguém pode também caracterizar quem a escolhe.","v":true,"f":"A escolha lexical revela valores, expectativas ou relações. Por isso, a análise pode estudar simultaneamente o retrato construído e o olhar de quem o constrói.","g":"m2-f14-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Uma palavra pode nomear uma pessoa e revelar o olhar de outra.<\/p><p>Identifica a formação de «vilãozinho», apresenta uma pista contextual e explica a avaliação de Inês sem a transformar na tua.<\/p>"}];
