window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m2-f14",CARTOES=[{"t":"ler","titulo":"As palavras também julgam","rot":"Abre","html":"<p class=\"abre\"><strong>Como pode uma palavra caracterizar quem é nomeado e quem a usa?<\/strong><\/p><p class=\"abre\">Chamar alguém por uma palavra pode fazer mais do que identificá-lo. Pode revelar uma expectativa, uma hierarquia ou um desprezo.<\/p><p>Vais observar a formação de uma palavra e o valor que recebe na fala de Inês.<\/p>"},{"t":"vf","p":"Antes de reler. Recupera a cena de Lianor Vaz: a reação de uma personagem e a apresentação da cena são necessariamente equivalentes?","v":false,"f":"Confundir a reação de uma personagem com um retrato neutro elimina a perspetiva. Relê a resposta da Mãe ao relato de Lianor e distingue o que a personagem avalia do que a cena mostra.","g":"m2-f14-1","fe":"Tomas a reação de uma personagem pelo modo como a cena apresenta os factos. Regressa à resposta da Mãe ao relato de Lianor e distingue o que a personagem avalia do que a cena mostra."},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>A <strong>derivação<\/strong> forma palavras a partir de uma base e de afixos. Os sufixos diminutivos podem exprimir dimensão, afeto ou depreciação, conforme o contexto.<\/p><p>A <strong>flexão<\/strong> produz formas da mesma palavra, por exemplo no plural. Identificar um sufixo não basta: é necessário explicar o efeito da escolha lexical na cena.<\/p>"},{"t":"ler","titulo":"Antes de conhecer","rot":"Lê de perto","html":"<blockquote>«Deve ser um vilãozinho<br>Ei-lo, se vem penteando:<br>Será com algum ancinho?»<\/blockquote><p>Gil Vicente, <i>Farsa de Inês Pereira<\/i> (1523), fala de Inês antes da entrada de Pêro Marques, transcrição da Wikisource. «Ancinho» é um instrumento agrícola. A comparação associa antecipadamente a figura aos trabalhos rurais.<\/p><p><a href=\"https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira\" target=\"_blank\" rel=\"noopener\">Lê a fala e a entrada de Pêro Marques no texto integral<\/a>. Inês ainda está a imaginar o pretendente: a nomeação revela o seu próprio olhar.<\/p>"},{"t":"sublinhar","p":"Que palavra distingue a antecipação de Inês de uma descrição feita depois de conhecer o pretendente?","frase":"Deve ser um vilãozinho","certas":[0],"f":"«Deve» apresenta uma suposição de Inês. Não se trata de uma descrição neutra feita depois de conhecer todos os comportamentos do pretendente.","g":"m2-f14-10","fe":"Escolhes a palavra que avalia o pretendente, e não a que mostra que Inês ainda supõe. Relê «Deve ser um vilãozinho» e procura o verbo que marca uma suposição."},{"t":"escolha","p":"Que leitura explica «vilãozinho» neste contexto?","o":["Apresenta o pretendente de modo depreciativo.","Apresenta o pretendente como figura de baixa estatura.","Apresenta o pretendente com familiaridade afetuosa."],"c":0,"f":"A associação ao ancinho e a antecipação da figura apoiam a depreciação. O sufixo sozinho não autorizaria concluir qual é o valor afetivo.","g":"m2-f14-4","fe":["A associação ao ancinho e a antecipação da figura apoiam a depreciação. O sufixo sozinho não autorizaria concluir qual é o valor afetivo.","Confundes diminutivo depreciativo com dimensão física. Relê a comparação com o ancinho no retrato imaginado por Inês.","Atribuis afeto onde o contexto constrói desvalorização. Relê a associação ao universo rural na antecipação do pretendente."]},{"t":"emparelhar","p":"Liga cada operação à descrição correta.","pares":[["vilão → vilãozinho","Derivação por sufixação"],["vilão → vilões","Flexão em número"],["ancinho no retrato imaginado","Associação ao universo rural"]],"f":"«Vilão → vilãozinho» forma uma palavra derivada; «vilão → vilões» produz o plural. O ancinho no retrato imaginado já pertence à construção do retrato e ao seu efeito.","g":"m2-f14-6","fe":"Confundes a formação de uma palavra nova com a variação da mesma palavra. Relê, em «O essencial», a diferença entre derivação por afixos e flexão, por exemplo no plural."},{"t":"vf","p":"O valor de um diminutivo depende da relação que o contexto constrói entre as palavras.","v":true,"f":"O valor depende da situação e das palavras que rodeiam o diminutivo. Neste contexto, a imagem do ancinho contribui para uma avaliação depreciativa.","g":"m2-f14-5","fe":"Atribuis ao diminutivo um valor fixo, independente das palavras à volta. Relê os três exemplos criados para esta lição: a mesma «casinha» muda de valor conforme o contexto."},{"t":"ler","titulo":"O retrato revela dois lados","rot":"Para entender","html":"<p>Inês antecipa uma figura que considera pouco desejável. A fala caracteriza indiretamente o seu sistema de preferências: valoriza uma imagem de distinção e desvaloriza uma imagem rural.<\/p><p>Não é necessário adotar esse juízo para o analisar. A personagem nomeada e a personagem que nomeia são ambas objeto da leitura.<\/p><p><strong>Modelo completo.<\/strong> A base «vilão» recebe um sufixo diminutivo. A comparação com o ancinho apoia uma avaliação depreciativa. O valor não vem do sufixo isolado: depende da expectativa construída por Inês.<\/p>"},{"t":"completar","p":"Completa a análise.","frase":"O sufixo participa na [1] da palavra; o contexto esclarece a [2] de Inês.","lacunas":[{"o":["formação","pronúncia","contagem"],"c":0},{"o":["avaliação","profissão","formação"],"c":0}],"f":"A formação é uma observação linguística. A avaliação exige relacionar essa observação com a comparação e com as expectativas da personagem.","g":"m2-f14-8","fe":"Trocas a observação sobre a forma da palavra pela avaliação que ela recebe. Relê o modelo completo: a base «vilão» recebe um sufixo, e a comparação com o ancinho apoia a avaliação de Inês."},{"t":"escolha","p":"Que distinção se deve conservar na interpretação?","o":["O juízo de Inês exprime um olhar sobre Pêro.","O juízo de Inês confirma o caráter da figura.","O juízo de Inês demonstra a origem da figura."],"c":0,"f":"A fala pertence a uma personagem com preferências. O desenvolvimento da cena pode confirmar, complicar ou contrariar a antecipação que ela constrói.","g":"m2-f14-11","fe":["A fala pertence a uma personagem com preferências. O desenvolvimento da cena pode confirmar, complicar ou contrariar a antecipação que ela constrói.","Transformas uma antecipação em confirmação do caráter. Relê «deve»: Inês formula o juízo antes da entrada de Pêro.","Transformas um indício lexical em prova da origem. Relê a forma como Inês imagina o pretendente sem o observar."]},{"t":"ordenar","p":"Ordena a passagem da forma ao efeito.","passos":["Identificar a base e o sufixo","Ler a comparação que acompanha a palavra","Interpretar a avaliação do pretendente","Relacionar essa avaliação com o olhar de Inês"],"f":"O processo evita tratar o sufixo como um rótulo de sentido fixo. A conclusão sobre a personagem resulta do encontro entre forma e contexto.","g":"m2-f14-9","fe":"Interpretas a avaliação antes de identificar a forma e a comparação que a sustentam. Relê o modelo completo, que vai da base e do sufixo ao ancinho e só depois à expectativa de Inês."},{"t":"ler","titulo":"A mesma forma, outros efeitos","rot":"Compara","html":"<p>Exemplos criados para esta lição.<\/p><ul><li><b>A:<\/b> Guardei a casinha de madeira da maqueta.<\/li><li><b>B:<\/b> A nossa casinha acolheu toda a família.<\/li><li><b>C:<\/b> É só uma casinha, não merece atenção.<\/li><\/ul><p>A dimensão, o afeto e a depreciação podem sobrepor-se. Nas atividades seguintes, escolhe o valor tornado mais saliente pelo contexto apresentado.<\/p><p>Contraexemplo à regra de que um diminutivo deprecia: no exemplo da casa que acolhe a família, o contexto torna saliente o afeto. Critério: a classificação tem de explicar as palavras que acompanham o diminutivo.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>No segundo caso, conserva a mesma palavra e observa o que muda na relação com a casa. Dimensão e avaliação são a mesma informação?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Relaciona cada contexto criado com o valor mais saliente.","pares":[["Casa numa maqueta","Dimensão reduzida"],["Casa que acolhe a família","Relação afetiva"],["Casa declarada sem valor","Avaliação depreciativa"]],"f":"Os exemplos orientam uma leitura contextual, sem estabelecer um significado obrigatório para todos os usos futuros da mesma palavra.","g":"m2-f14-14","fe":"Dás a todos os usos de «casinha» o mesmo valor. Relê os três exemplos criados para esta lição e procura, em cada um, as palavras que tornam saliente a dimensão, o afeto ou a depreciação."},{"t":"vf","p":"Mesmo sem o diminutivo, a comparação com o ancinho conservaria uma marca de depreciação.","v":true,"f":"A comparação com o ancinho também participa na avaliação. Um efeito pode resultar de várias escolhas, e não apenas de uma palavra.","g":"m2-f14-12","fe":"Pensas que a depreciação vem só do diminutivo. Relê «Será com algum ancinho?» e repara que a comparação associa a figura aos trabalhos rurais."},{"t":"escolha","p":"Que alteração reduz mais diretamente o juízo sobre Pêro?","o":["Trocar a antecipação por uma descrição observável.","Intensificar a comparação com instrumentos rurais.","Acrescentar outro diminutivo de valor depreciativo."],"c":0,"f":"Uma descrição observável pode limitar a avaliação antecipada. As outras decisões reforçam precisamente o mecanismo de desvalorização estudado.","g":"m2-f14-15","fe":["Uma descrição observável pode limitar a avaliação antecipada. As outras decisões reforçam precisamente o mecanismo de desvalorização estudado.","Intensificas o recurso que participa na depreciação. Regressa à comparação com o ancinho e observa quem a formula.","Acrescentas outra avaliação em vez de a reduzir. Relê a distinção entre observação e antecipação no retrato de Inês."]},{"t":"completar","p":"Completa a diferença.","frase":"A derivação cria uma palavra [1]; a flexão produz uma forma [2].","lacunas":[{"o":["derivada","alterada","corrigida"],"c":0},{"o":["gramatical","derivacional","avaliativa"],"c":0}],"f":"A distinção é morfológica: formação de palavras e variação gramatical não são a mesma operação, embora ambas possam ser observadas no discurso.","g":"m2-f14-16","fe":"Confundes o resultado da derivação com o da flexão. Relê, em «O essencial», que a derivação forma palavras e que a flexão produz formas da mesma palavra."},{"t":"escolha","p":"Que conclusão evita adotar o preconceito da personagem?","o":["Inês associa o universo rural à falta de distinção.","A narração confirma a inferioridade da origem rural.","O sufixo descreve a pequena dimensão do pretendente."],"c":0,"f":"Dizer que Inês associa o universo rural à falta de distinção atribui-lhe a avaliação. Falar de inferioridade confirmada pela narração ou de pequena dimensão converte o olhar da personagem numa regra geral ou numa desvalorização assumida pela análise.","g":"m2-f14-18","fe":["Dizer que Inês associa o universo rural à falta de distinção atribui-lhe a avaliação. Falar de inferioridade confirmada pela narração ou de pequena dimensão converte o olhar da personagem numa regra geral ou numa desvalorização assumida pela análise.","Atribuis à narração o preconceito de uma personagem. Relê a fala e vê quem antecipa o retrato e quem associa o mundo rural à falta de distinção.","Tomas o sufixo como medida física e apagas o contexto. Regressa à comparação com o ancinho e ao juízo antecipado."]},{"t":"ordenar","p":"Ordena a relação entre a expectativa, a forma da palavra e o olhar de Inês.","passos":["Inês imagina o pretendente antes da entrada","O diminutivo participa na sua avaliação","O ancinho reforça a associação ao universo rural","A escolha lexical também caracteriza quem a faz"],"f":"A antecipação e a comparação com o ancinho contextualizam o diminutivo. A análise atribui a depreciação a Inês, sem a tomar como retrato neutro de Pêro.","g":"m2-f14-17","fe":"Começas pela conclusão sobre quem fala antes da situação que a origina. Relê a fala de Inês e a nota que a acompanha: ela imagina o pretendente antes da entrada de Pêro Marques."},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Como pode uma palavra caracterizar quem é nomeado e quem a usa?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
