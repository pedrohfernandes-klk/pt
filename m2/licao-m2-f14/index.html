<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m2-f14",CARTOES=[{"t":"ler","titulo":"As palavras também julgam","rot":"Abre","html":"<p class=\"abre\">Como pode uma palavra caracterizar quem é nomeado e quem a usa?<\/p><p class=\"abre\">Chamar alguém por uma palavra pode fazer mais do que identificá-lo. Pode revelar uma expectativa, uma hierarquia ou um desprezo.<\/p><p>Vais observar a formação de uma palavra e o valor que recebe na fala de Inês.<\/p><figure class=\"fig documento\"><a href=\"../../img/fontes/gil-vicente-copilacam-1562.jpg\" aria-label=\"Abrir a imagem inteira\"><img src=\"../../img/fontes/gil-vicente-copilacam-1562.jpg\" alt=\"Página de título com as armas reais portuguesas e a indicação da impressão em Lisboa, em 1562.\"><\/a><figcaption><p>A compilação das obras de Gil Vicente foi impressa em Lisboa em 1562.<\/p><details><summary>Créditos e fonte da imagem<\/summary><table><caption>Identificação do documento visual<\/caption><tr><th scope=\"row\">Autor<\/th><td>Gil Vicente; impressão de João Álvares; reprodução de Victorcouto<\/td><\/tr><tr><th scope=\"row\">Obra<\/th><td><i>Copilacam de todalas obras de Gil Vicente<\/i>, página de título<\/td><\/tr><tr><th scope=\"row\">Data<\/th><td>1562<\/td><\/tr><tr><th scope=\"row\">Instituição ou acervo<\/th><td>Wikimedia Commons. Coleção do exemplar não indicada na fonte da reprodução.<\/td><\/tr><tr><th scope=\"row\">Licença<\/th><td><a href=\"https://commons.wikimedia.org/wiki/File:Imagem160_Gil_Vicente._Compila%C3%A7am_de_todalas_obras._Joam_Alvarez_impressor._Lisboa,_1562.jpg\">Domínio público<\/a><\/td><\/tr><\/table><p><a href=\"https://commons.wikimedia.org/wiki/File:Imagem160_Gil_Vicente._Compila%C3%A7am_de_todalas_obras._Joam_Alvarez_impressor._Lisboa,_1562.jpg\">Consultar a fonte e os direitos<\/a>. Reprodução redimensionada, sem recorte.<\/p><\/details><\/figcaption><\/figure>"},{"t":"vf","p":"Antes de reler. Recupera o retrato antecipado de Pêro Marques: o juízo de Inês e a apresentação da personagem são necessariamente equivalentes?","v":false,"f":"Confundir a avaliação de Inês com um retrato neutro elimina a perspetiva. Relê a antecipação da entrada de Pêro e distingue o que Inês imagina do que a cena mostra. Relê essa distinção na lição anterior depois de tentares responder.","g":"m2-f14-1"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>A <strong>derivação<\/strong> forma palavras a partir de uma base e de afixos. Os sufixos diminutivos podem exprimir dimensão, afeto ou depreciação, conforme o contexto.<\/p><p>A <strong>flexão<\/strong> produz formas da mesma palavra, por exemplo no plural. Identificar um sufixo não basta: é necessário explicar o efeito da escolha lexical na cena.<\/p>"},{"t":"ler","titulo":"Antes de conhecer","rot":"Lê e confronta","html":"<blockquote>«Deve ser um vilãozinho<br>Ei-lo, se vem penteando:<br>Será com algum ancinho?»<\/blockquote><p>Gil Vicente, <i>Farsa de Inês Pereira<\/i> (1523), fala de Inês antes da entrada de Pêro Marques, transcrição da Wikisource. «Ancinho» é um instrumento agrícola. A comparação associa antecipadamente a figura aos trabalhos rurais.<\/p><p><a href=\"https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira\" target=\"_blank\" rel=\"noopener\">Lê a fala e a entrada de Pêro Marques no texto integral<\/a>. Inês ainda está a imaginar o pretendente: a nomeação revela o seu próprio olhar.<\/p>"},{"t":"escolha","p":"Que leitura explica vilãozinho neste contexto?","o":["Apresenta o pretendente de modo depreciativo.","Apresenta o pretendente como figura de baixa estatura.","Apresenta o pretendente com familiaridade afetuosa."],"c":0,"f":"A associação ao ancinho e a antecipação da figura apoiam a depreciação. O sufixo sozinho não autorizaria concluir qual é o valor afetivo. Relê o cartão «Antes de conhecer» e confronta a pista com a tua resposta.","g":"m2-f14-4"},{"t":"vf","p":"Todos os diminutivos exprimem obrigatoriamente carinho.","v":false,"f":"O valor depende da situação e das palavras que rodeiam o diminutivo. Neste contexto, a imagem do ancinho contribui para uma avaliação depreciativa. Relê o cartão «Antes de conhecer» e confronta a pista com a tua resposta.","g":"m2-f14-5"},{"t":"emparelhar","p":"Liga cada operação à descrição correta.","pares":[["vilão → vilãozinho","Derivação por sufixação"],["vilão → vilões","Flexão em número"],["ancinho no retrato imaginado","Associação ao universo rural"]],"f":"A primeira operação forma uma palavra derivada; a segunda produz o plural. A terceira já pertence à construção do retrato e ao seu efeito. Relê o cartão «Antes de conhecer» e confronta a pista com a tua resposta.","g":"m2-f14-6"},{"t":"ler","titulo":"O retrato revela dois lados","rot":"Lê e confronta","html":"<p>Inês antecipa uma figura que considera pouco desejável. A fala caracteriza indiretamente o seu sistema de preferências: valoriza uma imagem de distinção e desvaloriza uma imagem rural.<\/p><p>Não é necessário adotar esse juízo para o analisar. A personagem nomeada e a personagem que nomeia são ambas objeto da leitura.<\/p><p><strong>Modelo completo.<\/strong> A base vilão recebe um sufixo diminutivo. A comparação com o ancinho apoia uma avaliação depreciativa. O valor não vem do sufixo isolado: depende da expectativa construída por Inês.<\/p>"},{"t":"completar","p":"Completa a análise.","frase":"O sufixo participa na [1] da palavra; o contexto esclarece a [2] de Inês.","lacunas":[{"o":["formação","pronúncia","contagem"],"c":0},{"o":["avaliação","profissão","formação"],"c":0}],"f":"A formação é uma observação linguística. A avaliação exige relacionar essa observação com a comparação e com as expectativas da personagem. Relê o cartão «O retrato revela dois lados» e confronta a pista com a tua resposta.","g":"m2-f14-8"},{"t":"ordenar","p":"Ordena a passagem da forma ao efeito.","passos":["Identificar a base e o sufixo","Ler a comparação que acompanha a palavra","Interpretar a avaliação do pretendente","Relacionar essa avaliação com o olhar de Inês"],"f":"O processo evita tratar o sufixo como um rótulo de sentido fixo. A conclusão sobre a personagem resulta do encontro entre forma e contexto. Relê o cartão «O retrato revela dois lados» e confronta a pista com a tua resposta.","g":"m2-f14-9"},{"t":"sublinhar","p":"Que palavra distingue a antecipação de Inês de uma descrição feita depois de conhecer o pretendente?","frase":"Deve ser um vilãozinho","certas":[0],"f":"Deve apresenta uma suposição de Inês. Não se trata de uma descrição neutra feita depois de conhecer todos os comportamentos do pretendente. Relê o cartão «O retrato revela dois lados» e confronta a pista com a tua resposta.","g":"m2-f14-10"},{"t":"escolha","p":"Que distinção se deve conservar na interpretação?","o":["O juízo de Inês exprime um olhar sobre Pêro.","O juízo de Inês confirma o caráter da figura.","O juízo de Inês demonstra a origem da figura."],"c":0,"f":"A fala pertence a uma personagem com preferências. O desenvolvimento da cena pode confirmar, complicar ou contrariar a antecipação que ela constrói. Relê o cartão «O retrato revela dois lados» e confronta a pista com a tua resposta.","g":"m2-f14-11"},{"t":"vf","p":"Retirar o diminutivo apagaria necessariamente toda a depreciação do recorte.","v":false,"f":"A comparação com o ancinho também participa na avaliação. Um efeito pode resultar de várias escolhas, e não apenas de uma palavra. Relê o cartão «O retrato revela dois lados» e confronta a pista com a tua resposta.","g":"m2-f14-12"},{"t":"ler","titulo":"A mesma forma, outros efeitos","rot":"Lê e confronta","html":"<p>Exemplos didáticos criados: A: «Guardei a casinha de madeira da maqueta.» B: «A nossa casinha acolheu toda a família.» C: «É só uma casinha, não merece atenção.»<\/p><p>A dimensão, o afeto e a depreciação podem sobrepor-se. Nas atividades seguintes, escolhe o valor tornado mais saliente pelo contexto apresentado.<\/p><p>Contraexemplo à regra de que um diminutivo deprecia: no exemplo da casa que acolhe a família, o contexto torna saliente o afeto. Critério: a classificação tem de explicar as palavras que acompanham o diminutivo.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>No segundo caso, conserva a mesma palavra e observa o que muda na relação com a casa. Dimensão e avaliação são a mesma informação?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Relaciona cada contexto criado com o valor mais saliente.","pares":[["Casa numa maqueta","Dimensão reduzida"],["Casa que acolhe a família","Relação afetiva"],["Casa declarada sem valor","Avaliação depreciativa"]],"f":"Os exemplos orientam uma leitura contextual, sem estabelecer um significado obrigatório para todos os usos futuros da mesma palavra. Relê o cartão «A mesma forma, outros efeitos» e confronta a pista com a tua resposta.","g":"m2-f14-14"},{"t":"escolha","p":"Que alteração reduz mais diretamente o juízo sobre Pêro?","o":["Trocar a antecipação por uma descrição observável.","Intensificar a comparação com instrumentos rurais.","Acrescentar outro diminutivo de valor depreciativo."],"c":0,"f":"Uma descrição observável pode limitar a avaliação antecipada. As outras decisões reforçam precisamente o mecanismo de desvalorização estudado. Relê o cartão «A mesma forma, outros efeitos» e confronta a pista com a tua resposta.","g":"m2-f14-15"},{"t":"completar","p":"Completa a diferença.","frase":"A derivação cria uma palavra [1]; a flexão produz uma forma [2].","lacunas":[{"o":["derivada","alterada","corrigida"],"c":0},{"o":["gramatical","derivacional","avaliativa"],"c":0}],"f":"A distinção é morfológica: formação de palavras e variação gramatical não são a mesma operação, embora ambas possam ser observadas no discurso. Relê o cartão «A mesma forma, outros efeitos» e confronta a pista com a tua resposta.","g":"m2-f14-16"},{"t":"ordenar","p":"Ordena a relação entre a expectativa, a forma da palavra e o olhar de Inês.","passos":["Inês imagina o pretendente antes da entrada","O diminutivo participa na sua avaliação","O ancinho reforça a associação ao universo rural","A escolha lexical também caracteriza quem a faz"],"f":"A sequência liga os pormenores à interpretação e conserva o seu limite. Relê o modelo e o contraexemplo: No segundo caso, conserva a mesma palavra e observa o que muda na relação com a casa. Dimensão e avaliação são a mesma informação? Relê o cartão «A mesma forma, outros efeitos» e confronta a pista com a tua resposta.","g":"m2-f14-17"},{"t":"escolha","p":"Que conclusão evita adotar o preconceito da personagem?","o":["Inês associa o universo rural à falta de distinção.","A narração confirma a inferioridade da origem rural.","O sufixo descreve a pequena dimensão do pretendente."],"c":0,"f":"A primeira frase atribui a avaliação a Inês. As outras convertem o olhar da personagem numa regra geral ou numa desvalorização assumida pela análise. Relê o cartão «A mesma forma, outros efeitos» e confronta a pista com a tua resposta.","g":"m2-f14-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Como pode uma palavra caracterizar quem é nomeado e quem a usa?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
