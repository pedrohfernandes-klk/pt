<script>

boas maneiras."],["No fim, Inês…",["fica sozinha","casa com Pêro Marques e engana-o","entra num convento","volta para o Escudeiro"],1,"Viúva, casa com o «asno» que a leva."]]},{"t":"O cómico","q":[["O cómico de linguagem nasce…",["da forma de falar das personagens","das situações ridículas","dos defeitos de carácter","do cenário"],0,"Ex.: a fala rústica de Pêro Marques."],["O cómico de situação nasce…",["do vocabulário","de acontecimentos ou cenas ridículas","da rima","da música"],1,"Ex.: Pêro Marques leva Inês às costas."],["O cómico de carácter nasce…",["dos traços exagerados de uma personagem","dos erros de ortografia","do tempo da ação","da luz"],0,"Ex.: a vaidade do Escudeiro."],["Pêro Marques a carregar Inês às costas é sobretudo cómico de…",["linguagem","situação","carácter","nenhum"],1,"A cena é ridícula em si."],["A ironia da Farsa está em que…",["Inês consegue, com o «asno», a liberdade que não teve com o «cavalo»","o Escudeiro se torna bom marido","Inês nunca casa","a mãe decide tudo"],0,"O mote cumpre-se de forma irónica."],["Verdadeiro ou falso: o riso, em Gil Vicente, serve para criticar.",["Verdadeiro","Falso"],0,"A farsa ri de tipos sociais (o Escudeiro, Pêro Marques) para mostrar os seus defeitos."]]},{"t":"Formação de palavras","q":[["«infeliz» formou-se por…",["sufixação","prefixação","composição","parassíntese"],1,"in- + feliz."],["«felicidade» formou-se por…",["sufixação","prefixação","composição","truncação"],0,"feliz + -idade."],["«entristecer» formou-se por…",["parassíntese","prefixação só","sufixação só","composição"],0,"en- + triste + -ecer, ao mesmo tempo."],["«o voo» (de voar) formou-se por…",["derivação não afixal","composição","prefixação","sigla"],0,"Nome formado a partir do verbo, sem afixo."],["«guarda-chuva» é…",["composição morfossintática","composição morfológica","derivação","amálgama"],0,"Junta duas palavras («guarda» + «chuva») numa só unidade. O hífen sozinho não prova nada: «disse-lhe» também o tem e não é palavra composta."],["«hidroelétrico» é…",["composição morfológica","composição morfossintática","sufixação","truncação"],0,"Radicais ligados (hidro + elétrico)."]]},{"t":"Variação do português","q":[["«comboio» (Portugal) e «trem» (Brasil) mostram variação…",["geográfica","histórica","social","situacional"],0,"Variantes de países diferentes."],["A mesma pessoa falar de forma diferente com amigos e numa entrevista é variação…",["geográfica","situacional (registo)","histórica","etimológica"],1,"Registo formal e informal."],["O galego-português das cantigas mostra variação…",["histórica","social","geográfica","situacional"],0,"A língua muda com o tempo."],["O português é língua oficial em…",["só Portugal e Brasil","vários países de quatro continentes","só na Europa","só em África"],1,"Portugal, Brasil, Angola, Moçambique, Cabo Verde, Guiné-Bissau, São Tomé e Príncipe, Timor-Leste, Guiné Equatorial."],["Na Farsa, a fala de Pêro Marques distingue-se por…",["marcas de um falar rústico","ser em latim","ser em castelhano","ser em verso livre"],0,"Variação social e regional."],["«autocarro» (PT) corresponde no Brasil a…",["ônibus","bonde","trem","metrô"],0,"Variação geográfica do léxico."]]}], CHAVE="epi-pt-quiz-"+ID, $=function(s){return document.querySelector(s)}, atual=-1;

function abrirQuiz(i){atual=i;var z=D[i];$("#titulo-q").textContent=(i+1)+". "+z.t;var f=$("#form");f.innerHTML="";z.q.forEach(function(q,k){var d=document.createElement("div");d.className="q";var p=document.createElement("p");p.textContent=(k+1)+". "+q[0];d.appendChild(p);q[1].forEach(function(o,j){var l=document.createElement("label");l.className="op";var r=document.createElement("input");r.type="radio";r.name="q"+k;r.value=j;l.appendChild(r);l.appendChild(document.createTextNode(" "+o));d.appendChild(l)});var ex=document.createElement("div");ex.className="exp";ex.hidden=true;d.appendChild(ex);f.appendChild(d)});$("#resultado").hidden=true;$("#repetir").hidden=true;$("#corrigir").hidden=false;mostrar("quiz")}
