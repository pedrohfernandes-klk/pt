<div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 2<br>Unidade 1</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação da lição"><a href="../#m2-f16">Esta lição no percurso</a><a href="../licao-m2-f02/">Lição anterior</a><a href="../licao-m2-f14/">Continuar o percurso</a></nav><p class="c-menu-extra">As citações têm crédito junto ao texto. Os exemplos criados estão identificados. O progresso fica neste aparelho.</p></div></div>

<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m2-f16",CARTOES=[{"t":"ler","titulo":"O riso muda de alvo","rot":"Abre","html":"<p class=\"abre\">Duas pessoas podem rir da mesma cena e estar a rir de coisas diferentes. Como descobres o alvo da crítica?<\/p><p>A entrada de Lianor Vaz inclui o relato de uma agressão. Não tens de a representar nem de partilhar experiências pessoais. Vais analisar as palavras e as respostas das personagens.<\/p>"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>O <strong>cómico de linguagem<\/strong> pode explorar duplos sentidos; o <strong>cómico de situação<\/strong> nasce das relações em cena. A <strong>sátira<\/strong> dirige a crítica a comportamentos e posições sociais.<\/p><p>É necessário distinguir a pessoa que fala, a pessoa visada e o comportamento exposto. Uma reação de uma personagem não equivale automaticamente à posição da obra.<\/p>"},{"t":"ler","titulo":"Um relato e uma resposta","rot":"Lê e confronta","html":"<blockquote>«Lianor: E hum clérigo, mana minha,<br>Pardeos, lançou mão de mi;<br>Não me podia valer»<\/blockquote><blockquote>«Mãe: Hui! seria algum muchacho,<br>Que brincava por prazer?»<\/blockquote><p>Gil Vicente, <i>Farsa de Inês Pereira<\/i> (1523), entrada de Lianor Vaz, texto integral na Wikisource. Identificam-se as falantes; conserva-se a grafia da transcrição nos versos. «Clérigo» designa um membro do clero; «muchacho», um rapaz.<\/p><p><a href=\"https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira\" target=\"_blank\" rel=\"noopener\">Lê a cena completa no texto integral<\/a>. A resposta da Mãe reformula como brincadeira aquilo que Lianor apresenta como uma ação de que não conseguia defender-se.<\/p>"},{"t":"escolha","p":"Que contraste se observa entre o relato e a resposta?","o":["A resposta atenua a gravidade da ação relatada.","A resposta confirma todos os detalhes relatados.","A resposta impede qualquer interpretação da ação."],"c":0,"f":"Lianor refere uma ação de que não conseguia defender-se. A Mãe apresenta a hipótese de uma brincadeira, deslocando a forma de a nomear.","g":"m2-f16-3"},{"t":"vf","p":"A resposta da Mãe prova que a ação relatada foi uma brincadeira.","v":false,"f":"A fala é a interpretação de uma personagem. Não se transforma em prova do acontecimento só por aparecer no diálogo.","g":"m2-f16-4"},{"t":"emparelhar","p":"Distingue as funções dos três elementos.","pares":[["Lianor Vaz","Pessoa que relata a ação"],["O clérigo referido","Figura visada no relato"],["A resposta da Mãe","Reação que atenua a gravidade"]],"f":"Atribuir cada fala e cada ação evita fundir todas as posições numa só. O diálogo contém perspetivas que podem entrar em tensão.","g":"m2-f16-5"},{"t":"ler","titulo":"Uma palavra com dois sentidos","rot":"Lê e confronta","html":"<blockquote>«Mãe: Mana, conhecia-te ele?<br>Lianor: Mas queria-me conhecer!»<\/blockquote><p>Na mesma cena, «conhecer» permite passar do reconhecimento de alguém para uma insinuação sexual. O efeito depende da pergunta, da resposta e do relato anterior.<\/p><p>A análise do duplo sentido não exige rir da pessoa que relata a agressão. É possível investigar a hipocrisia atribuída ao clérigo e a forma como uma resposta desvaloriza o relato.<\/p>"},{"t":"completar","p":"Completa a leitura do diálogo.","frase":"O duplo sentido depende do [1]; a crítica exige identificar o [2].","lacunas":[{"o":["contexto","alfabeto","tamanho"],"c":0},{"o":["alvo da crítica","tema da conversa","tom do discurso"],"c":0}],"f":"A palavra isolada não produz toda a interpretação. O contexto permite reconhecer a insinuação e discutir a quem se dirige a crítica.","g":"m2-f16-7"},{"t":"ordenar","p":"Ordena uma análise responsável do cómico.","passos":["Atribuir a pergunta e a resposta","Identificar os sentidos da palavra","Relacionar o contraste com o relato","Explicar o comportamento que fica exposto"],"f":"A análise parte da atribuição e chega ao efeito. Não usa uma classificação de cómico para dispensar a compreensão do que acontece.","g":"m2-f16-8"},{"t":"sublinhar","p":"Seleciona a palavra que opõe a resposta à pergunta.","frase":"Mas queria-me conhecer!","certas":[0],"f":"Mas introduz uma correção da perspetiva. A resposta conserva o verbo, mas desloca o sentido que a pergunta parecia atribuir-lhe.","g":"m2-f16-9"},{"t":"escolha","p":"Que comentário interpreta o duplo sentido sem o apagar?","o":["Conhecer muda de sentido entre as falas.","Conhecer conserva só o sentido de reconhecer.","Conhecer deixa de ter relação com o contexto."],"c":0,"f":"A repetição lexical esconde uma mudança de sentido. É essa deslocação, apoiada pelo contexto, que permite analisar o cómico de linguagem.","g":"m2-f16-10"},{"t":"vf","p":"Identificar cómico de linguagem basta para explicar o alvo da crítica.","v":false,"f":"A classificação nomeia um mecanismo. Ainda falta explicar a relação com o clérigo referido, as respostas e as posições construídas na cena.","g":"m2-f16-11"},{"t":"ler","titulo":"Muda a reação, muda a cena","rot":"Lê e confronta","html":"<p>Reações didáticas criadas a um relato: A: «Isso não tem importância.» B: «Percebo que não conseguiste defender-te.»<\/p><p>Não são falas de Gil Vicente. Servem para testar como a resposta de quem escuta pode minimizar uma ação ou reconhecer o que foi relatado. Alterar essa resposta transforma a relação em cena.<\/p>"},{"t":"emparelhar","p":"Liga cada procedimento ao seu efeito.","pares":[["Atenuar a ação relatada","Diminuir a gravidade reconhecida"],["Repetir um verbo com outro sentido","Construir uma ambiguidade"],["Atribuir cada posição à sua falante","Evitar uma conclusão indevida"]],"f":"As operações não são equivalentes. Uma descreve a reação, outra o mecanismo verbal e outra o cuidado necessário na interpretação.","g":"m2-f16-13"},{"t":"escolha","p":"Que decisão de encenação torna a reação da Mãe mais visível?","o":["Criar uma pausa após a resposta que atenua.","Eliminar a resposta e conservar só o relato.","Acrescentar uma fala alheia sem a identificar."],"c":0,"f":"Uma pausa pode dar atenção à resposta e ao seu efeito. A decisão deve ser apresentada como proposta de encenação, não como indicação original.","g":"m2-f16-14"},{"t":"completar","p":"Completa uma conclusão prudente.","frase":"A fala de uma personagem exprime uma [1]; a interpretação precisa de outra [2].","lacunas":[{"o":["posição","certeza","sentença"],"c":0},{"o":["prova","verso","ritmo"],"c":0}],"f":"Uma posição em diálogo não vale por toda a obra. Para sustentar uma interpretação, relaciona-a com outras marcas da cena.","g":"m2-f16-15"},{"t":"ordenar","p":"Planeia uma comparação entre duas cenas satíricas.","passos":["Identificar quem fala em cada cena","Localizar o comportamento visado","Explicar o mecanismo cómico de cada uma","Comparar os efeitos sem confundir os alvos"],"f":"Comparar apenas a presença de humor seria insuficiente. O alvo e o mecanismo podem mudar, mesmo quando ambas as cenas fazem parte de uma farsa.","g":"m2-f16-16"},{"t":"escolha","p":"Que pergunta aprofunda a leitura sem julgar a vítima?","o":["Como transforma a resposta a gravidade do relato?","Como prova o riso que a ação foi sempre inocente?","Como confirma toda a cena que o relato é uma mentira?"],"c":0,"f":"A primeira pergunta observa uma relação textual. As outras pressupõem conclusões que não foram demonstradas e apagam a distinção entre relato e reação.","g":"m2-f16-17"},{"t":"vf","p":"Uma leitura atual pode discutir o efeito de uma resposta sem fingir que a cena foi escrita hoje.","v":true,"f":"Contextualizar e interpretar não são operações incompatíveis. É possível reconhecer a distância histórica e analisar os efeitos das palavras na relação entre personagens.","g":"m2-f16-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">O mecanismo do riso e o alvo da crítica não são a mesma coisa.<\/p><p>Explica o duplo sentido, atribui as falas e indica o comportamento que a cena permite discutir. Não confundas a reação de uma personagem com uma prova.<\/p>"}];
