window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m2-f16",CARTOES=[{"t":"ler","titulo":"O riso muda de alvo","rot":"Abre","html":"<p class=\"abre\"><strong>Como distinguir quem fala, quem é ridicularizado e o que se critica?<\/strong><\/p><p class=\"abre\">Duas pessoas podem rir da mesma cena e estar a rir de coisas diferentes. Como descobres o alvo da crítica?<\/p><p>Na entrada de Lianor Vaz, vais comparar o relato de uma personagem com a reação da Mãe.<\/p>"},{"t":"vf","p":"Antes de reler. Recupera a leitura dramática: a posição expressa por uma personagem equivale à posição de todas as vozes da obra?","v":false,"f":"Confundir uma fala com a posição da obra apaga o confronto dramático. Relê o diálogo da F02 e atribui cada avaliação à personagem que a exprime.","g":"m2-f16-1","fe":"Confundes a fala de uma personagem com a posição de toda a obra. Regressa ao diálogo da F02 e atribui cada avaliação à personagem que a exprime."},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>O <strong>cómico de linguagem<\/strong> pode explorar duplos sentidos; o <strong>cómico de situação<\/strong> nasce das relações em cena. A <strong>sátira<\/strong> dirige a crítica a comportamentos e posições sociais.<\/p><p>É necessário distinguir a pessoa que fala, a pessoa visada e o comportamento exposto. Uma reação de uma personagem não equivale automaticamente à posição da obra.<\/p>"},{"t":"ler","titulo":"Um relato e uma resposta","rot":"Lê de perto","html":"<p>Lianor:<\/p><blockquote>«E hum clérigo, mana minha,<br>Pardeos, lançou mão de mi;<br>Não me podia valer»<\/blockquote><p>Mãe:<\/p><blockquote>«Hui! seria algum muchacho,<br>Que brincava por prazer?»<\/blockquote><p>Gil Vicente, <i>Farsa de Inês Pereira<\/i> (1523), entrada de Lianor Vaz, texto integral na Wikisource. Identificam-se as falantes; conserva-se a grafia da transcrição nos versos. «Clérigo» designa um membro do clero; «muchacho», um rapaz.<\/p><p><a href=\"https://pt.wikisource.org/wiki/Farsa_de_In%C3%AAs_Pereira\" target=\"_blank\" rel=\"noopener\">Lê a cena completa no texto integral<\/a>. A resposta da Mãe reformula como brincadeira aquilo que Lianor apresenta como uma ação de que não conseguia defender-se.<\/p>"},{"t":"escolha","p":"Que contraste se observa entre o relato e a resposta?","o":["A resposta atenua a gravidade da ação relatada.","A resposta confirma a intenção do autor da ação.","A resposta contesta a ocorrência da ação relatada."],"c":0,"f":"Lianor refere uma ação de que não conseguia defender-se. A Mãe apresenta a hipótese de uma brincadeira, deslocando a forma de a nomear.","g":"m2-f16-4","fe":["Lianor refere uma ação de que não conseguia defender-se. A Mãe apresenta a hipótese de uma brincadeira, deslocando a forma de a nomear.","Confundes a reação da Mãe com prova de uma intenção. Relê a hipótese que ela apresenta perante o relato de Lianor.","Confundes desvalorizar o relato com negar que a ação aconteceu. Regressa à palavra «brincava» na resposta da Mãe."]},{"t":"vf","p":"A hipótese da Mãe é a explicação que a cena dá para o que aconteceu a Lianor.","v":false,"f":"A fala é a interpretação de uma personagem. Não se transforma em prova do acontecimento só por aparecer no diálogo.","g":"m2-f16-5","fe":"Tomas a suposição de uma personagem pelo que a cena mostra. Relê «seria algum muchacho»: a Mãe formula uma hipótese perante o relato de Lianor."},{"t":"emparelhar","p":"Distingue as funções dos três elementos.","pares":[["Lianor Vaz","Pessoa que relata a ação"],["O clérigo referido","Figura visada no relato"],["A resposta da Mãe","Reação que atenua a gravidade"]],"f":"Atribuir cada fala e cada ação evita fundir todas as posições numa só. O diálogo contém perspetivas que podem entrar em tensão.","g":"m2-f16-6","fe":"Confundes quem relata, quem é referido e quem reage. Relê as duas falas da entrada de Lianor Vaz e atribui cada uma à sua falante antes de ligar o clérigo ao relato."},{"t":"ler","titulo":"Uma palavra com dois sentidos","rot":"Para entender","html":"<p>Mãe:<\/p><blockquote>«Mana, conhecia-te ele?»<\/blockquote><p>Lianor:<\/p><blockquote>«Mas queria-me conhecer!»<\/blockquote><p>Na mesma cena, «conhecer» permite passar do reconhecimento de alguém para uma insinuação sexual. O efeito depende da pergunta, da resposta e do relato anterior.<\/p><p>Compara a pergunta da Mãe com a resposta de Lianor: a repetição do verbo mantém ou altera a perspetiva de quem escuta?<\/p><p><strong>Modelo completo.<\/strong> Lianor apresenta uma ação de que não conseguia defender-se. A Mãe reformula-a como brincadeira. A diferença permite analisar uma minimização, sem converter essa resposta em prova do acontecimento.<\/p>"},{"t":"sublinhar","p":"Que palavra marca a mudança de perspetiva entre a pergunta e a resposta?","frase":"Mas queria-me conhecer!","certas":[0],"f":"«Mas» introduz uma correção da perspetiva. A resposta conserva o verbo, mas desloca o sentido que a pergunta parecia atribuir-lhe.","g":"m2-f16-10","fe":"Escolhes o verbo repetido, e não a palavra que corrige a perspetiva da pergunta. Relê «Mas queria-me conhecer!» ao lado de «Mana, conhecia-te ele?» e procura a conjunção com que Lianor contraria a pergunta."},{"t":"escolha","p":"Que comentário interpreta o duplo sentido sem o apagar?","o":["«Conhecer» muda de sentido nas duas falas.","«Conhecer» exprime a mesma ação nas duas falas.","«Conhecer» indica duas ações de reconhecimento."],"c":0,"f":"A repetição lexical esconde uma mudança de sentido. É essa deslocação, apoiada pelo contexto, que permite analisar o cómico de linguagem.","g":"m2-f16-11","fe":["A repetição lexical esconde uma mudança de sentido. É essa deslocação, apoiada pelo contexto, que permite analisar o cómico de linguagem.","Apagas a mudança de sentido produzida pela resposta. Relê «conhecia-te» em relação a «queria-me conhecer».","Reduzes as duas falas ao reconhecimento de alguém. Regressa à resposta de Lianor e à relação que ela estabelece com a pergunta."]},{"t":"completar","p":"Completa a leitura do diálogo.","frase":"O duplo sentido depende do [1]; a crítica exige identificar o [2].","lacunas":[{"o":["contexto","alfabeto","tamanho"],"c":0},{"o":["alvo da crítica","tema da conversa","tom do discurso"],"c":0}],"f":"A palavra isolada não produz toda a interpretação. O contexto permite reconhecer a insinuação e discutir a quem se dirige a crítica.","g":"m2-f16-8","fe":"Procuras o duplo sentido na palavra isolada, e não no que a rodeia. Relê, em «Para entender», que o efeito de «conhecer» depende da pergunta, da resposta e do relato anterior."},{"t":"ordenar","p":"Ordena uma análise responsável do cómico.","passos":["Atribuir a pergunta e a resposta","Identificar os sentidos da palavra","Relacionar o contraste com o relato","Explicar o comportamento que fica exposto"],"f":"A análise parte da atribuição e chega ao efeito. Não usa uma classificação de cómico para dispensar a compreensão do que acontece.","g":"m2-f16-9","fe":"Classificas o cómico antes de saberes quem pergunta e quem responde. Relê a troca «Mana, conhecia-te ele?» e «Mas queria-me conhecer!» e atribui primeiro cada fala."},{"t":"ler","titulo":"Muda a reação, muda a cena","rot":"Compara","html":"<p>Reações criadas para esta lição, perante um relato. A: Isso não tem importância. B: Percebo que não conseguiste defender-te.<\/p><p>Não são falas de Gil Vicente. Servem para testar como a resposta de quem escuta pode minimizar uma ação ou reconhecer o que foi relatado. Alterar essa resposta transforma a relação em cena.<\/p><p>Contraexemplo à ideia de que a palavra «conhecer» conserva o mesmo sentido: a resposta desloca o verbo para uma insinuação. Critério: o sentido deve explicar a relação entre pergunta, resposta e relato anterior.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Compara a consequência das duas respostas criadas para quem relata. Que mudança reconhece a dificuldade, em vez de a reduzir?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Liga cada procedimento ao seu efeito.","pares":[["Atenuar a ação relatada","Diminuir a gravidade reconhecida"],["Repetir um verbo com outro sentido","Construir uma ambiguidade"],["Atribuir cada posição à sua falante","Evitar uma conclusão indevida"]],"f":"As operações não são equivalentes. Uma descreve a reação, outra o mecanismo verbal e outra o cuidado necessário na interpretação.","g":"m2-f16-14","fe":"Confundes o que descreve a reação, o mecanismo verbal e o cuidado da interpretação. Relê o modelo completo: a minimização, a mudança de sentido e a recusa de tomar a resposta como prova."},{"t":"vf","p":"Explicar o cómico exige relacionar a mudança de sentido com o relato e com a reação da Mãe.","v":true,"f":"A mudança de sentido de «conhecer» só se explica na relação com o relato de Lianor, com a reação da Mãe e com o clérigo referido. Nomear o mecanismo cómico, sozinho, não identifica o alvo da crítica.","g":"m2-f16-12","fe":"Pensas que nomear o cómico de linguagem basta para o explicar. Relê o relato de Lianor e a resposta da Mãe antes da troca sobre «conhecer»: o sentido depende dessa relação."},{"t":"completar","p":"Completa uma conclusão prudente.","frase":"A fala de uma personagem exprime uma [1]; a interpretação precisa de outra [2].","lacunas":[{"o":["posição","certeza","sentença"],"c":0},{"o":["prova","verso","ritmo"],"c":0}],"f":"Uma posição em diálogo não vale por toda a obra. Para sustentar uma interpretação, relaciona-a com outras marcas da cena.","g":"m2-f16-16","fe":"Tomas a fala de uma personagem por uma certeza da obra. Relê, em «O essencial», que a reação de uma personagem não equivale automaticamente à posição da obra."},{"t":"escolha","p":"Que decisão de encenação torna a reação da Mãe mais visível?","o":["Pausar depois da resposta que atenua.","Criar uma pausa antes do relato de Lianor.","Criar uma pausa após a pergunta de Inês."],"c":0,"f":"A pausa após a resposta dá tempo para considerar a atenuação acabada de ouvir. Deslocá-la para outro momento muda o foco; esta é uma decisão de encenação, não uma indicação original.","g":"m2-f16-15","fe":["A pausa após a resposta dá tempo para considerar a atenuação acabada de ouvir. Deslocá-la para outro momento muda o foco; esta é uma decisão de encenação, não uma indicação original.","Deslocas a atenção para o momento anterior ao relato. Regressa ao objetivo da proposta: destacar a reação que desvaloriza o que foi contado.","Deslocas a pausa para outra intervenção. Relê a resposta da Mãe que se pretende tornar mais visível na encenação."]},{"t":"escolha","p":"Que pergunta aprofunda a relação entre relato e reação?","o":["Como altera a resposta o peso desse relato?","Como confirma a resposta a intenção do clérigo?","Como revela a resposta a invenção do incidente?"],"c":0,"f":"Perguntar como a resposta altera o peso do relato observa uma relação textual. Perguntar pela intenção do clérigo ou pela invenção do incidente pressupõe conclusões que não foram demonstradas e apaga a distinção entre relato e reação.","g":"m2-f16-18","fe":["Perguntar como a resposta altera o peso do relato observa uma relação textual. Perguntar pela intenção do clérigo ou pela invenção do incidente pressupõe conclusões que não foram demonstradas e apaga a distinção entre relato e reação.","Transformas a reação em prova da intenção do clérigo. Regressa ao contraste entre as palavras do relato e a hipótese da Mãe.","Transformas a reação em prova de invenção. Relê o que a Mãe responde, distinguindo desvalorização de demonstração sobre o acontecimento."]},{"t":"ordenar","p":"Ordena a relação entre relato, reação e deslocação do sentido.","passos":["Lianor relata uma ação de que não se podia defender","A Mãe responde com uma hipótese que a atenua","A repetição de «conhecer» desloca o sentido do verbo","A interpretação distingue mecanismo cómico e alvo crítico"],"f":"A resposta da Mãe reduz a gravidade do que Lianor relata. A mudança de sentido do verbo precisa de ser interpretada nessa relação entre as falas, sem a tomar como prova do acontecimento.","g":"m2-f16-17","fe":"Trocas a ordem entre o relato, a reação e a troca sobre «conhecer». Relê as duas trocas da cena pela ordem em que surgem e só depois decide onde entra a distinção entre mecanismo e alvo."},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Como distinguir quem fala, quem é ridicularizado e o que se critica?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
