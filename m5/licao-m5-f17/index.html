<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m5-f17",CARTOES=[{"t":"ler","titulo":"A carta que não chegou","rot":"Abre","html":"<p class=\"abre\">Que muda quando descobres quem impediu uma mensagem de chegar?<\/p><p class=\"abre\">Uma carta fica sem resposta. Isso prova indiferença? Talvez falte saber se chegou ao destinatário.<\/p><p>Vais observar como uma informação revelada mais tarde altera a leitura de um silêncio em <i>Amor de Perdição<\/i>.<\/p><figure class=\"fig documento\"><a href=\"../../img/fontes/camilo-1882.jpg\" aria-label=\"Abrir a imagem inteira\"><img src=\"../../img/fontes/camilo-1882.jpg\" alt=\"Fotografia de Camilo Castelo Branco sentado, com óculos e bigode.\"><\/a><figcaption><p>Camilo Castelo Branco, fotografado em 1882. O retrato identifica o autor, não a personagem de Simão.<\/p><details><summary>Créditos e fonte da imagem<\/summary><table><caption>Identificação do documento visual<\/caption><tr><th scope=\"row\">Autor<\/th><td>União, Photographia da Casa Real, Porto<\/td><\/tr><tr><th scope=\"row\">Obra<\/th><td>Retrato de Camilo Castelo Branco<\/td><\/tr><tr><th scope=\"row\">Data<\/th><td>7 de março de 1882<\/td><\/tr><tr><th scope=\"row\">Instituição ou acervo<\/th><td>Wikimedia Commons. Coleção original não indicada.<\/td><\/tr><tr><th scope=\"row\">Licença<\/th><td><a href=\"https://commons.wikimedia.org/wiki/File:Camilo_Castelo_Branco_(1882)_-_Uni%C3%A3o_%E2%80%93_Photographia_da_Casa_Real-Porto.png\">Domínio público<\/a><\/td><\/tr><\/table><p><a href=\"https://commons.wikimedia.org/wiki/File:Camilo_Castelo_Branco_(1882)_-_Uni%C3%A3o_%E2%80%93_Photographia_da_Casa_Real-Porto.png\">Consultar a fonte e os direitos<\/a>. Reprodução redimensionada, sem recorte.<\/p><\/details><\/figcaption><\/figure>"},{"t":"vf","p":"Antes de reler. Recupera a leitura das cartas no romance: o que uma personagem escreve e o que o destinatário chega a saber são necessariamente iguais?","v":false,"f":"Confundir intenção comunicativa e receção elimina os obstáculos do contacto. Relê a situação das cartas na F04 e distingue quem escreve, a quem se dirige e o que fica conhecido. Relê essa distinção na lição anterior depois de tentares responder.","g":"m5-f17-1"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>Na comunicação, é necessário distinguir <strong>emissor<\/strong>, <strong>destinatário<\/strong>, <strong>mensagem<\/strong> e <strong>canal<\/strong>. Uma interferência pode impedir o contacto sem que o destinatário o saiba.<\/p><p>A narração pode revelar depois uma informação desconhecida pelas personagens. O leitor revê então uma interpretação anterior: a ordem de contar também produz conhecimento.<\/p>"},{"t":"ler","titulo":"A descoberta posterior","rot":"Lê e confronta","html":"<blockquote class=\"prosa\">«Escrevia a mãe a Simão, e não recebia resposta. Pensava ela que o filho não respondia: anos depois, vimos entre os papéis de meu pai todas as cartas que ela escrevera. Já se vê que o pai as fazia tirar no correio.»<\/blockquote><p>Camilo Castelo Branco, <i>Amor de Perdição<\/i>, capítulo XII, edição de Ivo Castro, Lisboa, Imprensa Nacional, 2020, p. 120. A passagem pertence à memória familiar atribuída à irmã de Simão. O texto de Camilo está em domínio público.<\/p><p><a href=\"https://imprensanacional.pt/wp-content/uploads/2022/03/Amor-Perdicao.pdf\" target=\"_blank\" rel=\"noopener\">Consulta a edição integral da Imprensa Nacional<\/a>. Procura o capítulo XII e a página impressa 120. O recorte não é uma carta de Teresa: trata das cartas da mãe para Simão.<\/p>"},{"t":"escolha","p":"Que informação altera a explicação do silêncio?","o":["O pai retirava as cartas no correio.","A mãe retirava as suas cartas no correio.","Simão retirava as cartas no correio."],"c":0,"f":"A descoberta das cartas revela uma interferência no canal. A falta de resposta deixa de poder ser atribuída automaticamente a uma decisão de Simão. Relê o cartão «A descoberta posterior» e confronta a pista com a tua resposta.","g":"m5-f17-4"},{"t":"vf","p":"Não receber resposta prova que o destinatário leu e recusou a mensagem.","v":false,"f":"A ausência de resposta é um resultado com várias explicações possíveis. Neste recorte, a interceção impede concluir que Simão recebeu as cartas. Relê o cartão «A descoberta posterior» e confronta a pista com a tua resposta.","g":"m5-f17-5"},{"t":"emparelhar","p":"Relaciona cada elemento com a sua função.","pares":[["A mãe que escreve","Emissora das mensagens"],["Simão","Destinatário pretendido"],["Interceção no correio","Interferência no canal"]],"f":"O destinatário pretendido não é necessariamente quem recebe materialmente a mensagem. A interceção altera o percurso sem mudar a intenção da emissora. Relê o cartão «A descoberta posterior» e confronta a pista com a tua resposta.","g":"m5-f17-6"},{"t":"ler","titulo":"Quem sabe o quê","rot":"Lê e confronta","html":"<p>A mãe interpreta a ausência de resposta sem conhecer a interceção. A recordação posterior fornece ao leitor uma informação que ela não tinha naquele momento.<\/p><p>Essa diferença permite rever uma conclusão. Não significa que o recorte revele todos os pensamentos de Simão ou todas as razões do pai. A explicação comprovada deve manter o seu alcance.<\/p><p><strong>Modelo completo.<\/strong> A mãe observa a ausência de resposta e atribui-a ao filho. A descoberta posterior das cartas revela a interceção. A nova prova modifica a explicação do silêncio sem revelar todos os sentimentos de Simão.<\/p>"},{"t":"completar","p":"Completa a distinção.","frase":"A falta de resposta é uma [1]; a indiferença seria uma [2].","lacunas":[{"o":["observação","justificação","confirmação"],"c":0},{"o":["inferência","ocorrência","confirmação"],"c":0}],"f":"Uma observação pode admitir explicações diferentes. A inferência sobre sentimentos exige provas que a ausência de resposta, sozinha, não fornece. Relê o cartão «Quem sabe o quê» e confronta a pista com a tua resposta.","g":"m5-f17-8"},{"t":"ordenar","p":"Reconstrói a sequência dos acontecimentos referidos.","passos":["A mãe escreve a Simão","As cartas são retiradas no correio","A mãe não recebe resposta","Anos depois, as cartas são encontradas"],"f":"A narração menciona primeiro o resultado e só depois explica a interceção. Reconstruir os acontecimentos distingue ordem temporal e ordem de revelação. Relê o cartão «Quem sabe o quê» e confronta a pista com a tua resposta.","g":"m5-f17-9"},{"t":"sublinhar","p":"Que duas palavras mostram que a prova surgiu depois da interpretação inicial da mãe?","frase":"anos depois, vimos entre os papéis de meu pai todas as cartas","certas":[0,1],"f":"Anos depois situa o momento em que surge a prova. O intervalo é decisivo para perceber que a mãe não dispunha dessa informação quando interpretava o silêncio. Relê o cartão «Quem sabe o quê» e confronta a pista com a tua resposta.","g":"m5-f17-10"},{"t":"escolha","p":"Que efeito produz revelar a interceção mais tarde?","o":["Obriga a rever a interpretação do silêncio.","Reforça a interpretação inicial do silêncio.","Esclarece a intenção de Simão no silêncio."],"c":0,"f":"A nova informação muda a explicação do que já tinha sido contado. Esse efeito depende da distribuição do conhecimento ao longo da narrativa. Relê o cartão «Quem sabe o quê» e confronta a pista com a tua resposta.","g":"m5-f17-11"},{"t":"vf","p":"O recorte permite afirmar com certeza todos os sentimentos de Simão perante estas cartas.","v":false,"f":"O texto explica o bloqueio das mensagens. Não apresenta uma reação de Simão à leitura dessas cartas nem permite inventar o que ele teria sentido. Relê o cartão «Quem sabe o quê» e confronta a pista com a tua resposta.","g":"m5-f17-12"},{"t":"ler","titulo":"Mudar a ordem de contar","rot":"Lê e confronta","html":"<p>Resumo didático A: a mãe escreve, não recebe resposta e só depois se descobre a interceção. Resumo didático B: anuncia-se primeiro a interceção e conta-se depois a falta de resposta.<\/p><p>Os acontecimentos podem ser os mesmos. Em B, o leitor sabe antecipadamente aquilo que a mãe ignora; em A, a explicação posterior obriga a uma revisão.<\/p><p>Contraexemplo à regra de que silêncio significa rejeição: estas cartas são retiradas antes de chegar ao destinatário. Critério: a inferência sobre a reação exige confirmar primeiro a receção.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Nos dois resumos, separa a ordem dos acontecimentos da ordem em que o leitor conhece a interceção. Que versão permite antecipar o engano da mãe?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Distingue três planos.","pares":[["O que aconteceu às cartas","Percurso material da mensagem"],["O que a mãe pensava","Interpretação da personagem"],["Quando o leitor descobre o bloqueio","Organização da informação narrativa"]],"f":"Separar os planos permite explicar o efeito da ordem. Uma alteração na narração não exige uma alteração dos acontecimentos narrados. Relê o cartão «Mudar a ordem de contar» e confronta a pista com a tua resposta.","g":"m5-f17-14"},{"t":"escolha","p":"Que reescrita conserva os factos e muda a informação?","o":["Contar a interceção antes da espera da mãe.","Contar a recusa de Simão antes da espera da mãe.","Contar a desistência da mãe antes da interceção."],"c":0,"f":"A primeira proposta reorganiza os mesmos factos. As outras mudam os acontecimentos e não servem para isolar o efeito da ordem narrativa. Relê o cartão «Mudar a ordem de contar» e confronta a pista com a tua resposta.","g":"m5-f17-15"},{"t":"completar","p":"Completa uma regra de leitura.","frase":"A nova prova permite [1] a explicação, sem autorizar [2] sentimentos.","lacunas":[{"o":["rever","fixar","negar"],"c":0},{"o":["inventar","observar","comparar"],"c":0}],"f":"A revisão corrige o que era apenas uma hipótese. Não preenche todas as lacunas da história nem transforma possibilidades em estados interiores comprovados. Relê o cartão «Mudar a ordem de contar» e confronta a pista com a tua resposta.","g":"m5-f17-16"},{"t":"ordenar","p":"Ordena os acontecimentos e a mudança de conhecimento, sem inventar uma reação de Simão.","passos":["A mãe escreve e espera resposta","O pai interfere no percurso das cartas","A mãe atribui o silêncio ao filho","A descoberta posterior permite rever essa atribuição"],"f":"A sequência liga os pormenores à interpretação e conserva o seu limite. Relê o modelo e o contraexemplo: Nos dois resumos, separa a ordem dos acontecimentos da ordem em que o leitor conhece a interceção. Que versão permite antecipar o engano da mãe? Relê o cartão «Mudar a ordem de contar» e confronta a pista com a tua resposta.","g":"m5-f17-17"},{"t":"escolha","p":"Que conclusão se apoia no recorte?","o":["O controlo das cartas afeta a relação familiar.","A ausência de resposta confirma a rejeição de Simão.","A descoberta das cartas confirma que Simão as leu."],"c":0,"f":"A interceção limita o contacto e produz uma interpretação enganada. O texto não transforma o silêncio numa regra geral nem afirma conhecimento igual para todos. Relê o cartão «Mudar a ordem de contar» e confronta a pista com a tua resposta.","g":"m5-f17-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Que muda quando descobres quem impediu uma mensagem de chegar?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
