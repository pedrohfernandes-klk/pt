<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m5-f17",CARTOES=[{"t":"ler","titulo":"A carta que não chegou","rot":"Abre","html":"<figure class=\"fig documento\"><a href=\"../../img/fontes/camilo-1882.jpg\" aria-label=\"Abrir a imagem inteira\"><img src=\"../../img/fontes/camilo-1882.jpg\" alt=\"Fotografia de Camilo Castelo Branco sentado, com óculos e bigode.\"><\/a><figcaption><p>Camilo Castelo Branco em 1882. O retrato mostra o autor, não Simão.<\/p><p>Domínio público; <a href=\"https://commons.wikimedia.org/wiki/File:Camilo_Castelo_Branco_(1882)_-_Uni%C3%A3o_%E2%80%93_Photographia_da_Casa_Real-Porto.png\">Fonte ↗<\/a><\/p><details><summary>Créditos e fonte da imagem<\/summary><table><caption>Identificação do documento visual<\/caption><tr><th scope=\"row\">Autor<\/th><td>União, Photographia da Casa Real, Porto<\/td><\/tr><tr><th scope=\"row\">Obra<\/th><td>Retrato de Camilo Castelo Branco<\/td><\/tr><tr><th scope=\"row\">Data<\/th><td>7 de março de 1882<\/td><\/tr><tr><th scope=\"row\">Instituição ou acervo<\/th><td>Wikimedia Commons. Coleção original não indicada.<\/td><\/tr><tr><th scope=\"row\">Licença<\/th><td><a href=\"https://commons.wikimedia.org/wiki/File:Camilo_Castelo_Branco_(1882)_-_Uni%C3%A3o_%E2%80%93_Photographia_da_Casa_Real-Porto.png\">Domínio público<\/a><\/td><\/tr><\/table><p><a href=\"https://commons.wikimedia.org/wiki/File:Camilo_Castelo_Branco_(1882)_-_Uni%C3%A3o_%E2%80%93_Photographia_da_Casa_Real-Porto.png\">Consultar a fonte e os direitos ↗<\/a>. Reprodução redimensionada, sem recorte.<\/p><\/details><\/figcaption><\/figure><p class=\"abre\"><strong>Que muda quando descobres quem impediu uma mensagem de chegar?<\/strong><\/p><p class=\"abre\">Uma carta fica sem resposta. Isso prova indiferença? Talvez falte saber se chegou ao destinatário.<\/p><p>Vais observar como uma informação revelada mais tarde altera a leitura de um silêncio em <i>Amor de Perdição<\/i>.<\/p>"},{"t":"vf","p":"Antes de reler. Nas cartas do romance, aquilo que se escreve coincide com o que o destinatário chega a conhecer?","v":false,"f":"Confundir intenção comunicativa e receção elimina os obstáculos do contacto. Relê a situação das cartas na F04 e distingue quem escreve, a quem se dirige e o que fica conhecido.","g":"m5-f17-1","fe":"Confundes o que se escreve com o que o destinatário chega a conhecer. Regressa à situação das cartas na F04 e distingue quem escreve, a quem se dirige e o que fica conhecido."},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>Na comunicação, é necessário distinguir <strong>emissor<\/strong>, <strong>destinatário<\/strong>, <strong>mensagem<\/strong> e <strong>canal<\/strong>. Uma interferência pode impedir o contacto sem que o destinatário o saiba.<\/p><p>A narração pode revelar depois uma informação desconhecida pelas personagens. O leitor revê então uma interpretação anterior: a ordem de contar também produz conhecimento.<\/p>"},{"t":"ler","titulo":"A descoberta posterior","rot":"Lê de perto","html":"<blockquote class=\"prosa\">«Escrevia a mãe a Simão, e não recebia resposta. Pensava ela que o filho não respondia: anos depois, vimos entre os papéis de meu pai todas as cartas que ela escrevera. Já se vê que o pai as fazia tirar no correio.»<\/blockquote><p>Camilo Castelo Branco, <i>Amor de Perdição<\/i>, capítulo XII, edição de Ivo Castro, Lisboa, Imprensa Nacional, 2020, p. 120. A passagem pertence à memória familiar atribuída à irmã de Simão. O texto de Camilo está em domínio público.<\/p><p><a href=\"https://imprensanacional.pt/wp-content/uploads/2022/03/Amor-Perdicao.pdf\" target=\"_blank\" rel=\"noopener\">Consulta a edição integral da Imprensa Nacional<\/a>. Procura o capítulo XII e a página impressa 120. O recorte não é uma carta de Teresa: trata das cartas da mãe para Simão.<\/p>"},{"t":"sublinhar","p":"Que duas palavras mostram que a prova surgiu depois da interpretação inicial da mãe?","frase":"anos depois, vimos entre os papéis de meu pai todas as cartas","certas":[0,1],"f":"«Anos depois» situa o momento em que surge a prova. O intervalo é decisivo para perceber que a mãe não dispunha dessa informação quando interpretava o silêncio.","g":"m5-f17-10","fe":"Escolhes palavras que dizem onde estavam as cartas, e não quando foram encontradas. Relê «anos depois, vimos entre os papéis de meu pai todas as cartas» e procura a indicação de tempo."},{"t":"escolha","p":"Que informação altera a explicação do silêncio?","o":["O pai mandava retirar as cartas no correio.","A mãe mandava retirar as suas cartas no correio.","Simão mandava retirar as cartas no correio."],"c":0,"f":"A descoberta das cartas revela uma interferência no canal. A falta de resposta deixa de poder ser atribuída automaticamente a uma decisão de Simão.","g":"m5-f17-4","fe":["A descoberta das cartas revela uma interferência no canal. A falta de resposta deixa de poder ser atribuída automaticamente a uma decisão de Simão.","Trocas quem ordena a interceção por quem espera resposta. Relê a informação sobre o pai e o correio.","Atribuis ao destinatário a ordem de intercetar as cartas. Relê o recorte e vê quem as fazia retirar e quem fica sem essa informação."]},{"t":"vf","p":"Sem saber se a mensagem chegou ao destinatário, a ausência de resposta não permite concluir que ele a recusou.","v":true,"f":"A ausência de resposta é um resultado com várias explicações possíveis. Neste recorte, a interceção impede concluir que Simão recebeu as cartas.","g":"m5-f17-5","fe":"Pensas que a falta de resposta basta para provar uma recusa. Relê, em «O essencial», que uma interferência pode impedir o contacto sem que o destinatário o saiba."},{"t":"ler","titulo":"Quem sabe o quê","rot":"Para entender","html":"<p>A mãe interpreta a ausência de resposta sem conhecer a interceção. A recordação posterior fornece ao leitor uma informação que ela não tinha naquele momento.<\/p><p>Essa diferença permite rever uma conclusão. Não significa que o recorte revele todos os pensamentos de Simão ou todas as razões do pai. A explicação comprovada deve manter o seu alcance.<\/p><p><strong>Modelo completo.<\/strong> A mãe observa a ausência de resposta e atribui-a ao filho. A descoberta posterior das cartas revela a interceção. A nova prova modifica a explicação do silêncio sem revelar todos os sentimentos de Simão.<\/p>"},{"t":"emparelhar","p":"Relaciona cada elemento com a sua função.","pares":[["A mãe que escreve","Emissora das mensagens"],["Simão","Destinatário pretendido"],["Interceção no correio","Interferência no canal"]],"f":"O destinatário pretendido não é necessariamente quem recebe materialmente a mensagem. A interceção altera o percurso sem mudar a intenção da emissora.","g":"m5-f17-6","fe":"Confundes quem escreve, a quem se dirige e o que interrompe o percurso. Relê, em «O essencial», as noções de emissor, destinatário e canal, e aplica-as ao recorte do capítulo XII."},{"t":"completar","p":"Completa a distinção.","frase":"A falta de resposta é uma [1]; a indiferença seria uma [2].","lacunas":[{"o":["observação","justificação","confirmação"],"c":0},{"o":["inferência","ocorrência","confirmação"],"c":0}],"f":"Uma observação pode admitir explicações diferentes. A inferência sobre sentimentos exige provas que a ausência de resposta, sozinha, não fornece.","g":"m5-f17-8","fe":"Trocas o que se observa pelo que se conclui sobre sentimentos. Relê o modelo completo: a mãe observa a ausência de resposta e só depois a atribui ao filho."},{"t":"escolha","p":"Que efeito produz revelar a interceção mais tarde?","o":["Obriga a rever a interpretação do silêncio.","Reforça a interpretação inicial do silêncio.","Esclarece a intenção de Simão no silêncio."],"c":0,"f":"A nova informação muda a explicação do que já tinha sido contado. Esse efeito depende da distribuição do conhecimento ao longo da narrativa.","g":"m5-f17-11","fe":["A nova informação muda a explicação do que já tinha sido contado. Esse efeito depende da distribuição do conhecimento ao longo da narrativa.","Manténs a explicação inicial apesar do dado novo. Regressa à descoberta posterior e distingue silêncio de receção confirmada.","Transformas a descoberta num acesso à intenção de Simão. Relê o recorte e vê quem controla as cartas e o que o destinatário chega a saber."]},{"t":"ordenar","p":"Reconstrói a sequência dos acontecimentos referidos.","passos":["A mãe escreve a Simão","As cartas são retiradas no correio","A mãe não recebe resposta","Anos depois, as cartas são encontradas"],"f":"A narração menciona primeiro o resultado e só depois explica a interceção. Reconstruir os acontecimentos distingue ordem temporal e ordem de revelação.","g":"m5-f17-9","fe":"Segues a ordem em que o recorte conta, e não a ordem em que tudo aconteceu. Relê o recorte e repara que a retirada das cartas no correio só é revelada no fim, «anos depois»."},{"t":"ler","titulo":"Mudar a ordem de contar","rot":"Compara","html":"<p>Resumo didático A: a mãe escreve, não recebe resposta e só depois se descobre a interceção. Resumo didático B: anuncia-se primeiro a interceção e conta-se depois a falta de resposta.<\/p><p>Os acontecimentos podem ser os mesmos. Em B, o leitor sabe antecipadamente aquilo que a mãe ignora; em A, a explicação posterior obriga a uma revisão.<\/p><p>Contraexemplo à regra de que silêncio significa rejeição: estas cartas são retiradas antes de chegar ao destinatário. Critério: a inferência sobre a reação exige confirmar primeiro a receção.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Nos dois resumos, separa a ordem dos acontecimentos da ordem em que o leitor conhece a interceção. Que versão permite antecipar o engano da mãe?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Distingue três planos.","pares":[["O que aconteceu às cartas","Percurso material da mensagem"],["O que a mãe pensava","Interpretação da personagem"],["Quando o leitor descobre o bloqueio","Organização da informação narrativa"]],"f":"Separar os planos permite explicar o efeito da ordem. Uma alteração na narração não exige uma alteração dos acontecimentos narrados.","g":"m5-f17-14","fe":"Misturas o que aconteceu às cartas, o que a mãe pensava e o momento em que o leitor sabe. Relê os resumos didáticos A e B: os acontecimentos são os mesmos e muda a ordem de revelação."},{"t":"escolha","p":"Que reescrita conserva os factos e muda a informação?","o":["Contar a interceção antes da espera da mãe.","Contar a recusa de Simão antes da espera da mãe.","Contar a desistência da mãe antes da interceção."],"c":0,"f":"Contar a interceção antes da espera reorganiza os mesmos factos. A recusa de Simão e a desistência da mãe mudam os acontecimentos e não servem para isolar o efeito da ordem narrativa.","g":"m5-f17-15","fe":["Contar a interceção antes da espera reorganiza os mesmos factos. A recusa de Simão e a desistência da mãe mudam os acontecimentos e não servem para isolar o efeito da ordem narrativa.","Acrescentas uma recusa que altera os factos do recorte. Regressa ao critério: mudar a ordem da informação sem mudar o acontecimento.","Acrescentas uma desistência em vez de reorganizar o relato. Relê a interceção e a espera, conservando os acontecimentos apresentados."]},{"t":"vf","p":"O recorte permite atribuir a Simão uma decisão consciente de rejeitar as cartas da mãe.","v":false,"f":"O texto explica o bloqueio das mensagens. Não apresenta uma reação de Simão à leitura dessas cartas nem permite inventar o que ele teria sentido.","g":"m5-f17-12","fe":"Atribuis a Simão uma recusa que o recorte não narra. Relê «Já se vê que o pai as fazia tirar no correio»: as cartas não lhe chegaram."},{"t":"completar","p":"Completa uma regra de leitura.","frase":"A nova prova permite [1] a explicação, sem autorizar [2] sentimentos.","lacunas":[{"o":["rever","fixar","negar"],"c":0},{"o":["inventar","observar","comparar"],"c":0}],"f":"A revisão corrige o que era apenas uma hipótese. Não preenche todas as lacunas da história nem transforma possibilidades em estados interiores comprovados.","g":"m5-f17-16","fe":"Deixas que a nova prova fixe ou negue mais do que pode. Relê, em «Para entender», que a descoberta modifica a explicação do silêncio sem revelar todos os sentimentos de Simão."},{"t":"escolha","p":"Que conclusão se apoia no recorte?","o":["O controlo das cartas afeta a relação familiar.","A ausência de resposta confirma a rejeição de Simão.","A descoberta das cartas confirma que Simão as leu."],"c":0,"f":"A interceção limita o contacto e produz uma interpretação enganada. O texto não transforma o silêncio numa regra geral nem afirma conhecimento igual para todos.","g":"m5-f17-18","fe":["A interceção limita o contacto e produz uma interpretação enganada. O texto não transforma o silêncio numa regra geral nem afirma conhecimento igual para todos.","Confundes ausência de resposta com rejeição consciente. Regressa à diferença entre escrever uma carta e o destinatário recebê-la.","Confundes descobrir as cartas com provar a leitura de Simão. Relê o recorte e vê quem manda retirar a correspondência e quando surge essa informação."]},{"t":"ordenar","p":"Ordena os acontecimentos e a mudança de conhecimento, sem inventar uma reação de Simão.","passos":["A mãe escreve e espera resposta","O pai interfere no percurso das cartas","A mãe atribui o silêncio ao filho","A descoberta posterior permite rever essa atribuição"],"f":"A espera precede a revelação da interceção, obrigando a rever o silêncio. A ordem da informação altera a interpretação sem autorizar a invenção de uma recusa de Simão.","g":"m5-f17-17","fe":"Trocas a ordem dos acontecimentos ou acrescentas uma reação de Simão que o texto não narra. Relê o recorte do capítulo XII e separa o que a mãe faz, o que o pai faz e o que só se descobre «anos depois»."},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Que muda quando descobres quem impediu uma mensagem de chegar?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
