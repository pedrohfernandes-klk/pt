window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m5-f16",CARTOES=[{"t":"ler","titulo":"Aprender a viver","rot":"Abre","html":"<p class=\"abre\"><strong>Que pode a educação explicar numa vida, e que fica por explicar?<\/strong><\/p><p class=\"abre\">Saber repetir uma resposta é o mesmo que saber compreender o mundo? E uma educação promissora garante uma vida conseguida?<\/p><p>Vais comparar práticas educativas em <i>Os Maias<\/i>, sem transformar a infância numa sentença sobre o futuro.<\/p>"},{"t":"vf","p":"Antes de reler. Recupera a descrição do Ramalhete na F10: os pormenores de um espaço podem caracterizar uma família sem um retrato direto de cada pessoa?","v":true,"f":"Confundir caracterização com retrato explícito faz perder o papel dos pormenores. Relê a descrição do Ramalhete e recupera uma relação entre espaço e história familiar.","g":"m5-f16-1","fe":"Confundes caracterização com retrato direto de cada pessoa. Regressa à descrição do Ramalhete na F10 e recupera uma relação entre o espaço e a história da família."},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>A <strong>caracterização indireta<\/strong> apresenta personagens através de ações, relações e hábitos. A comparação de educações envolve também os valores de quem narra e de quem comenta.<\/p><p>Uma influência não é uma causa única. Para explicar um percurso, é necessário relacionar formação, circunstâncias e escolhas posteriores.<\/p>"},{"t":"ler","titulo":"Pedro e Carlos","rot":"Lê de perto","html":"<p>No capítulo I, o padre Vasques ensina a Pedro as declinações latinas e a cartilha. A narração associa as perguntas e respostas a um estado dormente. No capítulo III, Brown adia o latim e põe primeiro a força física; Afonso apoia-o e defende que a criança conheça o mundo concreto.<\/p><blockquote class=\"prosa\">«O latim era um luxo d’erudito»<\/blockquote><blockquote class=\"prosa\">«deixando-o ao mesmo tempo sem saber o que é a chuva que o molha, como se faz o pão que come»<\/blockquote><p>Eça de Queirós, <i>Os Maias<\/i>, vol. I, Porto, Livraria Internacional de Ernesto Chardron, 1888. O resumo do padre Vasques vem do capítulo I (pp. 18–19); os dois recortes, do capítulo III (pp. 82–83). <a href=\"https://www.gutenberg.org/cache/epub/40409/pg40409-images.html\" target=\"_blank\" rel=\"noopener\">Lê os episódios no texto integral do Projeto Gutenberg<\/a>, preparado a partir de exemplares de bibliotecas identificadas na edição digital.<\/p>"},{"t":"emparelhar","p":"Relaciona cada elemento com a prática apresentada.","pares":[["Pedro e o padre Vasques","Repetição da cartilha"],["Carlos e a orientação de Brown","Força física antes do latim"],["Afonso na discussão educativa","Apoio ao método defendido por Brown"]],"f":"A atribuição permite distinguir quem aprende, quem orienta e quem avalia. A comparação não deve misturar todas as vozes numa opinião indiferenciada.","g":"m5-f16-6","fe":"Misturas quem aprende, quem orienta e quem avalia. Relê o resumo dos capítulos I e III e separa o aluno, o educador e o adulto que defende o método."},{"t":"escolha","p":"Que contraste organiza os exemplos educativos?","o":["Opõe repetir doutrina e compreender o concreto.","Contrasta aprender por si e dispensar a orientação.","Contrasta praticar desporto e dispensar a leitura."],"c":0,"f":"A comparação opõe prioridades e métodos. O contraste não significa que Carlos cresça sem orientação ou que toda a aprendizagem verbal seja inútil.","g":"m5-f16-4","fe":["A comparação opõe prioridades e métodos. O contraste não significa que Carlos cresça sem orientação ou que toda a aprendizagem verbal seja inútil.","Confundes aprender por si com ausência de orientação. Relê as intervenções do padre Vasques, de Brown e de Afonso.","Confundes uma prioridade educativa com recusa da leitura. Regressa à discussão sobre o momento de aprender latim e sobre o conhecimento do mundo."]},{"t":"vf","p":"A prioridade dada ao conhecimento concreto corresponde a uma recusa da leitura como aprendizagem.","v":false,"f":"O recorte critica uma prioridade educativa que deixa por conhecer o mundo vivido. Não equivale a rejeitar qualquer leitura ou estudo.","g":"m5-f16-5","fe":"Tomas uma prioridade educativa por uma recusa de toda a leitura. Relê «O latim era um luxo d’erudito» e o resumo do capítulo III: Brown adia o latim, não o proíbe."},{"t":"ler","titulo":"Eusebiozinho e o futuro previsto","rot":"Para entender","html":"<blockquote class=\"prosa\">«Assim na familia tinha a sua carreira destinada: era rico, havia de ser primeiro bacharel, e depois desembargador.»<\/blockquote><p>Eça de Queirós, mesma edição, capítulo III, p. 90. Conserva-se a grafia da transcrição. A passagem apresenta as expectativas da família de Eusebiozinho, depois de descrever o seu contacto precoce com livros e a admiração dos adultos.<\/p><p>O retrato cruza saber exibido, imobilidade e uma carreira projetada pelos outros. A ironia pede atenção à distância entre o elogio familiar e os pormenores narrativos.<\/p><p><strong>Modelo completo.<\/strong> A repetição da cartilha e o conhecimento da chuva e do pão mostram prioridades distintas. A atribuição a Vasques, Brown e Afonso permite comparar práticas e avaliações sem as fundir.<\/p>"},{"t":"completar","p":"Completa a distinção.","frase":"A família apresenta uma [1] de carreira; a narração permite uma leitura [2].","lacunas":[{"o":["previsão","sentença","conclusão"],"c":0},{"o":["crítica","objetiva","factual"],"c":0}],"f":"A carreira está projetada, não realizada naquele momento. A narração oferece pormenores que permitem questionar o valor do modelo admirado pela família.","g":"m5-f16-8","fe":"Tomas a carreira projetada pela família por um facto ou por uma conclusão do narrador. Relê «havia de ser primeiro bacharel» e repara no tempo verbal que a projeta no futuro."},{"t":"escolha","p":"Que comentário evita uma explicação determinista?","o":["A formação influencia escolhas futuras de Carlos.","A formação determina todas as escolhas de Carlos.","A formação corrige as escolhas posteriores de Carlos."],"c":0,"f":"Influência e determinação total são conceitos diferentes. A análise do romance precisa de confrontar o modelo educativo com a vida posterior.","g":"m5-f16-11","fe":["Influência e determinação total são conceitos diferentes. A análise do romance precisa de confrontar o modelo educativo com a vida posterior.","Transformas uma influência numa explicação suficiente do percurso. Relê o contraste entre a educação de Carlos e as escolhas que faz depois.","Atribuis ao método o poder de corrigir ações posteriores. Regressa à diferença entre promessa educativa e conduta efetiva."]},{"t":"ordenar","p":"Ordena uma comparação dos três percursos.","passos":["Identificar as práticas de cada educação","Distinguir os valores dos adultos envolvidos","Observar a apresentação narrativa","Relacionar a formação com escolhas posteriores"],"f":"A comparação começa por provas concretas e não por rótulos. As escolhas posteriores podem complicar as expectativas produzidas pela educação.","g":"m5-f16-9","fe":"Pões a conclusão sobre a vida posterior antes das provas que a sustentam. Relê o modelo completo: as práticas, a cartilha, a chuva e o pão, vêm antes das avaliações atribuídas a Vasques, Brown e Afonso."},{"t":"sublinhar","p":"Que palavra apresenta a carreira como traçada pelos adultos, e não como escolha já realizada pela criança?","frase":"Na família tinha a sua carreira destinada.","certas":[6],"f":"«Destinada» apresenta um futuro previamente traçado. A formulação convida a perguntar que margem de decisão é reconhecida à criança.","g":"m5-f16-10","fe":"Escolhes uma palavra que não diz quem traçou o futuro. Relê a frase e procura o particípio que apresenta a carreira como decidida por outros antes de a criança escolher."},{"t":"ler","titulo":"O método não resolve tudo","rot":"Compara","html":"<p>No mesmo capítulo III, Carlos agride Eusebiozinho durante a convivência em Santa Olávia. Esse comportamento impede transformar o modelo educativo que recebe numa garantia de superioridade moral.<\/p><p>Comparar educações não exige humilhar uma criança. O objeto da análise são as práticas, as expectativas, as relações e o modo como a narrativa as apresenta.<\/p><p>Contraexemplo à conclusão de que o método valorizado garante uma conduta irrepreensível: Carlos agride Eusebiozinho. Critério: uma promessa educativa tem de ser confrontada com os comportamentos, não tomada como garantia.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Compara a prática, o elogio familiar e o comportamento observado. Qual destes planos comprova uma ação e qual exprime uma expectativa?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Distingue três tipos de afirmação.","pares":[["A criança repete respostas","Observação de uma prática"],["A família admira essa prática","Avaliação das personagens"],["Essa prática explica toda a vida","Generalização a demonstrar"]],"f":"Uma observação e uma avaliação atribuída não bastam para estabelecer uma causa total. A generalização exigiria um alcance que os recortes não sustentam.","g":"m5-f16-14","fe":"Confundes o que se observa, o que as personagens avaliam e o que seria preciso provar. Relê «Uma influência não é uma causa única», em «O essencial», antes de classificar a última afirmação."},{"t":"vf","p":"O elogio familiar de Eusebiozinho pode contrastar com os pormenores narrativos e produzir ironia.","v":true,"f":"O contraste entre o elogio e os pormenores da apresentação pode sustentar a ironia. É precisamente necessário ler além da avaliação dos familiares.","g":"m5-f16-12","fe":"Lês o elogio da família como a avaliação do narrador. Relê o retrato de Eusebiozinho: o saber exibido e a imobilidade contrastam com a admiração dos adultos."},{"t":"completar","p":"Completa uma conclusão.","frase":"Comparar exige observar [1]; explicar uma vida exige considerar [2].","lacunas":[{"o":["práticas","destinos","etiquetas"],"c":0},{"o":["escolhas","só notas","só planos"],"c":0}],"f":"As práticas oferecem provas para a comparação. As escolhas e circunstâncias posteriores impedem reduzir toda a existência a um esquema da infância.","g":"m5-f16-16","fe":"Trocas as provas observáveis por etiquetas ou destinos. Relê, em «O essencial», a frase que junta formação, circunstâncias e escolhas posteriores na explicação de um percurso."},{"t":"escolha","p":"Que pergunta testa os limites de uma educação valorizada?","o":["Como confronta a ação de Carlos a promessa do método?","Como confirma a ação de Carlos a superioridade do método?","Como traduz a ação de Carlos o programa do seu educador?"],"c":0,"f":"O comportamento concreto permite confrontar a promessa educativa com a ação. As outras perguntas já pressupõem a conclusão que deveria ser discutida.","g":"m5-f16-15","fe":["O comportamento concreto permite confrontar a promessa educativa com a ação. As outras perguntas já pressupõem a conclusão que deveria ser discutida.","Pressupões a superioridade que a comparação deveria examinar. Relê o desfasamento entre a promessa do método e a ação de Carlos.","Tomas a ação como execução do programa do educador. Regressa à distinção entre formação recebida e escolhas posteriores."]},{"t":"ordenar","p":"Ordena a comparação e a objeção que impede uma conclusão determinista.","passos":["A educação de Pedro valoriza a repetição da cartilha","A discussão sobre Carlos valoriza o mundo concreto","A família de Eusebiozinho antecipa uma carreira","A conduta de Carlos limita a promessa do método"],"f":"A comparação distingue métodos, comentários e apresentação narrativa. A formação de Carlos influencia o seu percurso, mas não permite deduzir as escolhas posteriores como execução necessária de um programa.","g":"m5-f16-17","fe":"Colocas a objeção antes dos casos que ela limita. Relê o contraexemplo: a agressão de Carlos a Eusebiozinho só limita a promessa do método depois de as três educações estarem comparadas."},{"t":"escolha","p":"Que proposta transfere a questão para um caso criado?","o":["Comparar repetir uma regra com aplicá-la a um caso novo.","Comparar duas regras apenas pela facilidade de repetição.","Comparar as regras pelo prestígio de quem as apresenta."],"c":0,"f":"Aplicar a um caso novo permite testar a compreensão. As outras propostas reproduzem o determinismo ou a hierarquia social que a leitura deve interrogar.","g":"m5-f16-18","fe":["Aplicar a um caso novo permite testar a compreensão. As outras propostas reproduzem o determinismo ou a hierarquia social que a leitura deve interrogar.","Reduzes a comparação à facilidade de repetir. Regressa à diferença entre recitar uma resposta e compreender uma situação concreta.","Substituis o efeito educativo pelo prestígio de quem ensina. Relê a distância entre admiração familiar e apresentação de Eusebiozinho."]},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Que pode a educação explicar numa vida, e que fica por explicar?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];

if(!/[?&]projetar=1(&|$)/.test(location.search))save("epi-ultima",{id:"m5-f16",m:"M5",t:Date.now()});
