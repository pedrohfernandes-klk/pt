<div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 5<br>Unidade 2</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação da lição"><a href="../#m5-f16">Esta lição no percurso</a><a href="../licao-m5-f10/">Lição anterior</a><a href="../licao-m5-f11/">Continuar o percurso</a></nav><p class="c-menu-extra">As citações têm crédito junto ao texto. Os exemplos criados estão identificados. O progresso fica neste aparelho.</p></div></div>

<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m5-f16",CARTOES=[{"t":"ler","titulo":"Aprender a viver","rot":"Abre","html":"<p class=\"abre\">Saber repetir uma resposta é o mesmo que saber compreender o mundo? E uma educação promissora garante uma vida conseguida?<\/p><p>Vais comparar práticas educativas em <i>Os Maias<\/i>, sem transformar a infância numa sentença sobre o futuro.<\/p>"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>A <strong>caracterização indireta<\/strong> apresenta personagens através de ações, relações e hábitos. A comparação de educações envolve também os valores de quem narra e de quem comenta.<\/p><p>Uma influência não é uma causa única. Para explicar um percurso, é necessário relacionar formação, circunstâncias e escolhas posteriores.<\/p>"},{"t":"ler","titulo":"Pedro e Carlos","rot":"Lê e confronta","html":"<p>No capítulo I, o padre Vasques ensina a Pedro as declinações latinas e a cartilha. A narração associa as perguntas e respostas a um estado dormente. No capítulo III, Afonso apoia a prioridade dada por Brown ao conhecimento do mundo concreto.<\/p><blockquote class=\"prosa\">«O latim era um luxo d’erudito»<\/blockquote><blockquote class=\"prosa\">«deixando-o ao mesmo tempo sem saber o que é a chuva que o molha, como se faz o pão que come»<\/blockquote><p>Eça de Queirós, <i>Os Maias<\/i>, vol. I, Porto, Livraria Internacional de Ernesto Chardron, 1888, capítulos I, pp. 18–19, e III, pp. 82–83. Os dois recortes pertencem ao capítulo III. <a href=\"https://www.gutenberg.org/cache/epub/40409/pg40409-images.html\" target=\"_blank\" rel=\"noopener\">Lê os episódios no texto integral do Projeto Gutenberg<\/a>, preparado a partir de exemplares de bibliotecas identificadas na edição digital.<\/p>"},{"t":"escolha","p":"Que contraste organiza os exemplos educativos?","o":["Repetição doutrinária e compreensão do mundo concreto.","Aprendizagem autónoma e ausência total de orientação.","Prática desportiva e rejeição de todos os conhecimentos."],"c":0,"f":"A comparação opõe prioridades e métodos. O contraste não significa que Carlos cresça sem orientação ou que toda a aprendizagem verbal seja inútil.","g":"m5-f16-3"},{"t":"vf","p":"A defesa do conhecimento concreto prova que o romance considera inútil toda a leitura.","v":false,"f":"O recorte critica uma prioridade educativa que deixa por conhecer o mundo vivido. Não equivale a rejeitar qualquer leitura ou estudo.","g":"m5-f16-4"},{"t":"emparelhar","p":"Relaciona cada elemento com a prática apresentada.","pares":[["Pedro e o padre Vasques","Repetição da cartilha"],["Carlos e a orientação de Brown","Conhecimento ligado ao mundo concreto"],["Afonso na discussão educativa","Apoio ao método defendido por Brown"]],"f":"A atribuição permite distinguir quem aprende, quem orienta e quem avalia. A comparação não deve misturar todas as vozes numa opinião indiferenciada.","g":"m5-f16-5"},{"t":"ler","titulo":"Eusebiozinho e o futuro previsto","rot":"Lê e confronta","html":"<blockquote class=\"prosa\">«Assim na familia tinha a sua carreira destinada: era rico, havia de ser primeiro bacharel, e depois desembargador.»<\/blockquote><p>Eça de Queirós, mesma edição, capítulo III, p. 90. Conserva-se a grafia da transcrição. A passagem apresenta as expectativas da família de Eusebiozinho, depois de descrever o seu contacto precoce com livros e a admiração dos adultos.<\/p><p>O retrato cruza saber exibido, imobilidade e uma carreira projetada pelos outros. A ironia pede atenção à distância entre o elogio familiar e os pormenores narrativos.<\/p>"},{"t":"completar","p":"Completa a distinção.","frase":"A família apresenta uma [1] de carreira; a narração permite uma leitura [2].","lacunas":[{"o":["previsão","sentença","conclusão"],"c":0},{"o":["crítica","objetiva","factual"],"c":0}],"f":"A carreira está projetada, não realizada naquele momento. A narração oferece pormenores que permitem questionar o valor do modelo admirado pela família.","g":"m5-f16-7"},{"t":"ordenar","p":"Ordena uma comparação dos três percursos.","passos":["Identificar as práticas de cada educação","Distinguir os valores dos adultos envolvidos","Observar a apresentação narrativa","Relacionar a formação com escolhas posteriores"],"f":"A comparação começa por provas concretas e não por rótulos. As escolhas posteriores podem complicar as expectativas produzidas pela educação.","g":"m5-f16-8"},{"t":"sublinhar","p":"Seleciona a palavra que mostra a carreira como decidida pelos outros.","frase":"Na família tinha a sua carreira destinada.","certas":[6],"f":"Destinada apresenta um futuro previamente traçado. A formulação convida a perguntar que margem de decisão é reconhecida à criança.","g":"m5-f16-9"},{"t":"escolha","p":"Que comentário evita uma explicação determinista?","o":["A formação influencia escolhas sem as explicar sozinha.","A formação determina sozinha todos os atos de uma vida inteira.","A formação torna irrelevantes as decisões posteriores."],"c":0,"f":"Influência e determinação total são conceitos diferentes. A análise do romance precisa de confrontar o modelo educativo com a vida posterior.","g":"m5-f16-10"},{"t":"vf","p":"O entusiasmo dos adultos por Eusebiozinho impede uma leitura irónica do seu retrato.","v":false,"f":"O contraste entre o elogio e os pormenores da apresentação pode sustentar a ironia. É precisamente necessário ler além da avaliação dos familiares.","g":"m5-f16-11"},{"t":"ler","titulo":"O método não resolve tudo","rot":"Lê e confronta","html":"<p>No mesmo capítulo III, Carlos agride Eusebiozinho durante a convivência em Santa Olávia. Esse comportamento impede transformar o modelo educativo que recebe numa garantia de superioridade moral.<\/p><p>Comparar educações não exige humilhar uma criança. O objeto da análise são as práticas, as expectativas, as relações e o modo como a narrativa as apresenta.<\/p>"},{"t":"emparelhar","p":"Distingue três tipos de afirmação.","pares":[["A criança repete respostas","Observação de uma prática"],["A família admira essa prática","Avaliação das personagens"],["Essa prática explica toda a vida","Generalização a demonstrar"]],"f":"Uma observação e uma avaliação atribuída não bastam para estabelecer uma causa total. A generalização exigiria um alcance que os recortes não sustentam.","g":"m5-f16-13"},{"t":"escolha","p":"Que pergunta testa os limites de uma educação valorizada?","o":["Como age Carlos quando convive com Eusebiozinho?","Que prova garante que Carlos nunca comete erros?","Como demonstra o método que a infância prevê tudo?"],"c":0,"f":"O comportamento concreto permite confrontar a promessa educativa com a ação. As outras perguntas já pressupõem a conclusão que deveria ser discutida.","g":"m5-f16-14"},{"t":"completar","p":"Completa uma conclusão.","frase":"Comparar exige observar [1]; explicar uma vida exige considerar [2].","lacunas":[{"o":["práticas","destinos","etiquetas"],"c":0},{"o":["escolhas","só notas","só planos"],"c":0}],"f":"As práticas oferecem provas para a comparação. As escolhas e circunstâncias posteriores impedem reduzir toda a existência a um esquema da infância.","g":"m5-f16-15"},{"t":"ordenar","p":"Planeia uma resposta comparativa.","passos":["Escolher uma prática de cada modelo","Explicar o valor que os adultos lhe atribuem","Confrontar o elogio com um pormenor narrativo","Apresentar uma conclusão com um limite"],"f":"A conclusão deve conservar as diferenças e o papel da narração. Uma tabela de características não substitui a interpretação dos seus efeitos.","g":"m5-f16-16"},{"t":"escolha","p":"Que proposta transfere a questão para um caso criado?","o":["Comparar repetir uma regra com aplicá-la a um caso novo.","Prever uma vida inteira apenas pela primeira resposta.","Classificar todas as pessoas pelo prestígio da sua família."],"c":0,"f":"Aplicar a um caso novo permite testar a compreensão. As outras propostas reproduzem o determinismo ou a hierarquia social que a leitura deve interrogar.","g":"m5-f16-17"},{"t":"vf","p":"Uma educação valorizada na narrativa pode coexistir com comportamentos censuráveis de quem a recebeu.","v":true,"f":"O episódio entre Carlos e Eusebiozinho mostra a necessidade de distinguir método e conduta. A comparação não cria pessoas infalíveis.","g":"m5-f16-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">A educação ajuda a explicar uma vida; não a decide por inteiro.<\/p><p>Compara uma prática, uma expectativa e um comportamento. Explica o que a comparação permite concluir e o que continua por explicar.<\/p>"}];
