<script>
(function(){
var D={"ano":12,"anoNome":"3.º ano","anoCurto":"3.º","modulos":[{"k":"M7","nome":"Lírica Pessoana"},{"k":"M8","nome":"Poesia e Conto do Séc. XX"},{"k":"M9","nome":"Romance Saramaguiano"}],"exercicios":[{"pasta":"Ler-a-fundo","ficheiro":"Pessoa-Autopsicografia-Isto.html","id":"pessoa-fingir","cor":"#3d3d8c","corEscura":"#9a9ad6","marca":"Ler a fundo · 5 min · M7 Pessoa","titulo":"O poeta é um fingidor","subtitulo":"Fernando Pessoa, «Autopsicografia» e «Isto»","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de Pessoa","Percebeste o fingimento como método, não como mentira."],[0.5,"Bom leitor","Estás perto. Volta ao verso do «comboio de corda»."],[0,"A entrar em Pessoa","Relê: fingir, aqui, é transformar o sentido em palavras."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Dois poemas curtos sobre o mesmo problema: o que é escrever.</p><p><b>Autopsicografia</b> (1931) começa assim:<br><i>«O poeta é um fingidor. / Finge tão completamente / Que chega a fingir que é dor / A dor que deveras sente.»</i></p><p>E termina com o «comboio de corda» que «se chama coração».</p><p>Em <b>«Isto»</b>, responde a quem o acusa de mentir:<br><i>«Sentir? Sinta quem lê!»</i></p>","links":[["«Autopsicografia» no Arquivo Pessoa","http://arquivopessoa.net/textos/4234"],["«Isto» no Arquivo Pessoa","http://arquivopessoa.net/textos/4250"]]},{"nivel":1,"tipo":"unica","rot":"Fingir","pergunta":"Neste poema, «fingir» quer dizer…","opcoes":[["mentir ao leitor","cuidado","Pessoa não engana: transforma. Repara que o poeta finge a dor que «deveras sente»."],["transformar em palavras o que se sente","certo","Sim: fingir é dar forma, é fazer da emoção matéria de arte."],["esconder a identidade","cuidado","Isso são os heterónimos, outra coisa. Aqui o tema é o que acontece à emoção quando vira poema."]]},{"nivel":1,"tipo":"unica","rot":"Quem sente","pergunta":"«Sentir? Sinta quem lê!» significa que…","opcoes":[["o leitor é que tem de emocionar-se","certo","Sim: o trabalho do poeta é fazer sentir, não exibir o próprio sentimento."],["o poeta não sente nada","cuidado","Ele sente — mas o que entrega ao leitor é o poema, não a emoção em bruto."],["a poesia é para quem sofre","cuidado","O verso não fala de sofrimento, fala de quem lê."]]},{"nivel":2,"tipo":"cartoes","rot":"No teu curso","pergunta":"Escolhe onde também se «finge» assim, e explica numa linha.","cartoes":[["Representar","O ator chora sem estar triste — e o público sente."],["Fotografar","Escolher luz e enquadramento para provocar uma emoção."],["Editar som","Construir tensão com silêncios que não existiam."],["Desenhar","Simplificar um rosto para que se reconheça melhor."]]},{"nivel":2,"tipo":"deslizar","rot":"Sinceridade","pergunta":"Um artista que controla tudo é menos sincero?","esquerda":"menos sincero","direita":"igualmente sincero"},{"nivel":3,"tipo":"texto","rot":"A tua quadra","pergunta":"Escreve uma quadra a começar por «O/A ______ é um fingidor», sobre o teu curso. Até 30 palavras.","minPalavras":10,"maxPalavras":30,"placeholder":"O realizador é um fingidor…"},{"nivel":3,"tipo":"texto","rot":"Resposta a um crítico","pergunta":"Alguém diz: «Isso não é verdadeiro, é construído.» Responde em duas linhas, como Pessoa responderia.","minPalavras":10,"placeholder":"Respondo que…"}],"fontes":[["Arquivo Pessoa, «Autopsicografia»","http://arquivopessoa.net/textos/4234"],["Arquivo Pessoa, «Isto»","http://arquivopessoa.net/textos/4250"],["RTP Ensina, «Autopsicografia»","https://ensina.rtp.pt/artigo/autopsicografia-de-fernando-pessoa/"]],"modulo":"M7","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Candide-Cultivar-o-Jardim.html","id":"candide-jardim","cor":"#3f5f3f","corEscura":"#9dc39d","marca":"Ler a fundo · 5 min · Leituras extra","titulo":"Cultivar o nosso jardim","subtitulo":"Voltaire, Cândido, 1759","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Ironia apanhada","Viste onde Voltaire diz uma coisa para dizer o contrário."],[0.5,"Bom ouvido para a ironia","Já percebeste o jogo. Relê o elogio ao barão e pergunta porquê."],[0,"A entrar no conto","Relê devagar: quando o narrador elogia, desconfia."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Em 1759, <b>Voltaire</b> escreve a história de um rapaz que aprende que vive no melhor dos mundos possíveis. Depois vêm a guerra, o naufrágio e o terramoto de Lisboa.</p><p><i>Havia na Vestefália, no castelo do senhor barão de Thunder-ten-tronckh, um rapaz a quem a natureza dera os costumes mais doces. […] Tinha o juízo bastante reto e o espírito mais simples; é, creio, por essa razão que lhe chamavam Cândido.</i></p><p><i>O senhor barão era um dos senhores mais poderosos da Vestefália, porque o seu castelo tinha uma porta e janelas.</i></p><p class=\"nota\">Tradução nossa do francês. Cândido — nome que quer dizer ingénuo, puro.</p>","links":[["Ler o original em francês (Project Gutenberg)","https://www.gutenberg.org/ebooks/4650"]]},{"nivel":1,"tipo":"unica","rot":"O castelo","pergunta":"«Era um dos senhores mais poderosos da Vestefália, porque o seu castelo tinha uma porta e janelas.» Porque é que isto faz sorrir?","opcoes":[["A razão dada é banal e desfaz a grandeza anunciada","certo","Sim: qualquer casa tem porta e janelas. O narrador finge elogiar e ridiculariza."],["Porque um castelo não pode ter janelas","cuidado","Pode. O riso está na razão apresentada, não no facto."],["Porque o barão era pobre e mentia","cuidado","O texto não diz que mente. Diz que o motivo do poder é ridículo."]]},{"nivel":1,"tipo":"unica","rot":"O nome","pergunta":"Porque é que o rapaz se chama Cândido?","opcoes":[["Pelo juízo reto e pelo espírito simples","certo","Sim, é o próprio texto que o explica: «por essa razão que lhe chamavam Cândido»."],["Por ser filho do barão","cuidado","O texto levanta dúvidas sobre a família dele, mas o nome vem do carácter."],["Por ser o mais corajoso do castelo","cuidado","Cândido quer dizer ingénuo, não corajoso."]]},{"nivel":2,"tipo":"multi","rot":"Depois do terramoto","pergunta":"Depois do terramoto de Lisboa, escreve Voltaire, decidiu-se que «o espetáculo de algumas pessoas queimadas em lume brando» seria «um segredo infalível para impedir a terra de tremer». Toca no que ele está a criticar.","opcoes":[["A superstição de ligar um castigo a um fenómeno natural",5,"Sim: a terra não treme por causa do que as pessoas fazem."],["A crueldade transformada em cerimónia pública",5,"Sim: «em grande cerimónia», como se fosse festa."],["Os sábios e a universidade que o decidem",5,"Sim: quem devia pensar é quem assina a decisão."],["Os habitantes de Lisboa que fugiram",0,"Não há crítica a quem sofreu o terramoto."]]},{"nivel":2,"tipo":"cartoes","rot":"A última frase","pergunta":"No fim, o mestre Pangloss continua a explicar que tudo está bem, e Cândido responde: «é preciso cultivar o nosso jardim». Escolhe a leitura que defendes e explica numa linha.","cartoes":[["Desistir de mudar o mundo","Cansado de teorias, fecha-se no que é seu."],["Trocar a teoria pelo trabalho","Deixa de explicar o mal e começa a fazer alguma coisa."],["Escolher onde se consegue agir","Não é o mundo inteiro: é o pedaço onde a minha mão chega."],["Uma resposta que cala o mestre","Depois de tanta explicação, uma frase curta encerra a conversa."]]},{"nivel":3,"tipo":"texto","rot":"O teu jardim","pergunta":"Qual é o teu jardim este ano: uma coisa pequena, ao teu alcance, que fique melhor se lhe pegares? Escreve o primeiro passo, com um verbo de ação.","minPalavras":10,"maxPalavras":40,"placeholder":"O meu jardim é… e o primeiro passo é…"},{"nivel":3,"tipo":"texto","rot":"À maneira de Voltaire","pergunta":"Escreve uma frase que finja elogiar alguma coisa e a deixe ridícula, com a mesma receita do castelo: elogio grande, razão banal.","minPalavras":8,"maxPalavras":30,"placeholder":"É o maior… porque…"}],"fontes":[["Voltaire, Candide, ou l'Optimisme, texto francês (Project Gutenberg)","https://www.gutenberg.org/ebooks/4650"],["Cândido, ou O Otimismo (Wikipédia)","https://pt.wikipedia.org/wiki/C%C3%A2ndido,_ou_O_Otimismo"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Dom-Casmurro-O-Titulo.html","id":"casmurro-titulo","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · Leituras extra","titulo":"Não consultes dicionários","subtitulo":"Machado de Assis, Dom Casmurro, 1899 · cap. I","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor desconfiado","Percebeste quem manda neste livro: quem o conta."],[0.5,"Bom começo","Já sabes como nasceu o título. Pergunta agora a quem interessa contá-lo assim."],[0,"A entrar no romance","Relê devagar: é tudo contado por um homem só."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Em 1899, o brasileiro <b>Machado de Assis</b> abre um romance a explicar o título. Quem fala é o próprio protagonista: no comboio, um rapaz do bairro pôs-se a recitar-lhe versos.</p><p><i>Succedeu, porém, que como eu estava cançado, fechei os olhos tres ou quatro vezes; tanto bastou para que elle interrompesse a leitura e mettesse os versos no bolso.</i> […]</p><p><i>No dia seguinte entrou a dizer de mim nomes feios, e acabou alcunhando-me Dom Casmurro. Os visinhos, que não gostam dos meus habitos reclusos e calados, deram curso á alcunha, que afinal pegou.</i> […]</p><p><i>Não consultes diccionarios. Casmurro não está aqui no sentido que elles lhe dão, mas no que lhe poz o vulgo de homem calado e mettido comsigo. Dom veiu por ironia, para attribuir-me fumos de fidalgo. Tudo por estar cochilando!</i> […]</p><p><i>O meu poeta do trem ficará sabendo que não lhe guardo rancor. E com pequeno esforço, sendo o titulo seu, poderá cuidar que a obra é sua.</i></p><p class=\"pequeno\">Grafia da edição de 1899: «succedeu», «cançado», «diccionarios». «Cochilar» é dormitar; «trem» é comboio.</p>"},{"nivel":1,"tipo":"ordenar","rot":"Como nasce um título","pergunta":"Põe por ordem o caminho que vai de uns versos no comboio até à capa do livro.","itens":["Um rapaz do bairro recita-lhe versos no comboio","O narrador, cansado, fecha os olhos três ou quatro vezes","O rapaz interrompe a leitura e mete os versos no bolso","No dia seguinte, o rapaz chama-lhe Dom Casmurro","Os vizinhos espalham a alcunha, e ela pega","O narrador dá ao livro o título que o ofendia"],"retorno":"Quem batiza o livro é um poeta amuado. O narrador pega na ofensa e assina por baixo."},{"nivel":2,"tipo":"unica","rot":"O dicionário","pergunta":"«Não consultes diccionarios.» Porque é que o narrador dá esta ordem ao leitor?","opcoes":[["Porque usa a palavra num sentido que ele escolheu, e quer mandar na leitura","certo","Sim: «calado e mettido comsigo». É ele quem decide o que as palavras querem dizer."],["Porque a palavra «casmurro» não existe","cuidado","Existe, e o narrador sabe-o: fala do «sentido que elles lhe dão». Só não quer que o uses."],["Porque os dicionários do tempo estavam errados","cuidado","Não diz que estão errados. Diz que o sentido dele é outro."]]},{"nivel":2,"tipo":"multi","rot":"Confiar em quem conta","pergunta":"Este homem vai contar a própria vida sozinho, sem mais ninguém a confirmar. Toca no que, logo na primeira página, já faz desconfiar.","opcoes":[["Decide ele o que as palavras querem dizer",5,"Sim: «Não consultes diccionarios»."],["Diz que não guarda rancor e, na frase seguinte, troça do poeta",5,"Sim: «poderá cuidar que a obra é sua»."],["Conta só o seu lado: do rapaz, sabemos o que ele nos quer dizer",5,"Sim: o poeta nunca tem a palavra."],["Engana-se no nome do comboio",0,"Não há engano nenhum: é o «trem da Central»."]]},{"nivel":3,"tipo":"texto","rot":"A tua alcunha","pergunta":"Que alcunha te deram, ou darias a ti? Explica-a à maneira de Machado: diz primeiro o que ela NÃO quer dizer, depois o que quer.","minPalavras":12,"maxPalavras":45,"placeholder":"Não consultes dicionários. … não está aqui no sentido de…, mas no de…"}],"fontes":[["Machado de Assis, Dom Casmurro (1899), texto integral (Project Gutenberg n.º 55752)","https://www.gutenberg.org/ebooks/55752"],["Dom Casmurro (Wikipédia)","https://pt.wikipedia.org/wiki/Dom_Casmurro"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Oficina-Escada-da-Tensao.html","id":"oficina-escada","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Oficina · 5 min · escrever","titulo":"A escada da tensão","subtitulo":"Oficina de escrita · cada problema resolvido cria um problema maior","niveis":["Ver a escada","Subir um degrau"],"emblemas":[[0.8,"Arquiteto de sustos","Já sabes que a tensão se constrói degrau a degrau."],[0.5,"Bom começo","Viste a escada. Agora repara: cada degrau nasce do anterior."],[0,"A subir","Relê a história pela ordem certa e pergunta o que causa o quê."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Numa história que prende, a tensão não sobe ao acaso: sobe por <b>degraus</b>. A personagem resolve um problema, e a solução cria um problema <b>maior</b>.</p><p>A história que se segue é nossa, feita para este exercício. Chegou-te com os degraus trocados.</p>"},{"nivel":1,"tipo":"ordenar","rot":"Arruma a escada","pergunta":"Põe os degraus por ordem: cada um tem de nascer do anterior.","itens":["O Rui perde o último autocarro da noite","Decide ir a pé e liga o mapa no telemóvel, que tem 3 % de bateria","O telemóvel apaga-se; para não se perder, corta por uma rua que lhe parece conhecida","A rua acaba num portão fechado, entre dois muros altos","Volta-se para trás e ouve passos a entrar na mesma rua"],"retorno":"Repara: cada solução (ir a pé, usar o mapa, cortar caminho, voltar para trás) é a causa do problema seguinte."},{"nivel":1,"tipo":"unica","rot":"O degrau partido","pergunta":"Qual destas frases, posta a meio da história, deitava a escada abaixo?","opcoes":[["«Por sorte, passou um táxi vazio e o Rui chegou a casa em dez minutos.»","certo","Sim: resolve tudo sem criar problema novo. A tensão cai a zero e o leitor fecha o livro."],["«Começou a chover, e o Rui não tinha casaco.»","cuidado","Esta ainda piora as coisas: é mais um degrau, não um degrau partido."],["«A rua estava mais escura do que ele se lembrava.»","cuidado","Esta aumenta o medo. Não resolve nada."]]},{"nivel":2,"tipo":"texto","rot":"O sexto degrau","pergunta":"Escreve o degrau seguinte: o Rui faz alguma coisa para resolver os passos atrás dele, e isso cria um problema maior.","minPalavras":12,"maxPalavras":40,"placeholder":"O Rui… e foi então que…"},{"nivel":2,"tipo":"texto","rot":"A tua escada","pergunta":"Agora a tua: três degraus para uma personagem que só quer chegar a horas a um sítio. Uma linha por degrau.","minPalavras":15,"maxPalavras":50,"placeholder":"1. … 2. … 3. …"}],"fontes":[],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Reis-Se-Todo-em-Cada-Coisa.html","id":"reis-se-todo","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · Ricardo Reis","titulo":"Sê todo em cada coisa","subtitulo":"Ricardo Reis, ode de 14-2-1933","niveis":["Escolher as palavras","Ler a escolha","Fazer com o que leste"],"emblemas":[[0.8,"Ouvido de poeta","Escolheste quase sempre a palavra mais exata, como Reis."],[0.5,"Bom começo","Relê as palavras do poeta: nenhuma é a mais bonita, todas são a mais justa."],[0,"A afinar","Repara: Reis foge das palavras grandes. Escolhe sempre a mais sóbria."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Antes","html":"<p><b>Ricardo Reis</b> é o heterónimo de Pessoa que escreve odes curtas, medidas, à maneira dos antigos. Esta tem <b>seis versos</b> e é uma regra de vida.</p><p>Vais lê-la com quatro palavras em falta. Escolhe, para cada espaço, a que te parece a do poeta.</p>"},{"nivel":1,"tipo":"lacuna","rot":"A ode","pergunta":"Que palavra escreveu Reis em cada espaço?","versos":[{"antes":"Para ser grande, sê ","opcoes":["inteiro","forte","único"],"depois":": nada"},{"antes":"Teu exagera ou ","opcoes":["exclui","esconde","esquece"],"depois":"."},{"antes":"Sê todo em cada coisa. Põe quanto és"},{"antes":"No ","opcoes":["mínimo","melhor","máximo"],"depois":" que fazes."},{"antes":"Assim em cada lago a lua toda"},{"antes":"Brilha, porque ","opcoes":["alta","sozinha","livre"],"depois":" vive."}],"retorno":"Grande não é ser forte nem único: é estar inteiro, até no mínimo. E a lua cabe toda em cada lago porque vive alta, acima de todos."},{"nivel":2,"tipo":"unica","rot":"A lua e os lagos","pergunta":"«Assim em cada lago a lua toda / Brilha, porque alta vive.» O que explica a comparação?","opcoes":[["Quem está inteiro em si pode estar todo em cada coisa pequena","certo","Sim: a lua não se divide pelos lagos. Está toda em cada um."],["Que é preciso fazer muitas coisas ao mesmo tempo","cuidado","A lua não faz muitas coisas: faz uma, e está inteira em cada reflexo."],["Que só as coisas grandes merecem atenção","cuidado","É o contrário: «Põe quanto és / No mínimo que fazes»."]]},{"nivel":3,"tipo":"texto","rot":"O teu mínimo","pergunta":"Diz uma coisa mínima que fizeste esta semana e em que puseste tudo o que és. Ou uma em que devias ter posto.","minPalavras":10,"maxPalavras":40,"placeholder":"Esta semana, quando…"}],"fontes":[["Ricardo Reis, «Para ser grande, sê inteiro» (Arquivo Pessoa)","http://arquivopessoa.net/textos/503"]],"modulo":"M7","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Mensagem-O-Mar-Salgado.html","id":"mensagem-mar","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · Mensagem","titulo":"Ó mar salgado","subtitulo":"Fernando Pessoa, Mensagem, 1934 · «Mar Português»","niveis":["Montar a estrofe","Ler a resposta","Fazer com o que leste"],"emblemas":[[0.8,"Ouvido de rima","Montaste a estrofe pelo som e pelo sentido."],[0.5,"Bom começo","Repara nas rimas aos pares: sal/Portugal, choraram/rezaram, casar/mar."],[0,"A afinar","Lê os versos em voz alta: a rima diz-te qual vem a seguir."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Antes","html":"<p>Em <b>Mensagem</b> (1934), Pessoa conta os Descobrimentos como um destino. Mas neste poema, antes de perguntar se valeu a pena, faz as contas ao que custou.</p><p>A primeira estrofe chegou-te com os seis versos trocados. Rima aos pares: usa o ouvido.</p>"},{"nivel":1,"tipo":"ordenar","rot":"A primeira estrofe","pergunta":"Põe os seis versos pela ordem do poema.","itens":["Ó mar salgado, quanto do teu sal","São lágrimas de Portugal!","Por te cruzarmos, quantas mães choraram,","Quantos filhos em vão rezaram!","Quantas noivas ficaram por casar","Para que fosses nosso, ó mar!"],"retorno":"Três pares de rima, três perdas: mães, filhos, noivas. O último verso diz para quê."},{"nivel":2,"tipo":"unica","rot":"A resposta","pergunta":"A segunda estrofe começa: «Valeu a pena? Tudo vale a pena / Se a alma não é pequena.» Que resposta é esta?","opcoes":[["Um sim com condição: vale, se quem o faz for grande por dentro","certo","Sim. O «se» muda tudo: não é um sim para todos."],["Um sim sem reservas: tudo vale sempre a pena","cuidado","Falta-te metade do verso: «Se a alma não é pequena»."],["Um não disfarçado","cuidado","O poema não nega: «Tudo vale a pena». Mas põe-lhe uma condição."]]},{"nivel":3,"tipo":"texto","rot":"A tua conta","pergunta":"Diz uma coisa que te custou e que valeu a pena. O que custou, e o que ficou?","minPalavras":10,"maxPalavras":40,"placeholder":"Custou-me… mas ficou…"}],"fontes":[["Fernando Pessoa, Mensagem, «Mar Português» (Arquivo Pessoa)","http://arquivopessoa.net/textos/2405"]],"modulo":"M7","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Gramatica-Fechou-Fechava.html","id":"gramatica-aspeto","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Gramática · 5 min · valor aspetual","titulo":"Fechou, fechava, foi fechando","subtitulo":"O mesmo verbo, quatro maneiras de o tempo passar","niveis":["Reconhecer","Escolher com intenção"],"emblemas":[[0.8,"Relojoeiro de frases","Já ouves como o tempo passa dentro de um verbo."],[0.5,"Bom começo","Pergunta sempre: acabou, estava a acontecer, é costume, ou repetiu-se?"],[0,"A afinar","Volta às quatro perguntas: acabou? estava a acontecer? é costume? repetiu-se?"]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Um verbo não diz só <b>quando</b>: diz <b>como o tempo passa</b> lá dentro. Chama-se <b>valor aspetual</b>.</p><p><b>Perfetivo</b>: a ação acabou («fechou a porta»). <b>Imperfetivo</b>: estava a acontecer («fechava a porta»). <b>Habitual</b>: é costume («fechava sempre a porta»). <b>Iterativo</b>: repetiu-se («bateu três vezes à porta»).</p><p class=\"pequeno\">As frases deste exercício são nossas, feitas para treinar.</p>"},{"nivel":1,"tipo":"classificar","rot":"Quatro relógios","pergunta":"Que valor tem o verbo em cada frase?","categorias":["perfetivo","imperfetivo","habitual","iterativo"],"itens":[["Fechou a porta e saiu.",0],["A chuva caía sobre a cidade.",1],["Ao domingo, almoçava sempre com a avó.",2],["Bateu três vezes à porta.",3],["Estava a ler o conto.",1],["Costuma chegar atrasado.",2]],"retorno":"Repara nas pistas: «sempre», «costuma» e «ao domingo» marcam o hábito; «três vezes» marca a repetição; «estava a» e o imperfeito sozinho deixam a ação aberta."},{"nivel":2,"tipo":"unica","rot":"Abrir um conto","pergunta":"Queres abrir um conto com a personagem a meio de uma coisa, sem o leitor saber como acaba. Qual escolhes?","opcoes":[["«Ela relia a carta.»","certo","Sim: o imperfeito deixa a ação aberta. O leitor entra a meio e fica à espera."],["«Ela releu a carta.»","cuidado","O perfeito fecha a ação: já acabou. Serve para avançar, não para suspender."],["«Ela costuma reler cartas.»","cuidado","O habitual descreve um costume, não este momento."]]},{"nivel":2,"tipo":"texto","rot":"A tua vez","pergunta":"Pega em «Ele abriu a janela.» e escreve duas versões: uma em que é costume, outra em que se repete. Diz numa linha o que muda na história.","minPalavras":15,"maxPalavras":50,"placeholder":"Costume: … Repetição: … O que muda: …"}],"fontes":[["Dicionário Terminológico (DGE), valor aspetual","https://dt.dge.mec.pt/"]],"modulo":"M8","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Oficina-Sugerir.html","id":"oficina-sugerir","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Oficina · 5 min · escrever","titulo":"Sugerir em vez de explicar","subtitulo":"O que os três poetas e o conto do módulo têm em comum","niveis":["Ouvir a diferença","Escrever sem dizer"],"emblemas":[[0.8,"Mão leve","Já confias no leitor: mostras e deixas que ele conclua."],[0.5,"Bom começo","Repara: quem sugere dá um gesto, um objeto, um silêncio. Nunca o nome do sentimento."],[0,"A afinar","Procura a palavra que nomeia o sentimento. Se lá está, a frase explica."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Os poetas e a contista deste módulo têm um hábito em comum: <b>não dizem o que sentem, mostram o que acontece</b>. Quem lê é que conclui.</p><p>Uma frase <b>explica</b> quando dá o nome ao sentimento («estava triste»). <b>Sugere</b> quando dá um gesto, um objeto ou um silêncio e deixa o resto ao leitor.</p><p class=\"pequeno\">As frases deste exercício são nossas, feitas para treinar.</p>"},{"nivel":1,"tipo":"classificar","rot":"Explica ou sugere?","pergunta":"O que faz cada frase?","categorias":["explica","sugere"],"itens":[["Ela estava muito triste com a partida dele.",0],["Pôs dois pratos na mesa e voltou a guardar um.",1],["O Pedro tinha medo de voltar a casa.",0],["Deu três voltas ao quarteirão antes de meter a chave na porta.",1],["Estavam zangados um com o outro.",0],["Jantaram a ver televisão, cada um com o som do seu telemóvel.",1]],"retorno":"As três frases que sugerem não têm nenhuma palavra de sentimento: têm pratos, chaves, telemóveis. O leitor faz o resto."},{"nivel":2,"tipo":"texto","rot":"Sem dizer «saudade»","pergunta":"Escreve uma frase que mostre que alguém tem saudades de uma pessoa, sem usar «saudade», «falta» nem «triste».","minPalavras":8,"maxPalavras":30,"placeholder":"Todas as manhãs…"},{"nivel":2,"tipo":"texto","rot":"O teu objeto","pergunta":"Escolhe um objeto que tenhas aí à mão e usa-o para sugerir que o dono está nervoso. Uma ou duas frases.","minPalavras":8,"maxPalavras":35,"placeholder":"A caneta…"}],"fontes":[],"modulo":"M8","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Memorial-Da-Promessa-a-Pedra.html","id":"memorial-promessa","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · Memorial do Convento","titulo":"Da promessa à pedra","subtitulo":"O que a história oficial conta, e o que o romance foi buscar","niveis":["Os factos","O que o romance faz","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de entrelinhas da História","Já vês a diferença entre quem manda fazer e quem faz."],[0.5,"Bom começo","Tens as datas. Pergunta agora: quem carregou a pedra?"],[0,"A entrar no romance","Repara na ordem: primeiro o voto do rei, só no fim a festa."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Antes","html":"<p>O <b>Memorial do Convento</b> (1982), de José Saramago, conta a construção do convento de Mafra. A história oficial guarda datas e nomes de reis. Começa por pô-la por ordem.</p><p class=\"pequeno\">Os factos deste exercício vêm da Wikipédia («Palácio Nacional de Mafra»). Alguns historiadores duvidam de que tudo tenha nascido de uma promessa: é o que se conta desde a época.</p>"},{"nivel":1,"tipo":"ordenar","rot":"Treze anos","pergunta":"Põe por ordem o que a história oficial regista.","itens":["Em 1711, D. João V faz o voto de erguer um convento em Mafra se tiver descendência","Nasce a infanta D. Maria Bárbara","A 17 de novembro de 1717 lança-se a primeira pedra da basílica","No auge das obras, o estaleiro chega a juntar cerca de 52 mil trabalhadores","A 22 de outubro de 1730, dia dos anos do rei, a basílica é sagrada"],"retorno":"Repara em quem tem nome nesta lista: o rei e a infanta. Os 52 mil são um número."},{"nivel":2,"tipo":"unica","rot":"O que faz o romance","pergunta":"Desta história, o que é que Saramago vai buscar para o centro do livro?","opcoes":[["Os que carregaram a pedra, e um casal que nenhum arquivo registou: Baltasar e Blimunda","certo","Sim: o romance dá nome e vida a quem a história oficial deixou como número."],["A vida do arquiteto do convento","cuidado","O arquiteto aparece, mas não é dele o livro."],["As festas da sagração, contadas com admiração","cuidado","A festa está lá, vista com ironia por quem sabe o que custou."]]},{"nivel":3,"tipo":"texto","rot":"Dar nome","pergunta":"Escolhe uma obra grande que conheças (uma ponte, um estádio, uma estação). Quem a fez e não ficou com o nome? Dá-lhe um, em duas frases.","minPalavras":12,"maxPalavras":45,"placeholder":"Chamava-se… e todos os dias…"}],"fontes":[["Palácio Nacional de Mafra (Wikipédia)","https://pt.wikipedia.org/wiki/Pal%C3%A1cio_Nacional_de_Mafra"]],"modulo":"M9","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Oficina-Cortar-ate-ao-Osso.html","id":"oficina-cortar","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Oficina · 5 min · rever","titulo":"Cortar até ao osso","subtitulo":"Oficina de escrita · rever é tirar o que não faz falta","niveis":["Cortar nos outros","Cortar em ti"],"emblemas":[[0.8,"Tesoura afiada","Cortas o que enfeita e deixas o que conta."],[0.5,"Bom começo","Procura primeiro os advérbios em -mente e os adjetivos aos pares."],[0,"A afinar","Pergunta a cada palavra: se saíres, a frase perde alguma coisa?"]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Um primeiro rascunho tem sempre palavras a mais. <b>Rever é cortar</b>: advérbios que repetem o verbo, adjetivos aos pares, «muito» e «realmente».</p><p>Regra de ouro: corta tudo o que puderes <b>sem perder quem faz o quê</b>.</p><p class=\"pequeno\">As frases deste exercício são nossas, feitas para treinar.</p>"},{"nivel":1,"tipo":"riscar","rot":"O pescador","pergunta":"Esta frase tem 22 palavras. Deixa-a com 14 ou menos.","frase":"Naquela manhã muito fria de inverno, o velho pescador saiu devagar de casa, completamente sozinho, e caminhou lentamente até ao pequeno cais.","limite":14,"essenciais":["pescador","saiu","cais"],"modelo":"Naquela manhã de inverno, o velho pescador saiu sozinho e caminhou até ao cais.","retorno":"«Devagar» e «lentamente» dizem o mesmo; «completamente» não acrescenta nada a «sozinho»."},{"nivel":1,"tipo":"riscar","rot":"A Marta","pergunta":"Agora esta: 22 palavras. Deixa-a com 12 ou menos.","frase":"A Marta ficou realmente muito, muito triste quando finalmente percebeu que o seu querido irmão mais novo já tinha partido para sempre.","limite":12,"essenciais":["Marta","irmão","partido"],"modelo":"A Marta ficou triste quando percebeu que o irmão tinha partido.","retorno":"Quanto mais «muito», menos se acredita. A frase curta dói mais."},{"nivel":2,"tipo":"texto","rot":"A tua frase","pergunta":"Vai buscar uma frase comprida que tenhas escrito esta semana (numa ficha, numa mensagem). Escreve aqui só a versão cortada.","minPalavras":6,"maxPalavras":25,"placeholder":"Depois do corte: …"}],"fontes":[],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Discurso-Tomar-Posse-1923.html","id":"posse-1923","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · discurso político","titulo":"Tomar posse em 1923","subtitulo":"Manuel Teixeira Gomes, 5 de outubro de 1923","niveis":["Ver o que o discurso faz","Ler a escolha","Fazer com o que leste"],"emblemas":[[0.8,"Ouvido político","Já ouves o que cada frase de um discurso está a fazer."],[0.5,"Bom começo","Pergunta a cada frase: promete, agradece, avisa ou pede?"],[0,"A afinar","Relê: um discurso de posse é feito de gestos, e cada frase é um."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Antes","html":"<p>A 5 de outubro de 1923, o escritor <b>Manuel Teixeira Gomes</b> toma posse como Presidente da República. O país está em crise. O discurso tem pouco mais de quinhentas palavras e cada frase faz um gesto: saúda, promete, avisa, confia.</p><p>Liga cada frase ao gesto que faz.</p>"},{"nivel":1,"tipo":"par","rot":"Cada frase, um gesto","pergunta":"Que gesto faz cada frase do discurso?","pares":[["«Espinhoso é o cargo de Presidente da República»","avisar que a tarefa é difícil"],["«Mantemos excelentes relações com todas as nações do Mundo»","tranquilizar sobre o país lá fora"],["«É quase angustiosa a crise que atravessam todas as nações europeias»","reconhecer o problema"],["«Tão vastos são porém os recursos naturais da nossa abençoada Pátria»","dar esperança"],["«Fio do patriotismo do Povo Português»","confiar no povo"],["«Viva a República Portuguesa!»","fechar com um grito de união"]],"retorno":"Repara na ordem: reconhece a crise, depois dá esperança, depois confia. É a escada de quase todos os discursos de posse."},{"nivel":2,"tipo":"unica","rot":"«Porém»","pergunta":"«Tão vastos são porém os recursos naturais…» O que faz a palavra «porém» neste ponto do discurso?","opcoes":[["Vira a página: depois de admitir a crise, começa a parte da esperança","certo","Sim. Um discurso que só reconhecesse a crise seria um lamento; o «porém» é a viragem."],["Contradiz o que disse antes, por descuido","cuidado","Não há descuido: a crise é real e os recursos também. O «porém» liga as duas coisas."],["Serve só para dar ritmo à frase","cuidado","Dá ritmo, mas sobretudo muda a direção do discurso."]]},{"nivel":3,"tipo":"texto","rot":"A tua posse","pergunta":"Tomas posse de alguma coisa (um clube, uma turma, um projeto). Escreve três frases com três gestos: reconhecer um problema, dar esperança, confiar em alguém.","minPalavras":20,"maxPalavras":60,"placeholder":"Sei que… Mas… Confio em…"}],"fontes":[["Manuel Teixeira Gomes, discurso de tomada de posse (5 de outubro de 1923), Diário do Congresso · Wikisource","https://pt.wikisource.org/wiki/Discurso_de_Tomada_de_Posse_do_Presidente_Manuel_Teixeira_Gomes"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Oficina-A-Frase-que-Manda.html","id":"oficina-frase-manda","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Oficina · 5 min · escrever","titulo":"A frase que manda","subtitulo":"Oficina de escrita · a frase curta, a frase longa e a ordem das coisas","niveis":["Ouvir o efeito","Escrever com intenção"],"emblemas":[[0.8,"Mão no volante","Já escolhes o comprimento e a ordem da frase pelo efeito que queres."],[0.5,"Bom começo","Lê as frases em voz alta: o fôlego diz-te o que cada uma faz."],[0,"A afinar","Pergunta a cada frase: onde está o choque, no princípio ou no fim?"]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Uma frase <b>curta</b> corta e dá choque. Uma frase <b>longa</b> estica o tempo e liga tudo. E a <b>ordem</b> também manda: dizer primeiro o que acontece («A grua tombou.») não é o mesmo que fazer esperar («Ao fim da tarde, quando já ninguém olhava, a grua tombou.»).</p><p class=\"pequeno\">As frases deste exercício são nossas, feitas para treinar.</p>"},{"nivel":1,"tipo":"classificar","rot":"Choque ou espera?","pergunta":"Em cada frase, o acontecimento chega logo (choque) ou faz-se esperar (espera)?","categorias":["choque","espera"],"itens":[["A porta abriu-se.",0],["Depois de três batidas, de um silêncio e de mais uma batida, a porta abriu-se.",1],["Perdeu o comboio.",0],["Com o bilhete na mão, a correr pela plataforma, a ver as portas a fechar-se, perdeu o comboio.",1]],"retorno":"O choque vem da frase curta com o verbo logo no início; a espera vem da frase longa que guarda o verbo para o fim."},{"nivel":1,"tipo":"par","rot":"Cada frase, um efeito","pergunta":"Liga cada frase ao efeito que produz.","pares":[["Ninguém respondeu.","corte seco: o silêncio pesa"],["A chuva caía, e caía, e continuava a cair sobre os telhados, sobre a rua, sobre nós.","o tempo estica-se"],["Foi então que ele viu a carta em cima da mesa, aberta.","a surpresa fica para o fim"],["Abriu a carta, leu-a, rasgou-a.","três ações em ritmo de martelo"]],"retorno":"O comprimento e a ordem não são enfeite: são o ritmo do que acontece."},{"nivel":2,"tipo":"texto","rot":"Duas versões","pergunta":"Escreve o mesmo acontecimento (alguém chega atrasado a um sítio) em duas frases: uma de choque, outra de espera.","minPalavras":12,"maxPalavras":50,"placeholder":"Choque: … Espera: …"}],"fontes":[],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Responder-Faz-o-que-o-Verbo-Pede.html","id":"responder-verbo","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Responder · 5 min · teste e prova","titulo":"Faz o que o verbo pede","subtitulo":"Identifica, refere, compara, caracteriza, interpreta: cinco verbos, cinco respostas diferentes","niveis":["Ler o verbo","Julgar respostas","Escrever a tua"],"emblemas":[[0.8,"Corretor de serviço","Já vês numa resposta o que falta antes do professor."],[0.5,"Bom começo","Pergunta sempre: onde está a prova? e a ligação entre a prova e a ideia?"],[0,"A afinar","Relê o verbo da pergunta: cada um pede uma coisa diferente."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Numa pergunta de teste, o <b>verbo</b> diz o que a resposta tem de fazer. Uma resposta boa não é longa nem bonita: faz <b>exatamente</b> o que o verbo pede, com <b>prova</b> no texto.</p><p class=\"pequeno\">As respostas de aluno deste exercício são nossas, feitas para treinar. O quadro completo dos verbos está no documento «Responder com precisão».</p>"},{"nivel":1,"tipo":"par","rot":"Cada verbo, um pedido","pergunta":"Liga cada verbo ao que ele pede.","pares":[["Identifique","o nome preciso, sem comentário a mais"],["Refira dois aspetos","exatamente dois, diferentes, cada um com prova"],["Compare","semelhança ou diferença, com os dois lados nomeados"],["Caracterize","um traço e a manifestação concreta desse traço"],["Interprete","um sentido proposto, com prova e coerência com o todo"]],"retorno":"Cinco verbos, cinco moldes. O erro mais comum é responder a «identifique» com uma interpretação, e a «interprete» com um resumo."},{"nivel":2,"tipo":"julgar","rot":"Passa ou não passa?","pergunta":"A pergunta era: «Caracterize Inês Pereira, com base no texto.» Julga cada resposta.","casos":[["Inês é ambiciosa e sonhadora.",false,"Não passa: dois adjetivos soltos, sem prova nem manifestação concreta."],["Inês é ambiciosa: recusa o lavrador e quer um marido «que saiba tanger» e falar de amores, como diz à mãe.",true,"Passa: um traço, a manifestação concreta e a referência ao texto."],["Inês Pereira é a protagonista da farsa de Gil Vicente, que casa duas vezes.",false,"Não passa: conta o enredo em vez de caracterizar."],["Inês quer mudar de vida, o que se vê quando prefere o escudeiro ao lavrador, apesar dos avisos.",true,"Passa: traço («quer mudar de vida») com a manifestação no texto."]],"retorno":"Repara: as duas que passam têm um traço e a prova. As duas que não passam ou não provam ou não caracterizam."},{"nivel":3,"tipo":"texto","rot":"A tua resposta","pergunta":"Escolhe uma personagem de um texto que estejas a estudar e caracteriza-a numa frase que passe: um traço e a manifestação concreta, com a expressão do texto entre aspas.","minPalavras":15,"maxPalavras":50,"placeholder":"… é …: «…»"}],"fontes":[["EPI · Português 2026/2027, documento comum 14, «Responder com precisão»",""]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Habitos-Os-Cinco.html","id":"habitos-cinco","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Pensar · 5 min · hábitos criativos","titulo":"Os cinco hábitos","subtitulo":"Inquisitivo, persistente, imaginativo, colaborativo, disciplinado","niveis":["Reconhecer","Olhar para ti"],"emblemas":[[0.8,"Olho treinado","Já reconheces um hábito criativo quando o vês em ação."],[0.5,"Bom começo","Relê as cinco definições: cada hábito é um verbo (perguntar, insistir, imaginar, partilhar, rever)."],[0,"A afinar","Pergunta a cada cena: o que é que esta pessoa está a fazer, exatamente?"]],"passos":[{"nivel":1,"tipo":"leitura","rot":"A ideia","html":"<p>Pensar de forma criativa não é um dom: são <b>cinco hábitos</b> que se treinam. <b>Inquisitivo</b>: pergunta, duvida, investiga o porquê. <b>Persistente</b>: aguenta a dificuldade e a incerteza. <b>Imaginativo</b>: gera ideias e faz ligações inesperadas. <b>Colaborativo</b>: partilha, dá e recebe crítica. <b>Disciplinado</b>: revê, corrige, acaba.</p><p class=\"pequeno\">Modelo de Lucas, Claxton e Spencer (OCDE, 2013), usado no documento «Hábitos de pensamento criativo». As cenas são nossas.</p>"},{"nivel":1,"tipo":"classificar","rot":"Que hábito é?","pergunta":"Em cada cena, que hábito está a trabalhar?","categorias":["inquisitivo","persistente","imaginativo","colaborativo","disciplinado"],"itens":[["Antes de filmar, a Sara pergunta ao grupo porque é que a cena tem de ser à noite.",0],["A terceira versão do cartaz também não resultou; o Tiago começa a quarta.",1],["Para o anúncio de um dicionário, o Nuno propõe filmar só mãos.",2],["A Rita mostra o rascunho a dois colegas e apontou o que lhe disseram antes de responder.",3],["A Inês leu o texto em voz alta, cortou três frases e só depois entregou.",4],["O Miguel quis saber de onde vinha a palavra «tabacaria» antes de fazer a legenda.",0]],"retorno":"Nenhum destes hábitos é «talento». Todos são coisas que se fazem, e por isso se podem fazer mais vezes."},{"nivel":2,"tipo":"deslizar","rot":"O teu ponto fraco","pergunta":"Entre estes dois, qual te custa mais?","esquerda":"persistir (insistir quando não sai)","direita":"disciplinar (rever e acabar)"},{"nivel":2,"tipo":"texto","rot":"O próximo módulo","pergunta":"Escolhe um dos cinco hábitos para treinar no próximo módulo e diz uma coisa concreta que vais fazer diferente.","minPalavras":10,"maxPalavras":40,"placeholder":"Vou treinar o hábito … : da próxima vez, …"}],"fontes":[["Lucas, B., Claxton, G. e Spencer, E. (2013), Progression in Student Creativity in School, OECD Education Working Papers n.º 86","https://www.oecd.org/en/publications/progression-in-student-creativity-in-school_5k4dp59msdwk-en.html"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Palavras-Chao-e-Plano.html","id":"palavras-dobretes","cor":"#6b4a8c","corEscura":"#c1a3dd","marca":"Palavras · 5 min · léxico e história da língua","titulo":"Chão e plano","subtitulo":"Duas vias para a mesma palavra latina","niveis":["Reconhecer","Explicar","Escolher com intenção"],"emblemas":[[0.8,"Ouvido para a língua","Já escolhes as palavras pelo efeito, não pelo acaso."],[0.5,"Bom começo","Percebeste os pares. Falta usar a diferença na escrita."],[0,"A afinar","Volta aos pares: uma palavra vem do uso, a outra veio dos livros."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Duas vias","html":"<p>Muitas palavras latinas chegaram ao português por <b>duas vias</b>: a <b>popular</b>, gasta pelo uso de todos os dias, e a <b>erudita</b>, copiada mais tarde dos livros. Daí os <b>dobretes</b>:</p><p><b>chão</b> e <b>plano</b> (de <i>planus</i>) · <b>chato</b> e <b>prato</b> (de <i>platus</i>) · <b>rezar</b> e <b>recitar</b> (de <i>recitare</i>)</p><p>A palavra popular é curta e bate no estômago; a erudita é mais distante e formal. A escolha nunca é inocente: diz quem fala e para quem.</p>","links":[["Ver mais dobretes (Wikipédia)","https://pt.wikipedia.org/wiki/Dobrete"]]},{"nivel":1,"tipo":"unica","rot":"O par","pergunta":"Qual destes pares NÃO é um dobrete (mesma origem, duas vias)?","opcoes":[["chão / plano","cuidado","É dobrete: os dois vêm de <i>planus</i>."],["cheio / pleno","cuidado","É dobrete: os dois vêm de <i>plenus</i>."],["casa / lar","certo","Certo: são sinónimos, mas de origens diferentes. Não é o mesmo caso."]]},{"nivel":1,"tipo":"multi","rot":"Popular ou erudita","pergunta":"Toca nas palavras que chegaram pela via popular (gastas pelo uso).","opcoes":[["chão",5,"Sim: perdeu o «pl-» latino, como acontece na fala."],["chama",5,"Sim, de <i>flamma</i>: o mesmo desgaste."],["pleno",0,"Erudita: guarda o «pl-» do latim."],["recitar",0,"Erudita: veio dos livros, ao lado de «rezar»."]]},{"nivel":2,"tipo":"unica","rot":"O efeito","pergunta":"«Caiu ao chão» e «caiu ao plano»: porque é que a segunda soa estranha?","opcoes":[["Porque cada palavra ficou com os seus usos, e este não é o de «plano»","certo","Sim. «Plano» continua a ser uma superfície lisa — um plano inclinado, um plano de fundo —, mas não é a palavra para o sítio onde se cai."],["Porque «plano» perdeu o sentido físico e só serve para ideias","cuidado","Não perdeu: há planos inclinados, planos de mesa e, no teu curso, planos de filmagem."],["Porque «plano» é mais antiga","cuidado","É o contrário: entrou mais tarde, pela via dos livros."]]},{"nivel":2,"tipo":"cartoes","rot":"Quem fala assim","pergunta":"Escolhe uma personagem e diz que palavra do par ela usaria, e porquê.","cartoes":[["Um trabalhador de Cesário","Fala do que vê e toca."],["Um sermão de Vieira","Fala para convencer, com solenidade."],["Uma publicação tua","Fala para ser lida depressa."],["Um relatório do curso","Fala para ser exato."]]},{"nivel":3,"tipo":"texto","rot":"Duas versões","pergunta":"Escreve a mesma frase duas vezes: uma só com palavras populares, outra com palavras eruditas. Até 40 palavras no total.","minPalavras":12,"maxPalavras":40,"placeholder":"Versão 1… / Versão 2…"},{"nivel":3,"tipo":"detalhes","rot":"Caderno de palavras","pergunta":"Escolhe uma palavra que encontraste nas tuas leituras desta semana. Indica onde a leste, explica o que significa ali e escreve uma frase com ela.","campos":["Palavra e onde a encontrei:","O que significa ali:","Uma frase minha com ela:"]}],"fontes":[["Wikipédia, «Dobrete»","https://pt.wikipedia.org/wiki/Dobrete"],["Dicionário Priberam (étimos e palavras divergentes)","https://dicionario.priberam.org"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Gramatica-Saramago-Falas.html","id":"gramatica-saramago","cor":"#8c2f2f","corEscura":"#e08a8a","marca":"Gramática em contexto · 5 min · M9 Saramago","titulo":"Quem fala aqui?","subtitulo":"Discurso, coesão e pontuação em Saramago","niveis":["Reconhecer","Provar com um teste","Usar na tua escrita"],"emblemas":[[0.8,"Leitor de vozes","Sabes ver quem fala mesmo quando não há travessão."],[0.5,"Bom caminho","Já distingues as vozes. Falta o teste da transformação."],[0,"A construir","Volta às maiúsculas: são elas que marcam a fala."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Como funciona","html":"<p>Em Saramago, as falas <b>não levam travessão nem aspas</b>: separam-se por vírgulas e a fala seguinte começa por <b>maiúscula</b>. O narrador comenta, ironiza e salta no tempo, tudo dentro do mesmo período.</p><p>Exemplo do tipo que vais encontrar no <i>Memorial do Convento</i>:</p><p><i>Disse o padre, Blimunda, que vês tu quando olhas para dentro das pessoas, Vejo o que está por dentro, respondeu ela, e o padre calou-se.</i></p><p class=\"nota\">Frase construída para o exercício, com a pontuação do autor. O romance tem direitos: lê-o no livro.</p>","links":[["Sobre o Memorial do Convento (RTP Ensina)","https://ensina.rtp.pt/artigo/a-critica-de-jose-saramago-ao-reinado-de-d-joao-v/"]]},{"nivel":1,"tipo":"multi","rot":"Marcas da fala","pergunta":"O que marca a mudança de voz neste tipo de escrita?","opcoes":[["A maiúscula depois da vírgula",5,"Sim: é o sinal principal."],["Os verbos declarativos (disse, respondeu)",5,"Sim: ajudam a identificar quem fala."],["O travessão",0,"Não existe: é essa a marca do estilo."],["As aspas",0,"Também não são usadas."]]},{"nivel":1,"tipo":"unica","rot":"Discurso","pergunta":"«Vejo o que está por dentro, respondeu ela» é discurso…","opcoes":[["direto, sem marcas convencionais","certo","Sim: são as palavras dela, na primeira pessoa, sem travessão."],["indireto","cuidado","Teste: no indireto seria «respondeu que via o que estava por dentro» — o tempo verbal mudaria."],["indireto livre","cuidado","No indireto livre não haveria verbo declarativo a seguir."]]},{"nivel":2,"tipo":"unica","rot":"Transformar","pergunta":"Um narrador que não participou na conversa relata, mais tarde, a pergunta feita a Blimunda: «Que vês tu quando olhas para dentro das pessoas». Qual é a forma adequada a esta situação?","opcoes":[["Perguntou-lhe o que via quando olhava para dentro das pessoas.","certo","Sim: quem relata está fora da conversa e fala de terceiros, por isso ajusta pessoa e tempo."],["Perguntou-lhe que vês tu quando olhas para dentro das pessoas.","cuidado","Ficaram formas do discurso direto: «vês», «tu», «olhas». O relato não as acompanha."],["Perguntou o que vias quando olhavas para dentro das pessoas.","cuidado","Esta frase é correta — se quem relata falar com a própria Blimunda. Aqui o narrador fala de fora, e por isso a terceira pessoa é que assenta."]]},{"nivel":2,"tipo":"multi","rot":"Coesão","pergunta":"Que mecanismos mantêm o texto coeso apesar da pontuação pouco convencional?","opcoes":[["Pronomes que retomam («ela», «lhe»)",5,"Sim: coesão referencial."],["Repetição de palavras-chave («dentro»)",5,"Sim: coesão lexical."],["Conectores orais («e», «pois»)",5,"Sim: encadeiam como na fala."],["Parágrafos curtos",0,"Em Saramago, os parágrafos são longos: a coesão faz-se por dentro."]]},{"nivel":3,"tipo":"texto","rot":"À maneira dele","pergunta":"Escreve um diálogo de três falas à maneira de Saramago: sem travessões, com maiúscula a marcar cada voz e um comentário do narrador. Até 50 palavras.","minPalavras":20,"maxPalavras":50,"placeholder":"Disse ele, …"},{"nivel":3,"tipo":"detalhes","rot":"Etiquetar","pergunta":"No teu diálogo, identifica:","campos":["Onde muda a voz:","Um mecanismo de coesão:","O comentário do narrador:"]}],"fontes":[["RTP Ensina: a crítica de Saramago ao reinado de D. João V","https://ensina.rtp.pt/artigo/a-critica-de-jose-saramago-ao-reinado-de-d-joao-v/"],["Ficha M9-F03 · A voz que conta","https://ensina.rtp.pt/artigo/memorial-do-convento-de-jose-saramago/"]],"modulo":"M9","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"O-Espelho-Machado.html","id":"espelho-machado","cor":"#2f5d7c","corEscura":"#7fb4d6","marca":"Ler a fundo · 5 min · identidade","titulo":"O Espelho","subtitulo":"Machado de Assis, 1882","emblemas":[[0.8,"Leitor minucioso","Foste ao pormenor e defendeste leituras com o texto."],[0.5,"Leitor atento","Boas leituras. Volta a um passo e tenta ir mais fundo."],[0,"Leitor em construção","Começaste. Relê o texto e tenta outra vez."]],"passos":[{"tipo":"leitura","rot":"Ler","html":"<p>Num conto de <b>Machado de Assis</b> («O Espelho», <i>Papéis Avulsos</i>, 1882), um homem recebe o posto de <b>alferes</b> (uma patente militar) e a família passa a tratá-lo por «senhor alferes».</p><p>Ele conta: «<b>Cada criatura humana traz duas almas consigo: uma que olha de dentro para fora, outra que olha de fora para dentro…</b>» E mais à frente: «<b>O alferes eliminou o homem.</b> […] ficou-me uma parte mínima de humanidade.»</p><p>O texto está inteiro, de graça, na Wikisource.</p>","links":[["Ler o conto inteiro (Wikisource)","https://pt.wikisource.org/wiki/O_Espelho"]],"nota":"Domínio público: podes ler, imprimir e partilhar."},{"tipo":"unica","rot":"O que foi eliminado","pergunta":"Quando diz «o alferes eliminou o homem», o que aconteceu?","opcoes":[["Alguém morreu no conto.","cuidado","Não: ninguém morre. Pensa em duas maneiras de ser a mesma pessoa."],["A pessoa passou a ver-se só pelo cargo.","certo","Sim. A identidade encolheu até caber no posto: os outros tratam-no pela patente e ele passa a ver-se assim."],["Ele deixou o exército.","cuidado","O contrário: é o posto que passa a ocupar tudo."]]},{"tipo":"multi","rot":"Alma exterior","pergunta":"Machado diz que a «alma exterior» pode ser muita coisa. Toca no que hoje funciona como alma exterior das pessoas.","opcoes":[["O número de seguidores",5,"É um bom exemplo atual: um número que passa a dizer quem somos."],["A farda ou a bata do curso",5,"Sim: uma roupa que dá lugar e função, como a patente do conto."],["Uma máquina ou ferramenta de que não largamos",5,"Machado fala mesmo de «um objeto, uma operação»."],["Aquilo em que acreditamos quando ninguém vê",0,"Isso está mais perto da alma <b>interior</b>, a que olha de dentro para fora."]]},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e diz numa linha o que tem a ver com o conto.","cartoes":[["3.º ano · Fernando Pessoa","Heterónimos: ser vários e não caber num só nome."],["2.º ano · Frei Luís de Sousa","O Romeiro responde «Ninguém»: quem perde o nome perde o lugar no mundo."],["Curso · retrato e perfil","Uma fotografia de perfil mostra a pessoa ou a função?"],["Hoje","Como te apresentas quando não podes falar de notas nem de seguidores?"]]},{"tipo":"texto","rot":"Duas linhas","pergunta":"Escreve duas frases sobre ti: a primeira como os outros te identificam; a segunda com algo que esse rótulo esconde.","minPalavras":12,"placeholder":"Para os outros sou… / Mas também…"},{"tipo":"texto","rot":"O teu espelho","pergunta":"Se um objeto teu fosse a tua «alma exterior», qual seria e porquê? Uma frase.","minPalavras":8,"maxPalavras":30,"placeholder":"Seria… porque…"}],"fontes":[["Machado de Assis, «O Espelho» (Papéis Avulsos, 1882) · Wikisource","https://pt.wikisource.org/wiki/O_Espelho"],["Machado de Assis, Papéis Avulsos (1882), índice · Wikisource","https://pt.wikisource.org/wiki/Pap%C3%A9is_avulsos"]],"modulo":"Comum","imagemData":""},{"pasta":"Olhares","ficheiro":"Duas-Legendas.html","id":"duas-legendas","cor":"#4a4a4a","corEscura":"#bdbdbd","marca":"Olhares · 5 min · imagem e palavra","titulo":"Duas legendas","subtitulo":"O que a palavra faz à imagem","emblemas":[[0.8,"Olho de fotógrafo","Viste o que muitos não veem e imaginaste com base na imagem."],[0.5,"Olhar atento","Bom olhar. Na próxima, procura mais um pormenor."],[0,"Olhar em treino","Começaste. Observa outra vez, devagar."]],"passos":[{"tipo":"leitura","rot":"A experiência","html":"<p>Imagina uma fotografia: <b>uma pessoa diante de um espelho</b>. Agora imagina duas legendas para a mesma fotografia:</p><p>A — «Finalmente encontrou o seu lugar.»<br>B — «Já só consegue ver a sua função.»</p><p>A imagem é a mesma. O que muda é o que a palavra te manda ver. No conto «O Espelho», de Machado de Assis (1882), um homem passa a ver-se só pelo posto militar que recebeu: «O alferes eliminou o homem.»</p>","links":[["Ler o conto (Wikisource)","https://pt.wikisource.org/wiki/O_Espelho"]]},{"tipo":"unica","rot":"Mais perto de Machado","pergunta":"Qual das legendas está mais perto da frase do conto?","opcoes":[["A — «Finalmente encontrou o seu lugar.»","cuidado","É uma leitura possível do início (a família festeja o posto), mas o conto acaba noutro sítio: a pessoa quase desaparece."],["B — «Já só consegue ver a sua função.»","certo","Sim: «ficou-me uma parte mínima de humanidade». A função ocupou o lugar da pessoa."],["As duas, em momentos diferentes.","certo","Defensável: primeiro o orgulho, depois o vazio. Boa leitura do percurso do conto."]]},{"tipo":"multi","rot":"Observar e acrescentar","pergunta":"Numa fotografia de alguém ao espelho, o que é mesmo <b>observável</b>?","opcoes":[["A roupa que a pessoa tem vestida",5,"Observável: está na imagem."],["A direção do olhar",5,"Observável, se se vir o rosto ou o reflexo."],["Que está orgulhosa",0,"Isso é interpretação: acrescentas tu, a partir de pistas."],["Que acabou de ser promovida",0,"Interpretação (ou invenção): a imagem não diz isso."]]},{"tipo":"texto","rot":"A tua legenda A","pergunta":"Fotografa mentalmente (ou mesmo com o telemóvel) um objeto à tua frente. Escreve uma legenda que o torne importante. Máximo 15 palavras.","minPalavras":4,"maxPalavras":15,"placeholder":"Legenda A…"},{"tipo":"texto","rot":"A tua legenda B","pergunta":"Agora outra legenda para a mesma imagem, que a faça ler ao contrário. Máximo 15 palavras.","minPalavras":4,"maxPalavras":15,"placeholder":"Legenda B…"},{"tipo":"cartoes","rot":"Onde isto acontece","pergunta":"Escolhe um caso e explica numa linha como a legenda muda o que vemos.","cartoes":[["Notícia","A mesma fotografia com dois títulos diferentes em dois jornais."],["Rede social","A mesma imagem com uma legenda irónica ou séria."],["Exposição","A ficha ao lado da obra diz-te o que procurar."],["Escola","A legenda de um trabalho teu no mural."]]},{"tipo":"texto","rot":"Regra minha","pergunta":"Escreve uma regra tua para legendar com honestidade: o que uma legenda pode e não pode fazer.","minPalavras":10,"placeholder":"Uma legenda pode…, mas não pode…"}],"fontes":[["Machado de Assis, «O Espelho» (1882) · Wikisource","https://pt.wikisource.org/wiki/O_Espelho"],["Wikipédia, «Crítica de arte» (descrever, analisar, interpretar)","https://pt.wikipedia.org/wiki/Cr%C3%ADtica_de_arte"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Pastelaria.html","id":"pastelaria","cor":"#b5542a","corEscura":"#e8916a","marca":"Ler a fundo · 5 min · poesia do séc. XX","titulo":"Pastelaria","subtitulo":"Mário Cesariny","emblemas":[[0.8,"Leitor minucioso","Foste ao pormenor e defendeste leituras com o texto."],[0.5,"Leitor atento","Boas leituras. Volta a um passo e tenta ir mais fundo."],[0,"Leitor em construção","Começaste. Relê o texto e tenta outra vez."]],"passos":[{"tipo":"leitura","rot":"Ouvir e ler","html":"<p>Mário Cesariny (Lisboa, 1923–2006) é considerado o principal representante do surrealismo português. O Grupo Surrealista de Lisboa reunia-se numa pastelaria: a Pastelaria Mexicana.</p><p><b>Abre o poema, ouve-o dito pelo ator Marco D'Almeida e lê-o até ao fim.</b> Depois volta aqui.</p>","links":[["Abrir o poema e o áudio (RTP Ensina)","https://ensina.rtp.pt/artigo/mario-cesariny-poesia/"]],"nota":"O poema está protegido por direitos de autor: lê-o na página da RTP Ensina."},{"tipo":"unica","rot":"O que se repete","pergunta":"Que expressão abre muitos versos do poema?","opcoes":[["«Afinal o que importa»","certo","Sim. Repetir a mesma expressão no início de vários versos chama-se <b>anáfora</b>. Cria ritmo e insistência, como quem martela uma ideia."],["«Gerente!»","cuidado","Aparece, mas uma vez só, perto do fim. Procura o que se repete no início dos versos."],["«lá fora»","cuidado","Aparece no fim. Volta à página e procura o que abre vários versos."]]},{"tipo":"unica","rot":"A sério ou a brincar?","pergunta":"Quando o poema diz o que «importa», está a falar a sério?","opcoes":[["Sim: é uma lista de bons conselhos.","cuidado","Relê o verso sobre a fome: diz-se uma coisa grave com ar de quem não se importa. Isso é <b>ironia</b>: dizer uma coisa para mostrar o contrário."],["Nem sempre: muitas vezes é irónico.","certo","Defensável. A ironia deixa o leitor desconfiado e obriga-o a pensar no que realmente importa."],["Mistura as duas coisas.","certo","Defensável. Há versos que soam a crítica e outros que parecem mesmo um desafio a «não ter medo»."]]},{"tipo":"multi","rot":"Onde há coragem?","pergunta":"Toca em tudo o que achas que aparece no poema como coragem.","opcoes":[["Reclamar em voz alta com o gerente",5,"Está lá: dizer alto, «ao pé de muita gente», o que está mal."],["Não ter medo",5,"É a expressão que o poema repete como o que importa."],["Ir à bola e ao cinema",0,"Aparece, mas mais como distração do quotidiano do que como coragem."],["Ficar calado para não incomodar",0,"O poema defende o contrário: dizer, e dizer alto."]]},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e diz numa linha em que se parece com «Pastelaria».","cartoes":[["3.º ano · Álvaro de Campos","«Tabacaria»: outra loja de rua, outro olhar sobre a vida de todos os dias."],["2.º ano · Cesário Verde","«O Sentimento dum Ocidental»: a cidade observada, com o que nela não está bem."],["Arte · Surrealismo","Um grupo de artistas que se juntava numa pastelaria de Lisboa para inventar outra maneira de ver o real."],["Hoje","Um café, uma loja, um ecrã: onde é que hoje se diz «o que importa»?"]]},{"tipo":"texto","rot":"O teu verso","pergunta":"Escreve o teu verso à maneira de Cesariny. Começa por «Afinal o que importa é…» e usa no máximo 12 palavras.","maxPalavras":12,"minPalavras":5,"placeholder":"Afinal o que importa é…"},{"tipo":"texto","rot":"Não ter medo","pergunta":"Numa sociedade livre, de que é preciso não ter medo? Uma frase, com um exemplo real (sem nomes de pessoas).","minPalavras":8,"placeholder":"É preciso não ter medo de…"}],"fontes":[["RTP Ensina, «Pastelaria», de Mário Cesariny (programa Voz)","https://ensina.rtp.pt/artigo/mario-cesariny-poesia/"],["Wikipédia, «Mário Cesariny»","https://pt.wikipedia.org/wiki/M%C3%A1rio_Cesariny"],["Arquivo Pessoa, «Tabacaria»","http://arquivopessoa.net/textos/163"]],"modulo":"M8","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Biblioteca-em-Fogo.html","id":"biblioteca-fogo","cor":"#9b3b25","corEscura":"#e08a70","marca":"Ler a fundo · 5 min · arte e memória","titulo":"A Biblioteca em Fogo","subtitulo":"Maria Helena Vieira da Silva, 1974","emblemas":[[0.8,"Olho de fotógrafo","Viste o que muitos não veem e imaginaste com base na imagem."],[0.5,"Olhar atento","Bom olhar. Na próxima, procura mais um pormenor."],[0,"Olhar em treino","Começaste. Observa outra vez, devagar."]],"passos":[{"tipo":"leitura","rot":"Olhar","html":"<p>Maria Helena Vieira da Silva (Lisboa, 1908 – Paris, 1992) pintou <i>La bibliothèque en feu</i> (<i>A Biblioteca em Fogo</i>) em 1974. É um óleo sobre tela do Centro de Arte Moderna Gulbenkian, em Lisboa.</p><p><b>Abre a página da obra e olha durante 30 segundos, sem ler nada.</b> Depois volta aqui.</p>","links":[["Ver a obra (Centro de Arte Moderna Gulbenkian)","https://gulbenkian.pt/cam/en/works/la-bibliotheque-en-feu-a-biblioteca-em-fogo-147131/"],["Ficha na Wikipédia (em inglês)","https://en.wikipedia.org/wiki/A_Library_Burning"]],"nota":"A imagem está protegida por direitos de autor: vê-a na página do museu."},{"tipo":"multi","rot":"O que vês","pergunta":"Toca no que reconheces na pintura.","opcoes":[["Retângulos verticais, como lombadas de livros",5,"A ficha da obra descreve retângulos verticais que lembram livros em prateleiras."],["Tons de vermelho e castanho",5,"A ficha fala em tons abafados de vermelho e castanho."],["Uma grelha, como estantes",5,"É uma boa leitura da estrutura: linhas e divisões que organizam o espaço."],["Outra coisa (guarda para o passo 5)",0,"Ótimo: o que vês e não está na lista é o mais interessante. Escreve-o no fim."]]},{"tipo":"unica","rot":"Onde está o fogo?","pergunta":"O título fala de fogo. Onde está ele, para ti?","opcoes":[["Nas cores quentes","certo","Defensável: o vermelho e o castanho podem ser brasas, calor, cinza."],["No título, mais do que na imagem","certo","Defensável: às vezes o título muda o que vemos. Sem ele, verias só uma biblioteca?"],["Na memória que se perde","certo","Defensável: uma biblioteca guarda memória; o fogo é a ameaça de a perder."]]},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e diz numa linha o que tem em comum com a pintura.","cartoes":[["Antiguidade · Egito","A Biblioteca de Alexandria: autores antigos contam que um incêndio destruiu muitas obras. A ficha da pintura diz que o título pode aludir a ela."],["Literatura · Estados Unidos, 1953","Fahrenheit 451, de Ray Bradbury: um futuro em que os livros são proibidos e queimados."],["História · Alemanha, 1933","As queimas de livros organizadas na Alemanha nazi."],["1.º ano · Fernão Lopes","Guarda-mor da Torre do Tombo: o arquivo que protege a memória de um país."]]},{"tipo":"texto","rot":"Salvar do fogo","pergunta":"Que livro, arquivo ou memória da tua comunidade salvarias de um incêndio? Porquê? Duas frases.","minPalavras":12,"placeholder":"Salvava… porque…"}],"fontes":[["Centro de Arte Moderna Gulbenkian, La bibliothèque en feu","https://gulbenkian.pt/cam/en/works/la-bibliotheque-en-feu-a-biblioteca-em-fogo-147131/"],["Wikipédia (en), «A Library Burning»","https://en.wikipedia.org/wiki/A_Library_Burning"],["Wikipédia, «Maria Helena Vieira da Silva»","https://pt.wikipedia.org/wiki/Maria_Helena_Vieira_da_Silva"],["Wikipédia, «Biblioteca de Alexandria»","https://pt.wikipedia.org/wiki/Biblioteca_de_Alexandria"],["Wikipédia, «Fahrenheit 451»","https://pt.wikipedia.org/wiki/Fahrenheit_451"],["Wikipédia (en), «Nazi book burnings»","https://en.wikipedia.org/wiki/Nazi_book_burnings"]],"modulo":"M9","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Terra-Firme-Benjamim.html","id":"terra-firme","cor":"#2f6f7a","corEscura":"#7fc4cf","marca":"Ler a fundo · 5 min · canção portuguesa","titulo":"Terra Firme","subtitulo":"Benjamim e Barnaby Keen, 2017","emblemas":[[0.8,"Leitor minucioso","Foste ao pormenor e defendeste leituras com o texto."],[0.5,"Leitor atento","Boas leituras. Volta a um passo e tenta ir mais fundo."],[0,"Leitor em construção","Começaste. Relê o texto e tenta outra vez."]],"passos":[{"tipo":"leitura","rot":"Ouvir","html":"<p>Benjamim é o nome artístico de Luís Nunes (Lisboa, 1986). Gravou o álbum <i>1986</i> (2017) com o músico inglês Barnaby Keen, em português e inglês. «Terra Firme» é a faixa 4.</p><p><b>Ouve a canção inteira, com atenção às palavras.</b> Depois volta aqui.</p>","links":[["Ouvir no Bandcamp oficial de Benjamim","https://eusouobenjamim.bandcamp.com/track/terra-firme"],["Ouvir no Spotify","https://open.spotify.com/track/2KNwNTzoxdXFsL7Yy16Bx6"]],"nota":"A letra está protegida por direitos de autor: ouve-a na plataforma oficial."},{"tipo":"multi","rot":"O que ouviste","pergunta":"Toca nas palavras que ouviste na canção.","opcoes":[["mar",5,"Está lá: é a imagem que atravessa a canção."],["corrente",5,"Está lá: a força que empurra e contra a qual se luta."],["porto",5,"Está lá: o lugar de chegada, abrigo."],["sobrevivente",5,"Está lá: quem chega depois de muito custo."],["comboio",0,"Não a confirmámos na letra. Ouve outra vez: a canção fica no mar."],["deserto",0,"Não a confirmámos na letra. Ouve outra vez."]]},{"tipo":"unica","rot":"Terra firme","pergunta":"Na canção, a «terra firme» é sobretudo…","opcoes":[["Um lugar seguro onde, por fim, se pousa","certo","Defensável: depois do mar, da corrente e do peso, é a imagem da estabilidade."],["Uma decisão ou uma pessoa que dá apoio","certo","Defensável: há um «eu» que fala a um «tu» em dificuldade. A terra firme pode ser quem fica ao lado."],["Uma chegada fácil, sem esforço","cuidado","A canção fala de «peso», «azar» e «corrente»: chegar custa."]]},{"tipo":"unica","rot":"Contra-mão","pergunta":"«Contra-mão» é uma palavra de que mundo?","opcoes":[["Da estrada: o sentido proibido do trânsito","certo","Sim. Numa canção de mar, surpreende: juntar dois <b>campos lexicais</b> (estrada e mar) cria uma imagem nova. No Acordo Ortográfico escreve-se «contramão»."],["Do mar: é um termo de navegação","cuidado","Não: diz-se do trânsito. É por isso que a palavra salta à vista numa canção de mar."],["Da música: tocar fora do ritmo","cuidado","Não: diz-se do trânsito, de quem circula no sentido proibido."]]},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e diz numa linha em que se parece com «Terra Firme».","cartoes":[["1.º ano · Martim Codax","«Ondas do mar de Vigo, / se vistes meu amigo?»: falar ao mar à espera de quem não chega."],["1.º ano · Camões, Os Lusíadas","O Velho do Restelo (canto IV): ficar em terra firme ou partir?"],["3.º ano · Pessoa, Mensagem","«Valeu a pena? Tudo vale a pena / Se a alma não é pequena.»"],["2.º ano · Padre António Vieira","O sermão aos peixes: o mar como retrato da sociedade."]]},{"tipo":"texto","rot":"A tua terra firme","pergunta":"O que é terra firme para ti, numa semana difícil? Duas frases, sem nomes de pessoas.","minPalavras":12,"placeholder":"A minha terra firme é… porque…"},{"tipo":"texto","rot":"Antes de escrever","pergunta":"Quem atravessa hoje o mar à procura de terra firme? Escreve a pergunta que farias a uma fonte fiável antes de publicar sobre isso.","minPalavras":8,"placeholder":"Perguntaria…"}],"fontes":[["Benjamim / Barnaby Keen, 1986 (Bandcamp oficial)","https://eusouobenjamim.bandcamp.com/album/1986"],["RTP, Festival da Canção: Benjamim","https://media.rtp.pt/festivaldacancao/compositores/benjamim/"],["Where the Music Meets, «Terra Firme» (2017, em inglês)","https://www.wherethemusicmeets.com/2017/03/01/benjamim-barneby-keen-terra-firme/"],["FCSH, «Ondas do mar de Vigo»","https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=1308"],["Arquivo Pessoa, «Mar Português»","http://arquivopessoa.net/textos/2405"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Ouvi-Dizer-Ornatos-Violeta.html","id":"ouvi-dizer","cor":"#6b4fa0","corEscura":"#b9a3e6","marca":"Ler a fundo · 5 min · canção portuguesa","titulo":"Ouvi Dizer","subtitulo":"Ornatos Violeta, 1999","emblemas":[[0.8,"Leitor minucioso","Foste ao pormenor e defendeste leituras com o texto."],[0.5,"Leitor atento","Boas leituras. Volta a um passo e tenta ir mais fundo."],[0,"Leitor em construção","Começaste. Relê o texto e tenta outra vez."]],"passos":[{"tipo":"leitura","rot":"Ouvir","html":"<p>Os Ornatos Violeta são uma banda do Porto, formada em 1991. «Ouvi Dizer» foi o primeiro single do álbum <i>O Monstro Precisa de Amigos</i> (1999). No fim, o ator Vítor Espadinha diz um texto.</p><p><b>Ouve a canção até ao fim, incluindo a parte dita.</b> Depois volta aqui.</p>","links":[["Ouvir no Spotify","https://open.spotify.com/search/Ornatos%20Violeta%20Ouvi%20Dizer"]],"nota":"A letra está protegida por direitos de autor: ouve-a na plataforma oficial."},{"tipo":"unica","rot":"O título","pergunta":"«Ouvi dizer» é uma maneira de…","opcoes":[["Contar o que outros disseram, sem garantir que é verdade","certo","Sim: é <b>discurso relatado</b>. A notícia chega em segunda mão, como um boato. O fim do amor é sabido por ouvir dizer."],["Dar uma ordem a alguém","cuidado","Não há imperativo. «Ouvi» é pretérito perfeito: alguém conta o que lhe chegou aos ouvidos."],["Descrever os sons da cidade","cuidado","A cidade aparece, mas «ouvi dizer» é sobre o que se diz, não sobre sons."]]},{"tipo":"multi","rot":"Imagens do amor","pergunta":"Toca nas expressões que mais dizem sobre este amor. Confirma-as ao ouvir.","opcoes":[["«amor é uma doença»",5,"<b>Metáfora</b> antiga: nas cantigas medievais, a «coita» é o sofrimento de amor."],["«a razão»",5,"Razão contra sentimento: um conflito da lírica desde os trovadores e Camões."],["«estúpida canção»",5,"A canção fala de si própria e desvaloriza-se: <b>autoironia</b>."],["«o mundo acaba amanhã»",5,"<b>Hipérbole</b>: tudo parece urgente e final."]]},{"tipo":"unica","rot":"Um desejo impossível","pergunta":"Em «pudesse eu pagar de outra forma», «pudesse» está no…","opcoes":[["Pretérito imperfeito do conjuntivo","certo","Sim: exprime um desejo que não se realiza. Repara na ordem: o verbo vem antes do sujeito («pudesse eu»)."],["Pretérito perfeito do indicativo","cuidado","Esse seria «pude». «Pudesse» é conjuntivo: desejo, hipótese."],["Futuro do indicativo","cuidado","Esse seria «poderei». «Pudesse» é conjuntivo."]]},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e explica-a numa linha.","cartoes":[["1.º ano · Cantigas de amigo","A ausência de quem se ama e o sofrimento de amor, a coita."],["1.º ano · Camões lírico","«Amor é fogo que arde sem se ver»: o amor como contradição."],["2.º ano · Camilo, Amor de Perdição","A paixão que perde quem ama."],["Hoje","Os versos desta canção foram escritos em paredes e tatuados (Altamont, 2024). Quando é que uma canção passa a ser de toda a gente?"]]},{"tipo":"texto","rot":"A cidade está deserta","pergunta":"O texto dito no fim começa por «A cidade está deserta». Continua-o com uma frase tua, sem nomes, sobre uma cidade depois de uma perda.","minPalavras":10,"maxPalavras":30,"placeholder":"A cidade está deserta e…"},{"tipo":"texto","rot":"Antes de partilhar","pergunta":"Um «ouvi dizer» pode magoar alguém. Que regra propões para a tua turma antes de partilhar o que ouviste?","minPalavras":10,"placeholder":"Antes de partilhar…"}],"fontes":[["Wikipédia, «O Monstro Precisa de Amigos»","https://pt.wikipedia.org/wiki/O_Monstro_Precisa_de_Amigos"],["Wikipédia, «Ornatos Violeta»","https://pt.wikipedia.org/wiki/Ornatos_Violeta"],["Altamont, «“Ouvi Dizer” – Ornatos Violeta» (2024)","https://altamont.pt/ouvi-dizer-ornatos-violeta/"],["Wikisource, Camões, «Amor é fogo que arde sem se ver»","https://pt.wikisource.org/wiki/Amor_%C3%A9_fogo_que_arde_sem_se_ver"]],"modulo":"Comum","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Capitao-Romance-Ornatos-Violeta.html","id":"capitao-romance","cor":"#1f5f99","corEscura":"#79aee0","marca":"Ler a fundo · 5 min · canção portuguesa","titulo":"Capitão Romance","subtitulo":"Ornatos Violeta com Gordon Gano, 1999","emblemas":[[0.8,"Leitor minucioso","Foste ao pormenor e defendeste leituras com o texto."],[0.5,"Leitor atento","Boas leituras. Volta a um passo e tenta ir mais fundo."],[0,"Leitor em construção","Começaste. Relê o texto e tenta outra vez."]],"passos":[{"tipo":"leitura","rot":"Ouvir","html":"<p>«Capitão Romance» foi o segundo single de <i>O Monstro Precisa de Amigos</i> (1999), dos Ornatos Violeta. Gordon Gano, vocalista da banda norte-americana Violent Femmes, canta com Manel Cruz, em português.</p><p><b>Ouve a canção inteira e repara no refrão.</b> Depois volta aqui.</p>","links":[["Ouvir no Spotify","https://open.spotify.com/track/6EuupyK5js5CVsm0QHaTq3"]],"nota":"A letra está protegida por direitos de autor: ouve-a na plataforma oficial."},{"tipo":"unica","rot":"O refrão","pergunta":"No refrão «Eu vi» / «mas não agarrei», o que liga as duas partes?","opcoes":[["Uma oposição entre ver e agarrar, marcada por «mas»","certo","Sim: <b>antítese</b> com conjunção adversativa. Teve a oportunidade diante dos olhos e deixou-a passar."],["Uma onomatopeia","cuidado","Não há imitação de sons. Há dois gestos opostos: ver e agarrar."],["Uma enumeração","cuidado","Uma enumeração junta vários elementos; aqui há dois que se opõem."]]},{"tipo":"unica","rot":"Hoje o mar sou eu","pergunta":"«Hoje o mar sou eu» é…","opcoes":[["Uma metáfora: o eu identifica-se com o mar","certo","Sim. O eu já não atravessa o mar: torna-se o mar. E «hoje» diz que é um estado, não para sempre."],["Uma comparação","cuidado","Não há «como». Com «como» seria comparação; sem ele, é metáfora."],["Uma personificação do mar","cuidado","Não é o mar que ganha traços humanos; é o eu que se torna mar."]]},{"tipo":"deslizar","rot":"Herói ou sonhador?","pergunta":"O Capitão Romance parece mais herói de aventuras ou sonhador que vê e não agarra?","esquerda":"herói de aventuras","direita":"sonhador"},{"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação e diz numa linha o que tem em comum com a canção.","cartoes":[["1.º ano · Camões, Os Lusíadas","O herói do mar e a viagem entre maravilha e perigo."],["3.º ano · Pessoa, «O Infante»","«Senhor, falta cumprir-se Portugal!»: uma missão por cumprir."],["3.º ano · Álvaro de Campos","«Tabacaria»: «tenho em mim todos os sonhos do mundo», e não realiza nenhum."],["Estados Unidos · Violent Femmes","Um cantor norte-americano a cantar em português: a canção atravessa culturas."]]},{"tipo":"texto","rot":"Eu vi","pergunta":"Escreve dois versos: um a começar por «Eu vi» e outro por «mas não agarrei», sobre uma oportunidade tua ou inventada.","minPalavras":6,"maxPalavras":20,"placeholder":"Eu vi… / mas não agarrei…"},{"tipo":"texto","rot":"Em comunidade","pergunta":"Que oportunidade coletiva (na escola, no bairro, no país) se vê e não se agarra? Uma frase com um exemplo real, sem nomes de pessoas.","minPalavras":10,"placeholder":"Vemos… mas não…"}],"fontes":[["Wikipédia, «O Monstro Precisa de Amigos»","https://pt.wikipedia.org/wiki/O_Monstro_Precisa_de_Amigos"],["Arquivo Pessoa, Mensagem, «O Infante»","http://arquivopessoa.net/textos/2375"],["Arquivo Pessoa, «Tabacaria»","http://arquivopessoa.net/textos/163"],["Wikipédia, «Os Lusíadas»","https://pt.wikipedia.org/wiki/Os_Lus%C3%ADadas"]],"modulo":"Comum","imagemData":""},{"pasta":"Olhares","ficheiro":"Pessoa-1914.html","id":"olhar-pessoa","cor":"#6c9a2f","corEscura":"#9fcb5e","marca":"Olhar · 5 min · M7 heterónimos","titulo":"Pessoa, 1914","subtitulo":"Fotografia","imagem":"pessoa-1914.jpg","credito":"Fernando Pessoa, fotografia de 1914 · domínio público · Wikimedia Commons","creditoUrl":"https://commons.wikimedia.org/w/index.php?curid=56775462","emblemas":[[0.8,"Olho de fotógrafo","Viste o que muitos não veem e imaginaste com base na imagem."],[0.5,"Olhar atento","Bom olhar. Na próxima, procura mais um pormenor."],[0,"Olhar em treino","Começaste. Observa outra vez, devagar."]],"passos":[{"tipo":"memoria","rot":"Memória","segundos":15,"pergunta":"Olha 15 segundos. Depois toca no que estava na fotografia.","elementos":[["Chapéu",true],["Óculos",true],["Bigode",true],["Gravata",true],["Bengala",false],["Cigarro",false]]},{"tipo":"unica","rot":"1914","pergunta":"Esta fotografia é de 1914. Segundo a carta de Pessoa a Casais Monteiro, a 8 de março desse ano nasceu…","opcoes":[["Alberto Caeiro","certo","Sim: o «dia triunfal», em que escreveu «trinta e tantos poemas a fio» de O Guardador de Rebanhos."],["Ricardo Reis","cuidado","Na carta, Reis tinha surgido antes, «sem que eu soubesse»; o dia triunfal é o de Caeiro."],["Álvaro de Campos","cuidado","Campos surge a seguir, com a «Ode Triunfal»."]]},{"tipo":"deslizar","rot":"Este rosto","pergunta":"Este rosto parece mais de quem vê ou de quem pensa?","esquerda":"vê (Caeiro)","direita":"pensa (Campos)"},{"tipo":"texto","rot":"Um heterónimo para este rosto","pergunta":"Inventa um heterónimo para esta fotografia: nome, profissão e uma frase que ele diria. Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"Nome… Profissão… Frase…"},{"tipo":"texto","rot":"Legenda","pergunta":"Legenda com exatamente 12 palavras.","exatoPalavras":12,"minPalavras":12,"placeholder":"Doze palavras exatas…"}],"fontes":[["Wikimedia Commons: Fernando Pessoa, 1914","https://commons.wikimedia.org/w/index.php?curid=56775462"],["Arquivo Pessoa: carta a Adolfo Casais Monteiro (13-1-1935)","http://arquivopessoa.net/textos/3007"]],"modulo":"M7","imagemData":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAYEBQUFBAYFB
