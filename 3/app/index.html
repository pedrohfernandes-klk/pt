"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M9 Saramago","titulo":"Aqui o mar acaba","subtitulo":"As margens de O Ano da Morte de Ricardo Reis: Camões, a ode e a carta de Pessoa","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor das margens","Sabes de onde vem a primeira frase, quem é Reis e o que a epígrafe lhe pede."],[0.5,"Bom começo","Já vês a inversão de Camões. Repara no que a epígrafe pede a um homem em 1936."],[0,"A chegar a Lisboa","Relê: um verso virado do avesso, uma ode como desafio, uma carta que inventa um homem."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><b>Camões</b>, sobre Portugal (Os Lusíadas, III, 20):</p><p><i>Onde a terra se acaba e o mar começa</i></p><p><b>Ricardo Reis</b>, o primeiro verso da ode que Saramago pôs como epígrafe:</p><p><i>Sábio é o que se contenta com o espectáculo do mundo</i></p><p><b>Fernando Pessoa</b>, na carta a Adolfo Casais Monteiro (13 de janeiro de 1935), sobre Ricardo Reis:</p><p><i>Ricardo Reis nasceu em 1887</i> […] <i>no Porto, é médico e está presentemente no Brasil</i> […] <i>desde 1919, pois se expatriou espontaneamente por ser monárquico</i></p><p>Saramago (1984) abre o romance com a frase «Aqui o mar acaba e a terra principia» e faz Reis regressar a Lisboa no fim de 1935, para viver 1936.</p><p class=\"nota\">O romance tem direitos: lê-se no livro. Aqui só as margens: o verso, a ode e a carta, todos de domínio público.</p>","links":[["Os Lusíadas, III, 20 (oslusiadas.org)","https://oslusiadas.org/iii/20.html"],["A carta a Casais Monteiro (Arquivo Pessoa)","http://arquivopessoa.net/textos/3007"]]},{"nivel":1,"tipo":"unica","rot":"A inversão","pergunta":"Camões: «Onde a terra se acaba e o mar começa». Saramago: «Aqui o mar acaba e a terra principia». O que muda?","opcoes":[["A ordem: de quem parte (terra → mar) para quem chega (mar → terra)","certo","O olhar da expansão vira olhar do regresso a um país fechado."],["Nada: dizem o mesmo","cuidado","As palavras são quase as mesmas; a ordem muda o ponto de vista."],["Saramago corrige um erro de Camões","cuidado","Não corrige: vira o verso do avesso de propósito."]]},{"nivel":1,"tipo":"par","rot":"Quem é Reis","pergunta":"Liga cada dado da carta de Pessoa ao que ele diz de Reis.","pares":[["nasceu em 1887","tem 48 anos quando regressa"],["no Porto, é médico","profissão e origem"],["está presentemente no Brasil","de onde Saramago o faz voltar"],["por ser monárquico","a razão do exílio: a República de 1910"]],"retorno":"Pessoa inventou-lhe a vida; Saramago aproveitou a porta aberta."},{"nivel":2,"tipo":"unica","rot":"A epígrafe","pergunta":"«Sábio é o que se contenta com o espectáculo do mundo.» Porque é que esta frase é um desafio ao protagonista?","opcoes":[["Porque o romance põe um homem que só quer assistir num ano, 1936, que exige tomar posição","certo","Guerra de Espanha, refugiados, a revolta dos marinheiros: assistir chega?"],["Porque Reis não é sábio","cuidado","Não é isso: é a sabedoria da contemplação posta à prova."],["Porque a frase é de Camões","cuidado","É de Ricardo Reis, o próprio protagonista."]]},{"nivel":2,"tipo":"julgar","rot":"Passa ou não passa","pergunta":"Quatro frases de um colega. Quais têm prova nos textos acima?","casos":[["Reis é um heterónimo com biografia inventada por Pessoa.",true,"Passa: a carta dá-lhe data, cidade, profissão e exílio."],["Reis saiu de Portugal por ser republicano.",false,"Não passa: «por ser monárquico»."],["A primeira frase do romance inverte um verso de Camões.",true,"Passa: III, 20, com a ordem trocada."],["A epígrafe pede ao leitor que aja.",false,"Não passa: pede o contrário, contentar-se com ver; é o romance que pergunta se chega."]],"retorno":"Prova é uma linha destes textos; o resto está no livro."},{"nivel":3,"tipo":"texto","rot":"Espectador ou participante","pergunta":"Escreve duas frases: uma situação em que és espectador e uma em que participas, e o que te faz passar de uma à outra. Até 35 palavras.","minPalavras":8,"maxPalavras":35,"placeholder":"Assisto quando … Participo quando … Passo de uma à outra quando …"}],"fontes":[["Luís de Camões, Os Lusíadas, III, 20 (oslusiadas.org)","https://oslusiadas.org/iii/20.html"],["Ricardo Reis, «Sábio é o que se contenta com o espectáculo do mundo» (Arquivo Pessoa)","http://arquivopessoa.net/textos/743"],["Fernando Pessoa, carta a Adolfo Casais Monteiro, 13/01/1935 (Arquivo Pessoa)","http://arquivopessoa.net/textos/3007"]],"modulo":"M9","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Quatro-Lentes-Autopsicografia.html","id":"lentes-poema","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M8 método","titulo":"Quatro lentes, um poema","subtitulo":"Treino com «Autopsicografia», de Fernando Pessoa (1931)","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Quatro lentes afinadas","Sabes por onde entrar num poema: tempo, tradição, quem escreve, a própria poesia."],[0.5,"Bom começo","Já distingues as lentes. Repara em qual delas este poema pede primeiro."],[0,"A afinar","Relê a caixa das lentes na ficha 1 e volta: cada pergunta é uma lente."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>As quatro lentes do módulo, treinadas num poema que já conheces:</p><p><i>O poeta é um fingidor<br>Finge tão completamente<br>Que chega a fingir que é dor<br>A dor que deveras sente.</i></p><p><i>E os que lêem o que escreve,<br>Na dor lida sentem bem,<br>Não as duas que ele teve,<br>Mas só a que eles não têm.</i></p><p><i>E assim nas calhas de roda<br>Gira, a entreter a razão,<br>Esse comboio de corda<br>Que se chama coração.</i></p><p class=\"nota\">As lentes: representações do contemporâneo · tradição literária · figurações do poeta · arte poética</p>","links":[["Ler no Arquivo Pessoa","http://arquivopessoa.net/textos/4234"]]},{"nivel":1,"tipo":"unica","rot":"A primeira lente","pergunta":"Que lente este poema pede primeiro?","opcoes":[["Arte poética: o poema fala do que é escrever poesia","certo","«O poeta é um fingidor»: o assunto é a própria poesia."],["Representações do contemporâneo","cuidado","Não há tempo histórico aqui: nem cidade, nem guerra, nem data."],["Tradição literária","cuidado","O poema não retoma um mito nem um autor: inventa uma definição."]]},{"nivel":1,"tipo":"par","rot":"Cada lente, uma pergunta","pergunta":"Liga cada lente à pergunta que ela faz.","pares":[["Representações do contemporâneo","Que mundo e que problemas do seu tempo aparecem?"],["Tradição literária","Que autores, formas ou mitos retoma ou contesta?"],["Figurações do poeta","Como se vê quem escreve?"],["Arte poética","O poema fala da própria poesia?"]],"retorno":"Quatro perguntas, sempre as mesmas: é assim que se entra em qualquer poema do módulo."},{"nivel":2,"tipo":"classificar","rot":"Que lente vê isto","pergunta":"Cada observação sobre o poema pertence a que lente?","categorias":["Figurações do poeta","Arte poética","Forma e recursos"],"itens":[["O poeta vê-se como alguém que finge, e finge até a dor verdadeira",0],["A poesia é uma dor lida, que não é a do poeta nem a do leitor",1],["Três quadras de redondilha maior com rima cruzada",2],["O coração é um comboio de corda: metáfora",2]],"retorno":"As lentes dizem de que fala o poema; a forma e os recursos dizem como o diz. Precisas das duas coisas."},{"nivel":2,"tipo":"julgar","rot":"Passa ou não passa","pergunta":"Quatro frases de um colega sobre o poema. Quais têm prova no texto?","casos":[["O poema é uma arte poética.",true,"Passa: define o que faz o poeta e o que sente quem lê."],["O poema fala do Portugal de 1931.",false,"Não passa: não há uma palavra sobre o país ou o tempo."],["O poeta apresenta-se como fingidor.",true,"Passa: é o primeiro verso."],["O poema retoma Camões.",false,"Não passa: não há verso, forma ou tema camoniano identificável."]],"retorno":"Uma lente só se usa quando o texto a pede: sem prova, é palpite."},{"nivel":3,"tipo":"texto","rot":"A tua lente","pergunta":"Escreve uma frase de análise deste poema com a lente «figurações do poeta», com um verso curto entre aspas. Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"O poeta vê-se como …, quando diz «…»."}],"fontes":[["Fernando Pessoa, «Autopsicografia» (Arquivo Pessoa)","http://arquivopessoa.net/textos/4234"]],"modulo":"M8","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"O-Conto-em-Sete-Perguntas.html","id":"conto-perguntas","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M8 conto","titulo":"O conto em sete perguntas","subtitulo":"As características do conto, num conto de dez linhas","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de contos","Sabes o que faz de um texto um conto, e o que ele deixa por dizer."],[0.5,"Bom começo","Já vês a unidade de ação. Repara no que o conto não explica."],[0,"A entrar no conto","Relê: uma sala, uma hora, uma pessoa, uma coisa que muda."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Um conto de dez linhas, escrito para este exercício:</p><p><i>Ana chegou à sala de espera às nove e sentou-se ao lado do relógio, porque era o único lugar de onde não via a porta do consultório. A senhora do balcão chamou dois nomes que não eram o dela. Às nove e vinte, Ana tirou da mala o envelope e voltou a guardá-lo sem o abrir. Um homem de casaco molhado entrou, olhou o relógio, olhou para ela, e sentou-se do outro lado. Às nove e meia chamaram «Ana Correia» e ela não se levantou. O homem levantou-se, e só então ela percebeu que também se chamava assim. Quando a porta se fechou atrás dele, Ana abriu o envelope, leu, dobrou-o em quatro e pô-lo no bolso do casaco que ele tinha deixado na cadeira.</i></p><p class=\"nota\">Texto escrito para este exercício, sem citações. As características do conto: unidade de ação, brevidade, concentração de tempo e espaço, poucas personagens.</p>"},{"nivel":1,"tipo":"multi","rot":"Concentração","pergunta":"O que está concentrado neste conto?","opcoes":[["O espaço: uma sala de espera",5,"Tudo acontece ali."],["O tempo: meia hora, das nove às nove e meia",5,"As horas marcam o conto."],["As personagens: Ana, a senhora do balcão, o homem",5,"Três, e uma delas quase não fala."],["A ação: várias histórias em paralelo",0,"Não: uma só ação, um envelope."]]},{"nivel":1,"tipo":"ordenar","rot":"Pela ordem","pergunta":"Põe os momentos por ordem.","itens":["Ana senta-se ao lado do relógio","Tira o envelope e volta a guardá-lo","Entra o homem de casaco molhado","Chamam «Ana Correia» e ela não se levanta","Ana lê o envelope e põe-no no bolso do casaco dele"],"retorno":"Situação, perturbação, clímax, desfecho: cabe em dez linhas."},{"nivel":2,"tipo":"unica","rot":"O que muda","pergunta":"Qual é o pequeno acontecimento que muda alguma coisa?","opcoes":[["O homem chama-se também Ana Correia e é ele que entra: Ana fica livre para ler","certo","Um nome trocado (ou não) desloca tudo."],["A senhora do balcão chama dois nomes","cuidado","Isso é a espera; ainda não mudou nada."],["O homem tem o casaco molhado","cuidado","É um pormenor que serve o fim (o casaco na cadeira), não o acontecimento."]]},{"nivel":2,"tipo":"julgar","rot":"Sugerir, não explicar","pergunta":"Quatro afirmações. Quais é que o conto sugere sem dizer?","casos":[["O envelope traz uma notícia que Ana tem medo de ler.",true,"Sugerido: tira-o e guarda-o sem abrir; senta-se onde não vê a porta."],["Ana e o homem são casados.",false,"Nada o sugere: partilham um nome, e o conto deixa isso em aberto."],["Ana decide que a notícia passa a ser dele.",true,"Sugerido pelo gesto final: o envelope no bolso do casaco dele."],["O consultório é de um dentista.",false,"O conto nunca diz de que consultório se trata; não importa."]],"retorno":"O conto do séc. XX sugere: o leitor faz o resto."},{"nivel":3,"tipo":"texto","rot":"Um acontecimento","pergunta":"Escreve, numa frase, o pequeno acontecimento que mudaria alguma coisa num conto teu passado numa sala de aula, sem explicar o que muda. Até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"Quando …, …"}],"fontes":[["Texto escrito para este exercício, sem citações",""]],"modulo":"M8","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Gramatica-Anafora-Catafora.html","id":"anafora-catafora","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Gramática em contexto · 5 min · M8","titulo":"Apontar para trás, apontar para a frente","subtitulo":"Anáfora e catáfora em frases sobre os textos do módulo","niveis":["Reconhecer","Provar com um teste","Usar na tua escrita"],"emblemas":[[0.8,"Setas no sítio","Sabes para onde aponta cada palavra e provas com a pergunta certa."],[0.5,"Bom caminho","Acertaste no essencial. Repete o teste: o que já foi dito, ou o que vem a seguir?"],[0,"A construir","Volta ao princípio: procura a palavra pequena e pergunta a que se refere."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Duas setas na frase:</p><p><b>Anáfora</b>: uma palavra retoma algo já dito. «Li o conto. <u>Ele</u> surpreendeu-me.» A seta aponta para trás.</p><p><b>Catáfora</b>: uma palavra antecipa o que ainda vem. «<u>Isto</u> é o que quero: silêncio.» A seta aponta para a frente.</p><p class=\"nota\">O teste: pergunta «a que se refere?». Se a resposta já apareceu, é anáfora; se só aparece depois, é catáfora.</p>"},{"nivel":1,"tipo":"classificar","rot":"Para onde aponta","pergunta":"Anáfora ou catáfora?","categorias":["Anáfora (para trás)","Catáfora (para a frente)"],"itens":[["A poeta escreveu sobre uma terrina. Ela está numa sala cinzenta.",0],["Só lhe disse isto: não voltes.",1],["O conto acaba sem resposta, e é por isso que o releio.",0],["Quando o encontrei, o poema já tinha outro título.",1]],"retorno":"«Ela» e «isso» retomam; «isto» e «o» antecipam. A palavra é a mesma família; a direção é que muda."},{"nivel":1,"tipo":"unica","rot":"O referente","pergunta":"«Só lhe disse isto: não voltes.» A que se refere «isto»?","opcoes":[["A «não voltes», que vem a seguir","certo","Catáfora: a seta aponta para a frente."],["A «lhe»","cuidado","«Lhe» é a pessoa a quem se diz; «isto» é o que se diz."],["A uma frase anterior que não vemos","cuidado","Não é preciso ver nada antes: a resposta está logo depois dos dois pontos."]]},{"nivel":2,"tipo":"lacuna","rot":"Escolhe a seta","pergunta":"Completa de modo a criar o que se pede.","versos":[{"antes":"Catáfora: ","opcoes":["Isto","Ele","Ali"],"depois":" é o que a ceifeira tem: alegria sem saber que a tem."},{"antes":"Anáfora: Teresa escreveu a carta de madrugada. ","opcoes":["Ela","Isto","Aquilo"],"depois":" chegou a Simão à meia-noite."}],"retorno":"Antes dos dois pontos, aponta-se para a frente; depois de uma frase inteira, aponta-se para trás."},{"nivel":2,"tipo":"julgar","rot":"Passa ou não passa","pergunta":"Um colega classificou quatro casos. Passa?","casos":[["«O poema é curto, mas cada verso pesa.» «cada verso» é anáfora (associativa) de «o poema».",true,"Passa: os versos são parte do poema já referido."],["«Disse-o sem hesitar: ia partir.» «o» é anáfora.",false,"Não passa: «o» antecipa «ia partir»; é catáfora."],["«A personagem olhou o espelho. Nele viu outra mulher.» «Nele» é anáfora de «o espelho».",true,"Passa."],["«Quando a encontrei, a velha senhora sorria.» «a» é anáfora.",false,"Não passa: «a» vem antes de «a velha senhora»; é catáfora."]],"retorno":"O teste é sempre o mesmo: o referente já apareceu, ou ainda vem?"},{"nivel":3,"tipo":"texto","rot":"Duas setas","pergunta":"Escreve duas frases sobre um texto do módulo: uma com anáfora, outra com catáfora. Sublinha mentalmente as setas. Até 35 palavras.","minPalavras":10,"maxPalavras":35,"placeholder":"Li … . Ele … / Isto é o que …: …"}],"fontes":[["Frases escritas para este exercício, sem citações",""]],"modulo":"M8","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Pessoa-Quantas-Almas.html","id":"pessoa-almas","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M7 Pessoa","titulo":"Não sei quantas almas tenho","subtitulo":"Fernando Pessoa, 1930","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de espelhos","Seguiste um eu que se vê passar e não se reconhece."],[0.5,"Bom começo","Já vês o desdobramento. Repara na última estrofe: ele lê-se como um livro."],[0,"A entrar no poema","Relê: cada verso diz que o eu não é um só."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>O ortónimo, em 1930:</p><p><i>Não sei quantas almas tenho.<br>Cada momento mudei.<br>Continuamente me estranho.<br>Nunca me vi nem achei.<br>De tanto ser, só tenho alma.<br>Quem tem alma não tem calma.<br>Quem vê é só o que vê,<br>Quem sente não é quem é,</i></p><p><i>Atento ao que sou e vejo,<br>Torno-me eles e não eu.<br>Cada meu sonho ou desejo<br>É do que nasce e não meu.<br>Sou minha própria paisagem,<br>Assisto à minha passagem,<br>Diverso, móbil e só,<br>Não sei sentir-me onde estou.</i></p><p class=\"nota\"><b>móbil</b> — que se move</p>","links":[["Ler o poema inteiro no Arquivo Pessoa","http://arquivopessoa.net/textos/277"]]},{"nivel":1,"tipo":"lacuna","rot":"A palavra do poeta","pergunta":"Completa com a palavra de Pessoa.","versos":[{"antes":"Sou minha própria ","opcoes":["paisagem","sombra","casa"],"depois":","},{"antes":"Assisto à minha ","opcoes":["passagem","morte","vida"],"depois":","}],"retorno":"Paisagem e passagem: o eu é o que se vê e o que passa, ao mesmo tempo."},{"nivel":1,"tipo":"unica","rot":"Quem vê","pergunta":"«Assisto à minha passagem»: o que faz o sujeito?","opcoes":[["Vê-se a si próprio de fora, como um espectador","certo","É paisagem e é quem olha para ela."],["Despede-se de alguém","cuidado","Não há outra pessoa: é ele que passa por ele."],["Conta uma viagem","cuidado","A «passagem» é a dele por si próprio."]]},{"nivel":2,"tipo":"par","rot":"Antíteses","pergunta":"Liga cada verso ao que ele opõe.","pares":[["Quem tem alma não tem calma","ter muito por dentro e não ter sossego"],["Torno-me eles e não eu","ser os outros e não ser si próprio"],["Diverso, móbil e só","ser muitos e estar sozinho"],["Quem sente não é quem é","o que se sente e o que se é"]],"retorno":"Cada verso junta dois lados que não cabem juntos: é assim que o poema diz «não sei quantas almas tenho»."},{"nivel":2,"tipo":"unica","rot":"O fim","pergunta":"Na última estrofe, o poeta diz «vou lendo / Como páginas, meu ser» e, ao reler, pergunta «Fui eu?». O que faz ele com a própria vida?","opcoes":[["Lê-a como um livro escrito por outro","certo","«Deus sabe, porque o escreveu»: até o autor da vida dele é outro."],["Escreve um diário","cuidado","Não escreve: lê, e nem reconhece o que leu."],["Recorda a infância","cuidado","Não há infância: há páginas que não lembra."]]},{"nivel":3,"tipo":"texto","rot":"A tua paisagem","pergunta":"Escreve dois versos em que te vês de fora, como se fosses uma paisagem ou uma página. Até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"Sou … / Assisto …"}],"fontes":[["Fernando Pessoa, «Não sei quantas almas tenho» (Arquivo Pessoa)","http://arquivopessoa.net/textos/277"]],"modulo":"M7","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Caeiro-Doente-dos-Olhos.html","id":"caeiro-olhar","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M7 Caeiro","titulo":"Pensar é estar doente dos olhos","subtitulo":"Alberto Caeiro, O Guardador de Rebanhos, II e IX","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Olhar de girassol","Percebeste o que Caeiro faz com os olhos e o que recusa fazer com a cabeça."],[0.5,"Bom começo","Já vês a tese. Repara em como ele a defende: com argumentos, ou seja, a pensar."],[0,"A entrar no poema","Relê: para Caeiro, ver chega; pensar estraga."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><b>A</b> — do poema II:</p><p><i>O meu olhar é nítido como um girassol.<br>[…]<br>Creio no Mundo como num malmequer,<br>Porque o vejo. Mas não penso nele<br>Porque pensar é não compreender...</i></p><p><i>O Mundo não se fez para pensarmos nele<br>(Pensar é estar doente dos olhos)<br>Mas para olharmos para ele e estarmos de acordo...</i></p><p><b>B</b> — do poema IX:</p><p><i>Sou um guardador de rebanhos.<br>O rebanho é os meus pensamentos<br>E os meus pensamentos são todos sensações.<br>Penso com os olhos e com os ouvidos<br>E com as mãos e os pés<br>E com o nariz e a boca.</i></p>","links":[["O Guardador de Rebanhos, II (Arquivo Pessoa)","http://arquivopessoa.net/textos/1463"],["O Guardador de Rebanhos, IX (Arquivo Pessoa)","http://arquivopessoa.net/textos/1488"]]},{"nivel":1,"tipo":"unica","rot":"A tese","pergunta":"«Pensar é estar doente dos olhos.» O que quer Caeiro dizer?","opcoes":[["Quem pensa deixa de ver o que está à frente","certo","Para Caeiro, o Mundo é para olhar, não para explicar."],["Pensar cansa a vista","cuidado","Não é uma doença dos olhos à letra: é uma imagem."],["Os cegos pensam melhor","cuidado","O poema não fala de cegos; fala de quem olha sem pensar."]]},{"nivel":1,"tipo":"multi","rot":"Com que se pensa","pergunta":"Em B, Caeiro diz com que pensa. Assinala o que está no texto.","opcoes":[["Com os olhos e os ouvidos",5,"«Penso com os olhos e com os ouvidos»."],["Com as mãos e os pés",5,"Sim: o corpo todo."],["Com o nariz e a boca",5,"Sim: os cinco sentidos."],["Com a cabeça",0,"A cabeça é o que falta de propósito."]]},{"nivel":2,"tipo":"unica","rot":"A contradição","pergunta":"Caeiro diz que não pensa, e depois escreve «Porque…», «Mas…». Que problema é este?","opcoes":[["Argumentar é pensar: o poema faz o que diz que não faz","certo","É a contradição que a ficha pede para discutir; Caeiro pensa para dizer que não se pensa."],["Não há problema: são frases soltas","cuidado","«Porque o vejo», «Porque pensar é…»: são razões encadeadas."],["É um erro de Pessoa","cuidado","Não é erro: é a tensão que faz o poema."]]},{"nivel":2,"tipo":"cartoes","rot":"Uma fotografia","pergunta":"Planeia uma fotografia «à maneira de Caeiro» no caminho para a escola. Escolhe o motivo e escreve a legenda com um verso, sem explicar a imagem.","cartoes":[["Uma coisa que está lá todos os dias","Um portão, uma árvore, um sinal."],["Uma coisa que só se vê se não se pensar nela","Uma sombra, um reflexo, uma cor."],["Uma coisa que não é nada","Um pedaço de chão, um muro."]]},{"nivel":3,"tipo":"texto","rot":"Sem pensar","pergunta":"Descreve uma coisa que vês agora, só com os sentidos, sem dizer o que ela é ou para que serve. Dois versos, até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"Vejo … / É …"}],"fontes":[["Alberto Caeiro, O Guardador de Rebanhos, II (Arquivo Pessoa)","http://arquivopessoa.net/textos/1463"],["Alberto Caeiro, O Guardador de Rebanhos, IX (Arquivo Pessoa)","http://arquivopessoa.net/textos/1488"]],"modulo":"M7","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Reis-Lidia-Beira-do-Rio.html","id":"reis-lidia","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M7 Reis","titulo":"À beira do rio","subtitulo":"Ricardo Reis, 1914","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de odes","Viste as mãos enlaçarem-se e largarem-se, e percebeste porquê."],[0.5,"Bom começo","Já vês o rio. Repara no que Reis quer que a vida fique «sem»."],[0,"A entrar na ode","Relê: ele dá a mão e larga-a cinco versos depois."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>Ricardo Reis convida Lídia:</p><p><i>Vem sentar-te comigo, Lídia, à beira do rio.<br>Sossegadamente fitemos o seu curso e aprendamos<br>Que a vida passa, e não estamos de mãos enlaçadas.<br>(Enlacemos as mãos).</i></p><p><i>Depois pensemos, crianças adultas, que a vida<br>Passa e não fica, nada deixa e nunca regressa,<br>Vai para um mar muito longe, para ao pé do Fado,<br>Mais longe que os deuses.</i></p><p><i>Desenlacemos as mãos, porque não vale a pena cansarmo-nos.<br>Quer gozemos, quer não gozemos, passamos como o rio.<br>Mais vale saber passar silenciosamente<br>E sem desassossegos grandes.</i></p><p class=\"nota\"><b>fitemos</b> — olhemos fixamente · <b>Fado</b> — destino</p>","links":[["Ler a ode inteira no Arquivo Pessoa","http://arquivopessoa.net/textos/3427"]]},{"nivel":1,"tipo":"ordenar","rot":"Pela ordem","pergunta":"Põe por ordem o que Reis propõe a Lídia.","itens":["Sentar-se com ele à beira do rio","Olhar o rio e aprender que a vida passa","Enlaçar as mãos","Pensar que a vida vai para um mar longe, ao pé do Fado","Desenlaçar as mãos, porque não vale a pena cansarem-se"],"retorno":"As mãos enlaçam-se e desenlaçam-se em cinco versos: é o movimento inteiro da ode."},{"nivel":1,"tipo":"unica","rot":"Porquê largar","pergunta":"Porque é que Reis manda desenlaçar as mãos?","opcoes":[["Porque não vale a pena cansarem-se: a vida passa de qualquer maneira","certo","«Quer gozemos, quer não gozemos, passamos como o rio.»"],["Porque Lídia não quer","cuidado","Lídia nunca fala."],["Porque está frio","cuidado","Não há frio: há o rio a passar."]]},{"nivel":2,"tipo":"classificar","rot":"Modo verbal","pergunta":"Em que modo está cada forma?","categorias":["Imperativo (ordem, convite)","Conjuntivo (exortação: nós)"],"itens":[["Vem",0],["fitemos",1],["Enlacemos",1],["Desenlacemos",1]],"retorno":"«Vem» manda; «fitemos», «enlacemos», «desenlacemos» propõem uma coisa feita a dois."},{"nivel":2,"tipo":"deslizar","rot":"E tu?","pergunta":"«Mais vale saber passar silenciosamente / E sem desassossegos grandes.» Quanto concordas?","esquerda":"Discordo: viver é agitar-se","direita":"Concordo: passar sem ruído"},{"nivel":3,"tipo":"texto","rot":"Lídia responde","pergunta":"Lídia nunca responde. Escreve a resposta dela em dois versos: aceita ou recusa, e porquê. Usa uma palavra do poema. Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"… / Porque …"}],"fontes":[["Ricardo Reis, «Vem sentar-te comigo, Lídia, à beira do rio» (Arquivo Pessoa)","http://arquivopessoa.net/textos/3427"]],"modulo":"M7","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Campos-Da-Fabrica-a-Tabacaria.html","id":"campos-maquina","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M7 Campos","titulo":"Da fábrica à Tabacaria","subtitulo":"Álvaro de Campos, 1914 e 1928","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de duas fases","Ouviste o motor de 1914 e o silêncio de 1928."],[0.5,"Bom começo","Já distingues as duas fases. Repara no ritmo: versos que gritam e versos que caem."],[0,"A entrar em Campos","Relê: primeiro quer ser máquina, depois diz que não é nada."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><b>A</b> — «Ode Triunfal», 1914:</p><p><i>À dolorosa luz das grandes lâmpadas eléctricas da fábrica<br>Tenho febre e escrevo.<br>[…]<br>Ó rodas, ó engrenagens, r-r-r-r-r-r-r eterno!<br>Forte espasmo retido dos maquinismos em fúria!<br>[…]<br>Ah, poder exprimir-me todo como um motor se exprime!<br>Ser completo como uma máquina!</i></p><p><b>B</b> — «Tabacaria», 1928:</p><p><i>Não sou nada.<br>Nunca serei nada.<br>Não posso querer ser nada.<br>À parte isso, tenho em mim todos os sonhos do mundo.</i></p><p class=\"nota\"><b>eléctricas</b> — grafia da edição</p>","links":[["«Ode Triunfal» (Arquivo Pessoa)","http://arquivopessoa.net/textos/2459"],["«Tabacaria» (Arquivo Pessoa)","http://arquivopessoa.net/textos/163"]]},{"nivel":1,"tipo":"classificar","rot":"1914 ou 1928","pergunta":"De que poema é cada verso?","categorias":["A · Ode Triunfal","B · Tabacaria"],"itens":[["Ser completo como uma máquina!",0],["Nunca serei nada.",1],["Tenho febre e escrevo.",0],["À parte isso, tenho em mim todos os sonhos do mundo.",1]],"retorno":"Catorze anos entre a febre e o nada."},{"nivel":1,"tipo":"unica","rot":"O r-r-r-r","pergunta":"«Ó rodas, ó engrenagens, r-r-r-r-r-r-r eterno!» Que dois recursos há aqui?","opcoes":[["Apóstrofe (fala às rodas) e onomatopeia (imita o som)","certo","O poema fala à máquina e faz o som dela."],["Comparação e metáfora","cuidado","Não há «como» nem uma coisa pela outra: há um chamamento e um ruído."],["Rima e refrão","cuidado","O verso livre de Campos não rima."]]},{"nivel":2,"tipo":"unica","rot":"Não sou nada","pergunta":"«Não sou nada. / Nunca serei nada. / Não posso querer ser nada.» Como crescem os três versos?","opcoes":[["Do presente ao futuro à vontade: nem sequer pode querer","certo","É uma gradação: cada verso fecha mais uma porta."],["Do maior para o menor","cuidado","Os versos ficam mais longos, não mais curtos."],["São a mesma frase repetida","cuidado","Muda o tempo e depois o verbo: sou, serei, posso querer ser."]]},{"nivel":2,"tipo":"unica","rot":"O quarto verso","pergunta":"«À parte isso, tenho em mim todos os sonhos do mundo.» O que faz este verso aos três anteriores?","opcoes":[["Contradiz-os: quem não é nada tem tudo por dentro","certo","Antítese: o nada por fora, os sonhos todos por dentro."],["Confirma-os","cuidado","«À parte isso» é uma viragem, não um reforço."],["Explica-os","cuidado","Não explica: opõe."]]},{"nivel":3,"tipo":"texto","rot":"Euforia e queda","pergunta":"Escreve dois versos sobre uma máquina de hoje: o primeiro com uma apóstrofe («Ó …!»), o segundo à maneira da «Tabacaria». Até 30 palavras.","minPalavras":6,"maxPalavras":30,"placeholder":"Ó …! / …"}],"fontes":[["Álvaro de Campos, «Ode Triunfal» (Arquivo Pessoa)","http://arquivopessoa.net/textos/2459"],["Álvaro de Campos, «Tabacaria» (Arquivo Pessoa)","http://arquivopessoa.net/textos/163"]],"modulo":"M7","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Mensagem-Nevoeiro.html","id":"mensagem-nevoeiro","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M7 Mensagem","titulo":"Nevoeiro","subtitulo":"Fernando Pessoa, Mensagem, 1934","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor do Encoberto","Percebeste o país que não se define e a hora que o poema anuncia."],[0.5,"Bom começo","Já vês o nevoeiro. Repara nas luzes que não iluminam."],[0,"A entrar na Mensagem","Relê: tudo é «sem»: sem rei, sem lei, sem luz."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p>O último poema da <b>Mensagem</b>:</p><p><i>Nem rei nem lei, nem paz nem guerra,<br>Define com perfil e ser<br>Este fulgor baço da terra<br>Que é Portugal a entristecer —<br>Brilho sem luz e sem arder<br>Como o que o fogo-fátuo encerra.</i></p><p><i>Ninguém sabe que coisa quer.<br>Ninguém conhece que alma tem,<br>Nem o que é mal nem o que é bem.<br>(Que ânsia distante perto chora?)<br>Tudo é incerto e derradeiro.<br>Tudo é disperso, nada é inteiro.<br>Ó Portugal, hoje és nevoeiro...</i></p><p><i>É a hora!</i></p><p class=\"nota\"><b>fulgor baço</b> — brilho sem força · <b>fogo-fátuo</b> — chama fraca sobre os pântanos · <b>derradeiro</b> — último</p>","links":[["Ler no Arquivo Pessoa","http://arquivopessoa.net/textos/2293"]]},{"nivel":1,"tipo":"multi","rot":"Luz sem luz","pergunta":"Que expressões dizem que Portugal brilha sem iluminar?","opcoes":[["fulgor baço",5,"Um brilho apagado."],["Brilho sem luz e sem arder",5,"Brilha, mas não dá luz nem calor."],["fogo-fátuo",5,"Uma chama que não é fogo."],["É a hora!",0,"Este verso é o contrário: a viragem."]]},{"nivel":1,"tipo":"unica","rot":"Ninguém","pergunta":"«Ninguém sabe que coisa quer. / Ninguém conhece que alma tem.» O que falta a este país?","opcoes":[["Vontade e identidade: não sabe o que quer nem quem é","certo","É o nevoeiro: nem forma nem direção."],["Dinheiro","cuidado","O poema não fala de riqueza."],["Um rei","cuidado","«Nem rei nem lei»: falta tudo, não só o rei."]]},{"nivel":2,"tipo":"unica","rot":"A hora","pergunta":"Depois de tanto «nem» e «ninguém», o poema acaba com «É a hora!». Que faz este verso?","opcoes":[["Vira o poema: do diagnóstico para o apelo","certo","Depois do nevoeiro, a hora de acordar: é o sebastianismo da Mensagem."],["Diz que é tarde de mais","cuidado","Não é fim: é começo, com ponto de exclamação."],["Marca as horas do relógio","cuidado","É uma hora simbólica, não das horas."]]},{"nivel":2,"tipo":"ordenar","rot":"Do escuro à hora","pergunta":"Põe por ordem o movimento do poema.","itens":["Um país sem rei nem lei, com um brilho baço","Ninguém sabe o que quer nem quem é","Tudo é incerto, disperso, nevoeiro","É a hora!"],"retorno":"Primeiro o que falta, depois a viragem: só se anuncia a hora depois de dizer o nevoeiro."},{"nivel":3,"tipo":"texto","rot":"O teu nevoeiro","pergunta":"Escreve dois versos sobre uma coisa (uma turma, uma cidade, um projeto) que «hoje é nevoeiro», e um terceiro verso que seja a hora. Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"… / … / É a hora!"}],"fontes":[["Fernando Pessoa, Mensagem, «Nevoeiro» (Arquivo Pessoa)","http://arquivopessoa.net/textos/2293"]],"modulo":"M7","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Pessoa-Ceifeira.html","id":"pessoa-ceifeira","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M7 Pessoa","titulo":"Ela canta, pobre ceifeira","subtitulo":"Fernando Pessoa, Poesias, 1942","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor da dor de pensar","Percebeste o que o poeta inveja e porque não o pode ter."],[0.5,"Bom começo","Já ouves a ceifeira. Repara em quem fala mais alto: ela, ou quem a ouve?"],[0,"A entrar no poema","Relê: ele quer a alegria dela e quer saber que a tem."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><i>Ela canta, pobre ceifeira,<br>Julgando-se feliz talvez;<br>Canta, e ceifa, e a sua voz, cheia<br>De alegre e anónima viuvez,</i></p><p><i>Ondula como um canto de ave<br>No ar limpo como um limiar,<br>E há curvas no enredo suave<br>Do som que ela tem a cantar.</i></p><p><i>Ouvi-la alegra e entristece,<br>Na sua voz há o campo e a lida,<br>E canta como se tivesse<br>Mais razões para cantar que a vida.</i></p><p><i>Ah, canta, canta sem razão!<br>O que em mim sente está pensando.<br>Derrama no meu coração<br>A tua incerta voz ondeando!</i></p><p><i>Ah, poder ser tu, sendo eu!<br>Ter a tua alegre inconsciência,<br>E a consciência disso! Ó céu!<br>Ó campo! Ó canção! A ciência</i></p><p><i>Pesa tanto e a vida é tão breve!<br>Entrai por mim dentro! Tornai<br>Minha alma a vossa sombra leve!<br>Depois, levando-me, passai!</i></p><p class=\"nota\"><b>ceifeira</b> — mulher que corta cereal · <b>lida</b> — trabalho · <b>ciência</b> — aqui, a consciência</p>","links":[["Ler no Arquivo Pessoa","http://arquivopessoa.net/textos/2429"]]},{"nivel":1,"tipo":"unica","rot":"Duas partes","pergunta":"Onde muda o poema?","opcoes":[["Na 4.ª estrofe: deixa de descrever a ceifeira e passa a falar com ela («Ah, canta…»)","certo","Da descrição à apóstrofe: o poeta entra no poema."],["Na 2.ª estrofe","cuidado","A 2.ª ainda descreve o canto («Ondula como…»)."],["Não muda","cuidado","As exclamações e o «tu» das últimas estrofes são outra voz."]]},{"nivel":1,"tipo":"par","rot":"Recursos","pergunta":"Liga cada verso ao recurso.","pares":[["Ondula como um canto de ave","comparação"],["Ouvi-la alegra e entristece","antítese"],["Ó céu! Ó campo! Ó canção!","apóstrofe e enumeração"],["E canta como se tivesse / Mais razões…","comparação hipotética"]],"retorno":"Comparar, opor, chamar: é com isto que o poema passa do que ouve ao que sente."},{"nivel":2,"tipo":"unica","rot":"O paradoxo","pergunta":"«Ter a tua alegre inconsciência, / E a consciência disso!» Porque é impossível?","opcoes":[["Ter consciência de não pensar já é pensar","certo","Quer a alegria de quem não sabe, e quer saber que a tem: as duas não cabem."],["Porque a ceifeira não deixa","cuidado","A ceifeira nem sabe que ele existe."],["Porque ele não sabe cantar","cuidado","Não é uma questão de canto: é de consciência."]]},{"nivel":2,"tipo":"julgar","rot":"Passa ou não passa","pergunta":"Quatro leituras de um colega. Quais têm prova no poema?","casos":[["A ceifeira é feliz.",false,"Não passa: «Julgando-se feliz talvez»: o poeta não sabe, e diz «pobre»."],["O poeta inveja a ceifeira.",true,"Passa: «Ah, poder ser tu, sendo eu!»"],["O poeta quer deixar de pensar.",true,"Passa: «A ciência / Pesa tanto», «Entrai por mim dentro!»"],["A ceifeira responde ao poeta.",false,"Não passa: ela nunca fala; só canta."]],"retorno":"Prova é um verso: sem verso, é palpite."},{"nivel":3,"tipo":"texto","rot":"A ceifeira responde","pergunta":"Escreve dois versos na voz da ceifeira, a responder ao poeta: aceita o elogio, recusa-o ou surpreende-o. Usa uma palavra do poema. Até 25 palavras.","minPalavras":6,"maxPalavras":25,"placeholder":"… / …"}],"fontes":[["Fernando Pessoa, «Ela canta, pobre ceifeira» (Arquivo Pessoa)","http://arquivopessoa.net/textos/2429"]],"modulo":"M7","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Pessoa-Ilha-do-Sul.html","id":"pessoa-ilha","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M7 Pessoa","titulo":"A ilha do sul","subtitulo":"Fernando Pessoa, 1933","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de ilhas","Foste até à ilha e voltaste com o poema: «É em nós que é tudo»."],[0.5,"Bom começo","Já vês a ilha. Repara em quando ela começa a arrefecer: ao ser pensada."],[0,"A entrar no poema","Relê o último verso: o «ali» mudou de sítio."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><i>Não sei se é sonho, se realidade,<br>Se uma mistura de sonho e vida,<br>Aquela terra de suavidade<br>Que na ilha extrema do sul se olvida.<br>É a que ansiamos. Ali, ali<br>A vida é jovem e o amor sorri</i></p><p><i>[…]</i></p><p><i>Mas já sonhada se desvirtua,<br>Só de pensá-la cansou pensar;<br>Sob os palmares, à luz da lua,<br>Sente-se o frio de haver luar<br>Ah, nesta terra também, também<br>O mal não cessa, não dura o bem.</i></p><p><i>Não é com ilhas do fim do mundo,<br>Nem com palmares de sonho ou não,<br>Que cura a alma seu mal profundo,<br>Que o bem nos entra no coração.<br>É em nós que é tudo. É ali, ali,<br>Que a vida é jovem e o amor sorri.</i></p><p class=\"nota\"><b>se olvida</b> — se esquece · <b>desvirtua</b> — perde o valor</p>","links":[["Ler o poema inteiro no Arquivo Pessoa","http://arquivopessoa.net/textos/63"]]},{"nivel":1,"tipo":"ordenar","rot":"O raciocínio","pergunta":"Põe por ordem o caminho do poema.","itens":["Há uma terra de sonho numa ilha do sul, onde a vida é jovem","Só de a pensar, a ilha perde o valor e arrefece","Também lá o mal não cessa","A felicidade não está em ilha nenhuma: é em nós"],"retorno":"Vai à ilha, olha bem, e volta: o «ali» final já não é um lugar."},{"nivel":1,"tipo":"unica","rot":"O frio","pergunta":"«Sente-se o frio de haver luar»: porque surpreende?","opcoes":[["O luar devia ser bonito e é frio: pensar o sonho estraga-o","certo","«Só de pensá-la cansou pensar»: a dor de pensar outra vez."],["Porque na ilha do sul não há lua","cuidado","Há: é a lua que arrefece."],["Porque é inverno","cuidado","O frio não vem do tempo: vem do pensamento."]]},{"nivel":2,"tipo":"lacuna","rot":"O verso que volta","pergunta":"Completa o último par de versos.","versos":[{"antes":"É em ","opcoes":["nós","vós","ti"],"depois":" que é tudo. É ali, ali,"},{"antes":"Que a vida é ","opcoes":["jovem","longa","doce"],"depois":" e o amor sorri."}],"retorno":"O verso da ilha repete-se no fim, mas «ali» passou a ser dentro de nós."},{"nivel":2,"tipo":"deslizar","rot":"Concordas?","pergunta":"«É em nós que é tudo.» Quanto concordas?","esquerda":"Não: há coisas fora de nós que pesam","direita":"Sim: a felicidade é de dentro"},{"nivel":3,"tipo":"texto","rot":"A tua ilha","pergunta":"Escreve dois versos sobre um lugar onde achaste que ias ser feliz, e um terceiro que diga onde estava, afinal, o «ali». Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"… / … / É ali, ali, …"}],"fontes":[["Fernando Pessoa, «Não sei se é sonho, se realidade» (Arquivo Pessoa)","http://arquivopessoa.net/textos/63"]],"modulo":"M7","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Pessoa-Criancas-Brincam.html","id":"pessoa-infancia","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M7 Pessoa","titulo":"A infância que não tive","subtitulo":"Fernando Pessoa, 1933","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor de saudades impossíveis","Percebeste como se tem saudade do que nunca aconteceu."],[0.5,"Bom começo","Já vês o paradoxo. Repara nos três tempos da última estrofe."],[0,"A entrar no poema","Relê: a infância vem de fora, das crianças na rua."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><i>Quando as crianças brincam<br>E eu as oiço brincar,<br>Qualquer coisa em minha alma<br>Começa a se alegrar.</i></p><p><i>E toda aquela infância<br>Que não tive me vem,<br>Numa onda de alegria<br>Que não foi de ninguém.</i></p><p><i>Se quem fui é enigma,<br>E quem serei visão,<br>Quem sou ao menos sinta<br>Isto no coração.</i></p>","links":[["Ler no Arquivo Pessoa","http://arquivopessoa.net/textos/2185"]]},{"nivel":1,"tipo":"unica","rot":"O paradoxo","pergunta":"«E toda aquela infância / Que não tive me vem»: o que é estranho?","opcoes":[["Vem-lhe a saudade de uma infância que nunca teve","certo","A infância é imaginada a partir do que ouve na rua."],["Vem-lhe a infância dos filhos","cuidado","Não há filhos: há crianças a brincar, de ninguém."],["Lembra-se da sua infância","cuidado","«Que não tive»: não é lembrança."]]},{"nivel":1,"tipo":"par","rot":"Três tempos","pergunta":"Liga cada «quem» ao que o poema diz dele.","pares":[["Quem fui","enigma"],["Quem serei","visão"],["Quem sou","que ao menos sinta isto"]],"retorno":"Passado, futuro e presente: só o presente tem uma hipótese, e é pequena («ao menos»)."},{"nivel":2,"tipo":"unica","rot":"De ninguém","pergunta":"«Numa onda de alegria / Que não foi de ninguém»: o que quer dizer?","opcoes":[["A alegria não pertence a nenhuma pessoa real: é inventada","certo","Nem dele, nem das crianças: nasce do ouvir."],["As crianças não estão alegres","cuidado","Estão a brincar; a alegria «de ninguém» é a dele."],["Ninguém quer a alegria","cuidado","Ele quer: «Quem sou ao menos sinta»."]]},{"nivel":2,"tipo":"classificar","rot":"Palavras novas","pergunta":"Um colega inventou palavras para este sentimento. Que processo usou em cada uma?","categorias":["Amálgama","Truncação","Extensão semântica"],"itens":[["saudalegria (saudade + alegria)",0],["nostal (de nostalgia)",1],["eco (a alegria que fica de uma coisa ouvida)",2]],"retorno":"Amálgama junta pedaços; truncação corta; extensão semântica dá sentido novo a uma palavra velha."},{"nivel":3,"tipo":"texto","rot":"Uma palavra","pergunta":"Inventa uma palavra para «alegria com saudade do que não se viveu», diz como a formaste, e usa-a numa frase. Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"A palavra é «…» (formada por …): …"}],"fontes":[["Fernando Pessoa, «Quando as crianças brincam» (Arquivo Pessoa)","http://arquivopessoa.net/textos/2185"]],"modulo":"M7","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Campos-Aniversario.html","id":"campos-aniversario","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M7 Campos","titulo":"Aniversário","subtitulo":"Álvaro de Campos, 1929","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Leitor da casa vendida","Viste o passado feliz e o presente que dura, e o fósforo frio entre os dois."],[0.5,"Bom começo","Já vês o antes e o depois. Repara nos tempos verbais."],[0,"A entrar em Campos","Relê: «Eu era feliz e ninguém estava morto.»"]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><i>No tempo em que festejavam o dia dos meus anos,<br>Eu era feliz e ninguém estava morto.<br>Na casa antiga, até eu fazer anos era uma tradição de há séculos,<br>E a alegria de todos, e a minha, estava certa com uma religião qualquer.</i></p><p><i>[…]</i></p><p><i>O que eu sou hoje é como a humidade no corredor do fim da casa,<br>Pondo grelado nas paredes...<br>O que eu sou hoje (e a casa dos que me amaram treme através das minhas lágrimas),<br>O que eu sou hoje é terem vendido a casa.<br>É terem morrido todos,<br>É estar eu sobrevivente a mim-mesmo como um fósforo frio...</i></p><p><i>[…]</i></p><p><i>Pára, meu coração!<br>Não penses! Deixa o pensar na cabeça!<br>Ó meu Deus, meu Deus, meu Deus!<br>Hoje já não faço anos.<br>Duro.<br>Somam-se-me dias.</i></p><p class=\"nota\"><b>grelado</b> — bolor · <b>«Pára»</b> — grafia da edição</p>","links":[["Ler o poema inteiro no Arquivo Pessoa","http://arquivopessoa.net/textos/20"]]},{"nivel":1,"tipo":"classificar","rot":"Antes e agora","pergunta":"Cada verso é do passado feliz ou do presente?","categorias":["Passado","Presente"],"itens":[["Eu era feliz e ninguém estava morto.",0],["O que eu sou hoje é terem vendido a casa.",1],["até eu fazer anos era uma tradição de há séculos",0],["Somam-se-me dias.",1]],"retorno":"Era, estava, festejavam: o imperfeito de um tempo redondo. Sou, é, duro: o presente que não festeja."},{"nivel":1,"tipo":"unica","rot":"O fósforo","pergunta":"«sobrevivente a mim-mesmo como um fósforo frio»: o que é um fósforo frio?","opcoes":[["Um fósforo que já ardeu ou não acende: vivo sem chama","certo","Sobreviveu, mas não dá luz."],["Um fósforo guardado para depois","cuidado","Não há depois: «Hoje já não faço anos. Duro.»"],["Um fósforo molhado pela humidade","cuidado","A humidade é outra imagem, a do corredor."]]},{"nivel":2,"tipo":"unica","rot":"Duro","pergunta":"«Hoje já não faço anos. / Duro. / Somam-se-me dias.» O que muda entre «fazer anos» e «durar»?","opcoes":[["Fazer anos era uma festa; durar é só continuar, dia após dia","certo","Um verso de uma palavra, «Duro.», diz tudo: o tempo deixou de ter festas."],["Durar é viver mais","cuidado","Viver mais sem alegria: é isso que o verso curto pesa."],["Ficou mais forte","cuidado","«Duro» é o verbo durar, não o adjetivo."]]},{"nivel":2,"tipo":"riscar","rot":"Cortar até ao osso","pergunta":"Corta esta frase nossa até 7 palavras sem perder quem faz o quê.","frase":"Na casa antiga, a família toda festejava o dia dos meus anos com uma alegria que parecia uma religião.","limite":7,"essenciais":["família","festejava","anos"],"modelo":"A família festejava os meus anos como religião.","retorno":"Campos faz o contrário: alonga; mas para ver o que pesa num verso, corta."},{"nivel":3,"tipo":"texto","rot":"No tempo em que…","pergunta":"Escreve dois versos com a anáfora «No tempo em que…» sobre um objeto que guarde um tempo passado (pode ser inventado). Até 30 palavras.","minPalavras":8,"maxPalavras":30,"placeholder":"No tempo em que … / No tempo em que …"}],"fontes":[["Álvaro de Campos, «Aniversário» (Arquivo Pessoa)","http://arquivopessoa.net/textos/20"]],"modulo":"M7","imagemData":""},{"pasta":"Ler-a-fundo","ficheiro":"Mensagem-O-Mostrengo.html","id":"mensagem-mostrengo","cor":"#2f2f2f","corEscura":"#bdbdbd","marca":"Ler a fundo · 5 min · M7 Mensagem","titulo":"O Mostrengo","subtitulo":"Fernando Pessoa, Mensagem, 1934","niveis":["Ler o que está lá","Ler nas entrelinhas","Fazer com o que leste"],"emblemas":[[0.8,"Mão no leme","Ouviste o mostrengo três vezes e viste o homem passar do medo à vontade."],[0.5,"Bom começo","Já contas os três. Repara no que muda na terceira resposta."],[0,"A entrar no poema","Relê: o homem treme nas três estrofes; na terceira, fala por um povo."]],"passos":[{"nivel":1,"tipo":"leitura","rot":"Ler","html":"<p><i>O mostrengo que está no fim do mar<br>Na noite de breu ergueu-se a voar;<br>À roda da nau voou três vezes,<br>Voou três vezes a chiar,<br>E disse: «Quem é que ousou entrar<br>Nas minhas cavernas que não desvendo,<br>Meus tetos negros do fim do mundo?»<br>E o homem do leme disse, tremendo:<br>«El-Rei D. João Segundo!»</i></p><p><i>[…]</i></p><p><i>Três vezes do leme as mãos ergueu,<br>Três vezes ao leme as reprendeu,<br>E disse no fim de tremer três vezes:<br>«Aqui ao leme sou mais te a Mim») e volta aqui.</p>","links":[["Ouvir no Spotify","https://open.spotify.com/search/Jorge%20Palma"],["A vida, na Wikipédia","https://pt.wikipedia.org/wiki/Jorge_Palma"]],"nota":"As letras estão protegidas por direitos de autor: ouve-as na plataforma oficial."},{"nivel":1,"tipo":"ordenar","rot":"Uma vida por ordem","pergunta":"Põe por ordem os momentos da vida de Jorge Palma.","itens":["A mãe inscreve-o no piano, aos seis anos","Teclista dos Sindicato, no primeiro Vilar de Mouros","Recusa a guerra e recebe asilo na Dinamarca","Quatro anos a cantar na rua, em Paris","«Deixa-me Rir» e O Lado Errado da Noite","3 Palmas na Mão, em palco com os filhos"],"retorno":"Piano, banda, recusa, rua, sucesso, família: cinquenta anos numa linha."},{"nivel":1,"tipo":"unica","rot":"Uma frase","pergunta":"Numa entrevista de 2002, resumiu 1973 assim: «Com licença, meus amigos, mas para a guerra não vou.» O que recusou?","opcoes":[["O serviço militar e a Guerra do Ultramar; partiu para a Dinamarca","certo","Sim. A frase é cortês e não deixa margem: pede licença e não vai."],["Um concerto no Festival da Canção","cuidado","Concorreu ao Festival em 1975, depois de voltar. A recusa é outra."],["Um contrato com a editora","cuidado","Isso foi em 1989, com Bairro do Amor. Em 1973 o que recusou foi a guerra."]]},{"nivel":2,"tipo":"classificar","rot":"Quatro escolas","pergunta":"De que escola vem cada momento?","categorias":["Formação erudita","Rock","Rua","Ofício de arranjador"],"itens":[["Curso Geral de Piano no Conservatório (1986)",0],["Órgão e metais nos Sindicato (1969–1971)",1],["Brel e Dylan nos transportes de Paris (1978)",2],["Arranjos para Amália Rodrigues (1974–1977)",3],["Primeira audição aos oito anos",0],["Palma's Gang, com Zé Pedro dos Xutos (1993)",1]],"retorno":"As quatro escolas cabem na mesma pessoa: é isso que se ouve nas canções."},{"nivel":2,"tipo":"cartoes","rot":"Ligações","pergunta":"Escolhe uma ligação ao programa e explica-a numa linha.","cartoes":[["1.º ano · ><p><i>TODOS OS ANIMAIS SÃO IGUAIS MAS ALGUNS ANIMAIS SÃO MAIS IGUAIS DO QUE OS OUTROS</i></p><p>No original: <i>ALL ANIMALS ARE EQUAL BUT SOME ANIMALS ARE MORE EQUAL THAN OTHERS</i>. E o último parágrafo do livro, com os outros animais a espreitar os porcos a jantar com os homens:</p><p><i>Doze vozes gritavam de raiva, e eram todas iguais. Já não havia dúvida sobre o que acontecera às caras dos porcos. As criaturas lá fora olhavam do porco para o homem, e do homem para o porco, e do porco para o homem outra vez; mas já era impossível dizer qual era qual.</i></p><p class=\"nota\">Tradução nossa do inglês; o original está em domínio público na União Europeia. Garganta — o porco que fala pelos outros (Squealer, no original) · <b>Napoleão</b> — o porco que governa</p>","links":[["Ler o original em inglês (Project Gutenberg Australia)","https://gutenberg.net.au/ebooks01/0100011h.html"]]},{"nivel":1,"tipo":"ordenar","rot":"O que aconteceu","pergunta":"Põe por ordem o caminho dos sete mandamentos até ao último.","itens":["O velho Major conta o sonho de uma quinta sem homens","Os animais expulsam o Sr. Jones","Os porcos escrevem os sete mandamentos na parede","Napoleão expulsa Bola-de-Neve com os cães","Boxer, o cavalo que mais trabalhou, é vendido ao matadouro","Os porcos andam sobre duas pernas e sobra um mandamento"],"retorno":"Do sonho à parede, e da parede a uma frase só."},{"nivel":1,"tipo":"unica","rot":"Com lençóis","pergunta":"«Nenhum animal dormirá numa cama» passa a «Nenhum animal dormirá numa cama com lençóis». O que muda?","opcoes":[["Acrescenta-se uma condição que deixa passar o que a regra proibia","certo","Sim. A regra continua na parede e já não proíbe nada: os porcos dormem em camas, sem lençóis."],["Corrige-se um erro de ortografia","cuidado","Não há erro: há uma cláusula nova, escrita por quem quer dormir na cama."],["A regra torna-se mais dura","cuidado","Torna-se mais fraca: proíbe menos do que antes."]]},{"nivel":2,"tipo":"multi","rot":"A voz de Garganta","pergunta":"Garganta convence os animais de que o leite e as maçãs são só para os porcos. Toca no que ele usa.","opcoes":[["Uma ciência que ninguém pode verificar («isto está provado pela Ciência»)",5,"Sim: autoridade sem prova."],["O medo do regresso do dono («O Jones voltava!»)",5,"Sim: a ameaça fecha a discussão."],["Um sacrifício fingido («muitos de nós até não gostam de leite»)",5,"Sim: o privilégio vestido de dever."],["Números e contas abertas a todos",0,"Não há números: há afirmações. É por isso que funciona."]]},{"nivel":2,"tipo":"julgar","rot":"Passa ou não passa","pergunta":"Quatro frases de um colega. Quais têm prova no livro?","casos":[["«Igual» admite grau: pode-se ser mais ou menos igual.",false,"Não passa: ou se é igual ou não se é. «Mais iguais» é a contradição que sustenta o poder dos porcos."],["As ovelhas repetem a frase que os porcos lhes dão.",true,"Passa: «Quatro patas bom, duas pernas mau», e depois «melhor», quando os porcos se põem de pé."],["No fim, os animais já não distinguem os porcos dos homens.",true,"Passa: é a última frase do livro."],["Boxer morreu no hospital, como Garganta anunciou.",false,"Não passa: a carrinha que o levou dizia «matadouro de cavalos»; o hospital é a versão de Garganta."]],"retorno":"Prova é uma frase do livro; o resto é o que Garganta quer que se acredite."},{"nivel":3,"tipo":"texto","rot":"A tua parede","pergunta":"Escreve um mandamento para a tua turma e, a seguir, a versão dos porcos: a mesma regra com a cláusula que a desfaz. 12 a 40 palavras.","minPalavras":12,"maxPalavras":40,"placeholder":"Nenhum aluno… / Nenhum aluno… sem…"}],"fontes":[["George Orwell, Animal Farm, texto inglês (Project Gutenberg Australia)","https://gutenberg.net.au/ebooks01/0100011h.html"],["Animal Farm (Wikipédia)","https://pt.wikipedia.org/wiki/Animal_Farm"]],"modulo":"Comum","imagemData":""}],"perguntas":[{"id":"M7-01-0","modulo":"M7","unidade":"O fingidor","texto":"Fingir é mentir?"},{"id":"M7-02-1","modulo":"M7","unidade":"
