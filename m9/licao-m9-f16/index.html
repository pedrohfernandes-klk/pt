<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m9-f16",CARTOES=[{"t":"ler","titulo":"O instante dentro da duração","rot":"Abre","html":"<p class=\"abre\">Como pode a gramática fazer sentir uma interrupção?<\/p><p class=\"abre\">Uma ação prolonga-se. Algo acontece e muda tudo. Como consegue a narração colocar um instante dentro de uma duração?<\/p><p>Na leitura anterior observaste quem trabalha na construção. Agora vais estudar como as formas verbais e a organização da frase apresentam a continuidade e a rutura.<\/p>"},{"t":"vf","p":"Antes de reler. Recupera a leitura do trabalho na F05: identificar quem executa uma ação permite, por si só, determinar a duração dessa ação?","v":false,"f":"Confundir o agente com o recorte temporal mistura perguntas diferentes. Regressa à F05 para identificar quem trabalha; agora será necessário observar as formas verbais e os marcadores para estudar a duração. Relê essa distinção na lição anterior depois de tentares responder.","g":"m9-f16-1"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>O <strong>tempo verbal<\/strong> localiza uma situação; o <strong>aspeto<\/strong> mostra como ela é apresentada: em curso, concluída, repetida, por exemplo. Uma situação longa pode ser apresentada como concluída; uma ação breve pode ser observada enquanto decorre.<\/p><p>José Saramago usa contrastes temporais na representação do trabalho e do acidente de Francisco Marques, em <i>Memorial do Convento<\/i>. A gramática participa no efeito narrativo.<\/p>"},{"t":"ler","titulo":"Uma ação em curso","rot":"Lê e confronta","html":"<blockquote>«está a fazer bem o trabalho»<\/blockquote><p>José Saramago, <i>Memorial do Convento<\/i>, Editorial Caminho, excerto disponibilizado pela Porto Editora, recurso 2363389, página 1 do PDF. O recurso não identifica o ano nem a página da edição do romance.<\/p><p><a href=\"https://recursos.portoeditora.pt/recurso?id=2363389\" target=\"_blank\" rel=\"noopener\">Lê o excerto na fonte editorial<\/a>. A passagem apresenta o trabalho de Francisco Marques e o acidente mortal que o interrompe. A análise seguinte distingue o decorrer de uma ação da apresentação de um acontecimento que a altera.<\/p>"},{"t":"escolha","p":"Que valor tem a construção verbal no recorte citado?","o":["Apresenta o trabalho enquanto está em curso.","Apresenta o trabalho depois de estar concluído.","Apresenta o trabalho como algo ainda prometido."],"c":0,"f":"Estar a seguido de infinitivo apresenta a ação no seu decorrer. Não informa, por si só, de quanto tempo ela durará nem garante que será concluída. Relê o cartão «Uma ação em curso» e confronta a pista com a tua resposta.","g":"m9-f16-4"},{"t":"vf","p":"Uma ação apresentada como concluída tem obrigatoriamente uma duração curta.","v":false,"f":"A conclusão e a duração são dimensões diferentes. Uma construção que durou anos pode ser apresentada como concluída numa única frase. Relê o cartão «Uma ação em curso» e confronta a pista com a tua resposta.","g":"m9-f16-5"},{"t":"emparelhar","p":"Relaciona cada exemplo didático criado com o modo de apresentar a situação.","pares":[["Estava a transportar a pedra.","Ação observada no seu decorrer"],["Transportou a pedra até ao destino.","Ação apresentada como concluída"],["Transportava uma pedra todos os dias.","Ação apresentada como habitual"]],"f":"As formas verbais trabalham com os restantes elementos da frase. Todos os dias explicita repetição; até ao destino delimita a ação. Relê o cartão «Uma ação em curso» e confronta a pista com a tua resposta.","g":"m9-f16-6"},{"t":"ler","titulo":"Mudar o recorte temporal","rot":"Lê e confronta","html":"<p>Exemplos didáticos criados: A: «A equipa trabalhava quando o apoio cedeu.» B: «A equipa trabalhou durante meses.»<\/p><p>Em A, a primeira situação fornece um fundo em curso e a segunda introduz uma ocorrência. Em B, uma duração longa é apresentada como um todo. Não confundas imperfeito com lentidão obrigatória nem perfeito com rapidez obrigatória.<\/p><p><strong>Modelo completo.<\/strong> No exemplo criado, trabalhava apresenta uma situação em curso e cedeu introduz uma ocorrência. A relação produz interrupção. O tempo verbal, sozinho, não determina a responsabilidade pelo acontecimento.<\/p>"},{"t":"completar","p":"Completa a análise do exemplo A.","frase":"A forma trabalhava apresenta o [1] em curso; cedeu introduz uma ocorrência que [2] essa situação.","lacunas":[{"o":["trabalho","resultado","intervalo"],"c":0},{"o":["altera","repete","prevê"],"c":0}],"f":"A relação entre as duas situações produz o efeito de interrupção. Não é uma propriedade isolada de uma palavra fora da frase. Relê o cartão «Mudar o recorte temporal» e confronta a pista com a tua resposta.","g":"m9-f16-8"},{"t":"ordenar","p":"Ordena o raciocínio para analisar um contraste aspetual.","passos":["Identificar as formas verbais","Observar os complementos e os marcadores temporais","Distinguir situação em curso e ocorrência delimitada","Relacionar o contraste com o efeito narrativo"],"f":"O contexto gramatical vem antes da interpretação. A mesma forma pode participar em valores diferentes conforme os elementos que a acompanham. Relê o cartão «Mudar o recorte temporal» e confronta a pista com a tua resposta.","g":"m9-f16-9"},{"t":"sublinhar","p":"Que palavra distingue uma ocorrência situada dentro da ação de duas ações sem relação explicitada?","frase":"A equipa trabalhava quando o apoio cedeu.","certas":[3],"f":"Quando liga as duas situações no tempo. Com os tempos verbais usados, permite apresentar uma ocorrência dentro de um processo em curso. Relê o cartão «Mudar o recorte temporal» e confronta a pista com a tua resposta.","g":"m9-f16-10"},{"t":"escolha","p":"Que frase criada apresenta uma ação longa como um todo concluído?","o":["A equipa trabalhou ali durante três anos.","A equipa estava a trabalhar quando chegámos.","A equipa trabalhava ali todas as manhãs."],"c":0,"f":"Trabalhou com durante três anos apresenta uma duração longa como um todo. Concluído não é sinónimo de rápido. Relê o cartão «Mudar o recorte temporal» e confronta a pista com a tua resposta.","g":"m9-f16-11"},{"t":"vf","p":"A análise das formas verbais dispensa explicar o efeito da interrupção na narrativa.","v":false,"f":"Identificar formas é apenas uma etapa. É necessário relacionar o contraste temporal com a mudança que atinge a personagem e a continuidade do trabalho. Relê o cartão «Mudar o recorte temporal» e confronta a pista com a tua resposta.","g":"m9-f16-12"},{"t":"ler","titulo":"A gramática não decide tudo","rot":"Lê e confronta","html":"<p>No excerto, o acidente interrompe a ação de uma pessoa concreta. A continuidade da obra não apaga essa perda. Uma análise que conte apenas verbos deixaria por explicar o efeito humano da mudança.<\/p><p>Não atribuas culpa ou intenção a uma personagem só porque identificaste uma interrupção. A relação temporal não demonstra, por si só, responsabilidade.<\/p><p>Contraexemplo à regra de que uma ação concluída é breve: trabalhou durante três anos apresenta uma longa duração como um todo. Critério: duração e modo de apresentar a ação são dimensões diferentes.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Conserva o acontecimento e compara apenas a maneira de o apresentar. Os complementos delimitam a ação ou indicam repetição?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Distingue três perguntas sobre a cena.","pares":[["Como é apresentada a ação?","Análise do aspeto"],["Que mudança atinge a personagem?","Interpretação do acontecimento"],["Quem é responsável pelo acidente?","Questão que exige provas próprias"]],"f":"As perguntas relacionam-se, mas não são equivalentes. O aspeto ajuda a ler a ocorrência; não fornece sozinho uma conclusão sobre responsabilidade. Relê o cartão «A gramática não decide tudo» e confronta a pista com a tua resposta.","g":"m9-f16-14"},{"t":"escolha","p":"Que alteração modifica o aspeto sem exigir um acontecimento diferente?","o":["Passar de estava a caminhar para caminhou até à porta.","Trocar a pessoa que caminha por outra que permanece sentada.","Substituir a caminhada por uma queda que não estava narrada."],"c":0,"f":"A primeira alteração muda o recorte temporal da caminhada. As outras mudam a ação ou a personagem, e não apenas a sua apresentação. Relê o cartão «A gramática não decide tudo» e confronta a pista com a tua resposta.","g":"m9-f16-15"},{"t":"completar","p":"Completa uma regra de leitura.","frase":"O valor aspetual depende da forma verbal e do [1]; a interpretação relaciona esse valor com a [2].","lacunas":[{"o":["contexto","alfabeto","parágrafo"],"c":0},{"o":["narrativa","conjugação","ortografia"],"c":0}],"f":"Complementos e marcadores ajudam a determinar o valor. A interpretação explica o que esse modo de apresentar o tempo faz sentir ou compreender. Relê o cartão «A gramática não decide tudo» e confronta a pista com a tua resposta.","g":"m9-f16-16"},{"t":"ordenar","p":"Ordena a articulação entre tempo narrativo, efeito humano e limite da conclusão.","passos":["O trabalho é apresentado enquanto decorre","Uma ocorrência interrompe a ação individual","A continuidade da obra contrasta com a perda","A relação temporal não demonstra responsabilidade"],"f":"A sequência liga os pormenores à interpretação e conserva o seu limite. Relê o modelo e o contraexemplo: Conserva o acontecimento e compara apenas a maneira de o apresentar. Os complementos delimitam a ação ou indicam repetição? Relê o cartão «A gramática não decide tudo» e confronta a pista com a tua resposta.","g":"m9-f16-17"},{"t":"escolha","p":"Que conclusão liga melhor gramática e interpretação?","o":["A rutura temporal torna percetível a interrupção de uma vida.","O tempo verbal prova sozinho a responsabilidade pelo acidente.","A duração da obra torna irrelevante a perda de quem trabalha."],"c":0,"f":"A primeira conclusão articula forma e efeito humano. Não transforma a gramática em prova de culpa nem deixa o avanço da obra apagar a pessoa. Relê o cartão «A gramática não decide tudo» e confronta a pista com a tua resposta.","g":"m9-f16-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Como pode a gramática fazer sentir uma interrupção?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
