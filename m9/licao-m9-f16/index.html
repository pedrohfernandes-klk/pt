<h1 class="c-sr">O instante dentro da duração</h1>
<main class="casca-corpo" tabindex="-1"><div id="baralho" class="jogo-alvo"></div></main>

<div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 9<br>Unidade 2</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação da lição"><a href="../#m9-f16">Esta lição no percurso</a><a href="../licao-m9-f05/">Lição anterior</a><a href="../licao-m9-f13/">Continuar o percurso</a></nav><p class="c-menu-extra">As citações têm crédito junto ao texto. Os exemplos criados estão identificados. O progresso fica neste aparelho.</p></div></div>

<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m9-f16",CARTOES=[{"t":"ler","titulo":"O instante dentro da duração","rot":"Abre","html":"<p class=\"abre\">Uma ação prolonga-se. Algo acontece e muda tudo. Como consegue a narração colocar um instante dentro de uma duração?<\/p><p>Na leitura anterior observaste quem trabalha na construção. Agora vais estudar como as formas verbais e a organização da frase apresentam a continuidade e a rutura.<\/p>"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>O <strong>tempo verbal<\/strong> localiza uma situação; o <strong>aspeto<\/strong> mostra como ela é apresentada: em curso, concluída, repetida, por exemplo. Uma situação longa pode ser apresentada como concluída; uma ação breve pode ser observada enquanto decorre.<\/p><p>José Saramago usa contrastes temporais na representação do trabalho e do acidente de Francisco Marques, em <i>Memorial do Convento<\/i>. A gramática participa no efeito narrativo.<\/p>"},{"t":"ler","titulo":"Uma ação em curso","rot":"Lê e confronta","html":"<blockquote>«está a fazer bem o trabalho»<\/blockquote><p>José Saramago, <i>Memorial do Convento<\/i>, Editorial Caminho, excerto disponibilizado pela Porto Editora, recurso 2363389, página 1 do PDF. O recurso não identifica o ano nem a página da edição do romance.<\/p><p><a href=\"https://recursos.portoeditora.pt/recurso?id=2363389\" target=\"_blank\" rel=\"noopener\">Lê o excerto na fonte editorial<\/a>. A passagem apresenta o trabalho de Francisco Marques e o acidente mortal que o interrompe. A análise seguinte distingue o decorrer de uma ação da apresentação de um acontecimento que a altera.<\/p>"},{"t":"escolha","p":"Que valor tem a construção verbal no recorte citado?","o":["Apresenta o trabalho enquanto está em curso.","Apresenta o trabalho depois de estar concluído.","Apresenta o trabalho como algo ainda prometido."],"c":0,"f":"Estar a seguido de infinitivo apresenta a ação no seu decorrer. Não informa, por si só, de quanto tempo ela durará nem garante que será concluída.","g":"m9-f16-3"},{"t":"vf","p":"Uma ação apresentada como concluída tem obrigatoriamente uma duração curta.","v":false,"f":"A conclusão e a duração são dimensões diferentes. Uma construção que durou anos pode ser apresentada como concluída numa única frase.","g":"m9-f16-4"},{"t":"emparelhar","p":"Relaciona cada exemplo didático criado com o modo de apresentar a situação.","pares":[["Estava a transportar a pedra.","Ação observada no seu decorrer"],["Transportou a pedra até ao destino.","Ação apresentada como concluída"],["Transportava uma pedra todos os dias.","Ação apresentada como habitual"]],"f":"As formas verbais trabalham com os restantes elementos da frase. Todos os dias explicita repetição; até ao destino delimita a ação.","g":"m9-f16-5"},{"t":"ler","titulo":"Mudar o recorte temporal","rot":"Lê e confronta","html":"<p>Exemplos didáticos criados: A: «A equipa trabalhava quando o apoio cedeu.» B: «A equipa trabalhou durante meses.»<\/p><p>Em A, a primeira situação fornece um fundo em curso e a segunda introduz uma ocorrência. Em B, uma duração longa é apresentada como um todo. Não confundas imperfeito com lentidão obrigatória nem perfeito com rapidez obrigatória.<\/p>"},{"t":"completar","p":"Completa a análise do exemplo A.","frase":"A forma trabalhava apresenta o [1] em curso; cedeu introduz uma ocorrência que [2] essa situação.","lacunas":[{"o":["trabalho","resultado","intervalo"],"c":0},{"o":["altera","repete","prevê"],"c":0}],"f":"A relação entre as duas situações produz o efeito de interrupção. Não é uma propriedade isolada de uma palavra fora da frase.","g":"m9-f16-7"},{"t":"ordenar","p":"Ordena o raciocínio para analisar um contraste aspetual.","passos":["Identificar as formas verbais","Observar os complementos e os marcadores temporais","Distinguir situação em curso e ocorrência delimitada","Relacionar o contraste com o efeito narrativo"],"f":"O contexto gramatical vem antes da interpretação. A mesma forma pode participar em valores diferentes conforme os elementos que a acompanham.","g":"m9-f16-8"},{"t":"sublinhar","p":"No exemplo criado, seleciona o marcador que relaciona a ocorrência com a ação em curso.","frase":"A equipa trabalhava quando o apoio cedeu.","certas":[3],"f":"Quando liga as duas situações no tempo. Com os tempos verbais usados, permite apresentar uma ocorrência dentro de um processo em curso.","g":"m9-f16-9"},{"t":"escolha","p":"Que frase criada apresenta uma ação longa como um todo concluído?","o":["A equipa trabalhou ali durante três anos.","A equipa estava a trabalhar quando chegámos.","A equipa trabalhava ali todas as manhãs."],"c":0,"f":"Trabalhou com durante três anos apresenta uma duração longa como um todo. Concluído não é sinónimo de rápido.","g":"m9-f16-10"},{"t":"vf","p":"A análise das formas verbais dispensa explicar o efeito da interrupção na narrativa.","v":false,"f":"Identificar formas é apenas uma etapa. É necessário relacionar o contraste temporal com a mudança que atinge a personagem e a continuidade do trabalho.","g":"m9-f16-11"},{"t":"ler","titulo":"A gramática não decide tudo","rot":"Lê e confronta","html":"<p>No excerto, o acidente interrompe a ação de uma pessoa concreta. A continuidade da obra não apaga essa perda. Uma análise que conte apenas verbos deixaria por explicar o efeito humano da mudança.<\/p><p>Não atribuas culpa ou intenção a uma personagem só porque identificaste uma interrupção. A relação temporal não demonstra, por si só, responsabilidade.<\/p>"},{"t":"emparelhar","p":"Distingue três perguntas sobre a cena.","pares":[["Como é apresentada a ação?","Análise do aspeto"],["Que mudança atinge a personagem?","Interpretação do acontecimento"],["Quem é responsável pelo acidente?","Questão que exige provas próprias"]],"f":"As perguntas relacionam-se, mas não são equivalentes. O aspeto ajuda a ler a ocorrência; não fornece sozinho uma conclusão sobre responsabilidade.","g":"m9-f16-13"},{"t":"escolha","p":"Que alteração modifica o aspeto sem exigir um acontecimento diferente?","o":["Passar de estava a caminhar para caminhou até à porta.","Trocar a pessoa que caminha por outra que permanece sentada.","Substituir a caminhada por uma queda que não estava narrada."],"c":0,"f":"A primeira alteração muda o recorte temporal da caminhada. As outras mudam a ação ou a personagem, e não apenas a sua apresentação.","g":"m9-f16-14"},{"t":"completar","p":"Completa uma regra de leitura.","frase":"O valor aspetual depende da forma verbal e do [1]; a interpretação relaciona esse valor com a [2].","lacunas":[{"o":["contexto","alfabeto","parágrafo"],"c":0},{"o":["narrativa","conjugação","ortografia"],"c":0}],"f":"Complementos e marcadores ajudam a determinar o valor. A interpretação explica o que esse modo de apresentar o tempo faz sentir ou compreender.","g":"m9-f16-15"},{"t":"ordenar","p":"Planeia duas versões curtas da mesma cena, sem escrita obrigatória.","passos":["Escolher uma ação e uma ocorrência que a interrompa","Apresentar primeiro a ação enquanto decorre","Apresentar depois essa ação como um todo","Comparar oralmente os efeitos das duas versões"],"f":"Conservar a cena permite observar o efeito da alteração gramatical. Se mudasses todos os acontecimentos, seria difícil atribuir a diferença ao aspeto.","g":"m9-f16-16"},{"t":"escolha","p":"Que conclusão liga melhor gramática e interpretação?","o":["A rutura temporal torna percetível a interrupção de uma vida.","O tempo verbal prova sozinho a responsabilidade pelo acidente.","A duração da obra torna irrelevante a perda de quem trabalha."],"c":0,"f":"A primeira conclusão articula forma e efeito humano. Não transforma a gramática em prova de culpa nem deixa o avanço da obra apagar a pessoa.","g":"m9-f16-17"},{"t":"vf","p":"No exemplo criado «trabalhava ali todos os dias», o imperfeito apresenta uma situação habitual.","v":true,"f":"Todos os dias torna explícita a repetição. O imperfeito não serve apenas para apresentar uma ação única interrompida: o valor depende do contexto.","g":"m9-f16-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Concluído não significa rápido; em curso não significa eterno.<\/p><p>Cria oralmente duas versões de uma ação: observada enquanto decorre e apresentada como um todo. Explica a diferença e regressa ao efeito da interrupção no excerto.<\/p>"}];
