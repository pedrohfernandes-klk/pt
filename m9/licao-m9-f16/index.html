window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m9-f16",CARTOES=[{"t":"ler","titulo":"O instante dentro da duração","rot":"Abre","html":"<p class=\"abre\"><strong>Como pode a gramática fazer sentir uma interrupção?<\/strong><\/p><p class=\"abre\">Uma ação prolonga-se. Algo acontece e muda tudo. Como consegue a narração colocar um instante dentro de uma duração?<\/p><p>Na leitura anterior observaste quem trabalha na construção. Agora vais estudar como as formas verbais e a organização da frase apresentam a continuidade e a rutura.<\/p>"},{"t":"vf","p":"Antes de reler. Na F05, identificar quem executa o trabalho permitia determinar a duração da ação?","v":false,"f":"Confundir o agente com o recorte temporal mistura perguntas diferentes. Regressa à F05 para identificar quem trabalha; agora será necessário observar as formas verbais e os marcadores para estudar a duração.","g":"m9-f16-1","fe":"Confundes saber quem trabalha com saber durante quanto tempo trabalha. Relê, na F05, a lista de nomes de «A pedra e os nomes»: diz quem vai na viagem, não quanto tempo dura o trabalho."},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>O <strong>tempo verbal<\/strong> localiza uma situação; o <strong>aspeto<\/strong> mostra como ela é apresentada: em curso, concluída, repetida, por exemplo. Uma situação longa pode ser apresentada como concluída; uma ação breve pode ser observada enquanto decorre.<\/p><p>José Saramago usa contrastes temporais na representação do trabalho e do acidente de Francisco Marques, em <i>Memorial do Convento<\/i>. A gramática participa no efeito narrativo.<\/p>"},{"t":"ler","titulo":"Uma ação em curso","rot":"Lê de perto","html":"<blockquote>«está a fazer bem o trabalho»<\/blockquote><p>José Saramago, <i>Memorial do Convento<\/i>, Editorial Caminho, excerto disponibilizado pela Porto Editora, recurso 2363389, página 1 do PDF. O recurso não identifica o ano nem a página da edição do romance.<\/p><p><a href=\"https://recursos.portoeditora.pt/recurso?id=2363389\" target=\"_blank\" rel=\"noopener\">Lê o excerto na fonte editorial<\/a>. Se o acesso não estiver disponível, lê a passagem na edição da turma. A passagem apresenta o trabalho de Francisco Marques e o acidente mortal que o interrompe. A análise seguinte distingue o decorrer de uma ação da apresentação de um acontecimento que a altera.<\/p>"},{"t":"escolha","p":"Que valor tem a construção verbal no recorte citado?","o":["Apresenta o trabalho enquanto está em curso.","Apresenta o trabalho depois de estar concluído.","Apresenta o trabalho como algo ainda prometido."],"c":0,"f":"«Estar a» seguido de infinitivo apresenta a ação no seu decorrer. Não informa, por si só, de quanto tempo ela durará nem garante que será concluída.","g":"m9-f16-4","fe":["«Estar a» seguido de infinitivo apresenta a ação no seu decorrer. Não informa, por si só, de quanto tempo ela durará nem garante que será concluída.","Confundes ação em curso com ação apresentada como terminada. Relê a construção verbal que situa o trabalho no seu decorrer.","Confundes duração em curso com ação projetada no futuro. Relê o momento em que o trabalho é interrompido."]},{"t":"vf","p":"No exemplo criado «trabalhou durante três anos», uma ação longa é apresentada como um todo concluído.","v":true,"f":"A conclusão e a duração são dimensões diferentes. Uma construção que durou anos pode ser apresentada como concluída numa única frase.","g":"m9-f16-5","fe":"Confundes ação concluída com ação breve. Relê, em «O essencial», a frase: «Uma situação longa pode ser apresentada como concluída»."},{"t":"emparelhar","p":"Relaciona cada exemplo didático criado com o modo de apresentar a situação.","pares":[["Estava a transportar a pedra.","Ação observada no seu decorrer"],["Transportou a pedra até ao destino.","Ação apresentada como concluída"],["Transportava uma pedra todos os dias.","Ação apresentada como habitual"]],"f":"As formas verbais trabalham com os restantes elementos da frase. «Todos os dias» explicita repetição; «até ao destino» delimita a ação.","g":"m9-f16-6","fe":"Ligas cada exemplo a um valor sem observar os complementos que o acompanham. Relê, em «O essencial», os modos de apresentar uma situação: em curso, concluída, repetida."},{"t":"ler","titulo":"Mudar o recorte temporal","rot":"Para entender","html":"<p>Exemplos criados para esta lição. A: A equipa trabalhava quando o apoio cedeu. B: A equipa trabalhou durante meses.<\/p><p>Em A, a primeira situação fornece um fundo em curso e a segunda introduz uma ocorrência. Em B, uma duração longa é apresentada como um todo. Não confundas imperfeito com lentidão obrigatória nem perfeito com rapidez obrigatória.<\/p><p><strong>Modelo completo.<\/strong> No exemplo criado, «trabalhava» apresenta uma situação em curso e «cedeu» introduz uma ocorrência. A relação produz interrupção. O tempo verbal, sozinho, não determina a responsabilidade pelo acontecimento.<\/p>"},{"t":"escolha","p":"Que frase criada apresenta uma ação longa como um todo concluído?","o":["A equipa trabalhou ali durante três anos.","A equipa estava a trabalhar quando chegámos.","A equipa trabalhava ali todas as manhãs."],"c":0,"f":"«Trabalhou», com «durante três anos», apresenta uma duração longa como um todo. Concluído não é sinónimo de rápido.","g":"m9-f16-11","fe":["«Trabalhou», com «durante três anos», apresenta uma duração longa como um todo. Concluído não é sinónimo de rápido.","Confundes o trabalho em curso com a duração tomada como um todo. Compara «estava a trabalhar» com «durante três anos».","Confundes repetição habitual com duração concluída. Repara no alcance de «todas as manhãs» e compara-o com «durante três anos»."]},{"t":"sublinhar","p":"Que palavra distingue uma ocorrência situada dentro da ação de duas ações sem relação explicitada?","frase":"A equipa trabalhava quando o apoio cedeu.","certas":[3],"f":"«Quando» liga as duas situações no tempo. Com os tempos verbais usados, permite apresentar uma ocorrência dentro de um processo em curso.","g":"m9-f16-10","fe":"Escolhes uma das ações em vez da palavra que as relaciona. Relê a frase e procura o que situa a ocorrência dentro da ação em curso."},{"t":"completar","p":"Completa a análise do exemplo A.","frase":"A forma «trabalhava» apresenta o [1] em curso; «cedeu» introduz uma ocorrência que [2] essa situação.","lacunas":[{"o":["trabalho","resultado","intervalo"],"c":0},{"o":["altera","repete","prevê"],"c":0}],"f":"A relação entre as duas situações produz o efeito de interrupção. Não é uma propriedade isolada de uma palavra fora da frase.","g":"m9-f16-8","fe":"Confundes a situação em curso com o seu resultado ou com uma repetição. Relê o modelo completo de «Mudar o recorte temporal»: «trabalhava» apresenta uma situação em curso e «cedeu» introduz uma ocorrência."},{"t":"ordenar","p":"Ordena o raciocínio para analisar um contraste aspetual.","passos":["Identificar as formas verbais","Observar os complementos e os marcadores temporais","Distinguir situação em curso e ocorrência delimitada","Relacionar o contraste com o efeito narrativo"],"f":"O contexto gramatical vem antes da interpretação. A mesma forma pode participar em valores diferentes conforme os elementos que a acompanham.","g":"m9-f16-9","fe":"Interpretas o efeito antes de identificar as formas e os marcadores que o produzem. Relê o modelo completo de «Mudar o recorte temporal»: as formas verbais vêm antes da conclusão de que a relação produz interrupção."},{"t":"ler","titulo":"A gramática não decide tudo","rot":"Compara","html":"<p>No excerto, o acidente interrompe a ação de uma pessoa concreta. A continuidade da obra não apaga essa perda. Uma análise que conte apenas verbos deixaria por explicar o efeito humano da mudança.<\/p><p>Não atribuas culpa ou intenção a uma personagem só porque identificaste uma interrupção. A relação temporal não demonstra, por si só, responsabilidade.<\/p><p>Contraexemplo à regra de que uma ação concluída é breve: «trabalhou durante três anos» apresenta uma longa duração como um todo. Critério: duração e modo de apresentar a ação são dimensões diferentes.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Conserva o acontecimento e compara apenas a maneira de o apresentar. Os complementos delimitam a ação ou indicam repetição?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Distingue três perguntas sobre a cena.","pares":[["Como é apresentada a ação?","Análise do aspeto"],["Que mudança atinge a personagem?","Interpretação do acontecimento"],["Quem é responsável pelo acidente?","Questão que exige provas próprias"]],"f":"As perguntas relacionam-se, mas não são equivalentes. O aspeto ajuda a ler a ocorrência; não fornece sozinho uma conclusão sobre responsabilidade.","g":"m9-f16-14","fe":"Fazes do aspeto verbal a resposta a todas as perguntas sobre a cena. Relê, em «A gramática não decide tudo», a frase: «A relação temporal não demonstra, por si só, responsabilidade»."},{"t":"completar","p":"Completa uma regra de leitura.","frase":"O valor aspetual depende da forma verbal e do [1]; a interpretação relaciona esse valor com a [2].","lacunas":[{"o":["contexto","alfabeto","parágrafo"],"c":0},{"o":["narrativa","conjugação","ortografia"],"c":0}],"f":"Complementos e marcadores ajudam a determinar o valor. A interpretação explica o que esse modo de apresentar o tempo faz sentir ou compreender.","g":"m9-f16-16","fe":"Isolas a forma verbal do contexto, ou a análise do efeito narrativo. Relê, em «O essencial», a frase: «A gramática participa no efeito narrativo»."},{"t":"vf","p":"A relação entre ação em curso e interrupção ajuda a explicar o contraste entre a vida individual e a continuidade da obra.","v":true,"f":"Identificar as formas é só o primeiro passo. A ação em curso interrompida pelo acidente torna percetível a perda de uma vida, enquanto a obra continua.","g":"m9-f16-12","fe":"Separas a análise das formas verbais do efeito humano da interrupção. Relê, em «A gramática não decide tudo», a frase: «A continuidade da obra não apaga essa perda»."},{"t":"escolha","p":"Que alteração modifica o aspeto sem exigir um acontecimento diferente?","o":["Passar de «estava a caminhar» para «caminhou até à porta».","Trocar a pessoa que caminha por outra que permanece sentada.","Substituir a caminhada por uma queda que não estava narrada."],"c":0,"f":"Passar de «estava a caminhar» para «caminhou até à porta» muda o recorte temporal da caminhada. Trocar a pessoa ou acrescentar uma queda muda a ação ou a personagem, e não apenas a sua apresentação.","g":"m9-f16-15","fe":["Passar de «estava a caminhar» para «caminhou até à porta» muda o recorte temporal da caminhada. Trocar a pessoa ou acrescentar uma queda muda a ação ou a personagem, e não apenas a sua apresentação.","Mudas o agente e a ação, não apenas o modo de apresentar o tempo. Compara a pessoa que caminha nas duas formulações.","Introduzes um acontecimento diferente em vez de alterar o aspeto. Mantém a caminhada e confronta o seu decorrer com o seu limite."]},{"t":"escolha","p":"Que conclusão liga melhor gramática e interpretação?","o":["A rutura temporal torna percetível a interrupção de uma vida.","O tempo verbal torna percetível a responsabilidade pelo acidente.","A duração da obra torna irrelevante a perda de quem trabalha."],"c":0,"f":"Ligar a rutura temporal à interrupção de uma vida articula forma e efeito humano. Não transforma a gramática em prova de culpa nem deixa o avanço da obra apagar a pessoa.","g":"m9-f16-18","fe":["Ligar a rutura temporal à interrupção de uma vida articula forma e efeito humano. Não transforma a gramática em prova de culpa nem deixa o avanço da obra apagar a pessoa.","Confundes relação temporal com prova de responsabilidade. Relê a interrupção e separa o que aconteceu da explicação da causa.","Transformas a duração da obra em medida do valor de uma vida. Regressa ao contraste entre continuidade coletiva e interrupção individual."]},{"t":"ordenar","p":"Ordena a articulação entre tempo narrativo, efeito humano e limite da conclusão.","passos":["O trabalho é apresentado enquanto decorre","Uma ocorrência interrompe a ação individual","A continuidade da obra contrasta com a perda","A relação temporal não demonstra responsabilidade"],"f":"A ocorrência interrompe uma ação em curso, enquanto a obra continua. Este contraste explica um efeito humano, mas a relação temporal não demonstra a responsabilidade pelo acidente.","g":"m9-f16-17","fe":"Pões o limite da conclusão antes da interrupção e do contraste que ele qualifica. Relê «A gramática não decide tudo»: o acidente interrompe a ação de uma pessoa concreta, e a continuidade da obra não apaga essa perda."},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Como pode a gramática fazer sentir uma interrupção?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
