<script>
(function(){

var ID="M9", D=[{"t":"Memorial do Convento: a história","q":[["Memorial do Convento foi publicado em…",["1982","1998","1970","2005"],0,"1982."],["O convento de Mafra nasce de uma promessa de D. João V…",["se tivesse um herdeiro","se ganhasse uma guerra","se encontrasse ouro","se chovesse"],0,"Promessa pelo nascimento de descendência."],["Baltasar Sete-Sóis é…",["um soldado que perdeu a mão esquerda na guerra","um padre","um músico italiano","o rei"],0,"Maneta, veterano."],["Blimunda Sete-Luas tem o poder de…",["ver o interior das pessoas quando está em jejum","voar","adivinhar o futuro","falar com animais"],0,"Vê por dentro."],["A passarola é construída pelo…",["Padre Bartolomeu Lourenço de Gusmão","Padre António Vieira","Marquês de Pombal","rei"],0,"Com Baltasar e Blimunda."],["A passarola voa graças a…",["vontades humanas recolhidas por Blimunda","carvão","vento do mar","magia do rei"],0,"Vontades guardadas em esferas."],["Domenico Scarlatti é…",["um músico que se junta ao grupo","o arquiteto do convento","um inquisidor","o bispo"],0,"Músico italiano na corte."],["Baltasar morre…",["num auto de fé da Inquisição","na guerra","no convento","de velhice"],0,"Blimunda encontra-o na fogueira."]]},{"t":"Crítica e sentido","q":[["A construção do convento mostra…",["o sacrifício de milhares de trabalhadores pela vaidade do rei","a riqueza do povo","um projeto popular","a vontade dos operários"],0,"Crítica ao poder."],["A Inquisição surge como…",["instrumento de repressão e medo","uma escola","um hospital","uma festa"],0,"Autos de fé."],["O ouro que paga a obra vinha sobretudo…",["do Brasil","da Índia","de Espanha","de Inglaterra"],0,"Ouro do Brasil, séc. XVIII."],["O romance dá voz…",["aos anónimos que a História oficial esquece","só aos reis","só aos padres","a ninguém"],0,"«Quem construiu?»"],["A passarola simboliza…",["o sonho, a liberdade e o conhecimento","o poder do rei","a guerra","o dinheiro"],0,"O voo contra a opressão."],["O amor de Baltasar e Blimunda é…",["livre, fora das convenções","um casamento de conveniência","proibido pelo rei","inexistente"],0,"Amor verdadeiro e igual."]]},{"t":"O estilo de Saramago","q":[["Nos diálogos, Saramago usa sobretudo…",["vírgulas e maiúsculas, sem travessões","travessões e aspas","só dois-pontos","parágrafos novos para cada fala"],0,"Marca as vozes com vírgula e maiúscula."],["O narrador do Memorial é…",["omnisciente e interventivo, com comentários e ironia","uma personagem jovem","neutro e silencioso","o rei"],0,"Comenta e dialoga com o leitor."],["A ironia do narrador serve para…",["criticar o poder e a Igreja","elogiar o rei","descrever paisagens","fazer publicidade"],0,"Crítica."],["As frases longas de Saramago aproximam a escrita…",["da oralidade, do contar em voz alta","da poesia trovadoresca","dos jornais","das mensagens curtas"],0,"Ritmo oral."],["Saramago recebeu o Prémio Nobel da Literatura em…",["1998","1982","2010","1974"],0,"1998."],["Intertextualidade é…",["a relação de um texto com outros textos","o índice de um livro","a capa","o resumo"],0,"Diálogo entre obras."]]},{"t":"Discurso no discurso","q":[["Frase inventada, à maneira de Saramago: «Disse Blimunda, Vou contigo». Com pontuação convencional fica:",["Disse Blimunda: — Vou contigo.","Disse Blimunda que vou contigo.","Disse Blimunda, vou contigo?","Blimunda vou contigo disse"],0,"Dois-pontos e travessão."],["Em discurso indireto: «Baltasar disse: — Amanhã partimos.»",["Baltasar disse que no dia seguinte partiam.","Baltasar disse que amanhã partimos.","Baltasar disse: partiam.","Baltasar partiu amanhã."],0,"Mudam tempo verbal e deixis."],["Um verbo introdutor do discurso é, por exemplo,…",["«perguntou»","«casa»","«rapidamente»","«mas»"],0,"dizer, perguntar, responder…"],["Um narrador relata, de fora, a fala de outra pessoa. Nesse relato, o «eu» de quem falou passa a…",["3.ª pessoa","1.ª pessoa do plural","2.ª pessoa","fica igual sempre"],0,"É esta a situação mais comum. Se fosse a própria pessoa a relatar-se manteria a 1.ª; se falasse com o interlocutor, podia usar a 2.ª."],["O discurso direto reproduz…",["as palavras tal como foram ditas","um resumo do narrador","só pensamentos","só descrições"],0,"Fidelidade à fala."],["Em Saramago, a maiúscula a meio da frase pode indicar…",["o início da fala de outra personagem","um erro","um nome de lugar sempre","o fim do capítulo"],0,"Marca da mudança de voz."]]},{"t":"Coerência e coesão","q":[["«Portanto» tem valor…",["conclusivo","adversativo","temporal","causal"],0,"Conclusão."],["«Contudo» tem valor…",["adversativo","conclusivo","aditivo","explicativo"],0,"Oposição."],["«Além disso» tem valor…",["aditivo","adversativo","conclusivo","concessivo"],0,"Acrescenta."],["«Os trabalhadores chegaram a Mafra. Ali ficaram anos.» «Ali» é…",["anáfora (coesão referencial)","catáfora","conector","elipse"],0,"Retoma «Mafra»."],["Usar «o rei», «D. João V», «o monarca» para a mesma pessoa é coesão…",["lexical","temporal","interfrásica","nenhuma"],0,"Substituição lexical."],["A coerência de um texto depende…",["da continuidade de sentido e da ausência de contradições","do tamanho das frases","do número de vírgulas","da letra"],0,"Sentido global."]]}], CHAVE="epi-pt-quiz-"+ID, $=function(s){return document.querySelector(s)}, atual=-1;

function abrirQuiz(i){atual=i;var z=D[i];$("#titulo-q").textContent=(i+1)+". "+z.t;var f=$("#form");f.innerHTML="";z.q.forEach(function(q,k){var d=document.createElement("div");d.className="q";var p=document.createElement("p");p.textContent=(k+1)+". "+q[0];d.appendChild(p);q[1].forEach(function(o,j){var l=document.createElement("label");l.className="op";var r=document.createElement("input");r.type="radio";r.name="q"+k;r.value=j;l.appendChild(r);l.appendChild(document.createTextNode(" "+o));d.appendChild(l)});var ex=document.createElement("div");ex.className="exp";ex.hidden=true;d.appendChild(ex);f.appendChild(d)});$("#resultado").hidden=true;$("#repetir").hidden=true;$("#corrigir").hidden=false;mostrar("quiz")}

$("#voltar-2").addEventListener("click",function(e){e.preventDefault();estados();mostrar("indice")});

$("#repetir").addEventListener("click",function(e){e.preventDefault();abrirQuiz(atual)});
estados();
})();
</script></body></html>
