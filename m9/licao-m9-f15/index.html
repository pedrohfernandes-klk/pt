<div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 9<br>Unidade 1</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação da lição"><a href="../#m9-f15">Esta lição no percurso</a><a href="../licao-m9-f14/">Lição anterior</a><a href="../licao-m9-f02/">Continuar o percurso</a></nav><p class="c-menu-extra">As citações têm crédito junto ao texto. Os exemplos criados estão identificados. O progresso fica neste aparelho.</p></div></div>

<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m9-f15",CARTOES=[{"t":"ler","titulo":"A festa vista do outro lado","rot":"Abre","html":"<p class=\"abre\">Como muda uma cena quando deixamos de olhar apenas para quem assiste?<\/p><p class=\"abre\">A mesma praça pode ser um lugar de diversão para uns e de sofrimento para outros. Como torna o narrador essa diferença impossível de ignorar?<\/p><p>Vais ler o contraste de perspetivas na representação de um auto de fé, sem reproduzir a violência em encenação.<\/p>"},{"t":"vf","p":"Antes de reler. Recupera a leitura da F02: a posição de quem assiste a uma cerimónia pode ser diferente da experiência de quem é exposto nela?","v":true,"f":"Confundir a experiência do público com a de quem é julgado apaga posições diferentes. Regressa à cena do auto de fé e distingue observadores e condenados antes de interpretar a solenidade. Relê essa distinção na lição anterior depois de tentares responder.","g":"m9-f15-1"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>No capítulo V de <i>Memorial do Convento<\/i>, José Saramago põe em tensão a cerimónia pública e a experiência dos condenados. Trata-se de uma representação literária da violência inquisitorial.<\/p><p>A <strong>ironia<\/strong> pode surgir quando uma formulação tranquila entra em conflito com aquilo que está a acontecer. O contraste entre pontos de vista obriga a perguntar quem suporta as consequências da cena.<\/p>"},{"t":"ler","titulo":"Uma palavra fora de lugar?","rot":"Lê e confronta","html":"<blockquote>«a descansada leitura das sentenças»<\/blockquote><p>José Saramago, <i>Memorial do Convento<\/i>, capítulo V. Recorte citado por Celeste Maria Ferreira Cabo Verde, <i>A Comunicação Oral na Sala de Aula<\/i>, FCSH, Universidade Nova de Lisboa, setembro de 2011, anexo XI, página 78 do PDF. A apresentação indica p. 49 do romance, sem identificar aí uma edição que permita generalizar essa página.<\/p><p><a href=\"https://run.unl.pt/server/api/core/bitstreams/99f70c8f-bd86-4e14-9ae5-aff8a68c13eb/content#page=78\" target=\"_blank\" rel=\"noopener\">Consulta a fonte académica e a análise do episódio<\/a>. Lê o capítulo na edição da turma. Nesta cena, a tranquilidade da cerimónia contrasta com o sofrimento de quem é condenado.<\/p>"},{"t":"escolha","p":"Que relação torna crítica a expressão citada?","o":["Tranquilidade da leitura perante consequências violentas.","Tranquilidade dos condenados perante a leitura das penas.","Tranquilidade do público como prova de acordo com as penas."],"c":0,"f":"A palavra que sugere repouso entra em conflito com a gravidade das sentenças. A ironia depende dessa relação, não de a palavra ser sempre irónica. Relê o cartão «Uma palavra fora de lugar?» e confronta a pista com a tua resposta.","g":"m9-f15-4"},{"t":"vf","p":"Identificar a ironia significa concluir que o narrador aprova a violência.","v":false,"f":"A ironia permite distanciar a narração da aparência solene. O contraste expõe a violência que essa aparência pode normalizar. Relê o cartão «Uma palavra fora de lugar?» e confronta a pista com a tua resposta.","g":"m9-f15-5"},{"t":"emparelhar","p":"Liga cada plano ao problema de leitura que levanta.","pares":[["Quem observa a cerimónia","Como se transforma sofrimento em espetáculo?"],["Quem recebe a sentença","Que consequências a cerimónia produz?"],["Como a cena é narrada","Que contraste orienta a leitura?"]],"f":"A análise distingue posições e escolhas narrativas. Não atribui a todas as pessoas a mesma experiência apenas por estarem no mesmo lugar. Relê o cartão «Uma palavra fora de lugar?» e confronta a pista com a tua resposta.","g":"m9-f15-6"},{"t":"ler","titulo":"Dois planos em confronto","rot":"Lê e confronta","html":"<p>A representação aproxima o conforto da assistência e a vulnerabilidade dos condenados. O efeito crítico nasce da coexistência dessas situações, não de uma explicação abstrata sobre o mal.<\/p><p>Modelo: observa um sinal de tranquilidade, relaciona-o com as consequências da condenação e explica a distância entre as duas experiências. Evita transformar a cena numa curiosidade pitoresca.<\/p><p><strong>Modelo completo.<\/strong> Uma leitura apresentada como descansada pode ser confrontada com a gravidade das sentenças. A diferença entre as posições produz a tensão. Não é necessário atribuir o mesmo sentimento a cada pessoa do público.<\/p>"},{"t":"completar","p":"Completa uma leitura do contraste.","frase":"A mesma cerimónia recebe sentidos [1] conforme a posição de quem a vive; o narrador torna essa diferença [2].","lacunas":[{"o":["distintos","uniformes","imutáveis"],"c":0},{"o":["visível","inócua","secreta"],"c":0}],"f":"A diferença de posição não é um detalhe exterior. É uma forma de tornar percetível o que a aparência festiva deixa fora do seu centro. Relê o cartão «Dois planos em confronto» e confronta a pista com a tua resposta.","g":"m9-f15-8"},{"t":"ordenar","p":"Ordena o caminho de uma interpretação da ironia.","passos":["Localizar uma expressão de tranquilidade","Identificar as consequências da cerimónia","Explicar a tensão entre palavra e situação","Concluir sobre a distância crítica da narração"],"f":"O efeito resulta de uma relação comprovável. Dizer apenas que há ironia não mostra como ela funciona. Relê o cartão «Dois planos em confronto» e confronta a pista com a tua resposta.","g":"m9-f15-9"},{"t":"sublinhar","p":"Que palavra permite confrontar o modo de ler com a gravidade das sentenças?","frase":"a descansada leitura das sentenças","certas":[1],"f":"Descansada sugere serenidade. O confronto com a violência das consequências transforma essa serenidade num indício crítico. Relê o cartão «Dois planos em confronto» e confronta a pista com a tua resposta.","g":"m9-f15-10"},{"t":"escolha","p":"Que mudança de foco recupera a dimensão humana da cena?","o":["Observar o efeito da cerimónia na vida dos condenados.","Deduzir a justiça da cerimónia da sua ordem e solenidade.","Deduzir a reação dos condenados do comportamento público."],"c":0,"f":"A mudança de foco não elimina a forma da cerimónia; pergunta quem paga o seu custo e como essa experiência é representada. Relê o cartão «Dois planos em confronto» e confronta a pista com a tua resposta.","g":"m9-f15-11"},{"t":"vf","p":"Todas as descrições de cerimónias são necessariamente irónicas.","v":false,"f":"É necessário observar o texto concreto. Sem tensão entre formulação e contexto, a etiqueta ironia pode ser uma interpretação imposta. Relê o cartão «Dois planos em confronto» e confronta a pista com a tua resposta.","g":"m9-f15-12"},{"t":"ler","titulo":"Testa o mesmo procedimento","rot":"Lê e confronta","html":"<p>Cena didática criada: numa cerimónia de prémios, a organização elogia o ambiente tranquilo enquanto impede uma trabalhadora de explicar as condições em que fez o trabalho.<\/p><p>Não é uma equivalência histórica com a Inquisição. Serve apenas para observar um procedimento: pôr em confronto uma aparência pública e uma experiência excluída dessa aparência.<\/p><p>Contraexemplo à conclusão de que o público inteiro sente o mesmo: a referência coletiva não individualiza todas as reações. Critério: uma conclusão sobre cada pessoa exige uma marca que a distinga dentro do grupo.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Identifica a quem pertence o conforto e sobre quem recai a sentença. A descrição de um gesto permite deduzir a intenção de toda a multidão?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Distingue os três níveis da comparação proposta.","pares":[["A cerimónia criada para a atividade","Exemplo didático contemporâneo"],["O episódio do capítulo V","Representação literária situada"],["Contrastar aparência e experiência","Procedimento que se pode comparar"]],"f":"Comparar um procedimento não iguala a gravidade nem o contexto dos acontecimentos. Explicitar esse limite torna a analogia mais rigorosa. Relê o cartão «Testa o mesmo procedimento» e confronta a pista com a tua resposta.","g":"m9-f15-14"},{"t":"escolha","p":"Que pergunta melhora a leitura da cena didática?","o":["Que experiência falta na tranquilidade apresentada?","Que acordo se comprova na tranquilidade apresentada?","Que inocência se prova na tranquilidade apresentada?"],"c":0,"f":"A primeira pergunta procura informação excluída da aparência pública. As outras transformam sinais de aprovação em prova de justiça. Relê o cartão «Testa o mesmo procedimento» e confronta a pista com a tua resposta.","g":"m9-f15-15"},{"t":"completar","p":"Completa o limite da analogia.","frase":"Podemos comparar uma [1] narrativa sem declarar os acontecimentos de [2].","lacunas":[{"o":["estratégia","cronologia","estatística"],"c":0},{"o":["igual gravidade","épocas distintas","natureza diversa"],"c":0}],"f":"A analogia tem um âmbito: aqui, a construção do contraste. Não apaga diferenças de época, violência, responsabilidade ou consequência. Relê o cartão «Testa o mesmo procedimento» e confronta a pista com a tua resposta.","g":"m9-f15-16"},{"t":"ordenar","p":"Ordena a construção do contraste e o limite da inferência sobre a multidão.","passos":["A cerimónia reúne posições desiguais","A solenidade enquadra a exposição dos condenados","A leitura descansada contrasta com as sentenças","A referência coletiva não prova cada reação individual"],"f":"A sequência liga os pormenores à interpretação e conserva o seu limite. Relê o modelo e o contraexemplo: Identifica a quem pertence o conforto e sobre quem recai a sentença. A descrição de um gesto permite deduzir a intenção de toda a multidão? Relê o cartão «Testa o mesmo procedimento» e confronta a pista com a tua resposta.","g":"m9-f15-17"},{"t":"escolha","p":"Que proposta criativa testa o contraste sem encenar a violência?","o":["Criar duas legendas da praça, de posições distintas.","Criar duas legendas da praça, mudando só os adjetivos.","Criar duas legendas da praça, mantendo a mesma posição."],"c":0,"f":"As legendas permitem trabalhar foco e seleção de informação. Não exigem reproduzir sofrimento nem validar as acusações representadas. Relê o cartão «Testa o mesmo procedimento» e confronta a pista com a tua resposta.","g":"m9-f15-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Como muda uma cena quando deixamos de olhar apenas para quem assiste?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
