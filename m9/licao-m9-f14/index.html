<div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 9<br>Unidade 1</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação da lição"><a href="../#m9-f14">Esta lição no percurso</a><a href="../licao-m9-f01/">Lição anterior</a><a href="../licao-m9-f15/">Continuar o percurso</a></nav><p class="c-menu-extra">As citações têm crédito junto ao texto. Os exemplos criados estão identificados. O progresso fica neste aparelho.</p></div></div>

<script>
window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m9-f14",CARTOES=[{"t":"ler","titulo":"Um rei em miniatura","rot":"Abre","html":"<p class=\"abre\">Que revela um rei quando monta uma basílica sobre a mesa?<\/p><p class=\"abre\">Um objeto pequeno pode revelar uma ideia enorme de poder. Como passa o narrador de uma miniatura para a caracterização de quem a monta?<\/p><p>Vais separar o pormenor observado, a interpretação e o limite da comparação.<\/p><figure class=\"fig documento\"><a href=\"../../img/fontes/licoes-20261101/piranesi.jpg\" aria-label=\"Abrir a imagem inteira\"><img src=\"../../img/fontes/licoes-20261101/piranesi.jpg\" alt=\"Gravura do interior da Basílica de São Pedro: pequenas figuras humanas entre colunas e abóbadas monumentais.\"><\/a><figcaption><p>A escala das figuras humanas permite comparar dimensão e grandeza. A gravura representa a basílica, não a miniatura do rei nem a cena do romance.<\/p><details><summary>Créditos e fonte da imagem<\/summary><table><caption>Identificação do documento visual<\/caption><tr><th scope=\"row\">Autor<\/th><td>Giovanni Battista Piranesi<\/td><\/tr><tr><th scope=\"row\">Obra<\/th><td>Vista interior da Basílica de São Pedro, de Vedute di Roma<\/td><\/tr><tr><th scope=\"row\">Data<\/th><td>Cerca de 1748<\/td><\/tr><tr><th scope=\"row\">Instituição ou acervo<\/th><td>The Metropolitan Museum of Art, inventário 1972.620.1. Oferta de Mrs. Otto F. Langmann, 1972.<\/td><\/tr><tr><th scope=\"row\">Licença<\/th><td><a href=\"https://www.metmuseum.org/art/collection/search/353966\">Domínio público<\/a><\/td><\/tr><\/table><p><a href=\"https://www.metmuseum.org/art/collection/search/353966\">Consultar a fonte e os direitos<\/a>. Reprodução redimensionada, sem recorte.<\/p><\/details><\/figcaption><\/figure>"},{"t":"vf","p":"Antes de reler. Recupera a abertura do romance: uma personagem histórica representada em ficção equivale a um registo documental dos seus atos?","v":false,"f":"Confundir personagem e documento transforma uma construção literária em prova histórica. Regressa à abertura da F01 e distingue a pessoa histórica da forma como o narrador apresenta o poder. Relê essa distinção na lição anterior depois de tentares responder.","g":"m9-f14-1"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>Em <i>Memorial do Convento<\/i>, José Saramago constrói uma representação ficcional do reinado de D. João V. Um romance histórico não é uma transcrição neutra do passado.<\/p><p>A <strong>caracterização indireta<\/strong> faz-se através de ações, objetos e relações. A <strong>sátira<\/strong> pode expor uma pretensão ao aproximar grandeza e pequenez. O objeto não tem um significado fixo fora do contexto.<\/p>"},{"t":"ler","titulo":"O episódio e as fontes","rot":"Lê e confronta","html":"<p>Resumo didático do capítulo I: D. João V ocupa-se da montagem de uma basílica de São Pedro em miniatura. A cena aproxima a figura régia de uma construção que cabe sobre uma mesa. Lê o episódio na edição da turma, procurando gestos, intervenientes e marcas de escala.<\/p><p>O <a href=\"https://www.portoeditora.pt/conteudos/recursos/manuais/EXP12_CAE12.pdf#page=22\" target=\"_blank\" rel=\"noopener\">quadro de sequências de <i>Expressões<\/i>, Porto Editora, p. 22<\/a> confirma a localização na abertura. A análise de Júlia Cristina Figueiredo, <a href=\"https://estudossaramaguianos.com/wp-content/uploads/2020/03/rev-de-estudos-saramaguianos-2-jc3balia-cristina-figueiredo.pdf#page=9\" target=\"_blank\" rel=\"noopener\">«História e ficção na figuração de personagens de <i>Memorial do convento<\/i>», <i>Revista de Estudos Saramaguianos<\/i>, n.º 2, julho de 2015, p. 33<\/a>, fundamenta a relação entre objeto e sátira.<\/p><p>Este resumo não é uma citação do romance. A leitura integral do capítulo faz-se na edição da turma; as atividades essenciais partem das informações apresentadas aqui.<\/p>"},{"t":"escolha","p":"Que pergunta transforma o objeto num indício de caracterização?","o":["Como liga a escala reduzida à grandeza encenada?","Como prova a montagem a eficácia do governo?","Como confirma a réplica a devoção da pessoa real?"],"c":0,"f":"Relacionar a escala reduzida com a grandeza encenada permite interpretar a caracterização. Confundir o gesto com prova de eficácia ou devoção atribui-lhe uma conclusão que o objeto não demonstra. Relê o cartão «O episódio e as fontes» e confronta a pista com a tua resposta.","g":"m9-f14-4"},{"t":"vf","p":"Montar uma miniatura é, por si só, prova de incapacidade para governar.","v":false,"f":"A atividade isolada não prova incapacidade. O efeito satírico depende da apresentação narrativa e do contraste com outras ações, relações e pretensões. Relê o cartão «O episódio e as fontes» e confronta a pista com a tua resposta.","g":"m9-f14-5"},{"t":"emparelhar","p":"Liga cada plano à operação de leitura correspondente.","pares":[["Objeto sobre a mesa","Descrever um pormenor material"],["Figura de quem governa","Relacionar gesto e posição"],["Contraste entre escalas","Investigar um efeito satírico"]],"f":"O percurso vai do pormenor à relação. Saltar diretamente para uma etiqueta sobre o rei dispensaria a prova que torna a interpretação discutível e verificável. Relê o cartão «O episódio e as fontes» e confronta a pista com a tua resposta.","g":"m9-f14-6"},{"t":"ler","titulo":"Comparar sem igualar","rot":"Lê e confronta","html":"<p>A miniatura e a construção monumental podem ser aproximadas como projetos associados à vontade régia. Mas não têm os mesmos materiais, riscos, custos humanos ou condições de execução.<\/p><p>Modelo: a escala reduzida permite interrogar a grandeza encenada. O confronto com a obra real obriga depois a perguntar quem trabalha e quem recebe a visibilidade. Esta comparação precisa de conservar as diferenças.<\/p><p><strong>Modelo completo.<\/strong> A montagem da miniatura associa um gesto material à figura régia. A mudança de escala pode diminuir a grandeza encenada. O objeto isolado não comprova incapacidade de governo.<\/p>"},{"t":"completar","p":"Completa a passagem do pormenor à interpretação.","frase":"O objeto pode contribuir para a caracterização [1]; a comparação com a obra monumental exige reconhecer [2].","lacunas":[{"o":["indireta","expressa","absoluta"],"c":0},{"o":["diferenças","identidades","proporções"],"c":0}],"f":"A caracterização indireta usa ações e relações. Comparar não significa apagar aquilo que distingue as duas construções. Relê o cartão «Comparar sem igualar» e confronta a pista com a tua resposta.","g":"m9-f14-8"},{"t":"ordenar","p":"Ordena a construção de uma hipótese sobre a cena.","passos":["Identificar o objeto e a ação","Observar a escala e a posição da personagem","Propor o efeito do contraste","Confirmar a hipótese noutros pormenores do capítulo"],"f":"A hipótese surge depois da observação e continua sujeita a confirmação. Não basta chamar vaidoso ao rei sem explicar como a narrativa o apresenta. Relê o cartão «Comparar sem igualar» e confronta a pista com a tua resposta.","g":"m9-f14-9"},{"t":"sublinhar","p":"Que palavra distingue uma hipótese sobre o efeito da cena de uma conclusão automática sobre o rei?","frase":"O contraste pode diminuir a grandeza encenada.","certas":[2],"f":"Pode assinala uma hipótese interpretativa. A leitura deve demonstrá-la no contexto em vez de a tratar como uma tradução automática do objeto. Relê o cartão «Comparar sem igualar» e confronta a pista com a tua resposta.","g":"m9-f14-10"},{"t":"escolha","p":"Que comparação preserva uma diferença decisiva?","o":["A escala altera os riscos e as condições de trabalho.","A escala conserva os riscos e as condições de trabalho.","A escala basta para explicar as condições de trabalho."],"c":0,"f":"As duas construções podem ser relacionadas, mas a escala e as condições não são equivalentes. A diferença é parte da interpretação, não um obstáculo a ela. Relê o cartão «Comparar sem igualar» e confronta a pista com a tua resposta.","g":"m9-f14-11"},{"t":"vf","p":"Uma representação satírica de D. João V no romance equivale a um documento que comprova todos os gestos da pessoa histórica.","v":false,"f":"A personagem tem uma construção literária. Para comprovar acontecimentos históricos são necessárias fontes históricas e critérios próprios, além da leitura do romance. Relê o cartão «Comparar sem igualar» e confronta a pista com a tua resposta.","g":"m9-f14-12"},{"t":"ler","titulo":"Muda o enquadramento","rot":"Lê e confronta","html":"<p>Cenas didáticas criadas: A: uma pessoa monta uma miniatura para estudar uma estrutura. B: uma pessoa recebe louvores de todos por encaixar uma peça, enquanto outras trabalham sem reconhecimento.<\/p><p>O mesmo tipo de objeto participa em relações diferentes. O efeito não depende apenas da miniatura, mas do enquadramento, dos gestos e da distribuição de reconhecimento.<\/p><p>Contraexemplo ao juízo de que montar miniaturas prova incapacidade: a cena criada de estudo de uma estrutura atribui outra função à montagem. Critério: o efeito depende do enquadramento e das relações, não apenas do objeto.<\/p><details class=\"apoio\"><summary>Uma pista, se precisares<\/summary><p>Compara quem executa o trabalho e quem recebe os louvores. A crítica nasce da miniatura ou da distribuição do reconhecimento?<\/p><p>Consultar esta ajuda não altera o teu progresso.<\/p><\/details>"},{"t":"emparelhar","p":"Relaciona cada cena criada com a pergunta que lhe é mais próxima.","pares":[["Montagem para estudar uma estrutura","Que conhecimento se procura?"],["Louvores por um gesto mínimo","Que grandeza se encena?"],["Trabalho sem reconhecimento","Quem fica fora da visibilidade?"]],"f":"As perguntas nascem das relações apresentadas. Não atribuímos a mesma interpretação a todos os usos de um objeto. Relê o cartão «Muda o enquadramento» e confronta a pista com a tua resposta.","g":"m9-f14-14"},{"t":"escolha","p":"Que alteração tornaria a cena B menos crítica?","o":["Reconhecer o contributo das pessoas que fazem a obra.","Aumentar o tamanho da peça que recebe os louvores.","Transferir os louvores para quem escolheu a miniatura."],"c":0,"f":"Reconhecer quem faz a obra altera a desigualdade do reconhecimento. Confundir dimensão do objeto ou escolha da peça com contributo para a construção deixa essa desigualdade por explicar. Relê o cartão «Muda o enquadramento» e confronta a pista com a tua resposta.","g":"m9-f14-15"},{"t":"completar","p":"Completa uma distinção necessária.","frase":"A sátira analisa uma representação [1]; a comprovação de um facto histórico exige outra [2].","lacunas":[{"o":["literária","documental","biográfica"],"c":0},{"o":["fonte","escala","forma"],"c":0}],"f":"Não se nega a relação do romance com a história. Distinguem-se a interpretação de uma obra e a comprovação documental de um acontecimento. Relê o cartão «Muda o enquadramento» e confronta a pista com a tua resposta.","g":"m9-f14-16"},{"t":"ordenar","p":"Ordena uma interpretação da miniatura que preserve o limite da comparação.","passos":["O gesto de montagem torna o poder observável","A escala reduzida contrasta com a grandeza régia","A comparação abre uma hipótese satírica","As diferenças de risco e de trabalho limitam a analogia"],"f":"A sequência liga os pormenores à interpretação e conserva o seu limite. Relê o modelo e o contraexemplo: Compara quem executa o trabalho e quem recebe os louvores. A crítica nasce da miniatura ou da distribuição do reconhecimento? Relê o cartão «Muda o enquadramento» e confronta a pista com a tua resposta.","g":"m9-f14-17"},{"t":"escolha","p":"Que proposta criativa transfere o procedimento sem copiar o episódio?","o":["Mostrar a autoridade através do uso de um objeto.","Apresentar o objeto como símbolo de sentido fixo.","Trocar o objeto por uma descrição direta do poder."],"c":0,"f":"A primeira proposta testa a caracterização indireta. O objeto torna-se significativo através de ações e relações observáveis. Relê o cartão «Muda o enquadramento» e confronta a pista com a tua resposta.","g":"m9-f14-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">Que revela um rei quando monta uma basílica sobre a mesa?<\/p><p>Responde oralmente com uma passagem que sustente a tua leitura e outra que a limite. Explica o critério que te permite distingui-las. Podes manter a leitura inicial, se mostrares por que razão resiste ao confronto.<\/p>"}];
