<div class="casca-menu" data-c-painel hidden><div class="c-menu-in" role="dialog" aria-label="Menu"><div class="c-menu-cab"><p>Módulo 9<br>Unidade 1</p><button type="button" class="c-ic" data-c-fecha-menu aria-label="Fechar o menu">✕</button></div><nav aria-label="Navegação da lição"><a href="../#m9-f14">Esta lição no percurso</a><a href="../licao-m9-f01/">Lição anterior</a><a href="../licao-m9-f15/">Continuar o percurso</a></nav><p class="c-menu-extra">As citações têm crédito junto ao texto. Os exemplos criados estão identificados. O progresso fica neste aparelho.</p></div></div>

window.addEventListener('DOMContentLoaded',function(){"use strict";
var K="licao-m9-f14",CARTOES=[{"t":"ler","titulo":"Um rei em miniatura","rot":"Abre","html":"<p class=\"abre\">Um objeto pequeno pode revelar uma ideia enorme de poder. Como passa o narrador de uma miniatura para a caracterização de quem a monta?<\/p><p>Vais separar o pormenor observado, a interpretação e o limite da comparação.<\/p>"},{"t":"ler","titulo":"O essencial","rot":"O essencial","html":"<p>Em <i>Memorial do Convento<\/i>, José Saramago constrói uma representação ficcional do reinado de D. João V. Um romance histórico não é uma transcrição neutra do passado.<\/p><p>A <strong>caracterização indireta<\/strong> faz-se através de ações, objetos e relações. A <strong>sátira<\/strong> pode expor uma pretensão ao aproximar grandeza e pequenez. O objeto não tem um significado fixo fora do contexto.<\/p>"},{"t":"ler","titulo":"O episódio e as fontes","rot":"Lê e confronta","html":"<p>Resumo didático do capítulo I: D. João V ocupa-se da montagem de uma basílica de São Pedro em miniatura. A cena aproxima a figura régia de uma construção que cabe sobre uma mesa. Lê o episódio na edição da turma, procurando gestos, intervenientes e marcas de escala.<\/p><p>O <a href=\"https://www.portoeditora.pt/conteudos/recursos/manuais/EXP12_CAE12.pdf#page=22\" target=\"_blank\" rel=\"noopener\">quadro de sequências de <i>Expressões<\/i>, Porto Editora, p. 22<\/a> confirma a localização na abertura. A análise de Júlia Cristina Figueiredo, <a href=\"https://estudossaramaguianos.com/wp-content/uploads/2020/03/rev-de-estudos-saramaguianos-2-jc3balia-cristina-figueiredo.pdf#page=9\" target=\"_blank\" rel=\"noopener\">«História e ficção na figuração de personagens de <i>Memorial do convento<\/i>», <i>Revista de Estudos Saramaguianos<\/i>, n.º 2, julho de 2015, p. 33<\/a>, fundamenta a relação entre objeto e sátira.<\/p><p>Este resumo não é uma citação do romance. A leitura integral do capítulo faz-se na edição da turma; as atividades essenciais partem das informações apresentadas aqui.<\/p>"},{"t":"escolha","p":"Que pergunta transforma o objeto num indício de caracterização?","o":["Como liga o gesto de montar à figura do rei?","Quanto custa comprar uma miniatura semelhante?","Que medidas tinha a mesa usada nesta montagem?"],"c":0,"f":"A primeira pergunta relaciona ação e personagem. Preço e medidas só seriam relevantes se o texto lhes atribuísse uma função demonstrável.","g":"m9-f14-3"},{"t":"vf","p":"Montar uma miniatura é, por si só, prova de incapacidade para governar.","v":false,"f":"A atividade isolada não prova incapacidade. O efeito satírico depende da apresentação narrativa e do contraste com outras ações, relações e pretensões.","g":"m9-f14-4"},{"t":"emparelhar","p":"Liga cada plano à operação de leitura correspondente.","pares":[["Objeto sobre a mesa","Descrever um pormenor material"],["Figura de quem governa","Relacionar gesto e posição"],["Contraste entre escalas","Investigar um efeito satírico"]],"f":"O percurso vai do pormenor à relação. Saltar diretamente para uma etiqueta sobre o rei dispensaria a prova que torna a interpretação discutível e verificável.","g":"m9-f14-5"},{"t":"ler","titulo":"Comparar sem igualar","rot":"Lê e confronta","html":"<p>A miniatura e a construção monumental podem ser aproximadas como projetos associados à vontade régia. Mas não têm os mesmos materiais, riscos, custos humanos ou condições de execução.<\/p><p>Modelo: a escala reduzida permite interrogar a grandeza encenada. O confronto com a obra real obriga depois a perguntar quem trabalha e quem recebe a visibilidade. Esta comparação precisa de conservar as diferenças.<\/p>"},{"t":"completar","p":"Completa a passagem do pormenor à interpretação.","frase":"O objeto pode contribuir para a caracterização [1]; a comparação com a obra monumental exige reconhecer [2].","lacunas":[{"o":["indireta","expressa","absoluta"],"c":0},{"o":["diferenças","identidades","proporções"],"c":0}],"f":"A caracterização indireta usa ações e relações. Comparar não significa apagar aquilo que distingue as duas construções.","g":"m9-f14-7"},{"t":"ordenar","p":"Ordena a construção de uma hipótese sobre a cena.","passos":["Identificar o objeto e a ação","Observar a escala e a posição da personagem","Propor o efeito do contraste","Confirmar a hipótese noutros pormenores do capítulo"],"f":"A hipótese surge depois da observação e continua sujeita a confirmação. Não basta chamar vaidoso ao rei sem explicar como a narrativa o apresenta.","g":"m9-f14-8"},{"t":"sublinhar","p":"Seleciona a palavra que limita esta inferência didática criada.","frase":"O contraste pode diminuir a grandeza encenada.","certas":[2],"f":"Pode assinala uma hipótese interpretativa. A leitura deve demonstrá-la no contexto em vez de a tratar como uma tradução automática do objeto.","g":"m9-f14-9"},{"t":"escolha","p":"Que comparação preserva uma diferença decisiva?","o":["A miniatura tem uma escala distinta do trabalho monumental.","A miniatura torna dispensável conhecer o trabalho monumental.","A miniatura demonstra um risco idêntico ao trabalho monumental."],"c":0,"f":"As duas construções podem ser relacionadas, mas a escala e as condições não são equivalentes. A diferença é parte da interpretação, não um obstáculo a ela.","g":"m9-f14-10"},{"t":"vf","p":"Uma representação satírica de D. João V no romance equivale a um documento que comprova todos os gestos da pessoa histórica.","v":false,"f":"A personagem tem uma construção literária. Para comprovar acontecimentos históricos são necessárias fontes históricas e critérios próprios, além da leitura do romance.","g":"m9-f14-11"},{"t":"ler","titulo":"Muda o enquadramento","rot":"Lê e confronta","html":"<p>Cenas didáticas criadas: A: uma pessoa monta uma miniatura para estudar uma estrutura. B: uma pessoa recebe louvores de todos por encaixar uma peça, enquanto outras trabalham sem reconhecimento.<\/p><p>O mesmo tipo de objeto participa em relações diferentes. O efeito não depende apenas da miniatura, mas do enquadramento, dos gestos e da distribuição de reconhecimento.<\/p>"},{"t":"emparelhar","p":"Relaciona cada cena criada com a pergunta que lhe é mais próxima.","pares":[["Montagem para estudar uma estrutura","Que conhecimento se procura?"],["Louvores por um gesto mínimo","Que grandeza se encena?"],["Trabalho sem reconhecimento","Quem fica fora da visibilidade?"]],"f":"As perguntas nascem das relações apresentadas. Não atribuímos a mesma interpretação a todos os usos de um objeto.","g":"m9-f14-13"},{"t":"escolha","p":"Que alteração tornaria a cena B menos crítica?","o":["Reconhecer o contributo de todas as pessoas na construção.","Multiplicar os elogios à pessoa que apenas encaixou uma peça.","Ocultar ainda mais o trabalho de quem sustenta a construção."],"c":0,"f":"Reconhecer os contributos altera a desigualdade que sustenta a crítica. As outras mudanças intensificariam o contraste.","g":"m9-f14-14"},{"t":"completar","p":"Completa uma distinção necessária.","frase":"A sátira analisa uma representação [1]; a comprovação de um facto histórico exige outra [2].","lacunas":[{"o":["literária","documental","biográfica"],"c":0},{"o":["fonte","escala","forma"],"c":0}],"f":"Não se nega a relação do romance com a história. Distinguem-se a interpretação de uma obra e a comprovação documental de um acontecimento.","g":"m9-f14-15"},{"t":"ordenar","p":"Prepara uma comparação entre o capítulo I e a construção de Mafra.","passos":["Escolher um pormenor de cada passagem","Identificar quem age e quem recebe reconhecimento","Explicar uma aproximação e uma diferença","Concluir sobre o efeito da representação do poder"],"f":"O confronto não deve reduzir o trabalho monumental a uma metáfora sem pessoas. Quem executa e quem aparece são perguntas centrais.","g":"m9-f14-16"},{"t":"escolha","p":"Que proposta criativa transfere o procedimento sem copiar o episódio?","o":["Representar uma autoridade pelo modo como usa um objeto.","Escrever um insulto à autoridade sem construir qualquer cena.","Descrever um objeto isolado sem o ligar a ações ou relações."],"c":0,"f":"A primeira proposta testa a caracterização indireta. O objeto torna-se significativo através de ações e relações observáveis.","g":"m9-f14-17"},{"t":"vf","p":"Se a mesma miniatura fosse usada noutro contexto, o seu efeito de caracterização poderia mudar.","v":true,"f":"O sentido de um objeto depende das relações em que aparece. Os exemplos de estudo e de louvor desproporcionado mostram como a mesma atividade pode construir efeitos diferentes.","g":"m9-f14-18"},{"t":"ler","titulo":"Para levar","rot":"Para levar","html":"<p class=\"levar\">A escala de um objeto pode pôr em causa a escala de uma pretensão.<\/p><p>Explica uma hipótese sobre a miniatura e uma diferença que deves preservar quando a comparas com a construção de Mafra. Confirma os pormenores no capítulo I da edição da turma.<\/p>"}];
