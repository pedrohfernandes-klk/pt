*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--tinta);font:16px/1.5 var(--sans)}
a{color:inherit}img,svg{max-width:100%}
.pg{width:100%;max-width:calc(var(--col) + 32px);margin:0 auto;padding:0 16px 64px}
.pg-larga{width:100%;max-width:1200px;margin-left:auto;margin-right:auto}
.ler,.pg .ler p,.p-cartao p{font-family:var(--serif);font-size:1.02rem;line-height:1.55}
.p-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}

.p-cab{padding:14px 0 4px;margin:0 0 var(--d2)}

.p-etiqueta a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;margin:-15px 0}.p-etiqueta a:hover{color:var(--tinta);text-decoration:underline}
.p-cab h1{font:400 2.3rem/.95 var(--cartaz);letter-spacing:.02em;text-transform:none;margin:0;padding:0}.p-cab h1::after{display:none}
.p-sub{font:italic 1.15rem/1.3 var(--serif);margin:.35rem 0 0}
.p-lead{font-size:.95rem;line-height:1.45;margin:.6rem 0 0;max-width:36em}
.p-cartao{position:relative;background:var(--papel);color:var(--tinta);border:0;padding:14px 16px;margin:0 0 var(--d1)}
.p-rot{font:700 .7rem/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d1)}
.p-tit{font:700 1.05rem/1.25 var(--sans);margin:0 0 2px}

.p-cartao a{color:var(--tinta);font-weight:700}
.p-feito{box-shadow:inset 4px 0 0 var(--mostarda)}
.p-atual{box-shadow:inset 4px 0 0 var(--vermelho)}
.c-prim,.c-sec{font:700 1rem/1.2 Arial;min-height:48px;margin:0;cursor:pointer;border-radius:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;box-sizing:border-box}
.c-prim{background:var(--tinta,#000);color:var(--papel,#fff);border:0;padding:0 22px}
.c-prim:disabled{background:var(--c-cinza);color:var(--suave,#444);cursor:default}
.c-sec{background:none;color:var(--tinta,#000);border:0;padding:0 6px;font-weight:400;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.c-sec.c-seta{text-decoration:none;font-size:1.25rem;min-width:44px;padding:0}
.c-prim[data-seguinte]::after,.c-prim[data-confirmar]::after,.c-prim.c-vai::after{content:"→"}
.simbolo{display:inline-block;vertical-align:middle}.simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.calcada{display:block;width:100%;height:14px}.calcada *{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.simbolo[data-ico]{transform-origin:50% 60%}.simbolo[data-gesto]{cursor:pointer}.simbolo.gesto-pisca{animation:gPisca 1s ease-in-out 1}.simbolo.gesto-nada{animation:gNada 1s ease-in-out 1}.simbolo.gesto-balanca{animation:gBalanca 1s ease-in-out 1}.simbolo.gesto-ri{animation:gRi .8s ease-in-out 1}.simbolo.gesto-abana{animation:gAbana .7s ease-in-out 1}.simbolo.gesto-voa{animation:gVoa 1s ease-in-out 1}.simbolo.gesto-vibra{animation:gVibra .6s linear 1}.simbolo.gesto-gira{animation:gGira 1s ease-in-out 1}.simbolo.gesto-canta{animation:gCanta .9s ease-in-out 1}.simbolo.gesto-mergulha{animation:gMergulha 1s ease-in-out 1}.simbolo.gesto-brilha{animation:gBrilha 1s ease-in-out 1}.simbolo.gesto-sino{animation:gSino 1s ease-in-out 1}.simbolo.gesto-tecla{animation:gTecla .6s steps(3) 1}.simbolo.gesto-escreve{animation:gEscreve 1s ease-in-out 1}
@keyframes gPisca{0%,100%{transform:scaleY(1)}45%{transform:scaleY(1)}50%{transform:scaleY(.12)}56%{transform:scaleY(1)}}@keyframes gNada{0%,100%{transform:translateX(0) skewX(0)}30%{transform:translateX(6px) skewX(-6deg)}70%{transform:translateX(-6px) skewX(6deg)}}@keyframes gBalanca{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}70%{transform:rotate(7deg)}}@keyframes gRi{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(-4deg)}}@keyframes gAbana{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-5deg)}}@keyframes gVoa{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-10px) scale(1.08)}}@keyframes gVibra{0%,100%{transform:translateX(0)}20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}@keyframes gGira{to{transform:rotate(360deg)}}@keyframes gCanta{0%,100%{transform:rotate(0)}40%{transform:rotate(-10deg) translateY(-3px)}}@keyframes gMergulha{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(8px) rotate(12deg)}}@keyframes gBrilha{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.6}}@keyframes gSino{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}@keyframes gTecla{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}@keyframes gEscreve{0%,100%{transform:rotate(0) translate(0,0)}50%{transform:rotate(-8deg) translate(-4px,4px)}}
@media (prefers-reduced-motion:reduce){.simbolo[data-ico]{animation:none!important}}
main.pg{padding-top:6px}
main.pg>h1{font:400 2.3rem/.95 var(--cartaz);letter-spacing:.02em;margin:14px 0 6px}
main.pg>h1+p{font:italic 1.05rem/1.4 var(--serif);margin:0 0 var(--d2)}
main.pg>h1+p a{display:inline-flex;align-items:center;min-height:44px;margin:-12px 0}
h2{font:400 1.45rem/1 var(--cartaz);letter-spacing:.03em;margin:var(--d3) 0 var(--d1);padding:0 0 6px;border-bottom:1px solid var(--tinta)}
p{margin:0 0 8px}ul{list-style:none;margin:0;padding:0}
ul li{margin:0;box-shadow:0 1px 0 var(--c-cinza)}
ul li a{display:block;padding:12px 4px;min-height:44px;color:var(--tinta);text-decoration:none;font-size:1.02rem;line-height:1.3}
ul li a small{display:block;font-size:.82rem;color:var(--suave);margin-top:2px}
ul li a:hover>:first-child,ul li a:hover{text-decoration-thickness:1px}
ul li.grupo{font:700 .7rem/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--suave);box-shadow:none;padding:var(--d2) 4px 2px}ul li.grupo:first-child{padding-top:4px}
ul.grande li{box-shadow:none}ul.grande a{font:400 1.6rem/1.05 var(--cartaz);letter-spacing:.02em}ul.grande a small{font:400 .82rem/1.3 var(--sans);letter-spacing:0}
.ligacoes{font-size:.92rem;margin:0 0 6px}.ligacoes a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px 0 0}
.nw{white-space:nowrap}
/* a página do ano e a página inicial: os módulos primeiro e sempre o maior elemento; os extras em texto por baixo */
h2.sec-t{font:700 .72rem/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:var(--d3) 0 var(--d1);padding:0;border:0}
.mods{display:grid;gap:var(--d1)}
.mod{padding:0;margin:0}
.mod>a.mod-a{display:grid;grid-template-columns:64px 1fr;gap:4px 14px;align-items:start;padding:16px 16px 14px;color:var(--tinta);text-decoration:none}
.mod .mod-sim{width:64px;height:64px;border:1.5px solid var(--tinta);border-radius:50%;display:flex;align-items:center;justify-content:center;grid-row:span 4}
.mod .mod-sim .simbolo{width:40px;height:40px}
.mod .mod-n{font:400 1.9rem/.9 var(--cartaz);letter-spacing:.02em}
.mod .mod-nome{font:700 1.08rem/1.25 var(--sans)}
.mod .mod-q{font:italic .98rem/1.35 var(--serif);color:var(--suave)}
.mod .mod-prog{display:flex;align-items:center;gap:10px;margin-top:6px;font:700 .72rem/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.mod .mod-barra{flex:1;max-width:180px;height:4px;background:var(--fundo);position:relative}.mod .mod-barra i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--tinta)}
.mod.p-feito .mod-barra i{background:var(--mostarda)}.mod.p-feito .mod-sim{border-color:var(--mostarda);box-shadow:inset 0 0 0 3px var(--mostarda)}
.cont{display:flex;align-items:center;gap:12px;min-height:48px;margin:0 16px 0 94px;padding:8px 0 10px;box-shadow:inset 0 1px 0 var(--fundo);color:var(--tinta);text-decoration:none}
.cont .cont-t{flex:1;display:flex;flex-direction:column;gap:1px}.cont b{font:700 .95rem/1.25 var(--sans)}.cont small{font:400 .8rem/1.2 var(--sans);color:var(--suave)}
.cont:hover b{text-decoration:underline;text-underline-offset:3px}
.extras-l{margin:var(--d3) 0 0}
.extras-l p{margin:0 0 var(--d1);font-size:.95rem}
.extras-l .p-rot{display:block;margin:0}
.extras-l .ls{display:flex;flex-wrap:wrap;gap:0 20px}
.extras-l a{display:inline-flex;align-items:center;min-height:44px;color:var(--tinta)}
.hoje:empty{display:none}

/* o portal (15/10/2026): três portas grandes, uma por sítio */
.portal{display:grid;gap:var(--d1);margin:var(--d2) 0 0}
.porta-p{display:grid;grid-template-columns:56px minmax(0,1fr);gap:2px 16px;align-items:start;padding:18px 18px 16px;color:var(--tinta);text-decoration:none;min-height:120px;min-width:0}.porta-p>span{min-width:0;overflow-wrap:anywhere}@media (max-width:420px){.porta-p .porta-n{font-size:1.55rem}}
.porta-p .porta-sim{grid-row:span 3;width:56px;height:56px;border:1.5px solid var(--tinta);border-radius:50%;display:flex;align-items:center;justify-content:center}.porta-p .porta-sim .simbolo{width:34px;height:34px}

.porta-p:hover .porta-n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}

.raiz{max-width:1112px}.portal-pg{max-width:1112px}
.anos-g{display:grid;gap:var(--d1)}

.ano-c ul li{box-shadow:none}

.extras-g{display:grid;grid-template-columns:1fr 1fr;gap:var(--d1)}

.ext .ext-sim{width:40px;height:40px;display:block;margin:0 0 4px}.ext .ext-sim .simbolo{width:40px;height:40px}

.ext.p-feito .ext-prog{color:var(--tinta)}
.mais-l{margin:var(--d3) 0 0;font-size:.95rem}.mais-l .p-rot{display:block;margin:0}.mais-l .ls{display:flex;flex-wrap:wrap;gap:0 20px}.mais-l a{display:inline-flex;align-items:center;min-height:44px}
